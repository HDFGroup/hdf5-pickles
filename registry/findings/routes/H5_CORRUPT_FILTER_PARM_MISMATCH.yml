# Message routing for H5_CORRUPT_FILTER_PARM_MISMATCH.
# Authoritative source; the loader expands each matches list and applies
# longest-substring-first precedence.
#
# One code, four invariants, one record family.  Unlike the role-split shards
# (H5_CORRUPT_FILTER_NELMTS_MISMATCH, H5_CORRUPT_RAW_DATA_OVERLAPS_METADATA),
# nothing here is shared across families -- every route is
# dataset_layout_filter_fill.  What the message selects is WHICH derived
# parameter disagreed with WHICH sibling message, and they are separate
# invariants because they are separately closable: the byte-order rule holds for
# both parameterised filters, the precision and bit-offset rules are n-bit only,
# and the fill-availability rule is scale-offset only and is the one with an
# asymmetry (see the comment in h5policy_finalize_ohdr_dataset).
schema_version: 1
finding: H5_CORRUPT_FILTER_PARM_MISMATCH

routes:
  - record: dataset_layout_filter_fill
    invariant: layout.filter_byte_order
    matches:
      - "n-bit/scale-offset filter byte order does not match the datatype message"
  - record: dataset_layout_filter_fill
    invariant: layout.filter_precision
    scope: aggregate_object
    evidence: fixture
    matches:
      - "n-bit filter precision does not match the datatype message"
  - record: dataset_layout_filter_fill
    invariant: layout.filter_bit_offset
    scope: aggregate_object
    evidence: fixture
    matches:
      - "n-bit filter bit offset does not match the datatype message"
  - record: dataset_layout_filter_fill
    invariant: layout.filter_fill_availability
    scope: aggregate_object
    evidence: fixture
    matches:
      # Two statements, one invariant: the word is out of its two-member
      # enumeration, or it is in range and contradicts an explicit fill value.
      # Both are "the availability word does not describe this object header".
      - "scale-offset filter fill-value availability is not a defined value"
      - "scale-offset filter reports no fill value but the object header defines one"
