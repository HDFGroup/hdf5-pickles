# Message routing for H5_CORRUPT_RAW_DATA_OVERLAPS_METADATA.
# Authoritative source; the loader expands each matches list and applies
# longest-substring-first precedence.
#
# One shared check (h5policy_data_extent_disjoint, h5_walk.pk) serves every
# layout that declares a raw-data extent by ADDRESS, and those layouts live in
# different record families while the invariant is identical.  The role in the
# message is what selects the family -- the same role-split shape
# H5_CORRUPT_FILTER_NELMTS_MISMATCH uses.
#
# Each role appears TWICE because the check runs in both directions: "overlaps
# file metadata" when a data extent is validated against metadata already
# recorded, and "is overlapped by file metadata read later" when metadata is
# recorded and collides with a data extent seen earlier.  The graph walk can
# reach either side first, so both phrasings are reachable for both roles.
# Both lead with the role so each message is `what + suffix`, which is the form
# tools/message_routing.py can analyse.
schema_version: 1
finding: H5_CORRUPT_RAW_DATA_OVERLAPS_METADATA

routes:
  - record: chunk_index
    invariant: chunk.data_disjoint_from_metadata
    matches:
      - "chunk data extent overlaps file metadata"
      - "chunk data extent is overlapped by file metadata read later"
  - record: dataset_layout_filter_fill
    invariant: layout.contiguous_data_disjoint_from_metadata
    scope: reference_graph
    evidence: curated
    matches:
      - "contiguous data extent overlaps file metadata"
      - "contiguous data extent is overlapped by file metadata read later"
