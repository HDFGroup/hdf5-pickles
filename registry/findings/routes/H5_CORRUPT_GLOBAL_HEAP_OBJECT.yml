# Message routing for H5_CORRUPT_GLOBAL_HEAP_OBJECT.
# Authoritative source; the loader expands each matches list and applies
# longest-substring-first precedence.
schema_version: 1
finding: H5_CORRUPT_GLOBAL_HEAP_OBJECT

routes:
  # One bounded collection walker (h5policy_find_gheap_object) serves both
  # metadata clients that can hold a global-heap ID, so the role prefix in the
  # message is what names the family.  `record` selects the exact-build canary
  # and the two differ: a VDS source open versus an attribute read.
  - record: virtual_dataset
    invariant: vds.global_heap_object
    scope: reference_graph
    evidence: fixture
    matches:
      - "VDS global heap object header is invalid"
      - "VDS global heap object overruns the collection"
      - "VDS global heap object declares more bytes than the collection holds"
      - "VDS global heap free-space object overruns the collection"
      - "VDS global heap free-space object length is not 8-aligned"
      - "VDS global heap has a trailing free-space region after an explicit free-space object"
  - record: message_envelope
    invariant: attribute.global_heap_object
    scope: reference_graph
    evidence: curated
    matches:
      - "attribute global heap object header is invalid"
      - "attribute global heap object overruns the collection"
      - "attribute global heap object declares more bytes than the collection holds"
      - "attribute global heap free-space object overruns the collection"
      - "attribute global heap free-space object length is not 8-aligned"
      - "attribute global heap has a trailing free-space region after an explicit free-space object"
