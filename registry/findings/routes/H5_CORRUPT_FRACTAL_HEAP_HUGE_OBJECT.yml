# Message routing for H5_CORRUPT_FRACTAL_HEAP_HUGE_OBJECT.
# Authoritative source; the loader expands each matches list and applies
# longest-substring-first precedence.
#
# The huge-object index belongs to the fractal HEAP, not to the client that
# owns it, so one walker serves every client whose heap can hold an object
# above max_man_size.  Only the dense LINK client walks it today; the role
# prefix (h5policy_frhp_huge_role) is what will keep a dense-attribute or SOHM
# occurrence in its own family when one is added.
schema_version: 1
finding: H5_CORRUPT_FRACTAL_HEAP_HUGE_OBJECT

routes:
  - record: dense_index
    invariant: dense.huge_object_locator
    scope: record_local
    evidence: curated
    matches:
      - "dense link huge object has an undefined address"
      - "dense link huge object has a zero length"
      - "dense link huge object is not larger than the heap's maximum managed size"
      - "dense link heap counts huge objects but names no huge-object index"
