# Message routing for H5_CORRUPT_HEAP_OBJECT_MISSING.
# Authoritative source; the loader expands each matches list and applies
# longest-substring-first precedence.
schema_version: 1
finding: H5_CORRUPT_HEAP_OBJECT_MISSING

routes:
  # One bounded collection walker (h5policy_find_gheap_object) serves both
  # metadata clients that can hold a global-heap ID, so the role prefix in the
  # message is what names the family.  `record` selects the exact-build canary
  # and the two differ: a VDS source open versus an attribute read.
  - record: virtual_dataset
    invariant: vds.heap_object_present
    scope: reference_graph
    evidence: fixture
    matches:
      - "VDS reference names a missing global heap object"
  - record: message_envelope
    invariant: attribute.heap_object_present
    scope: reference_graph
    evidence: fixture
    matches:
      - "attribute reference names a missing global heap object"
