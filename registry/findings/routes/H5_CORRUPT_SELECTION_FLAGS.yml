# Message routing for H5_CORRUPT_SELECTION_FLAGS.
# Authoritative source; the loader expands each matches list and applies
# longest-substring-first precedence.
schema_version: 1
finding: H5_CORRUPT_SELECTION_FLAGS

routes:
  # One serialized-selection sizer (h5policy_selection_size) serves both clients
  # that can hold an H5S selection in METADATA: a VDS layout message's mapping
  # block and the tail of a region reference's global-heap blob.  The role prefix
  # in the message names the family, and `record` selects the exact-build canary
  # -- the two differ, a VDS source open versus an attribute dereference.
  - record: virtual_dataset
    invariant: vds.selection_flags
    scope: local_decode
    evidence: fixture
    matches:
      - "VDS serialized selection sets unknown flag bits"
  - record: message_envelope
    invariant: attribute.selection_flags
    scope: local_decode
    evidence: curated
    matches:
      - "attribute serialized selection sets unknown flag bits"
