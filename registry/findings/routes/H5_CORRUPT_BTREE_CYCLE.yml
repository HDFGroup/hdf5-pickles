# Message routing for H5_CORRUPT_BTREE_CYCLE.
# Authoritative source; the loader expands each matches list and applies
# longest-substring-first precedence.
schema_version: 1
finding: H5_CORRUPT_BTREE_CYCLE

routes:
  # The loader orders matches LONGEST FIRST -- substring matching, first hit
  # wins.  One rule serves both version-1 B-tree roles, exactly as
  # H5_CORRUPT_BTREE_NODE_LEVEL does; the family comes from the message because
  # `record` selects the exact-build canary.
  - record: chunk_index
    invariant: chunk.btree_no_cycle
    scope: aggregate_object
    evidence: curated
    matches:
      - "chunk B-tree node address repeats within one tree"
  - record: btree_heap_index
    invariant: btree.no_cycle
    scope: aggregate_object
    evidence: curated
    matches:
      - "group B-tree node address repeats within one tree"
