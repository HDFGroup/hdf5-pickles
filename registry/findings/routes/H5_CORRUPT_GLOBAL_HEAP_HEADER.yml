# Message routing for H5_CORRUPT_GLOBAL_HEAP_HEADER.
# Authoritative source; the loader expands each matches list and applies
# longest-substring-first precedence.
schema_version: 1
finding: H5_CORRUPT_GLOBAL_HEAP_HEADER

routes:
  # One bounded collection walker (h5policy_find_gheap_object) serves both
  # metadata clients that can hold a global-heap ID, so the role prefix in the
  # message is what names the family.  `record` selects the exact-build canary
  # and the two differ: a VDS source open versus an attribute read.
  - record: virtual_dataset
    invariant: vds.global_heap_header
    scope: reference_graph
    evidence: fixture
    matches:
      - "VDS global heap version or reserved bytes are invalid"
      - "VDS global heap collection size is below the format minimum"
  - record: message_envelope
    invariant: attribute.global_heap_header
    scope: reference_graph
    evidence: curated
    matches:
      - "attribute global heap version or reserved bytes are invalid"
      - "attribute global heap collection size is below the format minimum"
