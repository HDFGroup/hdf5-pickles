# Message routing for H5_CORRUPT_RAW_DATA_OVERLAPS_DATA.
# Authoritative source; the loader expands each matches list and applies
# longest-substring-first precedence.
#
# Same shared check and same role-split as
# H5_CORRUPT_RAW_DATA_OVERLAPS_METADATA: one implementation serves every layout
# that names a raw-data extent by address, and those layouts live in different
# record families while the invariant is one.  Only ONE phrasing per role here,
# unlike the metadata sibling: both sides of a data/data collision are raw-data
# extents, so there is no second direction to name -- whichever extent is
# validated second reports it.
schema_version: 1
finding: H5_CORRUPT_RAW_DATA_OVERLAPS_DATA

routes:
  - record: chunk_index
    invariant: chunk.data_disjoint_from_data
    matches:
      - "chunk data extent overlaps another raw-data extent"
  - record: dataset_layout_filter_fill
    invariant: layout.contiguous_data_disjoint_from_data
    scope: reference_graph
    evidence: curated
    matches:
      - "contiguous data extent overlaps another raw-data extent"
