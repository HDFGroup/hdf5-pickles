# Message routing for H5_CORRUPT_FRACTAL_HEAP_DOUBLING_TABLE.
# Authoritative source; the loader expands each matches list and applies
# longest-substring-first precedence.
schema_version: 1
finding: H5_CORRUPT_FRACTAL_HEAP_DOUBLING_TABLE

routes:
  # The loader orders matches LONGEST FIRST -- substring matching, first hit wins.
  # One shared validator in h5_dense_links.pk checks the doubling table for all
  # three fractal-heap clients, because the record being checked is the heap
  # HEADER and its rules do not vary by client.  The family still has to be the
  # index that owns the reference, since `record` selects the exact-build
  # canary, so the caller-supplied role prefix is what routes -- the same split
  # H5_CORRUPT_FILTERED_HEAP_NO_DBLOCK_CHECKSUM uses, and the same three
  # families.
  - record: dense_index
    invariant: dense.fractal_doubling_table
    scope: record_local
    evidence: fixture
    matches:
      - "dense link heap doubling-table"
  - record: heap_structures
    invariant: heap.fractal_doubling_table
    scope: record_local
    evidence: fixture
    matches:
      - "dense attribute heap doubling-table"
  - record: shared_messages_legacy
    invariant: sohm.fractal_doubling_table
    scope: record_local
    evidence: fixture
    matches:
      - "SOHM heap doubling-table"
