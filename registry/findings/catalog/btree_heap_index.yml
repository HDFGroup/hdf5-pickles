# Finding catalog shard for the btree_heap_index record family.
# Authoritative source; routing for ambiguous codes lives in ../routes/.
schema_version: 1
record: btree_heap_index

findings:

  H5_CORRUPT_BTREE_NODE_LEVEL:
    severity: corrupt
    scope: aggregate_object
    invariant: btree.node_level
    record: btree_heap_index
    # Emitted from more than one walker; the mapping above is a
    # fallback, not an authoritative attribution.  Resolve with the
    # finding message via its route shard.
    ambiguous: true
    versions: [1]
    shared: false
    edge_type: btree_node
    emitted_in: [h5policy/pickles/h5_group.pk, h5policy/pickles/h5_chunkindex.pk]
    # The level decides whether a node is read as internal pointers or as
    # leaf records, so a forged level is node-type confusion rather than a
    # range error.  It is only checkable against the parent, hence
    # aggregate_object.
    message: v1 B-tree child node level is not one below its parent

  H5_CORRUPT_BTREE_CYCLE:
    severity: corrupt
    scope: aggregate_object
    invariant: btree.no_cycle
    record: btree_heap_index
    # Emitted from more than one walker; the mapping above is a
    # fallback, not an authoritative attribution.  Resolve with the
    # finding message via its route shard.
    ambiguous: true
    versions: [1]
    shared: false
    edge_type: btree_node
    emitted_in: [h5policy/pickles/h5_group.pk, h5policy/pickles/h5_chunkindex.pk]
    # A version-1 B-tree node has exactly one parent, so a second arrival at one
    # address is corruption rather than sharing.  It is the STRUCTURE that is
    # wrong, which no single node shows -- hence aggregate_object, the same
    # scope as the node-level rule this one backstops.
    #
    # The two rules are not redundant.  A cycle's back edge always breaks the
    # level relation, but only on the arrival that is never decoded: libhdf5
    # skips its own check because the target is already in the metadata cache
    # (src/H5Bcache.c:174-176 is a deserializer), and h5policy skips it because
    # the walk returns at the visited set.  The address rule is the one that
    # survives that.
    message: v1 B-tree node address repeats within one tree

  H5_CORRUPT_BTREE_NODE_ENTRY_COUNT:
    severity: corrupt
    scope: aggregate_object
    invariant: btree.entry_count
    record: btree_heap_index
    # Emitted from more than one walker; the mapping above is a
    # fallback, not an authoritative attribution.  Resolve with the
    # finding message via its route shard.
    ambiguous: true
    versions: [2]
    shared: false
    edge_type: btree_node
    emitted_in: [h5policy/pickles/h5_btree2.pk]
    message: B-tree node entry count is inconsistent with its bounds

  H5_CORRUPT_V2_BTREE_NODE_SIZE:
    severity: corrupt
    scope: aggregate_object
    invariant: btree.extent_bounds
    record: btree_heap_index
    # Emitted from more than one walker; the mapping above is a
    # fallback, not an authoritative attribution.  Resolve with the
    # finding message via its route shard.
    ambiguous: true
    # Same shared-engine problem as H5_CORRUPT_V2_BTREE_RECORD_SIZE: the
    # "cannot hold one record" message comes from the geometry check all five
    # roles call, the "contents exceed" ones from the shared node walker's
    # per-client spec.  Every current emission is matched here, so the
    # btree_heap_index fallback above is now only a guard against a new
    # unrouted message.
    versions: [2]
    shared: false
    edge_type: btree_node
    emitted_in:
      - h5policy/pickles/h5_btree2.pk
      - h5policy/pickles/h5_dense_links.pk
    message: B-tree node extent or size is invalid

  H5_RESOURCE_BTREE_DEPTH:
    severity: resource
    scope: resource
    invariant: btree.traversal_budget
    record: btree_heap_index
    # Emitted from more than one walker; the mapping above is a
    # fallback, not an authoritative attribution.  Resolve with the
    # finding message via its route shard.
    ambiguous: true
    versions: [2]
    shared: false
    edge_type: btree_node
    emitted_in: [h5policy/pickles/h5_btree2.pk]
    message: B-tree traversal depth exceeds the validation budget
