# Finding catalog shard for the chunk_index record family.
# Authoritative source; routing for ambiguous codes lives in ../routes/.
schema_version: 1
record: chunk_index

findings:

  H5_CORRUPT_CHUNK_INDEX_CHILD_ADDRESS:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.child_address
    record: chunk_index
    versions: [2]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_chunkindex.pk]
    message: chunk-index child address is undefined or out of bounds

  H5_CORRUPT_CHUNK_INDEX_CYCLE:
    severity: corrupt
    scope: reference_graph
    invariant: chunk.no_cycle
    record: chunk_index
    versions: [2]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_chunkindex.pk]
    message: chunk-index traversal contains a cycle

  H5_CORRUPT_V2_BTREE_RECORD_LAYOUT:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.record_layout
    record: chunk_index
    # Emitted from more than one walker; the mapping above is a
    # fallback, not an authoritative attribution.  Resolve with the
    # finding message via its route shard.
    ambiguous: true
    versions: [2]
    shared: true
    edge_type: btree_node
    emitted_in: [h5policy/pickles/h5_chunkindex.pk]
    message: V2 B-tree record layout is invalid

  H5_CORRUPT_V2_BTREE_RECORD_SIZE:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.record_size
    record: chunk_index
    # Emitted from more than one walker; the mapping above is a
    # fallback, not an authoritative attribution.  Resolve with the
    # finding message via its route shard.
    ambiguous: true
    # One shared engine (h5policy_validate_v2_btree_geometry) serves all five
    # v2 B-tree roles, so the role has to come from the message.  Until
    # 2026-07-22 the message was role-less and every occurrence resolved to
    # chunk_index -- corpus seed 64 is a type-5 dense LINK name index
    # (chunk indexes are types 10/11) that was catalogued as a chunk defect.
    versions: [2]
    shared: true
    edge_type: btree_node
    emitted_in: [h5policy/pickles/h5_btree2.pk]
    message: V2 B-tree record size is invalid

  H5_CORRUPT_CHUNK_INDEX_WITHOUT_UNLIMITED_DIM:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.unlimited_dimension
    record: chunk_index
    versions: [2, 3]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_layout.pk]
    message: extensible chunk index has no unlimited dimension

  # Chunk-index encodings and their shared V2 B-tree roles.

  # Emitted from h5policy_chunk_record_size_ok, which ALL FOUR chunk-index
  # walkers route through: v1 B-tree, v2 B-tree, fixed array and extensible
  # array.  Until 2026-08-22 only the extensible-array walker checked it, so the
  # versions list said [2]; the rule now spans every layout version that names a
  # chunk index.  Not `ambiguous`: the four callers are all this one record
  # family, so there is no client role to route on -- only the message prefix
  # differs, to say which index the record came from.
  # Recorded at the v1 B-tree chunk key (h5_chunkindex.pk) and decided in
  # h5policy_finalize_ohdr_dataset, for the same reason as the stored-size floor
  # below: a filter mask means nothing without the pipeline it indexes, and the
  # pipeline message and the chunk index arrive in either order.
  #
  # The rule is narrow on purpose.  A set mask bit is legitimate -- libhdf5
  # writes one when the pipeline fails or would grow a chunk, and stores that
  # chunk raw -- so the finding is not "a bit is set" but "every pipeline bit is
  # set AND the stored size is not the unfiltered chunk size", which no writer
  # can produce.  A bit at or above the filter count is explicitly NOT reported:
  # H5Z_pipeline's reverse loop never inspects it, and 1.14.5 was measured to
  # read such a file back with correct values.
  #
  # Distinct from H5_CORRUPT_FILTER_MASK (invariant sohm.filter_mask), which is
  # the identically encoded mask on a SHARED-MESSAGE fractal-heap object.  Same
  # bit layout, different structure and different client, so a separate code
  # rather than a route shard: nothing routes between them.
  #
  # versions [3, 4]: the mask is read from the v1 B-tree chunk key, the index
  # used by layout versions 3 and 4 alike.  The later index forms carry a mask
  # in their own record layouts and their walkers do not record it yet -- a
  # coverage limit, not a scope decision.
  H5_CORRUPT_CHUNK_FILTER_MASK:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.filter_mask_consistent
    record: chunk_index
    versions: [3, 4]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_validate.pk]
    message: chunk filter mask contradicts the dataset filter pipeline

  H5_CORRUPT_CHUNK_STORED_SIZE:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.stored_size
    record: chunk_index
    versions: [2, 3, 4]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_chunkindex.pk]
    message: stored chunk size is inconsistent with its index record

  # reference_graph, not aggregate_object: the violated relation is between a
  # data extent and metadata belonging to some OTHER structure -- possibly
  # another object entirely -- so neither side is faulty alone.  Same scope and
  # reason as the superblock-extension and local-heap data-segment alias checks;
  # this is the third member of that family, and the first where the aliased
  # bytes are returned to a caller as data.
  #
  # NOT chunk-specific despite living in this shard: one shared check serves
  # every layout that declares a raw-data extent by address, which is chunk
  # records (this family) and contiguous layouts (dataset_layout_filter_fill).
  # Hence `ambiguous` plus a route shard keyed on the role in the message.  The
  # code was named ...CHUNK_DATA... for one day, before the contiguous caller
  # existed; renamed rather than duplicated, because the invariant is one.
  # COMPACT layout is absent by construction, not by omission: its data is
  # embedded in the layout message and bounded against msg_size, so it declares
  # no independent extent.
  H5_CORRUPT_RAW_DATA_OVERLAPS_METADATA:
    severity: corrupt
    scope: reference_graph
    invariant: chunk.data_disjoint_from_metadata
    record: chunk_index
    ambiguous: true
    versions: [2, 3, 4]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_walk.pk]
    message: raw data extent overlaps file metadata

  # Leaf keys AND internal-node separators (both since 2026-08-23).  aggregate_object
  # rather than reference_graph: the disagreeing keys are both inside one node,
  # so unlike the overlap check this needs no other structure to be wrong.
  H5_CORRUPT_CHUNK_KEY_ORDER:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.key_order
    record: chunk_index
    versions: [2, 3]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_chunkindex.pk]
    message: chunk B-tree keys are not in increasing chunk-offset order

  # The companion to RAW_DATA_OVERLAPS_METADATA: raw data must be disjoint from
  # OTHER RAW DATA too, not just from metadata.  Same shared check, same
  # ambiguous+route treatment because the same two layouts (chunk records here,
  # contiguous in dataset_layout_filter_fill) can each be either side of the
  # collision.  Separate code rather than one "extents must be disjoint" finding
  # because the two say different things to a reader: one means a dataset serves
  # the file's own metadata, the other that it serves ANOTHER DATASET's bytes.
  H5_CORRUPT_RAW_DATA_OVERLAPS_DATA:
    severity: corrupt
    scope: reference_graph
    invariant: chunk.data_disjoint_from_data
    record: chunk_index
    ambiguous: true
    versions: [2, 3, 4]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_walk.pk]
    message: raw data extent overlaps another raw-data extent

  H5_CORRUPT_EXTENSIBLE_ARRAY_BACKPOINTER:
    severity: corrupt
    scope: reference_graph
    invariant: chunk.extensible_array_identity
    record: chunk_index
    versions: [0]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_chunkindex.pk]
    message: extensible-array block points at the wrong header

  H5_CORRUPT_EXTENSIBLE_ARRAY_BLOCK_HEADER:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.extensible_array_identity
    record: chunk_index
    versions: [0]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_chunkindex.pk]
    message: extensible-array block header is inconsistent

  H5_CORRUPT_EXTENSIBLE_ARRAY_BLOCK_OFFSET:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.extensible_array_identity
    record: chunk_index
    versions: [0]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_chunkindex.pk]
    message: extensible-array block logical offset is inconsistent

  H5_CORRUPT_EXTENSIBLE_ARRAY_CLIENT_ID:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.extensible_array_identity
    record: chunk_index
    versions: [0]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_chunkindex.pk]
    message: extensible-array client identifier is invalid

  H5_CORRUPT_EXTENSIBLE_ARRAY_GEOMETRY:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.extensible_array_geometry
    record: chunk_index
    versions: [0]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_chunkindex.pk]
    message: extensible-array geometry is inconsistent

  H5_CORRUPT_EXTENSIBLE_ARRAY_INDEX_ADDRESS:
    severity: corrupt
    scope: reference_graph
    invariant: chunk.extensible_array_geometry
    record: chunk_index
    versions: [0]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_chunkindex.pk]
    message: extensible-array index address is inconsistent with its realized elements

  H5_CORRUPT_FIXED_ARRAY_EXTENT_MISMATCH:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.fixed_array_capacity
    record: chunk_index
    versions: [0]
    shared: false
    edge_type: chunk_index
    # Emitted at object finalization, where the dataspace and the layout are
    # both known regardless of the order their messages appeared in.
    emitted_in: [h5policy/pickles/h5_validate.pk]
    message: fixed-array chunk index capacity does not match the dataspace maximum extent

  H5_CORRUPT_FIXED_ARRAY_CLIENT_ID:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.fixed_array_client
    record: chunk_index
    versions: [0]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_chunkindex.pk]
    message: fixed-array client identifier is invalid

  H5_CORRUPT_UNSUPPORTED_EXTENSIBLE_ARRAY_VERSION:
    severity: corrupt
    scope: local_decode
    invariant: chunk.extensible_array_version
    record: chunk_index
    versions: [0]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_chunkindex.pk]
    message: extensible-array structure version is unsupported

  H5_CORRUPT_UNSUPPORTED_FIXED_ARRAY_VERSION:
    severity: corrupt
    scope: local_decode
    invariant: chunk.fixed_array_version
    record: chunk_index
    versions: [0]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_chunkindex.pk]
    message: fixed-array structure version is unsupported

  H5_CORRUPT_UNKNOWN_CHUNK_INDEX_TYPE:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.index_type_known
    record: chunk_index
    versions: [2, 3, 4]
    shared: false
    edge_type: chunk_index
    emitted_in: [h5policy/pickles/h5_chunkindex.pk, h5policy/pickles/h5_layout.pk]
    message: chunk-index type or record type is unknown

  H5_CORRUPT_V2_BTREE_NODE_HEADER:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.btree_node_header
    record: chunk_index
    ambiguous: true
    versions: [0]
    shared: true
    edge_type: btree_node
    emitted_in: [h5policy/pickles/h5_btree2.pk, h5policy/pickles/h5_dense_attrs.pk, h5policy/pickles/h5_dense_links.pk, h5policy/pickles/h5_sohm.pk]
    message: V2 B-tree node header does not match its owning index

  H5_CORRUPT_UNSUPPORTED_V2_BTREE_VERSION:
    severity: corrupt
    scope: local_decode
    invariant: chunk.btree_version_supported
    record: chunk_index
    ambiguous: true
    versions: [0]
    shared: true
    edge_type: btree_node
    emitted_in: [h5policy/pickles/h5_chunkindex.pk, h5policy/pickles/h5_dense_attrs.pk, h5policy/pickles/h5_dense_links.pk]
    message: V2 B-tree version is unsupported

  H5_CORRUPT_V2_BTREE_ROOT_COUNT:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.btree_root_count
    record: chunk_index
    ambiguous: true
    versions: [0]
    shared: true
    edge_type: btree_node
    emitted_in: [h5policy/pickles/h5_chunkindex.pk, h5policy/pickles/h5_sohm.pk]
    message: V2 B-tree root and total record counts are inconsistent

  H5_CORRUPT_V2_BTREE_SPLIT_MERGE:
    severity: corrupt
    scope: aggregate_object
    invariant: chunk.btree_split_merge
    record: chunk_index
    ambiguous: true
    versions: [0]
    shared: true
    edge_type: btree_node
    emitted_in: [h5policy/pickles/h5_chunkindex.pk, h5policy/pickles/h5_sohm.pk]
    message: V2 B-tree split and merge thresholds are inconsistent
