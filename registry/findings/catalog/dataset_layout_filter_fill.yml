    shared: false
    edge_type: filter_pipeline
    emitted_in: [h5policy/pickles/h5_validate.pk, h5policy/pickles/h5_layout.pk]
    message: filter element count does not match the chunk

  # Not `ambiguous`: emitted from one place (the pipeline descriptor loop in
