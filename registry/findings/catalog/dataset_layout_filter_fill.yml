    scope: local_decode
    invariant: layout.fill_flags_defined
    record: dataset_layout_filter_fill
    versions: [3]
    shared: false
    edge_type: dataset_layout
    emitted_in: [h5policy/pickles/h5_messages.pk]
    message: fill-value v3 flags set bits the format does not define

  H5_CORRUPT_FILL_VALUE_FLAG_CONFLICT:
    severity: corrupt
    scope: local_decode
    invariant: layout.fill_flags_consistent
    record: dataset_layout_filter_fill
    versions: [3]
    shared: false
    edge_type: dataset_layout
    emitted_in: [h5policy/pickles/h5_messages.pk]
    # Undefined-value and have-value are contradictory claims about the same
    # message; libhdf5 checks the undefined bit first and never reads a size
    # field in that branch, so the bytes after the flags have no defined
    # reading and h5policy does not parse them either.
    message: fill-value v3 flags mark the value both undefined and present

