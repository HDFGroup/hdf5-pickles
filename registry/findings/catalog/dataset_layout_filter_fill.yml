# Finding catalog shard for the dataset_layout_filter_fill record family.
# Authoritative source; routing for ambiguous codes lives in ../routes/.
schema_version: 1
record: dataset_layout_filter_fill

findings:

  H5_CORRUPT_FILL_VALUE_SIZE_MISMATCH:
    severity: corrupt
    scope: aggregate_object
    invariant: layout.fill_value_size
    record: dataset_layout_filter_fill
    versions: [3, 4]
    shared: false
    edge_type: dataset_layout
    emitted_in: [h5policy/pickles/h5_walk.pk]
    message: dataset fill value size does not match its datatype

  H5_RESOURCE_LOGICAL_DATASET_BYTES:
    severity: resource
    scope: resource
    invariant: layout.logical_bytes_budget
    record: dataset_layout_filter_fill
    versions: [3, 4]
    shared: false
    edge_type: dataset_layout
    emitted_in: [h5policy/pickles/h5_walk.pk]
    message: logical dataset byte count exceeds the validation budget

  H5_CORRUPT_FILTER_PIPELINE_OVERRUNS_MESSAGE:
    severity: corrupt
    scope: local_decode
    invariant: layout.filter_pipeline_bounds
    record: dataset_layout_filter_fill
    ambiguous: true
    versions: [2, 3]
    shared: false
    edge_type: filter_pipeline
    emitted_in: [h5policy/pickles/h5_layout.pk]
    message: filter descriptor overruns the pipeline message

  H5_CORRUPT_FILTER_NELMTS_MISMATCH:
    severity: corrupt
    scope: aggregate_object
    invariant: layout.filter_element_count
    record: dataset_layout_filter_fill
    # Emitted from more than one walker; the mapping above is a
    # fallback, not an authoritative attribution.  Resolve with the
    # finding message via its route shard.
    ambiguous: true
    versions: [2, 3]
    shared: false
    edge_type: filter_pipeline
    emitted_in: [h5policy/pickles/h5_validate.pk, h5policy/pickles/h5_layout.pk]
    message: filter element count does not match the chunk

  # Not `ambiguous`: emitted from one place (the pipeline descriptor loop in
  # h5_layout.pk) for two filters, and both callers are this record family.  The
  # filter is named in the message for the reader, not to route on.
  H5_CORRUPT_FILTER_PARAM_COUNT:
    severity: corrupt
    scope: local_decode
    invariant: layout.filter_param_count
    record: dataset_layout_filter_fill
    versions: [2, 3]
    shared: false
    edge_type: filter_pipeline
    emitted_in: [h5policy/pickles/h5_layout.pk]
    message: filter parameter count is inconsistent with what the filter requires

  H5_CORRUPT_FILTER_ELEMENT_SIZE_MISMATCH:
    severity: corrupt
    scope: aggregate_object
    invariant: layout.filter_element_size
    record: dataset_layout_filter_fill
    versions: [2, 3]
    shared: false
    edge_type: filter_pipeline
    emitted_in: [h5policy/pickles/h5_validate.pk]
    message: filter element size does not match the datatype

  # The rest of the "local" parameters libhdf5 DERIVES from the object's own
  # datatype and fill-value messages when it writes the file
  # (H5Z__set_local_scaleoffset, H5Z__set_parms_atomic) and never compares back
  # when it reads it.  Four distinct statements share one code because they
  # share one argument -- the descriptor holds a copy of what a sibling message
  # states, so a disagreement is decidable with no data decode and cannot occur
  # in a conforming file.  The route shard splits them by message.
  #
  # This is an INTEGRITY code, not a memory-safety one, which is unusual enough
  # to say out loud: MEASURED on HDF5 2.3.0, every one of these edits reads back
  # with rc=0 and different values, and AddressSanitizer is clean on all of
  # them.  cd_values[1] (the scale-offset scale factor) does the same damage and
  # is deliberately NOT covered -- it is a genuine user parameter derived from
  # no message, so there is nothing to compare it against.
  # See registry/cases/filter-local-parms-disagree-with-source-messages.yml.
  H5_CORRUPT_FILTER_PARM_MISMATCH:
    severity: corrupt
    scope: aggregate_object
    invariant: layout.filter_byte_order
    record: dataset_layout_filter_fill
    ambiguous: true
    # Same version set as the sibling filter checks in this family: these are
    # rules about a filter-pipeline message on a chunked dataset, reached
    # through the same layout versions filter_element_size is.
    versions: [2, 3]
    shared: false
    edge_type: filter_pipeline
    emitted_in: [h5policy/pickles/h5_validate.pk]
    message: filter local parameter contradicts the message it was copied from

  # A chunk above 4 GiB is format-legal and, since libhdf5 2.0.0, writable.
  # The only unrepresentable combination is a v1 B-tree index, whose record
  # carries the chunk byte size in four bytes -- which is why this code is
  # confined to the layout versions that have no encoded index type and are
  # therefore always v1 B-tree indexed.  libhdf5 refuses the same combination
  # at H5Dchunk.c:1185.
  H5_CORRUPT_CHUNK_SIZE_EXCEEDS_32BIT:
    severity: corrupt
    scope: local_decode
    invariant: layout.chunk_size_32bit
    record: dataset_layout_filter_fill
    versions: [1, 2, 3]
    shared: false
    edge_type: dataset_layout
    emitted_in: [h5policy/pickles/h5_layout.pk]
    message: chunk byte size exceeds the 32-bit size field of a v1 B-tree chunk index

  # The bound that carries the memory-safety consequence: libhdf5 accumulates
  # the same product with no overflow check on the read path, and a product
  # that wraps to zero reaches H5D__chunk_lock behind an assert that release
  # builds do not contain.  Version-independent, unlike the 32-bit rule.
  H5_CORRUPT_CHUNK_SIZE_PRODUCT_OVERFLOW:
    severity: corrupt
    scope: local_decode
    invariant: layout.chunk_size_product
    record: dataset_layout_filter_fill
    versions: [1, 2, 3, 4, 5]
    shared: false
    edge_type: dataset_layout
    emitted_in: [h5policy/pickles/h5_layout.pk]
    message: chunk dimensions multiply past a representable byte size

  # Compatibility, not corruption: libhdf5 declines to CREATE a >4 GiB chunk
  # below layout version 5 but deliberately opens one, so the file is valid and
  # only its portability is limited.  Reachable at version 4 alone: versions
  # 1-3 are always v1 B-tree indexed and take the corrupt route above, and
  # version 5 is the version in which the geometry is fully legitimate.
  H5_ADVISORY_CHUNK_SIZE_REQUIRES_LAYOUT_V5:
    severity: warning
    scope: local_decode
    invariant: layout.chunk_size_version_advisory
    record: dataset_layout_filter_fill
    versions: [4]
    shared: false
    edge_type: dataset_layout
    emitted_in: [h5policy/pickles/h5_layout.pk]
    message: chunk byte size above 4 GiB is only readable by libhdf5 2.0.0 or later at this layout version

  H5_CORRUPT_LAYOUT_RANK_MISMATCH:
    severity: corrupt
    scope: aggregate_object
    invariant: layout.rank_match
    record: dataset_layout_filter_fill
    versions: [1, 2, 3]
    shared: false
    edge_type: dataset_layout
    emitted_in: [h5policy/pickles/h5_walk.pk]
    message: dataset layout rank does not match dataspace rank

  H5_RESOURCE_CHUNK_TOO_SMALL:
    severity: resource
    scope: resource
    invariant: layout.chunk_size_budget
    record: dataset_layout_filter_fill
    versions: [1, 2, 3]
    shared: false
    edge_type: dataset_layout
    emitted_in: [h5policy/pickles/h5_walk.pk]
    message: logical chunk size implies excessive chunk count

  H5_ADVISORY_DECODE_FILTER:
    severity: advisory
    scope: policy
    invariant: layout.filter_decode_advisory
    record: dataset_layout_filter_fill
    versions: [2, 3]
    shared: false
    edge_type: filter_pipeline
    emitted_in: [h5policy/pickles/h5_layout.pk]
    message: filter pipeline requires bounded decode/activation review

  H5_CORRUPT_FILTERED_HEAP_NO_DBLOCK_CHECKSUM:
    severity: corrupt
    scope: aggregate_object
    invariant: layout.filtered_heap_checksum
    record: dataset_layout_filter_fill
    # Emitted from more than one walker; the mapping above is a
    # fallback, not an authoritative attribution.  Resolve with the
    # finding message via its route shard.
    ambiguous: true
    versions: [2, 3]
    shared: true
    edge_type: filter_pipeline
    emitted_in: [h5policy/pickles/h5_dense_attrs.pk, h5policy/pickles/h5_dense_links.pk, h5policy/pickles/h5_sohm.pk]
    message: filtered heap data block lacks the required checksum

  H5_CORRUPT_CONTIGUOUS_LAYOUT_SIZE_MISMATCH:
    severity: corrupt
    scope: aggregate_object
    invariant: layout.contiguous_size
    record: dataset_layout_filter_fill
    versions: [1, 2, 3]
    shared: false
    edge_type: dataset_layout
    emitted_in: [h5policy/pickles/h5_walk.pk]
    message: contiguous layout size does not match dataspace and datatype

  H5_CORRUPT_DATASET_MISSING_LAYOUT:
    severity: corrupt
    scope: aggregate_object
