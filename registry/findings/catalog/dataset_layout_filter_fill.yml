    shared: false
    edge_type: filter_pipeline
    emitted_in: [h5policy/pickles/h5_layout.pk]
    # Distinct from H5_RESOURCE_FILTER_COUNT: that one reports the profile's
    # budget, which a consumer may raise.  H5Z_MAX_NFILTERS is a format ceiling
    # libhdf5 refuses past unconditionally, so no profile can accept this.
    message: filter pipeline declares more filters than the format permits

