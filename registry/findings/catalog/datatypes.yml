# Finding catalog shard for the datatypes record family.
# Authoritative source; routing for ambiguous codes lives in ../routes/.
schema_version: 1
record: datatypes

findings:

  # datatype vertical slice

  H5_RESOURCE_DATATYPE_RECURSION_DEPTH:
    severity: resource
    scope: resource
    invariant: datatype.recursion_depth
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: datatype recursion depth exceeds the bounded validation limit

  H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS:
    severity: corrupt
    # A relationship among three fields (member offset, member type size,
    # parent element size), not single-field decode safety -- strategy
    # §11.2/§11.3 name this exact case as the canonical record_local example.
    scope: record_local
    invariant: datatype.compound_member_bounds
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype_member
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: compound datatype member extends outside its parent element

  H5_CORRUPT_DATATYPE_DUPLICATE_MEMBER_NAME:
    severity: corrupt
    # A relationship between two members of the same compound, not single-field
    # decode safety: the record is only inconsistent when both are read.
    scope: record_local
    invariant: datatype.member_name_unique
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype_member
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    # Ambiguity, not a range error: a by-name lookup resolves to the first
    # member while a by-index walk sees both, so two readers disagree about
    # which bytes the field denotes with nothing out of range anywhere.
    message: compound datatype repeats a member name

  H5_CORRUPT_LENGTH_OVERFLOW:
    severity: corrupt
    scope: local_decode
    invariant: datatype.size_arithmetic
    record: datatypes
    # Emitted from more than one walker; the mapping above is a
    # fallback, not an authoritative attribution.  Resolve with the
    # finding message via its route shard.
    ambiguous: true
    versions: [1, 2, 3]
    shared: true
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: datatype size arithmetic overflows its bounded representation

  H5_CORRUPT_DATATYPE_ZERO_MEMBERS:
    severity: corrupt
    scope: local_decode
    invariant: datatype.members_nonzero
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: compound datatype has zero members

  H5_CORRUPT_DATATYPE_PRECISION_BOUNDS:
    severity: corrupt
    scope: local_decode
    invariant: datatype.precision_bounds
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: datatype precision exceeds its storage bounds

  H5_CORRUPT_DATATYPE_UNUSED_BITS:
    severity: corrupt
    scope: local_decode
    invariant: datatype.unused_bits
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: datatype declares invalid unused bits

  H5_CORRUPT_UNSUPPORTED_DATATYPE_VERSION:
    severity: corrupt
    scope: local_decode
    invariant: datatype.version_supported
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: datatype version is unsupported

  # ── completed corruption-code semantic mappings ────────────────────────────

  # Datatype local encoding.

  H5_CORRUPT_DATATYPE_ARRAY_DIMENSION:
    severity: corrupt
    scope: local_decode
    invariant: datatype.array_shape
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: array datatype dimension is invalid

  H5_CORRUPT_DATATYPE_ARRAY_RANK:
    severity: corrupt
    scope: local_decode
    invariant: datatype.array_shape
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: array datatype rank is invalid

  H5_CORRUPT_DATATYPE_ARRAY_SIZE:
    severity: corrupt
    scope: local_decode
    invariant: datatype.array_shape
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: array datatype size is inconsistent with its shape

  # Complex numbers (class 11) exist only at datatype message version 5, so
  # these three are the only datatype findings whose `versions` is [5].  A
  # class-11 message at an earlier version is reported by
  # H5_CORRUPT_UNSUPPORTED_DATATYPE_VERSION instead: that is a version defect,
  # not a complex-encoding one.

  H5_CORRUPT_DATATYPE_COMPLEX_ENCODING:
    severity: corrupt
    scope: local_decode
    invariant: datatype.complex_encoding
    record: datatypes
    versions: [5]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: complex datatype class bits are not a homogeneous rectangular encoding

  H5_CORRUPT_DATATYPE_COMPLEX_BASE_CLASS:
    severity: corrupt
    scope: local_decode
    invariant: datatype.complex_encoding
    record: datatypes
    versions: [5]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: complex datatype base type is not floating-point

  # Sibling of H5_CORRUPT_DATATYPE_ARRAY_SIZE: the declared element size must
  # match what the class's own shape implies -- here twice the base type size.
  H5_CORRUPT_DATATYPE_COMPLEX_SIZE:
    severity: corrupt
    scope: local_decode
    invariant: datatype.complex_encoding
    record: datatypes
    versions: [5]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: complex datatype size is inconsistent with its base type

  H5_CORRUPT_DATATYPE_ENUM_BASE_SIZE:
    severity: corrupt
    scope: local_decode
    invariant: datatype.enum_encoding
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: enum datatype base size is invalid

  H5_CORRUPT_DATATYPE_ENUM_NAME_EMPTY:
    severity: corrupt
    scope: local_decode
    invariant: datatype.enum_encoding
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: enum datatype member name is empty

  H5_CORRUPT_DATATYPE_FLOAT_BYTE_ORDER:
    severity: corrupt
    scope: local_decode
    invariant: datatype.float_byte_order
    record: datatypes
    # Bit 6 only exists from datatype message version 3 on.
    versions: [3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    # Bit 6 selects VAX order, which is only meaningful together with bit 0;
    # bit 6 alone names no byte order at all.
    message: floating-point byte order sets the VAX bit without the big-endian bit

  H5_CORRUPT_DATATYPE_FLOAT_NORMALIZATION:
    severity: corrupt
    scope: local_decode
    invariant: datatype.float_normalization
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    # A 2-bit field with three defined values; the fourth is reserved.
    message: floating-point mantissa normalization is the reserved encoding

  H5_CORRUPT_DATATYPE_OPAQUE_TAG_ALIGNMENT:
    severity: corrupt
    scope: local_decode
    invariant: datatype.opaque_tag_alignment
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: opaque datatype tag length is not a multiple of eight

  H5_CORRUPT_DATATYPE_REFERENCE_VERSION:
    severity: corrupt
    scope: local_decode
    invariant: datatype.reference_encode_version
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    # The revised reference kinds carry an encoding version in their class
    # flags; distinct from the datatype message version.
    message: revised reference datatype declares an unsupported encoding version

  H5_CORRUPT_DATATYPE_FLOAT_OVERLAP:
    severity: corrupt
    # A relationship among the sign, exponent and mantissa ranges of one
    # datatype, not single-field decode safety: each field can be
    # individually in bounds and the type still be self-contradictory.
    scope: record_local
    invariant: datatype.float_fields_disjoint
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    # One bit would have to be read as two different things at once, so no
    # two consumers can agree on the value.  libhdf5 tests the three pairs
    # separately; the message says which pair.
    message: floating-point sign, exponent and mantissa bit ranges overlap

  H5_CORRUPT_DATATYPE_FLOAT_EXPONENT:
    severity: corrupt
    scope: local_decode
    invariant: datatype.float_fields
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: floating-point exponent field is invalid

  H5_CORRUPT_DATATYPE_FLOAT_MANTISSA:
    severity: corrupt
    scope: local_decode
    invariant: datatype.float_fields
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: floating-point mantissa field is invalid

  H5_CORRUPT_DATATYPE_FLOAT_SIGN:
    severity: corrupt
    scope: local_decode
    invariant: datatype.float_fields
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: floating-point sign field is invalid

  H5_CORRUPT_DATATYPE_MESSAGE_TOO_SMALL:
    severity: corrupt
    scope: local_decode
    invariant: datatype.message_complete
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: datatype message is too small for its declared fields

  H5_CORRUPT_DATATYPE_ZERO_SIZE:
    severity: corrupt
    scope: local_decode
    invariant: datatype.nonzero_size
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: datatype declares zero storage size

  H5_CORRUPT_UNKNOWN_DATATYPE_CLASS:
    severity: corrupt
    scope: local_decode
    invariant: datatype.class_known
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: datatype class is unknown

  H5_CORRUPT_DATATYPE_REFERENCE_SIZE:
    severity: corrupt
    # A relationship between the reference TYPE and the declared element size,
    # resolved against a superblock constant -- two fields of one record plus a
    # file-wide parameter, which is record_local and not local_decode.  libhdf5
    # rewrites this size from the file when the type is attached
    # (H5Tref.c:256/284/312) without ever comparing it to what was encoded, so a
    # consumer that already sized a buffer from the encoded value is wrong by
    # the difference.  An attribute's raw-data extent (H5Oattr.c:273) is such a
    # consumer and reads back at the post-fixup size (H5Aint.c:769).
    scope: record_local
    invariant: datatype.reference_size
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: reference datatype size does not match the size the file dictates

  H5_CORRUPT_DATATYPE_VLEN_SIZE:
    severity: corrupt
    # The class-9 sibling of the above: H5T__vlen_set_loc (H5Tvlen.c:300)
    # assigns 4 + blob_id_size on disk, likewise without consulting the encoded
    # size.
    scope: record_local
    invariant: datatype.vlen_size
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: variable-length datatype size does not match the size the file dictates

  H5_CORRUPT_DATATYPE_REFERENCE_TYPE:
    severity: corrupt
    scope: local_decode
    invariant: datatype.reference_type
    record: datatypes
    versions: [1, 2, 3]
    shared: false
    edge_type: datatype
    emitted_in: [h5policy/pickles/h5_datatype.pk]
    message: unknown reference type
