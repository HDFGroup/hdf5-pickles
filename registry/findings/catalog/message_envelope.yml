# Finding catalog shard for the message_envelope record family.
# Authoritative source; routing for ambiguous codes lives in ../routes/.
schema_version: 1
record: message_envelope

findings:

  H5_CORRUPT_LAYOUT_MESSAGE_TOO_SMALL:
    severity: corrupt
    scope: local_decode
    invariant: envelope.layout_minimum_size
    record: message_envelope
    versions: [1, 2, 3, 4]
    shared: true
    edge_type: message
    emitted_in: [h5policy/pickles/h5_layout.pk]
    message: dataset layout message is too small

  H5_CORRUPT_UNSUPPORTED_OBJECT_HEADER_VERSION:
    severity: corrupt
    scope: local_decode
    invariant: envelope.object_header_version
    record: message_envelope
    versions: [1, 2]
    shared: true
    edge_type: object_header
    emitted_in: [h5policy/pickles/h5_validate.pk, h5policy/pickles/h5_shared.pk]
    message: object header version is unsupported
    # Emitted from more than one walker; the mapping above is a
    # fallback, not an authoritative attribution.  Resolve with the
    # finding message via its route shard.
    ambiguous: true

  H5_CORRUPT_UNSUPPORTED_GROUP_INFO_VERSION:
    severity: corrupt
    scope: local_decode
    invariant: envelope.group_info_version
    record: message_envelope
    versions: [1, 2]
    shared: false
    edge_type: message
    emitted_in: [h5policy/pickles/h5_messages.pk]
    message: group-info message version is unsupported

  H5_CORRUPT_GROUP_INFO_TRAILING_BYTES:
    severity: corrupt
    scope: local_decode
    invariant: envelope.group_info_trailing_bytes
    record: message_envelope
    versions: [1, 2]
    shared: false
    edge_type: message
    emitted_in: [h5policy/pickles/h5_messages.pk]
    message: group-info message has trailing bytes

  H5_CORRUPT_LINK_INFO_NEGATIVE_MAX_CORDER:
    severity: corrupt
    scope: local_decode
    invariant: envelope.link_info_max_corder
    record: message_envelope
    versions: [1, 2]
    shared: false
    edge_type: link
    emitted_in: [h5policy/pickles/h5_dense_links.pk]
    message: link-info maximum creation order is invalid

  H5_CORRUPT_LINK_INFO_TRAILING_BYTES:
    severity: corrupt
    scope: local_decode
    invariant: envelope.link_info_trailing_bytes
    record: message_envelope
    versions: [1, 2]
    shared: false
    edge_type: link
    emitted_in: [h5policy/pickles/h5_dense_links.pk]
    message: link-info message has trailing bytes

  H5_CORRUPT_MESSAGE_FLAG_COMBINATION:
    severity: corrupt
    scope: local_decode
    invariant: envelope.message_flags
    record: message_envelope
    versions: [1, 2]
    shared: true
    edge_type: message
    emitted_in: [h5policy/pickles/h5_dispatch.pk, h5policy/pickles/h5_dense_links.pk]
    message: message flags use an invalid combination
    # Emitted from more than one walker; the mapping above is a
    # fallback, not an authoritative attribution.  Resolve with the
    # finding message via its route shard.
    ambiguous: true

  H5_CORRUPT_OBJECT_HEADER_MESSAGE_TYPE_RANGE:
    severity: corrupt
    scope: local_decode
    invariant: envelope.message_type_encoding
    record: message_envelope
    versions: [1, 2]
    shared: false
    edge_type: message
    emitted_in: [h5policy/pickles/h5_dispatch.pk]
    message: object-header message type is out of range and is not marked skippable if unknown

  H5_CORRUPT_NULL_MESSAGE_GAP:
    severity: corrupt
    scope: local_decode
    invariant: envelope.null_gap
    record: message_envelope
    versions: [1, 2]
    shared: false
    edge_type: object_header
    emitted_in: [h5policy/pickles/h5_dispatch.pk]
    message: null message leaves an invalid gap

  H5_CORRUPT_OBJECT_HEADER_MESSAGE_COUNT:
    severity: corrupt
    scope: local_decode
    invariant: envelope.message_count
    record: message_envelope
    versions: [1, 2]
    shared: false
    edge_type: object_header
    emitted_in: [h5policy/pickles/h5_validate.pk]
    message: object header message count is inconsistent

  H5_CORRUPT_SYMBOL_TABLE_CACHE_TYPE:
    severity: corrupt
    scope: local_decode
    invariant: envelope.symbol_table_cache_type
    record: message_envelope
    versions: [1]
    shared: false
    edge_type: symbol_table
    emitted_in: [h5policy/pickles/h5_group.pk]
    message: symbol-table cache type is invalid

  H5_CORRUPT_UNSUPPORTED_SYMBOL_TABLE_NODE_VERSION:
    severity: corrupt
    scope: local_decode
    invariant: envelope.symbol_table_node_version
    record: message_envelope
    versions: [1]
    shared: false
    edge_type: symbol_table
    emitted_in: [h5policy/pickles/h5_group.pk]
    message: symbol-table node version is unsupported

  H5_POLICY_UNKNOWN_MESSAGE:
    severity: policy
    scope: policy
    invariant: envelope.unknown_message_policy
    record: message_envelope
    versions: [1, 2]
    shared: false
    edge_type: message
    emitted_in: [h5policy/pickles/h5_dispatch.pk]
    message: unknown object-header message encountered

  # Object-header message envelopes not already represented above.

  H5_CORRUPT_ATTRIBUTE_MESSAGE_TOO_SMALL:
    severity: corrupt
    scope: local_decode
    invariant: envelope.attribute_complete
    record: message_envelope
    versions: [1, 2, 3]
    shared: false
    edge_type: attribute
    emitted_in: [h5policy/pickles/h5_messages.pk]
    message: attribute message is too small

  H5_CORRUPT_MESSAGE_SIZE_UNALIGNED:
    severity: corrupt
    scope: local_decode
    invariant: envelope.message_size_alignment
    record: message_envelope
    versions: [1]
    shared: false
    edge_type: message
    emitted_in: [h5policy/pickles/h5_dispatch.pk]
    # Version 1 pads every message body to an 8-byte boundary, so the stored
    # size is always a multiple of 8.  Version 2 dropped the padding and stores
    # the exact size, so the rule does not apply there.
    message: version 1 object-header message size is not a multiple of eight

  # An attribute VALUE holding vlen/reference global-heap IDs.  Unlike a
  # dataset's descriptors, these live inside the object-header message, so they
  # are metadata and this oracle both locates and bounds them.
  H5_CORRUPT_REFERENCE_BLOB_EXTENT:
    severity: corrupt
    scope: local_decode
    invariant: attribute.reference_blob_extent
    record: message_envelope
    versions: [1, 2, 3]
    shared: false
    edge_type: metadata
    emitted_in: [h5policy/pickles/h5_messages.pk]
    message: reference blob header does not fit the heap object that holds it

  H5_CORRUPT_ATTRIBUTE_HEAP_ID_LENGTH:
    severity: corrupt
    scope: reference_graph
    invariant: attribute.heap_object_length
    record: message_envelope
    versions: [1, 2, 3]
    shared: false
    edge_type: attribute_value
    emitted_in: [h5policy/pickles/h5_messages.pk]
    message: attribute vlen sequence length exceeds its global-heap object

  H5_CORRUPT_ATTRIBUTE_NAME_EMPTY:
    severity: corrupt
    scope: local_decode
    invariant: envelope.attribute_name_nonempty
    record: message_envelope
    versions: [1, 2, 3]
    shared: false
    edge_type: attribute
    emitted_in: [h5policy/pickles/h5_messages.pk]
    # name_size counts the terminating NUL, so 1 describes the empty string and
    # 0 describes no name field at all.  libhdf5 refuses both with one test.
    message: attribute name length leaves no room for a name

  H5_CORRUPT_ATTRIBUTE_NAME_EMBEDDED_NUL:
    severity: corrupt
    scope: local_decode
    invariant: envelope.attribute_name_exact_length
    record: message_envelope
    versions: [1, 2, 3]
    shared: false
    edge_type: attribute
    emitted_in: [h5policy/pickles/h5_messages.pk]
    # An embedded NUL truncates the name for a C-string consumer while the
    # declared length keeps the datatype and dataspace at their original
    # offsets, so two readers disagree about the attribute's identity without
    # either seeing a malformed message.
    message: attribute name ends before its declared length

  H5_CORRUPT_ATTRIBUTE_OVERRUNS_MESSAGE:
    severity: corrupt
    scope: local_decode
    invariant: envelope.attribute_complete
    record: message_envelope
    versions: [1, 2, 3]
    shared: false
    edge_type: attribute
    emitted_in: [h5policy/pickles/h5_messages.pk]
    message: attribute fields overrun their message

  H5_CORRUPT_UNSUPPORTED_ATTRIBUTE_VERSION:
    severity: corrupt
    scope: local_decode
    invariant: envelope.attribute_version_supported
    record: message_envelope
    versions: [1, 2, 3]
    shared: false
    edge_type: attribute
    emitted_in: [h5policy/pickles/h5_messages.pk]
    message: attribute message version is unsupported

  # The two group-shape invariants are message-PRESENCE rules over the whole
  # object header, so their scope is aggregate_object even though the family's
  # own scope is local_decode -- the same shape as
  # H5_CORRUPT_DATASET_MISSING_LAYOUT in dataset_layout_filter_fill.  They live
  # here because the object header's message set is what this family owns; there
  # is no separate group-structure record.
  H5_CORRUPT_GROUP_MISSING_LINK_STORAGE:
    severity: corrupt
    scope: aggregate_object
    invariant: envelope.group_link_storage_present
    record: message_envelope
    versions: [1, 2]
    shared: false
    edge_type: object_header
    emitted_in: [h5policy/pickles/h5_validate.pk]
    message: group has neither a link-info nor a symbol-table message

  H5_ADVISORY_GROUP_INFO_MISSING:
    severity: warning
    scope: aggregate_object
    invariant: envelope.group_info_present
    record: message_envelope
    versions: [1, 2]
    shared: false
    edge_type: object_header
    emitted_in: [h5policy/pickles/h5_validate.pk]
    message: new-style group has no group-info message

  H5_CORRUPT_GROUP_INFO_FLAGS:
    severity: corrupt
    scope: local_decode
    invariant: envelope.group_info_flags
    record: message_envelope
    versions: [0]
    shared: false
    edge_type: message
    emitted_in: [h5policy/pickles/h5_messages.pk]
    message: group-info flags are invalid

  H5_CORRUPT_GROUP_INFO_MESSAGE_TOO_SMALL:
    severity: corrupt
    scope: local_decode
    invariant: envelope.group_info_complete
    record: message_envelope
    versions: [0]
    shared: false
    edge_type: message
    emitted_in: [h5policy/pickles/h5_messages.pk]
    message: group-info message is too small

  H5_CORRUPT_LINK_INFO_FLAGS:
    severity: corrupt
    scope: local_decode
    invariant: envelope.link_info_flags
    record: message_envelope
    versions: [0]
    shared: false
    edge_type: link
    emitted_in: [h5policy/pickles/h5_dense_links.pk]
    message: link-info flags are invalid

  H5_CORRUPT_LINK_INFO_MESSAGE_TOO_SMALL:
    severity: corrupt
    scope: local_decode
    invariant: envelope.link_info_complete
    record: message_envelope
    versions: [0]
    shared: false
    edge_type: link
    emitted_in: [h5policy/pickles/h5_dense_links.pk]
    message: link-info message is too small

  H5_CORRUPT_LINK_FLAGS:
    severity: corrupt
    scope: local_decode
    invariant: envelope.link_flags
    record: message_envelope
    versions: [1]
    shared: false
    edge_type: link
    emitted_in: [h5policy/pickles/h5_dense_links.pk]
    # H5O_LINK_ALL_FLAGS is 0x1f: name-length width, creation order, link
    # type and character set.  Nothing is defined above bit 4.
    message: link message flags set bits the format does not define

  H5_CORRUPT_LINK_TYPE:
    severity: corrupt
    scope: local_decode
    invariant: envelope.link_type
    record: message_envelope
    versions: [1]
    shared: false
    edge_type: link
    emitted_in: [h5policy/pickles/h5_dense_links.pk]
    # Distinct from H5_POLICY_USER_DEFINED_LINK: user-defined types start at
    # H5L_TYPE_UD_MIN (64) and are a consumer's decision to follow, while
    # 2..63 name no link kind and libhdf5 refuses them under any settings.
    message: link type is below the user-defined range and names no link kind

  H5_CORRUPT_LINK_MESSAGE_TOO_SMALL:
    severity: corrupt
    scope: local_decode
    invariant: envelope.link_message_complete
    record: message_envelope
    versions: [1]
    shared: false
    edge_type: link
    emitted_in: [h5policy/pickles/h5_dense_links.pk]
    message: link message is too small

  H5_CORRUPT_UNSUPPORTED_LINK_INFO_VERSION:
    severity: corrupt
    scope: local_decode
    invariant: envelope.link_info_version_supported
    record: message_envelope
    versions: [0]
    shared: false
    edge_type: link
    emitted_in: [h5policy/pickles/h5_dense_links.pk]
    message: link-info message version is unsupported

  H5_CORRUPT_UNSUPPORTED_LINK_VERSION:
    severity: corrupt
    scope: local_decode
    invariant: envelope.link_version_supported
    record: message_envelope
    versions: [1]
    shared: false
    edge_type: link
    emitted_in: [h5policy/pickles/h5_dense_links.pk]
    message: link message version is unsupported

  H5_CORRUPT_MESSAGE_FLAG_UNSHAREABLE:
    severity: corrupt
    scope: local_decode
    invariant: envelope.message_shareable
    record: message_envelope
    versions: [1, 2]
    shared: false
    edge_type: message
    emitted_in: [h5policy/pickles/h5_dispatch.pk]
    message: object-header message uses sharing flags on an unshareable type

  H5_CORRUPT_NAME_MESSAGE_EMPTY:
    severity: corrupt
    scope: local_decode
    invariant: envelope.name_nonempty
    record: message_envelope
    versions: [1, 2]
    shared: false
    edge_type: message
    emitted_in: [h5policy/pickles/h5_dispatch.pk]
    message: object name message is empty

  H5_CORRUPT_SYMBOL_TABLE_MESSAGE_TOO_SMALL:
    severity: corrupt
    scope: local_decode
    invariant: envelope.symbol_table_complete
    record: message_envelope
    versions: [1]
    shared: false
    edge_type: symbol_table
    emitted_in: [h5policy/pickles/h5_group.pk]
    message: symbol-table message is too small

  H5_CORRUPT_SYMBOL_TABLE_ADDRESS_UNDEFINED:
    severity: corrupt
    scope: local_decode
    invariant: envelope.symbol_table_addresses_defined
    record: message_envelope
    versions: [1]
    shared: false
    edge_type: symbol_table
    emitted_in: [h5policy/pickles/h5_group.pk]
    message: symbol-table message name-heap address is undefined

  H5_CORRUPT_SYMBOL_TABLE_NODE_RESERVED:
    severity: corrupt
    scope: local_decode
    invariant: envelope.symbol_table_reserved_zero
    record: message_envelope
    versions: [1]
    shared: false
    edge_type: symbol_table
    emitted_in: [h5policy/pickles/h5_group.pk]
    message: symbol-table node reserved field is nonzero

  H5_CORRUPT_MTIME_MESSAGE_SIZE:
    severity: corrupt
    scope: local_decode
    invariant: envelope.mtime_encoding
    record: message_envelope
    versions: [1]
    shared: false
    edge_type: message
    emitted_in: [h5policy/pickles/h5_messages.pk]
    message: modification-time message has the wrong size

  H5_CORRUPT_MTIME_RESERVED:
    severity: corrupt
    scope: local_decode
    invariant: envelope.mtime_encoding
    record: message_envelope
    versions: [1]
    shared: false
    edge_type: message
    emitted_in: [h5policy/pickles/h5_messages.pk]
    message: modification-time reserved bytes are nonzero

  H5_CORRUPT_UNSUPPORTED_MTIME_VERSION:
    severity: corrupt
    scope: local_decode
    invariant: envelope.mtime_encoding
    record: message_envelope
    versions: [1]
    shared: false
    edge_type: message
    emitted_in: [h5policy/pickles/h5_messages.pk]
    message: modification-time message version is unsupported
