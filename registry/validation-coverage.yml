  - record: cache_image_dependency_graph
    section: "III.G — Metadata cache images and dependency graphs"
    scope: reference_graph
    semantic_boundary: cache-image envelopes, checksums, body replay, and dependency-graph closure/order
    invariants:
      - id: mdci.entry_count
        finding: H5_CORRUPT_MDCI_ENTRY_COUNT
      - id: mdci.entry_extent
        finding: H5_CORRUPT_MDCI_ENTRY_OVERRUNS_IMAGE
      - id: mdci.length_match
        finding: H5_CORRUPT_MDCI_LENGTH_MISMATCH
      - id: mdci.header_complete
        finding: H5_CORRUPT_CACHE_IMAGE_MESSAGE_TOO_SMALL
      - id: mdci.supported_version
        finding: H5_CORRUPT_UNSUPPORTED_CACHE_IMAGE_VERSION
      - {id: mdci.block_header_complete, finding: H5_CORRUPT_MDCI_HEADER_TOO_SMALL}
      - {id: mdci.block_version_supported, finding: H5_CORRUPT_MDCI_BLOCK_VERSION}
      - {id: mdci.block_flags_valid, finding: H5_CORRUPT_MDCI_BLOCK_FLAGS}
      - {id: mdci.entry_header_valid, finding: [H5_CORRUPT_MDCI_ENTRY_ADDRESS, H5_CORRUPT_MDCI_ENTRY_FLAGS, H5_CORRUPT_MDCI_ENTRY_LENGTH]}
      # Entry file addresses must be unique. libhdf5 keys reconstructed entries by
      # address and its duplicate check fails reconstruction mid-build, unwinding a
      # pinned flush-dependency graph through a double-free/NULL-deref cleanup.
      # §5 — the three single-byte enums in an entry header are in range.
      # libhdf5 bounds them on the READ path (H5C__reconstruct_cache_entry);
      # the write-side H5C__decode_cache_image_entry only asserts.  type_id
      # selects a cache client class on both sides, so it is a dispatch
      # selector, not a label.  Ring 0 is excluded: the read path bounds only
      # the top of that range, so libhdf5 opens it.
      - {id: mdci.entry_class_valid, finding: H5_CORRUPT_MDCI_ENTRY_CLASS}
      - {id: mdci.entry_addr_unique, finding: H5_CORRUPT_MDCI_DUPLICATE_ENTRY_ADDRESS}
      # An entry's signed lru_rank must agree with its IN_LRU flag (0x02): in the LRU
      # implies rank >= 0, out of it implies rank == -1. libhdf5 only asserts this
      # (H5Cimage.c:2813), so a Release reconstruction proceeds on an inconsistent
      # LRU description; poc_dos.h5's entry 0 (rank 2816, IN_LRU clear) is this case.
      - {id: mdci.entry_lru_consistent, finding: H5_CORRUPT_MDCI_ENTRY_LRU_INCONSISTENT}
      # Every flush-dependency parent address must name an entry present in the image.
      # A dangling parent reaches libhdf5's "fd parent not in cache?!?" failure
      # (H5Cimage.c:2533), which unwinds a partially built, pinned graph through the
      # same unsafe cleanup; poc_dos.h5's parent 0x18000000 is this route.
      - {id: mdci.parent_addr_resolvable, finding: H5_CORRUPT_MDCI_PARENT_ADDR_UNRESOLVED}
      # A parent address that names the entry's OWN address is a distinct defect:
      # it always resolves, so parent_addr_resolvable can never see it. libhdf5
      # rejects it one layer later, at H5Centry.c:3836 ("Child entry flush
      # dependency parent can't be itself") via H5Cimage.c:2547 -- a different
      # diagnostic from the dangling case, hence a separate invariant. Longer
      # cycles need no invariant: parents resolve only against entries already
      # decoded, so a 2-cycle's forward reference is already unresolvable.
      - {id: mdci.parent_addr_not_self, finding: H5_CORRUPT_MDCI_PARENT_ADDR_SELF}
      - {id: mdci.no_trailing_bytes, finding: H5_CORRUPT_MDCI_TRAILING_BYTES}
      - {id: mdci.checksum_valid, finding: H5_CORRUPT_BAD_CHECKSUM}
      # Every address or extent this family decodes must lie inside the file.
      - {id: mdci.address_in_file, finding: [H5_CORRUPT_OFFSET_OUT_OF_FILE, H5_CORRUPT_LENGTH_OVERFLOW]}
      # The on-disk magic of every structure this family decodes must match.
      - {id: mdci.signature_valid, finding: H5_CORRUPT_BAD_SIGNATURE}
      # Size and offset arithmetic must stay inside the validator's domain.
      - {id: mdci.size_arithmetic, finding: H5_CORRUPT_LENGTH_OVERFLOW}
      # An MDCI body must be reached by a type-aware decoder before the walk can
      # complete. Unhandled cache-client classes remain an explicit refusal.
      - {id: mdci.body_reached, finding: H5_UNSUPPORTED_PICKLE_COVERAGE_GAP}
    backlog:
      validator: h5policy MDCI/cache-image envelope and replay decoder
      stable_findings:
        - H5_CORRUPT_MDCI_ENTRY_COUNT
        - H5_CORRUPT_MDCI_ENTRY_OVERRUNS_IMAGE
        - H5_CORRUPT_MDCI_LENGTH_MISMATCH
        - H5_CORRUPT_CACHE_IMAGE_MESSAGE_TOO_SMALL
        - H5_CORRUPT_UNSUPPORTED_CACHE_IMAGE_VERSION
      fixtures:
        - h5policy/tests/expected/valid-cache_image.yml
        - h5policy/tests/expected/cve-mdci_entry_offby_header.yml
        - h5policy/tests/expected/malformed-cache_image_body_bad_ohdr.yml
        - h5policy/tests/expected/malformed-cache_image_bad_checksum.yml
      source_cases:
        - corpus seed 29
      entry_point_driver: h5cve H5Fget_mdc_image_info/H5Fget_mdc_size bounded image and object traversal canary
      ci_checks: entry-count/extent/checksum checks, body replay, dependency-order validation, timeout, and no-crash assertions
    tests:
      - {path: h5policy/tests/expected/valid-cache_image.yml, asserts: mdci.entry_extent}
      - {path: h5policy/tests/expected/cve-mdci_entry_offby_header.yml, asserts: mdci.entry_extent}
      - {path: h5policy/tests/expected/malformed-cache_image_body_bad_ohdr.yml, asserts: mdci.body_reached}
      - {path: h5policy/tests/expected/malformed-cache_image_bad_checksum.yml, asserts: mdci.checksum_valid}
      - {path: h5policy/tests/expected/malformed-mdci_duplicate_entry_address.yml, asserts: mdci.entry_addr_unique}
      - {path: h5policy/tests/expected/malformed-mdci_entry_lru_inconsistent.yml, asserts: mdci.entry_lru_consistent}
      - {path: h5policy/tests/expected/malformed-mdci_parent_addr_unresolved.yml, asserts: mdci.parent_addr_resolvable}
      - {path: h5policy/tests/expected/malformed-mdci_parent_addr_self.yml, asserts: mdci.parent_addr_not_self}
      - {path: h5policy/tests/expected/valid-empty.yml, asserts: cache_image_dependency_graph.bypass_unexercised}
    validators: {h5policy: partial, hdf5: partial}
    coverage_status: partial
    migration_status: oracle-partial

  - record: dataspace_dimension
    section: "IV.A.2.i — Dataspaces and dimension arithmetic"
