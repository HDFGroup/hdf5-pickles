  - record: address_space_bounds
    section: "III.A — File address space and EOA bounds"
    scope: local_decode
    semantic_boundary: address representability, end-of-address, and file-space extents
    invariants:
      - id: address.offset_in_file
        finding: [H5_CORRUPT_OFFSET_OUT_OF_FILE, H5_CORRUPT_LENGTH_OVERFLOW]
      - id: address.length_representable
        finding: H5_CORRUPT_LENGTH_EXCEEDS_U64
      # The superblock extension is file-level metadata, not a graph object.
      # An in-file, well-formed address is still wrong if it names an object
      # header the graph also reaches; libhdf5 catches the same thing through
      # metadata-cache ring bookkeeping rather than a bounds check.
      - id: address.no_extension_alias
        finding: H5_CORRUPT_SUPERBLOCK_EXTENSION_ALIAS
      # The superblock fixes the target object's role as a group.
      - id: address.root_object_group
        finding: H5_CORRUPT_ROOT_OBJECT_NOT_GROUP
      # The validator DECODES this family's structures rather than skipping
      # them; the finding fires where coverage stops.
      - {id: address.decode_coverage, finding: H5_UNSUPPORTED_PICKLE_COVERAGE_GAP}
      # h5policy's library-compatibility target deliberately refuses a legal
      # 16-byte on-disk length width because the selected libhdf5 target cannot
      # decode it safely.  This is not a structural-corruption claim.
      - {id: address.library_compatibility, finding: H5_UNSUPPORTED_PICKLE_COVERAGE_GAP}
    tests:
      # The contiguous extent libhdf5 enforces is the COMPUTED one, addr +
      # nelmts*datatype_size against the raw-data EOA (H5Dcontig.c:399-411), not
      # the size the layout message stores.  The v1 case also covers the
      # newly-decoded v1/v2 contiguous address.
      - {path: h5policy/tests/expected/malformed-contiguous_computed_extent_past_eof.yml, asserts: address.offset_in_file}
      - {path: h5policy/tests/expected/malformed-contiguous_v1_computed_extent_past_eof.yml, asserts: address.offset_in_file}
      - {path: h5policy/tests/expected/valid-userblock_earliest.yml, asserts: address.offset_in_file}
      - {path: h5policy/tests/expected/malformed-inflated_eoa_ext_addr.yml, asserts: address.offset_in_file}
      - {path: h5policy/tests/expected/malformed-inflated_eoa_ext_addr.yml, asserts: address_space_bounds.unexercised_on_open_reject}
      - {path: h5policy/tests/expected/malformed-ext_addr_aliases_root.yml, asserts: address.no_extension_alias}
      - {path: h5policy/tests/expected/malformed-root_object_not_group.yml, asserts: address.root_object_group}
      - {path: h5policy/tests/expected/valid-wide_length_one.yml, asserts: address.library_compatibility}
    validators: {h5policy: enforced, hdf5: partial}
    coverage_status: covered
    migration_status: oracle-enforced

  - record: chunk_index
    section: "IV.A.2.k — Chunk index structures"
    scope: aggregate_object
    semantic_boundary: chunk-index child pointers, cycles, records, and extents
    invariants:
      - {id: chunk.child_address, finding: [H5_CORRUPT_CHUNK_INDEX_CHILD_ADDRESS, H5_CORRUPT_OFFSET_OUT_OF_FILE]}
      - {id: chunk.no_cycle, finding: H5_CORRUPT_CHUNK_INDEX_CYCLE}
      - {id: chunk.record_layout, finding: H5_CORRUPT_V2_BTREE_RECORD_LAYOUT}
      - {id: chunk.record_size, finding: H5_CORRUPT_V2_BTREE_RECORD_SIZE}
      - {id: chunk.unlimited_dimension, finding: H5_CORRUPT_CHUNK_INDEX_WITHOUT_UNLIMITED_DIM}
      - {id: chunk.stored_size, finding: H5_CORRUPT_CHUNK_STORED_SIZE}
      # Raw chunk data and file metadata must occupy disjoint bytes.  libhdf5's
      # allocator guarantees it on write and nothing re-checks it on read, so a
      # chunk address pointing into metadata is served silently: measured, an
      # unfiltered chunk pointed at offset 0 returns the file's own
      # "\x89HDF\r\n\x1a\n" signature as int32 dataset values, and h5dump
      # exits 0.  An arbitrary in-file read, no error, no crash.  The pre-existing
      # bound was only addr + size <= file_size, which any in-file address meets.
      # Enforced from both sides (chunk-then-metadata and metadata-then-chunk)
      # because the graph walk can reach either first; both registries are
      # hard-capped so the added cost cannot scale with file size.
      # See registry/cases/chunk-data-over-metadata.yml.
      - {id: chunk.data_disjoint_from_metadata, finding: H5_CORRUPT_RAW_DATA_OVERLAPS_METADATA}
      # And disjoint from other raw data: two datasets sharing bytes is not a
      # feature HDF5 has, so an overlap means one serves the other's values.
      # Measured: crossing two datasets' chunks made /a return /b's data with
      # h5dump at rc=0.
      - {id: chunk.data_disjoint_from_data, finding: H5_CORRUPT_RAW_DATA_OVERLAPS_DATA}
      # v1 B-tree chunk keys are ordered by chunk offset and libhdf5 SEARCHES on
      # that order, so two keys claiming one offset make a chunk unreachable and
      # serve another in its place.  Measured: h5dump exits 0 returning chunk
      # (0,5)'s bytes at (0,0), with the displaced region coming back as the fill
      # value.  Covers BOTH leaf keys and internal-node separators since
      # 2026-08-23; a bad separator is the worse case, losing a whole subtree
      # (measured: 57 of 130 values returned as the fill value, h5dump rc=0).
      - {id: chunk.key_order, finding: H5_CORRUPT_CHUNK_KEY_ORDER}
      - {id: chunk.index_type_known, finding: H5_CORRUPT_UNKNOWN_CHUNK_INDEX_TYPE}
      - {id: chunk.btree_version_supported, finding: H5_CORRUPT_UNSUPPORTED_V2_BTREE_VERSION}
      - {id: chunk.btree_node_header, finding: H5_CORRUPT_V2_BTREE_NODE_HEADER}
      - {id: chunk.btree_node_size, finding: H5_CORRUPT_V2_BTREE_NODE_SIZE}
      - {id: chunk.btree_root_count, finding: H5_CORRUPT_V2_BTREE_ROOT_COUNT}
      - {id: chunk.btree_split_merge, finding: H5_CORRUPT_V2_BTREE_SPLIT_MERGE}
      - {id: chunk.extensible_array_identity, finding: [H5_CORRUPT_EXTENSIBLE_ARRAY_BACKPOINTER, H5_CORRUPT_EXTENSIBLE_ARRAY_BLOCK_HEADER, H5_CORRUPT_EXTENSIBLE_ARRAY_BLOCK_OFFSET, H5_CORRUPT_EXTENSIBLE_ARRAY_CLIENT_ID]}
      - {id: chunk.extensible_array_geometry, finding: [H5_CORRUPT_EXTENSIBLE_ARRAY_GEOMETRY, H5_CORRUPT_EXTENSIBLE_ARRAY_INDEX_ADDRESS]}
      - {id: chunk.extensible_array_version, finding: H5_CORRUPT_UNSUPPORTED_EXTENSIBLE_ARRAY_VERSION}
      - {id: chunk.fixed_array_client, finding: H5_CORRUPT_FIXED_ARRAY_CLIENT_ID}
      # A fixed array is pre-sized once, from the dataspace's maximum extent,
      # and never grown; libhdf5 recomputes that capacity from the file on the
      # copy path without ever checking it against the stored one.
      - {id: chunk.fixed_array_capacity, finding: H5_CORRUPT_FIXED_ARRAY_EXTENT_MISMATCH}
      - {id: chunk.fixed_array_version, finding: H5_CORRUPT_UNSUPPORTED_FIXED_ARRAY_VERSION}
      # Every address or extent this family decodes must lie inside the file.
      - {id: chunk.address_in_file, finding: [H5_CORRUPT_OFFSET_OUT_OF_FILE, H5_CORRUPT_LENGTH_OVERFLOW]}
      # The on-disk magic of every structure this family decodes must match.
      - {id: chunk.signature_valid, finding: H5_CORRUPT_BAD_SIGNATURE}
      # Stored checksum must match the block, and the block must be large
      # enough to hold it.
      - {id: chunk.checksum_valid, finding: H5_CORRUPT_BAD_CHECKSUM}
      # Size and offset arithmetic must stay inside the validator's domain.
      - {id: chunk.size_arithmetic, finding: H5_CORRUPT_LENGTH_OVERFLOW}
      # The validator DECODES this family's structures rather than skipping
      # them; the finding fires where coverage stops.
      - {id: chunk.decode_coverage, finding: H5_UNSUPPORTED_PICKLE_COVERAGE_GAP}
      - {id: chunk.traversal_budget, finding: H5_RESOURCE_BTREE_DEPTH}
      - {id: chunk.btree_node_level, finding: H5_CORRUPT_BTREE_NODE_LEVEL}
      - {id: chunk.btree_entry_count, finding: H5_CORRUPT_BTREE_NODE_ENTRY_COUNT}
    tests:
      - {path: h5policy/tests/expected/valid-chunk_v2_btree.yml, asserts: chunk.record_layout}
      - {path: h5policy/tests/expected/valid-chunk_v1_btree_fletcher.yml, asserts: chunk.stored_size}
      - {path: h5policy/tests/expected/valid-chunk_fixed_array_partial_page.yml, asserts: chunk.size_arithmetic}
      - {path: h5policy/tests/expected/valid-userblock_chunked.yml, asserts: chunk.data_disjoint_from_metadata}
      - {path: h5policy/tests/expected/malformed-bad_chunk_v2_btree_child_address.yml, asserts: chunk.child_address}
      - {path: h5policy/tests/expected/malformed-bad_chunk_v2_btree_cycle.yml, asserts: chunk.no_cycle}
      - {path: h5policy/tests/expected/malformed-bad_ext_array_without_unlimited_dim.yml, asserts: chunk.unlimited_dimension}
      - {path: h5policy/tests/expected/malformed-bad_fixed_array_extent_mismatch.yml, asserts: chunk.fixed_array_capacity}
      - {path: h5policy/tests/expected/malformed-chunk_data_over_metadata.yml, asserts: chunk.data_disjoint_from_metadata}
      - {path: h5policy/tests/expected/malformed-fixed_array_paged_element_over_metadata.yml, asserts: chunk.data_disjoint_from_metadata}
      - {path: h5policy/tests/expected/malformed-chunk_data_over_other_dataset.yml, asserts: chunk.data_disjoint_from_data}
      - {path: h5policy/tests/expected/malformed-chunk_duplicate_key_offset.yml, asserts: chunk.key_order}
      - {path: h5policy/tests/expected/malformed-chunk_internal_separator_order.yml, asserts: chunk.key_order}
      - {path: h5policy/tests/expected/malformed-chunk_stored_size_below_framing.yml, asserts: chunk.stored_size}
      - {path: h5policy/tests/expected/malformed-zero_v2_btree_record_size.yml, asserts: chunk.record_size}
      - {path: h5policy/tests/expected/malformed-v2_btree_leaf_capacity_zero.yml, asserts: chunk.record_size}
      - {path: h5policy/tests/expected/malformed-bad_chunk_v2_btree_deep_checksum.yml, asserts: chunk.checksum_valid}
      - {path: h5policy/tests/expected/malformed-bad_ext_array_deep_checksum.yml, asserts: chunk.checksum_valid}
      - {path: h5policy/tests/expected/malformed-bad_btree_v1_child_level.yml, asserts: chunk.btree_node_level}
      - {path: h5policy/tests/unit_limits.pk, asserts: chunk.traversal_budget}
      - {path: h5policy/tests/expected/valid-simple_dataset.yml, asserts: chunk_index.bypass_unexercised}
    validators: {h5policy: enforced, hdf5: partial}
    coverage_status: covered
    migration_status: oracle-enforced

  - record: dense_index
    section: "IV.A.2.f — Dense link indexes and heaps"
    scope: aggregate_object
    semantic_boundary: dense-index IDs, counts, duplicate/missing entries, and heap references
    invariants:
      - {id: dense.count_match, finding: H5_CORRUPT_DENSE_INDEX_COUNT_MISMATCH}
      - {id: dense.unique_name_ids, finding: H5_CORRUPT_DENSE_NAME_INDEX_DUPLICATE_ID}
      - {id: dense.link_name_nonempty, finding: H5_CORRUPT_LINK_NAME_EMPTY}
      - {id: dense.link_name_charset, finding: H5_CORRUPT_LINK_NAME_CHARSET}
      - {id: dense.corder_index_closure, finding: [H5_CORRUPT_DENSE_CORDER_INDEX_DUPLICATE_ID, H5_CORRUPT_DENSE_CORDER_INDEX_MISSING_ID, H5_CORRUPT_DENSE_CORDER_INDEX_UNKNOWN_ID, H5_CORRUPT_DENSE_CORDER_MISMATCH]}
      - {id: dense.link_info_addresses, finding: [H5_CORRUPT_LINK_INFO_ADDRESS_PAIR, H5_CORRUPT_LINK_INFO_CORDER_ADDRESS]}
      - {id: dense.btree_child_pointer, finding: H5_CORRUPT_V2_BTREE_CHILD_POINTER}
      - {id: dense.btree_no_cycle, finding: H5_CORRUPT_V2_BTREE_CYCLE}
      - {id: dense.btree_unique_keys, finding: H5_CORRUPT_V2_BTREE_DUPLICATE_KEY}
      - {id: dense.btree_record_order, finding: H5_CORRUPT_V2_BTREE_RECORD_ORDER}
      - {id: dense.btree_record_type, finding: H5_CORRUPT_V2_BTREE_RECORD_TYPE}
      - {id: dense.btree_root, finding: H5_CORRUPT_V2_BTREE_ROOT}
      - {id: dense.btree_subtree_count, finding: H5_CORRUPT_V2_BTREE_SUBTREE_COUNT}
      - {id: dense.btree_total_count, finding: H5_CORRUPT_V2_BTREE_TOTAL_COUNT}
      - {id: dense.btree_node_header, finding: H5_CORRUPT_V2_BTREE_NODE_HEADER}
      # Shared v2-btree engine: role comes from the finding message (see the
      # grouped route rules), not from the code.
      - {id: dense.btree_record_size, finding: H5_CORRUPT_V2_BTREE_RECORD_SIZE}
      - {id: dense.btree_node_size, finding: H5_CORRUPT_V2_BTREE_NODE_SIZE}
      - {id: dense.btree_version_supported, finding: H5_CORRUPT_UNSUPPORTED_V2_BTREE_VERSION}
      # Every address or extent this family decodes must lie inside the file.
      - {id: dense.address_in_file, finding: [H5_CORRUPT_OFFSET_OUT_OF_FILE, H5_CORRUPT_LENGTH_OVERFLOW]}
      # The on-disk magic of every structure this family decodes must match.
      - {id: dense.signature_valid, finding: H5_CORRUPT_BAD_SIGNATURE}
      # Stored checksum must match the block, and the block must be large
      # enough to hold it.
      - {id: dense.checksum_valid, finding: H5_CORRUPT_BAD_CHECKSUM}
      # Size and offset arithmetic must stay inside the validator's domain.
      - {id: dense.size_arithmetic, finding: H5_CORRUPT_LENGTH_OVERFLOW}
      # The validator DECODES this family's structures rather than skipping
      # them; the finding fires where coverage stops.
      - {id: dense.decode_coverage, finding: H5_UNSUPPORTED_PICKLE_COVERAGE_GAP}
      - {id: dense.btree_record_layout, finding: H5_CORRUPT_V2_BTREE_RECORD_LAYOUT}
      - {id: dense.traversal_budget, finding: H5_RESOURCE_BTREE_DEPTH}
      - {id: dense.fractal_id_valid, finding: H5_CORRUPT_FRACTAL_HEAP_ID}
      # Mirror of heap.fractal_id_width for the dense LINK side: the type-6
      # record field is seven bytes, the type-9 one eight.
      - {id: dense.fractal_id_width, finding: H5_CORRUPT_FRACTAL_HEAP_ID_WIDTH}
      # A filtered dense-link heap embeds a filter pipeline in its header;
      # one shared decoder validates it, and the role in the message routes
      # it here rather than to the dataset-layout family.
      - {id: dense.pipeline_message_complete, finding: H5_CORRUPT_FILTER_PIPELINE_MESSAGE_TOO_SMALL}
      - {id: dense.filter_pipeline_bounds, finding: H5_CORRUPT_FILTER_PIPELINE_OVERRUNS_MESSAGE}
      - {id: dense.pipeline_version_supported, finding: H5_CORRUPT_UNSUPPORTED_FILTER_PIPELINE_VERSION}
      - {id: dense.dynamic_filter_policy, finding: H5_POLICY_DYNAMIC_FILTER}
      - {id: dense.filter_count_budget, finding: H5_RESOURCE_FILTER_COUNT}
      - {id: dense.filter_element_count, finding: H5_CORRUPT_FILTER_NELMTS_MISMATCH}
      - {id: dense.filtered_heap_checksum, finding: H5_CORRUPT_FILTERED_HEAP_NO_DBLOCK_CHECKSUM}
      # The heap header's doubling table -- table width, starting block size,
      # maximum direct block size, maximum heap size -- must be a geometry that
      # can exist.  One validator checks it for all three fractal-heap clients
      # because the record is the heap HEADER, not the index that owns it; the
      # role in the message routes each occurrence to its own family, as with
      # the filtered-heap findings above.  libhdf5 states these rules in
      # H5HF__hdr_create but under `#ifndef NDEBUG` and only when WRITING;
      # H5HF__dtable_decode validates nothing on read, and width 0 then makes
      # H5HF__hdr_compute_free_space loop with no reachable exit while indexing
      # three heap arrays.  See registry/cases/fractal-heap-doubling-table.yml.
      - {id: dense.fractal_doubling_table, finding: H5_CORRUPT_FRACTAL_HEAP_DOUBLING_TABLE}
    backlog:
      validator: h5policy dense-link/index validators (existing implementation; slice pending)
      stable_findings: [H5_CORRUPT_DENSE_INDEX_COUNT_MISMATCH, H5_CORRUPT_DENSE_NAME_INDEX_DUPLICATE_ID, H5_CORRUPT_FRACTAL_HEAP_ID]
      candidate_findings: [H5_CORRUPT_LINK_NAME_EMPTY]
      fixtures: [h5policy/tests/expected/malformed-filtered_dense_link_pipeline_overrun.yml]
      source_cases: [cve/49_extern-traverse-strlen-oob.h5]
      entry_point_driver: bounded H5Lvisit2/H5Ovisit3 dense-index canary
      ci_checks: count consistency, ID uniqueness, heap bounds, and no-crash assertions
    tests:
      - {path: h5policy/tests/expected/valid-dense_links.yml, asserts: dense.count_match}
      # dense.btree_record_type had NO test at all until these two: the rule was
      # declared here and in the heap family, and nothing pinned it.  Two
      # fixtures because the link and attribute walkers hardcode different
      # expected clients (5 and 8) and neither shares the check.
      - {path: h5policy/tests/expected/malformed-dense_link_btree_wrong_client.yml, asserts: dense.btree_record_type}
      - {path: h5policy/tests/expected/malformed-dense_attr_btree_wrong_client.yml, asserts: dense.btree_record_type}
      - {path: h5policy/tests/expected/malformed-dense_link_frhp_width_zero.yml, asserts: dense.fractal_doubling_table}
      - {path: h5policy/tests/expected/malformed-dense_link_frhp_width_not_power_of_two.yml, asserts: dense.fractal_doubling_table}
      - {path: h5policy/tests/expected/malformed-dense_link_frhp_no_root_rows.yml, asserts: dense.fractal_doubling_table}
      - {path: h5policy/tests/expected/malformed-dense_link_frhp_first_row_overflow.yml, asserts: dense.fractal_doubling_table}
      - {path: h5policy/tests/expected/malformed-bad_dense_btin_checksum.yml, asserts: dense_index.oracle_rejection}
      - {path: h5policy/tests/expected/valid-empty.yml, asserts: dense_index.bypass_unexercised}
    validators: {h5policy: enforced, hdf5: partial}
    coverage_status: partial
    migration_status: oracle-partial

  - record: heap_structures
    section: "III.E — Local and fractal heaps"
    scope: aggregate_object
    semantic_boundary: heap segments, free lists, IDs, offsets, and extents
    invariants:
      - id: heap.offset_bounds
        finding: [H5_CORRUPT_HEAP_OFFSET_OUT_OF_BOUNDS, H5_CORRUPT_LENGTH_OVERFLOW, H5_CORRUPT_OFFSET_OUT_OF_FILE, H5_CORRUPT_LENGTH_OVERFLOW]
      - id: heap.free_list_valid
        finding: H5_CORRUPT_LOCAL_HEAP_FREE_LIST
      - id: heap.fractal_id_valid
        finding: H5_CORRUPT_FRACTAL_HEAP_ID
      - id: heap.global_progress
        finding: H5_RESOURCE_GLOBAL_HEAP_INFINITE_LOOP
      - {id: heap.attribute_info_complete, finding: H5_CORRUPT_ATTRIBUTE_INFO_MESSAGE_TOO_SMALL}
      - {id: heap.attribute_info_no_trailing_bytes, finding: H5_CORRUPT_ATTRIBUTE_INFO_TRAILING_BYTES}
      - {id: heap.attribute_info_version, finding: H5_CORRUPT_UNSUPPORTED_ATTRIBUTE_INFO_VERSION}
      - {id: heap.attribute_info_flags, finding: H5_CORRUPT_ATTRIBUTE_INFO_FLAGS}
      - {id: heap.attribute_info_addresses, finding: [H5_CORRUPT_ATTRIBUTE_INFO_ADDRESS_PAIR, H5_CORRUPT_ATTRIBUTE_INFO_CORDER_ADDRESS]}
      - {id: heap.fractal_id_width, finding: H5_CORRUPT_FRACTAL_HEAP_ID_WIDTH}
      # The dense-ATTRIBUTE side of the shared doubling-table check; see
      # dense.fractal_doubling_table for why one validator serves three
      # families.
      - {id: heap.fractal_doubling_table, finding: H5_CORRUPT_FRACTAL_HEAP_DOUBLING_TABLE}
      - {id: heap.fractal_version_supported, finding: H5_CORRUPT_UNSUPPORTED_FRACTAL_HEAP_VERSION}
      # §5 — every fractal-heap block names the header that owns it.  libhdf5
      # enforces it in both deserializers (H5HFcache.c, "incorrect heap header
      # address for direct block"); without it a heap ID resolves through a
      # block belonging to another heap, so records are decoded with this
      # heap's geometry over that heap's bytes.
      - {id: heap.fractal_block_owner, finding: H5_CORRUPT_FRACTAL_HEAP_BACKPOINTER}
      - {id: heap.local_reserved_zero, finding: H5_CORRUPT_LOCAL_HEAP_RESERVED}
      - {id: heap.local_version_supported, finding: H5_CORRUPT_UNSUPPORTED_LOCAL_HEAP_VERSION}
      # The local-heap counterpart of heap.fractal_block_owner above, and the
      # mirror image of it: a fractal-heap block stores its owner on disk, so
      # ownership is checkable in place, but a local-heap data segment has no
      # header, signature or back-pointer at all.  The only witness is the SET
      # of prefixes, so this is a file-scoped uniqueness invariant -- same
      # family as the superblock-extension alias check.  libhdf5 cannot detect
      # it either and does not survive it: the metadata cache is keyed by
      # address, so the second heap gets a cache HIT, its deserialize callback
      # never runs, and it goes live with dblk and dblk_image NULL.
      # See registry/cases/local-heap-dblk-address-aliased-across-heaps.yml.
      - {id: heap.local_data_segment_unique, finding: H5_CORRUPT_LOCAL_HEAP_DATA_SEGMENT_ALIAS}
      - {id: heap.btree_node_header, finding: H5_CORRUPT_V2_BTREE_NODE_HEADER}
      - {id: heap.btree_record_size, finding: H5_CORRUPT_V2_BTREE_RECORD_SIZE}
      - {id: heap.btree_node_size, finding: H5_CORRUPT_V2_BTREE_NODE_SIZE}
      - {id: heap.btree_version_supported, finding: H5_CORRUPT_UNSUPPORTED_V2_BTREE_VERSION}
      # The creation-order walker in h5_dense_links.pk serves the dense
      # ATTRIBUTE index too (record type 9), so the whole v2-btree shape of a
      # type-9 tree is this family's, not dense_index's.  The role in the
      # finding message selects between them; see the grouped route rules.
      - {id: heap.btree_child_pointer, finding: H5_CORRUPT_V2_BTREE_CHILD_POINTER}
      - {id: heap.btree_no_cycle, finding: H5_CORRUPT_V2_BTREE_CYCLE}
      - {id: heap.btree_unique_keys, finding: H5_CORRUPT_V2_BTREE_DUPLICATE_KEY}
      - {id: heap.btree_record_order, finding: H5_CORRUPT_V2_BTREE_RECORD_ORDER}
      - {id: heap.btree_record_type, finding: H5_CORRUPT_V2_BTREE_RECORD_TYPE}
      - {id: heap.btree_root, finding: H5_CORRUPT_V2_BTREE_ROOT}
      - {id: heap.btree_total_count, finding: H5_CORRUPT_V2_BTREE_TOTAL_COUNT}
      # A dense attribute record carries the same flag byte as an object-header
      # message, and the same combinations are invalid.
      - {id: heap.message_flags, finding: H5_CORRUPT_MESSAGE_FLAG_COMBINATION}
      # Same for a filtered dense-ATTRIBUTE heap's embedded pipeline.
      - {id: heap.pipeline_message_complete, finding: H5_CORRUPT_FILTER_PIPELINE_MESSAGE_TOO_SMALL}
      - {id: heap.filter_pipeline_bounds, finding: H5_CORRUPT_FILTER_PIPELINE_OVERRUNS_MESSAGE}
      - {id: heap.pipeline_version_supported, finding: H5_CORRUPT_UNSUPPORTED_FILTER_PIPELINE_VERSION}
      - {id: heap.dynamic_filter_policy, finding: H5_POLICY_DYNAMIC_FILTER}
      - {id: heap.filter_count_budget, finding: H5_RESOURCE_FILTER_COUNT}
      - {id: heap.filter_element_count, finding: H5_CORRUPT_FILTER_NELMTS_MISMATCH}
      - {id: heap.filtered_heap_checksum, finding: H5_CORRUPT_FILTERED_HEAP_NO_DBLOCK_CHECKSUM}
      # The type-9 creation-order index must describe exactly the same heap
      # objects as its name index.
      - {id: heap.corder_index_closure, finding: [H5_CORRUPT_DENSE_CORDER_INDEX_DUPLICATE_ID, H5_CORRUPT_DENSE_CORDER_INDEX_MISSING_ID, H5_CORRUPT_DENSE_CORDER_INDEX_UNKNOWN_ID, H5_CORRUPT_DENSE_CORDER_MISMATCH]}
      # Every address or extent this family decodes must lie inside the file.
      - {id: heap.address_in_file, finding: [H5_CORRUPT_OFFSET_OUT_OF_FILE, H5_CORRUPT_LENGTH_OVERFLOW]}
      # The on-disk magic of every structure this family decodes must match.
      - {id: heap.signature_valid, finding: H5_CORRUPT_BAD_SIGNATURE}
      # Stored checksum must match the block, and the block must be large
      # enough to hold it.
      - {id: heap.checksum_valid, finding: H5_CORRUPT_BAD_CHECKSUM}
      # Size and offset arithmetic must stay inside the validator's domain.
      - {id: heap.size_arithmetic, finding: H5_CORRUPT_LENGTH_OVERFLOW}
      # The validator DECODES this family's structures rather than skipping
      # them; the finding fires where coverage stops.
      - {id: heap.decode_coverage, finding: H5_UNSUPPORTED_PICKLE_COVERAGE_GAP}
      - {id: heap.btree_subtree_count, finding: H5_CORRUPT_V2_BTREE_SUBTREE_COUNT}
      - {id: heap.btree_record_layout, finding: H5_CORRUPT_V2_BTREE_RECORD_LAYOUT}
      - {id: heap.traversal_budget, finding: H5_RESOURCE_BTREE_DEPTH}
    backlog:
      validator: h5policy heap validators (existing implementation; slice pending)
      stable_findings: [H5_CORRUPT_HEAP_OFFSET_OUT_OF_BOUNDS, H5_CORRUPT_LOCAL_HEAP_FREE_LIST, H5_CORRUPT_FRACTAL_HEAP_ID]
      candidate_findings: [H5_RESOURCE_GLOBAL_HEAP_INFINITE_LOOP]
      fixtures: [h5policy/tests/expected/malformed-bad_heap_segment.yml]
      source_cases: [cve/53_gheap-infinite-loop.h5]
      entry_point_driver: bounded heap lookup/iteration canary
      ci_checks: segment extents, free-list progress, ID bounds, timeout, and no-crash assertions
    fuzz_targets:
      engine: h5mutate
      recipes:
      # Typed doubling-table mutations.  Each was verified to emit its intended
      # finding on FOUR structurally different heap-bearing seeds --
      # valid/dense_links.h5, valid/dense_attribute.h5, valid/sohm_btree.h5 and
      # coverage/sohm_huge_btree.h5 -- which is the property a recipe has over a
      # committed fixture: one mutation covers dense-link, dense-attribute, SOHM
      # and SOHM-huge heaps, where the corpus needs a separate base file each.
      - recipe: frhp_width_zero
        mutation: doubling-table width of zero
        asserts: heap.fractal_doubling_table
        status: built
        verification:
          count_and_extent_boundaries:
          - zero
      - recipe: frhp_width_not_power_of_two
        mutation: doubling-table width of 3, which is not a power of two
        asserts: heap.fractal_doubling_table
        status: built
      - recipe: frhp_no_root_rows
        mutation: declared heap size exactly one bit under the first row
        asserts: heap.fractal_doubling_table
        status: built
        verification:
          count_and_extent_boundaries:
          - n_minus_1
      - recipe: frhp_first_row_overflow
        mutation: declared heap size two bits under the first row, wrapping max_root_rows
        asserts: heap.fractal_doubling_table
        status: built
        verification:
          integer_overflow_and_allocation_budget:
          - integer_overflow
      # REJECTED, not planned: a start block size below a direct block's prefix.
      # Measured on the same four seeds, it never emits the intended
      # H5_CORRUPT_LENGTH_OVERFLOW -- the dense seeds reject it as
      # H5_CORRUPT_FRACTAL_HEAP_ID and the SOHM seed reports a coverage gap --
      # because the field is consumed by several checks whose order depends on
      # the seed.  malformed/dblock_size_below_floor.h5 pins one base file and
      # stays the right instrument for it.  See the note in h5policy/tools/h5mutate.
    tests:
      - {path: h5policy/tests/expected/valid-dense_attribute.yml, asserts: heap.fractal_id_valid}
      - {path: h5policy/tests/expected/malformed-dense_attr_frhp_width_zero.yml, asserts: heap.fractal_doubling_table}
      - {path: h5policy/tests/expected/malformed-bad_dense_fhdb_owner.yml, asserts: heap.fractal_block_owner}
      - {path: h5policy/tests/expected/malformed-bad_dense_fhib_owner.yml, asserts: heap.fractal_block_owner}
      - {path: h5policy/tests/expected/malformed-bad_dense_attr_corder_leaf_checksum.yml, asserts: heap_structures.oracle_rejection}
      - {path: h5policy/tests/expected/valid-userblock_earliest.yml, asserts: heap_structures.bypass_unexercised}
      # H5HL_offset_into's bound (H5HL.c:391) is reached for every symbol-table
      # entry, soft links included, so h5policy's bound must be too.
      - {path: h5policy/tests/expected/malformed-softlink_name_offset_oob.yml, asserts: heap.offset_bounds}
      # A soft link's TARGET PATH offset lives in the scratch pad and goes
      # through the same H5HL_offset_into (H5Gent.c:391).
      - {path: h5policy/tests/expected/malformed-softlink_value_offset_oob.yml, asserts: heap.offset_bounds}
    validators: {h5policy: enforced, hdf5: partial}
    coverage_status: partial
    migration_status: oracle-partial

  - record: shared_messages_legacy
    section: "III.D/IV.A — Shared messages and legacy compatibility"
    scope: reference_graph
    semantic_boundary: shared-message references, versions, placement, and legacy padding
    invariants:
      - {id: legacy.mapping, finding: H5_CORRUPT_MAPPING_FAILED}
      - {id: legacy.dangerous_message_policy, finding: H5_POLICY_LEGACY_DANGEROUS_MESSAGE}
      - {id: sohm.child_address, finding: H5_CORRUPT_SOHM_BTREE_CHILD_ADDRESS}
      - {id: sohm.no_cycle, finding: H5_CORRUPT_SOHM_BTREE_CYCLE}
      - {id: sohm.location, finding: H5_CORRUPT_SOHM_LOCATION}
      - {id: legacy.v1_reference_count, finding: H5_CORRUPT_REFERENCE_COUNT_IN_V1_OBJECT_HEADER}
      - {id: shared.storage_address, finding: H5_CORRUPT_SOHM_STORAGE_ADDRESS}
      - {id: shared.message_complete, finding: H5_CORRUPT_SHARED_MESSAGE_TOO_SMALL}
      - {id: shared.no_cycle, finding: H5_CORRUPT_SHARED_MESSAGE_CYCLE}
      - {id: shared.message_version, finding: H5_CORRUPT_SHARED_MESSAGE_VERSION}
      - {id: shared.storage_location, finding: H5_CORRUPT_SHARED_MESSAGE_LOCATION}
      - {id: shared.target_message_type, finding: H5_CORRUPT_SHARED_MESSAGE_TARGET_TYPE}
      # A committed (shared) datatype is reached through a shared message but is
      # itself an object header, and h5_shared.pk decodes that header's version
      # prefix.  Distinct from shared.message_version above, which is the version
      # of the shared MESSAGE, not of the header it points at.
      - {id: shared.object_header_version, finding: H5_CORRUPT_UNSUPPORTED_OBJECT_HEADER_VERSION}
      # h5_shared.pk walks that header's chunk itself, so a message overrunning
      # it is this family's; h5_dispatch.pk's identical check on an ordinary
      # object header is object_header_continuation's.
      - {id: shared.chunk_envelope, finding: H5_CORRUPT_MESSAGE_OVERRUNS_CHUNK}
      # Same for a filtered SOHM heap's embedded pipeline.
      - {id: sohm.pipeline_message_complete, finding: H5_CORRUPT_FILTER_PIPELINE_MESSAGE_TOO_SMALL}
      - {id: sohm.filter_pipeline_bounds, finding: H5_CORRUPT_FILTER_PIPELINE_OVERRUNS_MESSAGE}
      - {id: sohm.pipeline_version_supported, finding: H5_CORRUPT_UNSUPPORTED_FILTER_PIPELINE_VERSION}
      - {id: sohm.dynamic_filter_policy, finding: H5_POLICY_DYNAMIC_FILTER}
      - {id: sohm.filter_count_budget, finding: H5_RESOURCE_FILTER_COUNT}
      - {id: sohm.filter_element_count, finding: H5_CORRUPT_FILTER_NELMTS_MISMATCH}
      - {id: legacy.old_mtime_encoding, finding: [H5_CORRUPT_OLD_MTIME_FORMAT, H5_CORRUPT_OLD_MTIME_MESSAGE_SIZE, H5_CORRUPT_OLD_MTIME_RANGE, H5_CORRUPT_OLD_MTIME_RESERVED]}
      - {id: legacy.refcount_encoding, finding: [H5_CORRUPT_REFCOUNT_MESSAGE_SIZE, H5_CORRUPT_UNSUPPORTED_REFCOUNT_VERSION]}
      - {id: sohm.message_complete, finding: H5_CORRUPT_SOHM_MESSAGE_TOO_SMALL}
      - {id: sohm.version_supported, finding: H5_CORRUPT_SOHM_VERSION}
      - {id: sohm.index_definition, finding: [H5_CORRUPT_SOHM_INDEX_COUNT, H5_CORRUPT_SOHM_INDEX_TYPE, H5_CORRUPT_SOHM_MESSAGE_TYPES, H5_CORRUPT_SOHM_PHASE_CHANGE]}
      - {id: sohm.message_count, finding: H5_CORRUPT_SOHM_MESSAGE_COUNT}
      - {id: sohm.reference_count, finding: H5_CORRUPT_SOHM_REFERENCE_COUNT}
      - {id: sohm.heap_id, finding: H5_CORRUPT_SOHM_HEAP_ID}
      - {id: sohm.huge_object, finding: H5_CORRUPT_SOHM_HUGE_OBJECT}
      # A huge object exists only because it exceeded the heap's maximum
      # managed size; libhdf5 asserts that on write (H5HFhuge.c:291) and
      # never re-checks it on read, so for a FILTERED record the decoded
      # size that sizes the caller's buffer is unbounded from below.
      - {id: sohm.huge_decoded_size, finding: H5_CORRUPT_SOHM_HUGE_OBJECT_BELOW_MANAGED_MAX}
      # The sibling arm: two lengths live in one filtered huge record -- the
      # stored length the pipeline consumes and the decoded size that sizes the
      # caller's buffer -- and libhdf5 never relates them
      # (src/H5HFhuge.c:749-761).  Decidable without decoding wherever the
      # filter's output extent is a function of its client data; silent, by
      # design, where it is not.
      - {id: sohm.filtered_huge_decoded_size, finding: H5_CORRUPT_SOHM_FILTERED_HUGE_DECODED_SIZE}
      - {id: sohm.object_header_address, finding: H5_CORRUPT_SOHM_OBJECT_HEADER_ADDRESS}
      - {id: sohm.filter_mask, finding: H5_CORRUPT_FILTER_MASK}
      - {id: sohm.reserved_zero, finding: H5_CORRUPT_RESERVED_FIELD}
      - {id: sohm.btree_node_header, finding: H5_CORRUPT_V2_BTREE_NODE_HEADER}
      - {id: sohm.btree_record_size, finding: H5_CORRUPT_V2_BTREE_RECORD_SIZE}
      - {id: sohm.btree_node_size, finding: H5_CORRUPT_V2_BTREE_NODE_SIZE}
      - {id: sohm.btree_subtree_count, finding: H5_CORRUPT_V2_BTREE_SUBTREE_COUNT}
      - {id: sohm.btree_root_count, finding: H5_CORRUPT_V2_BTREE_ROOT_COUNT}
      - {id: sohm.btree_split_merge, finding: H5_CORRUPT_V2_BTREE_SPLIT_MERGE}
      - {id: sohm.fractal_version_supported, finding: H5_CORRUPT_UNSUPPORTED_FRACTAL_HEAP_VERSION}
      # Every address or extent this family decodes must lie inside the file.
      - {id: sohm.address_in_file, finding: [H5_CORRUPT_OFFSET_OUT_OF_FILE, H5_CORRUPT_LENGTH_OVERFLOW]}
      # The on-disk magic of every structure this family decodes must match.
      - {id: sohm.signature_valid, finding: H5_CORRUPT_BAD_SIGNATURE}
      # Stored checksum must match the block, and the block must be large
      # enough to hold it.
      - {id: sohm.checksum_valid, finding: H5_CORRUPT_BAD_CHECKSUM}
      # Size and offset arithmetic must stay inside the validator's domain.
      - {id: sohm.size_arithmetic, finding: H5_CORRUPT_LENGTH_OVERFLOW}
      # Managed, tiny, and unfiltered huge SOHM bodies are dispatched through
      # their normal message decoders. The finding is now reserved for a
      # filtered heap body or another explicitly bounded resolution edge.
      - {id: sohm.decode_coverage, finding: H5_UNSUPPORTED_PICKLE_COVERAGE_GAP}
      - {id: sohm.traversal_budget, finding: H5_RESOURCE_BTREE_DEPTH}
      - {id: sohm.btree_entry_count, finding: H5_CORRUPT_BTREE_NODE_ENTRY_COUNT}
      - {id: sohm.filtered_heap_checksum, finding: H5_CORRUPT_FILTERED_HEAP_NO_DBLOCK_CHECKSUM}
      # The shared-message side of the doubling-table check.  It is validated on
      # the heap ENVELOPE, which is walked for every heap the master table
      # names, rather than on heap-ID resolution: a SOHM heap whose doubling
      # table libhdf5 cannot survive was accepted with zero findings while the
      # only check lived on a resolution path no message happened to take.
      - {id: sohm.fractal_doubling_table, finding: H5_CORRUPT_FRACTAL_HEAP_DOUBLING_TABLE}
    backlog:
      validator: h5policy shared-message/legacy validators (existing implementation; slice pending)
      stable_findings: [H5_CORRUPT_REFERENCE_COUNT_IN_V1_OBJECT_HEADER, H5_CORRUPT_UNSUPPORTED_BTREEK_VERSION, H5_CORRUPT_LENGTH_OVERFLOW]
      candidate_findings: [H5_CORRUPT_MAPPING_FAILED]
      fixtures: [h5policy/tests/expected/malformed-bad_duplicate_dataspace_message.yml]
      source_cases: [cve/37_sizeof-size-uninit-length.h5]
      entry_point_driver: bounded shared-message resolution and legacy object-open canary
      ci_checks: reference-count closure, version handling, padding checks, and no-crash assertions
    tests:
      - {path: h5policy/tests/expected/valid-shared_attr_datatype.yml, asserts: shared.storage_address}
      - {path: h5policy/tests/expected/coverage-sohm_huge_btree.yml, asserts: sohm.huge_object}
      - {path: h5policy/tests/expected/coverage-sohm_tiny.yml, asserts: sohm.decode_coverage}
      - {path: h5policy/tests/expected/malformed-bad_sohm_btree_child_address.yml, asserts: sohm.child_address}
      - {path: h5policy/tests/expected/malformed-sohm_frhp_width_zero.yml, asserts: sohm.fractal_doubling_table}
      # The VALID control for the doubling-table rule: a legal power-of-two
      # width other than the only one libhdf5 writes must still be accepted, so
      # the check is pinned to the format's rule and not to that default.
      - {path: h5policy/tests/expected/valid-sohm_frhp_width8.yml, asserts: sohm.fractal_doubling_table}
      - {path: h5policy/tests/expected/malformed-sohm_filtered_huge_below_managed_max.yml, asserts: sohm.huge_decoded_size}
      # The control: a filtered huge index declaring 8192 against the same 4096
      # ceiling must stay silent, so the check is pinned to the format rule and
      # not to the fixture.  It cannot be a `valid/` file -- resolving a shared
      # message out of a filtered heap would mean running the filter.
      - {path: h5policy/tests/expected/coverage-sohm_filtered_huge.yml, asserts: sohm.huge_decoded_size}
      - {path: h5policy/tests/expected/malformed-sohm_filtered_huge_decoded_size_mismatch.yml, asserts: sohm.filtered_huge_decoded_size}
      # The deflate fallback control: an undecidable pipeline must not be
      # guessed at, so both huge-size checks stay silent on it.
      - {path: h5policy/tests/expected/coverage-sohm_filtered_huge_undecidable.yml, asserts: sohm.filtered_huge_decoded_size}
      - {path: h5policy/tests/expected/valid-userblock_latest.yml, asserts: shared_messages_legacy.bypass_unexercised}
    validators: {h5policy: enforced, hdf5: partial}
    coverage_status: partial
    migration_status: oracle-partial

  - record: message_envelope
    section: "IV.A.2 — Object-header messages and legacy envelopes"
    scope: local_decode
    semantic_boundary: message versions, flags, declared lengths, and padding
    invariants:
      - {id: envelope.layout_minimum_size, finding: H5_CORRUPT_LAYOUT_MESSAGE_TOO_SMALL}
      - {id: envelope.object_header_version, finding: H5_CORRUPT_UNSUPPORTED_OBJECT_HEADER_VERSION}
      - {id: envelope.message_type_encoding, finding: H5_CORRUPT_OBJECT_HEADER_MESSAGE_TYPE_RANGE}
      - {id: envelope.unknown_message_policy, finding: H5_POLICY_UNKNOWN_MESSAGE}
      - {id: envelope.group_info_version, finding: H5_CORRUPT_UNSUPPORTED_GROUP_INFO_VERSION}
      - {id: envelope.group_info_trailing_bytes, finding: H5_CORRUPT_GROUP_INFO_TRAILING_BYTES}
      - {id: envelope.link_info_max_corder, finding: H5_CORRUPT_LINK_INFO_NEGATIVE_MAX_CORDER}
      - {id: envelope.link_info_trailing_bytes, finding: H5_CORRUPT_LINK_INFO_TRAILING_BYTES}
      - {id: envelope.message_flags, finding: H5_CORRUPT_MESSAGE_FLAG_COMBINATION}
      - {id: envelope.null_gap, finding: H5_CORRUPT_NULL_MESSAGE_GAP}
      - {id: envelope.message_count, finding: H5_CORRUPT_OBJECT_HEADER_MESSAGE_COUNT}
      - {id: envelope.symbol_table_cache_type, finding: H5_CORRUPT_SYMBOL_TABLE_CACHE_TYPE}
      - {id: envelope.symbol_table_node_version, finding: H5_CORRUPT_UNSUPPORTED_SYMBOL_TABLE_NODE_VERSION}
      - {id: envelope.attribute_complete, finding: [H5_CORRUPT_ATTRIBUTE_MESSAGE_TOO_SMALL, H5_CORRUPT_ATTRIBUTE_OVERRUNS_MESSAGE]}
      - {id: envelope.message_size_alignment, finding: H5_CORRUPT_MESSAGE_SIZE_UNALIGNED}
      - {id: envelope.link_flags, finding: H5_CORRUPT_LINK_FLAGS}
      - {id: envelope.link_type, finding: H5_CORRUPT_LINK_TYPE}
      - {id: envelope.attribute_name_nonempty, finding: H5_CORRUPT_ATTRIBUTE_NAME_EMPTY}
      - {id: envelope.attribute_name_exact_length, finding: H5_CORRUPT_ATTRIBUTE_NAME_EMBEDDED_NUL}
      # Attribute raw value bytes are embedded in the attribute MESSAGE, so the
      # budget on them is this family's, like that message's other checks.
      - {id: envelope.single_value_budget, finding: H5_RESOURCE_SINGLE_VALUE_BYTES}
      - {id: envelope.attribute_version_supported, finding: H5_CORRUPT_UNSUPPORTED_ATTRIBUTE_VERSION}
      - {id: envelope.group_info_complete, finding: H5_CORRUPT_GROUP_INFO_MESSAGE_TOO_SMALL}
      - {id: envelope.group_info_flags, finding: H5_CORRUPT_GROUP_INFO_FLAGS}
      # A group declares its link storage with exactly one message -- symbol
      # table (old style) or link info (new style).  With neither, libhdf5's
      # lookup/iterate/info all fall into the old-format branch and fail on the
      # absent symbol-table message, so the object cannot be traversed.
      - {id: envelope.group_link_storage_present, finding: H5_CORRUPT_GROUP_MISSING_LINK_STORAGE}
      # A new-style group is written with the link-info/group-info pair; without
      # the group-info message no link can be inserted (H5G__obj_insert).  The
      # read paths guard the message with H5O_msg_exists and default it, so this
      # is a warning, not a corruption claim.
      - {id: envelope.group_info_present, finding: H5_ADVISORY_GROUP_INFO_MISSING}
      - {id: envelope.link_info_complete, finding: H5_CORRUPT_LINK_INFO_MESSAGE_TOO_SMALL}
      - {id: envelope.link_info_flags, finding: H5_CORRUPT_LINK_INFO_FLAGS}
      - {id: envelope.link_info_version_supported, finding: H5_CORRUPT_UNSUPPORTED_LINK_INFO_VERSION}
      - {id: envelope.link_message_complete, finding: H5_CORRUPT_LINK_MESSAGE_TOO_SMALL}
      # h5policy_validate_link_payload decodes a link identically for an
      # object-header message and for a dense index's heap record; the role in
      # the finding message says which.  These are this family's half.
      - {id: envelope.link_name_nonempty, finding: H5_CORRUPT_LINK_NAME_EMPTY}
      - {id: envelope.address_in_file, finding: [H5_CORRUPT_OFFSET_OUT_OF_FILE, H5_CORRUPT_LENGTH_OVERFLOW]}
      - {id: envelope.link_version_supported, finding: H5_CORRUPT_UNSUPPORTED_LINK_VERSION}
      - {id: envelope.message_shareable, finding: H5_CORRUPT_MESSAGE_FLAG_UNSHAREABLE}
      - {id: envelope.name_nonempty, finding: H5_CORRUPT_NAME_MESSAGE_EMPTY}
      - {id: envelope.symbol_table_complete, finding: H5_CORRUPT_SYMBOL_TABLE_MESSAGE_TOO_SMALL}
      # An old-style group always has both a B-tree and a name heap; libhdf5
      # protects the heap unconditionally (H5Gstab.c:488), so an undefined
      # address is corrupt, not "no symbol table here".
      - {id: envelope.symbol_table_addresses_defined, finding: H5_CORRUPT_SYMBOL_TABLE_ADDRESS_UNDEFINED}
      - {id: envelope.symbol_table_reserved_zero, finding: H5_CORRUPT_SYMBOL_TABLE_NODE_RESERVED}
      - {id: envelope.mtime_encoding, finding: [H5_CORRUPT_MTIME_MESSAGE_SIZE, H5_CORRUPT_MTIME_RESERVED, H5_CORRUPT_UNSUPPORTED_MTIME_VERSION]}
      # Stored checksum must match the block, and the block must be large
      # enough to hold it.
      - {id: envelope.checksum_valid, finding: H5_CORRUPT_BAD_CHECKSUM}
      # Size and offset arithmetic must stay inside the validator's domain.
      - {id: envelope.size_arithmetic, finding: H5_CORRUPT_LENGTH_OVERFLOW}
      # The validator DECODES this family's structures rather than skipping
      # them; the finding fires where coverage stops.
      - {id: envelope.decode_coverage, finding: H5_UNSUPPORTED_PICKLE_COVERAGE_GAP}
      # An attribute VALUE is stored inside the object-header message, so a vlen
      # or legacy-region-reference attribute holds its global-heap IDs in
      # METADATA -- unlike a dataset, whose descriptors are raw payload and
      # outside this oracle's boundary.  Enforced with the same bounded
      # collection walker the VDS layout uses; the family split is in
      # registry/findings/routes/.
      - {id: attribute.heap_id_in_file, strategy: '§5 — the named collection lies within the permitted file region', finding: ['H5_CORRUPT_OFFSET_OUT_OF_FILE', 'H5_CORRUPT_LENGTH_OVERFLOW']}
      - {id: attribute.global_heap_header, strategy: '§5 — the named collection has a valid header', finding: ['H5_CORRUPT_BAD_SIGNATURE', 'H5_CORRUPT_GLOBAL_HEAP_HEADER']}
      - {id: attribute.global_heap_object, strategy: '§6 — every object in the named collection parses and advances the cursor', finding: ['H5_CORRUPT_GLOBAL_HEAP_OBJECT', 'H5_CORRUPT_LENGTH_OVERFLOW']}
      - {id: attribute.heap_object_present, strategy: '§6 — the referenced object index exists in the collection', finding: 'H5_CORRUPT_HEAP_OBJECT_MISSING'}
      - {id: attribute.heap_object_length, strategy: '§5 — an attribute heap ID declares exactly the size of its global-heap object', finding: 'H5_CORRUPT_ATTRIBUTE_HEAP_ID_LENGTH'}
      # A REGION reference's heap object is not opaque: it ends in a serialized
      # H5S selection that libhdf5 deserializes, sizing a coordinate buffer from
      # a file-supplied count.  In an ATTRIBUTE those bytes are metadata, so the
      # same sizer the VDS layout uses is applied here -- one validator, two
      # roles (h5policy_selection_size, ROLE_PARAMS in tools/message_routing.py).
      - {id: attribute.reference_blob_extent, strategy: '§5 — a reference blob''s token width and declared selection size fit its heap object', finding: 'H5_CORRUPT_REFERENCE_BLOB_EXTENT'}
      - {id: attribute.selection_extent, strategy: '§5 — the serialized selection sizes exactly within the heap object that holds it', finding: ['H5_CORRUPT_SELECTION', 'H5_CORRUPT_LENGTH_OVERFLOW']}
      - {id: attribute.selection_rank, strategy: '§5 — the serialized selection rank is 1..H5S_MAX_RANK', finding: 'H5_CORRUPT_SELECTION_RANK'}
      - {id: attribute.selection_flags, strategy: '§5 — the serialized selection sets no unknown flag bits', finding: 'H5_CORRUPT_SELECTION_FLAGS'}
      - {id: attribute.selection_enc_size, strategy: '§5 — the serialized selection offset/point encoding size is 2, 4 or 8', finding: 'H5_CORRUPT_SELECTION_ENC_SIZE'}
    tests:
      - {path: h5policy/tests/expected/valid-continuation_chunks.yml, asserts: envelope.message_flags}
      - {path: h5policy/tests/expected/malformed-bad_message_flag_combination.yml, asserts: envelope.message_flags}
      - {path: h5policy/tests/expected/malformed-multifault_scaleoffset.yml, asserts: envelope.message_type_encoding}
      - {path: h5policy/tests/expected/valid-attr_heap_ids.yml, asserts: [attribute.global_heap_header, attribute.global_heap_object, attribute.heap_object_present]}
      - {path: h5policy/tests/expected/valid-attr_null_vlen_userblock.yml, asserts: attribute.heap_id_in_file}
      - {path: h5policy/tests/expected/valid-attr_vlen_array_heap_ids.yml, asserts: attribute.heap_object_present}
      - {path: h5policy/tests/expected/valid-attr_empty_vlen_heap_id.yml, asserts: attribute.global_heap_object}
      - {path: h5policy/tests/expected/malformed-attr_vlen_heap_idx_missing.yml, asserts: attribute.heap_object_present}
      - {path: h5policy/tests/expected/malformed-attr_vlen_heap_idx_past_nalloc.yml, asserts: attribute.heap_object_present}
      - {path: h5policy/tests/expected/malformed-attr_vlen_heap_addr_out_of_file.yml, asserts: attribute.heap_id_in_file}
      - {path: h5policy/tests/expected/malformed-attr_vlen_heap_seq_len_over.yml, asserts: attribute.heap_object_length}
      - {path: h5policy/tests/expected/malformed-attr_vlen_heap_seq_len_under.yml, asserts: attribute.heap_object_length}
      - {path: h5policy/tests/expected/malformed-attr_compound_vlen_member_idx.yml, asserts: attribute.heap_object_present}
      - {path: h5policy/tests/expected/malformed-attr_array_vlen_last_idx.yml, asserts: attribute.heap_object_present}
      - {path: h5policy/tests/expected/malformed-attr_gheap_object_size_wrap.yml, asserts: attribute.global_heap_object}
      - {path: h5policy/tests/expected/malformed-attr_gheap_dedup_many_refs.yml, asserts: attribute.global_heap_object}
      # The REVISED-reference encoding of the same two invariants: the heap ID
      # sits at offset 6 behind a type/flags/blob-size header rather than
      # behind a sequence length, so a vlen fixture cannot stand for it.
      - {path: h5policy/tests/expected/valid-attr_stdref_region.yml, asserts: [attribute.heap_object_present, attribute.heap_object_length]}
      - {path: h5policy/tests/expected/malformed-attr_stdref_blob_size_mismatch.yml, asserts: attribute.heap_object_length}
      - {path: h5policy/tests/expected/malformed-attr_stdref_heap_idx_missing.yml, asserts: attribute.heap_object_present}
      # The serialized selection inside a region reference's heap object, both
      # blob layouts.  The revised fixture pins the 1 + token_size + 8 offset
      # derivation; valid/attr_stdref_region.h5 is the control that proves it is
      # not simply rejecting everything.
      - {path: h5policy/tests/expected/malformed-attr_region_sel_blocks_over.yml, asserts: attribute.selection_extent}
      - {path: h5policy/tests/expected/malformed-attr_stdref_sel_blocks_over.yml, asserts: attribute.selection_extent}
      - {path: h5policy/tests/expected/malformed-attr_region_sel_rank.yml, asserts: attribute.selection_rank}
      - {path: h5policy/tests/expected/malformed-attr_region_sel_flags.yml, asserts: attribute.selection_flags}
      - {path: h5policy/tests/expected/malformed-attr_region_sel_enc_size.yml, asserts: attribute.selection_enc_size}
      - {path: h5policy/tests/expected/malformed-attr_stdref_blob_token_size.yml, asserts: attribute.reference_blob_extent}
      - {path: h5policy/tests/expected/malformed-attr_stdref_blob_sel_bytes.yml, asserts: attribute.reference_blob_extent}
      - {path: h5policy/tests/expected/valid-attr_heap_ids.yml, asserts: [attribute.selection_extent, attribute.reference_blob_extent]}
      - {path: h5policy/tests/expected/valid-attr_stdref_region.yml, asserts: [attribute.selection_extent, attribute.reference_blob_extent]}
      - {path: h5policy/tests/expected/malformed-bad_unknown_message_fail_always.yml, asserts: envelope.message_type_encoding}
      - {path: h5policy/tests/expected/policy-unknown_message_skippable.yml, asserts: envelope.unknown_message_policy}
      - {path: h5policy/tests/expected/malformed-bad_object_header_message_count.yml, asserts: envelope.message_count}
      - {path: h5policy/tests/expected/malformed-bad_ohdr_v1_message_unaligned.yml, asserts: [envelope.message_size_alignment, envelope.null_gap]}
      - {path: h5policy/tests/expected/malformed-bad_attr_name_size_one.yml, asserts: envelope.attribute_name_nonempty}
      - {path: h5policy/tests/expected/malformed-bad_attr_name_embedded_nul.yml, asserts: envelope.attribute_name_exact_length}
      - {path: h5policy/tests/expected/malformed-bad_link_reserved_flags.yml, asserts: envelope.link_flags}
      - {path: h5policy/tests/expected/malformed-bad_link_type_invalid.yml, asserts: envelope.link_type}
      - {path: h5policy/tests/expected/malformed-bad_object_header_checksum_preparse.yml, asserts: envelope.checksum_valid}
      - {path: h5policy/tests/expected/malformed-bad_message_flag_combination.yml, asserts: message_envelope.unexercised_on_open_reject}
      - {path: h5policy/tests/expected/malformed-bad_group_missing_link_info.yml, asserts: envelope.group_link_storage_present}
      - {path: h5policy/tests/expected/malformed-bad_group_missing_group_info.yml, asserts: envelope.group_info_present}
      # The empty-name check applies to a SOFT LINK entry too: libhdf5 resolves
      # every entry's name before it looks at the cache type (H5Gent.c:379-385).
      - {path: h5policy/tests/expected/malformed-softlink_empty_name.yml, asserts: envelope.link_name_nonempty}
      - {path: h5policy/tests/expected/malformed-stab_heap_addr_undefined.yml, asserts: envelope.symbol_table_addresses_defined}
      - {path: h5policy/tests/expected/malformed-stab_btree_addr_undefined.yml, asserts: envelope.symbol_table_addresses_defined}
      # Positive control: defined addresses with no SNOD yet must accept.
      - {path: h5policy/tests/expected/valid-old_style_root_only.yml, asserts: envelope.symbol_table_addresses_defined}
    validators: {h5policy: enforced, hdf5: enforced}
    coverage_status: covered
    migration_status: oracle-enforced

  - record: validation_controls
    section: "Validation coordinator — address, free-space, and resource controls"
    scope: resource
    semantic_boundary: global validation limits and file-space control messages
    invariants:
      - {id: control.base_address, finding: [H5_CORRUPT_BASE_ADDRESS_MISMATCH, H5_CORRUPT_BAD_SIGNATURE]}
      - {id: control.fsm_section_count, finding: H5_CORRUPT_FSM_SECTION_COUNT}
      # A MEASURED invariant-A' gap, found by driving struct_deep mutants of
      # valid/fsm_persist.h5 past h5policy and the probe's free_space canary:
      # libhdf5's H5Fget_free_sections refuses a header declaring 32515 section
      # classes (H5FScache.c:270) while h5policy accepted the file with zero
      # findings under every profile.  The inflated count also made
      # control.fsm_section_type vacuous, since that bound is taken against the
      # stored count.
      - {id: control.fsm_class_count, finding: H5_CORRUPT_FSM_CLASS_COUNT}
      - {id: control.fsm_section_type, finding: H5_CORRUPT_FSM_SECTION_TYPE}
      - {id: control.link_depth, finding: H5_RESOURCE_LINK_TRAVERSAL_DEPTH}
      - {id: control.walk_operations, finding: H5_UNSUPPORTED_WALK_OPERATION_BUDGET}
      - {id: control.walk_time, finding: H5_UNSUPPORTED_WALK_TIME_BUDGET}
      - {id: control.wall_timeout, finding: H5_UNSUPPORTED_WALK_TIMEOUT}
      - {id: control.object_count, finding: H5_RESOURCE_OBJECT_COUNT}
      - {id: control.attribute_count, finding: H5_RESOURCE_ATTRIBUTE_COUNT}
      - {id: control.finding_limit, finding: H5_POLICY_FINDINGS_TRUNCATED}
      - {id: control.profile_valid, finding: H5_INTERNAL_INVALID_PROFILE}
      - {id: control.internal_error, finding: H5_INTERNAL_ERROR}
      - {id: control.metadata_ratio_advisory, finding: H5_ADVISORY_METADATA_RATIO}
      - {id: control.coverage_gap, finding: H5_UNSUPPORTED_PICKLE_COVERAGE_GAP}
      - {id: control.btree_k_encoding, finding: [H5_CORRUPT_BTREEK_MESSAGE_SIZE, H5_CORRUPT_BTREEK_VALUE, H5_CORRUPT_UNSUPPORTED_BTREEK_VERSION]}
      - {id: control.btree_k_placement, finding: H5_CORRUPT_BTREEK_PLACEMENT}
      - {id: control.driver_info_encoding, finding: [H5_CORRUPT_DRVINFO_LENGTH, H5_CORRUPT_DRVINFO_MESSAGE_TOO_SMALL, H5_CORRUPT_UNSUPPORTED_DRVINFO_VERSION]}
      - {id: control.driver_info_placement, finding: H5_CORRUPT_DRVINFO_PLACEMENT}
      # v0/v1 files carry driver info in a standalone block at the superblock's
      # driver-info address rather than in a superblock-extension message, so
      # its length has no containing object header to be bounded against. The
      # block's whole extent -- address + 16-byte header + declared length --
      # must lie within the ceiling. libhdf5 bounds the length against nothing:
      # it extends the EOA to cover itself and then sizes the cache allocation,
      # so every downstream EOA check is satisfied by construction. This is the
      # invariant registry/cases/driver-info-block-fields-unbounded.yml carried
      # as the placeholder name `driver_info.len_bounded`.
      - {id: control.driver_info_extent, finding: H5_CORRUPT_DRVINFO_BLOCK_EXTENT}
      - {id: control.fsinfo_complete, finding: H5_CORRUPT_FSINFO_MESSAGE_TOO_SMALL}
      - {id: control.fsinfo_version_supported, finding: H5_CORRUPT_UNSUPPORTED_FSINFO_VERSION}
      - {id: control.free_space_page_size, finding: H5_CORRUPT_FREE_SPACE_PAGE_SIZE}
      - {id: control.fsm_acyclic, finding: [H5_CORRUPT_FSM_HEADER_CYCLE, H5_CORRUPT_FSM_SECTION_LIST_CYCLE]}
      - {id: control.fsm_section_list_header, finding: H5_CORRUPT_FSM_SECTION_LIST_HEADER}
      - {id: control.fsm_section_list_size, finding: H5_CORRUPT_FSM_SECTION_LIST_SIZE}
      - {id: control.fsm_section_bounded, finding: H5_CORRUPT_FSM_SECTION_OVERRUN}
      # A section's size selects a free-list bin via H5VM_log2_gen; libhdf5
      # sizes that bin array from the manager's max_sect_size and never checks
      # the two agree, so an oversized section indexes past the array. The bound
      # is relational to the header, so it is a distinct invariant from the
      # extent-in-file rule below, which the two PoC specimens happen to violate
      # as well.
      - {id: control.fsm_section_bin_range, finding: H5_CORRUPT_FSM_SECTION_SIZE_OVER_MAX}
      # The section RECORD is bounded by the section list (fsm_section_bounded);
      # this is the distinct invariant that the extent the record *describes*
      # lies within the file. Both address-range codes are shared, so the
      # mapping is resolved by message via the grouped route rules.
      - {id: control.fsm_section_extent, finding: [H5_CORRUPT_FSM_SECTION_EXTENT, H5_CORRUPT_OFFSET_OUT_OF_FILE, H5_CORRUPT_LENGTH_OVERFLOW]}
      - {id: control.fsm_version_supported, finding: H5_CORRUPT_UNSUPPORTED_FSM_VERSION}
      - {id: control.superblock_k_values, finding: H5_CORRUPT_SUPERBLOCK_K_VALUE}
      - {id: control.superblock_reserved_zero, finding: H5_CORRUPT_SUPERBLOCK_RESERVED}
      - {id: control.superblock_status_flags, finding: H5_CORRUPT_SUPERBLOCK_STATUS_FLAGS}
      - {id: control.superblock_status_flags_width, finding: H5_CORRUPT_SUPERBLOCK_STATUS_FLAGS_HIGH_BYTES}
      - {id: control.superblock_field_version, finding: H5_CORRUPT_UNSUPPORTED_SUPERBLOCK_FIELD_VERSION}
      # Every address or extent this family decodes must lie inside the file.
      - {id: control.address_in_file, finding: [H5_CORRUPT_OFFSET_OUT_OF_FILE, H5_CORRUPT_LENGTH_OVERFLOW]}
      # The on-disk magic of every structure this family decodes must match.
      - {id: control.signature_valid, finding: H5_CORRUPT_BAD_SIGNATURE}
      # Stored checksum must match the block, and the block must be large
      # enough to hold it.
      - {id: control.checksum_valid, finding: H5_CORRUPT_BAD_CHECKSUM}
    tests:
      - {path: h5policy/tests/expected/valid-fsm_persist.yml, asserts: [control.fsm_acyclic, control.fsm_section_list_header, control.fsm_section_list_size, control.fsm_section_bounded, control.fsm_version_supported, control.address_in_file, control.checksum_valid]}
      - {path: h5policy/tests/expected/malformed-bad_base_address.yml, asserts: control.base_address}
      - {path: h5policy/tests/expected/malformed-bad_fsm_section_count.yml, asserts: control.fsm_section_count}
      - {path: h5policy/tests/expected/malformed-bad_fsm_section_type.yml, asserts: control.fsm_section_type}
      - {path: h5policy/tests/expected/malformed-bad_fsm_section_bin_range.yml, asserts: control.fsm_section_bin_range}
      - {path: h5policy/tests/expected/valid-sohm_list.yml, asserts: control.fsm_section_extent}
      - {path: h5policy/tests/expected/malformed-bad_frhp_fsm_section_extent.yml, asserts: control.fsm_section_extent}
      - {path: h5policy/tests/expected/malformed-bad_fsm_section_list_checksum.yml, asserts: control.checksum_valid}
      - {path: h5policy/tests/expected/malformed-bad_fsinfo_page_size_over_max.yml, asserts: control.free_space_page_size}
      - {path: h5policy/tests/expected/malformed-bad_superblock_v0_status_flags_reserved.yml, asserts: control.superblock_status_flags}
      - {path: h5policy/tests/expected/malformed-bad_superblock_v0_status_flags_high.yml, asserts: control.superblock_status_flags_width}
      - {path: h5policy/tests/expected/malformed-drvinfo_block_bad_version.yml, asserts: control.driver_info_encoding}
      - {path: h5policy/tests/expected/malformed-drvinfo_block_len_past_eof.yml, asserts: control.driver_info_extent}
      - {path: h5policy/tests/expected/malformed-bad_signature.yml, asserts: control.signature_valid}
      - {path: h5policy/tests/expected/integration-deep_link-strict.yml, asserts: control.link_depth}
      - {path: h5policy/tests/expected/integration-walk_operation_budget.yml, asserts: control.walk_operations}
      - {path: h5policy/tests/expected/integration-invalid_profile_before_io.yml, asserts: control.profile_valid}
      - {path: h5policy/tests/expected/integration-metadata_ratio-warning.yml, asserts: control.metadata_ratio_advisory}
      - {path: h5policy/tests/unit_messages.pk, asserts: [control.btree_k_encoding, control.driver_info_encoding]}
      - {path: h5policy/tests/unit_fsinfo.pk, asserts: [control.fsinfo_complete, control.fsinfo_version_supported, control.free_space_page_size]}
      - {path: h5policy/tests/unit_limits.pk, asserts: [control.object_count, control.attribute_count, control.walk_operations, control.walk_time]}
      - {path: h5policy/tests/unit_consumer.pk, asserts: control.finding_limit}
      - {path: h5policy/tests/unit_report_wrapper.sh, asserts: control.wall_timeout}
    validators: {h5policy: enforced, hdf5: partial}
    coverage_status: covered
    migration_status: oracle-enforced
