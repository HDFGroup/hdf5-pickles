      - {path: h5policy/tests/expected/valid-empty.yml, asserts: btree_heap_index.bypass_unexercised}
    validators: {h5policy: enforced, hdf5: enforced}
    coverage_status: covered
    migration_status: oracle-enforced

  - record: dataset_layout_filter_fill
    section: "IV.A.2.k — Dataset layout, filters, and fill values"
    scope: aggregate_object
    semantic_boundary: layout dimensions and filter/fill-size arithmetic
    invariants:
      - id: layout.fill_value_size
        finding: H5_CORRUPT_FILL_VALUE_SIZE_MISMATCH
      - id: layout.logical_bytes_budget
        finding: H5_RESOURCE_LOGICAL_DATASET_BYTES
      - id: layout.filter_pipeline_bounds
        finding: H5_CORRUPT_FILTER_PIPELINE_OVERRUNS_MESSAGE
      - id: layout.filter_element_count
        finding: H5_CORRUPT_FILTER_NELMTS_MISMATCH
      # The count itself, before any cd_values are read: libhdf5's own first
      # argument check in each decoder.  scale-offset requires exactly
      # H5Z_SCALEOFFSET_TOTAL_NPARMS == 20 (H5Zscaleoffset.c:1122); n-bit is
      # self-describing and requires cd_nelmts == cd_values[0] (H5Znbit.c:935).
      # libhdf5 refuses the read either way, so a file failing these was one
      # h5policy accepted and no reader could use.
      - id: layout.filter_param_count
        finding: H5_CORRUPT_FILTER_PARAM_COUNT
      # A contiguous layout names its data extent by address, exactly as a chunk
      # record does, and being in-file is not enough -- it must also miss file
      # metadata.  Measured: address 0 makes libhdf5 return the superblock as
      # dataset values, rc=0.  Same shared check and same finding as
      # chunk.data_disjoint_from_metadata; the route shard splits them.
      # COMPACT needs no entry: its data sits inside the layout message.
      - id: layout.contiguous_data_disjoint_from_metadata
        finding: H5_CORRUPT_RAW_DATA_OVERLAPS_METADATA
      # The Single Chunk index keeps no records, so its one raw-data extent
      # never reached a chunk-index walker and was the last undeclared one in
      # the format.  See registry/cases/single-chunk-index-data-extent.yml.
      - id: layout.single_chunk_data_disjoint_from_metadata
        finding: H5_CORRUPT_RAW_DATA_OVERLAPS_METADATA
      - id: layout.contiguous_data_disjoint_from_data
        finding: H5_CORRUPT_RAW_DATA_OVERLAPS_DATA
      - id: layout.filter_element_size
        finding: H5_CORRUPT_FILTER_ELEMENT_SIZE_MISMATCH
      # Three statements, not one.  Bounding the dimension product at 2**32
      # unconditionally was measured wrong in BOTH directions: it rejected
      # files libhdf5 2.x writes by default, and it happened to catch the
      # 64-bit wrap only because the partial product crossed 2**32 first.
      # See registry/cases/chunk-dim-product-64bit-overflow.yml.
      #
      # (a) 64-bit representability.  libhdf5 accumulates the product
      # unchecked in H5Olayout.c and re-accumulates it on OPEN in
      # H5D__chunk_set_sizes behind a guard that cannot fire; a product that
      # wraps to zero reaches H5D__chunk_lock past libhdf5's own >4 GiB guard
      # (because it is zero) with only an assert left. This is the one with a
      # measured out-of-bounds read and write.
      - id: layout.chunk_size_product
        finding: H5_CORRUPT_CHUNK_SIZE_PRODUCT_OVERFLOW
      # (b) The 32-bit field belongs to the v1 B-tree index record, not to the
      # library. Confined to the layout versions with no encoded index type,
      # which are therefore always v1 B-tree indexed.
      - id: layout.chunk_size_32bit
        finding: H5_CORRUPT_CHUNK_SIZE_EXCEEDS_32BIT
      # (c) Portability, not corruption: >4 GiB below layout version 5 is
      # format-legal and libhdf5 opens it deliberately, but no pre-2.0.0
      # library can read it. Same advisory convention as the external-link and
      # VDS target-path notes.
      - id: layout.chunk_size_version_advisory
        finding: H5_ADVISORY_CHUNK_SIZE_REQUIRES_LAYOUT_V5
      - id: layout.rank_match
        finding: H5_CORRUPT_LAYOUT_RANK_MISMATCH
      - id: layout.chunk_size_budget
        finding: H5_RESOURCE_CHUNK_TOO_SMALL
      - id: layout.filter_decode_advisory
        finding: H5_ADVISORY_DECODE_FILTER
      - id: layout.dynamic_filter_policy
        finding: H5_POLICY_DYNAMIC_FILTER
      - id: layout.filtered_heap_checksum
        finding: H5_CORRUPT_FILTERED_HEAP_NO_DBLOCK_CHECKSUM
      # Class 3 is legal only from layout version 4 on; libhdf5 refuses it below
      # that at H5Olayout.c:122-123 (v1/v2) and :529-530 (v3).
      - {id: layout.virtual_version, finding: H5_CORRUPT_LAYOUT_VIRTUAL_VERSION}
      # libhdf5 never bounds the layout message's stored size (it recomputes the
      # extent from dataspace x datatype), so an out-of-file stored size is a
      # warning -- but the field is live for v3+ (dset_size, H5MF_xfree,
      # H5Dget_storage_size), so it is still reported.
      - {id: layout.contiguous_stored_size_advisory, finding: H5_ADVISORY_CONTIGUOUS_STORED_SIZE_PAST_EOF}
      - {id: layout.contiguous_stored_size_equals_extent, strategy: '§5 — a v3+ contiguous stored size equals nelmts x dt_size; write-path-fatal only, so advisory', finding: 'H5_ADVISORY_CONTIGUOUS_STORED_SIZE_MISMATCH'}
      - {id: layout.compact_size, finding: H5_CORRUPT_COMPACT_LAYOUT_SIZE_MISMATCH}
      - {id: layout.fill_message_complete, finding: H5_CORRUPT_FILL_VALUE_MESSAGE_TOO_SMALL}
      - {id: layout.fill_payload_bounded, finding: H5_CORRUPT_FILL_VALUE_OVERRUNS_MESSAGE}
      - {id: layout.fill_version_supported, finding: H5_CORRUPT_UNSUPPORTED_FILL_VALUE_VERSION}
      - {id: layout.fill_flags_defined, finding: H5_CORRUPT_FILL_VALUE_UNKNOWN_FLAGS}
      - {id: layout.fill_flags_consistent, finding: H5_CORRUPT_FILL_VALUE_FLAG_CONFLICT}
      - {id: layout.pipeline_message_complete, finding: H5_CORRUPT_FILTER_PIPELINE_MESSAGE_TOO_SMALL}
      - {id: layout.pipeline_version_supported, finding: H5_CORRUPT_UNSUPPORTED_FILTER_PIPELINE_VERSION}
      - {id: layout.dimensionality, finding: H5_CORRUPT_LAYOUT_DIMENSIONALITY}
      - {id: layout.class_known, finding: H5_CORRUPT_UNKNOWN_LAYOUT_CLASS}
      - {id: layout.version_supported, finding: H5_CORRUPT_UNSUPPORTED_LAYOUT_VERSION}
      - {id: layout.nbit_parameters, finding: [H5_CORRUPT_NBIT_PARAMS_CLASS, H5_CORRUPT_NBIT_PARAMS_OVERRUN, H5_CORRUPT_NBIT_MEMBER_BOUNDS]}
      # SEPARATE FROM nbit_parameters ON PURPOSE: that invariant is about the
      # parameter TREE -- classes known, indices inside cd_nelmts, members inside
      # their parent.  This one is a SEMANTIC bound on a single atomic node, and
      # it is the bound libhdf5 states and cannot enforce: its own guard adds
      # precision to offset in 32-bit unsigned arithmetic and wraps.
      - {id: layout.nbit_atomic_bounds, finding: H5_CORRUPT_NBIT_ATOMIC_BOUNDS}
      - {id: layout.chunk_dimensions_nonzero, finding: H5_CORRUPT_ZERO_CHUNK_DIMENSION}
      - {id: layout.filter_count_budget, finding: H5_RESOURCE_FILTER_COUNT}
      - {id: layout.filter_count_format_max, finding: H5_CORRUPT_FILTER_PIPELINE_TOO_MANY_FILTERS}
      - {id: layout.filter_name_alignment, finding: H5_CORRUPT_FILTER_NAME_LENGTH_UNALIGNED}
      - {id: layout.filter_name_terminated, finding: H5_CORRUPT_FILTER_NAME_NOT_TERMINATED}
      - {id: layout.filter_parameter_depth, finding: H5_RESOURCE_FILTER_PARAMETER_RECURSION_DEPTH}
      - {id: layout.chunk_count_budget, finding: H5_RESOURCE_CHUNK_COUNT}
      - {id: layout.metadata_bytes_budget, finding: H5_RESOURCE_ACCOUNTED_METADATA_BYTES}
      - {id: layout.metadata_ratio_budget, finding: H5_RESOURCE_METADATA_RATIO}
      - {id: layout.single_value_budget, finding: H5_RESOURCE_SINGLE_VALUE_BYTES}
      - {id: layout.contiguous_size, finding: H5_CORRUPT_CONTIGUOUS_LAYOUT_SIZE_MISMATCH}
      - {id: layout.dataset_present, finding: H5_CORRUPT_DATASET_MISSING_LAYOUT}
      - {id: layout.storage_extent, finding: H5_CORRUPT_DATASET_STORAGE_OVERFLOW}
      # Every address or extent this family decodes must lie inside the file.
      - {id: layout.address_in_file, finding: H5_CORRUPT_OFFSET_OUT_OF_FILE}
      # Size and offset arithmetic must stay inside the validator's domain.
      - {id: layout.size_arithmetic, finding: H5_CORRUPT_LENGTH_OVERFLOW}
    tests:
      - {path: h5policy/tests/expected/malformed-fill_value_size_mismatch.yml, asserts: layout.fill_value_size}
      - {path: h5policy/tests/expected/resource-huge_logical_dataset.yml, asserts: layout.logical_bytes_budget}
      - {path: h5policy/tests/expected/malformed-filtered_dense_link_pipeline_overrun.yml, asserts: layout.filter_pipeline_bounds}
      - {path: h5policy/tests/expected/malformed-scaleoffset_nelmts_mismatch.yml, asserts: layout.filter_element_count}
      - {path: h5policy/tests/expected/malformed-scaleoffset_param_count.yml, asserts: layout.filter_param_count}
      - {path: h5policy/tests/expected/malformed-nbit_param_count.yml, asserts: layout.filter_param_count}
      - {path: h5policy/tests/expected/malformed-contiguous_data_over_metadata.yml, asserts: layout.contiguous_data_disjoint_from_metadata}
      - {path: h5policy/tests/expected/malformed-scaleoffset_size_mismatch.yml, asserts: layout.filter_element_size}
      - {path: h5policy/tests/expected/malformed-chunk_4gib_v1_btree_index.yml, asserts: layout.chunk_size_32bit}
      - {path: h5policy/tests/expected/valid-chunk_4gib_layout_v5.yml, asserts: layout.chunk_size_32bit}
      - {path: h5policy/tests/expected/policy-chunk_4gib_layout_v4.yml, asserts: layout.chunk_size_version_advisory}
      - {path: h5policy/tests/expected/malformed-chunk_dim_product_wrap_v4.yml, asserts: layout.chunk_size_product}
      - {path: h5policy/tests/expected/malformed-chunk_dim_product_wrap_v5.yml, asserts: layout.chunk_size_product}
      - {path: h5policy/tests/expected/malformed-single_chunk_over_metadata.yml, asserts: layout.single_chunk_data_disjoint_from_metadata}
      - {path: h5policy/tests/expected/malformed-single_chunk_filtered_over_metadata.yml, asserts: layout.single_chunk_data_disjoint_from_metadata}
      - {path: h5policy/tests/expected/malformed-bad_layout_rank_mismatch.yml, asserts: layout.rank_match}
      - {path: h5policy/tests/expected/resource-tiny_chunks.yml, asserts: layout.chunk_size_budget}
      - {path: h5policy/tests/expected/malformed-filtered_dense_link_no_dblock_checksum.yml, asserts: layout.filtered_heap_checksum}
      # Class 3 is legal only from layout version 4 on, and libhdf5 refuses it
      # below that through two different doors (H5Olayout.c:123 and :530).
      - {path: h5policy/tests/expected/malformed-layout_virtual_version_v3.yml, asserts: layout.virtual_version}
      - {path: h5policy/tests/expected/malformed-layout_virtual_version_v1.yml, asserts: layout.virtual_version}
      # Negative control: the STORED size past EOF is a warning, never corrupt.
      - {path: h5policy/tests/expected/valid-contiguous_stored_size_past_eof.yml, asserts: layout.contiguous_stored_size_advisory}
      - {path: h5policy/tests/expected/valid-contig_unalloc_size_mismatch.yml, asserts: layout.contiguous_stored_size_equals_extent}
