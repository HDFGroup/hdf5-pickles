# h5policy validation-coverage manifest.
#
# One entry per record family: the invariants that family requires (strategy
# doc §5 / §11.5), the finding each maps to, where the oracle enforces it, the
# tests and fuzz targets that exercise it, and its migration status.
#
# `validators.h5policy` describes the ORACLE. `validators.hdf5` is a SEPARATE
# claim about libhdf5 and must be proven per §11.4-11.5, never inferred from
# h5policy's own verdict. `unverified` means exactly that: not yet established
# by an exact-build probe.
#
# Statuses:
#   coverage_status : covered | partial | coverage_gap
#   migration_status: oracle-enforced | oracle-partial | not-modeled
#   validators.*    : enforced | partial | unverified | not-modeled
#
# All 16 record families have catalogued vertical slices. `invariants[*].id`
# values are the shared keys that the finding catalog references; production
# codes whose semantic mapping is still pending are tracked in
# finding-backlog.yml.
schema_version: 1

records:

  - record: object_header_continuation
    section: "IV.A.2 — Object Headers and Object Header Messages"
    message_type: 0x0010
    versions: [1, 2]
    scope: reference_graph
    child_reference: object_header_chunk       # v2 chunks begin with 'OCHK'; v1 have no signature
    coordinator: h5policy_validate_msg_chunk    # h5policy/pickles/h5_dispatch.pk
    semantic_boundary: object-header continuation closure   # strategy §11.3

    # Interval model: the coordinator tracks each chunk's occupied [lo, hi)
    # extent (h5policy_cont_lo/_hi in h5_walk.pk), not bare start addresses, and
    # counts a chunk only after it clears the overlap gate.
    invariants:
      - id: continuation.local_encoding
        strategy: "§5 local validation — fields fully encoded, arithmetic representable"
        finding: null            # local decode; failure surfaces as a map/bounds error
      - id: continuation.target_in_file
        strategy: "§5 — target within the permitted file region"
        finding: [H5_CORRUPT_OFFSET_OUT_OF_FILE, H5_CORRUPT_LENGTH_OVERFLOW]
      - id: continuation.nonzero_extent
        strategy: "§5 — chunk has a message region to parse"
        finding: H5_CORRUPT_ZERO_CONTINUATION_CHUNK
      - id: continuation.no_source_overlap
        strategy: "§5 — target does not improperly overlap the current chunk"
        finding: H5_CORRUPT_SELF_REFERENTIAL_CONTINUATION
      - id: continuation.no_chunk_alias
        strategy: "§5 — target does not overlap another object-header chunk"
        finding: H5_CORRUPT_NON_PROGRESS_LOOP
      - id: continuation.valid_envelope
        strategy: "§5 — every chunk envelope (OCHK signature / size) is valid"
        finding: [H5_CORRUPT_MESSAGE_OVERRUNS_CHUNK, H5_CORRUPT_BAD_SIGNATURE]
      - id: continuation.valid_checksum
        strategy: "§5 — every chunk checksum is valid"
        finding: H5_CORRUPT_BAD_CHECKSUM
      - id: continuation.unique_counting
        strategy: "§5 — counts derive from the final set of validated unique chunks"
        finding: null            # counting rule; the budget itself is a resource finding
      - id: continuation.chunk_budget
        strategy: "§8 — bounded traversal under profile limits"
        finding: H5_RESOURCE_OBJECT_HEADER_CHUNKS

    validators:
      h5policy: enforced
      hdf5: enforced   # measured; see libhdf5-evidence.yml

    tests:
      - path: h5policy/tests/expected/malformed-continuation_overlaps_source.yml
        asserts: continuation.no_source_overlap
      - path: h5policy/tests/expected/valid-continuation_chunks.yml
        asserts: [continuation.valid_envelope, continuation.valid_checksum]
      - path: h5policy/tests/expected/integration-object_header_chunks.yml
        asserts: [continuation.chunk_budget, continuation.unique_counting]
      - path: h5policy/tests/unit_limits.pk
        asserts: [continuation.chunk_budget, continuation.unique_counting]

    fuzz_targets:
      seed: h5policy/tests/valid/continuation_chunks.h5
      engine: h5mutate                        # h5policy/tools/h5mutate (family --verify)
      recipes:                                # each self-validating against its invariant
        - status: built
          recipe: cont_overlap_source_start
          mutation: continuation target == source chunk start
          asserts: continuation.no_source_overlap
          verification:
            reference_semantics_cases: [self_reference, overlap]
        - status: built
          recipe: cont_overlap_source_inside
          mutation: continuation target a few bytes inside the source chunk
          asserts: continuation.no_source_overlap
          verification:
            reference_semantics_cases: [self_reference, overlap]
        - status: built
          recipe: cont_overlap_source_end
          mutation: continuation target on the source chunk's last byte
          asserts: continuation.no_source_overlap
          verification:
            reference_semantics_cases: [self_reference, overlap]
        - status: built
          recipe: cont_zero_size
          mutation: continuation with zero declared size
          asserts: continuation.nonzero_extent
          verification:
            count_and_extent_boundaries: [zero]
        - status: built
          recipe: cont_out_of_file
          mutation: continuation target past end of file
          asserts: continuation.target_in_file
          verification:
            count_and_extent_boundaries: [out_of_file]
        - status: built
          recipe: cont_alias_prior_chunk
          mutation: continuation aliases an already-decoded chunk
          asserts: continuation.no_chunk_alias
          verification:
            deep_nesting_and_non_progress: [non_progress]
            reference_semantics_cases: [duplicate_reference]
        - status: planned                     # needs a deeper seed / synthesised chain
          mutation: pending-node back edges, short and long cycles
        - status: planned
          mutation: message count vs validated unique-chunk count

    coverage_status: covered
    migration_status: oracle-enforced
    related_cases: []             # continuation self-reference family; no numbered case bundled yet

  # ── external-reference family: EFL, external links, VDS (strategy §7) ─────────
  # "External links and VDS mappings [and EFL] are decoded as bounded strings and
  # inert references ... external access occurs only during an explicitly
  # authorised activation step."  h5policy DENIES these features under untrusted
  # profiles (policy findings) and validates their record encoding; it never
  # opens a target.  The exact-build probe supplies the libhdf5 side: on
  # corpus seed 27 it caught libhdf5 opening the EFL target /etc/passwd --
  # a premature external open the oracle refuses.

  - record: external_file_list
    section: "IV.A.2.j — Data Storage: External Data Files (EFL)"
    message_type: 0x0007
    versions: [1]
    scope: policy                       # feature gate; record decode is record_local
    child_reference: external_file
    coordinator: h5policy_validate_external_file_list   # h5policy/pickles/h5_external.pk
    semantic_boundary: external file list message + its target-path decode
    invariants:
      - id: efl.no_external_open
        strategy: "§7 — inert reference; no external open before authorised activation"
        finding: H5_POLICY_EXTERNAL_STORAGE
      - id: efl.target_path_classified
        strategy: "§7 — classify the decoded target path (absolute/parent/relative), do not traverse"
        finding: [H5_ADVISORY_EXTERNAL_STORAGE_ABSOLUTE_PATH, H5_ADVISORY_EXTERNAL_STORAGE_PARENT_PATH, H5_ADVISORY_EXTERNAL_STORAGE_RELATIVE_PATH]
      - id: efl.segment_bounded
        finding: H5_ADVISORY_EXTERNAL_STORAGE_UNLIMITED_SEGMENT
      - id: efl.header_complete
        finding: H5_CORRUPT_EXTERNAL_FILE_LIST_TRUNCATED_HEADER
      - id: efl.supported_version
        finding: H5_CORRUPT_UNSUPPORTED_EXTERNAL_FILE_LIST_VERSION
      - id: efl.reserved_zero
        finding: H5_CORRUPT_EXTERNAL_FILE_LIST_RESERVED
      - id: efl.slot_count_consistent
        finding: H5_CORRUPT_EXTERNAL_FILE_LIST_SLOT_COUNT
      - id: efl.slots_present
        finding: H5_CORRUPT_EXTERNAL_FILE_LIST_TRUNCATED_SLOTS
      - id: efl.no_trailing_bytes
        finding: H5_CORRUPT_EXTERNAL_FILE_LIST_TRAILING_BYTES
      - id: efl.name_offset_in_heap
        finding: H5_CORRUPT_EXTERNAL_FILE_LIST_NAME_OFFSET
      - id: efl.name_nonempty
        finding: H5_CORRUPT_EXTERNAL_FILE_LIST_NAME_EMPTY
      - id: efl.segment_extent_representable
        finding: H5_CORRUPT_EXTERNAL_FILE_LIST_SEGMENT_OVERFLOW
      # Size and offset arithmetic must stay inside the validator's domain.
      - {id: efl.size_arithmetic, finding: H5_CORRUPT_LENGTH_OVERFLOW}
    validators:
      h5policy: enforced
      hdf5: enforced   # measured; see libhdf5-evidence.yml
    tests:
      - {path: h5policy/tests/expected/policy-external_storage.yml, asserts: efl.no_external_open}
      - {path: h5policy/tests/expected/policy-external_storage_parent_unlimited.yml, asserts: [efl.target_path_classified, efl.segment_bounded]}
      - {path: h5policy/tests/expected/malformed-bad_efl_slot_count.yml, asserts: efl.slot_count_consistent}
      - {path: h5policy/tests/expected/malformed-bad_efl_name_offset.yml, asserts: efl.name_offset_in_heap}
      - {path: h5policy/tests/expected/malformed-overflowing_efl_segment.yml, asserts: efl.segment_extent_representable}
    coverage_status: covered
    migration_status: oracle-enforced
    related_cases: [corpus-seed-27, corpus-seed-28, efl-absolute-target-path-arbitrary-read]   # EFL arbitrary read / write; the absolute-path case record

  - record: external_link
    section: "IV.A.2.f — Link Message (external link value)"
    message_type: 0x0006
    versions: [1]
    scope: policy
    child_reference: external_target_path
    coordinator: h5policy_validate_external_link        # h5policy/pickles/h5_dense_links.pk
    semantic_boundary: external link message value (file + object path)
    invariants:
      - id: elink.no_external_traverse
        strategy: "§7 — decode target, do not open the external file"
        finding: H5_POLICY_EXTERNAL_LINK
      - id: elink.no_user_defined_traverse
        strategy: "§7 — user-defined links remain inert and are never activated"
        finding: H5_POLICY_USER_DEFINED_LINK
      - id: elink.target_path_classified
        finding: [H5_ADVISORY_EXTERNAL_LINK_ABSOLUTE_PATH, H5_ADVISORY_EXTERNAL_LINK_PARENT_PATH, H5_ADVISORY_EXTERNAL_LINK_RELATIVE_PATH]
      - id: elink.message_complete
        finding: H5_CORRUPT_EXTERNAL_LINK_MESSAGE_TOO_SMALL
      - id: elink.info_complete
        finding: H5_CORRUPT_EXTERNAL_LINK_INFO_TOO_SMALL
      - id: elink.value_terminated
        strategy: "§1 — string searches bounded by their encoded region"
        finding: H5_CORRUPT_EXTERNAL_LINK_VALUE_NOT_TERMINATED
    validators:
      h5policy: enforced
      hdf5: enforced   # measured; see libhdf5-evidence.yml
    tests:
      - {path: h5policy/tests/expected/policy-external_link.yml, asserts: elink.no_external_traverse}
      - {path: h5policy/tests/expected/policy-external_link_parent-legacy.yml, asserts: elink.target_path_classified}
      - {path: h5policy/tests/expected/malformed-external_link_unterminated_value.yml, asserts: elink.value_terminated}
      - {path: h5policy/tests/expected/malformed-external_link_path_unterminated.yml, asserts: elink.value_terminated}
      - {path: h5policy/tests/expected/malformed-bad_external_link_info.yml, asserts: elink.info_complete}
    coverage_status: covered
    migration_status: oracle-enforced
    related_cases: [corpus-seed-49, corpus-seed-50]   # extern traverse / elink path traversal

  - record: virtual_dataset
    section: "IV.A.2.l — Data Layout Message (version 4, virtual)"
    message_type: 0x0008
    versions: [4]
    scope: policy
    child_reference: vds_source
    coordinator: h5policy_validate_vds_layout           # h5policy/pickles/h5_vds.pk
    semantic_boundary: virtual layout message + per-mapping source name/selection
    invariants:
      - id: vds.no_source_open
        strategy: "§7 — decode mappings as inert references; no source open before activation"
        finding: H5_POLICY_VDS
      - id: vds.source_path_classified
        finding: [H5_ADVISORY_VDS_ABSOLUTE_SOURCE, H5_ADVISORY_VDS_PARENT_SOURCE, H5_ADVISORY_VDS_RELATIVE_SOURCE]
      - id: vds.layout_complete
        finding: H5_CORRUPT_VDS_LAYOUT_TOO_SMALL
      - id: vds.mapping_header_complete
        finding: H5_CORRUPT_VDS_MAPPING_HEADER
      - id: vds.mapping_flags_valid
        finding: H5_CORRUPT_VDS_MAPPING_FLAGS
      - id: vds.no_mapping_trailing_bytes
        finding: H5_CORRUPT_VDS_MAPPING_TRAILING_BYTES
      - id: vds.selection_valid
        finding: H5_CORRUPT_SELECTION
      # A VDS mapping block holds the only FILE-RESIDENT serialized H5S
      # selections there are, two per mapping. libhdf5 validates three header
      # fields before any rank-dependent work, in H5S__hyper_deserialize
      # (src/H5Shyper.c) and H5S__point_deserialize (src/H5Spoint.c); each gets
      # its own invariant here so the finding names the field rather than the
      # selection. vds.selection_valid remains the fallback for a selection
      # that fails to size for any other reason.
      #
      # Rank must be 1..H5S_MAX_RANK. The zero end is the half that was missed:
      # a rank-0 regular hyperslab sizes its payload as 4 * 0 * enc == 0, so it
      # used to pass as a well-formed 14-byte selection.
      - id: vds.selection_rank
        finding: H5_CORRUPT_SELECTION_RANK
      # enc_size is set membership {2,4,8}, NOT a mask and NOT a range. libhdf5
      # filters it twice and the filters disagree: the `& ~ENC_SIZE_BITS` test
      # admits any subset of those bits (0, 6, 10, 12, 14 included) and the
      # switch that follows rejects everything but 2, 4 and 8 via its default
      # arm. The switch is the effective gate.
      - id: vds.selection_enc_size
        finding: H5_CORRUPT_SELECTION_ENC_SIZE
      # H5S_SELECT_FLAG_BITS is H5S_HYPER_REGULAR alone (0x01). Hyperslab
      # versions 2 and 3 only -- version 1 has no flags byte and point
      # selections have none at any version.
      - id: vds.selection_flags
        finding: H5_CORRUPT_SELECTION_FLAGS
      - id: vds.source_name_bounded
        strategy: "§1 — bounded string decode"
        finding: H5_CORRUPT_VDS_SOURCE_NAME
      - id: vds.heap_object_present
        finding: H5_CORRUPT_HEAP_OBJECT_MISSING
      - id: vds.global_heap_header
        finding: H5_CORRUPT_GLOBAL_HEAP_HEADER
      - id: vds.global_heap_object
        finding: H5_CORRUPT_GLOBAL_HEAP_OBJECT
      # Every address or extent this family decodes must lie inside the file.
      - {id: vds.address_in_file, finding: [H5_CORRUPT_OFFSET_OUT_OF_FILE, H5_CORRUPT_LENGTH_OVERFLOW]}
      # The on-disk magic of every structure this family decodes must match.
      - {id: vds.signature_valid, finding: H5_CORRUPT_BAD_SIGNATURE}
      # Stored checksum must match the block, and the block must be large
      # enough to hold it.
      - {id: vds.checksum_valid, finding: H5_CORRUPT_BAD_CHECKSUM}
      # Size and offset arithmetic must stay inside the validator's domain.
      - {id: vds.size_arithmetic, finding: H5_CORRUPT_LENGTH_OVERFLOW}
    validators:
      h5policy: enforced
      hdf5: enforced   # measured; see libhdf5-evidence.yml
    tests:
      - {path: h5policy/tests/expected/policy-vds_absolute_source.yml, asserts: [vds.no_source_open, vds.source_path_classified]}
      - {path: h5policy/tests/expected/cve-vds_nentries_mult_overflow.yml, asserts: vds.layout_complete}
    coverage_status: covered
    migration_status: oracle-enforced
    related_cases: [corpus-seed-25, corpus-seed-24, corpus-case-vds-rank]

  # Partial vertical slices. Their emitted findings now have authoritative
  # semantic mappings, while the remaining `backlog` blocks track validation
  # evidence and migration work. Promote a family to `covered` only when the
  # validator, fixtures, entry-point driver, and CI gate land together.
  - record: datatypes
    section: "IV.A.3 — Datatypes"
    scope: local_decode                 # family-dominant; compound_member_bounds is record_local (see catalog)
    semantic_boundary: datatype recursion and size arithmetic (compound member bounds is record_local — see catalog)
    invariants:
      - id: datatype.recursion_depth
        finding: H5_RESOURCE_DATATYPE_RECURSION_DEPTH
      # A single element's declared storage size is this family's share of the
      # single-value budget; the fill-value and attribute shares belong to the
      # families that own those messages.
      - {id: datatype.single_value_budget, finding: H5_RESOURCE_SINGLE_VALUE_BYTES}
      - id: datatype.float_byte_order
        finding: H5_CORRUPT_DATATYPE_FLOAT_BYTE_ORDER
      - id: datatype.float_normalization
        finding: H5_CORRUPT_DATATYPE_FLOAT_NORMALIZATION
      - id: datatype.opaque_tag_alignment
        finding: H5_CORRUPT_DATATYPE_OPAQUE_TAG_ALIGNMENT
      - id: datatype.reference_encode_version
        finding: H5_CORRUPT_DATATYPE_REFERENCE_VERSION
      - id: datatype.float_fields_disjoint
        finding: H5_CORRUPT_DATATYPE_FLOAT_OVERLAP
      - id: datatype.member_name_unique
        finding: H5_CORRUPT_DATATYPE_DUPLICATE_MEMBER_NAME
      - id: datatype.compound_member_bounds
        finding: H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS
      # And disjoint from each other, not merely inside the parent: libhdf5 tests
      # members pairwise and refuses to decode on an overlap, its own comment
      # calling it "probably indicates that the file is corrupt".  h5policy
      # accepted three corpus files libhdf5 would not read.  Named for the
      # existing datatype.float_fields_disjoint, which is the same shape one
      # level down.  Guarded by a high-water mark, so the ordered layout every
      # writer emits costs O(1) per member and never scans.
      - id: datatype.compound_members_disjoint
        finding: H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_OVERLAP
      - id: datatype.size_arithmetic
        finding: H5_CORRUPT_LENGTH_OVERFLOW
      - {id: datatype.members_nonzero, finding: H5_CORRUPT_DATATYPE_ZERO_MEMBERS}
      - {id: datatype.precision_bounds, finding: H5_CORRUPT_DATATYPE_PRECISION_BOUNDS}
      - {id: datatype.unused_bits, finding: H5_CORRUPT_DATATYPE_UNUSED_BITS}
      - {id: datatype.version_supported, finding: H5_CORRUPT_UNSUPPORTED_DATATYPE_VERSION}
      - {id: datatype.message_complete, finding: H5_CORRUPT_DATATYPE_MESSAGE_TOO_SMALL}
      - {id: datatype.nonzero_size, finding: H5_CORRUPT_DATATYPE_ZERO_SIZE}
      - {id: datatype.class_known, finding: H5_CORRUPT_UNKNOWN_DATATYPE_CLASS}
      - {id: datatype.array_shape, finding: [H5_CORRUPT_DATATYPE_ARRAY_DIMENSION, H5_CORRUPT_DATATYPE_ARRAY_RANK, H5_CORRUPT_DATATYPE_ARRAY_SIZE]}
      - {id: datatype.enum_encoding, finding: [H5_CORRUPT_DATATYPE_ENUM_BASE_SIZE, H5_CORRUPT_DATATYPE_ENUM_NAME_EMPTY]}
      # Class 11 (version 5): homogeneous rectangular class bits, a
      # floating-point base type, and an element size of exactly twice it.
      - {id: datatype.complex_encoding, finding: [H5_CORRUPT_DATATYPE_COMPLEX_ENCODING, H5_CORRUPT_DATATYPE_COMPLEX_BASE_CLASS, H5_CORRUPT_DATATYPE_COMPLEX_SIZE]}
      - {id: datatype.float_fields, finding: [H5_CORRUPT_DATATYPE_FLOAT_EXPONENT, H5_CORRUPT_DATATYPE_FLOAT_MANTISSA, H5_CORRUPT_DATATYPE_FLOAT_SIGN]}
      # Classes 7 and 9 are the two whose on-disk element size is a property of
      # the FILE, not of the message. libhdf5 rewrites the size from the
      # superblock when the type is attached (H5Tref.c:256/284/312,
      # H5Tvlen.c:300) and never compares it with what was encoded, so anything
      # that already derived an extent from the encoded value is wrong by the
      # difference. Pinning the size here is what makes it final before an
      # attribute's raw-data extent (H5Oattr.c:273) is computed from it.
      - {id: datatype.reference_size, finding: H5_CORRUPT_DATATYPE_REFERENCE_SIZE}
      - {id: datatype.vlen_size, finding: H5_CORRUPT_DATATYPE_VLEN_SIZE}
      - {id: datatype.reference_type, finding: H5_CORRUPT_DATATYPE_REFERENCE_TYPE}
    tests:
      - {path: h5policy/tests/expected/valid-nested_datatypes.yml, asserts: datatype.recursion_depth}
      - {path: h5policy/tests/expected/cve-dtype_unbounded_recursion.yml, asserts: datatype.recursion_depth}
      - {path: h5policy/tests/expected/cve-dtype_compound_unbounded_recursion.yml, asserts: datatype.recursion_depth}
      - {path: h5policy/tests/expected/malformed-bad_dtype_float_normalization.yml, asserts: datatype.float_normalization}
      - {path: h5policy/tests/expected/malformed-bad_dtype_float_overlap.yml, asserts: [datatype.float_fields_disjoint, datatype.float_fields]}
      - {path: h5policy/tests/expected/malformed-bad_dtype_opaque_tag_unaligned.yml, asserts: datatype.opaque_tag_alignment}
      - {path: h5policy/tests/expected/malformed-bad_dtype_duplicate_member_name.yml, asserts: datatype.member_name_unique}
      - {path: h5policy/tests/expected/malformed-compound_member_array_bounds.yml, asserts: datatype.compound_member_bounds}
      - {path: h5policy/tests/expected/malformed-compound_member_offset_oob.yml, asserts: datatype.compound_member_bounds}
      - {path: h5policy/tests/expected/malformed-compound_member_overlap.yml, asserts: datatype.compound_members_disjoint}
      - {path: h5policy/tests/expected/malformed-compound_member_array_nelem_overflow.yml, asserts: datatype.size_arithmetic}
      - {path: h5policy/tests/expected/malformed-bad_compound.yml, asserts: datatype.members_nonzero}
      - {path: h5policy/tests/expected/malformed-bad_datatype_precision_bounds.yml, asserts: datatype.precision_bounds}
      - {path: h5policy/tests/expected/malformed-bad_unused_bits.yml, asserts: datatype.unused_bits}
      - {path: h5policy/tests/expected/malformed-bad_reference_datatype_version.yml, asserts: datatype.reference_encode_version}
      - {path: h5policy/tests/expected/malformed-bad_datatype_version.yml, asserts: datatype.version_supported}
      # A legitimate class-7 datatype at message version 4 -- the shape a
      # gate on `class 7 && version != 1` used to reject wholesale.
      - {path: h5policy/tests/expected/valid-attr_stdref_region.yml, asserts: datatype.version_supported}
      - {path: h5policy/tests/expected/valid-empty.yml, asserts: datatypes.bypass_unexercised}
      # Both fixtures reproduce the libhdf5 heap over-read they guard against
      # (H5Aint.c:769), so they measure the invariant rather than only pinning
      # the check. See registry/cases/datatype-size-not-final.yml.
      - {path: h5policy/tests/expected/malformed-attr_reference_size_under.yml, asserts: datatype.reference_size}
      - {path: h5policy/tests/expected/malformed-attr_vlen_size_under.yml, asserts: datatype.vlen_size}
      - {path: h5policy/tests/unit_datatype.pk, asserts: [datatype.float_byte_order, datatype.message_complete, datatype.array_shape, datatype.enum_encoding, datatype.complex_encoding, datatype.float_fields, datatype.reference_type]}
      - {path: h5policy/tests/unit_limits.pk, asserts: datatype.single_value_budget}
    validators: {h5policy: enforced, hdf5: partial}
    coverage_status: covered
    migration_status: oracle-enforced

  - record: btree_heap_index
    section: "III — B-tree, heap, and index structures"
    scope: aggregate_object
    semantic_boundary: traversal progress, entry counts, extents, and budgets
    invariants:
      - id: btree.node_level
        finding: H5_CORRUPT_BTREE_NODE_LEVEL
      - id: btree.entry_count
        finding: H5_CORRUPT_BTREE_NODE_ENTRY_COUNT
      - id: btree.extent_bounds
        finding: [H5_CORRUPT_V2_BTREE_NODE_SIZE, H5_CORRUPT_LENGTH_OVERFLOW]
      - id: btree.traversal_budget
        finding: H5_RESOURCE_BTREE_DEPTH
      # Every address or extent this family decodes must lie inside the file.
      - {id: btree.address_in_file, finding: [H5_CORRUPT_OFFSET_OUT_OF_FILE, H5_CORRUPT_LENGTH_OVERFLOW]}
      # The on-disk magic of every structure this family decodes must match.
      - {id: btree.signature_valid, finding: H5_CORRUPT_BAD_SIGNATURE}
      # Size and offset arithmetic must stay inside the validator's domain.
      - {id: btree.size_arithmetic, finding: H5_CORRUPT_LENGTH_OVERFLOW}
    tests:
      - {path: h5policy/tests/expected/valid-dense_links_deep.yml, asserts: btree.indexed_name_resolution}
      - {path: h5policy/tests/expected/integration-btree_depth.yml, asserts: btree.traversal_budget}
      - {path: h5policy/tests/expected/malformed-bad_group_btree_child_address.yml, asserts: btree.address_in_file}
