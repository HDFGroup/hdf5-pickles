# H5Policy -> SSP control-evidence contract.
#
# This is an intentionally small, checked bridge between h5policy's technical
# evidence and the HDF5 SSP SIG policy controls. A row names one control, the
# exact record/invariant/finding it relies on, its regression fixture and
# canary, and the result measured for the selected libhdf5 release.
#
# It does NOT claim that one fixture implements an entire control. The SSP
# audit consumes these as reproducible technical evidence alongside its human
# review, release, disclosure, and ownership records.
schema_version: 1
producer: h5policy
measurement:
  artifact: registry/libhdf5-evidence.yml
  libhdf5_version: 2.3.0

controls:
  - id: HDF5-SHINES-VULN-04
    record: dataspace_dimension
    invariant: dataspace.nelem_product
    finding: H5_CORRUPT_DATASPACE_NELEM_OVERFLOW
    fixture: malformed-dataspace_nelem_overflow.yml
    canary: dataspace
    oracle_decision: reject_corrupt
    native_measurement:
      family_verdict: enforced
      fixture_outcome: enforced

  - id: HDF5-SHINES-TEST-01
    record: chunk_index
    invariant: chunk.no_cycle
    finding: H5_CORRUPT_CHUNK_INDEX_CYCLE
    fixture: malformed-bad_chunk_v2_btree_cycle.yml
    canary: chunk_index
    oracle_decision: reject_corrupt
    native_measurement:
      # partial (not enforced): the chunk_index family gained sibling fixtures
      # libhdf5 2.3.0 does not all reject; this cycle fixture is still enforced.
      family_verdict: partial
      fixture_outcome: enforced

  - id: HDF5-SHINES-TEST-05
    record: datatypes
    invariant: datatype.compound_member_bounds
    finding: H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS
    fixture: malformed-compound_member_array_bounds.yml
    canary: datatype
    oracle_decision: reject_corrupt
    native_measurement:
      family_verdict: partial
      fixture_outcome: diverges

  # Second TEST-05 evidence row: a control is evidenced by every fixed
  # vulnerability class, not one fixture. A dense-link v2 B-tree header with
  # record_size == 0 makes libhdf5 H5B2__hdr_init divide by zero (SIGFPE) on
  # every NDEBUG build; h5policy rejects the header before that divide. The
  # exact-build matrix records the crash under dense_index.crashes_on, so the
  # fixture_outcome is `crashes`. See
  # registry/cases/v2-btree-record-size-zero-assert-only.yml.
  - id: HDF5-SHINES-TEST-05
    record: dense_index
    invariant: dense.btree_record_size
    finding: H5_CORRUPT_V2_BTREE_RECORD_SIZE
    fixture: malformed-zero_v2_btree_record_size.yml
    canary: dense_index
    oracle_decision: reject_corrupt
    native_measurement:
      family_verdict: partial
      fixture_outcome: crashes

  - id: HDF5-SHINES-HARD-04
    record: external_link
    invariant: elink.no_external_traverse
    finding: H5_POLICY_EXTERNAL_LINK
    fixture: policy-external_link.yml
    canary: external_link
    oracle_decision: reject_policy
    native_measurement:
      family_verdict: enforced
      fixture_outcome: not_applicable
      activation_observed: [external_open]

  - id: HDF5-SHINES-TM-03
    record: virtual_dataset
    invariant: vds.source_path_classified
    finding: H5_ADVISORY_VDS_ABSOLUTE_SOURCE
    fixture: policy-vds_absolute_source.yml
    canary: virtual_dataset
    oracle_decision: accept_with_warnings
    native_measurement:
      family_verdict: enforced
      fixture_outcome: not_applicable
      activation_observed: [external_open]
