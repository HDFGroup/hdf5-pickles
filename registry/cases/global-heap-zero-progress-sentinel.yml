# The global-heap object loop can be made not to advance at all, so its decode
# never terminates. There are TWO entrances: the index-0 free-space sentinel,
# whose declared size is used raw, and any normal object, whose advance is an
# unchecked size_t sum that eight declared lengths per width wrap to zero.
#
# CORRECTED 2026-08-21. This record previously asserted that the advance was
# "guaranteed positive for every object EXCEPT the index-0 sentinel". It is not:
# see `defect` and the `need_wrap` trigger. The classification, invariant,
# validation closure and semantic boundary were all right; only the claim that
# one branch was safe was wrong, and it made the recorded scope too narrow by
# half.
#
# Promoted from two working bundles (gitignored h5cve scratch) that reach the
# same defect from different distances.  Each is named by its specimen's
# input_sha256, given in full under `triggers`:
#   specimen ccee352f...   orphaned collection -- inert until swept
#   specimen 417c2f1d...   VDS mapping references it -- reachable
# A third trigger, `need_wrap`, was added by the correction and has no specimen
# of its own: it is generated (see `triggers.need_wrap`).
# They are recorded together because the PAIR is the finding: the same
# zero-progress object is harmless when nothing points at it and a
# non-terminating open when something does. Either bundle alone would misstate
# the severity, in opposite directions.
schema_version: 1

id: global-heap-zero-progress-sentinel
title: the global-heap object loop can be made not to advance -- by a zero-size
  index-0 free-space sentinel, or by an unchecked size_t sum that wraps to zero
  for a normal object -- and its decode then never terminates
status: oracle-hardened          # h5policy reports it; libhdf5 unfixed
disclosure: >-
  n/a -- local analysis only.  No advisory database was consulted, no advisory
  text was retrieved, and no identifier was looked up.

# -- Triage -------------------------------------------------------------------
record: heap_structures
versions: [1]                    # version-1 global heap collection
root_cause_classification: local_decode
violated_invariant:
  - heap.global_progress
validation_closure: >-
  one complete version-1 global heap collection: its 16-byte header and the
  ordered closure of object headers and payload extents through the declared
  collection end.  Every accepted object -- INCLUDING the index-0 free-space
  sentinel -- must advance the cursor by a positive checked extent before native
  heap construction continues.
activation_before_validation:
  - native_construction
  - cache_publication            # unverified on the orphaned specimen
entry_points:
  - h5policy (oracle) -- forensic reports the non-progress; see profile_note
  - "libhdf5 H5HG__cache_heap_deserialize (src/H5HGcache.c:272-366)"
  - "reachable route: a VDS mapping referencing the collection"
  - "direct consumer: h5debug at the collection offset"

# -- The defect, read out of the source tree (HDF5 2.3.0) ---------------------
defect: >-
  The object loop is
      while (p < (heap->chunk + heap->size)) {          /* :272 */
  and the step it takes is computed in two branches that do NOT have the same
  guarantee:
      if (idx > 0) {
          need = H5HG_SIZEOF_OBJHDR(f) + H5HG_ALIGN(heap->obj[idx].size);   /* :353 */
          ...
      }
      else
          need = heap->obj[idx].size;                                       /* :358 */
      if (H5_IS_BUFFER_OVERFLOW(begin, need, p_end))                        /* :363 */
          HGOTO_ERROR(... "ran off end of input buffer while decoding");
      p = begin + need;                                                     /* :365 */
  NEITHER branch guarantees progress, and this record used to claim the first
  one did.
  For the index-0 sentinel the declared size is used RAW, with no header addend
  and no floor.  A file declaring zero yields need == 0, p == begin, and a loop
  condition that has not changed.
  For any other index the step does include H5HG_SIZEOF_OBJHDR(f) -- but the sum
  is UNCHECKED size_t arithmetic, and so is the H5HG_ALIGN inside it
  (8*((X+7)/8), src/H5HGpkg.h:69).  `heap->obj[idx].size` is a `size_t` and
  H5F_DECODE_LENGTH stores the 8-byte on-disk length into it through
  UINT64DECODE, whose own comment reads "WE DON'T CHECK FOR OVERFLOW!"
  (src/H5encode.h:221).  For any declared length in the closed interval
  [SIZE_MAX-22, SIZE_MAX-15] -- eight values -- the sum wraps to exactly zero.
  So "structurally positive" described the ALGEBRA, not the arithmetic: the
  header addend is present, it simply cannot survive the wrap.
  The bounds check at :363 is no help against either branch, and cannot be made
  to be: H5_IS_BUFFER_OVERFLOW short-circuits on `(size) != 0`
  (src/H5private.h:347), so a `need` of zero is exactly the value it is defined
  to ignore.  This is a LIVENESS failure, not a memory-safety one -- nothing is
  read out of bounds; the parse simply never ends.
  THE INTENDED INVARIANT IS WRITTEN DOWN AND NOT ENFORCED.  The comment
  immediately above the branch (:348-351) says the free-space object's "size is
  never padded and already includes the object header".  That is exactly the
  property that would make :358 safe -- and it is an assumption about what a
  conforming writer emits, with nothing checking it on read.
  Note the same function DOES handle a related case carefully: the too-small
  tail at :274-287 synthesises obj[0] from the remaining bytes and steps by that
  remainder, which is positive by construction.  So the file contains a correct
  treatment of the sentinel a dozen lines above the incorrect one.

shape_note: >-
  This record was filed as the second case in this directory whose defect is
  BRANCH ASYMMETRY -- one arm of a decision lacking a property the other arms
  get for free (the first being
  registry/cases/layout-v4-ndims-lower-bound-missing.yml, where the v4+ layout
  decoder omits a lower bound both older decoders apply).  The 2026-08-21
  correction dissolves that framing HERE: measuring the other arm showed it was
  never safe either, so the loop has no safe arm to be asymmetric with.
  The heuristic that produced the original note still holds and is worth keeping
  -- when a decoder special-cases one value or version, check whether the special
  case inherits the general path's guarantees or merely its structure.  But this
  record is now also a caution about that heuristic's failure mode: it directs
  attention to the special case and thereby CERTIFIES the general one.  The
  general path here was certified by an algebraic argument -- "the step includes
  the header size" -- that unchecked arithmetic invalidates.  Prefer a bound
  that is evaluated to one that is argued.

# -- The two reaches, and why both are needed ---------------------------------
triggers:
  orphaned:
    specimen: input_sha256
      ccee352f0d2663c4d8badc6908bdfe74c111e29b6beb48cbd07deb615d587898
    how: >-
      A version-1 global heap collection carrying a zero-extent index-0
      sentinel, with NOTHING in the file referencing it.  The 16-byte GCOL
      header plus the first 16-byte object header at [88,120) are the whole
      witness.
    reach: >-
      Not reached by a normal open.  H5Fopen, H5Ovisit3 and h5dump -H load only
      the empty root and never touch the orphaned collection.  It is inert until
      something sweeps unreachable metadata.
    impact: >-
      h5debug directed at offset 88 TIMES OUT (five seconds).  A latent
      non-termination, reachable by forensic tooling rather than by ordinary
      reads.
    oracle_finding: >-
      forensic: reject_resource, H5_RESOURCE_GLOBAL_HEAP_INFINITE_LOOP @ 104.
      untrusted-strict ACCEPTS -- see profile_note, this is deliberate.
  referenced_via_vds:
    specimen: input_sha256
      417c2f1d2cf32df0e1f0e2124fc4d336a8a2fb85bacbd50234260c8d4fc2f3e5
    how: >-
      The same zero-progress collection, but with a VDS mapping referencing it,
      so an ordinary open reaches the heap.
    reach: >-
      Reached.  And reached EARLY: libhdf5 fails to terminate BEFORE any
      source-file activation, so the non-termination lands ahead of the point
      where a VDS consumer would open external sources.
    impact: >-
      Stock, ASan and direct-tool consumers all fail to terminate.  This is the
      trigger that makes the defect a denial of service through a normal open
      rather than a forensic-tool curiosity.
    oracle_finding: >-
      forensic: reject_policy with H5_RESOURCE_GLOBAL_HEAP_INFINITE_LOOP @ 2176.
      untrusted-strict: reject_policy at H5_POLICY_VDS @ 896 -- it stops at the
      VDS policy boundary before loading the referenced heap.

  need_wrap:
    specimen: >-
      none -- generated.  h5policy/tests/resource/gheap_need_wrap_zero.h5 is
      valid/empty.h5 with an orphaned collection appended whose index-1 object
      declares 2**64-16; the ILP32 sibling declares 2**32-16 and
      gheap_need_wrap_below.h5 declares 2**64-24, one below the wrap window, as
      the control.  Discovered from the specimen bundle for the global-heap
      overrun seed sha256:3ca01580..., whose own first corrupted object wraps
      `need` to 8 -- a desync rather than a hang, which is what made the wrap
      visible.
    how: >-
      A NORMAL object, index > 0, declaring a length in [SIZE_MAX-22,
      SIZE_MAX-15].  This is the branch this record used to certify as safe.  The
      collection is otherwise well formed: 4096 bytes, aligned, version 1, no
      checksum anywhere in a GCOL, so one 8-byte field is the entire mutation.
    reach: >-
      Reached by any consumer that reads variable-length or reference DATA, since
      that is what carries a global-heap ID.  Measured through H5Aread on a vlen
      H5T_REFERENCE attribute; H5Fopen, H5Ovisit3 and fixed-length H5Dread are
      all unaffected.  The committed fixtures are ORPHANED, so like the sentinel
      fixture they are found by the forensic sweep rather than by a read.
    impact: >-
      Non-termination inside H5HG__cache_heap_deserialize, measured on libhdf5
      2.3.0 in BOTH a release build (asserts off) and an AddressSanitizer build
      (asserts live): a read-only public-API witness never returns, under a 30 s
      timeout, with ZERO sanitizer reports.  Interrupted under gdb the process
      sits in that function with `need = 0` in scope, reached via
      H5T__conv_vlen -> H5T__vlen_disk_read -> H5VL_blob_get ->
      H5HG_get_obj_size -> H5HG__protect -> H5AC_protect -> H5C_protect ->
      H5C__load_entry.  The cache entry is never published and no vlen buffer is
      materialised.
    boundary: >-
      The wrap window was ENUMERATED, not derived: the four operations
      (UINT64DECODE into size_t, H5HG_ALIGN, the + H5HG_SIZEOF_OBJHDR, and the
      :363 guard) were transcribed and compiled at both -m64 and -m32 with
      __SIZE_TYPE__, giving exactly eight lengths per width.  The library agrees
      at both ends: 2**64-23 hangs, 2**64-24 is rejected cleanly.
    oracle_finding: >-
      forensic: reject_resource, H5_RESOURCE_GLOBAL_HEAP_INFINITE_LOOP at the
      object header, for both the LP64 and the ILP32 fixture.  untrusted-strict
      ACCEPTS all three -- see profile_note; the sweep is forensic-only.  The
      control accepts under both profiles.

profile_note: >-
  The two specimens produce different strict-profile verdicts and NEITHER is a
  clean library verdict on the heap defect.  Both bundles say so themselves and
  the distinction is worth preserving.
  On the ORPHANED specimen untrusted-strict ACCEPTS.  That is by design: strict
  reachability validation does not load raw data or sweep unreachable metadata,
  so an orphaned collection is out of scope.  It must NOT be read as the oracle
  missing the defect -- forensic, which does sweep, reports it.
  On the VDS specimen untrusted-strict rejects, but at H5_POLICY_VDS, before the
  referenced heap is ever loaded.  A policy control firing first is protection,
  not detection.
  So for this defect FORENSIC is the profile that carries the finding on both
  specimens, and any future fixture for it should be contracted against forensic
  unless it is built to be reachable without tripping a policy rule first.

# -- Measured behaviour -------------------------------------------------------
measured:
  NOT_REMEASURED_AT_PROMOTION: >-
    Everything under `measured` and `triggers` is the bundles', and was NOT
    re-measured at promotion -- this session could not execute the oracle or the
    probes.  The SOURCE claims in `defect` were read from the 2.3.0 tree at
    promotion and are current.
  libhdf5_as_recorded: >-
    ORPHANED specimen: the exact-build probes report unverified_coverage_gap on
    both builds -- the collection is never reached -- while the direct consumer
    h5debug times out.  So the probe's silence is a reachability artifact, not a
    safety result.
    VDS specimen: stock, ASan and direct-tool consumers all fail to terminate,
    before any source-file activation.
    NOTHING FAULTS on either.  There is no ASan report to obtain, because
    nothing is read out of bounds -- which is exactly why a sanitizer-first
    methodology would miss this family entirely.
  width: >-
    SUPERSEDED 2026-08-21.  The original entry read: "NOT measured at 32 bits,
    and not expected to matter: a zero step is zero at any width."  True of the
    SENTINEL entrance -- a declared zero is zero everywhere -- and false of the
    defect, because the wrap entrance is width-parametric: it is the DECLARED
    LENGTH that must be tuned to the width, and the eight values that work at
    one width work at no other.
    Now measured.  The advance arithmetic was executed at both widths (gcc -m64
    and -m32 on the same source, __SIZE_TYPE__ so the width follows the target):
    need == 0 for the closed interval [2**W-23, 2**W-16], eight values, at each
    of W = 64 and W = 32.  On the LIBRARY, LP64 is measured (two builds hang on
    the 2**64-16 fixture; the 2**32-16 fixture is rejected cleanly, which is the
    control) and the ILP32 library consequence is source-derived, because no
    32-bit libhdf5 was available.
    This is also where the ORACLE had a real gap: h5policy's arithmetic is
    uint<64> and so reproduced an LP64 reader only, accepting the 2**32-16 shape
    under every profile.  h5policy_gcol_advance now models both widths, gated on
    a collection a 32-bit reader could hold (csize <= 2**32-1).

# -- Divergence from the selected build ---------------------------------------
divergence:
  oracle: reject_resource (orphaned, forensic) / reject_policy (VDS)
  libhdf5: does not terminate
  libhdf5_version: 2.3.0
  classification: agreement-in-intent, incomparable-in-form
  note: >-
    There is no invariant-A disagreement to carry and no entry in
    registry/h5policy-diff-tolerances.yml is warranted or present -- but not
    because the two sides agree in the usual way.  h5policy reaches a verdict
    and libhdf5 reaches no verdict at all.  A harness that compares exit codes
    has nothing to compare against a process that never exits; the differential
    can only record a timeout, which is why the tracked fixture is contracted as
    a RESOURCE case rather than through the A-invariant machinery.

# -- Containment vs systemic remediation --------------------------------------
containment:
  status: not_implemented        # libhdf5 side; not proposed upstream by this repo
  description: >-
    Minimal: reject a zero advance before reassigning the cursor.  At
    src/H5HGcache.c:358-365, require `need > 0`.
    The 2026-08-21 correction rules out the variant of this fix that this record
    used to prefer -- "give the index-0 branch the same floor the general branch
    gets for free" -- because the general branch has no such floor to share.  The
    fix must therefore be an explicit floor on the computed advance, evaluated
    BEFORE :363 since that guard cannot see a zero: `need >=
    H5HG_SIZEOF_OBJHDR(f)` for idx > 0 and `need > 0` for idx == 0, with the sum
    itself computed in checked arithmetic.  One floor covers both entrances.
    Systemic, and the bundles are right that the minimal fix is not the boundary:
    the object-list loop needs checked remaining-length arithmetic and a
    monotonic-cursor assertion covering BOTH normal objects and the sentinel.  A
    zero-size check blocks these two specimens; a cursor that is proven to
    advance blocks the class.
    Strict tightening either way -- no conforming writer emits a sentinel that
    does not advance, because such a collection could not be re-read by the
    writer itself.
systemic:
  semantic_boundary: >-
    complete global-heap collection raw decode: decode inert object descriptors
    under a cursor and step budget; prove every span is positive, properly
    aligned and inside the collection; only then construct or publish
    H5HG_heap_t.
  status: open-followup
  owner: unassigned
  description: >-
    h5policy detects the non-progress and reports it as a resource finding
    rather than looping, so the oracle is safe -- but note this is a BUDGET
    catching the condition, which is the right containment for a liveness defect
    and is not the same as a structural rejection.
    The remaining work is libhdf5's.
  landed_changes:
    - h5policy/pickles (heap.global_progress; H5_RESOURCE_GLOBAL_HEAP_INFINITE_LOOP)
    - h5policy/tests/resource/gheap_infinite_loop.h5 + expectation
    - registry/findings/catalog (H5_RESOURCE_GLOBAL_HEAP_INFINITE_LOOP)
    # 2026-08-21, the correction:
    - h5policy/pickles/h5_validate.pk -- h5policy_gcol_advance models the object
      advance at 64 AND 32 bits, so the width-dependent shape is reported too
    - h5policy/tests/resource/gheap_need_wrap_zero.h5 + expectation (the wrap
      entrance, LP64)
    - h5policy/tests/resource/gheap_need_wrap_zero_ilp32.h5 + expectation (the
      same wrap one width down; the fixture that distinguishes a width-parametric
      progress check from a 64-bit-only one)
    - h5policy/tests/resource/gheap_need_wrap_below.h5 + expectation (the
      adjacent control, one below the wrap window, which must stay accept)
    - h5policy/tools/h5policy-gencorpus (_make_gheap_infinite_loop generalised to
      _make_gheap_collection(index, length); the existing fixture's appended
      collection is byte-identical after the refactor)
    - pickles/gheap.pk -- THIS REPOSITORY had the same defect.  gheap_obj_step
      states the untrusted advance once and both walkers now require the cursor to
      advance strictly.  The dumper additionally vets the declared extent BEFORE
      printing, because printing maps the object's data and that map threw on a
      wild length before any later check could report it.
    - pickles/tests/unit_gheap.pk + CMakeLists.txt -- 15 cases over the step
      helper, both walkers and the adjacent controls, registered as ctest
      pickle_gheap_regression with a 30 s timeout.  The timeout IS the assertion
      for the hang; the test was confirmed to hang against the pre-fix model.

# -- Post-CVE learning (strategy doc section 11.8) ----------------------------
learning:
  our_own_model_had_it_too: >-
    Worth recording because it was not looked for, and could not have been found
    by testing h5policy: pickles/gheap.pk -- this repository's SHARED FORMAT
    MODEL, the one h5explain and h5patch decode collections with -- reproduced
    the reference library's defect exactly.  Both of its walkers
    (gheap_gcol_find_obj, print_global_heap) advanced by the same two unguarded
    expressions, and poke uint<64> wraps precisely as an LP64 size_t does, so the
    same eight declared lengths that hang libhdf5 hung them.
    Measured before the fix, on the same bytes, and the failure mode is not
    uniform: the FINDER spun forever on both shapes; the DUMPER spun forever on
    the zero-span sentinel but died with an unhandled EOF exception on the
    wrapping length, because it mapped byte[data_size] to print the object before
    anything checked the length.  That ordering is why the fix vets the extent
    before printing -- a guard placed after the map is unreachable.
    h5policy itself was never affected: it loads none of pickles/gheap.pk and
    carries its own validator.  The exposure was h5explain and h5patch, through
    vds.pk and ref_enc.pk.
  the_transferable_lesson: >-
    A decoder written FROM a reference implementation inherits that
    implementation's unchecked arithmetic along with its layout, and a modular
    64-bit language reproduces a 64-bit size_t wrap silently and faithfully.  When
    a case records unchecked arithmetic in libhdf5, audit this repository's model
    of the same structure in the same change.  Do not assume the oracle's
    correctness extends to the shared pickles: they have different callers and no
    profile budget to fall back on.
  audit_status: >-
    Done for the global heap only.  Sibling walkers driven by a declared,
    unvalidated span -- local-heap free lists, fractal-heap block walks,
    object-header message loops -- were NOT audited for this shape and remain an
    open follow-up.

# -- Reproducers --------------------------------------------------------------
reproducers:
  integration_pocs:
    - h5policy/tests/resource/gheap_infinite_loop.h5     # orphaned, sentinel arm
    - h5policy/tests/resource/gheap_need_wrap_zero.h5    # orphaned, wrap arm
  integration_poc_limitations: >-
    The VDS-referenced route has no committed fixture; it remains a coverage
    gap rather than a tracked reproducer.  The wrap arm's committed fixtures are
    likewise orphaned, so they exercise the sweep rather than the read path that
    was measured to hang -- the reachable route was measured on a case-bundle
    specimen, which is not promotable.
  direct_fixtures:
    - h5policy/tests/resource/gheap_infinite_loop.h5
    - h5policy/tests/resource/gheap_need_wrap_zero.h5
    - h5policy/tests/resource/gheap_need_wrap_zero_ilp32.h5
    - h5policy/tests/resource/gheap_need_wrap_below.h5   # control: must accept
  expectations:
    - h5policy/tests/expected/resource-gheap_infinite_loop.yml
    - h5policy/tests/expected/resource-gheap_need_wrap_zero.yml
    - h5policy/tests/expected/resource-gheap_need_wrap_zero_ilp32.yml
    - h5policy/tests/expected/resource-gheap_need_wrap_below.yml
  direct_witness: >-
    The 16-byte GCOL header plus the first 16-byte object header at [88,120) of
    the orphaned specimen.  No public raw-global-heap decoder API exists
    locally, so h5debug is the available direct consumer -- and it times out,
    which IS the measurement.
  generator: >-
    The wrap arm DOES have one: h5policy-gencorpus `_make_gheap_collection`,
    parameterised by object index and declared length, builds all four tracked
    fixtures (including the sentinel one, whose bytes it reproduces exactly).
    NEITHER SPECIMEN has a deterministic generator.  h5cve minimize is deferred
    and the available mutator produced zero recipes, since neither seed has
    continuations.  A crafted.py exists beside the crafted bundle and is the
    nearest thing to a recipe; it was not verified at promotion.
  assertions:
    stable_finding: true
    fails_before_materialization: false
    no_plugin_load: true
    no_decompression: true
    no_external_open: true          # and notably true of the VDS specimen too --
                                    # the hang precedes source-file activation
    no_user_callback: unverified
    no_legacy_fallback: unverified

backports: []

fuzz_seed: >-
  Both specimens seed the global-heap object-list neighbourhood.  The productive
  axis is narrow and obvious: the index-0 sentinel's declared size, where 0 is
  the defect, values below H5HG_SIZEOF_OBJHDR violate the documented assumption
  without being zero, and anything at or above it is well formed.  That middle
  band -- nonzero but below the header size -- is unexercised by either
  specimen and is the interesting untested region.

compatibility_backport_risks: >-
  Low.  A sentinel that does not advance the cursor describes a collection its
  own writer could not re-read, so no conforming file depends on the current
  behaviour.  The one thing to check per branch is the too-small-tail path at
  :274-287, which synthesises obj[0] itself: a floor applied indiscriminately
  must not reject the synthesised sentinel, whose size is computed rather than
  read.

sibling_audit: >-
  Within libhdf5: H5HG__cache_heap_deserialize is the audited function, and the
  correct handling of the synthesised tail sentinel at :274-287 sits in it,
  twelve lines from the defective read path.  NOT audited: other cursor loops in
  the heap code, and whether any other decoder derives a step from a raw
  file-declared size without a structural floor.  The general shape -- a loop
  whose step is attacker-controlled and not proven positive -- has not been
  swept for, and it is distinct from the three bound-application shapes in
  registry/cases/decoder-bound-shape-sweeps.yml because the failure is liveness
  rather than extent.
  Within h5policy: the non-progress is caught by a budget rather than by a
  structural rule.  Whether every other cursor loop in the pickles has an
  equivalent budget is asserted from the walk-operation accounting, not verified
  per loop.

# -- Affected versions --------------------------------------------------------
version_range:
  affected: >-
    UNVERIFIED as a range.  Both bundles measured 2.3.0 and the asymmetric step
    at src/H5HGcache.c:353/:358 was verified present in the 2.3.0 tree at
    promotion.  No archaeology was run.
  label: not established

# -- Open items ---------------------------------------------------------------
coverage_gaps:
  - >-
    NO GENERATOR FOR EITHER SPECIMEN.  Both are supplied files with no
    deterministic reducer, and the tracked resource fixture is a third file.
    The crafted bundle's crafted.py may be a recipe for the VDS one and was
    not verified.
  - >-
    THE MIDDLE BAND IS UNEXERCISED: a sentinel size that is nonzero but smaller
    than H5HG_SIZEOF_OBJHDR violates the documented assumption at :348-351
    without producing a zero step.  Whether that under-advances (mis-parsing
    subsequent objects) or is harmless is untested, and it is the case a naive
    `need > 0` fix would still admit.
  - >-
    NOTHING WAS RE-MEASURED AT PROMOTION (source claims excepted).
  - >-
    No 32-bit measurement, though none is expected to matter here.
open_questions:
  - >-
    Does the non-termination consume CPU or block?  The record says "does not
    terminate" throughout because that is what was measured (timeouts), but a
    spinning loop and a stalled one have different operational signatures and
    the bundles do not distinguish them.  It matters for how a consumer would
    detect this in production.
  - >-
    Are there other decoders whose loop step comes from a raw file-declared size
    with no structural floor?  This is a liveness analogue of the bound-shape
    sweeps and no sweep exists for it.

provenance:
  found_by: >-
    two supplied specimens, triaged through the h5cve bundle workflow in
    two untracked working bundles, orphaned and crafted; promoted jointly
    2026-08-15.  What promotion added is the branch-asymmetry framing -- the
    idx>0 arm gets a structurally positive step and the idx==0 arm does not --
    and the observation that the comment at :348-351 states the missing
    invariant explicitly.
  hdf5_build: >-
    HDF5 2.3.0 (source 4b1ffa68a840).  Neither specimen faults on any build;
    both produce non-termination or timeouts.  Workstation-local installs;
    paths not recorded.
  poke_version: GNU poke 4.3
