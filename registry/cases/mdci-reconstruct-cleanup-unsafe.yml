# When cache-image reconstruction fails partway through, the cleanup that
# unwinds it is not memory safe.
#
# Promoted from two working bundles that turned out to describe ONE libhdf5
# defect reached by two different detectors:
#   cases/mdci_reconstruct_fd_parent_uaf_dos          (NULL-deref DoS)
#   cases/mdci_reconstruct_dup_addr_heap_corruption   (double free / heap corruption)
# They are recorded together deliberately.  The failing code, the semantic
# boundary and the fix are identical; only the trigger that forces the FAIL
# differs, and the two triggers give two different impacts.  Splitting the
# record would duplicate the entire defect analysis and hide the fact that one
# cleanup fix closes both.
schema_version: 1

id: mdci-reconstruct-cleanup-unsafe
title: cache-image reconstruction failure unwinds a partially built pinned
  flush-dependency graph through a memory-unsafe cleanup
status: oracle-hardened          # h5policy rejects both specimens; libhdf5 unfixed
disclosure: >-
  n/a -- local analysis only.  Both specimens were produced by a generator script
  held outside this repository; the specimens themselves, with their sha256s, live
  in the two working bundles named under `triggers` below.  No advisory database
  was consulted, no advisory text was retrieved, and no identifier was looked up;
  the bundles' "affected/fixed version" claims are therefore NOT reproduced here
  (see coverage_gaps).

# -- Triage -------------------------------------------------------------------
record: cache_image_dependency_graph
versions: [0]                    # MDCI block version
root_cause_classification: reference_graph
violated_invariant:
  - mdci.entry_lru_consistent    # fd-parent route, first field violated at HEAD
  - mdci.entry_header_valid      # fd-parent route, second
  - mdci.parent_addr_resolvable  # fd-parent route, the dangling edge itself
  - mdci.entry_addr_unique       # duplicate-address route
validation_closure: >-
  the complete cache-image dependency graph -- every entry envelope, every entry
  address, and every flush-dependency edge those entries declare -- established
  before ANY prefetched entry or dependency edge is constructed.  No single
  entry establishes it: address uniqueness and parent resolvability are both
  properties of the entry set as a whole.
activation_before_validation:
  # Prefetched entries are inserted and pinned into the live metadata cache, and
  # flush-dependency edges built between them, while the graph is still being
  # decoded.  The duplicate/dangling detectors then fire mid-construction.
  - native_construction
entry_points:
  - h5policy (oracle) -- untrusted-strict and legacy, rejects both specimens
  - "libhdf5 H5Fopen -> H5C_protect (H5Centry.c:3033) -> H5C__load_cache_image
     (H5Cimage.c:652) -> H5C__reconstruct_cache_contents (H5Cimage.c)"
  - "shipped tools: every tool that opens the file.  h5dump -H is enough."

# -- The defect, read out of the source tree (HDF5 2.3.0 @e4b6a964723) ---------
defect: >-
  H5C__reconstruct_cache_contents builds native state as it decodes: each entry
  becomes a prefetched H5C_cache_entry_t inserted into the live cache, and
  IS_FD_PARENT entries are PINNED so their children can point at them.  Only
  after that construction has begun do the two real validity checks run --
  H5C__check_for_duplicates (H5Cimage.c:2418, a genuine HGOTO_ERROR) and the
  parent lookup that fails with "fd parent not in cache?!?" (H5Cimage.c:2533).
  Either one returns FAIL into a `done:` block (H5Cimage.c:2635-2668) that must
  now dismantle a half-built pinned graph, and that block is where the defect
  lives.  It iterates the reconstruction hash table and, per entry, unprotects,
  unpins, and calls H5AC_expunge_entry (:2657); on expunge failure it frees
  entry_ptr->image_ptr (:2659), entry_ptr->fd_parent_addrs (:2661) and the entry
  struct itself via H5FL_FREE (:2662), then frees the table node (:2667).
  Two things make that unsafe.  First, ORDER: the loop frees entries in hash
  order, not dependency order, so a parent can be expunged and freed while a
  child processed later still lists it in flush_dep_parent[].  Expunging that
  child drives H5C__prefetched_entry_notify (H5Cprefetched.c:233-244), which
  walks flush_dep_parent[] and calls H5C_destroy_flush_dependency on each --
  including the dead one.  Second, OWNERSHIP: H5FL_FREE at :2662 releases the
  entry struct, but nothing clears the pointers other entries hold to it, and
  recon_entry->entry_ptr keeps the stale value until :2666.  The freed entry is
  reachable again.
  Everything that would have caught the malformed graph earlier is an assert.
  H5C__reconstruct_cache_entry states the flags/count and LRU relations only as
  `assert((is_fd_child && fd_parent_count > 0) || (!is_fd_child &&
  fd_parent_count == 0))` (H5Cimage.c:2806) and `assert((in_lru && lru_rank >= 0)
  || (!in_lru && lru_rank == -1))` (:2813) -- compiled out under NDEBUG, and
  mirrored on the encode side at :1460/:1464.  Every neighbouring field in the
  same decoder gets a real HGOTO_ERROR.
  H5C_destroy_flush_dependency's own guards are asserts too: assert(cache_ptr)
  (H5Centry.c:3958) and assert(cache_ptr == child_entry->cache_ptr) (:3959),
  right after `cache_ptr = parent_entry->cache_ptr` (:3957).  With those
  compiled out, a torn-down parent's NULL cache_ptr flows to
  H5C__unpin_entry_real(cache_ptr, parent_entry, true) (:3995), which
  dereferences it in H5C__UPDATE_RP_FOR_UNPIN (:175).

boundary_note: >-
  The duplicate-address and dangling-parent checks are NOT missing -- libhdf5
  really does detect both, and on a minimal specimen it rejects the file
  cleanly.  The tracked fixture mdci_duplicate_entry_address.h5 (two entries, no
  pinned parents, no spray) produces a tidy libhdf5 error stack and no crash.
  What makes the cleanup fault is the PINNED-PARENT STRUCTURE present when the
  detector fires: the specimens carry IS_FD_PARENT entries that children already
  depend on, so the unwind has a real dependency graph to get wrong.  A fix that
  only moves the duplicate check earlier would close one trigger and leave the
  cleanup unsafe for the other; both halves are needed.

# -- The two triggers ---------------------------------------------------------
triggers:
  dangling_fd_parent:
    bundle: cases/mdci_reconstruct_fd_parent_uaf_dos
    specimen: 8935 bytes, input_sha256
      3126b3748e359178ac277700a97c4e3bbe6b234c4d9da0d1bde4f9511be89ba4
    how: >-
      A child entry names a flush-dependency parent address (0x18000000) that no
      entry in the image defines.  The parent lookup fails at H5Cimage.c:2533 and
      drops into the cleanup.  Entry 0 is independently malformed -- flags 0x00
      (IN_LRU clear) with lru_rank 2816 -- and entry 1 has flags 0x10 (an
      undefined bit, IS_FD_CHILD clear) with fd_parent_count 6.
    impact: >-
      NULL-pointer dereference -> SIGSEGV.  Denial of service, not a controllable
      write on this route: the faulting address is 0x801f8, the near-NULL offset
      of the replacement-policy field H5C__UPDATE_RP_FOR_UNPIN touches inside a
      H5C_t.
    crash_path: >-
      H5C__unpin_entry_real (H5Centry.c:175, cache_ptr=0x0)
      <- H5C_destroy_flush_dependency (H5Centry.c:3995)
      <- H5C__prefetched_entry_notify (H5Cprefetched.c:244)
      <- H5C__flush_single_entry (H5Centry.c:659)
      <- H5C_expunge_entry (H5Centry.c:4107)
      <- H5AC_expunge_entry (H5AC.c:593)
      <- H5C__reconstruct_cache_contents (H5Cimage.c:2657, addr=48)
      <- H5C__load_cache_image (H5Cimage.c:652)
      <- H5C_protect (H5Centry.c:3033)
    oracle_finding: H5_CORRUPT_MDCI_ENTRY_LRU_INCONSISTENT @ 5407
    tracked_fixtures:
      - malformed/mdci_entry_lru_inconsistent.h5      # the flags/rank defect, isolated
      - malformed/mdci_parent_addr_unresolved.h5      # the dangling-parent route, isolated
  duplicate_entry_address:
    bundle: cases/mdci_reconstruct_dup_addr_heap_corruption
    specimen: 2350001 bytes, input_sha256
      e52bb93f31f6057435aec3131627345dc884fd609e22847e1c47a7bf6655a3d8
    how: >-
      Two entries share one file address.  H5C__check_for_duplicates
      (H5Cimage.c:2418) detects it and drops into the same cleanup.  The specimen
      additionally carries four IS_FD_PARENT (flags 0x04) pinned parents, two
      IS_FD_CHILD (flags 0x08) children referencing them, and a 3000-entry spray
      to groom the heap.
    impact: >-
      Double free / invalid free detected by glibc -- heap corruption.  A
      stronger primitive than the DoS sibling, though no exploitability claim is
      made here and none was attempted.
    crash_path: >-
      free <- H5MM_xfree (H5MM.c:201, mem=0x55555565fc20)
      <- H5C__reconstruct_cache_contents (H5Cimage.c:2667)
    oracle_finding: H5_CORRUPT_MDCI_DUPLICATE_ENTRY_ADDRESS @ 1221225
    tracked_fixtures:
      - malformed/mdci_duplicate_entry_address.h5

# -- Measured behaviour -------------------------------------------------------
measured:
  remeasured: 2026-08-15 at h5policy b568381, hdf5 tree e4b6a964723
  oracle_after: >-
    both specimens reject_corrupt (exit 2) under untrusted-strict, and all three
    tracked fixtures reject under legacy:
    mdci_entry_lru_inconsistent.h5 @ 2092 (H5_CORRUPT_MDCI_ENTRY_LRU_INCONSISTENT),
    mdci_duplicate_entry_address.h5 @ 4142 (H5_CORRUPT_MDCI_DUPLICATE_ENTRY_ADDRESS),
    mdci_parent_addr_unresolved.h5 @ 4158 (H5_CORRUPT_MDCI_PARENT_ADDR_UNRESOLVED).
    No native state is constructed on any of them.
  libhdf5_stock: >-
    LIVE ON BOTH SPECIMENS.  Baseline build (2.3.0 Release, NDEBUG):
    h5dump -H on the fd-parent specimen -> SIGSEGV (rc 139);
    h5dump -H on the duplicate-address specimen -> "munmap_chunk(): invalid
    pointer", SIGABRT (rc 134; run-to-run also SIGSEGV -- heap-layout dependent).
  libhdf5_asserts_on: >-
    Candidate build (RelWithDebInfo, asserts live, -fsanitize=address).  Both
    abort earlier, at an assert, before the unsafe cleanup is reached:
    fd-parent specimen -> H5Cimage.c:2813 lru_rank assert (entry 0 is the first
    inconsistent field decoded); duplicate-address specimen -> H5Centry.c:3959
    `cache_ptr == child_entry->cache_ptr` inside the teardown itself.
    Note both are ASSERTION aborts, not ASan reports.  ASan produced no
    heap-buffer-overflow or use-after-free report on either specimen, because
    the assert fires first; the memory-safety evidence is the STOCK build's
    glibc invalid-free and NULL fault, not a sanitizer diagnostic.
  minimal_witness_does_not_crash: >-
    dup_addr_witness.h5 (cases/mdci_reconstruct_dup_addr_heap_corruption, built
    by make_dup_addr_witness.py) -- two entries, correct image_data_len, valid
    trailing checksum, NO pinned parents and no spray -- makes libhdf5 reject
    cleanly via the H5C__check_for_duplicates error stack with no crash.  That
    is the control that isolates the pinned-parent structure as the necessary
    ingredient, and it is why the tracked fixtures reject in the oracle without
    being crash reproducers.
  no_amplification: >-
    Explicitly measured and NEGATIVE, correcting an earlier working assumption.
    Neither specimen amplifies memory: uncapped h5dump (-H and full) on the
    fd-parent specimen peaks under 10 MB RSS before faulting, at every address
    -space cap from 2 to 6 GiB and with no cap at all.  The multi-GiB h5dump
    growth that prompted the original claim belongs to an unrelated
    driver-info-block specimen held outside this repository (60 bytes -> ~4 GiB
    and still climbing), not to this case.
  width: >-
    NOT measured at 32 bits.  The defect is pointer lifetime and teardown order,
    not arithmetic, so a width dependence is not expected -- but the local 32-bit
    build was not exercised on either specimen.

# -- Divergence from the selected build ---------------------------------------
divergence:
  oracle: reject_corrupt
  libhdf5: crashed
  libhdf5_version: 2.3.0
  classification: agreement
  note: >-
    The oracle and libhdf5 AGREE that these files must not be accepted, so there
    is no invariant-A disagreement and NO entry in
    registry/h5policy-diff-tolerances.yml is warranted or present.  h5policy
    reaches the verdict by decoding; libhdf5 reaches it by faulting.  The
    tracked fixtures derived from this case are ordinary corpus fixtures that
    both sides reject, which is why they need no exemption of any kind.

# -- Containment vs systemic remediation --------------------------------------
containment:
  status: planned          # libhdf5 side; not proposed upstream by this repo
  description: >-
    Two linked changes, both required.
    (1) Promote the assert-only guards to real errors: H5Cimage.c:2806 and :2813
    (and their encode-side twins at :1460/:1464) become HGOTO_ERROR, so a
    self-inconsistent entry is rejected before a prefetched entry exists.  The
    reject path must free partial entries WITHOUT entering
    H5C_destroy_flush_dependency.
    (2) Make the H5Cimage.c:2635-2668 cleanup memory safe regardless of what
    forced the FAIL: tear down flush dependencies before freeing any parent, or
    free in reverse dependency order; clear owning pointers after each free
    (recon_entry->entry_ptr, and the flush_dep_parent[] slots of surviving
    children) so no freed entry stays reachable.
    Both are backportable to every branch that decodes MDCI version 0 (1.10.1+)
    and neither can reject a file libhdf5 itself wrote: a well-formed cache
    image always satisfies is_fd_child<->fd_parent_count and in_lru<->lru_rank,
    and never repeats an entry address.
systemic:
  semantic_boundary: >-
    the cache-image dependency graph as one aggregate -- entry envelopes, entry
    -address uniqueness, and flush-dependency edge resolvability all established
    before the first prefetched entry is inserted into the cache.
  status: closed_in_bounded_path
  owner: h5policy (bounded decoder); libhdf5 native cleanup still open
  description: >-
    h5policy validates the whole MDCI payload with no native construction at
    all, so the class of defect cannot arise there: there is no partially built
    graph to unwind.  h5policy_validate_mdci_payload (h5_messages.pk) decodes
    every entry header, tracks seen entry addresses through h5policy_seen_u64,
    checks the flags/count and IN_LRU/lru_rank relations per entry, and defers
    flush-dependency parent resolution until every entry address is known --
    then reports any unresolved parent.  All four invariants above are enforced
    before the replay pass and before the trailing-checksum pass.
    The remaining work is entirely libhdf5's; the oracle rejecting the metadata
    does not make the native cleanup safe.
  landed_changes:
    - h5policy/pickles/h5_messages.pk (duplicate-address, LRU-consistency and
      deferred parent-resolvability checks in h5policy_validate_mdci_payload)
    - registry/findings/catalog/cache_image_dependency_graph.yml
      (H5_CORRUPT_MDCI_DUPLICATE_ENTRY_ADDRESS,
       H5_CORRUPT_MDCI_ENTRY_LRU_INCONSISTENT,
       H5_CORRUPT_MDCI_PARENT_ADDR_UNRESOLVED)
    - registry/validation-coverage.yml (mdci.entry_addr_unique,
      mdci.entry_lru_consistent, mdci.parent_addr_resolvable + test rows)
    - h5policy/tools/h5policy-gencorpus (_make_mdci_duplicate_entry_address,
      _make_mdci_entry_lru_inconsistent, _make_mdci_parent_addr_unresolved)
    - h5policy/tests/expected/malformed-mdci_{duplicate_entry_address,
      entry_lru_inconsistent,parent_addr_unresolved}.yml

# -- Reproducers --------------------------------------------------------------
reproducers:
  integration_poc:
    - cases/mdci_reconstruct_fd_parent_uaf_dos/input.h5
    - cases/mdci_reconstruct_dup_addr_heap_corruption/input.h5
  direct_fixtures:
    - h5policy/tests/malformed/mdci_entry_lru_inconsistent.h5
    - h5policy/tests/malformed/mdci_parent_addr_unresolved.h5
    - h5policy/tests/malformed/mdci_duplicate_entry_address.h5
  expectations:
    - h5policy/tests/expected/malformed-mdci_entry_lru_inconsistent.yml
    - h5policy/tests/expected/malformed-mdci_parent_addr_unresolved.yml
    - h5policy/tests/expected/malformed-mdci_duplicate_entry_address.yml
  control_fixture: h5policy/tests/valid/cache_image.h5
  regression_witness: >-
    cases/mdci_reconstruct_dup_addr_heap_corruption/dup_addr_witness.h5 --
    a PROVEN h5policy false-accept before 7f928c9 (oracle exit 0, libhdf5
    reject); at HEAD it rejects, so it now witnesses the committed fix.
  generators: >-
    The two integration specimens come from a generator script held outside this
    repository (entry-building routines for the DoS and heap-corruption shapes
    respectively); each bundle records the resulting file and its sha256, which is
    what this record relies on.  The witness is built by make_dup_addr_witness.py
    inside the dup-addr bundle, and the tracked fixtures by h5policy-gencorpus --
    both reproducible from this repo alone.
  assertions:
    stable_finding: true
    fails_before_materialization: true   # rejected while decoding the MDCI payload,
                                         # before the replay pass touches any body
    no_plugin_load: true
    no_decompression: true
    no_external_open: true
    no_user_callback: true
    no_legacy_fallback: true

backports: []          # nothing to backport in h5policy; the libhdf5 branches that
                       # would need the containment fix are every branch decoding
                       # MDCI version 0, i.e. 1.10.1 onward -- see containment.

fuzz_seed: >-
  Both specimens and dup_addr_witness.h5 are seeds for the cache_image bounded
  decoder.  The witness is the direct seed for the mdci.entry_addr_unique check;
  the fd-parent specimen is a seed for the entry-flags/LRU mutation
  neighbourhood.

compatibility_backport_risks: >-
  Low on both halves of the containment.  A cache image libhdf5 itself wrote
  always satisfies is_fd_child<->fd_parent_count and in_lru<->lru_rank and never
  repeats an entry address, so promoting the asserts rejects no valid file.  The
  cleanup reordering is invisible to valid files, which never take the failure
  path at all.  The one real risk is behavioural rather than compatibility: a
  file that today opens "successfully" on a Release build with a silently
  corrupt reconstructed cache would begin failing at open.  That is the intended
  outcome, but it will surface as a new error on files some users currently
  consider readable.

sibling_audit: >-
  Within libhdf5: the encode-side sanity path (H5Cimage.c:1460/:1464) carries the
  identical assert pair and is equally unguarded, so a writer fed a corrupt
  in-memory graph has the same blind spot.  Every route that returns FAIL out of
  H5C__reconstruct_cache_contents after construction has begun reaches the same
  cleanup, so the two triggers documented here are unlikely to be the only ones;
  H5C__make_space_in_cache failing at H5Cimage.c:2631 is a third, untested.
  Within h5policy: the aggregate LRU-ordering rules libhdf5 asserts at
  H5Cimage.c:2586-2613 (no rank 0, strict ordering, bounded holes) are NOT
  modelled -- see the open question below.

coverage_manifest_change: >-
  No new record.  cache_image_dependency_graph gains no rows from this
  promotion; all three findings and all three invariants were already landed by
  7f928c9 and the commits that followed it.  This record documents the libhdf5
  divergence those changes were built against.

# -- Open items ---------------------------------------------------------------
coverage_gaps:
  - >-
    AFFECTED-VERSION RANGE IS UNVERIFIED.  Everything here is measured on the
    single local tree e4b6a964723 (2.3.0 develop).  The originating bundles
    carried a claim of an upstream fix at 2.1.1 / 1.14.6; that claim was NOT
    reproduced, those tags were never built here, and no advisory was consulted
    to check it.  Treat "live on 2.3.0 develop" as the whole of the version
    evidence.  Building an affected tag is the [[vulnerable-version-build-recipe]]
    task.
  - >-
    No 32-bit measurement on either specimen (see measured.width).
  - >-
    Forensic profile times out on the duplicate-address specimen: the
    3007-entry / ~2.35 MB spray exceeds the 50s forensic wall clock
    (H5_UNSUPPORTED_WALK_TIMEOUT), so forensic returns
    unsupported_coverage_gap on that file by SIZE, not by a decode gap.  The
    definitive verdict comes from untrusted-strict, which rejects at 1221225
    well inside budget.
open_questions:
  - >-
    h5policy does not model the AGGREGATE LRU invariants libhdf5 asserts at
    H5Cimage.c:2586-2613 -- no entry may have rank 0, ranks must be strictly
    ordered, and holes are bounded.  A file whose per-entry IN_LRU/lru_rank
    relations are all individually consistent but whose ranks violate the
    ordering is presumably still accepted by the oracle.  No fixture built, so
    this is untested rather than known-bad.  Shared with
    registry/cases/mdci-lru-rank-assert-only.yml.
  - >-
    Is the reverse-order teardown actually sufficient?  The containment above
    proposes freeing in reverse dependency order, but the reconstruction hash
    table is not a DAG-ordered structure and a malformed image can declare
    cycles among fd parents.  A cyclic dependency graph may have no safe free
    order at all, in which case the fix must be edge-teardown-before-free rather
    than reordering.  Not analysed.
  - >-
    The expunge-failure branch reports HDONE_ERROR "unable to expunge driver
    info block" (H5Cimage.c:2663) -- a copy-paste message from unrelated code.
    Cosmetic, but it means the diagnostic a user sees on this path names the
    wrong structure entirely.

provenance:
  found_by: >-
    locally generated specimens, triaged through the h5cve bundle workflow
    2026-08-14 in cases/mdci_reconstruct_fd_parent_uaf_dos and
    cases/mdci_reconstruct_dup_addr_heap_corruption (CASE.md, source-audit.md
    in each); promoted 2026-08-15
  hdf5_build: >-
    HDF5 2.3.0 @e4b6a964723 (final_autotools_develop-607); baseline Release
    (NDEBUG) -- SIGSEGV and glibc invalid-free respectively; candidate
    RelWithDebInfo -fsanitize=address with asserts live -- SIGABRT at
    H5Cimage.c:2813 and H5Centry.c:3959 respectively.  Both are
    workstation-local installs; paths not recorded.
  poke_version: GNU poke 4.3
