# The metadata cache image carries a Jenkins checksum that the writer computes
# and the reader never looks at.
#
# This is an INTEGRITY-DETECTION case, not a memory-safety case and not an
# exploitability claim. Anyone who can rewrite the cache image can rewrite the
# object headers it shadows, so nothing here crosses a privilege boundary. What
# is lost is the thing the checksum exists to provide: detection of silent
# corruption in a structure whose contents are replayed as authoritative
# metadata. h5policy verifies the checksum; libhdf5 does not.
schema_version: 1

id: mdci-image-checksum-unverified
title: cache-image block checksum is computed on write and never verified on read
status: oracle-hardened          # h5policy rejects; libhdf5 containment not reported
disclosure: >-
  n/a -- local analysis only. Found while triaging the differential's invariant-A
  failure on malformed/cache_image_bad_checksum.h5. No advisory database was
  consulted and no identifier was looked up.

record: cache_image_dependency_graph
# Sibling records in this family:
#   mdci-lru-rank-assert-only.yml -- the per-entry guard that exists only as an
#     assert (see `asymmetry` below).
#   mdci-reconstruct-cleanup-unsafe.yml -- the memory-unsafe cleanup that runs
#     when reconstruction of a replayed image fails partway through. Relevant
#     here because a whole-image checksum, verified on read, would reject a
#     corrupted image BEFORE reconstruction begins, and so would also foreclose
#     the corruption-induced routes into that cleanup.
root_cause_classification: aggregate_object
violated_invariant: mdci.checksum_valid
entry_points:
  - h5policy (oracle) -- legacy profile, rejects with H5_CORRUPT_BAD_CHECKSUM
  - "libhdf5 H5Fopen -> H5O_protect -> H5AC_protect -> H5C_protect
     -> H5C__load_cache_image (H5Cimage.c:615) -> H5C__read_cache_image
     (H5Cimage.c:549) -> H5C__reconstruct_cache_contents (H5Cimage.c:2446)"
  - "shipped tools: every tool that opens the file. h5dump -H and h5stat both
     exit 0 on the corrupted-checksum fixture."

# ── The defect, read out of the source tree (HDF5 2.3.0 @e4b6a964723) ─────────
defect: >-
  Every checksum reference in H5Cimage.c lives in ONE function, and it is the
  writer: H5C__construct_cache_image_buffer (H5Cimage.c:262) declares chksum at
  :265, computes it with H5_checksum_metadata at :302 and encodes it at :304,
  then re-decodes its own freshly built buffer under a debug block and asserts
  the value round-trips (old_chksum at :313, recompute at :388-390,
  `assert(chksum == old_chksum)` at :392). That assert is a write-side
  self-check on a buffer the library just produced in memory.
  The read path contains no checksum code at all. H5C__load_cache_image
  (H5Cimage.c:615) mallocs image_len + 1, calls H5C__read_cache_image (:549) to
  pull the raw bytes off disk, and hands them straight to
  H5C__reconstruct_cache_contents (:2446). Neither of those two functions
  references chksum, H5_checksum_metadata, or any comparison against the
  trailing four bytes. The checksum is written, stored, and then ignored
  forever.

boundary_note: >-
  The trailing checksum is the ONLY integrity check that covers the cache image
  as a whole. Individual entries are still validated as they are reconstructed
  (the entry address range check at H5Cimage.c:2820-2824 is real, and the
  duplicate-address and dangling-fd-parent checks exist), so a corrupted image
  is not accepted unconditionally -- it is accepted whenever the corruption
  happens to leave every entry individually well formed. That is precisely the
  band a whole-image checksum is meant to cover, and it is unguarded.

asymmetry: >-
  Compare mdci-lru-rank-assert-only, the sibling case in this record. There the
  guard EXISTS but is an assert, so a debug build catches the file and a Release
  build does not. Here there is no guard on either build: the asserts-on
  candidate build opens the corrupted-checksum file exactly as the
  baseline build does, both exit 0. So this divergence cannot be surfaced by
  switching builds, only by reading the source or by checking the checksum
  independently, which is what h5policy does.

# ── Measured behaviour ───────────────────────────────────────────────────────
measured:
  fixtures: >-
    malformed/cache_image_bad_checksum.h5, generated by h5policy-gencorpus and
    owned by h5policy/tests/expected/malformed-cache_image_bad_checksum.yml. The
    MDCI payload is otherwise valid; only the trailing Jenkins checksum is
    wrong, so every cached body still decodes.
  oracle_after: >-
    rejects with H5_CORRUPT_BAD_CHECKSUM at offset 2766, object
    /<superblock-extension>, before the replay pass starts. reject_corrupt,
    exit 2.
  libhdf5_stock: >-
    OPENS THE FILE AND REPORTS SUCCESS. h5dump -H exits 0, h5stat exits 0.
  libhdf5_asserts_on: >-
    identical -- exits 0. No assert covers this, so the debug build is no more
    informative than the Release build. Contrast mdci-lru-rank-assert-only,
    which aborts at H5Cimage.c:2813 on the same build.
  image_is_really_loaded: >-
    Confirmed two ways, because "libhdf5 opens it" would otherwise be consistent
    with the image simply being skipped.
    (1) A direct H5Fget_mdc_image_info probe reports the SAME image on the valid
    control and on the corrupted-checksum fixture: rc=0, addr=2080, len=690, and
    the root group opens in both.
    (2) The sibling fixture malformed/cache_image_body_bad_ohdr.h5 -- same
    container, but with a corrupted cached BODY -- fails from inside the
    prefetched-entry path: H5C_protect (H5Centry.c:3061) "can't deserialize
    prefetched entry" -> H5C__deserialize_prefetched_entry (H5Centry.c:1891)
    "Can't deserialize image" -> H5O__cache_deserialize (H5Ocache.c:282) ->
    H5O__prefix_deserialize (H5Ocache.c:1017) "bad object header version
    number". So the cached bodies really are replayed as authoritative metadata
    out of the image; the bad-checksum file is accepted because nothing ever
    tests the checksum, not because the image is inert.
  width: >-
    NOT width dependent and not measured at 32 bits. The checksum is a fixed
    32-bit trailing field and the defect is the absence of a comparison, not
    arithmetic.

# ── Containment vs systemic remediation (strategy doc §11.5) ─────────────────
containment:
  status: planned
  description: >-
    In H5C__read_cache_image (or at the head of H5C__reconstruct_cache_contents),
    recompute H5_checksum_metadata over image_len - 4 bytes and compare against
    the trailing UINT32DECODE, failing with HGOTO_ERROR on mismatch. The writer
    already produces exactly this value at H5Cimage.c:302, so the check cannot
    reject a libhdf5-written image. Backportable and cheap: one hash over a
    buffer already resident in memory.
systemic:
  semantic_boundary: >-
    the cache image block as one aggregate -- checksum verified before ANY entry
    is decoded, on the same principle every other checksummed HDF5 structure
    follows (v2 B-tree nodes, fractal-heap blocks, free-space section lists all
    verify on load).
  status: planned
  description: >-
    The general question this raises is why the cache image is the exception.
    The audit that answers it is now done -- see systemic_audit below. Two
    corrections to what this record used to say, both of which sharpen the fix.
    (1) The sanctioned mechanism is NOT the deserialize callback. It is a
    SEPARATE vtable entry, H5C_class_t::verify_chksum (H5Cprivate.h:880),
    invoked by H5C__load_entry inside its read-retry loop (H5Centry.c:1211-1218):
    a NULL member means "this structure carries no checksum, leave now", and a
    false return re-reads the image up to H5F_GET_READ_ATTEMPTS times before
    failing. So the cache image forfeits the retry behaviour too, not just the
    integrity check.
    (2) The cache image is NOT the only checksummed structure loaded outside a
    cache client -- but it IS the only one that fails to verify.
  precedent_for_the_fix: >-
    H5Dvirtual.c is the model. A VDS's serialized source list lives in a global
    heap object, is checksummed by bespoke code on write (H5Dvirtual.c:639), and
    is verified by bespoke code on read: decode the stored value, recompute over
    block_size - 4, and HGOTO_ERROR "incorrect metadata checksum for global heap
    block" on mismatch (:908-918). It is outside the cache-client machinery for
    the same reason the cache image is, and it verifies anyway. Being outside
    H5C__load_entry is therefore not a reason to skip the check; the cache image
    is simply missing it.

systemic_audit:
  question: >-
    Is the cache image genuinely the only checksummed structure loaded outside
    the verify_chksum path? (Carried as an open question until 2026-08-15.)
  method: >-
    Enumerated every H5_checksum_metadata call site in src/ (12 files), then
    parsed all 29 `const H5AC_class_t NAME[1]` vtable instances and read off the
    7th member, verify_chksum. Cross-checked each NULL against whether that
    structure carries a checksum in the format at all.
  verified_via_the_callback: >-
    v2 B-tree hdr/internal/leaf, extensible array hdr/iblock/sblock/dblock/
    dblk_page, fixed array hdr/dblock/dblk_page, fractal heap hdr/iblock/dblock,
    free-space hdr/sinfo, object header OHDR and OHDR_CHK, SOHM table and list,
    and the superblock -- 22 classes, each with a real *_verify_chksum function
    that compares and errors.
  null_and_correctly_so: >-
    7 classes have a NULL verify_chksum, and in every case the structure carries
    no checksum in the format: v1 B-tree (H5AC_BT), driver info block
    (H5AC_DRVRINFO -- H5F_DRVINFOBLOCK_HDR_SIZE is 16 with no checksum field and
    the deserialize path decodes none), global heap collection (H5AC_GHEAP),
    local heap prefix and data block (H5AC_LHEAP_PRFX, H5AC_LHEAP_DBLK), symbol
    table node (H5AC_SNODE), and the purely in-memory H5AC_PROXY_ENTRY. No
    mismatch found -- no structure is checksummed on disk yet given a NULL
    callback.
  outside_the_cache_clients: >-
    Two structures are checksummed but not loaded through H5C__load_entry:
    the VDS heap block (H5Dvirtual.c -- verifies, see precedent_for_the_fix) and
    the metadata cache image (H5Cimage.c -- does not). That is the whole
    population.
  corroborating_detail: >-
    H5AC_PREFETCHED_ENTRY does have a non-NULL verify_chksum, but
    H5C__prefetched_entry_verify_chksum is a deliberate stub whose entire body is
    `HERROR(H5E_CACHE, H5E_SYSTEM, "called unreachable fcn.")` returning FAIL.
    Prefetched entries are constructed directly from the image rather than loaded,
    so the slot is never called -- direct evidence that the cache-image path was
    designed to bypass the verify machinery rather than having drifted out of it.
  conclusion: >-
    The open question is answered YES with one refinement: the cache image is the
    unique checksummed structure that never verifies, though not the unique one
    outside the cache clients. The systemic fix stands as scoped -- it is a
    one-structure fix, and H5Dvirtual.c already shows what it should look like.
  label: source-derived (exhaustive enumeration of call sites and vtables)

# ── Reproducers ──────────────────────────────────────────────────────────────
reproducers:
  direct_fixture: h5policy/tests/malformed/cache_image_bad_checksum.h5
  expectation: h5policy/tests/expected/malformed-cache_image_bad_checksum.yml
  control: h5policy/tests/valid/cache_image.h5
  body_corruption_sibling: h5policy/tests/malformed/cache_image_body_bad_ohdr.h5
  image_info_probe: >-
    A throwaway C program, not retained: H5Fopen, then H5Fget_mdc_image_info to
    print the reported cache-image addr/len, then H5Gopen2("/") to show the root
    group still opens. Compile it against either local build's h5cc and run it on
    valid/cache_image.h5 and on the fixture; both report the identical image,
    which is what proves the image is loaded rather than skipped. Recreating it is
    a five-line exercise -- it is described rather than referenced so this record
    depends on nothing outside the repository.

# ── Resolved ─────────────────────────────────────────────────────────────────
resolved_questions:
  - question: >-
      H5C__load_cache_image mallocs cache_ptr->image_len + 1 (H5Cimage.c:644)
      from the superblock-extension message with no EOA cross-check visible at
      that point -- the same shape as [[lheap-dblk-unbounded-alloc]]. Is the
      allocation unbounded, and does image_len + 1 wrap at SIZE_MAX?
    answer: >-
      NO to both. The bound exists, one layer up: H5O__mdci_decode
      (H5Ocache_image.c:119-123) rejects the message before the value ever
      reaches the cache, with `addr >= HADDR_UNDEF - size` ("address plus size
      overflows") and `addr + size > EOA` ("address plus size exceeds file
      eoa"). H5Fsuper.c:914 passes that validated message straight to
      H5AC_load_cache_image_on_next_protect, so image_len is bounded by the
      file's EOA by the time the malloc runs, and the wrap case is caught by the
      first of the two guards -- at size == UINT64_MAX, HADDR_UNDEF - size is 0,
      so any address fails it.
      The `+ 1` is deliberate rather than sloppy: the decoder is handed
      image_len + 1 as its buffer size so p_end lands one past the last valid
      byte, which is the convention H5_IS_BUFFER_OVERFLOW expects.
      Provenance: both guards arrived together in libhdf5 commit 26a76bafdef,
      whose subject line in the local tree reads "Fix CVE-2025-2915 (#5746)",
      and the commit is contained in tags 2.0.0, 2.1.0, 2.1.1 and 2.2.0. No
      advisory was consulted -- that identifier is quoted from the local commit
      message only, and nothing is claimed about its contents.
    residual: >-
      One real gap survives, and it is assert-only. Both guards sit behind
      `if (H5_addr_defined(mesg->addr) && mesg->size)`, so a message declaring
      size == 0 skips them entirely. image_len 0 then reaches H5C__load_cache_image,
      where the only thing standing in front of the allocation is
      `assert(cache_ptr->image_len > 0)` (H5Cimage.c:640). Under NDEBUG that
      vanishes, malloc(0 + 1) returns a 1-byte buffer, and the header decode is
      handed buf_size 1 -- p_end == buf -- so the very first
      H5_IS_BUFFER_OVERFLOW rejects it at the signature check. The Release
      outcome is therefore SAFE, and the divergence is confined to builds with
      asserts enabled. Same guard-style asymmetry as
      registry/cases/mdci-lru-rank-assert-only.yml, but with no oracle
      consequence: h5policy already rejects the file.
    measured: >-
      Three variants built from valid/cache_image.h5 by rewriting the MDCI
      message's 8-byte size field at file offset 662 and repairing the v2 object
      -header checksum at 626: size = 0xFFFFFFFFFFFFFFFF, size = 0, and
      size = 4 * filesize (past EOA).
      Baseline build, h5dump -H: all three REJECT (rc 1) -- "unable to open
      file" for the huge and past-EOA cases, an h5dump internal error for
      size == 0. Peak RSS 0.1-0.2 MiB on every variant, identical to the valid
      control, measured uncapped under a 4 GiB watchdog: there is no allocation
      growth to speak of, so the unbounded-allocation hypothesis is refuted by
      measurement and not only by reading.
      Candidate build, size == 0: aborts at H5Cimage.c:640, exit 134 -- the
      assert described above.
      h5policy rejects all three (untrusted-strict, exit 2):
      H5_CORRUPT_LENGTH_OVERFLOW @ 653 for the huge and past-EOA variants,
      H5_CORRUPT_MDCI_HEADER_TOO_SMALL @ 2080 for size == 0. Oracle and library
      AGREE on all three, so none of them warrants a diff tolerance.
    label: source-derived and measured
    follow_up: >-
      A tracked fixture for the size == 0 variant is possible but low value:
      both sides already reject it and the verdict is already carried by
      mdci.block_header_complete. Worth adding only if the assert-only
      H5Cimage.c:640 guard is ever promoted to a real check upstream, at which
      point the fixture would pin the improved diagnostic.

# ── Open items ───────────────────────────────────────────────────────────────
open_questions:
  # (the "is the cache image the only one?" question that stood here is answered
  #  in systemic_audit above -- YES for unverified, 2026-08-15. Note the question
  #  itself was mis-stated: the mechanism is verify_chksum, not deserialize.)
  # (the image_len + 1 allocation question that stood here is answered in
  #  resolved_questions below -- refuted, 2026-08-15)
  - >-
    Whether a stale-but-valid image (checksum correct, contents describing an
    earlier state of the file) is distinguishable at all. The checksum only
    proves the bytes are intact, not that they are current; nothing in the
    format binds an image to the file state it was written from.

# ── How this was investigated ────────────────────────────────────────────────
method: >-
  The differential said "libhdf5 opens => not reject_corrupt" and the obvious
  reading was the familiar one -- another lazily loaded structure libhdf5 never
  touches on a read-only open, like the SOHM and free-space cases that share
  this record's A~ exemption. That reading was wrong, and testing it is what
  produced the case: H5Fget_mdc_image_info reports the same image for the
  corrupted file as for the valid control, and the body-corruption sibling
  faults from inside H5C__deserialize_prefetched_entry, so the image is
  demonstrably loaded and replayed. Only then did grepping H5Cimage.c for
  "chksum" show every hit inside the writer. The lesson worth keeping is that
  "libhdf5 opens it" has at least three different explanations -- never loaded,
  loaded but unguarded, guarded by an assert -- and they need different fixes.

provenance:
  found_by: "differential invariant-A triage on cache_image_bad_checksum.h5; worked end to end 2026-08-14"
  hdf5_build: "HDF5 2.3.0 @e4b6a964723 (final_autotools_develop-607); baseline
    Release (NDEBUG), candidate RelWithDebInfo -fsanitize=address with asserts
    live -- both open the fixture with exit 0. Both are workstation-local
    installs; paths not recorded."
