# -- Containment vs systemic remediation --------------------------------------
containment:
  status: oracle_only
  description: >-
    THE ORACLE SIDE IS NOW CONTAINED; the libhdf5 side is not.
    libhdf5: add the `dblk->heap != heap` clause in H5HL_protect described
    under defect, and a dblk_image NULL check in H5HL_offset_into.
    h5policy: the detection point is a file-scoped set of local-heap
    data-segment addresses.  h5policy_local_heap_data_addr (h5policy/pickles/
    h5_group.pk:194-262 (h5policy_local_heap_data_addr, data_seg_addr)) already
    computes and bounds data_seg_addr for every
    heap it walks and then returns it -- so the address is in hand at exactly
    the right moment, and the check is a h5policy_seen_u64 membership test
    against a per-file accumulator plus a new corrupt finding.  Model it on
    the superblock-extension alias check, h5_walk.pk:820
    (H5_CORRUPT_SUPERBLOCK_EXTENSION_ALIAS), which is the same
    invariant shape and already carries the reasoning for why an address-alias
    check belongs at the dedupe point rather than in the per-object walker.
    NOT a warning: no conforming writer emits two heaps sharing a segment
    (H5HL_create allocates a fresh data block per heap), and the consequence is
    a read-path crash, so this is corrupt-on-read and rejectable outright.
systemic:
  semantic_boundary: >-
    address ownership across cache clients.  Any structure whose in-memory
    representation is populated only by a metadata-cache deserialize callback
    inherits this hazard: an address-keyed HIT skips the callback, and the
    caller receives an object belonging to a different owner while its own
    back-pointers stay NULL.  The local heap is one instance.  The general
    boundary is "no two logically distinct structures may name one cache
    address", enforced before any client dereferences what the cache returns.
  status: closed_in_bounded_path
  owner: h5policy (bounded decoder) -- landed; libhdf5 cache-client ownership still open
  description: >-
    The narrow fix is one comparison in one function.  The systemic question is
    which other cache clients link themselves to their owner inside their
    deserialize callback and are therefore reachable in the same
    half-initialised state.  That sweep has NOT been done -- see sibling_audit
    for the two neighbours that are already recorded and the list of clients
    that are not.
  landed_changes:
    - h5policy/pickles/h5_group.pk (h5policy_check_lheap_segment_owner; called
      from h5policy_local_heap_data_addr, so it covers BOTH callers -- the
      symbol-table group walk and the external-file-list heap)
    - h5policy/pickles/h5_walk.pk (the (prefix, segment) accumulator, its cap,
      and its reset in h5policy_reset_traversal_state)
    - registry/findings/catalog/heap_structures.yml
      (H5_CORRUPT_LOCAL_HEAP_DATA_SEGMENT_ALIAS, scope reference_graph)
    - registry/validation-coverage.yml (heap.local_data_segment_unique)
    - h5policy-gencorpus _make_lheap_data_segment_alias plus the valid control
      _two_stab_groups, and both expectations under h5policy/tests/expected/

# -- Reproducers --------------------------------------------------------------
reproducers:
  integration_poc: h5policy/tests/malformed/lheap_data_segment_alias.h5
  control_fixture: h5policy/tests/valid/two_symbol_table_groups.h5
  expectations:
    - h5policy/tests/expected/malformed-lheap_data_segment_alias.yml
    - h5policy/tests/expected/valid-two_symbol_table_groups.yml
  fixture_note: >-
    The .h5 binaries are gitignored build output (h5policy/tests/.gitignore);
    the tracked artifacts are the gencorpus generator and the two expectation
    files.  THE PAIR IS THE POINT, and here for a reason specific to a
    uniqueness check: it can fail in two directions, and the malformed fixture
    only catches one.  The control catches the other -- firing on a heap that is
    merely DECODED TWICE, which is a live path (SOHM-shared external-file-list
    messages are decoded once per referencing object).  The control is also
    what makes a seam leak legible, since a segment address surviving from a
    previous analysis would turn its first heap into a false reject.
  direct_fixture: >-
    the synthetic witness, rebuildable from the recipe below in about ten lines
    of h5py plus struct.  Prefer it over the specimen for every purpose: it is
    minimal, it isolates this defect from the specimen's unrelated hard-link
    cycle, and it faults all three shipped tools instead of only a direct probe.
  generator: >-
    RECIPE, verified end to end 2026-08-22.  Not yet a gencorpus generator --
    see coverage_gaps.
      1. With h5py, write a file containing two sibling groups that each hold a
         link, so each group gets a symbol table and its own local heap:
           g1 = f.create_group("g1"); g1["a"] = arange(3)
           g2 = f.create_group("g2"); g2["b"] = arange(3)
         Default h5py gives superblock v0 with 8-byte addresses and lengths.
      2. Locate every local-heap prefix by scanning for the "HEAP" signature.
         Layout is signature(4) version(1) reserved(3), then data-segment size
         at +8, free-list head at +16, data-segment address at +24 (all length
         or offset sized).  Expect three: the root group's and the two groups'.
      3. Take the FIRST group heap's data-segment bytes and append a copy at
         end of file; note that offset as `shared`.
      4. Write `shared` into the data-segment address field (+24) of BOTH group
         heap prefixes.
      5. Raise the superblock v0 end-of-address field (offset 40) to the new
         file length so `shared` is inside the allocated space.
    WHY EACH STEP MATTERS, because three plausible shortcuts all produce a file
    that proves nothing:
      - `shared` must be adjacent to NEITHER prefix.  H5HLcache.c:438 sets
        single_cache_obj from `prfx_addr + prfx_size == dblk_addr`, and a heap
        on the single path never creates a separate dblk cache entry at all, so
        there is no shared entry to collide on.  Appending at EOF guarantees
        non-adjacency for both.
      - both prefixes must be patched, not just one.  Aliasing the victim onto
        a donor that is itself on the single path is the same dead end.
      - the two prefixes must agree on data-segment size and free-list head.
        They do so for free here, since both groups are built the same way, but
        a hand-built variant that disagrees fails in H5HL__fl_deserialize
        before reaching the hole (measured -- see measured.state_at_the_fault).
    The local-heap prefix carries NO checksum and the edit is size-neutral, so
    no repair step is needed.
  assertions:
    stable_finding: true      # H5_CORRUPT_LOCAL_HEAP_DATA_SEGMENT_ALIAS, since 2026-08-22
    fails_before_materialization: false
    no_plugin_load: true
    no_decompression: true
    no_external_open: true
    no_user_callback: true
    no_legacy_fallback: false # legacy symbol-table groups are the carrier

backports: []                 # nothing to backport; nothing landed

fuzz_seed: >-
  The local-heap prefix's data-segment address is a high-value mutation axis and
  was NOT being mutated as one.  What makes it productive is that the
  interesting values are not out-of-range -- an out-of-file address is already
  caught by heap.data_seg_bounds -- but perfectly legal addresses that happen to
  belong to ANOTHER heap.  A fuzzer that only widens fields will never find
  this; one that substitutes field values BETWEEN like structures in the same
  file will find it immediately.  That cross-substitution strategy generalises
  to every address field in the format and is worth adding on its own merits.

compatibility_backport_risks: >-
  Effectively none, on both sides.  libhdf5's `dblk->heap != heap` clause is
  unreachable for any file whose heaps own their own data blocks, which is
  every file libhdf5 has ever written -- H5HL_create allocates the data block
  per heap.  The h5policy uniqueness check is likewise unreachable for
  conforming files.  Neither is a policy decision; both reject only files that
  already crash the library.

sibling_audit: >-
  NOT SWEPT.  This field records what is known, and the gap is the point.
  ALREADY RECORDED, same invariant shape, different structure -- these three
  should be read together, because the third one arrived independently and
  nobody connected them:
    - registry/cases/mdci-reconstruct-cleanup-unsafe.yml -- cache-image entry
      addresses are not required to be unique, and a duplicate address gives a
      double free.  That record's own note that entry-address uniqueness is
      unmodelled by the oracle is the same sentence this record has to write
      about heap data-segment addresses.
    - the superblock-extension alias check --
      h5policy/pickles/h5_walk.pk:820 (H5_CORRUPT_SUPERBLOCK_EXTENSION_ALIAS)
      -- an address that must never be reached twice, detected at the dedupe
      point.  It is the model for the h5policy
      side of this record and the only one of the three that is contained.
  So the registry now holds THREE instances of "one address, two owners" in
  three unrelated structures, two of them oracle gaps.  That is a pattern, and
  it argues for a general address-ownership pass rather than a third one-off
  check.
  NOT AUDITED, and each is a real question: every other H5AC cache client that
  links itself to a parent inside its deserialize callback.  H5HL's dblk is the
  one measured.  Candidates by the same shape -- fractal-heap direct and
  indirect blocks (dblock->hdr, iblock->hdr), v2 B-tree leaves and internal
  nodes (leaf->hdr), the extensible and fixed array clients, and the
  object-header continuation chunk -- are UNMEASURED and named here so the
  sweep has a starting list, not because any of them is known to be affected.
  ALSO UNSWEPT, one level up: whether two symbol-table messages may name the
  same local-heap PREFIX address (rather than the same data segment).  Cheap to
  test, not tested, and a different code path from this record.
  NOT part of this record: the hard-link cycle in the specimen.  It is a real
  structural feature of that file, it is not a defect, and libhdf5's
  visited-object sets (H5G_visit in src/H5Gint.c, h5trav in
  tools/lib/h5trav.c) handle it correctly -- which the bundle itself measured
  and then discounted.  The project's own strategy text treats group-link
  cycles as potentially valid; nothing here changes that.

# -- Affected versions --------------------------------------------------------
version_range:
  affected: >-
    UNVERIFIED as a range.  Measured at 2.3.0 only.  The structure of the
    defect -- prefix and data-block split across two cache clients, with the
    linking done in H5HL__dblk_new -- is long-standing, so 1.14.x and 1.10.x
    are plausible and explicitly NOT audited.
  label: one point, not a range

