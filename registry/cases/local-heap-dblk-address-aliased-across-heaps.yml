# Two local-heap prefixes may name the SAME data-segment address.  The metadata
# cache keys entries by address, so the second H5AC_protect(H5AC_LHEAP_DBLK, ...)
# is a HIT: the deserialize callback -- the only code that fills in heap->dblk
# and heap->dblk_image -- never runs for the second heap, which is then used
# half-initialised.  Two NULL fields of one object, two crash sites, one cause.
#
# Promoted 2026-08-22 from a working bundle (gitignored h5cve scratch; the
# specimen is identified by provenance.input_sha256 below).
#
# THE BUNDLE'S OWN DIAGNOSIS WAS WRONG and that is worth stating first, because
# the wrong version is the memorable one.  It titled this a "hard-link cycle
# accepted by h5policy but mishandled by shipped traversal" and recommended a
# traversal/alias-handling follow-up, on the strength of h5debug dumps showing
# /g1/g2.1 -> g2 and /g2/g2.1 -> g1.  The cycle is real and it is irrelevant.
# A symbolised backtrace (which the bundle listed as Unmeasured) plus a
# synthetic witness with NO cycle at all put the defect in the local-heap cache
# client instead.  The cycle only guaranteed that one traversal touched both
# groups' heaps, which is what any full traversal does anyway.
schema_version: 1

id: local-heap-dblk-address-aliased-across-heaps
title: two local-heap prefixes naming one data-segment address make the metadata
  cache hand the second heap the first heap's data block, leaving the second
  heap's dblk and dblk_image NULL
status: oracle-hardened   # h5policy rejects as of 2026-08-22; libhdf5 unfixed
disclosure: >-
  n/a -- local analysis only.  No advisory database was consulted, no advisory
  text was retrieved, and no identifier was looked up.

# -- Triage -------------------------------------------------------------------
record: heap_structures
versions: [0]                    # local heap
root_cause_classification: cross_object_alias
violated_invariant:
  - heap.local_data_segment_unique   # landed 2026-08-22; named heap.dblk_addr_unique
                                     # in this record's first revision, before the
                                     # heap.local_* naming convention was matched
validation_closure: >-
  the SET of local-heap prefixes reachable in one file, not any single prefix.
  Each prefix here is individually well-formed: version, reserved bytes,
  data-segment size, free-list head and data-segment address all pass their own
  bounds gates, and the shared segment deserialises cleanly.  The violated
  property is a uniqueness property over the whole set, so no amount of
  per-prefix checking can see it.  This is the same shape as its two
  neighbours: superblock-extension aliasing and cache-image entry-address
  uniqueness (see sibling_audit).
activation_before_validation:
  - native_construction
entry_points:
  - "h5policy (oracle) -- REJECTS under untrusted-strict and forensic since 2026-08-22 (was: accepts, no findings)"
  - "libhdf5 H5G__stab_lookup (src/H5Gstab.c:811) -> H5HL_protect -> H5AC_protect(H5AC_LHEAP_DBLK) [cache HIT]"
  - "libhdf5 H5G__stab_iterate (src/H5Gstab.c:489) -> H5HL_protect -> same hit"
  - "crash site A: H5HL_unprotect (src/H5HL.c:436) -> H5AC_unpin_entry(NULL) (src/H5AC.c:1438)"
  - "crash site B: H5G__ent_to_link (src/H5Gent.c:382) -> H5MM_strndup(NULL + name_off) (src/H5MM.c:176)"
  - "shipped consumers: h5dump -H, h5ls -vr, h5stat, and any H5Ovisit3/H5Gopen2 traversal"

# -- The defect, read out of the source tree (HDF5 2.3.0) ---------------------
defect: >-
  An H5HL_t is populated by TWO different cache clients, and only one of them is
  guaranteed to run.

  H5HL__cache_prefix_deserialize (src/H5HLcache.c:436-464) decides how the heap
  is cached, from the file's own bytes:
    if (heap->dblk_size) {
        if (H5_addr_eq((heap->prfx_addr + heap->prfx_size), heap->dblk_addr))
            heap->single_cache_obj = true;      /* :440  prefix carries the data */
        else
            heap->single_cache_obj = false;     /* :464  separate dblk entry     */
    }
  In the false branch the prefix deserialize does NOT allocate dblk_image.  The
  fields heap->dblk and heap->dblk_image are filled in exactly once, by the
  DATA-BLOCK client: H5HL__cache_datablock_deserialize (:693-719) calls
  H5HL__dblk_new, which does the linking (src/H5HLdblk.c:98-99):
    dblk->heap = heap;
    heap->dblk = dblk;

  H5HL_protect (src/H5HL.c:335-350) then reaches that client through the cache:
    if (NULL == (dblk = (H5HL_dblk_t *)H5AC_protect(f, H5AC_LHEAP_DBLK,
                                                    heap->dblk_addr, heap, flags)))
        HGOTO_ERROR(...);
    pin_obj = dblk;
    ...
    if (H5AC_pin_protected_entry(pin_obj) < 0) ...
    heap->prots++;

  THE HOLE: H5AC_protect is an address-keyed cache lookup.  `heap` is passed as
  udata, which the cache uses ONLY on a miss, to deserialize.  If some other
  heap already loaded the entry at that address, this is a HIT: the deserialize
  callback does not run, H5HL__dblk_new does not run, and the H5HL_dblk_t handed
  back belongs to the OTHER heap.  H5HL_protect pins it, increments prots, and
  returns successfully.  Nothing anywhere compares dblk->heap to heap.

  So the second heap is now live with prots == 1, single_cache_obj == false, and
  BOTH heap->dblk == NULL and heap->dblk_image == NULL.  Two consumers then
  dereference those NULLs, and which one you hit is a layout accident:

  (A) H5HL_unprotect (src/H5HL.c:425-437), on the last unprotect:
        assert(heap->dblk);                         /* :432 -- debug builds only */
        if (FAIL == H5AC_unpin_entry(heap->dblk))   /* :436 */
      Under NDEBUG the assert is gone and H5AC_unpin_entry(NULL) executes
        cache_ptr = entry_ptr->cache_ptr;           /* src/H5AC.c:1438 */
      on a NULL entry_ptr.  MEASURED, both directions: the shipped Release build
      SIGSEGVs there, and the assert-enabled build stops at the assert one line
      earlier.  This is NOT an assert-only defect -- the assert is what HIDES it
      from a debug build, and removing asserts is what makes it exploitable
      rather than what contains it.

  (B) H5G__ent_to_link (src/H5Gent.c:379-382):
        if (NULL == (name = (const char *)H5HL_offset_into(heap, ent->name_off)))
            HGOTO_ERROR(...);
        if (NULL == (lnk->name = H5MM_strndup(name, (block_size - ent->name_off))))
      H5HL_offset_into (src/H5HL.c:391-394) bounds `offset` against dblk_size
      and then returns `heap->dblk_image + offset` -- it never checks
      dblk_image itself.  With dblk_image NULL the return value is
      (char *)0 + name_off, which is non-NULL for any name_off > 0, so the
      caller's NULL guard passes and strndup reads from the zero page.

  THE FIX IS ONE COMPARISON, in H5HL_protect right after the protect returns:
    if (dblk->heap != heap)
        HGOTO_ERROR(H5E_HEAP, H5E_CANTPROTECT, NULL,
                    "local heap data block is already owned by another heap");
  This is a strict tightening: for a conforming file the entry at
  heap->dblk_addr can only ever have been loaded by this heap, so the clause is
  unreachable.  H5HL_offset_into should also assert-and-check dblk_image, as
  defence in depth for any other path that reaches a half-initialised heap.
  Note that H5HL_protect's own re-entrant path (heap->prots != 0, :328) is
  CORRECT and is not the bug: it skips the protect because the SAME heap
  already holds a pinned dblk.  The bug is a DIFFERENT heap object arriving at
  an address whose entry is already owned.

# -- Measured behaviour -------------------------------------------------------
measured:
  MEASURED: >-
    2026-08-22, at HEAD, against libhdf5 2.3.0 (source tree at develop
    f8f0379c7c5ef3cd4939cb9e115d2fd3502e1748).  Both a fuzzer specimen and a
    purpose-built synthetic witness were measured; the synthetic one is the
    better artifact and is described under reproducers.
  oracle_as_found: >-
    ACCEPTED.  decision `accept`, ZERO findings, under untrusted-strict AND
    forensic -- on the specimen and on the synthetic witness alike.  A clean
    false accept, not a profile artifact and not a coverage_gap: the oracle
    walked both heaps, validated each prefix, and never compared their
    data-segment addresses to each other.
  oracle_now: >-
    REJECTS, since 2026-08-22.  `reject_corrupt` with exactly one finding,
    H5_CORRUPT_LOCAL_HEAP_DATA_SEGMENT_ALIAS, under untrusted-strict AND
    forensic, on both files: on the specimen at offset 1744 (prefix 1720's
    segment-address field, = 1720 + 8 + 2*8) attributed to the second group
    reached, and on the tracked fixture at offset 5088.  The finding lands on
    the field that carries the duplicate address, with the earlier claimant's
    matching field as the evidence's second location, so both disagreeing
    prefixes are named rather than just the value they agree on.
    Verified NOT to over-fire: the code appears on ZERO of the 242 corpus
    fixtures, and the check keys on the (prefix, segment) PAIR precisely so that
    a heap decoded twice -- a SOHM-shared external-file-list message is decoded
    once per referencing object, and duplicate messages run their validator
    twice -- stays silent.  h5policy-seamcheck passes 40/40 on both clauses over
    mutants seeded from this fixture and its control, which is the check that
    would catch the accumulator leaking across the analysis seam.
  libhdf5_on_the_specimen: >-
    The specimen is the WEAKER of the two, and its tool matrix is misleading
    enough to have caused the bundle's misdiagnosis:
      h5ls -vr    rc=0    (traversal stops on the alias, looks correct)
      h5dump -H   rc=1    ("internal error")
      h5stat      rc=1    ("unable to traverse objects/links in file")
    Only a direct probe reaches the fault: H5Gopen2("/g2/g2.1") SIGSEGVs on the
    Release build and hits assert(heap->dblk) on the assert-enabled build.  A
    reader looking only at the three tools would conclude the file is contained.
  libhdf5_on_the_synthetic_witness: >-
    ALL THREE SHIPPED TOOLS SIGSEGV -- h5dump -H, h5ls -vr and h5stat all
    rc=139 -- and so does a bare H5Ovisit3.  The witness carries no hard-link
    cycle and no other defect; the only edit is the data-segment address of two
    heap prefixes.  So the honest severity of this record comes from the
    witness, not from the specimen: a two-field edit to a conforming file turns
    every shipped reader into a segfault on open-and-list.
  crash_sites: >-
    Specimen, symbolised (this closes the bundle's "no full debug backtrace"
    limit):
      H5AC_unpin_entry (thing=0x0) at src/H5AC.c:1438
      H5HL_unprotect (heap=0x...) at src/H5HL.c:436
      H5G__stab_lookup at src/H5Gstab.c:832
      H5G__obj_lookup -> H5G__traverse_real -> H5G_traverse -> H5G_loc_find
      -> H5G__open_name -> H5VL__native_group_open -> H5Gopen2
    Synthetic witness, ASan:
      SEGV READ on address 0x8 (zero page) in strndup interceptor
      H5MM_strndup at src/H5MM.c:176
      H5G__ent_to_link at src/H5Gent.c:382
      H5G__node_iterate -> H5B__iterate_helper -> H5B_iterate
      -> H5G__stab_iterate at src/H5Gstab.c:504 -> H5G__obj_iterate -> H5Ovisit3
    The 0x8 is literally NULL + name_off, which is the whole of finding (B).
  state_at_the_fault: >-
    Captured under gdb on the specimen, breakpointing H5HL_protect and
    H5HL_unprotect.  The donor heap and the victim heap in full:
      prefix@744  dblk_addr=3120  prots=1 single=0 dblk=0x...3b00 dblk_size=48
      prefix@1720 dblk_addr=3120  prots=1 single=0 dblk=(nil)    dblk_size=48
    Two distinct prefixes, one data-segment address, and the second heap's dblk
    back-pointer is NULL.  h5debug confirms it from the file side: reading
    address 744 and address 1720 both report "Address of heap data: 3120",
    both "Data bytes allocated for heap: 48", both with the same free block.
    The shared segment deserialises cleanly precisely BECAUSE the two prefixes
    agree on size and free-list head -- a disagreement makes the first
    deserialize fail loudly instead (measured: an early witness attempt whose
    prefixes disagreed produced a clean "bad heap free list" error from
    H5HL__fl_deserialize, src/H5HLcache.c:241, and never reached the hole).
    That is the trap for anyone building variants: the alias must be
    SELF-CONSISTENT to be dangerous.
  width: >-
    NOT measured at 32 bits.  Unlike the free-list wrap next door, nothing here
    is width-dependent -- the defect is a missing ownership comparison, not
    arithmetic -- so ILP32 is expected to behave identically.  Expected, not
    measured; do not cite this as evidence.
  write_path: >-
    NOT measured.  Read-only traversal is already fatal, so no RDWR probe was
    needed to establish impact.  Whether the shared segment can be made to
    corrupt the donor heap's free list through the victim's write path is an
    open question, not a claim (see open_questions).

