    ASan build stops at assert(heap->dblk) (src/H5HL.c:432) and may record this
    as assert-only.  It is not: the shipped Release build reaches
    H5AC_unpin_entry(NULL).  Measure both builds or the severity is wrong by a
    category.
  - >-
    No 32-bit measurement (expected identical -- no arithmetic involved -- but
    unmeasured), and no RDWR/write-path measurement.
  - >-
    The other cache clients with the same deserialize-links-to-parent shape are
    unaudited.  List in sibling_audit.
open_questions:
  - >-
    Can the victim heap's WRITE path corrupt the donor's data block?  Both
    heaps hold a pinned reference to one H5HL_dblk_t while disagreeing about
    who owns it; H5HL_insert and H5HL__fl_serialize operate through
    heap->dblk_image, which is NULL for the victim, so the likely outcome is a
    NULL write rather than cross-heap corruption -- but that is reasoning, not
    a measurement.
  - >-
    Is H5HL_offset_into's missing dblk_image NULL check reachable from any
    caller OTHER than a half-initialised heap?  If not, fixing H5HL_protect
    alone closes both crash sites and the second fix is defence in depth; if
    so, it is an independent defect and deserves its own record.
  - >-
    Does the metadata cache have, or want, a general ownership assertion at
    protect time -- "the udata I passed matches the entry I got back" -- rather
    than N per-client comparisons?  This record's fix is the per-client one
    because it is one line and provably safe; the general form is the systemic
    answer and is a cache design question, not a heap one.

