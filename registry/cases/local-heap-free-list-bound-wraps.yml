# The local-heap free-list bounds check is written as an ADDITION on size_t, so
# a free block claiming 2**64-1 bytes wraps the sum and is admitted into a
# 48-byte heap.
#
# Promoted from one working bundle (gitignored h5cve scratch; the specimen is
# identified by provenance.input_sha256 below).
#
# RE-MEASURED 2026-09-02, and three things in this record were WRONG.  (1) The
# wrong-terminator variant was said not to reach the defect; it does.  (2) The
# tracked fixture was described as proving the oracle rule while only the
# untracked bundle variant showed the memory error; the fixture shows it too,
# with a long enough name.  (3) The width note said a 64-bit-tuned specimen need
# not reproduce at 32 bits; the same file faults at both.  Each correction is
# marked where it applies, and the evidence is in
# measured.REMEASURED_2026_09_02.  The defect itself is unchanged and unfixed at
# develop b7b85e7abf9; a RELEASE is now measured faulting.
# That specimen carries TWO independent defects.  The other one -- the
# superblock driver-info address -- is recorded separately in
# registry/cases/driver-info-block-fields-unbounded.yml.  They share a file and
# nothing else: different structure, different decoder, different consumer,
# different impact.  The bundle's own notes call them "two independent defects
# in one specimen", and splitting the records follows that.
schema_version: 1

id: local-heap-free-list-bound-wraps
title: the local-heap free-list bound is an addition on size_t, so an
  oversized free block wraps past it and is published into the heap free list
status: oracle-hardened          # h5policy rejects; libhdf5 unfixed
disclosure: >-
  n/a -- local analysis only.  No advisory database was consulted, no advisory
  text was retrieved, and no identifier was looked up.

# -- Triage -------------------------------------------------------------------
record: heap_structures
versions: [0]                    # local heap
root_cause_classification: local_decode
violated_invariant:
  - heap.free_list_valid
validation_closure: >-
  the local heap's data segment together with its whole free-list chain: every
  node's offset and size bounded against the segment as a SET, before any node
  is published into heap->freelist.  A node-at-a-time check is enough only if
  it cannot wrap, which is exactly what fails here.
activation_before_validation:
  - native_construction
entry_points:
  - h5policy (oracle) -- rejects under untrusted-strict and forensic
  - "libhdf5 H5HL_protect -> H5HL__cache_dblk_deserialize -> H5HL__fl_deserialize (src/H5HLcache.c)"
  - "reached from H5Lget_name_by_idx -> H5G__stab_get_name_by_idx -> H5HL_protect (src/H5Gstab.c)"
  - "the WRITE consequence needs RDWR: H5HL__fl_serialize and H5HL_insert, reached from H5Gcreate2"

# -- The defect, read out of the source tree (HDF5 2.3.0) ---------------------
defect: >-
  H5HL__fl_deserialize walks the free-list chain and bounds each node like this:
    H5_DECODE_LENGTH_LEN(image, fl->size, heap->sizeof_size);
    if ((fl->offset + fl->size) > heap->dblk_size)                /* H5HLcache.c:258 */
        HGOTO_ERROR(H5E_HEAP, H5E_BADRANGE, FAIL, "bad heap free list");
  The check is correct in intent and wrong in form.  `fl->offset` and
  `fl->size` are both size_t and both come from the file, so the ADDITION wraps.
  With offset 32 and size 2**64-1 the sum is 31, which is comfortably less than
  a 48-byte dblk_size, and the node is admitted -- a free block claiming the
  entire address space is published into heap->freelist.
  The fix is a subtraction, and it is one line:
    if (fl->offset > heap->dblk_size || fl->size > heap->dblk_size - fl->offset)
  This is exactly the form h5policy uses, and it cannot wrap because the
  subtraction is gated by the preceding comparison.
  CONSEQUENCE IS DIRECTIONAL, and that is the interesting part.  Read-only use
  is clean: a traversal that only reads the heap never acts on the bogus node.
  Under RDWR the admitted node reaches the write path and ASan reports
  heap-buffer-overflow WRITEs in H5HL__fl_serialize (src/H5HLcache.c:308) and
  H5HL_insert (src/H5HL.c:690), the latter reached from an ordinary
  H5Gcreate2.  So creating a group in a file that merely OPENED cleanly is what
  triggers memory corruption.
  A NOTE ON THE SENTINEL, because it is a trap for anyone building variants:
  H5HL_FREE_NULL is 1, not 0 or all-ones.  variant_flnull.h5 (next-offset
  all-ones) and variant_ovf.h5 (next-offset 1, i.e. the actual terminator) are
  both rejected by h5policy with the same two findings.
  CORRECTED 2026-09-02.  This paragraph used to end "but only variant_ovf
  reaches the libhdf5 hole ... guessing the terminator wrong produces a specimen
  that looks equivalent and tests nothing."  MEASURED: variant_flnull.h5
  corrupts the heap as well, aborting the baseline build with glibc's
  `free(): invalid next size (fast)`, exactly as variant_ovf.h5 does.
  The reason is the publication order.  The node is linked into heap->freelist
  at src/H5HLcache.c:265 BEFORE the loop advances, and the error path at :271
  frees only `fl` -- the node it has NOT linked.  So a chain that fails on its
  SECOND node still leaves the first, wrapped, node on the free list of a heap
  the caller goes on to use.
  What the terminator actually buys is a clean deserialize, not reachability:
  with next-offset 1 the walk returns SUCCEED and nothing in the error path runs
  at all.  ONE WRAPPED NODE IS ENOUGH; a well-formed chain is not required, and
  a variant builder cannot make this defect harmless by getting the sentinel
  wrong.

# -- Measured behaviour -------------------------------------------------------
measured:
  REMEASURED_2026_09_02: >-
    Re-measured for a repository-advisory draft, at h5policy 117524d with a
    clean worktree, across five builds and one released library.  THE DEFECT IS
    UNCHANGED AT develop b7b85e7abf9: src/H5HLcache.c:258 still reads
    `if ((fl->offset + fl->size) > heap->dblk_size)`.  src/H5HLcache.c and
    src/H5HL.c are byte-identical between that revision and aa9df72cc21 -- the
    source the ASan builds were configured from -- so the sanitizer results
    below describe the newest code and not a stale one.
    A RELEASED LIBRARY IS MEASURED FAULTING, which this record previously could
    not say: libhdf5 1.14.5, bundled in the h5py 3.13.0 wheel, SIGSEGVs on
    `create_group` against the tracked fixture.  So does the shipped h5copy on
    the newest build.  h5repack does NOT -- it writes a fresh destination and
    never inserts into the malformed heap, which is worth knowing as a
    workaround as much as a measurement.
  write_path_measured_2026_09_02: >-
    One H5Gcreate2 after H5Fopen(RDWR).  Read-only open, traverse and close is
    clean on every build tried, so the read/write boundary this record already
    claimed is now measured on all of them rather than argued.
      develop b7b85e7abf9, stock          SIGSEGV
      develop aa9df72cc21, stock          SIGABRT -- glibc reports the damage
                                          itself: "free(): invalid next size
                                          (fast)".  NOT a sanitizer-only finding.
      ASan -DNDEBUG                       heap-buffer-overflow WRITE of size 57,
                                          memcpy from H5HL_insert (src/H5HL.c:690),
                                          0 bytes after a 96-byte region; and
                                          WRITE of size 1 at src/H5HLcache.c:308
                                          in H5HL__fl_serialize during the
                                          H5Fclose flush, 0 bytes after a
                                          56-byte region allocated at :715.
      32-bit i386, stock                  SIGSEGV
      released 1.14.5 via h5py            SIGSEGV
      shipped h5copy (newest build)       SIGSEGV
    THE NAME memcpy IS THE SERIOUS ONE.  Its length and content are those of the
    link name the APPLICATION passes -- so the bytes written past the allocation
    are neither random nor attacker-chosen but application-chosen, which is a
    third thing again and worth stating precisely rather than rounding to
    "attacker-controlled".
  instrument_note_2026_09_02: >-
    THE ASSERT BUILD CANNOT SEE THIS.  On the ASan build with asserts live, an
    UNRELATED assert fires first under H5Gcreate2 -- src/H5B.c:858,
    `assert(0 == bt->level)` -- and aborts before the heap is serialized.  The
    assert-free sanitizer build is the instrument that shows the overflow; an
    investigator who reaches for -UNDEBUG here gets a different defect's abort
    and may conclude the heap is fine.
  threshold_2026_09_02: >-
    HOW MUCH NAME IT TAKES, and who chooses it.  On the tracked fixture
    (dblk_size 88, node at offset 32) H5Gcreate2 with a name of 8, 24 or 40
    characters completes cleanly; 56 and 72 fault.  On variant_ovf.h5
    (dblk_size 48) a 12-character name is enough.
    The name length belongs to the victim application.  dblk_size belongs to the
    ATTACKER, so the threshold is tunable down to any name an ordinary program
    would use, and "our names are short" is not a mitigation.
    This also explains why the tracked fixture looked clean when this record was
    written -- see the correction under reproducers.wrap_witness.
  REMEASURED: >-
    2026-08-15, at HEAD.  The ORACLE side is confirmed; the probe side of the
    bundle sweep does NOT speak to this record, and that limitation is worth
    stating rather than glossing.
    Oracle, forensic on the shared specimen: reject_corrupt with
    H5_CORRUPT_OFFSET_OUT_OF_FILE @ 0 first and
    H5_CORRUPT_LOCAL_HEAP_FREE_LIST @ 2112 second, complete walk.  That 2112 is
    exactly the free-list head location the bundle's generation recipe names, so
    the finding lands where the recipe puts the corruption.  untrusted-strict
    stops at the driver-info defect with stop_reason prewalk_rejection and never
    reaches the heap -- as this record already said, and now measured.
    Probe: NOT EVIDENCE FOR THIS RECORD.  The sweep ran the shared specimen
    under --exercise address_space, for the driver-info record, so its result
    (stock rejected_at_open) describes the superblock defect and says nothing
    about the heap free list.  A heap_structures exercise on this specimen would
    also be confounded, because the superblock defect stops the open first.
    THE BETTER EVIDENCE IS NOW THE TRACKED FIXTURE, which isolates the heap
    defect from the superblock one: malformed/heap_free_list_size_wrap.h5 is
    measured by the differential harness on every run, where libhdf5 OPENS it
    and h5policy rejects it -- the invariant-A divergence carried by the
    tolerance entry.  That is a cleaner measurement of this record's claim than
    the bundle specimen can give, and it re-runs automatically.
  oracle_as_recorded: >-
    reject_corrupt.  In the shared specimen this is the SECOND finding --
    H5_CORRUPT_LOCAL_HEAP_FREE_LIST, "local heap free block extends outside the
    data segment" -- and untrusted-strict never reaches it, because the strict
    profile stops at the first non-accept finding, which on that file is the
    driver-info address.  Forensic reports both.  Anyone re-measuring this
    trigger specifically must use forensic or a specimen without the superblock
    defect.
  libhdf5_as_recorded: >-
    ACCEPTS.  The heap_structures family probe reports outcome=accepted on both
    the stock and the ASan 2.2.0 builds, with canary status `unexercised` --
    and that status is the point, not a pass: a read-only traversal never loads
    the heap data block, so the probe had nothing to exercise.  The bundle's
    targeted probes are what cover it.  This is the same class of false negative
    recorded for h5cve verify's "accepted".
  write_path_as_recorded: >-
    Under RDWR, ASan reports heap-buffer-overflow WRITEs in H5HL__fl_serialize
    (src/H5HLcache.c:308) and H5HL_insert (src/H5HL.c:690, reached from
    H5Gcreate2).  Read-only use is clean.
  width: >-
    MEASURED at 32 bits on 2026-09-02: the SAME file faults, SIGSEGV, on the
    i386 build.
    CORRECTION.  This field used to say a 64-bit-tuned specimen "does not
    necessarily reproduce at 32-bit and vice versa", inferring that from the
    residue depending on SIZE_MAX.  The inference missed the decode: the file
    field is sizeof_size bytes wide (8 here) and H5_DECODE_LENGTH_LEN lands it
    in a size_t, so on ILP32 the stored 0xffffffffffffffff TRUNCATES to
    0xffffffff -- and 32 + 0xffffffff wraps to 31 at 32 bits exactly as it does
    at 64.  An all-ones size is width-portable by construction; only a size
    tuned to a particular residue would not be.
    STILL NOT measured: a 32-bit AddressSanitizer libhdf5, which does not exist
    in this environment, so the i386 row is a stock crash observation rather
    than a sanitizer verdict.

# -- Divergence from the selected build ---------------------------------------
divergence:
  oracle: reject_corrupt
  libhdf5: accepted
  libhdf5_version: >-
    measured on 2.2.0 (bundle), on develop aa9df72cc21 and b7b85e7abf9, on a
    32-bit build of the same, and on released 1.14.5 via h5py; the additive
    check is present and unchanged in all of them
  classification: A -- a real invariant-A disagreement
  note: >-
    libhdf5 accepts the file and h5policy rejects it, so this is a genuine
    invariant-A divergence.  Read-only acceptance carries no information here,
    for the same reason the fill-value case's does: the defect surfaces on the
    WRITE path, which a metadata preflight and a read-only differential harness
    both structurally cannot see.
    CARRIED BY A PER-FIXTURE TOLERANCE, added 2026-08-15:
    registry/h5policy-diff-tolerances.yml, fixture
    malformed/heap_free_list_size_wrap.h5, invariant A.
    CORRECTION -- an earlier revision of this record said the opposite, that a
    finding-code-scoped A~ predicate over H5_CORRUPT_LOCAL_HEAP_FREE_LIST was
    the right shape and a tolerance was not.  That was wrong, and the test run
    that surfaced the hard failure is what settled it.  The usual preference for
    a code-scoped predicate holds only when the explanation is code-shaped, i.e.
    when EVERY fixture hitting that code deserves the exemption.  Here it does
    not: the same finding is emitted by malformed/bad_heap_free_list.h5, whose
    out-of-segment free-list head libhdf5 genuinely catches and where the
    differential already agrees.  A code-scoped predicate would excuse that one
    too, which is precisely the over-broad exemption the form exists to avoid.
    The pair is deliberate -- one file libhdf5 catches, one it does not -- and
    only the second is tolerable, which is what a per-fixture entry expresses.

# -- Containment vs systemic remediation --------------------------------------
containment:
  status: not_implemented        # libhdf5 side; not proposed upstream by this repo
  description: >-
    Rewrite src/H5HLcache.c:258 as a gated subtraction:
      if (fl->offset > heap->dblk_size || fl->size > heap->dblk_size - fl->offset)
    This is a STRICT TIGHTENING and cannot reject a previously-valid file: any
    free block that genuinely fits satisfies both clauses, and any that does not
    was already meant to be rejected by the additive form.  It is the lowest-risk
    containment in this registry -- one line, no behaviour change on conforming
    files, no compatibility argument needed.
    TWO COPIES, and both must change together.  src/H5HLdbg.c:82 carries the
    identical expression in the local-heap debug dump.  Fixing only the cache
    copy leaves the same wrap reachable through h5debug and, worse, leaves the
    additive form in the tree for the next reader to copy.
    The fractal-heap equivalents were swept and are NOT the same defect --
    see sibling_audit.
    WORTH FIXING IN THE SAME CHANGE, neither being this defect.  (a) Bound
    fl->size at the POINT OF USE in H5HL_insert (src/H5HL.c:690) and
    H5HL__fl_serialize (src/H5HLcache.c:308).  Both trust the node against the
    block they were handed, so a bound there contains any future route into the
    same state, not only this one -- and those are the two sites where the
    out-of-bounds writes were measured.  (b) src/H5HLcache.c:253 reports
    "free block size is zero?" while testing the NEXT-OFFSET decoded on the line
    above, not the size decoded on the line below.  The message and the value do
    not correspond, which is how a reader comes to believe the size is checked
    for zero when it is not checked at all.
systemic:
  semantic_boundary: >-
    heap segments, free lists, IDs, offsets and extents -- the free-list closure
    must clear its bounds gate as a set before any node is published into
    heap->freelist.
  status: closed_in_bounded_path
  owner: h5policy (bounded decoder); libhdf5 heap decode still open
  description: >-
    h5policy bounds each free-list node against the data segment by SUBTRACTION
    rather than addition, so it cannot wrap at any target width, and no node is
    published before the whole chain clears.  No oracle change was required by
    this case -- heap.free_list_valid was already correct.
    The remaining work is entirely libhdf5's.
  landed_changes:
    - h5policy/pickles (heap.free_list_valid, subtraction-based bound)
    - registry/findings/catalog (H5_CORRUPT_LOCAL_HEAP_FREE_LIST)
    - registry/validation-coverage.yml (heap_structures)
    - h5policy/tests/malformed/bad_heap_free_list.h5 and its expectation
    - h5policy/tools/h5policy-gencorpus (_make_heap_free_list_size_wrap) and
      h5policy/tests/expected/malformed-heap_free_list_size_wrap.yml, added
      2026-08-15 -- the wrap witness itself

# -- Advisory shape ------------------------------------------------------------
# Kept here rather than only in a working bundle; see the same field in
# registry/cases/layout-v4-ndims-lower-bound-missing.yml for why.  NOT an
# authorization to create, request an identifier for, or publish anything.
advisory_draft:
  title: >-
    The local-heap free-list bound is an addition on two file-supplied size_t
    values, so a free block declaring SIZE_MAX wraps past the check and is
    published into the heap free list, where the next insert writes out of
    bounds
  identifier: >-
    Nothing found locally suggests this is already covered, but no advisory
    database was consulted and none was looked up.
  affected_products:
    ecosystem: Other
    package: HDF5 (the C library)
    affected_versions: ">= 1.8.9"
    patched_versions: >-
      none.  Versions before 1.8.9 are affected differently and arguably worse:
      hdf5-1_8_2 bounds the free-list OFFSET and never checks the size at all.
    vulnerable_functions: >-
      H5HL__fl_deserialize (src/H5HLcache.c:258), H5HL_insert
      (src/H5HL.c:690, the out-of-bounds memcpy of the link name),
      H5HL__fl_serialize (src/H5HLcache.c:308, the out-of-bounds free-list
      encode at flush).  Public entry points: H5Fopen with H5F_ACC_RDWR followed
      by any operation that inserts a name into an old-style group's local heap
      -- H5Gcreate2 (measured), H5Lcreate_hard, H5Lcreate_soft, H5Lmove -- or the
      same through h5py create_group (measured) or the shipped h5copy (measured).
  severity: High
  cvss: "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H (base 7.8)"
  cvss_rationale: >-
    The primary consequence is an out-of-bounds WRITE whose length and content
    are those of a string the application passes to a routine documented as safe
    on any opened file, and glibc's own allocator reports its metadata damaged on
    a stock build.  Availability is measured on four builds and one released
    library; C and I are the standard reading of a heap write of this shape and
    are NOT demonstrated as a working exploit.  A service that writes to ingested
    files without user action re-scores AV:N/UI:N -> 9.8.  A submitter who
    establishes the write cannot be steered may prefer C:N/I:L -> 5.5.
  weaknesses: >-
    CWE-190 (the wrapping addition on two file-supplied size_t values);
    CWE-787 and CWE-122 (the out-of-bounds heap write, at two sites);
    CWE-1284 (a declared free-block size never bounded against its segment).
  workarounds: >-
    Do not open untrusted files for WRITING; read-only access is measured clean
    on every build.  Copy rather than modify -- h5repack writes a fresh
    destination and completes on a file that makes h5copy crash.  Validate
    first: h5policy rejects these files by name.  -UNDEBUG does not help; an
    unrelated assert fires first and hides the overflow.

# -- Reproducers --------------------------------------------------------------
reproducers:
  integration_poc: h5policy/tests/malformed/heap_free_list_size_wrap.h5
  direct_fixtures:
    # The PAIR is the point: one file libhdf5 catches, one it does not.
    - h5policy/tests/malformed/bad_heap_free_list.h5        # head out of segment -- caught
    - h5policy/tests/malformed/heap_free_list_size_wrap.h5  # size wraps the bound -- NOT caught
  expectations:
    - h5policy/tests/expected/malformed-bad_heap_free_list.yml
    - h5policy/tests/expected/malformed-heap_free_list_size_wrap.yml
  wrap_witness: >-
    malformed/heap_free_list_size_wrap.h5, tracked since 2026-08-15 and built by
    h5policy-gencorpus _make_heap_free_list_size_wrap -- next-offset 1
    (== H5HL_FREE_NULL, the real terminator) with size 2**64-1 behind a legal
    head at offset 32.  Derived from variant_ovf.h5 in the bundle, minus that
    specimen's unrelated driver-info patch.
    CORRECTED 2026-09-02, twice over.
    (1) THE TRACKED FIXTURE DOES REPRODUCE THE MEMORY ERROR.  This field
    implied only the bundle variant could, and the difference turned out to be
    the group NAME, not the file: at dblk_size 88 a 40-character name is clean
    and a 56-character one SIGSEGVs, on develop b7b85e7abf9, on 32-bit, and on
    released 1.14.5 through h5py, with a heap-buffer-overflow WRITE of size 57
    under ASan.  The corpus therefore already contains a file that demonstrates
    the write, and what was missing was the operation, not the specimen -- see
    measured.threshold_2026_09_02 and the write-path coverage gap below.
    (2) variant_flnull.h5 (next-offset all-ones) is NOT the inert control this
    field called it: it corrupts the heap too, for the reason given under
    `defect`.  It remains useful as the file that shows the defect does not need
    a well-formed chain, which is close to the opposite of what it was kept
    for.
  generator: >-
    Recorded recipe, not yet a generator: from a valid superblock-v0 file,
    write next-offset 0xffffff0000004545 and size 0xffffffffffffffff at the root
    heap's free-list head (file offset 2112).  Note the recorded recipe patches
    the superblock driver-info address at byte 55 as well -- that is the OTHER
    defect and should be omitted when building a fixture for this one alone.
  assertions:
    stable_finding: true
    fails_before_materialization: false
    no_plugin_load: true
    no_decompression: true
    no_external_open: true
    no_user_callback: unverified
    no_legacy_fallback: unverified

backports: []          # nothing to backport in h5policy.

fuzz_seed: >-
  The free-list head is a good mutation axis: offset and size are adjacent
  size_t fields with a non-obvious terminator sentinel (H5HL_FREE_NULL == 1).
  The interesting boundaries are size == dblk_size - offset (valid),
  + 1 (rejected by both), and the wrap residues near SIZE_MAX - offset.
  CORRECTED 2026-09-02: those residues do NOT have to differ per target width.
  The field is sizeof_size bytes in the file and truncates into a size_t on
  decode, so an all-ones size wraps at both widths from one specimen -- measured.
  A residue tuned to 64-bit SIZE_MAX specifically would be width-bound; all-ones
  is not.

compatibility_backport_risks: >-
  Effectively none.  The subtraction form is a strict tightening: every free
  block that fits still passes, and the only files newly rejected are those the
  additive check was already trying to reject and failed to.  No writer emits a
  free block claiming more than its heap.

sibling_audit: >-
  SWEPT 2026-08-15; full results in
  registry/cases/decoder-bound-shape-sweeps.yml.
  ONE NEW SITE, and it is a duplicate of this very expression: src/H5HLdbg.c:82
  reads `if ((freelist->offset + freelist->size) > h->dblk_size)` character for
  character, in the local-heap DEBUG dump.  Same wrap, lower severity -- it is a
  diagnostic path, so reaching it means running h5debug on a hostile file.  Fix
  it in the SAME change as src/H5HLcache.c:258, or the subtraction form lands in
  one copy and not the other and the next reader concludes the expression is
  fine because one instance of it is.
  FRACTAL HEAP: audited, and NOT an equivalent -- this closes the open item this
  field previously carried.  src/H5HFman.c:395 and :605 look identical, but
  `obj_len` is bounded three ways right after it is decoded from the heap ID
  (:326 nonzero, :328 max_direct_size, :330 max_man_size), so it cannot approach
  SIZE_MAX and the addition cannot wrap on its own.  The residual hazard is
  narrower: `blk_off` at :387 is computed by a subtraction guarded only by an
  assert (:386, compiled out under NDEBUG), so a corrupt indirect structure
  yielding obj_off < block_off could underflow it and then the additive check
  could wrap.  Two-step and assert-gated rather than the direct one-field wrap
  here; unmeasured, no specimen, low priority.
  Also cleared: src/H5Znbit.c:1212 is GUARDED (an explicit `used_size <=
  prev_used_size` wrap detector runs two lines earlier), and
  src/H5Tcompound.c:420 is the API insert path rather than raw decode.
  Still NOT audited: the 1.14.x and 1.10.x branches.
  Within h5policy: heap.free_list_valid uses the subtraction form; whether every
  other extent check in the pickles does likewise is asserted from convention,
  not verified.
  NOT part of this record: the superblock driver-info defect in the same
  specimen.  See registry/cases/driver-info-block-fields-unbounded.yml.
  ALSO NOT part of this record, and the reason a second specimen reaches this
  defect's consequence with no variant at all:
  registry/cases/local-heap-failed-load-retains-image.yml.  A failed data-block
  load leaves its image on the cached prefix, so the next protect skips
  H5HL__fl_deserialize entirely -- and the node this record's wrap admits at
  src/H5HLcache.c:265 is still on heap->freelist when it does.  Read the two
  together before concluding that a chain which fails to deserialize is safe:
  failing is not the same as being discarded.
  ALSO NOT part of this record, but the nearest neighbour in the same structure
  and worth reading beside it: the local-heap data-segment ADDRESS is bounded
  against the file and never checked for uniqueness across heaps, so two
  prefixes may name one segment and libhdf5 crashes on the second.  Different
  field, different mechanism (a missing ownership comparison, not wrapping
  arithmetic), and the opposite divergence direction -- the oracle ACCEPTS that
  one.  See registry/cases/local-heap-dblk-address-aliased-across-heaps.yml.

# -- Affected versions --------------------------------------------------------
version_range:
  affected: ">= 1.8.9"
  patched: >-
    None.  The expression is unchanged at develop b7b85e7abf9, so no release and
    no development branch contains a fix.
  before_1_8_9: >-
    AFFECTED DIFFERENTLY, and arguably worse: hdf5-1_8_2 bounds the free-list
    OFFSET (`free_block >= heap->heap_alloc`) and never checks the size at all,
    so there is no bound to wrap past.  1.8.9 is where the additive size check
    appears, in the form it still has.
  method: >-
    Archaeology run 2026-09-02 by reading src/H5HLcache.c at hdf5-1_8_2,
    hdf5-1_8_9, hdf5-1_8_14, hdf5-1_8_22, hdf5-1_10_0, hdf5-1_10_11,
    hdf5-1_12_3, hdf5_1.14.4, hdf5_1.14.5, hdf5_1.14.6, hdf5_2.0.0, hdf5_2.1.0,
    2.2.0 and develop b7b85e7abf9.  The additive bound is identical in every one
    from 1.8.9 on.  This closes the "1.14.x and 1.10.x not audited" item for the
    PRESENCE of the defect; whether those branches would take a backport
    cleanly is a different question and still open.
  the_2_0_0_guard: >-
    THE SHARPEST FACT IN THE RANGE.  2.0.0 added an overflow guard to this very
    loop -- `if (free_block > UINT64_MAX - (2 * heap->sizeof_size))` at
    src/H5HLcache.c:237, for the OFFSET addition at :240 -- so the hazard was
    recognised here, in this function, and written down.  The second addition,
    twenty lines below at :258 and on TWO file-supplied values rather than one,
    was not revisited.  A reviewer asking "was anyone thinking about overflow in
    this code?" gets the answer yes, which makes the omission harder to read as
    an oversight of the whole file and easier to read as one of a single line.
  measured_ends: >-
    EXECUTED at two points: released 1.14.5 (via the h5py-bundled library) and
    develop b7b85e7abf9, both faulting on the write path.  2.2.0 was executed by
    the original bundle.  Everything else is a source read.
  label: established (ends measured, interior source-derived)

# -- Open items ---------------------------------------------------------------
coverage_gaps:
  - >-
    CLOSED 2026-08-15.  This item read "the wrap witness is not tracked".
    variant_ovf.h5 is now the tracked fixture
    malformed/heap_free_list_size_wrap.h5, built by
    _make_heap_free_list_size_wrap and measured: reject_corrupt with EXACTLY
    ONE finding, H5_CORRUPT_LOCAL_HEAP_FREE_LIST @ 744 on /.  It keeps the
    free-list head legal at offset 32 and sets the block SIZE to 2**64-1, so the
    additive bound sums to 31 and passes -- which is what bad_heap_free_list.h5
    beside it cannot show, since that one is caught.
    As specified, it OMITS the unrelated superblock driver-info patch the
    bundle's recipe carried, so it tests one thing.
    RESIDUAL: no h5cve block yet -- libhdf5 ACCEPTS this on a read-only open, so
    the sibling's status does not transfer, and the probe reported `unexercised`
    on the bundle specimen because a read-only traversal never loads the heap
    data block.  Measure before asserting.
  - >-
    CLOSED 2026-09-02.  h5policy/tests/check_heap_write_path.py is the phase
    this item asked for: it opens malformed/heap_free_list_size_wrap.h5 RDWR on
    a COPY, calls H5Gcreate2 with a 56-character name, closes, and treats a
    signal as the PASS.  Wired into run.sh as `heapwrite`, in the exit chain and
    the diagnostic line.  It needs h5cc and skips without it.
    THREE OUTCOMES, because a clean completion here is ambiguous: it means
    either libhdf5 now bounds the node -- a real fix, and the outcome the check
    exists to notice -- or the fixture's heap geometry drifted so the name no
    longer crosses the bound.  The failure message says both, and the check
    carries two controls (a valid old-style group at the same name length, and
    the same fixture at 40 characters) so a vacuous pass is not available.
    STILL NOT COVERED, and it needs no fixture to say so: the corruption the
    RETAINED-IMAGE defect delivers on its own specimen, which needs no long name
    at all because that heap's segment is 48 bytes.  That specimen is untracked;
    see registry/cases/local-heap-failed-load-retains-image.yml.
  - >-
    CLOSED 2026-08-15 for the oracle side -- see measured.REMEASURED.  The
    bundle-specimen PROBE remains uninformative here by construction (the
    superblock defect stops the open first); the tracked fixture is the better
    measurement and re-runs with every suite invocation.
  - >-
    CLOSED 2026-09-02 -- 32 bits is measured, with the SAME file, and the
    premise that a different specimen would be needed was wrong.  See
    measured.width.  What remains unmeasured there is a 32-bit AddressSanitizer
    libhdf5, which does not exist in this environment.
  - >-
    PARTIALLY CLOSED 2026-09-02.  The fractal-heap equivalents were audited on
    2026-08-15 (see sibling_audit).  The 1.14.x and 1.10.x branches are now
    source-read for the PRESENCE of the defect and 1.14.5 is measured faulting
    (see version_range); what is still unaudited is whether a backport applies
    cleanly to those branches.
  - >-
    NEW, and it is the open question a submitter will be asked.  Whether the
    out-of-bounds memcpy in H5HL_insert can be STEERED -- to a chosen address,
    or to a chosen distance past the allocation -- was not investigated.  What is
    established is that it writes application-supplied bytes of
    application-chosen length immediately past a heap allocation whose size the
    attacker sets.  A severity above "memory corruption of unknown
    exploitability" needs that question answered.
open_questions:
  - >-
    ANSWERED 2026-08-15, see registry/cases/decoder-bound-shape-sweeps.yml.
    Both shape sweeps were run to completion.  This one found one new site
    (src/H5HLdbg.c:82, the duplicate of this expression) and cleared the rest;
    the fractal-heap question is answered in the negative.  See sibling_audit.

