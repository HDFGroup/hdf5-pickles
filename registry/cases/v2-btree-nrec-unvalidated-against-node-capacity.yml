# A v2 B-tree node's encoded record count is never checked against the capacity
# the library itself derived for that node.  Two consumers then use the count
# unbounded, one reading and one writing.
#
# Promoted from two working bundles (gitignored h5cve scratch) that describe ONE
# libhdf5 defect reached by two different consumers of the same corrupt field.
# Each is named by its specimen's input_sha256, given in full under `triggers`:
#   specimen 28574846...   (corpus seed 63; checksum location, OOB READ)
#   specimen e18bbfc9...   (corpus seed 62; record decode,     OOB WRITE)
# They are recorded together deliberately.  Both specimens over-state `nrec` in
# the same dense-link name-index tree, in files of the same lineage (BTHD at
# 749, BTLF at 787, node_size 512, leaf capacity 45); they differ only in how
# far the load path gets before the unbounded count is used.  One added
# comparison closes both.
#
# The zero-record_size SIGFPE in the same header is a SEPARATE defect and has
# its own record -- see registry/cases/v2-btree-record-size-zero-assert-only.yml
# and the `not_this_record` section below.
schema_version: 1

id: v2-btree-nrec-unvalidated-against-node-capacity
title: a v2 B-tree node's encoded record count is never bounded by the node
  capacity the library derived, so checksum lookup reads and record decode
  writes past the node allocation
status: oracle-hardened          # h5policy rejects; libhdf5 unfixed
disclosure: >-
  n/a -- local analysis only.  No advisory database was consulted, no advisory
  text was retrieved, and no identifier was looked up.  Both bundles carry
  "UNCONFIRMED offline" disclosure notes of their own and name a supplied
  corpus specimen; those provenance strings are not reproduced as claims here.

# -- Triage -------------------------------------------------------------------
record: dense_index
versions: [2]                    # v2 B-tree node format
root_cause_classification: aggregate_object
violated_invariant:
  - dense.btree_node_size
validation_closure: >-
  the v2 B-tree header together with the node it selects: node_size, rrec_size,
  the derived per-depth capacity, and the node's own encoded record count --
  all established before the node image is checksummed or deserialized.  The
  node alone does not close it, because the count is supplied by the parent
  (header root pointer, or an internal node's child pointer) while the capacity
  is a property of the header's geometry.
activation_before_validation:
  # The cache allocates node_size bytes and the loader runs verify_chksum and
  # then deserialize against it, all while the count is still unvalidated.
  - native_construction
entry_points:
  - h5policy (oracle) -- untrusted-strict rejects the plain shape; see
    profile_split for the cache-image-wrapped one
  - "libhdf5 public API: H5Fopen -> H5Gopen2('/') -> H5Gget_info -> H5Lget_name_by_idx"
  - "shipped tools: h5dump -H and h5ls both reach it"
  - h5policy-probe --exercise dense_index (H5Fopen -> H5Lvisit2)

# -- The defect, read out of the source tree (HDF5 2.3.0) ---------------------
defect: >-
  The capacity is not missing.  H5B2__hdr_init computes it on every open and
  stores it:
    sz_max_nrec = H5B2_NUM_LEAF_REC(hdr->node_size, hdr->rrec_size);   /* H5B2hdr.c:140 */
    H5_CHECKED_ASSIGN(hdr->node_info[0].max_nrec, unsigned, sz_max_nrec, size_t);  /* :141 */
  with H5B2_NUM_LEAF_REC(n, r) = ((n) - H5B2_LEAF_PREFIX_SIZE) / (r)
  (H5B2hdr.c:44), and the deeper levels from H5B2_NUM_INT_REC (H5B2pkg.h:109).
  It then sizes the native record buffer FROM that capacity:
    hdr->node_info[0].nat_rec_fac =
        H5FL_fac_init(hdr->cls->nrec_size * hdr->node_info[0].max_nrec);  /* :147 */
  So the correct bound exists, in memory, before any node is read.  Nothing on
  the load path ever compares the encoded count to it.  `max_nrec` does not
  appear in H5B2cache.c at all -- the only near-match there is `max_nrec_size`,
  an unrelated encoding width used at :672 and :788.
  The count flows in unchecked: H5B2__protect_leaf sets
  `udata.nrec = node_ptr->node_nrec` (H5B2leaf.c:185) straight from the parent,
  and the cache client then uses it twice.
  CONSUMER 1 -- checksum location, H5B2__cache_leaf_verify_chksum:
    chk_size = H5B2_LEAF_PREFIX_SIZE + (udata->nrec * udata->hdr->rrec_size);  /* H5B2cache.c:970 */
    if (H5F_get_checksums(image, chk_size, &stored_chksum, &computed_chksum) < 0)  /* :973 */
  `image` was allocated at hdr->node_size.  An inflated count places the
  checksum read past it.  The function never looks at `len`.
  CONSUMER 2 -- record decode, H5B2__cache_leaf_deserialize:
    leaf->leaf_native = H5FL_FAC_MALLOC(udata->hdr->node_info[0].nat_rec_fac);  /* :1039 */
    leaf->nrec = udata->nrec;                                                   /* :1042 */
    for (u = 0; u < leaf->nrec; u++) {
        (udata->hdr->cls->decode)(image, native, udata->hdr->cb_ctx);
        image  += udata->hdr->rrec_size;
        native += udata->hdr->cls->nrec_size;   /* :1046-1053 */
    }
  This is the sharper half, and the shape is the whole defect in two lines: the
  buffer is sized from the DERIVED CAPACITY (max_nrec, via the factory) while
  the loop is bounded by the ENCODED COUNT (udata->nrec).  Two different
  sources for one buffer.  Every record past the capacity is written outside
  it, by the client callback, which for the dense-link name index is
  H5G__dense_btree2_name_decode.
  The one place the relation is stated at all is an assert on the WRITE path --
  `assert(curr_node_ptr->node_nrec < hdr->node_info[0].max_nrec)`
  (H5B2leaf.c:344), in H5B2__insert_leaf -- compiled out under NDEBUG and not
  on the read path in any build.  H5B2leaf.c:107 confirms the buffer's true
  extent independently: it memsets `hdr->cls->nrec_size * max_nrec` bytes.
  AND THERE IS A SECOND BOUND, ALSO DISCARDED.  The metadata cache passes every
  client deserializer the actual length of the image it allocated.  Both
  consumers take it and declare it unused in their own signatures:
    H5B2__cache_leaf_verify_chksum(const void *_image, size_t H5_ATTR_UNUSED len, void *_udata)   /* H5B2cache.c:954 */
    H5B2__cache_leaf_deserialize (const void *_image, size_t H5_ATTR_UNUSED len, void *_udata, ...) /* :994 */
  with the internal-node twins identical at :553 and :594, and the header
  deserializer at :224.  So the defect is over-determined: the client could
  bound itself by `len` (what was allocated) or by `max_nrec` (what fits), and
  it uses neither, deriving its extent from the file instead.  Either bound
  alone would close it.  See pattern_note.

pattern_note: >-
  This is an instance of a class, not a one-off.  A read-only sweep of the
  local source tree on 2026-08-15 for `H5_ATTR_UNUSED` on size/length/context
  parameters found the same shape in
  registry/cases/external-link-value-strlen-unbounded.yml
  (H5L__extern_traverse discards udata_size, src/H5Lexternal.c:96) and in
  registry/cases/fill-value-size-unchecked-in-new-decoder.yml
  (H5O__fill_new_decode discards open_oh, src/H5Ofill.c:189).
  CORRECTED 2026-08-15.  An earlier revision called the marking "endemic to the
  metadata-cache client callbacks".  That was over-stated, from a truncated grep
  dominated by write-path `serialize` functions.  The completed sweep is in
  registry/cases/decoder-bound-shape-sweeps.yml: on the READ path there are five
  such sites and ALL FIVE ARE IN THIS FILE, src/H5B2cache.c -- so this record
  does not merely contain an instance of the class, it contains the class.
  THE FIX ALREADY EXISTS ELSEWHERE IN THE CODEBASE, which is the sweep's most
  useful output for this record.  H5SM__cache_list_verify_chksum
  (src/H5SMcache.c:477) discards `len` in exactly the same way, but bounds its
  file-controlled count against capacity before using it:
      /* The buffer only holds list_max messages; a corrupted header whose
       * message count exceeds that would size the checksum region past the
       * end of it. */
      if (udata->header->num_messages > udata->header->list_max)
          HGOTO_ERROR(H5E_SOHM, H5E_BADVALUE, FAIL,
                      "number of SOHM messages exceeds list size");
      chk_size = H5SM_LIST_SIZE(udata->f, udata->header->num_messages);
  That is the same check this record's containment proposes, already written,
  in an analogous cache client.  Cite it in any upstream proposal: it turns the
  argument from "here is what we think you should do" into "here is what you
  already do in H5SMcache.c".

not_this_record: >-
  A zero `rrec_size` in the same BTHD header makes H5B2_NUM_LEAF_REC divide by
  zero at H5B2hdr.c:140 -- a SIGFPE, guarded only by
  `assert(cparam->rrec_size > 0)` at :113.  That is a DIFFERENT defect: a
  different field, a different consumer, an assert-only guard rather than no
  guard at all, and a DoS rather than memory corruption.  It has its own
  record, registry/cases/v2-btree-record-size-zero-assert-only.yml, on the same
  reasoning that keeps mdci-lru-rank-assert-only.yml separate from
  mdci-reconstruct-cleanup-unsafe.yml.
  The two do meet at one line.  H5B2hdr.c:140 is where the zero-width defect
  FAULTS and where this defect's capacity is successfully COMPUTED and then
  never used.  Fixing either does not fix the other.

# -- The two consumers --------------------------------------------------------
triggers:
  checksum_location_read:
    specimen: corpus seed 63, 1299 bytes, input_sha256
      2857484691392669f1eddab578d04e559beeb38fb0deb3a2cc1f6c18ae1fbdb9
    how: >-
      BTHD at 749: type 5 (dense-link name index), node_size 512, record_size
      11, depth 0, root at 787.  Root nrec is set to 60 against a leaf capacity
      of 45 -- (512 - 10) / 11, since H5B2_LEAF_PREFIX_SIZE is 10 (4-byte
      signature + version + type + 4-byte checksum, H5B2pkg.h:91 via
      H5B2_METADATA_PREFIX_SIZE).  chk_size becomes 10 + 60*11 = 670 on a
      512-byte allocation.  H5F_get_checksums then decodes the stored checksum
      at buf + buf_size - 4 = offset 666 (H5Fio.c:534), which is 154 bytes past
      the end, and afterwards checksums buf_size - 4 = 666 bytes from the same
      512-byte buffer, so both the point read and the bulk read overrun.
      CORRECTED 2026-08-29.  This line previously read "chk_size becomes
      6 + 60*11 = 666", using 6 for the prefix.  That is wrong twice over and
      the two errors cancelled: 666 is not chk_size but chk_size - 4, the
      offset ASan reports, and a 6-byte prefix would have given a leaf capacity
      of 46 rather than the 45 stated in the same sentence and throughout this
      record.  Every measured figure -- capacity 45, the 154-byte ASan offset
      below, the crash path -- was and remains correct; only the derivation
      was wrong.
    impact: >-
      Heap over-read.  NOT a crash on the stock build: it reads out of bounds,
      compares garbage, and returns "incorrect metadata checksum after all read
      attempts".  That graceful rejection is the RESULT of the overflow, not a
      bound that prevented it -- which is exactly why the tracked fixture's
      canary status is `unexercised` rather than `violation`.
    crash_path: >-
      H5F_get_checksums (src/H5Fio.c:534)
      <- H5B2__cache_leaf_verify_chksum (src/H5B2cache.c:973)
      <- H5C__load_entry (src/H5Centry.c:1215)
      <- H5B2__protect_leaf (src/H5B2leaf.c:188)
    asan: heap-buffer-overflow, READ of size 1, 154 bytes after a 512-byte allocation
    oracle_finding: H5_CORRUPT_V2_BTREE_NODE_SIZE @ 787
    tracked_fixtures:
      - malformed/over_capacity_v2_btree_leaf.h5
      - malformed/over_capacity_v2_btree_internal.h5   # internal-node layout differs
  record_decode_write:
    specimen: corpus seed 62, input_sha256
      e18bbfc9ec8b6245f34f0da859377681144f70b15d65d87d21a352a08cb07e26
    how: >-
      The same tree shape with nrec set to 65535, the u16 maximum, against the
      same 45-record capacity -- and wrapped in a metadata cache image
      (MDCI at 1331, 564 bytes) holding one entry: addr 787 len 512, the leaf.
      The load reaches H5B2__cache_leaf_deserialize and decodes 65535 records
      into a buffer sized for 45.
    impact: >-
      Heap over-WRITE -- memory corruption, and the more serious of the two.
      The STOCK build SIGSEGVs (exit 139); no sanitizer is needed, and
      h5dump/h5ls/H5Lget_name_by_idx all fault.  Under ASan it is a
      heap-buffer-overflow WRITE of size 4, 8 bytes after a 540-byte region.
    crash_path: >-
      H5G__dense_btree2_name_decode (src/H5Gbtree2.c:293)
      <- H5B2__cache_leaf_deserialize (src/H5B2cache.c:1048)
      <- H5C__deserialize_prefetched_entry (src/H5Centry.c:1890)
      <- H5C_protect (src/H5Centry.c:3060)
      <- H5AC_protect (src/H5AC.c:1302)
      <- H5B2__protect_leaf (src/H5B2leaf.c:188)
    oracle_finding: >-
      H5_CORRUPT_V2_BTREE_NODE_SIZE @ 787 on /, under BOTH untrusted-strict and
      forensic (re-measured 2026-08-15).  The bundle recorded
      H5_UNSUPPORTED_PICKLE_COVERAGE_GAP @ 1310 for untrusted-strict; that is
      superseded -- the gap is still reported, but second and at @ 787 on
      /<cache-image-entry>.  See profile_split.
    tracked_fixtures:
      - malformed/cache_image_unshadowed_btree.h5      # forensic expectation

profile_split: >-
  SUPERSEDED 2026-08-15 by re-measurement -- the oracle improved after this
  bundle was made, and the split no longer exists.
  AS RECORDED IN THE BUNDLE: untrusted-strict stopped at the first non-accept
  finding, which on that file was the cache-image coverage gap itself, so it
  returned unsupported_coverage_gap (exit 5) with
  H5_UNSUPPORTED_PICKLE_COVERAGE_GAP @ 1310; only forensic named
  H5_CORRUPT_V2_BTREE_NODE_SIZE.  The record accordingly warned that any
  fixture for this trigger had to be written against forensic.
  AS MEASURED AT HEAD: BOTH profiles now return reject_corrupt (exit 2) and BOTH
  report H5_CORRUPT_V2_BTREE_NODE_SIZE @ 787 on / as the FIRST finding, with the
  coverage gap second and relocated -- @ 787 on /<cache-image-entry>, not @ 1310.
  So untrusted-strict names the cause on its own now.
  WHAT SURVIVES: the walk still does not complete.  Both profiles report
  walk_completed false with stop_reason cache_image_coverage_gap, because the
  image still caches bodies the oracle will not decode.  A fixture for this
  trigger therefore still needs expected_analysis with walk_completed false --
  but it may now be written against untrusted-strict, which is simpler and
  stricter than the forensic expectation this record originally required.
  This is exactly the drift the promotion workflow warns about: a bundle's
  coverage_gaps can be closed between bundling and promotion, and re-reading the
  bundle rather than re-running it preserves a limitation that no longer exists.
  Why the corruption is reachable at all despite the image: the image shadows
  the LEAF (787), while the corrupt field lives in the BTHD header at 749,
  which it leaves unshadowed.  The capacity check is pure arithmetic on BTHD
  fields and never reads leaf bytes, so it is sound to run on shadowed-leaf
  files.  That asymmetry is what makes a per-address skip correct where a
  whole-walk stop was not.

# -- Measured behaviour -------------------------------------------------------
measured:
  REMEASURED: >-
    2026-08-15, at HEAD, on both bundles.  One substantive change: the
    profile split described above is GONE -- see profile_split for the detail.
    Everything else held.
    seed-63 (70fdc813): H5_CORRUPT_V2_BTREE_NODE_SIZE @ 787 on / under
    untrusted-strict, walk complete, single finding -- identical to the bundle.
    Probe: stock rejected_in_traversal, ASan crashed (signal 6).  Unchanged.
    seed-62 (e38d9773): now reject_corrupt under BOTH untrusted-strict and
    forensic, with H5_CORRUPT_V2_BTREE_NODE_SIZE @ 787 first in both.  Probe:
    stock crashed with signal 11 (SIGSEGV) -- confirming the uninstrumented
    build faults, which is what makes this trigger the stronger of the two --
    and ASan crashed with signal 6.
    The values below are the bundles' originals, retained; where they differ
    from the re-measurement, the re-measurement is authoritative and the
    difference is called out.
  oracle_as_recorded: >-
    seed-63 specimen: reject_corrupt, H5_CORRUPT_V2_BTREE_NODE_SIZE @ 787,
    object /.  Truncation sweep exhaustive over 1300 prefixes, all
    reject_corrupt, no violations.
    seed-62 specimen: unsupported_coverage_gap (exit 5) under untrusted-strict
    with H5_UNSUPPORTED_PICKLE_COVERAGE_GAP @ 1310; reject_corrupt with
    H5_CORRUPT_V2_BTREE_NODE_SIZE @ 787 under forensic.  Truncation sweep
    exhaustive over 1896 prefixes: 1895 reject_corrupt, 1 coverage gap.
  libhdf5_stock_as_recorded: >-
    seed-63: rejected_in_traversal -- the over-read happens and is then
    reported as a checksum mismatch (see triggers.checksum_location_read.impact;
    do not read this as a bound).
    seed-62: CRASHED, SIGSEGV.  An uninstrumented build faults, which makes
    this trigger the stronger of the two and independent of sanitizer access.
  libhdf5_asan_as_recorded: >-
    seed-63: crashed, SIGABRT, heap-buffer-overflow READ of size 1, 154 bytes
    past a 512-byte allocation.  Comparison recorded as
    sanitizer_confirms_memory_safety_defect.
    seed-62: crashed, heap-buffer-overflow WRITE of size 4 at
    H5Gbtree2.c:293, 8 bytes after a 540-byte region.
    Activation counters zero on both (no external open, plugin load, write,
    network).
  valid_control: >-
    h5policy/tests/valid/dense_links.h5 -- oracle accept, stock accepted, ASan
    accepted, 41 dense_index exercises completed.  Recorded in the seed-63
    bundle; the control that shows the capacity rule does not reject valid
    dense-link trees.
  width: >-
    NOT measured at 32 bits.  Per the seed-62 bundle the u16 count and the
    720895-byte used size fit conventional 32-bit and 64-bit size_t domains, so
    no width wrap is needed to reach either consumer; allocator diagnostics and
    ABI-specific behaviour are unmeasured.

# -- Divergence from the selected build ---------------------------------------
divergence:
  oracle: reject_corrupt
  libhdf5: crashed (seed-62) / rejected-after-over-reading (seed-63)
  libhdf5_version: 2.3.0
  classification: agreement
  note: >-
    The oracle and libhdf5 agree that neither file may be accepted, so there is
    no invariant-A disagreement and NO entry in
    registry/h5policy-diff-tolerances.yml is warranted or present.  h5policy
    reaches the verdict by arithmetic on BTHD fields; libhdf5 reaches it by
    faulting, or on seed-63 by over-reading and then failing a checksum it
    fetched from out of bounds.  The tracked fixtures are ordinary corpus
    fixtures that both sides reject, so they need no exemption.

# -- Containment vs systemic remediation --------------------------------------
containment:
  status: not_implemented        # libhdf5 side; not proposed upstream by this repo
  description: >-
    One comparison, against a value the header already holds.  Before
    H5F_get_checksums in H5B2__cache_leaf_verify_chksum (H5B2cache.c:970-973)
    and before the decode loop in H5B2__cache_leaf_deserialize (:1039-1053),
    reject when `udata->nrec > udata->hdr->node_info[depth].max_nrec`.  No new
    arithmetic is required -- max_nrec is computed at H5B2hdr.c:140-141 on
    every open and is what the native buffer was sized from at :147.
    BOTH consumers need it.  Guarding only the checksum path leaves the decode
    write live, and guarding only decode leaves the read live; the two bundles
    exist to make that concrete.  The internal-node twins,
    H5B2__cache_int_verify_chksum and H5B2__cache_int_deserialize, need the
    same treatment -- their pointer layout differs, which is why the corpus
    carries a separate internal-node fixture.
    Use checked arithmetic for the chk_size product, and derive capacity from
    the exact on-disk leaf/internal layouts rather than an ad hoc constant.
    Promoting the H5B2leaf.c:344 insert-path assert is NOT a substitute: it is
    on the write path and does not run on load in any build.
systemic:
  semantic_boundary: >-
    a complete v2 B-tree node envelope -- header-derived capacity, parent
    -supplied record count, node prefix, record width, child-pointer width when
    internal, the fixed node allocation, and the trailing checksum location --
    established before the node image is checksummed or deserialized.
  status: closed_in_bounded_path
  owner: h5policy (bounded decoder); libhdf5 node load still open
  description: >-
    h5policy validates the count against the node's capacity with no native
    allocation and no cache client, so neither consumer's class of defect can
    arise: there is no node buffer to over-read and no native record array to
    over-write.  The check lives in the shared v2-B-tree geometry validator and
    therefore applies to every client role, not just the dense-link name index
    this case measures.
    The remaining work is entirely libhdf5's.
  landed_changes:
    - h5policy/pickles/h5_btree2.pk and the dense-link readers (used-byte count
      vs declared node size; before 2026-07-22 the two hand-written name-index
      readers compared it only against file_size)
    - registry/findings/catalog (H5_CORRUPT_V2_BTREE_NODE_SIZE)
    - registry/validation-coverage.yml (dense.btree_node_size)
    - h5policy/tools/h5policy-gencorpus (_make_over_capacity_v2_btree_node)
    - h5policy/tests/expected/malformed-over_capacity_v2_btree_{leaf,internal}.yml
    - h5policy/tests/expected/malformed-cache_image_unshadowed_btree-forensic.yml
    - >-
      the cache-image traversal boundary: a per-address skip of exactly the
      addresses the image caches, replacing a whole-walk stop, so unshadowed
      corruption is still reached

# -- Reproducers --------------------------------------------------------------
