    - h5policy/tests/expected/malformed-cache_image_unshadowed_btree-forensic.yml
  control_fixture: h5policy/tests/valid/dense_links.h5
  targeted_probe: >-
    btree-targeted-probe.c in each bundle -- public API only (H5Fopen,
    H5Gopen2, H5Gget_info, H5Lget_name_by_idx).  On seed-62 it faults against
    the STOCK build, so it needs no sanitizer.  node-capacity-witness.c in the
    seed-63 bundle decodes the BTHD/BTLF relation directly without libhdf5.
  generators: >-
    _make_over_capacity_v2_btree_node builds the unshadowed leaf and internal
    fixtures deterministically from this repo; _make_cache_image_shadowed_btree
    builds the cache-image one.  Neither specimen is generated -- both are
    supplied corpus finds, preserved with the sha256s above.
  assertions:
    stable_finding: true
    fails_before_materialization: true    # seed-63 as recorded; seed-62's
                                          # bundle records false, because its
                                          # coverage gap precedes the cause
                                          # under untrusted-strict
    no_plugin_load: true
    no_decompression: unverified
    no_external_open: true
    no_user_callback: unverified
    no_legacy_fallback: unverified

backports: []          # nothing to backport in h5policy.

fuzz_seed: >-
  Both specimens are seeds for the v2-B-tree node neighbourhood -- nrec at
  capacity, capacity+1, and u16 max are the interesting boundary, and the
  internal-node pointer layout is a separate axis.  seed-62 additionally seeds
  the cache-image-wrapper shape: it demonstrates that an image can be built
  around a defect, which is a mutation dimension in its own right.

compatibility_backport_risks: >-
  Low for the capacity check itself: a node whose encoded count cannot fit its
  own fixed allocation cannot have been written by a conforming library, and
  the valid control confirms ordinary dense-link trees are unaffected.  The
  implementation must calculate capacity from the exact on-disk layouts, use
  checked arithmetic, and preserve valid sparse/reserved node padding; test
  boundary counts and every supported B-tree client before backporting.
  The h5policy-side cache-image change is the one to watch, and it has already
  landed: converting a hard traversal stop into a per-address skip means files
  carrying an image are walked further than before and can surface findings
  they previously never reached.  Decisions only become stricter, never laxer,
  but a consumer pinning exact finding lists for cache-image files may see new
  entries.

sibling_audit: >-
  Within libhdf5: H5B2__cache_int_verify_chksum and H5B2__cache_int_deserialize
  carry the identical pattern for internal nodes and are equally unguarded --
  both derive from udata->nrec after the loader has allocated hdr->node_size
  bytes.  This record measures the dense-link LEAF path on both consumers; the
  internal-node path is source-reviewed but not measured, and a client-type
  matrix is not established.  Any v2-B-tree client with a decode callback is a
  candidate for the write consumer, since the callback is what performs the
  out-of-bounds store; only the type-5 dense-link name index is confirmed here.
  Chunk index (types 10/11), SOHM and fractal-heap clients are unaudited.
  Not established, and named in the seed-62 bundle: whether a cache image whose
  entries shadow the DECLARING structure -- the BTHD itself, which both
  specimens leave unshadowed -- would still be caught.  That is the residual
  blind spot of the per-address skip.

