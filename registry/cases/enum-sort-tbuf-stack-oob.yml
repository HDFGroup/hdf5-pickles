# A conformant enumeration whose base integer is wider than 32 bytes overflows
# the fixed uint8_t tbuf[32] scratch buffer that libhdf5 sorts enum members
# through.  Distinct from the datatype-size and compound-member cases: nothing is
# out of bounds at decode time and the enum is internally consistent (declared
# size equals base size).  The defect is that libhdf5's enum SORT copies `size`
# file-controlled bytes into a 32-byte stack buffer guarded only by an assert
# that release builds compile out.
schema_version: 1

id: enum-sort-tbuf-stack-oob
title: enum base size wider than the 32-byte enum-sort scratch buffer overflows it; the only guard is an assert removed under NDEBUG
status: oracle-accepts   # h5policy accepts the legal file; libhdf5 code defect; differential-tolerated (A'); predicate deferred
disclosure: >-
  n/a -- local analysis only.  An upstream private repository advisory covering
  this specimen family was opened by an external reporter on 2026-09-28; its
  identifier is deliberately omitted per repository policy and no advisory
  database was consulted.  Every claim here is measured on local builds.

record: datatypes
root_cause_classification: local_decode
violated_invariant: >-
  none enforced -- the gap is adjacent to datatype.enum_encoding, which checks
  that the enum's declared size equals its base type's size but does not bound
  that size against libhdf5's 32-byte enum-sort scratch buffer.
entry_points:
  - h5policy (oracle) -- untrusted-strict and forensic both ACCEPT; the file is
    well-formed, so this is a coverage gap, not a false accept to be hardened by
    an existing invariant
  - "libhdf5 H5Tenum_valueof -> H5T__enum_valueof -> H5T__sort_name (H5Tfields.c:418)"
  - "libhdf5 H5Tenum_nameof -> H5T__sort_value (H5Tfields.c:318)"
  - "libhdf5 H5Dread enum->enum -> H5T__conv_enum_init (H5Tconv_enum.c:131) -> H5T__sort_name"
  - "shipped tools: h5dump -d <enum dataset> aborts; h5dump -H / h5debug accept (metadata only)"
  - "h5py TypeEnumID.enum_valueof -- measures the h5py-bundled libhdf5 (1.14.5), older than the build under test"

# ── The defect, read out of the source tree (develop 0761c9ee2bcc0, v2.3.0) ──
defect: >-
  H5T__sort_value and H5T__sort_name (src/H5Tfields.c) bubble-sort an
  enumeration's members through a fixed uint8_t tbuf[32] (declared at :264 and
  :366).  The per-swap copy length is size = dt->shared->size (:306 / :407), the
  enum base-type storage size, which H5O__dtype_decode reads from the file
  (H5Odtype.c:160, UINT32DECODE) and bounds ONLY against zero (:164).  The sole
  bound at the sink is assert(size <= sizeof(tbuf)) (:307 / :408), which release
  (NDEBUG) builds compile out, so the three H5MM_memcpy(tbuf, ..., size) calls at
  :318-:321 and :418-:421 run unconditionally.  Both the overflow length (up to
  2**32-1) and the content (the enum member value bytes) are file-controlled.
  H5T_copy(H5T_COPY_ALL) clears the sorted flag (H5T.c), so the sort -- and the
  overflow -- re-runs on every call regardless of on-disk member order.

boundary_note: >-
  The threshold is exactly sizeof(tbuf) == 32: base sizes 8/16/32 do not
  overflow, 33/40/64/128 do (measured boundary sweep).  The compound arm of the
  same routines swaps whole H5T_cmemb_t structs, not through tbuf, so the sink is
  enum-only.  An enum->integer read uses H5T__conv_enum_numeric, which does not
  sort, so that read does not reach the sink; enum->enum does.

# ── Measured behaviour ───────────────────────────────────────────────────────
measured:
  fixtures: >-
    coverage/dtype_enum_oversized_base.h5 (40-byte base, full precision),
    generated byte-for-byte by h5policy-gencorpus (_make_enum_oversized_base) and
    owned by h5policy/tests/expected/coverage-dtype_enum_oversized_base.yml.
    h5py cannot write an oversized enum (its enum_insert needs a value-conversion
    path that does not exist past 8 bytes), so the fixture is assembled rather
    than written.  The reporter's integration PoCs (128- and 4096-byte bases,
    built via the public H5Tset_size + H5Tenum_create + H5Tenum_insert API) are
    not in this repository.
  oracle: >-
    ACCEPTS (decision=accept, no finding).  The enum's declared size equals its
    base size, so datatype.enum_encoding's consistency check passes, and no
    invariant bounds the base size against the sort buffer.  A reporter PoC whose
    base integer has partial precision is instead rejected incidentally by
    datatype.unused_bits; the full-precision fixture here removes that masking so
    the accept is clean.
  libhdf5_stock: >-
    release 2.3.0 (asserts off) crashes.  A standalone victim via H5Tenum_valueof
    SIGSEGVs (exit 139); h5dump -d on the enum dataset aborts (exit 134, glibc
    fortify) having entered the sort; h5dump -H and h5debug complete (exit 0) as
    they touch only metadata.
  libhdf5_asan: >-
    an ASan + NDEBUG build (settings_sha256
    c25f66c178d1da0f22f605cb4b302a80c431563d895703b68763f32ca67c11b7, built
    2026-10-02 from develop 0761c9ee2bcc) reports
    stack-buffer-overflow WRITE of `size` bytes into tbuf at H5Tfields.c:418
    (via H5Tenum_valueof and via H5Dread enum->enum) and :318 (via
    H5Tenum_nameof): size 40 on the fixture, 128 and 4096 on the reporter PoCs.
    An asserts-on build instead aborts cleanly at H5Tfields.c:408
    (Assertion 'size <= sizeof(tbuf)' failed), confirming the assert is the sole
    guard and NDEBUG is what removes it.  Workstation-local builds; paths not
    recorded.
  width: >-
    Measured on x86-64 (LP64).  The copy length is the enum base size directly,
    not a wrapped product, so the stack overflow is not width-gated the way a
    heap size-arithmetic wrap would be; 32-bit behaviour is expected to be the
    same class of stack smash and is unmeasured here.

differential_tolerance: >-
  The differential harness (h5policy-diff) raises A' on this fixture
  ("libhdf5 rejects => h5policy explicit rejection (got accept)").  The signal is
  indirect: h5dump and h5debug both return 0, but the h5py structural probe
  records open=False because NumPy cannot represent a 40-byte integer dtype
  (`data type '<i40' not understood`) -- a NumPy limitation, not a libhdf5
  rejection.  libhdf5 in fact accepts the metadata and crashes only on the data
  path.  Either reading, h5policy accepts what libhdf5 cannot safely handle, so
  the divergence is real and is recorded here and tolerated
  (registry/h5policy-diff-tolerances.yml) rather than silenced.  Promoting this
  to an oracle predicate (reject an enum base size beyond the sort buffer) is a
  separate, deferred decision -- the 32-byte bound is a libhdf5 implementation
  constant, not a file-format rule, so whether the oracle should encode it as a
  corrupt or advisory check is unsettled.

# ── Containment vs systemic remediation (strategy doc §11.5) ─────────────────
containment:
  status: planned
  description: >-
    libhdf5: replace assert(size <= sizeof(tbuf)) at H5Tfields.c:307 and :408
    with a run-time HGOTO_ERROR when size > sizeof(tbuf).  The error path through
    these routines is currently unexercised, so it needs a guard test.  A
    defence-in-depth alternative bounds the decoded enum base size in
    H5Odtype.c beyond the == 0 check.
systemic:
  semantic_boundary: the complete datatype record
  description: >-
    RawDatatype -> ValidatedDatatype must carry a size an in-memory sort can rely
    on.  Either the sort must not assume a fixed scratch width (swap via indices,
    or allocate to the base size) or the decoder must reject a base size no
    reader can sort.  A patch touching only one of the two sort routines leaves
    the other open; both H5T__sort_value and H5T__sort_name carry the pattern.

method: >-
  The specimen arrived as a reporter bundle (generator, victims, ASan logs).  It
  was treated as unverified prior work: the harness sources were rebuilt against
  the newest local libhdf5 and every conclusion re-measured.  The corpus fixture
  was then assembled to be the smallest deterministic legal witness (256 bytes,
  40-byte base) and cross-checked to parse identically to the public-API PoC and
  to still overflow the candidate build.
