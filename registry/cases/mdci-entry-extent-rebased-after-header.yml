    by-value/by-pointer asymmetry and the :2481 assignment were identified at
    promotion by reading the source; the bundle described the effect
    ("rebased remaining length") without naming the mechanism.
  input_sha256: 5f1847ba2f48655c6f3d90257ad2b2ccffa3a5d54d6e92b49d00eb82c61b538e
  hdf5_build: >-
    HDF5 2.3.0 (source 4b1ffa68a840); baseline Release --
    rejected_in_traversal; candidate RelWithDebInfo -fsanitize=address --
