  h5policy_commit: 575aa0e998c4ef97964e7a11a9a523a9f31cdda3
  poke_version: GNU poke 4.3
  hdf5_build: >-
    source read at $HDF5_SOURCE_DIR = /opt/hdf5 @ a8161b7dc67a71ba12eaba2e9ddc0b6e8b156392
    (2026-07-30). Two installed builds exercised: system distro package
    (h5dump -V 2.1.1, assertions compiled in, crashes) and
    $HDF5_RELEASE_PREFIX = /opt/hdf5-release (h5dump -V 2.3.0, RelWithDebInfo
