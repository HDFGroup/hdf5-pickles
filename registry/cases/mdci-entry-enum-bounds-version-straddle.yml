# The three single-byte enums in a cache-image entry header are unchecked on the
# whole 1.14 line and hard-checked from 2.0.0 on.
#
# This is a DIVERGENCE-AND-MEASUREMENT case. The libhdf5 defect half is real but
# already FIXED UPSTREAM, so nothing here needs reporting. The half that is live
# for this repository is that the differential harness measures the two halves
# with DIFFERENT LIBRARIES -- h5py is 1.14.5 (pre-fix), the h5dump/h5debug on
# PATH are 2.3.0 (post-fix) -- so a fixture in this family produces a split
# reading that looks like a depth-of-access effect and is actually a version
# effect. Read `oracle_straddle` before citing any A+ result from this family.
schema_version: 1

id: mdci-entry-enum-bounds-version-straddle
title: cache-image entry type_id/ring/age bounds exist only from 2.0.0, so the differential's h5py oracle and its shipped tools disagree by version rather than by depth
status: fixed-upstream            # 2.0.0+ checks all three; the 1.14 line does not
# ── CONFIRMED BY MEASUREMENT 2026-08-23 ───────────────────────────────────────
# This record's central claim -- that 2.0.0+ bounds all three entry enums at
# runtime -- is now measured on 2.3.0 rather than only source-derived.  All three
# fixtures make the first metadata protect fail:
#   H5C_protect -> "Can't load cache image"
#   -> H5C__reconstruct_cache_contents -> "reconstruction of cache entry failed"
# The guards are H5C__reconstruct_cache_entry, src/H5Cimage.c:2738-2782, and they
# run at image-load time for EVERY entry, not lazily per entry.
#
# It needed measuring because registry/libhdf5-evidence.yml had recorded the
# opposite -- these three, plus four siblings, as libhdf5 DIVERGENCES (libhdf5
# accepts what h5policy rejects) -- which contradicted this record. The registry
# was internally inconsistent, and this record was right.
#
# The divergence rows were a PROBE ARTIFACT. A cache-image load is one-shot:
# H5C_protect clears load_image before calling H5C__load_cache_image
# (src/H5Centry.c:3032), so the failing call consumes the attempt and every later
# access succeeds. h5probe's object walk retried H5Ovisit3 by name after a failed
# creation-order attempt -- a fallback meant for files that do not index by
# creation order -- and recorded only the retry, so a refused file was reported
# as cleanly accepted. Fixed by counting the first failure; measured, all 65
# accept-side corpus fixtures pass the creation-order attempt, so a first-attempt
# failure is a refusal and not a capability probe.
# Six of the seven mdci fixtures moved from `violation`/divergent to
# `verified`/aligned. The seventh, malformed/mdci_entry_lru_inconsistent.h5, did
# NOT move and remains the family's one genuine divergence -- see
# mdci-lru-rank-assert-only.yml -- which is also the control proving the probe
# fix did not simply silence the family.
# ──────────────────────────────────────────────────────────────────────────────
disclosure: >-
  n/a -- local analysis only, and nothing to disclose. The upstream fix is
  public and shipped; this record exists to explain a harness reading, not to
  report a defect. No advisory database was consulted and no identifier was
  looked up. The CVE id below was read out of the upstream commit subject in
  the source tree named in provenance.hdf5_build, not retrieved from a feed.

record: cache_image_dependency_graph
versions: [0]
# Sibling records in this family:
#   mdci-lru-rank-assert-only.yml -- the OTHER assert-only field in the same
#     decoder. Same shape, opposite status: that one is still assert-only on
#     2.3.0, so it is a live divergence with a tolerance entry. This one was
#     fixed upstream, needs no tolerance, and is filed for the version split.
#   mdci-reconstruct-cleanup-unsafe.yml -- what a rejected reconstruction does
#     on the way out. Reachable from here: a rejected entry unwinds a partially
#     built cache, which is that record's subject, not this one's.
#   mdci-image-checksum-unverified.yml -- the whole-image integrity gap.
root_cause_classification: local_decode
violated_invariant: mdci.entry_class_valid
validation_closure: >-
  each cache-image entry header's three single-byte enums bounded against their
  build constants BEFORE the entry is used to select a deserializer or inserted
  into the reconstructed cache. type_id is the load-bearing one: it is not a
  label but an index into the cache client class table, so an unbounded value
  chooses the function that will interpret the entry body.
entry_points:
  - h5policy (oracle) -- legacy and untrusted-strict, rejects with
    H5_CORRUPT_MDCI_ENTRY_CLASS from h5policy_validate_mdci_payload
    (h5policy/pickles/h5_messages.pk)
  - "libhdf5 H5Fopen -> (lazily, at the first object-header protect)
     H5O_protect -> H5AC_protect -> H5C_protect -> H5C__load_cache_image
     -> H5C__reconstruct_cache_contents -> H5C__reconstruct_cache_entry
     (src/H5Cimage.c)"
  - "shipped tools: any that touch an object, not any that open the file. The
     cache image is NOT loaded by H5Fopen itself -- see the boundary note."

# -- The defect, read out of the source tree ----------------------------------
defect: >-
  H5C__reconstruct_cache_entry decodes four single-byte fields off the front of
  each entry header -- type_id, flags, ring, age. Three of them are enums with
  a build-constant ceiling: H5AC_NTYPES (30, src/H5ACprivate.h, one past
  H5AC_PREFETCHED_ENTRY_ID), H5C_RING_NTYPES (6, src/H5Cprivate.h, one past
  H5C_RING_SB) and H5AC__CACHE_IMAGE__ENTRY_AGEOUT__MAX (100,
  src/H5ACpublic.h).
  On the 1.14 line none of the three is enforced at runtime. type_id and age are
  decoded and used with no guard of any kind, in either the read-side
  H5C__reconstruct_cache_entry or the write-side
  H5C__decode_cache_image_entry. ring carries `assert(ring > H5C_RING_UNDEFINED)`
  and `assert(ring < H5C_RING_NTYPES)` -- in BOTH decoders on 1.14.6, and in the
  write-side decoder plus the read-side reconstruct on 1.14.5 -- which compile
  out under NDEBUG, i.e. in every shipped build.
  From 2.0.0 all three are HGOTO_ERROR checks in the read path: "type id is out
  of valid range", "ring is out of valid range", "entry age is out of policy
  range".
lower_bound_note: >-
  The 2.0.0+ type_id guard reads `< H5AC_BT_ID || >= H5AC_NTYPES`, but
  H5AC_BT_ID is 0 (src/H5ACprivate.h:46), so on a uint8_t only the ceiling can
  fire. h5policy therefore models the ceiling alone, and the omission is exact
  rather than approximate.
  The ring conversion DROPPED a bound rather than merely promoting one: the
  pre-fix asserts constrained ring from both sides, and the check that replaced
  them is `>= H5C_RING_NTYPES` only. Ring 0 (H5C_RING_UNDEFINED) is thus
  accepted by every shipped libhdf5 of every version -- pre-fix because the
  assert is compiled out, post-fix because the lower bound is gone. This is why
  h5policy deliberately does not reject ring 0, and the reason is stronger than
  the Release-vs-debug argument alone: it holds by construction on the fixed
  library too.

# -- The version split, which is the point of this record ---------------------
version_range:
  affected: >-
    The entire 1.14 line, verified at two points by reading src/H5Cimage.c at
    the hdf5_1.14.5 and hdf5_1.14.6 tags -- 1.14.6 being the last 1.14 release,
    so the line ends unfixed. 1.12.x and 1.10.x NOT audited.
  fixed: >-
    2.0.0 and later. Introduced by upstream commit 3914bb7f7ec ("Fixed
    CVE-2025-6269", 2025-09-25); `git tag --contains` puts it in 2.0.0, 2.1.0,
    2.1.1 and 2.2.0, and it is present in the 2.3.0 tree measured here. It
    appears in NO hdf5_1.14.* tag, so it was not backported.
  label: established at four points (2 affected, and the fix commit's tag set)

oracle_straddle: >-
  THIS IS THE PART THAT MATTERS FOR THE HARNESS. h5policy-diff does not measure
  one libhdf5; it measures two, and for this family they fall on opposite sides
  of the fix.
  The structural-open leg is h5py, whose bundled libhdf5 is 1.14.5 (the same
  build that writes the corpus -- see h5policy/tests/CORPUS-WRITER.txt), i.e.
  PRE-fix. The deeper-evidence leg is the h5dump/h5debug/h5dump-data on PATH,
  which are 2.3.0, i.e. POST-fix.
  So for mdci_entry_bad_type_id.h5 and mdci_entry_bad_age.h5 the harness records
  "libhdf5 opens structurally, deeper tools reject" and demotes invariant A to
  A+. That reading is correct as a statement about the two binaries and
  MISLEADING as a statement about libhdf5: it is not that one library defers the
  check past open, it is that one library does not have the check. The lazy-load
  behaviour (below) is real and independently true, but it is NOT what produces
  the split here.
  Consequence for anyone reading a future run: an A+ in this family is not
  evidence about depth of access until the two legs are on the same version. If
  the h5py leg ever moves to 2.0.0+, both fixtures should convert from A+ to A'
  with no change to h5policy, and mdci_entry_bad_ring.h5's A' will start holding
  for a different reason than it holds today.

boundary_note: >-
  Independently of the version split, the cache image is loaded LAZILY. H5Fopen
  does not reconstruct it; the first object-header protect does. Measured on
  2.3.0: `h5dump --enable-error-stack -H` on mdci_entry_bad_type_id.h5 lands on
  H5C__reconstruct_cache_entry "type id is out of valid range", reached under
  H5C__load_cache_image <- H5C_protect <- H5O_protect <- H5O_get_info, i.e.
  through the root-group traversal, not through the open. A harness that only
  called H5Fopen on a post-fix library would therefore still see an accept.
  h5policy-diff is not exposed to that trap, because its structural-open leg
  lists the root group.

# -- Measured behaviour -------------------------------------------------------
measured:
  fixtures: >-
    malformed/mdci_entry_bad_type_id.h5 (type_id 30), malformed/
    mdci_entry_bad_ring.h5 (ring 6) and malformed/mdci_entry_bad_age.h5
    (age 101), each the first out-of-range value for its field. Generated by
    h5policy-gencorpus (_make_mdci_entry_bad_type_id / _bad_ring / _bad_age via
    the shared _mdci_assemble and _mdci_entry helpers) and owned by the three
    h5policy/tests/expected/malformed-mdci_entry_bad_*.yml cases. Each has a
    single entry caching the real root object header, with every other field
    well formed: correct image_data_len, valid Jenkins trailing checksum,
    consistent flag/dependency counts, LRU relation satisfied, extent in file.
    One defect per fixture.
  oracle_before: >-
    ACCEPTED all three. The MDCI entry loop read type_id (and recorded it in
    h5policy_mdci_body_types to steer the object-header replay pass) without
    bounding it, and did not read ring or age at all.
  oracle_after: >-
    rejects all three with H5_CORRUPT_MDCI_ENTRY_CLASS, reject_corrupt, exit 2,
    at the offending byte -- eoff, eoff+2, eoff+3 respectively (measured file
    offsets 2082 / 2084 / 2085). Emitted in the entry loop, before the replay
    pass and before any shadow ranges are recorded, and in libhdf5's own field
    order so that the type_id rejection precedes any use of it as a selector.
    valid/cache_image.h5 and the rest of the MDCI fixtures are unaffected;
    corpus 222/222, differential 0 hard failures.
  libhdf5_1_14_5: >-
    SPLIT, and not along the line the field names suggest.
    type_id 30 and age 101: OPENS AND READS. h5py opens the file, lists the root
    group and reads the dataset back correctly (`[0 1 2 3]`). The out-of-range
    values are consumed with no diagnostic.
    ring 6: FAILS, but NOT at a bound -- the asserts are compiled out of the
    shipped build, so decoding proceeds and the entry is rejected downstream in
    H5C_protect (src/H5Centry.c) with "ring type mismatch occurred for cache
    entry", surfacing as `RuntimeError: Unable to get group info`. An incidental
    rejection by a consistency check further in, not enforcement of the range.
  libhdf5_2_3_0: >-
    REJECTS all three at the bound. `h5dump -H` exits 1 on each and 0 on
    valid/cache_image.h5; h5debug and h5dump-with-data likewise exit 1. Without
    --enable-error-stack the only output is h5dump's generic "internal error",
    which is why the error stack is the measurement of record here -- the exit
    status alone does not distinguish this from any other open failure.
  width: >-
    NOT applicable. All three fields are single bytes compared against
    compile-time constants; no size_t arithmetic is involved and no
    width-dependent band exists. Unlike the i386 witness work in
    datatype-size-not-final, there is nothing here for a 32-bit measurement to
    show.

asymmetry: >-
  Within one decoder, four adjacent bytes got three different treatments on the
  1.14 line: type_id and age unchecked, ring asserted, flags interpreted
  bit-by-bit with the debug-only bits fenced under `#ifndef NDEBUG`. The
  upstream fix levelled the first three and left the fourth. That the levelling
  happened at all is the useful signal for this repository: it confirms the
  guard style in this decoder is historical accident rather than design, which
  is the same conclusion mdci-lru-rank-assert-only reaches from the field that
  did NOT get levelled.

not_this_record: >-
  Do not cite this as a Release-build vulnerability in a supported version. The
  affected line is 1.14, the fix is public and shipped in 2.0.0, and nothing
  here was reported or needs reporting. What an out-of-range type_id goes on to
  do inside a pre-fix reconstruction -- it selects a client class by index and
  therefore a deserializer -- is NOT measured here and is left as an open
  question below rather than claimed.

not_added_here: >-
  NO entry in registry/h5policy-diff-tolerances.yml. None is needed: the two
  affected fixtures already demote to A+ on the code-shaped predicate, because
  h5dump/h5debug/h5dump-data all exit 1 and the harness finds its deeper
  evidence unaided. A tolerance entry exists to excuse a HARD failure, and there
  is no hard failure to excuse. Adding one would also be wrong in kind, since
  the tolerance file is documented as covering reference-library defects, and
  the reference library is fixed.

# -- Containment vs systemic remediation --------------------------------------
containment:
  status: not-needed
  description: >-
    Upstream, already done: commit 3914bb7f7ec. Nothing to propose, nothing to
    backport on libhdf5's behalf. A 1.14 backport would be the natural ask if
    that line were still receiving fixes; that is an upstream policy question,
    not a finding of this record.
  priority: >-
    NONE for libhdf5. The residual action is local and is about MEASUREMENT, not
    remediation -- see systemic.
systemic:
  semantic_boundary: >-
    the differential oracle as ONE library. Every leg of h5policy-diff that
    contributes to an invariant verdict should be attributable to a single,
    recorded libhdf5 version, or the verdict should carry the version split in
    its output.
  status: planned
  description: >-
    The general defect is local to this repository, not to libhdf5: h5policy-diff
    blends a bundled-h5py library with the tools on PATH and reports a single
    per-invariant letter, so a version-boundary effect is indistinguishable in
    its output from a depth-of-access effect. This family is the first case where
    that ambiguity changed what a fixture comment claimed.
    The cheap fix is reporting, not logic: have h5policy-diff record both legs'
    library versions in its output (h5py.version.hdf5_version and the h5dump
    banner) and note when they differ, the way CORPUS-WRITER.txt already pins the
    writer so a corpus regenerated by a different library shows up as a named
    diff instead of unexplained byte movement. The same idea, applied to the
    oracle rather than the writer.
    The stronger fix -- pinning both legs to one build -- is a bigger change and
    may not be desirable: measuring two versions at once has real value, and it
    is what surfaced this record. Report the straddle; do not necessarily
    eliminate it.

# -- Reproducers --------------------------------------------------------------
reproducers:
  direct_fixtures:
    - h5policy/tests/malformed/mdci_entry_bad_type_id.h5
    - h5policy/tests/malformed/mdci_entry_bad_ring.h5
    - h5policy/tests/malformed/mdci_entry_bad_age.h5
  generator: "h5policy-gencorpus _make_mdci_entry_bad_type_id / _bad_ring /
    _bad_age -- each a single entry caching the real root OH body, with one
    header byte set to the first out-of-range value for its field"
  expectations:
    - h5policy/tests/expected/malformed-mdci_entry_bad_type_id.yml
    - h5policy/tests/expected/malformed-mdci_entry_bad_ring.yml
    - h5policy/tests/expected/malformed-mdci_entry_bad_age.yml
  version_split_repro: >-
    The whole record reduces to four commands on the type_id fixture. Against a
    1.14.5 library, open it and read the dataset -- both succeed. Against a
    2.3.0 library, `h5dump --enable-error-stack -H` exits 1 and the last frame
    of the stack is H5C__reconstruct_cache_entry "type id is out of valid
    range". Confirm the versions with `h5dump --version` and
    `python3 -c "import h5py; print(h5py.version.hdf5_version)"`; if they agree,
    this record's premise no longer holds and its A+ readings should be
    re-measured.
  source_repro: >-
    In a libhdf5 checkout: `git show hdf5_1.14.6:src/H5Cimage.c` and
    `git show hdf5_2.0.0:src/H5Cimage.c`, comparing the block from "Decode type
    id" to "Decode dependency child count" in H5C__reconstruct_cache_entry.
    `git tag --contains 3914bb7f7ec` gives the fixed set.

# -- Open items ---------------------------------------------------------------
open_questions:
  - >-
    What does a PRE-FIX libhdf5 actually do with an out-of-range type_id?
    Unmeasured, and deliberately not claimed above. The id indexes the cache
    client class table, so the interesting question is whether the index is used
    to reach a function pointer before any other check rejects the entry, and
    what the table's neighbourhood contains at index 30. Answering it needs a
    1.14 build with sanitizers, which is not what the local candidate build is
    (see asan-probe-build's successor in provenance). Until then this record
    claims a decode gap, not a hazard.
  - >-
    Ring 0 is accepted by every shipped libhdf5, before and after the fix, and
    h5policy accepts it too. That agreement is deliberate, but nothing has
    measured what a zero ring DOES during reconstruction -- H5C_RING_UNDEFINED
    is the sentinel the ring machinery treats as "not yet assigned", and the
    "ring type mismatch" path measured above shows the field is live on the
    Release read path. Worth a fixture and a measurement; it is the one part of
    this triple with no guard on any version.
  - >-
    h5policy pins H5AC_NTYPES, H5C_RING_NTYPES and
    H5AC__CACHE_IMAGE__ENTRY_AGEOUT__MAX as literals in h5_messages.pk. A
    libhdf5 that ADDS a cache client class raises H5AC_NTYPES and makes the
    h5policy bound stale in the strict direction -- h5policy would reject an id
    that build accepts. Only the differential harness would catch that, and only
    if a fixture happened to use the newly valid id. No alarm is wired.
  - >-
    Unmeasured whether the write side can be driven into ENCODING an
    out-of-range value, which would make the fixtures reachable without
    byte-patching. Same open question as mdci-lru-rank-assert-only carries for
    the LRU rank.

# -- How this was investigated ------------------------------------------------
method: >-
  Backwards from a harness reading, not forwards from the source. The three
  fixtures were built and the checks written first, on the strength of the
  2.3.0 source and an h5dump exit status; the fixture comments then claimed
  h5policy was "aligned rather than stricter -- no invariant-A tolerance
  needed". Re-running h5policy-diff contradicted that: two of the three came
  back WARN A+, meaning the harness had seen libhdf5 OPEN a file the comments
  said it rejected.
  Chasing that produced two successive corrections, both worth recording as
  method. First reading: the split is depth-of-access, since the cache image
  loads lazily. That is true but insufficient -- h5py reads the dataset back
  correctly, which is deep enough to have tripped a check that existed. Second
  reading, and the right one: `git log -L` on the decode block showed all three
  guards arriving in one 2025 commit, absent from every 1.14 tag, and
  `h5dump --version` against h5py.version.hdf5_version showed the harness
  straddling it.
  The lesson generalises past this family: "libhdf5 opens it" is a claim about a
  specific binary, and the invariant-A triage question "never loaded / unguarded
  / assert-only" needs a fourth branch -- "not this version" -- checked FIRST,
  because it is the cheapest to test and it invalidates the other three.

provenance:
  found_by: "re-verification of the mdci_entry_bad_* tranche after a session
    interruption; the A+ readings did not match the fixture comments. Worked end
    to end 2026-08-16."
  hdf5_source: "upstream tags hdf5_1.14.5, hdf5_1.14.6 and hdf5_2.0.0 read from
    a local libhdf5 checkout; fix commit 3914bb7f7ec (2025-09-25). Checkout is
    workstation-local; path not recorded."
  hdf5_build: "measurement legs were an unmodified h5py wheel bundling libhdf5
    1.14.5 (Release, NDEBUG) and the h5dump/h5debug/h5dump-data of a local 2.3.0
    baseline build (Release, asserts off). Both workstation-local installs;
    paths not recorded. No candidate/sanitizer build was used -- no memory-safety
    claim is made in this record."
