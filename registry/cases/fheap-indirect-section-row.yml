  expectation: h5policy/tests/expected/malformed-bad_frhp_indirect_section_row.yml

sibling_audit: >-
  FIRST_ROW is the only serialized fractal-heap section class with a nonzero
  serial_size (H5HF_SECT_INDIRECT_SERIAL_SIZE = heap_off_size + 6,
  H5HFsection.c:37). SINGLE (class 0) carries no payload; NORMAL_ROW and INDIRECT
  are ghost classes and are never serialized. The nentries == 0 underflow and the
  source-stated section-bookkeeping writes are consequences of the same unbounded
  span (the oracle covers nentries == 0; the writes are source-derived, not
  independently witnessed here -- the read at H5HFdtable.c:312 is reached first).

coverage_manifest_change: >-
  validation-coverage.yml validation_controls gains
  control.fheap_indirect_section_row; findings/catalog/validation_controls.yml
  gains H5_CORRUPT_FHEAP_INDIRECT_SECTION_ROW (scope aggregate_object, non-shared,
  so no route rule).

