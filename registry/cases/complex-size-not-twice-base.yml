# A complex number datatype whose declared element size is accepted by the
# decoder even though it is not twice its base float's size -- the relation the
# ENUM and ARRAY arms enforce and the only writer (H5T__complex_create)
# guarantees.  The conversion loops then read and write at the base float's bit
# positions while striding by the declared size.  Nothing is out of bounds at
# decode time; the defect is that the decoder never establishes the relation the
# conversion code depends on.
schema_version: 1

id: complex-size-not-twice-base
title: complex datatype element size is not checked against twice its base type, so conversion reads/writes out of bounds
status: oracle-enforced   # h5policy rejects at decode; libhdf5 fix not yet shipped
disclosure: >-
  n/a -- local analysis only.  An externally supplied report (saved local page
  capture, opened 2026-10-07, marked AI-assisted) was read as a claim and
  re-measured on the newest develop build; it is correct on its primary claim.
  No advisory database was consulted, no URL fetched, no identifier looked up or
  recorded; the advisory identifier is deliberately omitted per repository
  policy.  Full handoff and measurement bundle: cases/
  complex-size-parent-mismatch-conv-oob/ (gitignored scratch).

record: datatypes
root_cause_classification: local_decode
violated_invariant: datatype.complex_encoding
entry_points:
  - h5policy (oracle) -- untrusted-strict and forensic both reject at the datatype message
  - "libhdf5 no-file: H5Tdecode2 -> H5Tconvert"
  - "libhdf5 read: H5Dopen2 -> H5Dread with a complex OR a plain-float memory type"
  - "libhdf5 write: H5Dwrite / H5Awrite into the file type, from a complex or a plain-float memory type"
  - "shipped tools (read direction): h5dump and h5diff convert and print/compare; h5repack propagates the type.  h5ls/h5stat/h5copy do not convert.  No shipped tool reaches the write direction."

# ── The defect, read out of the source tree (HDF5 2.3.0 @4ab9223de44) ─────────
defect: >-
  H5O__dtype_decode_helper reads the element size once (H5Odtype.c:160) and the
  H5T_COMPLEX arm (H5Odtype.c:865-908) checks the class bits, decodes the inline
  base float, and checks two version relations -- but never relates
  dt->shared->size to dt->shared->parent->shared->size.  The ENUM arm
  (H5Odtype.c:685) and ARRAY arm (:843) carry exactly this family of check, and
  H5T__complex_create (H5Tcomplex.c:133) encodes size = 2 * base_size
  unconditionally, so no conforming file disagrees.  The complex-to-complex
  conversion loop H5T__conv_complex_loop takes bit positions from the base float
  (bounded only by parent_size*8) but strides and copies by the declared size:
  the mantissa reads at H5Tconv_complex.c:252,548,555 and the padding fill at
  :433 (H5Tbit.c:353) overrun the 128-byte dbuf and the source/caller buffer.
  The float<->complex soft conversions are a SECOND site: H5T__conv_f_complex /
  H5T__conv_complex_f dispatch to H5T__conv_f_f_loop with the complex type as an
  operand (H5Tconv_float.c:1426), whose 64-byte dbuf overruns at
  H5Tconv_float.c:590.  So reading complex data as plain floats, or writing
  plain floats into a complex dataset, reaches it too.

boundary_note: >-
  The invariant is equality (size == 2 * base_size), not a bound.  The base
  float's own fields are range-checked against the BASE size (sign H5Odtype.c:224,
  exponent :241, mantissa :253, overlap :272) and the post-switch unusual-unused-
  bits gate (:918) compares the base precision with the base size, so all pass
  for an oversized base; none sees the outer size.  The 1-byte-encoded field
  positions bound the payload-controlled writes to roughly the first 32 bytes of
  each part; the constant padding fill is what reaches far offsets (up to the
  declared u32 base size).

# ── Measured behaviour ───────────────────────────────────────────────────────
measured:
  fixtures: >-
    valid/complex_dataset.h5 (control) and malformed/complex_size_not_twice_base.h5,
    generated by h5policy-gencorpus (the h5cc helper tools/probe/make_complex.c
    writes the class-11 base, since h5py's libhdf5 1.14.x has no complex class;
    the malformed sibling byte-patches the base float to 240 bytes / 960-bit
    precision with its mantissa at bit 255, leaving the outer size 16).  Owned by
    h5policy/tests/expected/{valid-complex_dataset,malformed-complex_size_not_twice_base}.yml.
  oracle: >-
    h5policy rejects the malformed fixture reject_corrupt with
    H5_CORRUPT_DATATYPE_COMPLEX_SIZE at the datatype message (offset 856, object
    /c) under both untrusted-strict and forensic, before any conversion; it
    accepts the control under both.  The check (h5_datatype.pk:807) computes the
    expected size from the base's u32 wire value in u64, so no wrap is possible.
  libhdf5_stock: >-
    ACCEPTS the file.  A plain open, or a read/write using the file's own type
    as the memory type, performs no conversion and does not fault.  A converting
    read (native complex, or plain double) returns rc 0 with wrong values on
    x86-64 and over-reads adjacent memory: stock h5dump exits 0 and prints values
    that change with MALLOC_PERTURB_ (adjacent heap reflected into the dump).  A
    converting write (H5Dwrite/H5Tconvert into the type) SIGSEGVs on x86-64 and
    i386 (saved return address overwritten; stock build returns into 0x0).  The
    smallest mismatch (9-byte base) corrupts stored data with no memory error on
    any build.
  libhdf5_asan: >-
    heap/stack-buffer-overflow WRITE at H5Tbit.c:353 from H5T__conv_complex_loop
    (H5Tconv_complex.c:433) on the convert/write path, and from H5T__conv_f_f_loop
    (H5Tconv_float.c:590) via H5T__conv_f_complex on the plain-float write path;
    buffer-overflow READ at H5Tbit.c:440 from H5T__conv_complex_part
    (H5Tconv_complex.c:555) on the read path.  Measured on the asan and
    asan-ndebug builds; the assert-live build adds nothing, no assert precedes
    the fault.
  width: >-
    MEASURED on x86-64 and i386 stock builds; both fault on the write direction
    and both print leaked bytes on the read direction.  Width-independent: the
    field positions are 1- and 2-byte values bounded by parent_size*8 and the
    base size is a u32, so no size_t wrap is involved.  No 32-bit sanitizer
    libhdf5 exists here, so the i386 conclusions rest on the stock faults and
    output.
  canary: >-
    The exact-build datatype canary was BLIND before this case: exercise_dataset_io
    read with the file's own type (no conversion), so the probe reported
    `accepted` on every build.  Fixed in h5policy/tools/probe/h5probe.c: when
    exercising the datatype family the probe now also reads one element converting
    to H5Tget_native_type(file_type) when that differs -- which reaches the
    conversion loop.  Measured after the fix: the asan-ndebug candidate reports a
    heap-buffer-overflow (signal 6) on the malformed fixture, while the stock
    baseline still completes the over-read silently (so the matrix row is forced
    to `violation` by require_oracle_alignment on the divergence, allowed
    [unexercised, violation]).  The valid control's native type equals its file
    type, so the converting read is skipped and it stays accepted.

# ── Containment vs systemic remediation (strategy doc §11.5) ─────────────────
containment:
  status: planned
  description: >-
    libhdf5: in H5O__dtype_decode_helper's H5T_COMPLEX arm, after the base type
    is decoded (H5Odtype.c:895), reject unless dt->shared->size == 2 *
    dt->shared->parent->shared->size, mirroring the ENUM (:685) and ARRAY (:843)
    arms.  Backportable to every 2.x release and cannot reject a libhdf5-written
    file.  The base size is a decoded u32, so the doubling cannot wrap on either
    width.
systemic:
  semantic_boundary: the complete datatype record (local decode)
  status: planned
  description: >-
    RawDatatype -> ValidatedDatatype must establish the complex element-size
    relation before any native type is constructed, so the conversion code can
    trust it.  Defence in depth, because the conversion loops trust the relation
    a second time: H5T__conv_complex's H5T_CONV_INIT (H5Tconv_complex.c:70-96)
    should reject a source or destination whose size is not twice its parent, and
    the dbuf guard at :88 should derive from the destination PARENT size rather
    than the declared size.  A patch touching only H5T__conv_complex leaves the
    float<->complex path (H5T__conv_f_f_loop) open; a decode-side guard closes
    both at once.

# ── Open items ───────────────────────────────────────────────────────────────
open_questions:
  - >-
    Complex reached through an attribute (H5Aread/H5Awrite, h5dump -A) goes
    through the same decoder and the same H5T_convert path; source-derived,
    unmeasured (every fixture here is a dataset).
  - >-
    Complex nested inside an array or compound type is decoded by the same arm
    and converted once the outer conversion recurses into members; source-derived,
    unmeasured.
  - >-
    The generic (non-datatype) exercise still reads datasets with the file type,
    so a complex dataset met in generic mode does not get the converting read.
    The datatype canary covers the datatypes family; broadening the conversion
    read to generic mode is a larger, separate change.

# ── How this was investigated ────────────────────────────────────────────────
method: >-
  An external report named the missing check and the crash.  Re-measuring on the
  newest develop build confirmed the decode-side gap against every 2.x tag, then
  three things the report did not state fell out of measuring each direction
  separately: the read over-run is of the CALLER's buffer (the read path converts
  in place, H5Dio.c:979), not a library heap buffer; the plain-float conversions
  are a second overflow site, so the reach is ordinary float I/O and not only
  complex-to-complex; and the smallest mismatch corrupts stored data with no
  memory error at all.  The exact-build canary reported `accepted` throughout,
  which is what exposed the blind spot fixed here -- a probe that reads with the
  file's own type never runs the conversion that faults.
