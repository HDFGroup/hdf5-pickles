# Two source-shape sweeps, run to completion 2026-08-15.
#
# Three case records had ended with the same open question -- "this looks like a
# pattern, how many siblings are there?" -- and answering it by grep was cheaper
# than promoting another case. Filed here so the answers are a tracked result
# rather than something the next person re-derives blind, and so the negative
# results are as durable as the positive one.
#
# HEADLINE: both sweeps came back SMALL. The patterns are real but not endemic,
# and the earlier "endemic" wording in two records was over-stated from a
# truncated grep. Corrections applied there; see corrections_made below.
schema_version: 1

id: decoder-bound-shape-sweeps
title: sweeps for three decoder bound-checking shapes -- discarded image length,
  additive extent checks that can wrap, and positions computed from header
  constants
status: complete                 # all three run; lead followed up; line of work closed
disclosure: "n/a -- local source analysis only; no advisory consulted"

# -- What was swept and why ---------------------------------------------------
motivation: >-
  registry/cases/external-link-value-strlen-unbounded.yml,
  registry/cases/fill-value-size-unchecked-in-new-decoder.yml and
  registry/cases/v2-btree-nrec-unvalidated-against-node-capacity.yml each
  independently bottomed out at a bound the code was HANDED and then did not
  use.  Three instances suggested a class.  Separately,
  registry/cases/local-heap-free-list-bound-wraps.yml named "fractal-heap
  equivalents" as unaudited, which is the same question for a different shape.
  Both are mechanical greps over the source tree, so the honest move was to run
  them rather than keep listing them as open questions.
method: >-
  Read-only grep over <hdf5-source-tree>/src/*.c at the 2.3.0 tree.  No build,
  no execution, no oracle run.  Every hit below was then opened and read; the
  triage is source-derived and none of it is measured.
  Sweep A: `H5_ATTR_UNUSED len` restricted to `deserialize` and `verify_chksum`
  -- the READ-path cache-client callbacks.  The `serialize` half is excluded
  deliberately: it is a write path where the length is library-computed, so a
  discarded bound there is not a defect.
  Sweep B: `if ((a + b) > c)` over the same tree -- extent checks written as an
  addition, which wraps on unsigned types, rather than as a gated subtraction.

# == SWEEP A: read-path callbacks that discard the image length ================
sweep_a:
  question: >-
    How many cache clients are handed the actual allocated image length and
    declare it H5_ATTR_UNUSED, then derive their own extent from file data?
  result: SMALL -- confined to one file, plus one correct implementation and two stubs.
  hits:
    - site: src/H5B2cache.c:224 (H5B2__cache_hdr_deserialize)
      verdict: candidate
      note: v2 B-tree header; not separately assessed, the two below are the measured ones
    - site: src/H5B2cache.c:553 (H5B2__cache_int_verify_chksum)
      verdict: DEFECT -- already recorded
    - site: src/H5B2cache.c:594 (H5B2__cache_int_deserialize)
      verdict: DEFECT -- already recorded
    - site: src/H5B2cache.c:954 (H5B2__cache_leaf_verify_chksum)
      verdict: DEFECT -- already recorded, the measured OOB READ
    - site: src/H5B2cache.c:994 (H5B2__cache_leaf_deserialize)
      verdict: DEFECT -- already recorded, the measured OOB WRITE
    - site: src/H5SMcache.c:477 (H5SM__cache_list_verify_chksum)
      verdict: CORRECT -- and the most useful hit in either sweep
      note: >-
        Discards `len` exactly like the B-tree clients, but bounds the
        file-controlled count against capacity BEFORE using it, with a comment
        that reads as if written against this very failure mode:
          /* The buffer only holds list_max messages; a corrupted header whose
           * message count exceeds that would size the checksum region past the
           * end of it. */
          if (udata->header->num_messages > udata->header->list_max)
              HGOTO_ERROR(H5E_SOHM, H5E_BADVALUE, FAIL,
                          "number of SOHM messages exceeds list size");
          chk_size = H5SM_LIST_SIZE(udata->f, udata->header->num_messages);
        So discarding `len` is NOT itself the defect -- deriving the extent from
        an unvalidated file count is.  This is the same fix the v2 B-tree
        clients need, already written, in an analogous cache client, in the same
        codebase.  Any upstream proposal for the B-tree case should cite it.
    - site: src/H5Cepoch.c:132,:143
      verdict: benign -- deliberate no-op stub client
    - site: src/H5Cprefetched.c:138,:149
      verdict: benign -- deliberate no-op stub client
  conclusion: >-
    The class is real but its membership is exactly the v2 B-tree cache client,
    which is already fully recorded.  No new defect was found.  The valuable
    output is the H5SMcache.c precedent, which converts the B-tree containment
    from "here is what we think you should do" into "here is what you already do
    elsewhere".

# == SWEEP B: additive extent checks that can wrap =============================
sweep_b:
  question: >-
    How many extent checks are written `(offset + size) > limit` on unsigned
    types, where both operands come from the file?
  result: SMALL -- one confirmed defect (already recorded), one unrecorded duplicate of it, everything else guarded or internal.
  hits:
    - site: src/H5HLcache.c:258 (H5HL__fl_deserialize)
      verdict: DEFECT -- already recorded
      record: registry/cases/local-heap-free-list-bound-wraps.yml
    - site: src/H5HLdbg.c:82 (local heap debug dump)
      verdict: NEW -- unrecorded duplicate of the same expression
      note: >-
        `if ((freelist->offset + freelist->size) > h->dblk_size)` -- character
        for character the H5HLcache.c:258 check, in the debug/h5debug path, with
        the same wrap.  Lower severity: it is a diagnostic path rather than the
        library read path, so reaching it requires running h5debug on a hostile
        file.  But it must be fixed in the SAME change, or the subtraction form
        lands in one copy and not the other and the next reader assumes the
        expression is correct because one instance of it is.
    - site: src/H5HFman.c:395 and :605 (H5HF__man_op_real, H5HF__man_remove)
      verdict: NOT AN EQUIVALENT -- and this answers the local-heap record's open item
      note: >-
        `(blk_off + obj_len) > dblock_size` looks identical, but `obj_len` is
        bounded three ways immediately after it is decoded from the heap ID
        (:326 nonzero, :328 against max_direct_size, :330 against max_man_size),
        so it cannot approach SIZE_MAX and the addition cannot wrap on its own.
        The residual hazard is narrower and worth stating precisely: `blk_off`
        is computed as `(size_t)(obj_off - dblock->block_off)` at :387 under an
        ASSERT only (:386, compiled out under NDEBUG).  If a corrupt indirect
        structure yielded obj_off < block_off, that subtraction underflows and
        the additive check could then wrap.  That is a two-step, assert-gated
        path rather than the direct one-field wrap the local heap has, and it
        was not measured.
    - site: src/H5Znbit.c:1212
      verdict: GUARDED -- and an example of the codebase getting it right
      note: >-
        The additive check is preceded by an accumulate-and-verify with an
        explicit wrap detector:
          used_size += member_size;
          if (used_size > size) ...error
          if (used_size <= prev_used_size) ...error   /* wrap detector */
        By the time `(member_offset + member_size) > size` runs, both operands
        are already bounded by `size`.
    - site: src/H5Tcompound.c:420 (H5T__insert)
      verdict: out of scope -- API insert path, not raw file decode
      note: >-
        Operates on values the library supplies.  Related in spirit to
        registry/cases/compound-member-array-promotion-unguarded.yml, but that
        record's defect is in the DECODER's guard ordering, not here.
    - sites: [src/H5Cint.c:1895, src/H5Faccum.c:278, src/H5MFaggr.c:214, src/H5PB.c:1540]
      verdict: benign -- internal cache/accumulator/aggregator accounting, operands not file-derived
  conclusion: >-
    One new item, and a modest one: the H5HLdbg.c:82 duplicate.  The fractal
    -heap question that motivated half this sweep is answered in the NEGATIVE,
    which is worth more than it sounds -- it closes an open item in a record
    rather than leaving a suspicion sitting there indefinitely.

# == SWEEP C: positions computed from header constants =========================
sweep_c:
  question: >-
    How many read-path cache clients compute a position from HEADER CONSTANTS
    (*_PREFIX_SIZE, *_OVERHEAD) and never test it against the image extent they
    were handed?  This is the shape that produced
    registry/cases/fractal-heap-dblock-size-no-floor.yml, and the shape neither
    earlier sweep could see.
  run: 2026-08-15, read-only, same method as A and B.
  result: >-
    NO NEW INSTANCES.  The verify_chksum half is EXHAUSTIVE and every hit is
    already recorded; the deserialize half surfaced a different shape entirely,
    noted below as a lead rather than a finding.
  verify_chksum_is_exhaustive: >-
    There are 22 verify_chksum implementations in src/*.c.  SEVENTEEN pass their
    own `len` straight through -- `H5F_get_checksums(image, len, ...)` -- so the
    position IS the extent and the shape cannot arise.  That is the healthy
    pattern, and it is the large majority.
    Only FOUR compute a position from anything else, and all four are known:
      src/H5B2cache.c:569   chk_size from H5B2_INT_PREFIX_SIZE + nrec*rrec_size
      src/H5B2cache.c:970   chk_size from H5B2_LEAF_PREFIX_SIZE + nrec*rrec_size
                            -- both recorded in
                            registry/cases/v2-btree-nrec-unvalidated-against-node-capacity.yml
      src/H5HFcache.c:1596  chk_size from H5HF_MAN_ABS_DIRECT_OVERHEAD(hdr)
                            -- recorded in
                            registry/cases/fractal-heap-dblock-size-no-floor.yml
      src/H5SMcache.c:499   chk_size from H5SM_LIST_SIZE(f, num_messages)
                            -- CORRECT: bounded by the num_messages > list_max
                            guard at :495, the precedent cited in sweep A
    So for checksum verification the class is closed: four sites, three defects
    already recorded, one correct implementation.
  adjacent_observations:
    - id: assert-only cursor position checks
      sites: [src/H5B2cache.c:769, src/H5B2cache.c:1143,
              src/H5HFcache.c:1803, src/H5HFcache.c:2066]
      verdict: low value, not pursued
      note: >-
        Four deserializers assert that the cursor landed exactly on the prefix
        boundary, e.g. `assert((size_t)(image - (uint8_t *)_image) ==
        (H5B2_LEAF_PREFIX_SIZE - H5B2_SIZEOF_CHKSUM))`.  Compiled out under
        NDEBUG, so they are assert-only in the usual sense -- but what they
        check is that fixed-width library decoding consumed a fixed number of
        bytes, not that any attacker-controlled quantity is in range.  Recorded
        so the next sweep does not re-flag them.
    - id: file-declared count driving a load size
      sites: [src/H5FAcache.c:559, src/H5FAcache.c:721,
              src/H5EAcache.c:1430, src/H5EAcache.c:1596]
      verdict: RESOLVED 2026-08-15 -- FA half already covered, EA half not equivalent
      note: >-
        These are get_initial_load_size callbacks setting `*image_len` from
        H5FA_DBLOCK_SIZE / H5EA_DBLOCK_SIZE and their PREFIX_SIZE variants.
        Not this sweep's shape (position vs extent) but the one recorded in
        registry/cases/mdci-entry-extent-rebased-after-header.yml -- a
        file-influenced quantity becoming the allocation size the cache
        framework honours.  Followed up read-only and the two arrays diverge.
        FIXED ARRAY: ALREADY COVERED, no new record needed.
        registry/cases/fixed-array-extent-mismatch.yml does not stop at the
        capacity/dataspace mismatch -- its `defect` section already names the
        allocation consequence explicitly: H5FA__dblock_create derives the page
        count and the ceil(npages/8) initialisation bitmask from
        cparam.nelmts, and "H5FA__cache_dblock_image_len reports the result as
        the cache entry's size", with "the stored capacity used as found and
        never compared with the extent it was derived from".  It records a
        measured ~10^9x storage amplification from a one-field edit, and it
        already flags the interesting residual: the products are computed in
        hsize_t while the cache entry size is a size_t, so whether a 32-bit
        build WRAPS to a small plausible entry size -- and copies real bytes
        into an undersized allocation -- rather than tripping the ceiling is
        untested there.  The sweep reached the same mechanism from the
        get_initial_load_size side; it is one defect, already recorded.
        EXTENSIBLE ARRAY: NOT the same exposure.  The FA path reads a single
        stored capacity (udata->hdr->cparam.nelmts) and uses it as found.  The
        EA path does not: `dblock.nelmts = udata->nelmts` (src/H5EAcache.c:1418)
        and both real callers supply that from the library's doubling schedule
        -- `hdr->sblk_info[sblk_idx].dblk_nelmts` (src/H5EA.c:417) and
        `sblock->dblk_nelmts` (src/H5EA.c:576) -- not from a raw capacity field.
        So the FA defect's shape, "a stored capacity never compared with what it
        was derived from", does not transfer.
        WHAT REMAINS UNESTABLISHED, and it is narrower than the original lead:
        sblk_info is itself computed in H5EA__hdr_init from cparam fields that
        ARE file data (max_nelmts_bits, data_blk_min_elmts,
        sup_blk_min_data_ptrs).  So the EA schedule is file-INFLUENCED through a
        structured derivation rather than file-declared outright.  Whether those
        cparam fields are bounded on read was not traced.  That is a different
        and smaller question than the one this lead started as, and it is the
        only part still open.
        Noted in passing: src/H5EAcache.c:1423 asserts
        `udata->nelmts == dblock.npages * hdr->dblk_page_nelmts` -- an
        assert-only consistency check between the element count and the page
        count, compiled out under NDEBUG.

# -- What changed as a result --------------------------------------------------
corrections_made: >-
  Two records described this shape as "endemic to metadata-cache client
  callbacks".  That came from a grep truncated at 40 lines whose visible output
  was dominated by `serialize` functions -- the write path, where a discarded
  length is not a defect.  Restricted to the read path the count is five, all in
  one file.  The wording is corrected in
  registry/cases/external-link-value-strlen-unbounded.yml and
  registry/cases/v2-btree-nrec-unvalidated-against-node-capacity.yml, and the
  open questions those records carried are marked answered by this file.

followups:
  - >-
    Fix src/H5HLdbg.c:82 in the same change as src/H5HLcache.c:258.  Tracked in
    registry/cases/local-heap-free-list-bound-wraps.yml.
  - >-
    Cite src/H5SMcache.c:477-495 as the model in any upstream proposal for
    registry/cases/v2-btree-nrec-unvalidated-against-node-capacity.yml.
  - >-
    OPTIONAL and unmeasured: whether a corrupt indirect block can drive
    obj_off < block_off at src/H5HFman.c:387 and reach the underflow described
    above.  Low priority -- it needs a two-step corruption and an NDEBUG build,
    and no specimen exists.
  - >-
    DONE 2026-08-15 -- see sweep_c.  It found no new instances: verify_chksum is
    exhaustive at four position-computing sites, all already recorded, and the
    other macro uses are write-path, debug, asserts, or a different shape.
    The prediction that it would be "messier than the first two" was wrong in a
    useful way -- restricting to verify_chksum made it the CLEANEST of the
    three, because that callback family has one healthy idiom
    (`H5F_get_checksums(image, len, ...)`) that 17 of 22 implementations follow,
    so the exceptions stand out completely.
  - >-
    CLOSED 2026-08-15.  The FA/EA load-size lead was followed up read-only --
    see sweep_c.adjacent_observations.  The fixed-array half is already fully
    covered by registry/cases/fixed-array-extent-mismatch.yml, allocation
    consequence included; the extensible-array half is not the same shape,
    because its element count comes from the library's doubling schedule rather
    than a stored capacity.
    ALL THREE SWEEPS ARE NOW COMPLETE and this line of work is closed.  Across
    them the total yield of NEW defects is ONE: the src/H5HLdbg.c:82 duplicate
    from sweep B.  Everything else they touched was already recorded, correct,
    or a different shape.  That is worth stating plainly -- the sweeps were
    cheap and worth running, but the defects in this registry were found by
    promoting specimens, not by pattern-matching source.
  - >-
    ONE NARROW QUESTION SURVIVES, much smaller than the lead it came from:
    H5EA__hdr_init derives sblk_info from cparam fields that are file data
    (max_nelmts_bits, data_blk_min_elmts, sup_blk_min_data_ptrs).  Whether
    those are bounded on read was not traced.  Anyone picking this up should
    note it is a HEADER-VALIDATION question, not a bound-application one, and
    so belongs with the extensible-array family rather than with these sweeps.

# -- Honesty notes -------------------------------------------------------------
limitations: >-
  Both sweeps are GREPS, and grep finds a spelling rather than a semantics.
  A bound check written across multiple lines, using a helper macro, or with the
  operands in the other order would not match either pattern, so neither result
  is a proof of absence.  What they establish is that the two SPECIFIC shapes
  that produced three case records are not widespread, which is enough to stop
  treating them as open leads.
  A CONFIRMED FALSE NEGATIVE, added 2026-08-15 and worth more than the
  disclaimer above.  Sweep A missed
  registry/cases/fractal-heap-dblock-size-no-floor.yml, which is the same CLASS
  of defect -- a read-path cache client positioning a read without reference to
  its image extent -- in a function the grep could not match.
  H5HF__cache_dblock_verify_chksum (src/H5HFcache.c:1518) does NOT declare its
  `len` H5_ATTR_UNUSED, because it genuinely uses it: for the filtered-path
  malloc and memcpy, and for H5_checksum_metadata(read_buf, len, 0) at :1608.
  What it never does is bound the checksum POSITION it computes at :1596-1597
  from H5HF_MAN_ABS_DIRECT_OVERHEAD(hdr) against that same len.  So the bound is
  present, used, and applied to the wrong quantity -- and no spelling of
  "H5_ATTR_UNUSED len" appears anywhere in it.
  A SECOND FALSE NEGATIVE, same day, same file.
  registry/cases/filtered-heap-pipeline-given-enclosing-extent.yml records
  src/H5HFcache.c:527 passing `len` -- the enclosing cache-image length -- to
  H5O_msg_decode where hdr->filter_len belongs.  That one is even further out of
  reach of a grep: a bound IS passed, spelled normally, and it is a real correct
  length belonging to the wrong object.
  THE CLASS HAS AT LEAST THREE SHAPES, and sweep A finds only the first:
    DISCARDED    bound passed, declared H5_ATTR_UNUSED -- src/H5B2cache.c.
                 Greppable.  This is what sweep A found, and it found all of it.
    UNRELATED    bound used, but the checked position computed from header
                 constants instead -- src/H5HFcache.c:1596.  Not greppable by
                 the sweep-A pattern; found by promoting a case.
    SUBSTITUTED  a valid length for the wrong object passed as the bound --
                 src/H5HFcache.c:527.  Not greppable at all; the code looks
                 correct in isolation and is only wrong relative to what the
                 callee is decoding.
  Note the last two are in ONE FILE.  A single cache client contains two
  different failures of this class, which points at the client/framework
  contract rather than at any one author's slip -- and suggests the right unit
  of audit is "does this callee's bound describe the object the callee is
  parsing", which no textual pattern expresses.
  THE LESSON FOR ANY FUTURE SWEEP: H5_ATTR_UNUSED marks a bound that was
  DISCARDED, which is the easiest of the three to spot and evidently not the
  most common.  Sweep A's clean result should be read as "that spelling is
  exhausted", never as "the class is closed".
  Nothing here was executed, measured, or built.  Every verdict is source-derived
  from reading the 2.3.0 tree, and the two "already recorded" defects are the
  only ones in this file with measured evidence behind them -- that evidence
  lives in their own records, not here.

provenance:
  found_by: >-
    sweeps run 2026-08-15 while closing out the Tier-2 promotion queue, to
    answer open questions carried by three existing case records rather than to
    investigate a new specimen
  hdf5_source: 2.3.0 tree, read-only
