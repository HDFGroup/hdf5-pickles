# A version-1 compound member's embedded-array promotion is unguarded on both
# axes: the promotion arithmetic is unchecked, and the two guards that would
# bound the result already ran against the pre-promotion type.
#
# Promoted from FOUR working bundles (gitignored h5cve scratch) describing ONE
# defect surface reached by two coupled routes.  Each is named by its specimen's
# input_sha256, given in full under `routes`:
#   arithmetic route (the multiply wraps)
#     specimen 3f0b74ce...   nelem/size overflow, i386 width witness
#     specimen 110e889b...   both invariants on one specimen
#   ordering route (the guard ran too early)
#     specimen 1c2fd79f...   promoted footprint escapes the bound
#     specimen cc54e45c...   member offset outside the parent
# A FIFTH specimen was added 2026-08-26 from ordinary triage rather than from a
# promoted bundle: 6facdef0..., a fuzzed HDF5 test file whose oversized member
# sits inside a NESTED compound.  It is what establishes that the defect is not
# specific to the dataset's own datatype -- see routes.ordering and
# sibling_audit.
# They are recorded together because the two halves are not independently
# fixable: a checked multiply still leaves a non-wrapping member that overruns
# its element, and a re-ordered guard still lets the product wrap before the
# guard sees it.  The four bundle specimens converge on the same consumer,
# H5T__conv_struct_opt; the fifth deliberately does not, and measuring why is
# what bounds a nested carrier's reach (measured.DEPTH_AND_32BIT).
#
# This record CLOSES items 2 and 3 of
# registry/cases/arithmetic-divergences-backlog.yml, which asked "is the member
# ever read at its declared extent?".  The answer is yes, and it is measured.
schema_version: 1

id: compound-member-array-promotion-unguarded
title: a v1 compound member's embedded-array promotion multiplies unchecked and
  happens after the guards that should bound it, so an oversized member is
  published and later read out of bounds
status: oracle-hardened          # h5policy rejects all five; libhdf5 accepts
disclosure: >-
  n/a -- local analysis only.  No advisory database was consulted, no advisory
  text was retrieved, and no identifier was looked up.  The bundles' supplied
  file names are provenance, not root-cause classifications.

# -- Triage -------------------------------------------------------------------
record: datatypes
versions: [1]                    # v1 compound datatype message (legacy embedded array)
root_cause_classification: local_decode
violated_invariant:
  - datatype.size_arithmetic          # the multiply
  - datatype.compound_member_bounds   # the guard ordering
validation_closure: >-
  the complete datatype record: parent element size, every member offset, the
  legacy array rank and dimensions, the nested base type, the PROMOTED member
  footprint, and the promoted member's end against the parent element.  The
  promoted footprint is the operative value and does not exist until the array
  is created, which is exactly why a guard placed before the promotion cannot
  close this.
activation_before_validation:
  - native_construction
  - cache_publication
  - public_id
entry_points:
  - h5policy (oracle) -- untrusted-strict and forensic reject all five specimens
  - "libhdf5 decode: H5Dopen2 -> H5O__dtype_decode -> H5O__dtype_decode_helper (src/H5Odtype.c) -> H5T__array_create (src/H5Tarray.c)"
  - "libhdf5 use: H5Dread -> H5D__scatgath_read -> H5T_convert -> H5T__conv_struct_opt (src/H5Tconv_compound.c:859-868)"
  - "public API: H5Tarray_create1/2 reach the same unchecked constructor"
  - "shipped tools: h5dump -d and h5ls -v both ACCEPT and print the type"

# -- The defect, read out of the source tree ----------------------------------
defect: >-
  HALF ONE -- the promotion arithmetic is unchecked.  H5T__array_create
  (src/H5Tarray.c:156-162) accumulates the element count and the storage size:
    for (u = 0, nelem = 1; u < ndims; u++) {
        H5_CHECKED_ASSIGN(dim[u], size_t, dim[u], hsize_t);   /* :157 */
        nelem *= (size_t)dim[u];                              /* :158 -- UNCHECKED */
    }
    size = parent->size * nelem;                              /* :162 -- UNCHECKED */
  Note what IS guarded: the per-dimension narrowing at :157.  The author was
  thinking about width; the accumulating product at :158 and the final multiply
  at :162 simply have no overflow test.
  HALF TWO -- the guards run before the promotion.  In
  H5O__dtype_decode_helper, the member is decoded, then bounded:
    if (temp_type->shared->size == 0)                                  /* :507 */
        HGOTO_ERROR(... "type size can't be zero");
    if ((memb[nmembs].offset + temp_type->shared->size) > dt->shared->size)  /* :509 */
        HGOTO_ERROR(... "member type extends outside its parent compound type");
  Both test `temp_type`, the BASE element type.  Only afterwards does the
  legacy embedded-array encoding replace it:
    array_dt = H5T__array_create(temp_type, ndims, dim);                /* :542 */
  `array_dt` is `nelem` times larger, and neither guard re-runs against it.  So
  a member that passes the bound as a 1-byte base can be published as a
  multi-terabyte array member of a 16-byte element.
  THEY WROTE THE GUARDS, 300 LINES AWAY.  The STANDALONE array decoder in the
  same function has all three checks the embedded path lacks:
    if (dim[u] != 0 && nelem > SIZE_MAX / dim[u])                       /* :815-817 */
        HGOTO_ERROR(... "array element count overflows size_t");
    if (parent->size > 0 && nelem > SIZE_MAX / parent->size)            /* :835-838 */
        HGOTO_ERROR(... "array datatype size calculation would overflow");
    expected_size = parent->size * nelem;
    if (dt->shared->size != expected_size)                              /* :842-848 */
        HGOTO_ERROR(... "array datatype size mismatch ...");
  All three are SIZE_MAX-relative and therefore width-correct.  This is not an
  oversight of the concept -- the identical arithmetic is guarded three ways in
  one branch of one function and not at all in another branch of the same
  function, because the legacy embedded-array path routes through
  H5T__array_create instead.
  AND THEY WROTE THE MEMBER BOUND TOO, in the constructor.  H5T__insert
  (src/H5Tcompound.c:420-421) applies exactly the check :509 applies too early:
    if ((offset + total_size) > parent->shared->size)                   /* :421 */
        HGOTO_ERROR(... "member extends past end of compound type");
  and here `total_size = member->shared->size` is the PROMOTED size, because the
  array type already exists by the time it is inserted.  Measured 2026-08-26:
  reading a promoted member back out of an accepted file with
  H5Tget_member_type and handing it to H5Tinsert on the compound it came from is
  REFUSED with that message.  So the library declines to construct the type it
  accepts from disk -- the invariant is not merely known elsewhere in the tree,
  it is enforced on the write side of the very same object.
  THE CONSUMER.  H5T__conv_struct_opt (src/H5Tconv_compound.c:859-868) reads
  each member at its declared offset and promoted size during H5Dread, whenever
  the memory type differs from the file type.  That is what turns a bad decode
  into a memory-safety event, and it is the same consumer for both halves.

why_one_record: >-
  Neither half is sufficient alone, and the bundles prove it with controls
  rather than argument.
  Fix only the multiply: variant_bounds_only.h5 (40f5826c) is a member that
  overruns its element with NO wrap at any width -- still accepted, still read
  out of bounds.
  Fix only the guard ordering: the product still wraps inside H5T__array_create
  before any re-ordered guard could inspect it, and on 32-bit
  variant_wrap32_one.h5 wraps to a product of 1, decoding as a perfectly VALID
  file.  A guard cannot reject what the arithmetic has already normalised.
  40f5826c's own systemic section states the same conclusion independently --
  "two coupled changes" -- and 25420ff5 carries BOTH invariants on a single
  specimen, which is the clearest single argument that this is one surface.

# -- The five specimens -------------------------------------------------------
routes:
  arithmetic:
    - specimen: 535 bytes, input_sha256
        3f0b74cea8bb3388eac54f79ffcb254293d66486e65b41613930245c640ec9b0
      how: >-
        Legacy embedded-array dimensions multiply into an element count that
        wraps.  Oracle reports H5_CORRUPT_LENGTH_OVERFLOW @ 247 (count
        overflow), with secondaries @ 295 for the storage-size overflow and the
        member-bounds violation -- all three faces of the one defect on one
        specimen.
      tracked_fixture: malformed/compound_member_array_nelem_overflow.h5
      note: >-
        Carries the width work: an i386 witness compiled freestanding (-m32
        -nostdlib -static, raw int 0x80 syscalls, because no 32-bit libc dev
        files exist on the host) that RUNS the arithmetic rather than modelling
        it.  This is the bundle that makes the 32-bit claims measurements.
    - specimen: input_sha256
        110e889b58bfbb0f6849bf307c6b97d4c95502ae7b235ea7f1b80e0d3b973e60
      how: >-
        Legacy compound embedded-array creation multiplies attacker dimensions
        into unchecked size_t values.  Records BOTH datatype.size_arithmetic and
        datatype.compound_member_bounds against one specimen; oracle reports
        H5_CORRUPT_LENGTH_OVERFLOW.
      tracked_fixture: none -- the bundle's own input.h5 is its direct fixture
  ordering:
    - specimen: input_sha256
        1c2fd79fd972e7b95149f4c241ecc65c06ed9e0a90a524d1f53edc7aad543ce0
      how: >-
        The v1 embedded-array FOOTPRINT escapes the pre-promotion member bound
        -- the cleanest statement of half two, with no wrap involved at all.
        Oracle reports H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS.
      tracked_fixture: none -- the bundle's own input.h5 is its direct fixture
      note: >-
        Its variant_array_after_base_check.h5 is a two-byte promoted member at
        offset 15, giving an ASan-visible two-byte overread -- the minimal
        demonstration that the ordering alone suffices.
    - specimen: input_sha256
        cc54e45ce0b9dc31aa9fb07ff2cf036811432d7f85e3faf39c029a85ba09afa9
      how: >-
        A member declares a byte offset far outside its parent element.
        Reaches the same H5T__conv_struct_opt dereference through the OFFSET
        rather than the promoted size.  Oracle reports
        H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS @ 295.
      tracked_fixture: malformed/compound_member_offset_oob.h5
      note: >-
        Establishes the decode timing the whole family depends on: H5Fopen and
        H5Ovisit3 both SUCCEED first, and the datatype is only decoded at
        H5Dopen2 (measured, compound-member-conv-probe.txt).  So a preflight
        that only opens and walks a file will not see this.
    - specimen: 2072 bytes, input_sha256
        6facdef00d299e992ff65cc9a64a9a47c8274c67059af6f585c905a6dd409dd0
      added: 2026-08-26
      how: >-
        THE DEPTH CASE, and the only route entry not reached from a purpose-built
        specimen.  A fuzzed copy of the HDF5 test file tnestedcomp.h5 -- 136
        single bytes rewritten, same length -- arrived for triage.  libhdf5 2.3.0
        rejects it at H5Fopen on an unrelated driver-info address (see
        registry/cases/driver-info-block-fields-unbounded.yml), which hides
        everything behind it, so each of the 136 differences was applied ALONE to
        the pristine base and both sides re-measured.  Exactly one live
        divergence fell out, at base offset 0x7f5: the v1 embedded-array
        dimension of member `array_name` goes 2 -> 62978.
        WHAT MAKES IT NEW is where the member sits.  The four entries above all
        put the oversized member in the dataset's OWN compound.  Here it is one
        level down: `struct {char char_name; float array_name[62978];}` declared
        12 bytes, itself a member of the dataset's 32-byte compound.  The outer
        bound 16 + 12 <= 32 passes honestly; the inner member passes its own
        bound as a 4-byte base type and is then promoted to 251912 bytes ending
        at 251916 inside 12.  H5O__dtype_decode_helper applies the same
        :507/:509-before-:542 ordering at every recursion level, so a guard added
        only where the dataset's datatype is decoded would close all four
        siblings and leave this accepted.
      tracked_fixture: malformed/compound_member_array_nested_oob.h5
      note: >-
        The tracked fixture is NOT this specimen.  It is the off12 geometry moved
        down one level -- outer 16, nested compound 8, inner member at offset 4
        with a [2] u32 array promoting to 8 and ending at 12 -- so the two
        fixtures differ in DEPTH and in nothing else, and both stay
        width-independent.  Built by _make_compound_member_array_nested_oob.

# -- Measured behaviour -------------------------------------------------------
measured:
  DEPTH_AND_32BIT: >-
    2026-08-26, HDF5 2.3.0, source commit 51b92ccee54ed3f14af3509c9ac5e4f3c82e5
    8ce.  Three builds, all workstation-local, paths not recorded:
      baseline   RelWithDebInfo, asserts off, no sanitizers, x86-64,
                 settings_sha256 7ce6203229fbd356cbdbaab0e1b333c4319c006374300
                 3226a9fb8d05f47819c
      candidate  RelWithDebInfo, asserts off, -fsanitize=address, x86-64,
                 settings_sha256 970f83354e89722436502d348e12c8a33ec783724c3f4
                 8adf2d7dd9ae081d219
      i386       RelWithDebInfo, asserts off, no sanitizers, external filters
                 off, settings_sha256 ef807c88281cc8210e658e3ad02c169ddc9297852
                 6d58dc1cf4f126aa48c7e62
    THE 32-BIT GAP IS CLOSED FOR THE ORDERING ROUTE.  It read "libhdf5 itself is
    unmeasured at 32 bits (the arithmetic is measured; the library is not)".  The
    library is now measured: i386 libhdf5 ACCEPTS the ordering route exactly as
    x86-64 does, on both the fuzzed-tnestedcomp carrier and the new tracked
    fixture, publishing the same promoted member size.  On the carrier the only
    difference between the widths is native struct padding in the
    H5Tget_native_type result -- 251936 on x86-64 against 251932 on i386.  The
    arithmetic route remains unmeasured at 32 bits, and that is the whole of what
    the gap item now covers; see coverage_gaps.
    AMPLIFICATION, a second consequence of the same defect and reachable with no
    sanitizer build, no crafted memory type and no buffer tuning.  On the
    fuzzed-tnestedcomp carrier H5Tget_native_type turns a 32-byte on-disk element
    into a 251936-byte in-memory element -- 7873x -- and H5Dread into a buffer of
    that size returns rc=0.  A reader that sizes its buffer from
    H5Tget_size(H5Tget_native_type(...)), which is the documented idiom,
    allocates 2.5 MB for a 320-byte dataset.  The upper bound is UNMEASURED: only
    62978 was run, and the v1 encoding carries four 32-bit dimensions.
    THE CONSTRUCTOR ENFORCES WHAT THE DECODER SKIPS, a second in-tree contrast
    alongside the standalone array decoder already argued in `defect`.
    H5T__insert (src/H5Tcompound.c:420-421) tests
    `(offset + total_size) > parent->shared->size` with total_size the member's
    PROMOTED size.  Measured: handing the decoder's own array_name type -- read
    straight back out of the file with H5Tget_member_type -- to H5Tinsert on the
    12-byte compound it came from is refused, "member extends past end of
    compound type".  The library will not let a program construct the type it
    just accepted from disk.
    NEGATIVE RESULT, and it belongs in the record because it bounds what a
    nested carrier can demonstrate.  The H5T__conv_struct_opt over-read was NOT
    reproduced from either nested specimen.  Four memory-type shapes were driven
    against the ASan build and none produced a report; the probe's datatype
    exercise completes and reports outcome=accepted on both builds.  The reason
    is structural: the top-level strided copy runs at the nested compound's
    honest declared size, and making the INNER copy overrun needs a memory-side
    compound SMALLER than the promoted member -- which H5T__insert refuses to
    build, per the paragraph above -- while every memory type the API will build
    is at least as large as the promoted member and the per-element conversion
    buffer is sized max(src, dst).  This does not weaken the four specimens
    above, which put the oversized member directly in the dataset's compound
    where the copy does overrun.  It does mean the depth fixture carries the
    ACCEPTANCE divergence and the depth argument, while
    compound_member_array_off12_oob.h5 remains the family's memory-safety
    carrier.
  REMEASURED: >-
    2026-08-15, at HEAD (2.3.0), on all four bundles.  THE VERSION SKEW IS
    CLOSED: the bundles measured 2.2.0 while the source lines in `defect` were
    read from 2.3.0, and the outcomes are now taken at 2.3.0 too.
    Oracle -- unchanged, and now confirmed at HEAD.  All four reject_corrupt
    under untrusted-strict with complete walks:
      40f5826c  H5_CORRUPT_LENGTH_OVERFLOW @ 247, again @ 295, and
                H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS @ 295 -- exactly the
                bundle's three findings at the bundle's offsets, no drift
      25420ff5  H5_CORRUPT_LENGTH_OVERFLOW @ 75, again @ 123, and
                H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS @ 123 -- the same
                three-finding shape, which is what makes this the one specimen
                carrying BOTH invariants
      40dc5115  H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS @ 123, single finding
      8e3dec66  H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS @ 295, single finding
    libhdf5 -- two corrections were recorded under libhdf5_as_recorded.  The
    first stands: stock accepts only three of the four, 8e3dec66 being
    rejected_in_traversal.  The second -- "ASan now crashes on all four" -- was
    RETRACTED 2026-09-01; see ASAN_CLAIM_RETRACTED below.
  ASAN_CLAIM_RETRACTED: >-
    2026-09-01, HDF5 2.3.0, from the re-measurement of specimen 1c2fd79f.
    measured.REMEASURED item (2) claimed "The ASan build no longer accepts ANY
    of the four: all report outcome=crashed, signal 6, under the datatype
    exercise at HEAD (2.3.0)".  IT DOES NOT REPRODUCE.  Every fixture in this
    family, probed with --exercise datatype against BOTH ASan builds -- the
    asserts-live one this record pins under DEPTH_AND_32BIT
    (settings_sha256 970f83354e89...) and an ASan/NDEBUG one
    (b55b23ba6c39...) -- reports:
      compound_member_array_bounds          accepted
      compound_member_array_nelem_overflow  accepted
      compound_member_array_nested_oob      accepted
      compound_member_array_off12_oob       accepted
      compound_member_offset_oob            rejected_in_traversal
      compound_member_overlap               rejected_in_traversal
    signal null, violations none, no sanitizer report, on all twelve runs.  The
    one bundle specimen still available, 1c2fd79f, reports accepted on both ASan
    builds too.  So the claim is withdrawn rather than qualified.
    WHY IT MATTERS, and it is not only bookkeeping: the retracted claim was
    doing real work in this record.  It was cited as "the strongest available
    hint" that the probe drives a converting read, which was the open canary
    question for the off12 fixture -- and the answer is the opposite (the probe
    has never converted; see coverage_gaps).  A sanitizer verdict that nothing
    reproduces would also have made this family look self-verifying, when in
    fact NO shipped read shape reaches the fault: it needs the conversion buffer
    capped, or a member at or above 1 MiB.  That is the real state of the family
    and it is weaker than the retracted line implied.
    WHAT NOT TO CONCLUDE.  This does not establish that the original run was
    wrong about its own process, only that its result is not reproducible here
    and that the record carries no evidence for it: no ASan frames were recorded
    for those runs, unlike the off12 report at :868, which IS reproducible and
    is preserved.  A signal 6 with no captured report is ambiguous between a
    sanitizer fatal-error path and a live assertion, so it could never have
    supported the "sanitizer catches the whole family" reading on its own.
  oracle_as_recorded: >-
    All four specimens reject_corrupt under untrusted-strict, and h5policy is
    width-independent by construction: it multiplies in exact 64 bits with a
    checked multiply, then bounds-checks the promoted size against the element
    (h5_datatype.pk:1175 (h5policy_checked_mul_u64) computes the promoted
    footprint; h5_datatype.pk:1180 (member_off > elm_size) tests
    `member_off > elm_size || member_size > elm_size - member_off` --
    subtraction after an explicit gate, so it cannot wrap at any target width).
    Those two line numbers were :622 and :628 here until 2026-09-01, by which
    time the code had moved five hundred lines; they now carry the anchor
    tools/check_source_citations.py checks.
    It rejects every wrapping variant regardless of the consumer's size_t.
  libhdf5_as_recorded: >-
    AS RECORDED IN THE BUNDLES (2.2.0): ACCEPTS on both builds.  The full
    datatype canary completes -- H5Dopen2, H5Dread, H5Tget_size, H5Tget_class,
    H5Tget_nmembers, H5Tget_member_type, H5Tget_super all succeed with zero
    post-open call errors.  h5dump -d and h5ls -v accept and print the type.
    oracle_alignment: divergent; comparison recorded as `regression`.
    Confirmed reaching the value, not merely decoding it:
    H5Tget_size(H5Tget_member_type(...)) returns 1125899906842624 on the
    baseline build (array-promotion-probe.txt).  That is the answer to the
    backlog's question -- the promoted size is not just stored, it is published
    through the public API.
    TWO CORRECTIONS FROM THE 2026-08-15 RE-MEASUREMENT, both material.
    (1) "ACCEPTS" was over-generalised from 40f5826c to all four bundles.  It
    holds for three -- 40f5826c, 25420ff5 and 40dc5115 all report stock
    `accepted` -- but 8e3dec66 reports `rejected_in_traversal` on stock, and did
    so in its own bundle too.  The OFFSET route is turned away in traversal
    where the ARITHMETIC route is silently accepted, which is a real difference
    between the two halves and should not have been flattened.
    (2) RETRACTED 2026-09-01 -- see measured.ASAN_CLAIM_RETRACTED.  This item
    read "The ASan build no longer accepts ANY of the four: all report
    outcome=crashed, signal 6, under the datatype exercise at HEAD (2.3.0)".
    It does not reproduce, on any specimen or fixture in this family, on either
    ASan build.  Nothing in this record's case now rests on it.
  memory_safety_consequence: >-
    variant_off12_reachable.h5 -- an 8-byte member at offset 12 of a 16-byte
    element -- gives an AddressSanitizer heap-buffer-overflow READ of size 8 at
    src/H5Tconv_compound.c:868 via H5Dread, 0 bytes after a 16-byte region.
    This is the specimen that converts the family from an acceptance divergence
    into a measured memory-safety defect, and it is why the backlog's
    provisional `violation` allowance must not be read as benign.
    THE PRECONDITION, added 2026-09-01 and missing when this was first written:
    the type-conversion buffer must be ONE ELEMENT WIDE.  libhdf5 allocates it at
    max_temp_buf (H5D_TEMP_BUF_SIZE, 1 MiB by default -- src/H5Dio.c:1435-1461),
    raising it to the widest type's size only when that is larger, so an 8-byte
    member ending 4 bytes past its 16-byte element escapes the ELEMENT while
    staying deep inside the ALLOCATION and reads that buffer's own zeros.  With
    default transfer properties the read returns rc=0 on both ASan builds and no
    sanitizer fires; H5Pset_buffer(16) -- the smallest value libhdf5 accepts
    here, and what a memory-constrained reader would set -- reproduces the
    report above exactly.  Re-measured on the tracked fixture, 2026-09-01.
    The threshold matters beyond this fixture: a member at or above 1 MiB makes
    the allocation one element wide BY ITSELF, so the same over-read needs no
    transfer-property tuning at all.  Measured on the 1c2fd79f specimen's
    geometry at 1 MiB and again at 4 MiB, with a member byte offset of 15:
    heap-buffer-overflow READ of size 1048576 and 4194304 at the same line, 0
    bytes after regions of 1048584 and 4194312 bytes.
  denial_of_service_consequence: >-
    variant_wrap64_zero.h5 -- product 2**64, so the promoted size is zero at
    BOTH widths -- is accepted by libhdf5, and h5dump then prints
    "HDF5: infinite loop closing library": H5_term_library cannot converge
    (h5dump-transcript.txt).  A zero-sized member is a second, distinct
    consequence of the same unchecked multiply, and it is not caught by a
    bounds check -- only by the :507 zero-size guard, which likewise runs
    before the promotion.
  width: >-
    MEASURED at both widths, unusually for this repo, via a freestanding i386
    binary running the real arithmetic (nelem-width-witness.c/.txt).
    The specimen's promoted member size is 1125899906842624 on 64-bit and 0 on
    32-bit -- the same file is a different defect at each width.
    The discriminating variants: variant_wrap32_zero (2**32, wraps to 0 on
    32-bit only), variant_wrap32_one (2**32+1, decodes as a VALID file on
    32-bit), variant_wrap32_two (2**32+2, an 8-byte member on 32-bit),
    variant_wrap64_zero (2**64, zero-sized at both widths).
    SUPERSEDED 2026-09-01 -- see WIDTH_ILP32_LIBRARY.  This read "NOT measured:
    libhdf5 itself on 32-bit.  libc6-i386 is present but libc6-dev-i386 is not,
    so gcc -m32 cannot link a hosted program and CMake cannot configure a 32-bit
    build."  The toolchain claim is stale: gcc -m32 links against the 32-bit
    2.3.0 install by hand.  All four discriminating variants are now measured
    against a 32-bit LIBRARY, and one of them says something the wording above
    got wrong.

  WIDTH_ILP32_LIBRARY: >-
    2026-09-01, libhdf5 2.3.0 at both widths: LP64 (sizeof(size_t)=8) and an
    i386 install linked with gcc -m32 (sizeof(size_t)=4, verified in-process).
    The four variants under `width` were rebuilt from h5policy-gencorpus's own
    helpers -- element 16, base H5T_STD_U32LE, member at offset 0 -- because the
    40f5826c bundle that first held them is gone.  Every libhdf5 run under
    ulimit -v 4 GiB.
      variant           product     H5Tget_size(member)@LP64   @ILP32   ILP32 read
      wrap32_zero       2**32       17179869184                0        refused (zero-size type)
      wrap32_one        2**32+1     17179869188                4        rc=0, SUCCEEDS
      wrap32_two        2**32+2     17179869192                8        rc=0, SUCCEEDS
      wrap64_zero       2**64       0                          0        refused at both widths
      fits (control)    2           8                          8        rc=0 at both widths
    THE GAP'S PREMISE WAS WRONG, and correcting it is the point.  It said
    wrap32_one "decodes as a VALID file at 32 bits".  A 32-bit libhdf5 does
    decode it, publish a 4-byte member and read it successfully -- but the file
    is not valid at either width.  It declares 641 * 6700417 = 4294967297
    elements of 4 bytes: a 17 GiB member at offset 0 inside a compound the same
    file declares as 16 bytes.  What ILP32 does is silently substitute
    `nelem mod 2**32` for the declared element count and read a DIFFERENT TYPE
    than the file describes.  So this is not an over-strict oracle: h5policy
    computes the footprint in exact 64 bits and rejects on
    H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS ALONE -- not on an overflow
    finding, because 4 * (2**32 + 1) does not overflow 64 bits -- and the
    declared extent exceeds the declared element at any width.  The control is
    accepted with zero findings and reads correctly at both widths, so none of
    this is an artifact of how the files were built.
    WHAT IS NEW is the SHAPE of the 32-bit consequence: not a fault and not a
    refusal, but a silent reinterpretation, with the two widths disagreeing about
    what the file MEANS.  `width` above already said "the same file is a
    different defect at each width"; measured against the library, for wrap32_one
    and wrap32_two it is not a defect at 32 bits at all -- it is wrong data
    returned successfully.
    AND IT IS VISIBLE IN ONE TOOL'S OWN OUTPUT, with no second build to compare
    against.  h5dump -d /dset on wrap32_one, 32-bit, exit 0, prints
    `H5T_ARRAY { [641][6700417] H5T_STD_U32LE } "a"` in the header and then
    exactly ONE value in the data section -- a declared 4-billion-element array
    materialised as one element, successfully.  The 64-bit h5dump of the same
    file, also exit 0, prints `DATA { }`: an empty data block for a dataset that
    has data, with nothing on stdout or stderr to say so.  Same tool, same
    version, one file: nothing on 64-bit, one wrong value on 32-bit, success
    both times.
    THE TRACKED FIXTURES, measured at both widths in the same run, because they
    outlive any bundle variant:
      compound_member_array_nelem_overflow  member 1125899906842624 @LP64, 0 @ILP32
      compound_member_array_bounds          member 262144 at both widths
      compound_member_array_off12_oob       member 8 at both widths
      compound_member_array_nested_oob      member 8 at both widths
      compound_member_offset_oob            no member published: rejected in traversal
    The first line confirms `width`'s claim about the 2**50 shape against the
    LIBRARY rather than against the freestanding arithmetic witness -- the same
    file is a 1 PiB member on LP64 and a zero-sized member on ILP32.  The next
    three are the deliberately width-INdependent fixtures and they behave
    identically, which is the control on this whole table.
    NOT MEASURED, deliberately: whether an uncapped LP64 calloc of 17 GiB is
    granted under overcommit, and what H5Dread then does.  The 4 GiB cap is what
    refuses those allocations here, and an uncapped run of this family has taken
    a session down before.  No big-endian build.  Write direction not exercised.

# -- Divergence from the selected build ---------------------------------------
divergence:
  oracle: reject_corrupt
  libhdf5: accepted
  libhdf5_version: >-
    2.2.0, 2.3.0 (develop) and 1.14.5 all MEASURED as accepting.  The earlier
    wording here was "guards still absent at 2.3.0 (source-verified)", which
    the 2026-09-01 archaeology makes imprecise in a way that matters for a
    report: the member guard is PRESENT from 1.14.4 onward and merely runs
    before the promotion, while on 1.8.0-1.14.3 it is genuinely absent.  See
    version_range.eras.
  classification: A -- a real invariant-A disagreement, and an investigated one
  note: >-
    libhdf5 accepts three of the four specimens while h5policy rejects all four,
    so this IS an invariant-A divergence.  (8e3dec66, the offset route, is
    rejected_in_traversal on stock -- corrected under measured.REMEASURED; the
    "all four" that stood here predates that.)  It is currently carried by the
    provisional
    `violation` allowance described in
    registry/cases/arithmetic-divergences-backlog.yml, which that file
    explicitly flags as "provisional ... it must not be read as a judgement
    that these are benign".
    That allowance is now justified rather than provisional, and on stronger
    grounds than a tolerance: acceptance here is not a reference-library defect
    on one specimen but a whole class where libhdf5 publishes an oversized
    member through the public API and, given a conversion buffer one element
    wide, reads it out of bounds on H5Dread -- see
    measured.memory_safety_consequence for what that precondition costs an
    attacker, which is one dimension field.  If a
    narrower carrier is wanted, a finding-code-scoped A~ predicate over
    H5_CORRUPT_LENGTH_OVERFLOW + H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS
    would be the shape -- NOT an entry in h5policy-diff-tolerances.yml.

# -- Containment vs systemic remediation --------------------------------------
containment:
  status: not_implemented        # libhdf5 side; not proposed upstream by this repo
  description: >-
    Two coupled changes, both required.
    (1) CHECKED MULTIPLICATION INSIDE H5T__array_create, for both the nelem
    accumulation (src/H5Tarray.c:158) and the base_size*nelem product (:162),
    mirroring the guards already present for standalone arrays at
    src/H5Odtype.c:815-817 and :835-838.  Put it in the CONSTRUCTOR rather than
    at the decode call site: H5T__array_create is also reached from the public
    H5Tarray_create1/2, so a decode-site fix leaves the API route open.
    (2) RE-EVALUATE THE :507 ZERO-SIZE AND :509 MEMBER-BOUNDS GUARDS AFTER THE
    PROMOTION AT :542, against the promoted type rather than the base type.
    Half (1) is essentially risk-free: a checked multiply can only reject
    products that overflow size_t, and no writer has ever emitted the v1
    embedded-array encoding with such dimensions.
    Half (2) is the risk-bearing one: it newly rejects any v1 compound whose
    promoted member footprint exceeds its declared element -- which is exactly
    the set h5policy already rejects, so the blast radius is known.
    BOTH halves must be tested on a 32-bit target.  The thresholds differ by 32
    binary orders of magnitude and the wrapped residues that matter (0, 1 and 2
    elements) occur only there; a fix validated solely on x86-64 would not
    exercise the cases that decode as valid files on i386.
systemic:
  semantic_boundary: >-
    the complete datatype record.  Decode legacy dimensions into inert values;
    checked-multiply the count and the base footprint when the array type is
    created; then check the PROMOTED member against its compound element,
    before native construction or publication.
  status: closed_in_bounded_path
  owner: h5policy (bounded decoder); libhdf5 decode and constructor still open
  description: >-
    h5policy computes the promoted footprint first and bounds it second, in
    exact 64-bit arithmetic with a checked multiply, so no target-width wrap
    can normalise a bad value before the bound sees it.  The member-bounds
    expression is written as a subtraction after an explicit `member_off >
    elm_size` gate specifically so it cannot wrap.  All four specimens and
    every discriminating variant are rejected.
    The remaining work is entirely libhdf5's.
  landed_changes:
    - h5policy/pickles/h5_datatype.pk (promoted footprint at :622; the
      wrap-proof member bound at :628)
    - registry/findings/catalog (H5_CORRUPT_LENGTH_OVERFLOW,
      H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS)
    - registry/validation-coverage.yml (datatype.size_arithmetic,
      datatype.compound_member_bounds)
    - h5policy/tools/h5policy-gencorpus (_make_compound_member_array_nelem_overflow,
      and the bounds/offset fixtures)
    - h5policy/tests/expected/malformed-compound_member_array_nelem_overflow.yml,
      malformed-compound_member_array_bounds.yml,
      malformed-compound_member_offset_oob.yml

