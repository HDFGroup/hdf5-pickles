  assertions:
    stable_finding: true
    fails_before_materialization: true      # for h5policy
    no_plugin_load: true
    no_decompression: true
    no_external_open: true
    no_user_callback: true
    no_legacy_fallback: true

backports: []          # nothing to backport in h5policy.

fuzz_seed: >-
  malformed/compound_member_array_nelem_overflow.h5 is already a seed.  The
  un-corpused semantic neighbours are the four wrap-discriminating vectors
  (wrap32_zero/one/two, wrap64_zero) plus variant_off12_reachable and
  variant_bounds_only -- the boundary is at SIZE_MAX/base_size for each target
  width, and the interesting residues are 0, 1 and 2 elements.

compatibility_backport_risks: >-
  See containment for the split: half (1) rejects only products that overflow
  size_t and no writer has emitted such dimensions; half (2) newly rejects any
  v1 compound whose promoted member footprint exceeds its declared element,
  which is precisely the set h5policy already rejects.
  The 32-bit obligation is the real risk and is not optional.  The thresholds
  differ by 32 binary orders of magnitude between the widths, and the wrapped
  residues that decode as VALID files (variant_wrap32_one) exist only at 32
  bits -- so a 32-bit build with the fix applied could newly reject files that
  a 64-bit build with the same fix still accepts, and vice versa.  Any backport
  must state which width's behaviour is normative.

sibling_audit: >-
  Within libhdf5: H5T__array_create is reached from the v1 embedded-array
  decode path AND from the public H5Tarray_create1/2, so the constructor is the
  correct fix site and the API route is a second, unmeasured entry point.  The
  standalone array decoder (src/H5Odtype.c:812-848) is audited and CORRECT --
  it is the contrast that makes this record's argument.  The :507/:509 guards
  were audited only for the v1 embedded-array ordering; whether other member
  classes are promoted or transformed after those guards run was not checked.
  NESTING DEPTH, added 2026-08-26 and now the sharpest constraint on where a fix
  may go.  H5O__dtype_decode_helper recurses into a nested compound and runs the
  same :507/:509-before-:542 ordering at every level.  MEASURED at depth two
  (the ordering route's fifth specimen and the tracked fixture
  malformed/compound_member_array_nested_oob.h5): libhdf5 accepts an inner
  member that overruns the compound containing it while the outer member passes
  its own bound honestly.  A guard placed only where the dataset's own datatype
  is decoded would therefore close all four earlier specimens and leave this
  one accepted -- which is the argument for fixing at H5T__array_create or
  immediately after :542, not at the dataset-datatype boundary.  Depth three,
  and an array-OF-compound carrier, are INFERRED from the shared recursion and
  not measured.
  A second in-tree contrast, measured the same day: H5T__insert
  (src/H5Tcompound.c:421) already enforces this bound against the promoted size,
  so the constructor and the standalone array decoder both have what the
  embedded decode path lacks.  See measured.DEPTH_AND_32BIT.
  Within h5policy: the promoted-footprint bound at h5_datatype.pk:1180
  (member_off > elm_size) is shared,
  so v1 embedded arrays and ordinary members go through one expression.  Whether
  the same compound shape arriving as an ATTRIBUTE datatype rather than a
  dataset datatype takes the same validated path is asserted from the shared
  implementation, not separately measured -- and attributes are known to use a
  throwaway context copy, so this is worth confirming rather than assuming.

# -- Affected versions --------------------------------------------------------
version_range:
  affected: '>= 1.8.0'
  patched: none
  # ARCHAEOLOGY RUN 2026-09-01, from the 1c2fd79f re-measurement.  This field
  # read "UNVERIFIED as a range, but spans at least 2.2.0 to 2.3.0 ... No
  # archaeology was run to find when the legacy embedded-array path diverged
  # from the standalone one."  It has been run, and the answer is more specific
  # than a range: there are two eras, and the file is accepted in both for
  # DIFFERENT reasons.
  eras:
    - >-
      1.8.0 through 1.14.3: THERE IS NO MEMBER BOUND AT ALL.  The compound
      branch of H5O__dtype_decode_helper calls the version-1 array promotion as
      far back as 1.8.0 and never compares the member against its parent, at
      either the base or the promoted size.  So the oversized member is not
      "accepted past a guard" on these lines; nothing looks.
    - >-
      1.14.4 through 2.3.0 (develop): the bound exists and runs BEFORE the
      promotion, so the same file is still accepted.  This is the era the
      :507/:509-before-:542 ordering in `defect` describes.
  introduced_the_guard: >-
    136739b37a9 (2024-03-27), "File format security issues (#4234)", first
    released in 1.14.4.  Hunk header '@@ -452,6 +489,13 @@' -- the bound was
    inserted ABOVE the version-1 promotion block, which already existed at
    1.14.3.  So the ordering has never been right: the hardening pass that added
    the member bound placed it where the promotion cannot have happened yet.
    That is the single most useful fact for an upstream report, because it means
    the fix is not "add a check" but "re-run the check that is already there".
  method: >-
    The compound branch of H5O__dtype_decode_helper was read VERBATIM from
    src/H5Odtype.c at 18 tags -- 1_8_0, 1_8_5, 1_8_10, 1_8_16, 1_8_21, 1_8_23,
    1_10_0, 1_10_5, 1_10_11, 1_12_0, 1_12_3, 1_14_0, 1.14.4, 1.14.5, 1.14.6,
    2.0.0, 2.1.0, develop -- and the ORDER of the zero-size guard, the member
    bound, the H5T__array_create call and the promoted-size assignment recorded
    per tag.  Order, not presence, is the thing being measured, so a pickaxe
    search would have answered the wrong question.  The introduction was then
    narrowed against 1_14_1, 1_14_2, 1_14_3 and 1.14.4 individually.
  measured_ends: >-
    1.14.5 (bundled with h5py 3.13.0) and develop 2.3.0 are MEASURED -- both
    open the file and publish the promoted member size.  The tags in between are
    source-derived from the per-tag reads above, not run.
  note: >-
    The earlier inference recorded here -- that the standalone-array guards were
    added in response to a specific report and the legacy embedded path was
    never revisited -- is now better supported: the legacy path's bound arrived
    in a batch of file-format hardening and was placed before the one
    transformation on that path that changes a member's size.  Still an
    inference about intent; the placement itself is a measurement.
  label: established

