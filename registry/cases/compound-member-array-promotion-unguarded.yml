    from it is the shape, not the bytes.  It is reconstructible from
    tools/test/testfiles/tnestedcomp.h5 (sha256 439042f49c82096ef94dc46fd43ad78
    29355212faa5fe839f621d5837fc45861) by setting byte 0x7f5 to 0xf6.
    40f5826c's specimen differs from its tracked fixture in only 32 bytes
    -- object-header timestamps and the chunk-0 checksums over them -- with the
