    - h5policy/tests/expected/malformed-compound_member_array_off12_oob.yml
    - h5policy/tests/expected/malformed-compound_member_array_nested_oob.yml
  control_fixture: >-
    variant_fit.h5 in the 40f5826c bundle -- a valid embedded-array compound the
    oracle ACCEPTS.  Essential here: the containment's half (2) newly rejects a
