  memory_safety_witness: >-
    variant_off12_reachable.h5 (40f5826c) -- ASan heap-buffer-overflow READ at
    H5Tconv_compound.c:868 via H5Dread.  Tracked since 2026-08-15 as
    malformed/compound_member_array_off12_oob.h5; the "Not tracked in the corpus"
    that stood here was already stale when the fixture landed.  Reaching the
    report needs the conversion buffer capped -- see
    measured.memory_safety_consequence.
  width_witness: >-
    nelem-width-witness.c in the 40f5826c bundle.  One source, run twice: native
    x86-64 and a freestanding i386 binary (-m32 -nostdlib -static, raw int 0x80
    syscalls).  Executed arithmetic, not a uint32_t model.  Reusable for any
    future width question in this repo.
  generators: >-
    All tracked fixtures here are generator-produced and reproducible from this
    repo; the nested one is _make_compound_member_array_nested_oob in
    h5policy/tools/h5policy-gencorpus.  The 2026-08-26 specimen has NO tracked
