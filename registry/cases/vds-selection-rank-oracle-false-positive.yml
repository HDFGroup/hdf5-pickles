# A serialized hyperslab rank outside 1..H5S_MAX_RANK. libhdf5 FIXED this; the
# live problem is on our side -- h5policy cannot identify the rank invariant and
# rejects a VALID VDS file to stay closed.
#
# Promoted from one working bundle:
#   cases/cc6998c76f0b9566a211b18d04ae16e5
#
# This record is inverted relative to almost everything else in this directory.
# The upstream half is closed and recorded for completeness; the open item is an
# h5policy FALSE POSITIVE on valid input, which is the most damaging kind of
# oracle defect and the reason no fixture for this invariant can exist yet.
schema_version: 1

id: vds-selection-rank-oracle-false-positive
title: h5policy rejects a valid rank-3 VDS selection because it cannot identify
  the hyperslab rank invariant that libhdf5 now enforces
status: oracle-defect            # NOT oracle-hardened -- see oracle_false_positive
disclosure: >-
  n/a -- local analysis only.  Advisory text was deliberately not retrieved and
  no identifier was looked up; evidence is the local specimen, source history
  and build measurements.

# -- Triage -------------------------------------------------------------------
record: dataspace_selection
versions: [2]                    # serialized hyperslab selection version 2
root_cause_classification: local_decode
violated_invariant:
  - selection.hyperslab_rank_range
validation_closure: >-
  one bounded serialized hyperslab selection -- selection type, version, flags,
  header remainder, rank, and exactly `rank` coordinate tuples -- reached
  through the bounded VDS global-heap mapping envelope.  The rank must be
  validated before any fixed-array use and the exact tuple extent proven before
  it is decoded.
activation_before_validation:
  - native_construction          # see libhdf5_residual
entry_points:
  - h5policy (oracle) -- rejects, but generically; see oracle_false_positive
  - "libhdf5 H5Fopen -> H5Dopen2 -> H5D__virtual_parse_source_info -> H5S__hyper_deserialize"
  - "libhdf5 public API: H5Sdecode -> H5S_select_deserialize -> H5S__hyper_deserialize"

# -- The libhdf5 half is closed -----------------------------------------------
libhdf5_fixed: >-
  CONFIRMED FIXED at 2.3.0, and verified in source at promotion rather than
  taken from the bundle.  H5S__hyper_deserialize now guards the decoded rank
  immediately, before any rank-dependent work:
      UINT32DECODE(pp, rank);                              /* src/H5Shyper.c:4340 */
      if (0 == rank || rank > H5S_MAX_RANK)                /* :4341 */
          HGOTO_ERROR(H5E_DATASPACE, H5E_BADVALUE, FAIL,
                      "invalid rank (%u) for serialized hyperslab selection", rank);
      if (!*space) {
          memset(dims, 0, (size_t)rank * sizeof(dims[0]));
          if (H5S_set_extent_simple(tmp_space, rank, dims, NULL) < 0)   /* :4348 */
  The bundle attributes the fix to commit abbb48b9cb6, and records that the
  current Release and ASan builds both reject the integration PoC before
  H5Dopen2 returns a dataset id.  Both the zero case and the above-maximum case
  are covered by the one condition.
libhdf5_residual: >-
  ONE ORDERING POINT REMAINS, and it is minor -- stated because the bundle
  flagged it and it should not be silently dropped.  `tmp_space` is allocated
  BEFORE the rank guard at :4341, so an H5S_t exists before the rank is
  validated.  The rank-DEPENDENT work all follows the guard (:4348 onward), so
  no attacker-controlled quantity sizes anything pre-guard; what precedes
  validation is a fixed-size allocation, not an unbounded one.
  The bundle also notes the malformed direct witness emits an HDF5 shutdown
  warning, which suggests the pre-guard object is not always cleanly released on
  the error path.  Not investigated further.

# -- The open item is ours ----------------------------------------------------
oracle_false_positive: >-
  h5policy REJECTS A VALID FILE.  variant_rank_3.h5 is a well-formed VDS that
  differs from the specimen only in the rank field, is accepted by libhdf5, and
  is rejected by h5policy as reject_corrupt with the generic finding
  H5_CORRUPT_VDS_SELECTION.  The bundle records this plainly under
  verification.valid_input_differential: "HDF5 accepts rank-3 control; oracle
  currently rejects it conservatively".
  The cause is capability, not a wrong rule: h5policy has no bounded VDS
  selection decoder.  It cannot parse the selection well enough to identify the
  rank, so it fails closed on the whole mapping and emits one generic finding
  for malformed and valid selections alike.  The specimen and the valid control
  get the SAME finding at the same kind of offset, which means the current
  rejection of the specimen carries no information about the rank invariant --
  it is not detection, it is refusal.
  WHY THIS BLOCKS A FIXTURE, and why the record has none.  A malformed fixture
  would assert a finding that does not identify the defect; a valid control
  would fail, since the oracle rejects it.  Adding either would pin the wrong
  behaviour into the corpus.  The order has to be: build the bounded VDS
  selection decoder, give it a rank-specific finding, confirm the valid control
  is ACCEPTED, then add both fixtures.
  This is the same hazard as the layout-v5 false positive recorded in
  registry/cases/layout-v4-ndims-lower-bound-missing.yml, and the resolution
  there is the template: the loosening (accepting valid v5) and the new rule
  (dimensionality) had to land together.  Here the loosening is "decode VDS
  selections properly" and the rule is the rank range.

# -- Measured behaviour -------------------------------------------------------
measured:
  NOT_REMEASURED_AT_PROMOTION: >-
    Everything under `measured` is the bundle's, captured 2026-07-24 against
    libhdf5 2.3.0, and was NOT re-measured at promotion.  The SOURCE claim under
    libhdf5_fixed WAS verified in the 2.3.0 tree at promotion and is current --
    which matters here more than usual, since the record's headline is that the
    upstream half is closed.
  oracle_as_recorded: >-
    untrusted-strict and forensic both reject_corrupt with
    H5_CORRUPT_VDS_SELECTION @ 1531 on /vds_dset.  The raw rank field is at
    1474, so the finding is not even anchored at the defective field -- another
    symptom of the missing decoder.  All oracle boundary flags false.
  libhdf5_as_recorded: >-
    Rejects the integration PoC before H5Dopen2 returns a dataset id, on both
    the Release and ASan builds.  No crash, no sanitizer report -- the guard
    works.
  boundary_matrix: >-
    Five neighbours differing in the rank field:
      variant_rank_0    zero rank, malformed
      variant_rank_3    VALID -- the control libhdf5 accepts and h5policy rejects
      variant_rank_32   equality with H5S_MAX_RANK, with an intentionally
                        too-short rank-3 payload
      variant_rank_33   first rank above the maximum
      input.h5          the supplied 255-rank specimen
    Only rank 3 has a complete VDS selection payload, so the matrix tests the
    rank field rather than the full selection at each rank.
    A separate in-memory direct witness accepts a complete rank-32 selection and
    rejects rank 255, which is what pins H5S_MAX_RANK as the actual boundary
    rather than an arbitrary cutoff.
  truncation: >-
    Complete for the specimen AND the valid control -- all 5,497 prefixes of
    each had a verdict, with no escaped exception, no internal finding and no
    missing verdict.
  width: >-
    The encoded rank is a uint32_t, so 0, 3, 32, 33 and 255 are
    width-independent.  The PRE-FIX fixed-array overrun scaled with hsize_t --
    typically four bytes per element on ILP32 and eight on LP64 -- so the
    historical impact was width-dependent even though the trigger is not.
    Evidence is LP64 only; no i386 libhdf5 is installed.

# -- Divergence from the selected build ---------------------------------------
divergence:
  oracle: reject_corrupt (on BOTH the malformed specimen and the valid control)
  libhdf5: rejects the specimen, ACCEPTS the valid control
  libhdf5_version: 2.3.0
  classification: >-
    inverted -- h5policy is the incorrect side here, on valid input
  note: >-
    On the malformed specimen the two sides agree, so nothing is failing that
    would need a tolerance, and none is present.
    On the VALID control they disagree and h5policy is wrong.  That divergence
    is not carried anywhere, because the control is not in the corpus -- it
    cannot be added while the oracle rejects it.  So this is a divergence with
    no test asserting it, which is precisely why it needs a record: nothing in
    the harness will notice if it persists or regresses.

# -- Containment vs systemic remediation --------------------------------------
containment:
  status: landed_upstream_open_in_oracle
  libhdf5: >-
    Done -- src/H5Shyper.c:4341.  Nothing further is proposed here beyond the
    minor pre-guard allocation noted under libhdf5_residual.
  h5policy: >-
    OUTSTANDING, and it is the real work of this record.  Build a bounded
    serialized-selection decoder: validate the rank against 1..H5S_MAX_RANK
    before any fixed-array use, then prove the exact coordinate-tuple extent
    before decoding it, inside the bounded VDS mapping envelope.  Emit a
    rank-specific finding rather than the generic H5_CORRUPT_VDS_SELECTION.
    Land the decoder and the rule TOGETHER, and confirm the valid control is
    accepted before either fixture is added -- see oracle_false_positive.
systemic:
  semantic_boundary: >-
    the bounded serialized hyperslab selection and its VDS mapping envelope:
    validate rank before H5S_create or any fixed-array use, then prove the exact
    coordinate tuple extent before decoding it.
  status: open_in_oracle
  owner: h5policy VDS decoder
  description: >-
    Unusually, the bounded path is the one that is NOT closed.  h5policy fails
    closed and is therefore safe, but it is imprecise in a way that costs a
    valid file -- and being safe by refusing everything is not the property this
    oracle is meant to have.
  landed_changes: []             # none -- this record is the gap

# -- Reproducers --------------------------------------------------------------
reproducers:
  integration_poc: cases/cc6998c76f0b9566a211b18d04ae16e5/input.h5
  direct_fixtures: []            # NONE, and deliberately -- see oracle_false_positive
  valid_control: >-
    variant_rank_3.h5 in the bundle.  This is the most important file in the
    case and the one that cannot currently be tracked: libhdf5 accepts it,
    h5policy rejects it, and adding it to valid/ today would fail the suite.
    It is the acceptance test for any fix.
  direct_witness: >-
    selection-rank-probe.c in the bundle -- an in-memory witness that accepts a
    complete rank-32 selection and rejects rank 255, isolating the boundary from
    the full-file path.
  generator: >-
    None.  The specimen is supplied and the neighbours are bundle-local.  A
    tracked generator is part of the outstanding h5policy work, not separable
    from it.
  assertions:
    stable_finding: partial -- generic VDS finding is stable but not rank-specific
    oracle_fails_before_materialization: true
    libhdf5_fails_before_dataset_handle: true
    libhdf5_fails_before_native_construction: false   # tmp_space precedes the guard
    no_plugin_load: true
    no_decompression: true
    no_external_open: true
    no_write: true
    no_user_callback: unverified_internal_only
    no_legacy_fallback: unverified_internal_only

backports: []

fuzz_seed: >-
  The 5,496-byte specimen plus the rank 0/3/32/33 neighbours and the in-memory
  rank-32-to-255 witness are retained in the bundle.  The rank field is a clean
  uint32 axis with the boundary at H5S_MAX_RANK, but note only rank 3 carries a
  complete selection payload -- so a useful fuzz corpus here needs payloads
  matching each rank, which does not exist yet.

compatibility_backport_risks: >-
  libhdf5: rejecting ranks outside 1..H5S_MAX_RANK is format-safe and already
  shipped.  Preserve valid rank 32 (the equality case) and ensure
  rank-dependent tuple lengths are bounded before allocation or array access.
  h5policy: the change is a LOOSENING for valid files -- it must make the
  rank-3 control pass -- combined with a new specific rule.  Landing the
  loosening alone would turn a conservative rejection into an acceptance of the
  malformed specimen, which is strictly worse than today.

sibling_audit: >-
  Within libhdf5: H5Dvirtual.c uses the shared deserializer for both source and
  virtual VDS selections; H5Rint.c has two reference-selection call sites; and
  H5S.c exposes public H5Sdecode.  The guard is in the shared decoder, so all of
  those inherit it -- and the bundle's note stands that finite callers must
  continue to pass explicit extents rather than SIZE_MAX.  H5Spoint.c also
  checks rank.
  Within h5policy: the missing bounded selection decoder affects every VDS
  mapping, not only hyperslabs, so the false positive is likely broader than
  the one control this bundle measured.  That breadth is inferred from the
  absence of a decoder, not measured.

# -- Affected versions --------------------------------------------------------
version_range:
  libhdf5:
    affected: >-
      Versions before commit abbb48b9cb6, per the bundle.  The historical parent
      was inspected but not built, so the pre-fix behaviour is source-derived.
    fixed_in: >-
      2.3.0 -- guard verified present in the tree at promotion.  Which release
      first carried abbb48b9cb6 was not established.
  h5policy:
    affected: current HEAD; the false positive is live.
  label: libhdf5 half source-established; oracle half current

# -- Open items ---------------------------------------------------------------
coverage_gaps:
  - >-
    THE VALID CONTROL CANNOT BE TRACKED.  variant_rank_3.h5 is accepted by
    libhdf5 and rejected by h5policy, so it cannot enter valid/ until the
    decoder lands.  Until then nothing in the suite asserts that h5policy
    accepts a well-formed VDS selection, and a regression in either direction
    would be invisible.
  - >-
    NO RANK-SPECIFIC FINDING.  H5_CORRUPT_VDS_SELECTION is emitted for the
    malformed specimen and the valid control alike, and is anchored at 1531
    while the rank field is at 1474.  Any fixture written today would assert a
    finding that does not identify the defect.
  - >-
    NOTHING WAS RE-MEASURED AT PROMOTION except the libhdf5 source guard.
  - >-
    Only rank 3 has a complete selection payload, so the neighbour matrix tests
    the rank FIELD rather than a complete selection at each rank.
  - >-
    No end-to-end 32-bit measurement; the pre-fix overrun scaled with hsize_t so
    the historical impact differed by width.
open_questions:
  - >-
    How broad is the false positive?  h5policy lacks a bounded selection decoder
    generally, so valid VDS files using other selection types are plausibly
    rejected too.  Only the rank-3 hyperslab control was measured, and a sweep
    of valid VDS shapes against the oracle would size the problem cheaply.
  - >-
    Is the pre-guard tmp_space leaked on the error path?  The bundle reports an
    HDF5 shutdown warning from the malformed direct witness, which is the
    signature of an unreleased object.  Minor, but it is a real observation left
    uninvestigated.

