# A metadata-cache-image entry's LRU description is validated by assert() only.
#
# This is a DIVERGENCE case, not a memory-safety case. Unlike fsm-section-bin-range
# (where the unchecked field is an array index and the fault is demonstrable), the
# only measured consequence here is that a Release libhdf5 accepts a self-
# contradictory LRU description and an asserts-enabled build aborts on it. What the
# inconsistent ranks go on to do inside the reconstructed cache is an open question
# recorded below, deliberately not asserted.
schema_version: 1

id: mdci-lru-rank-assert-only
title: cache-image entry lru_rank/IN_LRU relation is guarded by assert only, so NDEBUG builds reconstruct from a contradictory LRU description
status: oracle-hardened          # h5policy rejects; libhdf5 containment not reported
disclosure: >-
  n/a -- local analysis only. Reached while triaging the DoS specimen held in
  cases/mdci_reconstruct_fd_parent_uaf_dos/, whose entry 0 carries lru_rank 2816
  with IN_LRU clear. No advisory database was consulted and no identifier was
  looked up; see registry/cases/ for the sibling MDCI cases.

record: cache_image_dependency_graph
# Sibling records in this family:
#   mdci-reconstruct-cleanup-unsafe.yml -- what an inconsistent entry description
#     goes on to DO in a full specimen: the memory-unsafe reconstruction-failure
#     cleanup (NULL-deref DoS and double-free). This record covers only the
#     missing guard; that one covers the consequence.
#   mdci-image-checksum-unverified.yml -- the whole-image integrity gap.
root_cause_classification: reference_graph
violated_invariant: mdci.entry_lru_consistent
entry_points:
  - h5policy (oracle) -- untrusted-strict, rejects with H5_CORRUPT_MDCI_ENTRY_LRU_INCONSISTENT
  - "libhdf5 H5Fopen -> H5O_protect -> H5AC_protect -> H5C_protect
     -> H5C__load_cache_image (H5Cimage.c:652) -> H5C__reconstruct_cache_contents
     -> H5C__reconstruct_cache_entry (H5Cimage.c:2701-2899)"
  - "shipped tools: any that open the file. h5dump -H and h5stat both reach it,
     because the cache image loads during the root object-header protect."

# ── The defect, read out of the source tree (HDF5 2.3.0 @e4b6a964723) ─────────
defect: >-
  H5C__reconstruct_cache_entry decodes the per-entry flags and then the signed
  32-bit LRU rank (INT32DECODE, H5Cimage.c:2812). The relation between the two --
  IN_LRU set implies lru_rank >= 0, IN_LRU clear implies lru_rank == -1 -- is
  expressed at :2813 as
  `assert((in_lru && pf_entry_ptr->lru_rank >= 0) || (!in_lru && pf_entry_ptr->lru_rank == -1))`
  and nowhere else. Every neighbouring field in the same decoder is checked with
  H5_IS_BUFFER_OVERFLOW/HGOTO_ERROR (the entry address range at :2820-2824 is a
  real check), so the LRU relation is the one decoded quantity in this record with
  no runtime guard. Under NDEBUG the assert is compiled out and reconstruction
  proceeds on the contradictory description.
  The same relation is asserted, never checked, at three further sites:
  H5Cimage.c:1464 (the encode-side sanity check in H5C__cache_image_block_entry_header_size's
  sibling decoder), :2537 (`assert(parent_ptr->lru_rank == -1)`, requiring
  flush-dependency parents to be outside the LRU), and the whole ordering
  verification block at :2586-2613, which walks the reconstructed list checking
  `lru_rank != 0`, strict ordering, and `lru_rank_holes <= H5C__MAX_EPOCH_MARKERS`.
  That entire block is assert-only, so on a Release build none of it runs.

boundary_note: >-
  The reachable band is wide and cheap to hit: lru_rank is a full int32 read
  straight out of the image, and the only other constraint on it is the assert.
  h5policy enforces the relation exactly as libhdf5 states it -- IN_LRU (flag
  0x02) set requires the sign bit clear, IN_LRU clear requires exactly
  0xffffffff -- so the oracle and the assert agree on the boundary, and a file
  libhdf5's debug build accepts is a file h5policy accepts.

asymmetry: >-
  The sibling invariant mdci.parent_addr_resolvable needs no tolerance entry and
  the contrast is the point. A dangling flush-dependency parent hits a REAL check
  -- `HGOTO_ERROR(H5E_CACHE, H5E_NOTFOUND, FAIL, "fd parent not in cache?!?")` at
  H5Cimage.c:2533 -- so libhdf5 rejects it on both builds and the differential
  harness sees agreement. The LRU relation, one decoder away, got an assert
  instead. Nothing about the two fields justifies the difference in treatment;
  it is an inconsistency in the decoder, and it is exactly the inconsistency that
  makes the LRU fixture invisible to an exit-status-based differential.

# ── Measured behaviour ───────────────────────────────────────────────────────
measured:
  fixtures: >-
    malformed/mdci_entry_lru_inconsistent.h5, generated by h5policy-gencorpus
    (_make_mdci_entry_lru_inconsistent, via the shared _mdci_assemble helper) and
    owned by h5policy/tests/expected/malformed-mdci_entry_lru_inconsistent.yml.
    A single entry caching the real root object header, with IN_LRU clear and
    lru_rank 5. Every other field is well formed: correct image_data_len, valid
    Jenkins trailing checksum, flag/dependency counts consistent, extent in file.
    The sibling malformed/mdci_parent_addr_unresolved.h5 is tracked in the same
    coverage record but needs no tolerance.
  oracle_before: >-
    ACCEPTED. The MDCI entry loop checked flags/dependency-count consistency and
    the entry extent, but never read lru_rank, so a contradictory LRU description
    passed straight into the replay pass.
  oracle_after: >-
    rejects with H5_CORRUPT_MDCI_ENTRY_LRU_INCONSISTENT at the entry's lru_rank
    offset (eoff + 10), in the entry loop -- before the replay pass and before any
    shadow ranges are recorded. reject_corrupt, exit 2. valid/cache_image.h5 and
    the rest of the MDCI/cache-image fixtures are unaffected.
  libhdf5_stock: >-
    OPENS THE FILE AND REPORTS SUCCESS. `h5dump -H` exits 0 and prints the
    complete structure (GROUP "/" containing DATASET "a", H5T_STD_I32LE, SIMPLE
    { (4) / (4) }); `h5stat` exits 0. No tool return code corroborates the
    rejection, which is why invariant A fails and why this entry exists.
  libhdf5_asserts_on: >-
    aborts. The candidate build (RelWithDebInfo, asserts live) gives
    `h5dump: src/H5Cimage.c:2813:
    H5C__reconstruct_cache_entry: Assertion `(in_lru && pf_entry_ptr->lru_rank >= 0)
    || (!in_lru && pf_entry_ptr->lru_rank == -1)' failed.` and exits 134 (SIGABRT).
    This is the evidence the differential harness cannot observe through the stock
    build's exit statuses. NOTE: this is an assertion abort, NOT an ASan report --
    no memory error is detected on this fixture at this point.
  sibling_control: >-
    malformed/mdci_parent_addr_unresolved.h5 measured the same two ways: stock
    h5dump -H exits 1, asserts-on build exits 1, both with h5dump's "internal
    error" after the library refuses the reconstruction. Agreement on both builds,
    so it passes the differential unaided and is deliberately NOT listed in
    h5policy-diff-tolerances.yml.
  width: >-
    NOT measured at 32 bits. lru_rank is a fixed int32 on both widths and the
    relation involves no size_t arithmetic, so no width-dependent band is
    expected -- but this is reasoning, not measurement, unlike the i386 witness
    work in datatype-size-not-final.

# ── Containment vs systemic remediation (strategy doc §11.5) ─────────────────
containment:
  status: planned
  description: >-
    In H5C__reconstruct_cache_entry, promote the H5Cimage.c:2813 assert to
    `HGOTO_ERROR(H5E_CACHE, H5E_BADVALUE, NULL, "invalid LRU rank")`, matching the
    treatment the entry address range already gets twenty lines later. Backportable
    and cannot reject a libhdf5-written image, since the encoder maintains the
    relation (H5Cimage.c:2349-2376 assigns lru_rank only while scanning the LRU
    list and leaves pinned entries at -1). The ordering block at :2586-2613 should
    get the same treatment or be deleted; leaving it assert-only means Release
    builds carry code that never executes.
systemic:
  semantic_boundary: >-
    the cache image as one aggregate -- every entry header, the flush-dependency
    edge set, and the LRU ordering validated as a unit before a single entry is
    inserted into the cache.
  status: planned
  description: >-
    The general defect is that this decoder expresses file-format invariants as
    asserts. An assert states a belief about program state; a file field is
    adversary-controlled input and needs a check. An audit pass over H5Cimage.c
    separating the two would cover this case, the :2537 parent-rank assert and the
    :2586-2613 ordering block together, rather than patching one line.

# ── Reproducers ──────────────────────────────────────────────────────────────
reproducers:
  direct_fixture: h5policy/tests/malformed/mdci_entry_lru_inconsistent.h5
  generator: "h5policy-gencorpus _make_mdci_entry_lru_inconsistent (single entry,
    IN_LRU clear, lru_rank 5, caching the real root OH body)"
  expectation: h5policy/tests/expected/malformed-mdci_entry_lru_inconsistent.yml
  integration_pocs:
    - "cases/mdci_reconstruct_fd_parent_uaf_dos/input.h5 -- entry 0 has lru_rank
       2816 with IN_LRU clear, i.e. the same shape at a wilder value. See the open
       question below before treating that file as evidence FOR this invariant."
  asserts_on_repro: >-
    Run h5dump -H from the candidate build against
    h5policy/tests/malformed/mdci_entry_lru_inconsistent.h5, with that build's lib
    directory on LD_LIBRARY_PATH. The candidate is an asserts-live build of the
    source tree named in `provenance.hdf5_build` below, configured RelWithDebInfo
    with -fsanitize=address; its install location is workstation-local and
    deliberately not recorded in this repo.

# ── Open items ───────────────────────────────────────────────────────────────
open_questions:
  - >-
    UNRESOLVED AND LOAD-BEARING: what does a Release build actually DO with the
    contradictory ranks? H5C__image_entry_cmp (H5Cimage.c:768-781) sorts entries
    by image_fd_height then lru_rank, so the ranks control insertion order into
    the reconstructed cache. No memory-safety consequence has been demonstrated
    from the LRU inconsistency ALONE, and this case does not claim one. Until that
    is settled the tolerance rests on the divergence (stock accepts, asserts-on
    aborts), which is sufficient for the harness but is not a vulnerability claim.
  - >-
    Do not conflate this with the NULL-deref teardown in the same family. h5dump
    on cases/mdci_reconstruct_fd_parent_uaf_dos/input.h5 segfaults with
    cache_ptr=0x0 in H5C__unpin_entry_real (H5Centry.c:175), via
    H5C_destroy_flush_dependency (:3995) <- H5C__prefetched_entry_notify
    (H5Cprefetched.c:244) <- H5C__flush_single_entry (:659) <- H5C_expunge_entry
    (:4107) <- H5C__reconstruct_cache_contents (H5Cimage.c:2657). That is an unwind
    of a partially built pinned dependency graph, driven by the dangling
    flush-dependency parent in that file, NOT by the LRU field. It carries both
    defects at once; the fixture here isolates only the LRU one, and the teardown
    itself is registry/cases/mdci-reconstruct-cleanup-unsafe.yml.
    CORRECTED 2026-08-15: an earlier revision of this item described the segfault
    as allocation-failure-driven, observed under `ulimit -v 2G` and "triggered by
    memory pressure". Remeasured and wrong on both counts -- the same SIGSEGV
    occurs uncapped, at under 10 MB RSS. The cap was incidental, not causal.
  - >-
    The encode side (H5Cimage.c:1463-1464, :1649, :1679) asserts the same relation
    when WRITING an image. Unmeasured whether a caller can drive the library into
    encoding a violating rank; if so the bug is bidirectional and the containment
    fix above is incomplete.
  - >-
    mdci.entry_lru_consistent is currently checked per entry. The stronger
    aggregate properties libhdf5 asserts at :2586-2613 -- no rank equal to 0,
    strict ordering, bounded holes -- are NOT modelled by h5policy. A file
    satisfying the per-entry relation while violating the ordering is presumed
    accepted by the oracle; no fixture built.

# ── How this was investigated ────────────────────────────────────────────────
method: >-
  Working backwards from the DoS specimen
  (cases/mdci_reconstruct_fd_parent_uaf_dos/input.h5) rather than forwards from
  the source: running it under h5dump produced a teardown backtrace, and reading
  H5Cimage.c to explain that backtrace surfaced the assert at :2813 as a separate,
  simpler defect in the same decoder.
  CORRECTED 2026-08-15: an earlier revision of this paragraph said that specimen
  OOM-killed the workstation through an uncapped h5dump at 13.7 GiB RSS, and that
  re-running it under `ulimit -v` was what made the backtrace observable.
  Remeasured and false -- the file peaks under 10 MB RSS before faulting, capped
  or uncapped, and does not amplify at all. The OOM belonged to an unrelated
  specimen held outside this repo.
  Splitting the two into independent fixtures -- one for the LRU relation, one for
  the dangling parent -- is what revealed the asymmetry that matters here: the
  parent case is a real check and agrees across builds, the LRU case is an assert
  and does not. The differential's invariant-A failure is therefore a property of
  libhdf5's guard style, not of the fixture or of h5policy.

provenance:
  found_by: "triage of the DoS specimen in
    cases/mdci_reconstruct_fd_parent_uaf_dos/; worked end to end 2026-08-14"
  hdf5_build: "HDF5 2.3.0 @e4b6a964723 (final_autotools_develop-607); baseline
    Release (NDEBUG, asserts off), candidate RelWithDebInfo -fsanitize=address
    with asserts live. Both are workstation-local installs; paths not recorded."
