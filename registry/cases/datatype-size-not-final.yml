# An attribute's raw-data extent is computed from a datatype size that a later
# H5T_set_loc rewrites.  Distinct from the compound-member-bounds cases: nothing
# here is out of bounds at decode time.  Every field decodes, every allocation is
# bounds-checked, and the H5Oattr.c:273 multiplication is overflow-checked.  The
# defect is that the size those checks were performed against is not final.
schema_version: 1

id: datatype-size-not-final
title: attribute data extent derives from a reference/vlen size that H5T_set_loc later rewrites
status: oracle-hardened   # h5policy rejects as of 2026-08-03; libhdf5 fix still planned
disclosure: >-
  n/a -- local analysis only.  Specimen from the hdf5-crashes corpus, entry 010,
  reported as an h5repack double free.  No advisory database was consulted and
  no identifier was looked up; the double free is a downstream symptom, not the
  defect.

record: datatypes
root_cause_classification: record_local
violated_invariant: datatype.reference_size, datatype.vlen_size
entry_points:
  - h5policy (oracle) -- untrusted-strict and forensic both ACCEPTED before the fix
  - "libhdf5 H5Aread -> H5VL_attr_read -> H5A__read (H5Aint.c:769)"
  - "shipped tools: h5dump -A, h5repack, h5copy.  h5ls -v decodes the wrong type
     without faulting; h5stat does not touch it."

# ── The defect, read out of the source tree (HDF5 2.3.0 @aa9df72cc21) ─────────
defect: >-
  For datatype class 7 (reference) and class 9 (variable-length) the on-disk
  element size is a property of the FILE, not of the message: H5T__ref_set_loc
  assigns H5F_SIZEOF_ADDR(f) for rtype 0 (H5Tref.c:256), H5HG_HEAP_ID_SIZE(f)
  for rtype 1 (:284) and a blob-id expression for rtypes 2/3/4 (:312), and
  H5T__vlen_set_loc assigns 4 + blob_id_size (H5Tvlen.c:300).  All four are
  unconditional; none consults the encoded size.  H5O__dtype_decode_helper's
  H5T_REFERENCE arm (H5Odtype.c:637-672) range-checks the reference TYPE but
  never the size, and defers the location decision entirely (:670).
  H5O__attr_decode meanwhile computes attr->shared->data_size as
  nelmts * H5T_get_size(dt) from the type AS DECODED (H5Oattr.c:266,273) and
  allocates exactly that (:286).  When the type is later attached to the file,
  H5T_set_loc's compound arm accumulates the difference into dt->shared->size
  (H5T.c:6990,7000) and H5A__read copies nelmts * the NEW size out of the OLD
  allocation (H5Aint.c:769).  H5A__write has the mirror-image code at :873, and
  H5T__complete_copy (H5T.c:4247-4320) carries an independently maintained copy
  of the same accum_change block.

boundary_note: >-
  Under-declaring over-reads by nelmts * (file_determined - encoded).
  OVER-declaring does not over-read -- accum_change goes negative, the element
  shrinks and members slide down -- but silently reinterprets the record, so the
  invariant is equality, not a lower bound.  Zero is already rejected twice
  (H5Odtype.c:507 and the 0 == old_size guard at H5T.c:6982) and values above
  the compound element size by the member-bounds guard (H5Odtype.c:509), both
  for unrelated reasons.  Those two guards are what bound the reachable band;
  neither is the invariant.

asymmetry: >-
  Datasets are NOT affected and the reason is structural, not luck.  A dataset's
  raw-data extent lives in the layout message, an independent record that the
  writer sized with the same file-determined value set_loc restores, so
  nelmts * post-fixup size always equals the allocation.  The disagreement is
  then visible to a validator -- h5policy already rejects the compact case with
  H5_CORRUPT_COMPACT_LAYOUT_SIZE_MISMATCH.  An attribute has no second record:
  data_size is COMPUTED FROM the field that changes, so the corrupted file is
  self-consistent by construction.  Making the datatype size final at decode
  time is the only available defence.

# ── Measured behaviour ───────────────────────────────────────────────────────
measured:
  fixtures: >-
    malformed/attr_reference_size_under.h5 and malformed/attr_vlen_size_under.h5,
    generated by h5policy-gencorpus and owned by
    h5policy/tests/expected/malformed-attr_{reference,vlen}_size_under.yml.  Both
    declare a 1-byte element against a file that dictates 8 (class 7) and 16
    (class 9).  The originating AFL specimen and its eleven variants are not in
    this repository.
  oracle_before: >-
    ACCEPTED the specimen and five of its variants, four of which are
    memory-unsafe.  Rejected only variant_zero_size (H5_CORRUPT_DATATYPE_ZERO_SIZE)
    and the three 0xFFFFFFxx variants (H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS),
    both for reasons unrelated to the invariant.
  oracle_after: >-
    rejects all six false accepts (H5_CORRUPT_DATATYPE_REFERENCE_SIZE /
    H5_CORRUPT_DATATYPE_VLEN_SIZE) while keeping both dataset controls accepted.
    Zero false positives across all 41 valid fixtures; zero primary-finding drift
    across all malformed fixtures plus resource/ and policy/.  Eleven unit cases
    in unit_datatype.pk (case 14) cover the arms directly.  The size checks are
    gated on global_sizeof_offsets != 0, since that global is unset until a
    superblock is decoded and the synthetic-blob unit harness validates datatype
    records in isolation; the reference TYPE check needs no gate, being
    self-contained in the message.
  libhdf5_stock: >-
    performs the over-read and does not fault.  h5dump -A completes with exit 0
    on both fixtures and PRINTS the out-of-bounds bytes: ten runs of the
    reference case give ten different values in the same slot from a
    byte-identical file.  h5repack turns the resulting library error into a
    double free at h5repack_refs.c:778/:780, because copy_refs_attr aliases
    refbuf to buf at :691 and only breaks the alias at :736, after every
    H5TOOLS_GOTO_ERROR that can jump to done:.
  libhdf5_asan: >-
    heap-buffer-overflow READ at H5A__read (H5Aint.c:769) out of the H5Oattr.c:286
    allocation -- size 8 on the reference fixture, size 16 on the vlen fixture.
    Identical frame via h5dump -A, h5repack and h5policy-probe.  Both corpus
    fixtures reproduce the fault; they are not canary-only rows.
  width: >-
    MEASURED at both widths, two independent ways (freestanding gcc -m32 witness
    of the guard chain, and a real 32-bit HDF5 2.3.0 install from the same source
    commit).  The core over-read is width-independent.  32-bit readers face a
    STRICTLY LARGER band: H5Odtype.c:509 adds offset + encoded_size in unchecked
    size_t, so declared sizes near SIZE_MAX wrap past the member-bounds guard.
    One variant is rejected by 64-bit libhdf5 and decoded by 32-bit libhdf5 into
    a 32-byte element with a 48-byte over-read.  h5policy's member-bounds check
    is exact 64-bit arithmetic and rejects both wrapping variants at either
    width.

# ── Containment vs systemic remediation (strategy doc §11.5) ─────────────────
containment:
  status: planned
  description: >-
    libhdf5: in H5O__dtype_decode_helper, reject an encoded element size that is
    not the file's on-disk size for classes 7 and 9.  Backportable and cannot
    reject a libhdf5-written file, which always encodes the file-determined
    width.  The decoder does not hold H5F_t on every path, so the size may have
    to be passed in -- that is the one part requiring judgement.
    h5repack (independent, worth fixing on its own): break the refbuf/buf alias
    before any error path can reach done:.
systemic:
  semantic_boundary: the complete datatype record
  status: planned
  description: >-
    RawDatatype -> ValidatedDatatype must carry a FINAL size.  A class whose
    on-disk width is a function of the file resolves that width during
    validation; a decoded size that disagrees is a validation failure, not
    something a later set_loc repairs.  H5T_set_loc's accum_change block then
    becomes a pure memory/disk transform with no ability to change a disk-side
    size, and attr->shared->data_size derives from something already final.
    Must cover H5T__complete_copy (H5T.c:4247) too; a patch touching only
    H5T_set_loc leaves that path open.

# ── Open items ───────────────────────────────────────────────────────────────
open_questions:
  - >-
    Revised references (rtype 2/3/4): the disk size is MAX(sizeof_offsets + 10,
    encode_size), so only a lower bound is safely checkable.  Is the MAX's second
    arm ever larger in practice, and can an exact rule be stated?  No fixture
    built -- h5py against libhdf5 1.14.5 does not write these without extra work.
  - >-
    Dense (fractal-heap) attributes go through the same H5O__attr_decode and are
    expected affected.  No fixture built.
  - >-
    Array-of-reference (class 10): H5T_set_loc's array arm rescales
    nelem * parent_size (H5T.c:6939).  Expected affected, unmeasured.
  - >-
    Contiguous dataset storage size is still not cross-checked against
    nelmts * datatype_size the way compact is.  The contiguous control now
    rejects, but on the datatype size, not on the layout disagreement, so the
    layout-level gap is untouched.  Not a memory-safety gap -- libhdf5 does not
    fault -- but an inconsistency between two neighbouring checks.

# ── How this was investigated ────────────────────────────────────────────────
method: >-
  The specimen's reported symptom (a double free in a tool) was not the defect.
  What located it was following the SIZE rather than the crash: h5ls -v printed
  a 21-byte struct where the file encodes 16, which is only possible if
  something rewrote the size after decoding.  From there the question became
  "who else derived a number from the pre-rewrite size?", which is the attribute
  data extent and nothing else.  The dataset controls were built specifically to
  test that framing, and their NOT faulting is what turns the story from "a
  reference bug" into "a record with no independent witness of its own extent".
