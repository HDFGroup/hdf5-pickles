# A name message (0x0D) of declared size 0 makes H5O__name_decode compute
# p_size - 1 == SIZE_MAX and hand that to H5MM_strndup, which scans forward out
# of the object-header chunk image until it finds a NUL.  The bytes it finds are
# RETURNED to the caller as the object's comment, so this is a disclosure
# primitive reachable from `h5dump -H` with no special VFD and no API misuse.
#
# h5policy already rejected this shape -- H5_CORRUPT_NAME_MESSAGE_EMPTY has
# existed with the correct rationale -- but the malformed side had no corpus
# fixture: a pickle-level unit assertion and a valid/ non-false-reject control
# were the whole coverage.  This record adds the fixture and documents the
# libhdf5 defect it diverges from.
#
# PROVENANCE.  This sink was described to us in an external report received
# 2026-11-09, reviewed locally on that date.  That material is deliberately not
# identified here -- a third party's own numbering is not authoritative in this
# repository, the same reason advisory identifiers are excluded -- and nothing
# in this record rests on it: every claim below was re-derived from the source
# tree and re-measured locally.  It was static only, with no dynamic witness
# claimed.  Its suggested guard (reject p_size < 2) is sound.  Its account of
# the reach is not: it presented the Java binding as the notable entry point,
# where the measurement below shows plain `h5dump -H` and `h5ls -v` reaching the
# decode directly, with no binding and no API misuse involved.
schema_version: 1

id: name-message-zero-size-strndup-underflow
title: a zero-size name message underflows p_size - 1 to SIZE_MAX in
  H5O__name_decode, and libhdf5 returns the out-of-bounds bytes it scans as the
  object's comment
status: contained                # h5policy rejects; libhdf5 unfixed on develop
disclosure: >-
  n/a -- local analysis only.  No advisory database was consulted, no advisory
  text was retrieved, and no identifier was looked up.  The external report that
  overlaps this record was supplied by the user as a local file.

# -- Triage -------------------------------------------------------------------
record: message_envelope
versions: [1, 2]                 # object header version; the message carries none
root_cause_classification: local_decode
violated_invariant:
  - envelope.name_nonempty
validation_closure: >-
  the object-header message envelope alone: a 0x0D message's declared size is
  read from the same header prefix the walk already decodes, and a size of 0 is
  rejected before the payload is interpreted.
activation_before_validation:
  - native_construction          # H5Oget_comment-family, reached by h5dump -H
entry_points:
  - "h5policy (oracle) -- reject_corrupt, H5_CORRUPT_NAME_MESSAGE_EMPTY (h5policy/pickles/h5_dispatch.pk:248)"
  - "libhdf5 tools: h5dump -H and h5ls -v -> H5O_msg_read -> H5O_msg_read_oh (src/H5Omessage.c:489) -> H5O__name_decode"
  - "libhdf5 API: H5Oget_comment / H5Oget_comment_by_name; also H5O_debug (src/H5Odbg.c:480), which h5debug reaches"

# -- The defect, read out of the source tree (HDF5 2.3.0, develop 91f1dccfc74) -
defect: >-
  H5O__name_decode (src/H5Oname.c:89):
      mesg->s = H5MM_strndup((const char *)p, p_size - 1)
  is the ONLY `p_size - 1` site in src/ that feeds a LENGTH rather than
  computing a p_end pointer.  The ~30 siblings that write
  `const uint8_t *p_end = p + p_size - 1` are safe by accident: with p_size == 0
  their p_end underflows to p - 1, and H5_IS_BUFFER_OVERFLOW's
  `((ptr) > (buffer_end))` arm then rejects any nonzero-size read.
  The zero-size message is admitted because H5_IS_BUFFER_OVERFLOW
  (src/H5private.h:344-348) short-circuits on `((size) != 0)`, so the
  per-message bounds check at src/H5Ocache.c:1319 passes trivially; 0 also
  satisfies the alignment test `mesg_size != H5O_ALIGN_OH(oh, mesg_size)` at
  :1280, and the chunk loop is byte-driven rather than count-driven.  Nothing
  enforces a per-message-type minimum size.
boundary_note: >-
  The read terminates at the first NUL it finds, so the distance is bounded by
  heap content, not by anything attacker-controlled.  Treat this as disclosure
  plus a potential unmapped-page fault, not as a controlled-length over-read.

# -- Measurement --------------------------------------------------------------
measured:
  libhdf5_version: 2.3.0          # develop 91f1dccfc74, 2026-11-07
  fixtures: >-
    malformed/name_message_empty.h5, generated by h5policy-gencorpus from a
    group with an object comment written through h5py.h5o.set_comment at
    earliest libver (a v1 object header, so no checksum needs repairing), with
    valid/object_comment.h5 as the paired non-false-reject control.
  oracle: >-
    h5policy rejects reject_corrupt with H5_CORRUPT_NAME_MESSAGE_EMPTY and
    accepts the control.  The check predates this record; what did not exist was
    a malformed corpus fixture -- h5policy/tests/unit_datatype.pk:838 exercised
    it at the pickle level and nothing drove a real file through end to end.
  libhdf5_stock: >-
    ACCEPTS the file.  h5dump -H exits 0, h5ls -v exits 0, and h5py opens and
    lists it.  On a hand-built specimen of the same shape the stock build
    PRINTED a leaked byte as the comment value -- COMMENT "1", a byte present
    nowhere in the file.  On the tracked fixture the bytes past the allocation
    happened to begin with a NUL and h5dump printed no COMMENT line.  The
    disclosure is real; the visible content is heap-layout dependent and the
    fixture deliberately does not assert it.
  libhdf5_asan: >-
    heap-buffer-overflow READ in the strndup interceptor, with
    H5MM_strndup (src/H5MM.c:176) <- H5O__name_decode (src/H5Oname.c:89) on the
    frame below it; 0 bytes after the H5FL_blk_malloc chunk image allocated in
    H5O__chunk_deserialize (src/H5Ocache.c:1220).  Measured through three
    independent reaches: h5dump -H, h5ls -v, and h5debug (H5O_debug).
  width: >-
    UNMEASURED at 32 bits.  The underflow is in size_t, so the sentinel differs
    by width (0xffffffff vs 0xffffffffffffffff) but the behaviour does not:
    strndup scans to the first NUL either way, and neither value is a reachable
    length.  Width-independent by construction; recorded as inferred.
  canary: >-
    MEASURED `unexercised`: the message_envelope canary opens the file and walks
    objects (H5Ovisit3), which does not read object comments, so the canary does
    not reach the decode.  The probe's own outcome is `accepted`, which matches
    libhdf5 and diverges from h5policy -- so require_oracle_alignment is
    deliberately absent and the divergence is tracked in
    registry/h5policy-diff-tolerances.yml instead.

containment:
  h5policy: closed_in_bounded_path
  libhdf5: >-
    OUTSTANDING on develop.  Minimal fix: reject p_size == 0 in
    H5O__name_decode before the strndup, which is a one-line guard.  The deeper
    fix is a per-message-type minimum size in H5O__chunk_deserialize, since
    H5_IS_BUFFER_OVERFLOW's zero short-circuit means EVERY decoder is entered
    with a possibly-empty payload and only the p_end idiom saves the others.
    No compatibility risk: libhdf5's own writer never emits a zero-size name
    message -- the encoder always writes at least the terminating NUL.

systemic:
  semantic_boundary: >-
    an object-header message's declared size validated against the minimum its
    own type can decode, before the type's decoder is entered.
  status: closed_in_bounded_path
  owner: h5policy (bounded decoder); libhdf5 decoder still open
  landed_changes:
    - tools/h5policy-gencorpus (_make_name_message_empty, _v1_ohdr_chunks)
    - h5policy/tests/expected/malformed-name_message_empty.yml
    - registry/validation-coverage.yml (envelope.name_nonempty fixture rows)
    - registry/h5policy-diff-tolerances.yml

open_questions:
  - >-
    The zero short-circuit in H5_IS_BUFFER_OVERFLOW is global.  Only H5Oname.c
    was shown to be unsafe under it; the other decoders were argued safe from
    the p_end idiom rather than measured one by one.
  - >-
    32-bit behaviour is inferred rather than measured; see measured.width.

method: >-
  Derived from the external report's static claim, then measured locally against
  develop 91f1dccfc74.  The decisive step was the FIXTURE REGIME: the first
  specimen left the name message where libhdf5 had written it, so strndup found
  a NUL still inside the chunk image, nothing was read out of bounds, and the
  stock build printed an empty comment -- a fixture that would have passed the
  suite while testing nothing.  Moving the 0x0D header to the last 8 bytes of
  its chunk, so the body offset equals the chunk size, is what makes the scan
  start outside the allocation; the generator asserts that placement rather than
  assuming it.
