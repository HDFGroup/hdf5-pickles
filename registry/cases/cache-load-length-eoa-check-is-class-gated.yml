    repaired.
  input_sha256: 27ca938d13af57cbb95d67e93c93b9cf6015220944efcab244f2b2b6a97dd4dd
  input_note: >-
    2485 bytes, declared EOA 2088.  BASE FILE NOT RECOVERED -- no local corpus
