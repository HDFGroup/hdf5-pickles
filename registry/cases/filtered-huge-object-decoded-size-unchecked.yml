open_questions:
  - >-
    Is the expected output extent of every BUILT-IN filter computable from its
    client data?  The proposed invariant is decidable only for those that are.
    Scale-offset is (the specimen's 65536 elements are declared in cd_values),
    and n-bit is likely similar given the existing cd_values guards, but
    deflate and szip are not -- their output size is genuinely unknown without
    running them.  The invariant must therefore be per-filter and must fall back
    to the existing advisory, not to a corrupt finding, wherever it cannot
    decide.  Getting this wrong in the permissive direction loses the check;
    getting it wrong in the strict direction rejects valid deflate files.
  - >-
    Does the same gap exist when the huge object feeds something other than a
    shared message?  The crash here lands in H5O__shared_decode's 128-byte stack
    buffer, and the stack destination is what makes it a stack overflow; other
    callers of H5HF_read would give a different primitive from the same defect.

