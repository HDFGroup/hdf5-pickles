# A WRITE-path defect, unlike most records here.  Nothing in the file is
# decoded incorrectly: libhdf5 produced it, every field is self-consistent, and
# every read of it succeeds.  The defect is that the writer sized the message
# from one length and encoded it from another, so the object that reaches the
# file is longer than the message inside it -- and the difference is never
# written.
schema_version: 1

id: soft-link-value-length-narrowed-on-write
title: H5O__link_encode narrows a soft/UD link value length to uint16_t after H5O__link_size reserved the full length
status: oracle-hardened   # h5policy rejects as of 2026-11-06; libhdf5 unfixed
disclosure: >-
  embargoed -- an external private repository advisory covering this defect was
  opened upstream on 2026-11-05 and is in Triage.  Its identifier is
  deliberately not recorded here.  All evidence below is local; nothing was
  fetched or published.

record: dense_index
root_cause_classification: local_decode
violated_invariant: dense.link_message_extent
entry_points:
  - h5policy (oracle) -- returned unsupported_coverage_gap before the huge-object
    index walk existed, so no invariant in this family was ever applied
  - "libhdf5 H5Lcreate_soft -> H5L__create_soft -> H5G_obj_insert ->
     H5G__dense_insert (src/H5Gdense.c)"
  - "libhdf5 H5Lcreate_ud / H5Lcreate_external -- the same narrowing via
     lnk->u.ud.size"
  - "shipped tools: h5ls and h5dump read the truncated link without complaint;
     h5dump reports an internal error only when the stored length lands on zero"

# ── The defect, read out of the source tree (HDF5 develop @c9fcf527, 2026-11-06)
defect: >-
  H5O__link_size (src/H5Olink.c) reserves message space from the full string
  length -- `ret_value += 2 + strlen(lnk->u.soft.name)` -- while
  H5O__link_encode stores `len = (uint16_t)strlen(lnk->u.soft.name)` at
  H5Olink.c:373 with no range test.  `len` is declared uint64_t, so the cast is
  the only truncation.  The user-defined arm has the same shape
  (`len = (uint16_t)lnk->u.ud.size`), which is how external links inherit it.
  The link NAME length is handled correctly by contrast: both functions select a
  1/2/4/8-byte width from the same uint64_t value.  Only the soft-link VALUE and
  the user-defined udata use a hard-wired two-byte field, and only they are
  unchecked.
  For L = strlen(target): L <= 65535 is correct; L % 65536 == 0 stores a zero
  length, which H5O__link_decode then refuses ("invalid link length"); any other
  residue stores a DIFFERENT, shorter target silently.  H5Lcreate_soft returns
  success in every case.
  `assert(len > 0)` at H5Olink.c:374 aborts any build without -DNDEBUG when the
  stored length lands on zero -- reachable from the public API with no malformed
  input at all.

boundary_note: >-
  A link message over H5G_FHEAP_MAX_MAN_SIZE (4096, src/H5Gdense.c) cannot live
  in an object header, so the group converts to dense storage and the message is
  written by H5G__dense_insert.  That function sizes a wrapped buffer with
  H5O_msg_raw_size (the FULL length), fills it with H5O_msg_encode (the
  TRUNCATED prefix), and hands H5HF_insert the FULL length -- so the
  reserved-but-unwritten remainder is copied into the fractal heap.  H5WB_actual
  obtains that buffer from H5FL_blk_malloc, which does not zero it.  The three
  object-header chunk-image allocators (H5Oalloc.c:903, H5Ocopy.c:569,
  H5Oint.c:500) all use H5FL_BLK_CALLOC and H5O__alloc_extend_chunk memsets its
  extension, so the compact path does not disclose; the dense path has no such
  zeroing.

asymmetry: >-
  The file is self-consistent by construction, which is why no read-side field
  can show the defect.  The stored value length agrees with the bytes that
  follow it, the target it describes is intact, and the name index's hash still
  matches the name.  The ONLY witness is the container: a fractal-heap object is
  stored at exactly the size H5O_msg_raw_size returned, so a link message that
  decodes short leaves bytes no reader will ever look at.  That is deliberately
  not checked for an object-header link message, where a version-1 header pads
  messages to an eight-byte boundary and leftover bytes are normal.

# ── Measured behaviour ───────────────────────────────────────────────────────
measured:
  fixtures: >-
    malformed/dense_link_heap_object_slack.h5, generated by h5policy-gencorpus
    from valid/dense_links_huge.h5 and owned by
    h5policy/tests/expected/malformed-dense_link_heap_object_slack.yml.  It is
    byte-patched to a 100-byte shortfall rather than built at 65536: the defect
    is the DISAGREEMENT between a message and its container, not the size of it,
    and a 64 KB fixture walks far more slowly for no extra coverage.  The
    original public-API specimens are not in this repository.
  oracle_before: >-
    unsupported_coverage_gap under every profile, at the link-info message --
    "dense link storage uses an unsupported fractal-heap/B-tree layout" when the
    heap had no managed blocks, "dense link name index uses a non-managed
    fractal-heap ID" when it had.  A refusal, so not a false accept, but it meant
    this family's invariants were never applied to a group holding one long link.
  oracle_after: >-
    rejects with H5_CORRUPT_LINK_MESSAGE_TRAILING_BYTES.  Measured on the
    public-API specimens: a 65537-byte target rejects, a 65536-byte target
    rejects, a 65535-byte target still accepts, and the user-defined-link
    sibling at udata 65536 rejects.  Both new valid fixtures accept with zero
    findings, and the 387 pre-existing corpus cases are unchanged (390/390).
    NON-VACUOUS, proved by reverting one fix at a time: with the tail-slack rule
    alone disabled and the huge-object index walk left in place, the guard
    fixture is ACCEPTED with zero findings.
  libhdf5_stock: >-
    OPENS the file and follows the link.  On the guard fixture the shortened
    target resolves to a decoy group the writer creates on purpose, so h5ls
    reports the link's target length as 4100 where the base fixture reports
    4200 -- silent substitution, exit 0, no diagnostic.  On the public-API
    specimens a 65537-byte target is persisted as "/" and a 65536-byte one
    yields a link H5Lget_info2 cannot read at all.  Measured identically on the
    x86-64 Release, x86-64 ASan and i386 Release builds of 2.3.0: the cast is to
    a fixed-width type, so the behaviour is pointer-width independent.
  libhdf5_asan: >-
    reports NOTHING, and that is the point.  The unwritten tail is allocated but
    never initialised, which AddressSanitizer does not model; MemorySanitizer
    would, and no MSan libhdf5 exists here (unmeasured).  Measured instead with
    an LD_PRELOAD that fills every large malloc with 0xAA: the number of
    never-written bytes reaching the file is exactly L - (L % 65536) --
    3,997,696 bytes at a 4,000,000-byte target, caller-controlled and unbounded.
    Separately, a first link whose 65535-byte target carried a marker left 4,095
    copies of that marker in a SECOND file written in the same process.  An
    asserts-live build aborts instead (H5Olink.c:374, exit 134).
  width: >-
    MEASURED at both widths against real 2.3.0 installs (x86-64 and a -m32
    build, settings_sha256 c5c4d5580c7740cf908b6ac488a93b33fa922cf947f2e5670b85ddf1c7f3e1c9).
    Identical results at every target length tested.

# ── Containment vs systemic remediation (strategy doc §11.5) ─────────────────
containment:
  status: planned
  description: >-
    libhdf5: compute the value length in size_t/uint64_t and reject anything
    above 65535 in H5L__create_soft and H5L__create_ud, BEFORE H5O__link_size
    reserves space, returning an ordinary API error with the file unchanged.  A
    check placed in H5O__link_encode is too late: the space is already reserved
    and the group may already have been converted to dense storage.
    Independently, H5G__dense_insert should not hand H5HF_insert bytes
    H5O_msg_encode did not write -- zeroing the wrapped buffer removes the
    disclosure even if a future format revision widens the field.
systemic:
  semantic_boundary: the link message value length -- the single place where the
    in-memory length and the two-byte on-disk field must be reconciled
  status: linked-followup
  description: >-
    The encoder and the sizer read the same string through two different types.
    Either they share one width decision, or the message is versioned so the
    field can hold what the sizer reserved.  Widening the existing field in
    place would silently change what every current reader decodes.

# ── Open items ───────────────────────────────────────────────────────────────
open_questions:
  - >-
    Dense ATTRIBUTE heaps hold huge objects by the same mechanism (a long
    attribute name or value crosses H5A_FHEAP_MAX_MAN_SIZE), but h5policy does
    not yet walk their huge-object index, so those records remain an explicit
    coverage refusal.  No fixture built.
  - >-
    Directly addressed huge IDs (v2 B-tree record types 2-4) are unreachable
    from a dense client, whose heap ID is seven bytes -- too narrow for a direct
    locator.  Declined rather than guessed at; a client that asks for a wider ID
    would need them.
  - >-
    External links truncate through the same udata path, and their value is
    `flags || file name || object name`, so a truncation landing inside the file
    name leaves a VALID, shorter path -- a link that would resolve to a
    different file.  Inferred from the layout; no working redirection built.
  - >-
    Whether arbitrary application heap (as opposed to libhdf5's own recycled
    buffers) can be steered into the disclosed region.  Attempted at six pool
    sizes from 64 KiB to 1 MiB and NOT achieved -- a measured negative, not a
    proof of impossibility.

# ── How this was investigated ────────────────────────────────────────────────
method: >-
  The upstream report framed this as integrity-only and cited sanitizer silence
  as evidence of no memory-safety impact.  Both were true and both were
  misleading.  What changed the picture was asking where the reserved-but-
  unwritten bytes GO, rather than what the decoded message says: a malloc
  poisoner answered that exactly, and a backtrace in the same hook showed the
  disclosing site was H5G__dense_insert and not the object header everyone was
  looking at.  The oracle gap fell out of the same question -- a 64 KB link
  message is necessarily a fractal-heap HUGE object, which is the one dense
  layout h5policy had never walked.
