    not traced.  If it does, object copy of a malformed VDS is a second route
    to the cleanup primitive.
  - >-
    Is there any VDS mapping shape whose minimum encoded size is zero?  The
    containment's headline check divides the payload byte count by a minimum
    per-mapping cost, which is only sound if that minimum is provably non-zero.
