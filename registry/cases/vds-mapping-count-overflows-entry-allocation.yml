# A VDS mapping count is multiplied by the entry struct size with no overflow
# check, so an impossible count wraps to a small allocation that the decode
# loop then writes past -- and the failure cleanup walks the same impossible
# count over that wrapped buffer, freeing pointers out of it.
#
# Promoted from one working bundle (gitignored h5cve scratch; the specimen is
# identified by provenance.input_sha256 below).
#
# An earlier revision of this record also claimed the tracked registry falsely
# reports libhdf5 as enforcing this family, and that it shared an "aggregation
# bug" with registry/cases/external-link-value-strlen-unbounded.yml.  Both
# claims were WRONG and are retracted -- see registry_reading_note.
schema_version: 1

id: vds-mapping-count-overflows-entry-allocation
title: the VDS mapping count is multiplied into an entry allocation unchecked,
  wrapping size_t, and the failure cleanup then iterates the unwrapped count
  over the wrapped buffer
status: oracle-hardened          # h5policy rejects under every profile; libhdf5 unfixed
disclosure: >-
  n/a -- local analysis only.  No advisory database was consulted, no advisory
  text was retrieved, and no identifier was looked up.  The bundle's supplied
  file name is provenance, not a root-cause classification, and is not
  reproduced as a claim here.

# -- Triage -------------------------------------------------------------------
record: virtual_dataset
versions: [4]                    # layout message v4; VDS global-heap mapping block v0
root_cause_classification: record_local
violated_invariant:
  - vds.mapping_header_complete
validation_closure: >-
  the v4 layout message, its referenced global-heap object, the mapping header
  and count, the bounded sequence of source-name/selection records, and the
  payload checksum.  The count must be representable, affordable,
  allocation-safe, and consistent with the bounded payload before any native
  VDS entry is constructed.
activation_before_validation:
  - native_construction
  - allocation
entry_points:
  - h5policy (oracle) -- untrusted-strict, forensic, legacy and trusted-fast all reject
  - "libhdf5 H5Fopen -> H5Ovisit3 -> H5Dopen2 -> H5D__layout_oh_read -> H5D__virtual_init -> H5D__virtual_load_layout"
  - "shipped tools: stock h5dump -pH aborts while materialising the mapping"
  - h5policy-probe --exercise virtual_dataset

# -- The defect, read out of the source tree (HDF5 2.3.0) ---------------------
defect: >-
  Three separate arithmetic failures inside fifteen lines of
  H5D__virtual_load_layout (src/H5Dvirtual.c:704-725).
  The count is decoded from the file as a 64-bit length:
    H5F_DECODE_LENGTH(f, heap_block_p, tmp_hsize);            /* :707 */
  It is then narrowed and multiplied, both unchecked:
    if (tmp_hsize > 0) {
        layout->storage.u.virt.list = H5MM_calloc(
            (size_t)tmp_hsize * sizeof(H5O_storage_virtual_ent_t));  /* :711-712 */
    }
    layout->storage.u.virt.list_nalloc = (size_t)tmp_hsize;   /* :720 */
    layout->storage.u.virt.list_nused  = (size_t)tmp_hsize;   /* :721 */
  (1) NO OVERFLOW CHECK ON THE PRODUCT.  sizeof(H5O_storage_virtual_ent_t) is
  352 on this platform, and the specimen's count of 471649706430073763
  multiplied by 352 wraps size_t to 32.  H5MM_calloc(32) succeeds, so the
  allocation failure branch is never taken.
  (2) NO CHECK ON THE NARROWING.  `(size_t)tmp_hsize` casts a 64-bit hsize_t
  with no H5_CHECK_OVERFLOW, which is what makes the 32-bit case a different
  defect rather than the same one -- see measured.width.
  Both omissions are conspicuous because the codebase has the tool and uses it
  in this very function: H5_CHECK_OVERFLOW guards tmp_hsize at :776 and
  list_nused at :580.  It is simply absent at :711.
  (3) NO COUNT/PAYLOAD CONSISTENCY CHECK.  list_nused is set from the count
  with nothing comparing it to the bounded heap block that must contain the
  mappings.  The loop then indexes straight into the wrapped allocation:
    for (size_t i = 0; i < layout->storage.u.virt.list_nused; i++) {  /* :724 */
        H5O_storage_virtual_ent_t *ent = &layout->storage.u.virt.list[i];  /* :725 */
  The loop does bound the PAYLOAD per iteration (avail_buffer_space <= 0 at
  :729-732), but that never saves it: entry 0 alone is 352 bytes against a
  32-byte allocation, so the first field written through `ent` is already out
  of bounds.  The measured ASan report is a WRITE of size 8 at
  H5D_VIRTUAL_FIND_OR_ADD_NAME (:795), on the first iteration.

cleanup_amplification: >-
  The more serious half, and it is NOT what the bundle recorded.
  On failure H5D__virtual_load_layout runs:
    done:
        heap_block = (uint8_t *)H5MM_xfree(heap_block);
        if (ret_value < 0)
            if (H5D__virtual_free_layout_mappings(&layout->storage.u.virt) < 0)   /* :932-935 */
  and that function iterates the SAME unwrapped count over the wrapped buffer:
    for (i = 0; i < virt->list_nused; i++) {                  /* :1187 */
        H5O_storage_virtual_ent_t *ent = &virt->list[i];      /* :1188 */
        ...
        if (ent->source_file_orig == SIZE_MAX)
            (void)H5MM_xfree(ent->source_file_name);          /* :1195 */
  So a failed decode calls H5MM_xfree on pointer-sized values read from beyond
  a 32-byte allocation, up to 471649706430073763 times.  That is a free of
  attacker-adjacent heap contents, a stronger primitive than the over-write.
  Its own documentation states the precondition the wrap destroys.
  H5D__virtual_free_layout_mappings is introduced (:1160-1164) as "safe to use
  on incomplete structures (for recovery from failure) PROVIDED the internal
  structures are initialized with all bytes set to 0".  H5MM_calloc zeroed only
  the wrapped 32 bytes while list_nused claims 4.7e17 entries, so the
  precondition is violated by construction -- the cleanup is documented safe
  under an assumption the defect itself breaks.
  This is the same structural shape as
  registry/cases/mdci-reconstruct-cleanup-unsafe.yml: a failure-recovery path
  that assumes an invariant the failure has already broken.
  REACHABILITY IS NOW OBSERVED (2026-09-01), and the recipe this field used to
  propose was WRONG.  Superseded text and correction below; the mechanism above
  stands.
  It remains true that the measured specimen dies at :795 on the first entry
  write and never reaches the cleanup.  What was wrong was the proposed fix for
  that: `variant_count_2pow61` (2^61 * 352 wraps to ZERO) cannot reach the
  cleanup either, because a zero-size allocation faults on entry 0's own write
  exactly as the specimen does.  Measured: ASan reports the WRITE at :795, 30
  bytes after a 2-byte region.  A product of zero is the one wrap that
  guarantees you never get out of the decode loop.
  THE CORRECT RECIPE.  The product must be at least one entry wide, so entry 0
  decodes and the ordinary payload bound is what fails.  On a 64-bit build
  sizeof(H5O_storage_virtual_ent_t) is 352 == 2**5 * 11, so
  `count * 352 mod 2**64` depends only on `count mod 2**59`: writing
  `count = k * 2**59 + m` gives a product of exactly `m * 352` bytes while
  list_nused stays astronomically large.
  TRACKED FIXTURE: cve/vds_nentries_cleanup_overrun.h5, m == 2, count
  576460752303423490, product 704 bytes, list_nused 576460752303423490.
  MEASURED ON IT, both builds: stock SIGSEGV inside H5D_close, reached from
  H5D__virtual_reset_source_dset (:1491) <- H5D__virtual_free_layout_mappings
  (:1190) <- the done: block (:934).  ASan: heap-buffer-overflow READ of size 8
  at :1490, 40 bytes after the 704-byte region.
  AND THE PRIMITIVE IS SHARPER THAN THIS FIELD SAYS.  The first thing to fault
  is not a free: it is H5D_close called on a value read out of bounds -- an
  UNTRUSTED POINTER DEREFERENCE.  And the value is FILE-CONTROLLED, not merely
  garbage: on the tracked fixture it is 0x656372756f735f73, whose bytes in memory
  order are "s_source" -- a substring of the base's own VDS source name
  "/private/tmp/h5policy/vds_source_outside.h5", i.e. attacker-supplied string
  bytes from the file being parsed, sitting in the heap next to the wrapped
  allocation.  (On a differently-shaped variant the same slot held 0x211, which
  is allocator metadata, so what lands there depends on the surrounding
  allocations -- but it is reachable by file content.)  Two
  further amplifiers in the same loop body were not previously noted: the inner
  loop is bounded by the out-of-bounds `ent->sub_dset_nalloc`, and both
  H5MM_xfree calls are gated on out-of-bounds `== SIZE_MAX` comparisons, so
  adjacent heap decides whether a garbage pointer is freed at all.
  DOCUMENTATION DRIFT.  The comment this field quotes -- "safe to use on
  incomplete structures ... PROVIDED the internal structures are initialized
  with all bytes set to 0" -- has been reworded at HEAD to "we always attempt to
  free everything even in the case of a failure ... we do not need to zero out
  the memory in the list".  The stated precondition is gone; the dependence on
  H5MM_calloc having zeroed every entry the loop visits is not.

# -- Registry finding (not about libhdf5) -------------------------------------
registry_reading_note: >-
  CORRECTED 2026-08-15.  An earlier revision of this record, under the heading
  `registry_claim_contradicted`, asserted that the `hdf5: enforced` claim for
  virtual_dataset was WRONG and that the evidence generator had an aggregation
  bug because it computed `verdict: enforced` while its own `crashes_on` field
  named this fixture.  THAT WAS INCORRECT, and it is retracted here rather than
  quietly deleted.
  The separation is deliberate, documented, and right.  tools/h5cve writes into
  the generated file's own header:
      # verdict, over `reject_corrupt` specimens only ...
      #   enforced   every comparable specimen reaching the family surface is
      #              rejected by libhdf5
      # activation_observed and crashes_on are reported separately: a build
      # can enforce an invariant and still crash or activate reaching it.
  and the code carries the same rationale inline.  `verdict` answers one narrow
  question -- does libhdf5 AGREE the file must be rejected -- and libhdf5 does
  agree here; it aborts rather than accepting.  Whether it gets there safely is
  a different question, deliberately not folded in.
  That second question is already asked, and already answered correctly, by a
  different requirement: h5cve derives `no_activation_on_validation_failure`,
  which goes to `partial` when a rejecting fixture activates or crashes, with
  the message "a rejecting fixture still activates or crashes the build under
  test" and the offending fixtures listed.  So the system surfaces this
  specimen's crash in the right place; it simply is not the `verdict` field.
  WHAT A READER SHOULD TAKE FROM THE ROW: `validators.hdf5: enforced` means
  "libhdf5 rejects the comparable specimens", NOT "libhdf5 is memory-safe on
  this family".  Read it together with `crashes_on` and
  `no_activation_on_validation_failure`, which is what the row's own
  `# measured; see libhdf5-evidence.yml` comment points at.
  No change to validation-coverage.yml or libhdf5-evidence.yml is warranted,
  and none was made.

# -- Measured behaviour -------------------------------------------------------
measured:
  REMEASURED: >-
    2026-08-15, at HEAD.  NO DRIFT -- every value below held exactly.
    Oracle: reject_corrupt under all four profiles with
    H5_CORRUPT_VDS_MAPPING_HEADER @ 200 on /vds, walks complete.  Strict and
    forensic additionally report the H5_POLICY_VDS secondary @ 91; legacy and
    trusted-fast report the corrupt finding alone.  Both offsets are the
    bundle's.
    Probe: stock crashed with signal 6 -- the abort, confirmed live on an
    uninstrumented build at HEAD.  ASan crashed with signal 6 as well.
    Note this record's specimen is NOT the amplification case that needed the
    probe skipped; that is the driver-info length trigger, one record over.  A
    4 GiB cap is ample here and the crash is genuine rather than an allocation
    failure.
  oracle_as_recorded: >-
    reject_corrupt under all four profiles, H5_CORRUPT_VDS_MAPPING_HEADER
    @ 200 on /vds, with a secondary H5_POLICY_VDS @ 91 under untrusted-strict.
    Forensic completes the walk.  Truncation sweep exhaustive over 4265
    prefixes, zero violations.
  specimen_bytes: >-
    4264-byte file, superblock v2.  VDS layout message at 91 (layout version
    4); global heap at 168; mapping block at 200, 51 bytes, mapping version 0;
    the count field at 201 holds 471649706430073763; the VDS heap checksum at
    247 is resealed so nothing upstream rejects the block first.
  libhdf5_stock_as_recorded: >-
    CRASHED, signal 6 (abort).  No external, plugin, write or network
    activation.  h5dump -pH aborts while materialising the mapping.
    SCOPE CORRECTED 2026-09-01: this describes the SUPPLIED SPECIMEN (count
    471649706430073763, product 32), not the tracked fixture.  Running it
    directly also shows the abort's cause, which was not recorded -- glibc's
    "malloc(): corrupted top size", i.e. the write reaches heap metadata rather
    than tripping an assertion.
    THE TRACKED FIXTURE CRASHES DIFFERENTLY.  vds_nentries_mult_overflow.h5
    carries 2^61 (product 0), and both the h5cve matrix and a direct run report
    signal 11 (SIGSEGV), not 6.  Same defect, same write site (:795), different
    wrap size and so a different fault.  Read a signal number here together with
    WHICH file it was measured on.  The offsets @ 200 / @ 91 quoted under
    REMEASURED are likewise the specimen's; in the 6144-byte fixture the GCOL
    sits at 2048 and the mapping block at 2080.
  libhdf5_asan_as_recorded: >-
    CRASHED, signal 6, heap-buffer-overflow WRITE of size 8 at
    src/H5Dvirtual.c:795 -- the first entry's name field, written through a
    pointer into the 32-byte wrapped allocation.
  semantic_neighbours: >-
    Seven variants in the bundle (variants-matrix.json), built by
    build-variants.py, which changes ONLY the 8-byte count at offset 201 and
    reseals the VDS heap checksum at 247: count 0, 1 (valid), 2, 2^61,
    input-1, input+1, u64 max.  variant_count_2.h5 is the checksum-valid
    non-overflow control -- it reaches the same decoder and is rejected while
    parsing the missing second mapping, with no crash.  That control is what
    isolates the OVERFLOW as the necessary ingredient rather than merely an
    over-large count.
  width: >-
    BOTH WIDTHS NOW MEASURED (2026-09-01); the earlier "host policy blocked
    running the i386 binary" no longer holds on this host.
    sizeof(H5O_storage_virtual_ent_t) is 352 on x86_64 and 208 on i386.
    x86_64: the specimen's count wraps to 32 bytes -> WRITE at :795; stock
    aborts, and running it directly shows glibc's reason -- "malloc(): corrupted
    top size", i.e. the write reaches heap metadata rather than tripping an
    assertion.
    i386: the count first NARROWS to 3123612579 and its unchecked product wraps
    to 1171354736 bytes -- a large but plausible allocation.  MEASURED OUTCOME:
    SIGSEGV, a genuinely different failure mode from the x86_64 abort.
    AND THE TWO ABIS DISAGREE ABOUT WHICH FILES ARE REJECTED, not merely about
    how they fail.  The three counts crafted against the 64-bit wrap (2^61,
    2^59+2, 2^59+10) narrow to 0, 2 and 10 on i386 and are refused with an
    ordinary H5Dopen2 error and no crash.  That is the concrete form of the
    warning in compatibility_backport_risks: checked arithmetic must run BEFORE
    the narrowing.
    STRUCTURAL CONSEQUENCE, not an accident of these values: the cleanup
    amplification is 64-bit only.  Leaving list_nused huge on LP64 requires the
    low 59 bits of the count to be small, which forces the low 32 bits small
    too, so no single count can amplify on both ABIs.
    control: count 1 opens cleanly on both widths.

# -- Divergence from the selected build ---------------------------------------
divergence:
  oracle: reject_corrupt
  libhdf5: crashed (abort on Release, ASan overflow on the candidate)
  libhdf5_version: 2.3.0
  classification: agreement
  note: >-
    Both sides refuse the file, so there is no invariant-A disagreement and NO
    entry in registry/h5policy-diff-tolerances.yml is warranted or present.
    h5policy rejects the count by arithmetic on the mapping header, before any
    allocation; libhdf5 "rejects" it by aborting after allocating a wrapped
    buffer and writing past it.  The tracked fixture is refused by both sides
    and needs no exemption -- note its canary status is `violation`, since the
    crash is observable on the uninstrumented build.

# -- Containment vs systemic remediation --------------------------------------
containment:
  status: not_implemented        # libhdf5 side; not proposed upstream by this repo
  description: >-
    Three checks at src/H5Dvirtual.c:707-721, all before the H5MM_calloc.
    (1) Bound the decoded count against the bounded heap block: each mapping
    costs a non-zero minimum number of encoded bytes, so a count exceeding
    (payload bytes / minimum encoded mapping size) is impossible and can be
    rejected without any resource policy.  This is the check that makes the
    other two unreachable in practice, and it is the one h5policy uses.
    (2) H5_CHECK_OVERFLOW the narrowing of tmp_hsize to size_t, and use checked
    multiplication for the product -- the file already does both elsewhere in
    the same function (:580, :776).
    (3) Apply an explicit allocation budget.  VDS legitimately supports large
    mapping tables, so the bound must derive from the encoded byte count and a
    stated resource policy, NOT an arbitrary maximum count.
    SEPARATELY, and required even with all three: make
    H5D__virtual_free_layout_mappings safe when its documented precondition
    does not hold, or guarantee the precondition.  Setting list_nused only
    AFTER the allocation and the per-entry decode both succeed would do it;
    today it is set at :721 before any entry exists.  A fix that only rejects
    the count leaves the cleanup depending on an assumption nothing enforces.
systemic:
  semantic_boundary: >-
    the raw VDS global-heap mapping block as one object: count/payload
    consistency, checked width conversion, checked allocation arithmetic and an
    allocation budget, all established before any H5O_storage_virtual_ent_t is
    materialised.
  status: closed_in_bounded_path
  owner: h5policy (bounded decoder); libhdf5 decode and cleanup still open
  description: >-
    h5policy decodes the mapping block as inert bounded records and validates
    the collection before materialising anything, so neither the wrap nor the
    cleanup amplification can arise: no allocation is sized from the count, and
    there is no native entry list to unwind.  All four profiles reject.
    The remaining work is entirely libhdf5's.
  landed_changes:
    - h5policy/pickles/h5_vds.pk (h5policy_validate_vds_layout;
      vds.mapping_header_complete)
    - registry/findings/catalog (H5_CORRUPT_VDS_MAPPING_HEADER)
    - registry/validation-coverage.yml (vds.mapping_header_complete); on how to
      read its hdf5 validator row, see registry_reading_note
    - h5policy/tests/cve/vds_nentries_mult_overflow.h5 (generated tracked seed;
      product 0 -- the decode-loop write)
    - h5policy/tests/expected/cve-vds_nentries_mult_overflow.yml
    # -- added 2026-09-01, for the cleanup half --
    - h5policy/tools/h5policy-gencorpus (_make_vds_nentries_cleanup_overrun)
    - h5policy/tests/cve/vds_nentries_cleanup_overrun.h5 (generated tracked seed;
      product 704 -- the failure cleanup)
    - h5policy/tests/expected/cve-vds_nentries_cleanup_overrun.yml
    - registry/h5cve-matrix-policy.yml (fixture_overrides entry; the selected
      libhdf5 crashes in the cleanup, so the canary status is `violation`)

# -- Reproducers --------------------------------------------------------------
reproducers:
  integration_poc: h5policy/tests/cve/vds_nentries_mult_overflow.h5
  direct_fixtures:
    # RECONCILED 2026-09-01.  The superseded text claimed this fixture was
    # "byte-identical to the bundle's specimen" and that tests/cve/ is
    # "committed rather than generated ... needs no generator".  BOTH ARE NOW
    # FALSE, and the second was already becoming false when it was written.
    #   * tests/cve/ fixtures are GENERATED by h5policy-gencorpus and also
    #     tracked, and h5policy/tests/run.sh enforces byte-for-byte
    #     reproducibility against HEAD.  The .gitignore comment describes why
    #     they are tracked, not that they are hand-made.
    #   * vds_nentries_mult_overflow.h5 is produced by
    #     _make_vds_nentries_overflow from policy/vds_absolute_source.h5 and
    #     sets the count to 2^61 -- so it is 6144 bytes, superblock v3, GCOL at
    #     2048.  The supplied specimen is 4264 bytes, superblock v2, GCOL at
    #     168, count 471649706430073763.  220 bytes differ before the shorter
    #     file ends, and the two carry DIFFERENT wrap shapes: product 0 versus
    #     product 32.
    # provenance.input_sha256 identifies the SUPPLIED SPECIMEN and is correct as
    # such; it is not, and no longer claims to be, the tracked fixture's digest.
    # Both fixtures are generated, so both are reproducible without it.
    - h5policy/tests/cve/vds_nentries_mult_overflow.h5      # product 0 -> decode-loop write, :795
    - h5policy/tests/cve/vds_nentries_cleanup_overrun.h5    # product 704 -> failure cleanup, :1490
  expectations:
    - h5policy/tests/expected/cve-vds_nentries_mult_overflow.yml       # profile: legacy
    - h5policy/tests/expected/cve-vds_nentries_cleanup_overrun.yml     # profile: untrusted-strict
  control_fixture: >-
    h5policy/tests/malformed/vds_nentries_overcount.h5 -- an over-large but
    NON-overflowing count, which libhdf5 rejects cleanly while parsing the
    missing mapping.  This is the control that separates "count too big" from
    "count overflows the allocation", and it is why the evidence file lists it
    under enforced_on while the overflow specimen sits under crashes_on.
  variant_engine: >-
    build-variants.py in the bundle -- preserves input.h5 and changes only the
    8-byte count at offset 201, then reseals the VDS heap checksum at 247.
    Deterministic and self-contained; the source of the seven neighbours.
  assertions:
    stable_finding: true
    fails_before_materialization: false
    no_plugin_load: true
    no_decompression: true
    no_external_open: true
    no_user_callback: unverified
    no_legacy_fallback: unverified

backports: []          # nothing to backport in h5policy.

fuzz_seed: >-
  h5policy/tests/cve/vds_nentries_mult_overflow.h5 plus the seven neighbours
  seed the VDS mapping-count neighbourhood.  The count field is a clean
  single-field mutation axis with a resealed checksum, which makes it an
  unusually good target: the boundary is at (payload_bytes / min_mapping_bytes)
  on one side and at the size_t wrap points on the other.  A dedicated bounded
  raw-VDS fuzz target does not exist and is named in the bundle's own
  promotion steps.

compatibility_backport_risks: >-
  A pre-allocation count/payload guard rejects only impossible mapping headers
  -- a count that cannot fit in the bounded payload cannot describe a real
  file -- so no conforming VDS is affected.  The risk is in getting the bound
  from the right place: VDS intentionally supports large valid mapping tables,
  so an arbitrary maximum count would break legitimate files, and the limit
  must derive from the encoded byte count plus an explicit resource policy.
  Checked arithmetic must run BEFORE the 64-bit count is narrowed, or the
  32-bit and 64-bit builds disagree about which files are rejected.

sibling_audit: >-
  Within libhdf5: H5D__virtual_load_layout is the one attacker-controlled VDS
  global-heap mapping decoder at current head, and it is the one audited here.
  The writer, the copy path (H5D__virtual_copy_layout, whose own done: block at
  :1148 calls H5D__virtual_reset_layout) and the VDS tree helpers all multiply
  counts, but from TRUSTED native values -- they need the same checked
  -allocation discipline as hardening, not as defect fixes, and none was
  measured.  H5D__virtual_reset_layout is a second cleanup path with the same
  list_nused-driven shape and was not traced.
  Within h5policy: the mapping-header check covers the count.  Whether the
  same VDS layout arriving through an ATTRIBUTE rather than a dataset object
  header takes the same validated path is asserted from the shared
  implementation, not separately measured.

# -- Affected versions --------------------------------------------------------
version_range:
  affected: '>= 1.10.0'
  affected_for_the_cleanup_half: '>= 2.0.0'
  patched: none
  method: >-
    Archaeology run 2026-09-01.  THE TRAP that made the earlier "no archaeology
    was run" cheap to leave: the decoder MOVED FILE at 2.0.0, so a sweep of
    src/H5Dvirtual.c alone returns nothing for every older tag and reads as "the
    code is not there".  Locate it per tag with
    `git grep -l 'sizeof(H5O_storage_virtual_ent_t)' <tag> -- 'src/*.c'`, then
    read the allocation verbatim.  Done at 1_10_0, 1_12_3, 1.14.6, 2.0.0, 2.1.0
    and develop.
  finding: >-
    At 1.10.0, 1.12.3 and 1.14.6 the VDS heap block is decoded in
    src/H5Olayout.c (H5O__layout_decode), with the identical
    H5MM_calloc((size_t)tmp_hsize * sizeof(H5O_storage_virtual_ent_t)) and
    list_nalloc/list_nused assigned straight from the count -- at 1.10.0 without
    even the `tmp_hsize > 0` guard.  From 2.0.0 the same code is
    H5D__virtual_load_layout in src/H5Dvirtual.c.  So the unchecked
    narrow-and-multiply is present at every tag from 1.10.0, the release that
    introduced VDS, through develop.  Nothing is fixed at any tag.
  cleanup_half_note: >-
    H5D__virtual_free_layout_mappings first appears at 2.0.0 (it and
    H5_CHECK_OVERFLOW are absent from src/H5Dvirtual.c at every earlier tag), so
    the cleanup finding is claimed for >= 2.0.0 only.  What the pre-2.0.0 failure
    path did instead was NOT traced -- see coverage_gaps.
  note: >-
    The earlier inference recorded here -- that the H5_CHECK_OVERFLOW calls
    elsewhere in the same function suggest the guards were added piecemeal rather
    than the allocation site ever having had one -- is consistent with what the
    archaeology found: no tag has ever guarded the allocation.
  label: established

