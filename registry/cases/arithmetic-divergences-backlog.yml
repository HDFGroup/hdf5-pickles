# Three size-arithmetic divergences surfaced by the contract sweep and
# deliberately NOT yet investigated. Filed so they are a tracked queue rather
# than an unexplained allowance in the matrix policy.
#
# These are flagged as the highest-priority outstanding divergences because they
# are the only ones so far whose SHAPE is integer overflow / bounds arithmetic
# rather than an unverified checksum. Every genuine divergence found to date has
# been a corruption-detection gap with no memory-safety consequence; an
# arithmetic gap is the category where that could stop being true. That is a
# reason to look, not a claim that it is exploitable.
schema_version: 1

id: arithmetic-divergences-backlog
title: libhdf5 accepts three files whose size/bounds arithmetic h5policy rejects
status: partially-investigated     # 2 of 3 closed 2026-08-15; item 1 still open
disclosure: "n/a — not yet assessed"

# ── STATUS UPDATE 2026-08-15 ──────────────────────────────────────────────────
# Items 2 and 3 are CLOSED and are now recorded in
# registry/cases/compound-member-array-promotion-unguarded.yml.
#
# The answer to both questions is YES, with a measured consequence. The promoted
# member size is published through the public API — H5Tget_size on the member
# type returns 1125899906842624 — and it is READ at that extent by
# H5T__conv_struct_opt (src/H5Tconv_compound.c:868) during H5Dread, giving an
# ASan heap-buffer-overflow. The `caution` note below was right: these were not
# benign, and the two are ONE defect rather than two — a v1 compound member's
# embedded-array promotion is unguarded both in its arithmetic and in the
# ordering of the guards meant to bound it.
#
# Item 1 (chunk_size_uint32_wrap) remains genuinely uninvestigated.
# ──────────────────────────────────────────────────────────────────────────────

root_cause_classification: local_decode
entry_points:
  - h5policy (oracle)
  - "libhdf5 — accepts via h5dump, h5ls -r and h5py alike"

items:
  - fixture: h5policy/tests/malformed/chunk_size_uint32_wrap.h5
    record: dataset_layout_filter_fill
    invariant: layout.chunk_size_32bit
    oracle: reject_corrupt
    libhdf5: accepted
    question: >-
      The encoded chunk dimensions multiply to a byte size that wraps a
      uint32_t (H5O_layout_chunk_t.size). Does libhdf5 then allocate or read
      against the WRAPPED value while indexing against the unwrapped one?

  - fixture: h5policy/tests/malformed/compound_member_array_bounds.h5
    record: datatypes
    invariant: datatype.compound_member_bounds
    oracle: reject_corrupt
    libhdf5: accepted
    question: >-
      A compound member array extends past its parent datatype's size. Is the
      member ever read at its declared extent?
    status: CLOSED 2026-08-15
    answer: >-
      Yes. The guards at src/H5Odtype.c:507 and :509 test the BASE type and the
      embedded-array promotion at :542 replaces it with a larger one, so the
      bound never sees the value it is supposed to bound. The promoted member is
      then read by H5T__conv_struct_opt (src/H5Tconv_compound.c:868) on H5Dread
      -- ASan heap-buffer-overflow READ of size 8, witnessed by
      variant_off12_reachable.h5.
    closed_by: registry/cases/compound-member-array-promotion-unguarded.yml

  - fixture: h5policy/tests/malformed/compound_member_array_nelem_overflow.h5
    record: datatypes
    invariant: datatype.size_arithmetic
    oracle: reject_corrupt
    libhdf5: accepted
    question: >-
      The member array element count overflows. Same question as above, reached
      through the count rather than the bounds.
    status: CLOSED 2026-08-15
    answer: >-
      Yes, and it is the SAME defect as the item above rather than a second one.
      H5T__array_create (src/H5Tarray.c:158,:162) multiplies the count and the
      storage size with no overflow check, though the identical arithmetic IS
      guarded three ways for standalone arrays 300 lines away
      (src/H5Odtype.c:815-817, :835-838, :842-848). Width-dependent: the
      specimen's promoted size is 1125899906842624 on 64-bit and 0 on 32-bit,
      measured with a freestanding i386 witness. A zero-sized member additionally
      makes h5dump hang -- H5_term_library cannot converge.
    closed_by: registry/cases/compound-member-array-promotion-unguarded.yml

# ── How to investigate ────────────────────────────────────────────────────────
method: >-
  The pattern that worked for the SOHM and dense-attribute cases: find the path
  that actually USES the value, not just the one that decodes it, and run the
  valid base as a control so a null result is interpretable. Here that means
  reading the dataset/attribute and comparing the bytes returned against the
  bytes on disk -- acceptance alone proves nothing, since a value that is
  decoded but never used cannot hurt anyone.

caution: >-
  The matrix currently allows `violation` for all three so it stays green. That
  allowance is provisional and is the reason this file exists: it must not be
  read as a judgement that these are benign.
  VINDICATED 2026-08-15 for items 2 and 3: investigation found a measured
  heap-buffer-overflow READ, so the provisional allowance was carrying a real
  memory-safety defect. For those two the allowance is now justified on stated
  grounds rather than provisional -- see the closing record's `divergence`
  section, which also argues against converting it into a
  h5policy-diff-tolerances.yml entry.
  For item 1 the caution stands, unchanged and now with a precedent behind it.

provenance:
  found_by: "h5cve matrix — contract sweep over previously uncontracted fixtures"
