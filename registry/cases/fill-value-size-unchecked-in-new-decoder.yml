    outcome=crashed, "READ of size 1032", same six frames as the version-3
    fixture.  Both branches of the pair are measured on both builds, so nothing
    about either fixture's behaviour is inferred any more.
  - >-
    No 32-bit measurement on either specimen (see measured.width).
  - >-
    No semantic-neighbour variants for either specimen.  h5mutate has no
    fill-value recipe, so the N-1/N/N+1 boundary around the size field is
    untested; the version-3 bundle recorded zero generated variants for exactly
    this reason.
open_questions:
  - >-
    Does the version-2 branch leak identically to version 3, or does the
    smaller shortfall relative to allocation granularity change what is
    reachable?  8 bytes out of a 1032-byte copy leaves 1024 bytes of over-read,
    which is larger than the version-3 case, so the expectation is that it is
    at least as severe -- but this is unmeasured (see above).
  - >-
    Is the finalize-time placement of h5policy's check genuinely order-robust
    for the ATTRIBUTE path?  Attributes are validated with a throwaway context
    copy, and cross-message state that lives in per-object globals rather than
    the context does not reset the same way.  Fill values on attributes are
    listed as unaudited in sibling_audit; if that path is ever added, the
    globals-versus-context distinction has to be settled first.

