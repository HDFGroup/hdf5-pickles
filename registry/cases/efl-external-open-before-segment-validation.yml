# libhdf5 opens the file named by an external-file-list slot before it rejects
# that slot's wrapped segment extent.  Filed so it is a tracked queue entry
# rather than an unexplained allowance in the matrix policy -- the same
# convention as fsm-section-divergences.yml.
#
# HOW IT SURFACED, which is the useful part.  Nothing about libhdf5 changed.
# The exact-build canary's fallback selection was a single point at the ORIGIN,
# and on 2026-08-24 it moved to the last element (see
# registry/cases/chunk-dim-product-64bit-overflow.yml, whose defect the origin
# read could not witness either).  The origin element fell in a well-formed EFL
# slot; the last element falls in the wrapped one.  Same library, same fixture,
# different question asked.
schema_version: 1

id: efl-external-open-before-segment-validation
title: libhdf5 opens an external data file before rejecting the wrapped segment
  extent that names it
status: uninvestigated
disclosure: "n/a — not yet assessed"

record: external_file_list
root_cause_classification: premature_activation
entry_points:
  - h5policy (oracle) -- rejects, and opens nothing
  - "libhdf5 -- H5Dread of an element whose file-space offset falls in the malformed slot"

items:
  - fixture: h5policy/tests/malformed/overflowing_efl_segment.h5
    invariant: efl.no_external_open
    oracle: reject_corrupt
    libhdf5: rejected_in_traversal, after one external_open
    measured: >-
      h5policy-probe --exercise external_file_list reports activation
      external_open count 1, path "payload.raw", with outcome
      rejected_in_traversal.  Specific to this fixture: bad_efl_heap_address,
      bad_efl_name_empty, bad_efl_name_offset, bad_efl_slot_count and
      truncated_efl_slots all still report external_open 0, so this is the
      wrapped-extent path and not EFL handling in general.
    question: >-
      The slot's external offset plus its segment size wraps uint64, and the
      library opens the named file before establishing that.  Is anything READ
      or WRITTEN through that descriptor before the rejection, or is the open
      the whole of the activation?  An open alone is already an
      activation-before-validation gap -- it is attacker-directed filesystem
      access from a read-only traversal -- but the answer decides whether it is
      only that.

method: >-
  The pattern that worked for the compound-member and chunk-dimension cases:
  find the path that USES the descriptor, not just the one that opens it, and
  run a well-formed EFL fixture as a control so a null result is interpretable.
  An LD_PRELOAD interposer that logs read(2) on the opened descriptor, rather
  than just open(2), is the cheapest discriminator; the probe's own trace shim
  already wraps open and can be extended.

caution: >-
  The matrix allows `violation` for this fixture so it stays green.  That
  allowance is provisional and is the reason this file exists: it must not be
  read as a judgement that an open-then-reject is benign.  The comparable
  external-link case (external-link-value-strlen-unbounded.yml) turned out to
  matter.

provenance:
  found_by: >-
    the exact-build canary's fallback selection moving from the origin element
    to the last element, which is what made an offset-dependent defect visible
  h5policy_commit: "branch updates/20260821, developed against 71ffe55"
  libhdf5_source: {branch: develop, commit: 51b92ccee54ed3f14af3509c9ac5e4f3c82e58ce, version: 2.3.0}
