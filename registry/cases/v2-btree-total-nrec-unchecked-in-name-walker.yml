# A dense index's v2 B-tree total record count is never compared against the
# node graph in the NAME-index walker, only in the creation-order one.  Zeroing
# it makes every link or attribute in the index invisible, and h5policy accepts
# the file under all four profiles.
#
# FOUND BY the h5mutate `v2_btree` family on 2026-09-03, on the first batch of
# recipes written for it.  The recipe that found it is WITHDRAWN and recorded as
# `planned` rather than shipped: it produces three different outcomes across
# seeds, so it cannot promise one finding, which is what a typed recipe has to
# do.  The gap it exposed is this record.  See the "NOT A RECIPE (YET)" comment
# in h5policy/tools/h5mutate.
schema_version: 1

id: v2-btree-total-nrec-unchecked-in-name-walker
title: the v2 B-tree total record count is enforced only in the creation-order
  dense walker, and libhdf5 sizes its link table from that count while filling
  it from the real tree -- so a one-off in either direction is a memory-safety
  fault in every shipped tool, from a file the oracle accepts
status: oracle-hardened          # h5policy rejects as of 2026-09-03; libhdf5 unfixed
disclosure: >-
  n/a -- local analysis only.  No advisory database was consulted, no advisory
  text was retrieved, and no identifier was looked up.  Specimens were produced
  from tracked valid seeds by a scratch patcher and are not committed; their
  sha256s are given under `triggers`.

# -- Triage -------------------------------------------------------------------
record: dense_index
versions: [0]                    # v2 B-tree header version
root_cause_classification: aggregate_object
violated_invariant:
  - dense.btree_total_count
validation_closure: >-
  the v2 B-tree header together with the node graph it roots: the header's
  stored total record count against the count actually reached by walking from
  the root.  The header alone does not close it -- the stored value is only
  falsifiable once the walk has counted -- which is why the rule lives at the
  end of a walker rather than at header decode.
activation_before_validation: []  # nothing is activated; the file is accepted
entry_points:
  - h5policy (oracle) -- ACCEPTS under untrusted-strict, trusted-fast, legacy
    and forensic
  - "libhdf5 public API: H5Fopen -> H5Gget_info / H5Aget_num_attrs"
  - "shipped tools: h5dump -H and h5ls -r both exit 0 and list nothing"

# -- The gap ------------------------------------------------------------------
defect: >-
  h5policy states the rule once, and only for the creation-order index.
  h5policy/pickles/h5_dense_links.pk, in h5policy_dense_corder_*, compares the
  walked total against the stored one and emits
  H5_CORRUPT_V2_BTREE_TOTAL_COUNT on a mismatch.  The NAME-index walkers --
  the dense link name index and the dense attribute name index -- count records
  as they descend but never compare the result to the header field.  A single
  grep for the finding code returns exactly one emit site in the whole oracle,
  which is the shape of the defect: the rule is implemented, and it is
  implemented in one of the walkers that needs it.
  libhdf5 does not compare them either, but for libhdf5 this is ordinary
  laziness rather than a soundness claim: it reports what the count says.

# -- Measured -----------------------------------------------------------------
measured:
  date: 2026-09-03
  libhdf5: 2.3.0 (RelWithDebInfo, no sanitizers)
  oracle: h5policy at this tree
  links:
    specimen: patched from h5policy/tests/valid/dense_links.h5
    edit: BTHD@1942 client 5, total_nrec 40 -> 0, header checksum resealed
    h5policy: accept, zero findings, under all four profiles
    libhdf5: >-
      h5dump -H rc=0, h5ls -r rc=0, and h5py reports 0 children for /group
      against 40 in the base file.  No error, no warning, no crash.
  attributes:
    specimen: patched from h5policy/tests/valid/dense_attribute.h5
    edit: BTHD@1155 client 8, total_nrec 30 -> 0, header checksum resealed
    h5policy: accept, zero findings, under all four profiles
    libhdf5: >-
      h5py reports 0 attributes on dataset 'd' against 30 in the base file.
  # ---- ADDED 2026-09-03, and it REVERSES this record's first reading -------
  # The version committed earlier today said "NOT memory-unsafe ... the
  # consequence is that metadata disappears".  That was measured only on the
  # ZERO value, where it is true, and the record's own coverage_gaps flagged
  # the inflated direction as the more interesting half and unmeasured.  It was
  # then measured, and the zero case turns out to be the ONE benign value: it
  # is benign precisely because a table of size zero is never allocated.
  off_by_one_either_direction:
    mechanism_measured: >-
      libhdf5 sizes the link table from the stored count and fills it by
      walking the real tree, so the two disagree by exactly the amount of the
      edit.  Established behaviourally: the fault follows the edited value in
      both directions, on a group holding 40 real links.
    over_stated: >-
      total_nrec 41 (n+1): the table has one slot the walk never fills, and
      H5MM_calloc leaves its `name` NULL.  H5G__link_sort_table then qsorts the
      whole table and H5G__link_cmp_name_inc dereferences that NULL.
      MEASURED on stock 2.3.0: h5dump -H and h5ls -r both SIGSEGV (rc=139).
      Under the ASan build: SEGV on address 0x0 in strcmp, from
      H5G__link_cmp_name_inc (src/H5Glink.c:93) <- H5G__link_sort_table
      (H5Glink.c:468) <- H5G__dense_build_table (H5Gdense.c:782).  No
      heap-buffer-overflow is reported on this direction.
    under_stated: >-
      total_nrec 39 (n-1): the walk produces more callbacks than the table has
      slots, and H5G__dense_build_table_cb copies each into
      ltable->lnks[curr_lnk] with the bound stated as an ASSERT ONLY --
      `assert(udata->curr_lnk < udata->ltable->nlinks)` at src/H5Gdense.c:717,
      compiled out of every Release build.  MEASURED on stock 2.3.0: h5dump
      aborts (rc=134), the glibc signature for detected heap corruption, i.e.
      an out-of-bounds heap WRITE rather than a read.
    zero: >-
      the benign value, and only by accident: `if (ltable->nlinks > 0)` skips
      the allocation and the walk entirely, so the group reports 0 links with
      no fault.
    very_large: >-
      total_nrec 2**32 does NOT crash (h5dump rc=1, h5ls rc=0) and h5py raises
      OverflowError.  A different path catches the extreme while n+1 walks
      straight off the end -- the usual shape, and the reason a boundary sweep
      is worth more than one large value.
    sweep: >-
      41, 45, 64, 100, 256, 1000 and 65536 all SIGSEGV both tools; 39 aborts;
      0 is clean; 2**32 is refused.  h5policy ACCEPTS every one of them.
  width: 64-bit only; no 32-bit measurement

# -- Why the neighbouring seeds behave differently ----------------------------
# Worth recording because it is what made the gap non-obvious: the same edit is
# REJECTED on three of the five seeds it was tried on, each time by a different
# rule that happens to be nearby.
seed_split:
  - seeds: [valid/dense_links.h5, valid/dense_attribute.h5]
    outcome: accepted -- the gap
  - seeds: [valid/dense_links_corder.h5, valid/dense_attribute_corder.h5]
    outcome: >-
      rejected as H5_CORRUPT_DENSE_INDEX_COUNT_MISMATCH.  These files carry a
      creation-order index alongside the name index, and the link-info count
      cross-check catches the edit before the missing total-count rule matters.
      The rejection is incidental to this invariant.
  - seeds: [valid/chunk_v2_btree.h5]
    outcome: >-
      rejected as H5_CORRUPT_V2_BTREE_ROOT_COUNT.  A different field's rule in
      the chunk walker, not this one.

triggers:
  - sha256: db76c44bfcf24908b6be6a95e0d20b1eb51807fb2ef869010f8c977f3985d87c
    what: dense-link name index, total_nrec 40 -> 0 (accepted; 0 links reported)
  - sha256: e17b944eebef30b66d0a1a6ce609c4d3b796db55d046729112837eea94db8a1e
    what: dense-attribute name index, total_nrec 30 -> 0 (accepted; 0 attrs)
  - sha256: 0f19c1faae28310481f5427a3b0180a45dfc440334a3345e4d8917926884c662
    what: dense-link name index, total_nrec 40 -> 41; stock SIGSEGV, NULL-name
      deref in the sort comparator
  - sha256: 01a049d37ec76cf8fea87fe4b046cc851fc24fbf6473535d27b351497198f724
    what: dense-link name index, total_nrec 40 -> 39; stock SIGABRT, heap
      corruption from the assert-only write bound

# -- What closing it takes ----------------------------------------------------
containment_done_2026_09_03: >-
  ORACLE SIDE, LANDED.  Both dense NAME walkers now compare their walked record
  count against the header's stored total and emit
  H5_CORRUPT_V2_BTREE_TOTAL_COUNT.  Implemented as a module accumulator
  (h5policy_dense_name_walk_total / _valid in h5_dense_links.pk, shared by
  h5_dense_attrs.pk) rather than as a return value, because the two walkers
  return different things and threading a second result through either would
  change every recursive call -- and a shared-walker refactor was tried and
  reverted once already for closure-allocation cost.  The `_valid` flag is the
  sentinel the creation-order walker spells 0xffffffffffffffffUL: any path that
  abandons a subtree leaves the total short, and comparing a short total would
  be a false positive on a file whose real defect caused the bail.  Eight bail
  paths are marked in the link walker and six in the attribute one.
  Regression cover: malformed/dense_link_btree_total_nrec.h5 (n+1, the SIGSEGV
  direction) is tracked, and h5mutate carries all three values as recipes
  (bt2_total_nrec_zero / _plus_one / _minus_one) verified on eleven
  dense-bearing seeds.
  LIBHDF5 SIDE, STILL OPEN.  The assert at src/H5Gdense.c:717 is the write
  bound and needs to be a real error return, and H5G__dense_build_table needs
  to refuse a table whose fill count does not match its size before handing it
  to the sort.  Now that the provenance question is answered, the fix has only
  one end to attach to: there is no second count to reconcile against, so the
  comparison has to be walk-count against table-size at the end of
  H5G__dense_build_table.  Not attempted here -- that is an upstream change to
  a different tree.

superseded_containment: >-
  ORACLE SIDE, and this is the part that is ready to do: compare the walked
  record count against the stored total at the end of the dense LINK name and
  dense ATTRIBUTE name walkers, exactly as h5policy_dense_corder_* already
  does, and emit H5_CORRUPT_V2_BTREE_TOTAL_COUNT.  Both walkers already carry a
  running count, so this is a comparison at the end of an existing loop, not
  new traversal.  Once both emit it, the withdrawn h5mutate recipe
  `bt2_total_nrec_zero` promises one finding on the name seeds and can move to
  `built` -- and it should gain n+1 and n-1 siblings, since the boundary sweep
  shows those are the memory-unsafe values and zero is the benign one.
  LIBHDF5 SIDE: the assert at src/H5Gdense.c:717 is the write bound and needs
  to be a real error return, and H5G__dense_build_table needs to refuse a table
  whose fill count does not match its size before handing it to the sort.  Do
  not draft that patch until the field-provenance question under coverage_gaps
  is answered -- fixing the wrong end of a two-field disagreement is how a
  guard ends up inert.

coverage_gaps:
  - >-
    RESOLVED 2026-09-03 -- see off_by_one_either_direction.  This item read
    "the INFLATED direction is unmeasured ... do that before treating this
    record as complete", and doing it reversed the record's severity.
  - >-
    RESOLVED 2026-09-03.  This item asked which field libhdf5 sizes the table
    from, since the table is sized from `linfo->nlinks` yet the fault tracks the
    B-tree header.  They are the SAME NUMBER: H5O__linfo_decode sets
    `linfo->nlinks = HSIZET_MAX` unconditionally (src/H5Olinfo.c, "so we query
    it later"), so the link-info message stores no count at all, and
    H5G__obj_get_linfo then fills it from H5B2_get_nrec ->
    `bt2->hdr->root.all_nrec` (src/H5Gobj.c:317-331).  There is no second copy
    to cross-check against, which is why the comment at src/H5Gobj.c:330 --
    "(should be same # of records in all indices)" -- is the whole of libhdf5's
    assurance here.
  - >-
    No 32-bit measurement.
  - >-
    RESOLVED 2026-09-03 (second pass).  The CHUNK v2 B-tree (clients 10/11)
    carried the same missing comparison and it is now closed, along with the
    SOHM one.  What the measurement showed first: on valid/chunk_v2_btree.h5 the
    edit was already caught as H5_CORRUPT_V2_BTREE_ROOT_COUNT, on
    valid/chunk_v2_btree_deep.h5 it was ACCEPTED, and libhdf5 shows NO
    consequence either way -- h5dump -d reads the dataset at rc=0 for n+1, n-1
    and the base alike, so a chunk index's total count is not load-bearing for
    reads.  The ROOT CAUSE of the split was a DEPTH GATE, not a missing rule:
    both the chunk and SOHM callers compared total_nrec against the root count
    but only under `depth == 0`, so a leaf-root tree was checked and a deep one
    was not.  Fixed in the SHARED engine (h5policy_walk_v2_btree_node in
    h5_btree2.pk), which accumulates the walked total behind the same
    abandoned-subtree sentinel the dense walkers use, with each caller comparing
    afterwards and emitting its own family's code -- so one change closed both
    clients.  The h5mutate total_nrec recipes stay restricted to the dense name
    clients even so: the chunk walker emits ROOT_COUNT where the dense one emits
    TOTAL_COUNT, so a single recipe still cannot promise one finding across
    both.  The huge-object trees are still untried.
  - >-
    Whether any shipped tool does something worse than under-reporting -- for
    instance a repack that writes the truncated index back, making the loss
    permanent -- is unmeasured.
