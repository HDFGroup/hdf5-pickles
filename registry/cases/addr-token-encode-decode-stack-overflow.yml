  h5policy_commit: "branch updates/20260903, at 954882254293"
  libhdf5_source: {branch: patch/20260903, commit: b5865e78549a, version: 2.3.0}
  baseline_build: {version: 2.3.0, build_mode: RelWithDebInfo, sanitizers: []}
  asan_build: {build_mode: RelWithDebInfo, sanitizers: [address], ndebug: true}  # workstation-local install; path not recorded
  input_note: >-
