# Two metadata-cache-image entries claim the same file address. Every envelope
# field is well formed -- correct image_data_len, a valid Jenkins trailing
# checksum, and per-entry headers that pass the flag/dependency and extent
# checks -- so the only defect is the repeated address. libhdf5 keys
# reconstructed entries by address (H5C__check_for_duplicates, H5Cimage.c) and
# fails reconstruction on the repeat, unwinding a pinned flush-dependency graph
# through a double-free/NULL-deref cleanup. h5policy must reject the duplicate in
# the entry loop, before the replay pass and before any native state exists.
# The libhdf5 cleanup defect this isolates is recorded in
# registry/cases/mdci-reconstruct-cleanup-unsafe.yml (duplicate-address trigger).
# No diff tolerance: libhdf5 rejects this fixture too, so the two sides agree.
file: malformed/mdci_duplicate_entry_address.h5
profile: legacy
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_MDCI_DUPLICATE_ENTRY_ADDRESS]
h5cve:
  family: cache_image_dependency_graph
  require_oracle_alignment: true
  allowed_statuses: [unexercised, violation]
verification:
  # Two image entries claiming one file address: the same target reached
  # twice, with every envelope field well formed.
  reference_semantics_cases: [duplicate_reference]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
