# A datatype header spliced to class REFERENCE with a bad encode version.
# h5policy-fuzz found this by writing "GCOL" over a compound datatype header.
#
# WHAT LIBHDF5 REFUSES HERE IS THE ENCODE-VERSION NIBBLE, not the datatype
# message version, and the distinction cost a real false positive. The splice
# yields class 7, message version 4, reference SUB-TYPE 3 with encode version 4 --
# and libhdf5 requires that nibble to equal H5R_ENCODE_VERSION (1), rejecting
# with "reference version does not match". The message version 4 is perfectly
# ordinary: H5T_STD_REF is version 4 by construction
# (H5T_INIT_TYPE_REF_COMMON, src/H5T.c:425).
#
# h5policy used to carry `ctype == 7 && version != 1 -> corrupt`, which pinned
# this fixture for the wrong reason and rejected EVERY modern reference file as a
# side effect -- measured: a plain dataset of H5T_STD_REF object references
# written by the 2.3.0 library came back reject_corrupt while h5dump read it with
# rc=0. The gate is gone; libhdf5 imposes no class-7 version constraint
# (H5Odtype.c:637). This fixture still rejects, now on the two rules that
# describe what is actually wrong with it.
#
# The size finding rides along because the spliced element size is 8, below the
# sizeof_offsets + 10 minimum a revised reference needs.
file: malformed/bad_reference_datatype_version.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DATATYPE_REFERENCE_VERSION, H5_CORRUPT_DATATYPE_REFERENCE_SIZE]
forbidden_findings: [H5_CORRUPT_UNSUPPORTED_DATATYPE_VERSION]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: datatypes
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
