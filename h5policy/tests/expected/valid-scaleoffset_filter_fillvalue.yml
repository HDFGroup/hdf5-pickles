# The scale-offset control WITH an explicit fill value (10x10 i4, chunks 5x5,
# fillvalue -7).  Structurally valid, so h5policy accepts with the decode-filter
# advisory.
#
# One of the two accepting shapes of layout.filter_fill_availability, pinned so
# the rule cannot drift into rejecting either.  Here cd_values[7] == 1 and the
# object header carries an explicit fill value -- they agree.  Its partner
# valid/scaleoffset_filter.h5 has cd_values[7] == 1 and NO explicit value, which
# is equally conforming because H5P_fill_value_defined() reports DEFAULT as well
# as USER_DEFINED and the writer stores 1 for both.  That second shape is the
# false positive the asymmetric rule exists to avoid, and it is what libhdf5
# writes by default, so the control is not hypothetical.
#
# The third conforming shape, an explicitly UNDEFINED fill value (cd_values[7]
# == 0 with no value bytes), is also accepted but has no fixture: h5py has no
# binding for H5Pset_fill_value with a NULL value.  It was measured with a C
# reproducer instead.
file: valid/scaleoffset_filter_fillvalue.h5
profile: untrusted-strict
expected_decision: accept_with_warnings
expected_exit: 1
required_findings: [H5_ADVISORY_DECODE_FILTER]
forbidden: [crash, timeout, external_open, plugin_load, write]
