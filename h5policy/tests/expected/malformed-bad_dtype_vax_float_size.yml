# A VAX-ordered float (class flags bits 0 and 6, datatype version 3) whose
# declared size, 9, is not a multiple of 4.
#
# libhdf5 converts VAX data by reversing its 16-bit words four bytes at a time
# (H5Tconv_float.c: H5T__conv_f_f_loop and H5T__conv_f_i_loop, plus the two
# H5T__conv_complex_f_matched sites) and guards the size only with
# assert(0 == tsize % 2), which NDEBUG removes.  Neither the decoder, nor
# H5Tset_size/H5Tset_order, nor the conversion INIT step checks it.  At
# size % 4 == 1 the last swap iteration reads s[size] and reads and writes
# s[(size_t)-1]: one byte past the element, and one byte before it.
#
# libhdf5 ACCEPTS this file: opening it converts nothing.  The datatype canary
# reads through the native type, which reaches the loop.  Measured on 2.3.0
# (develop): the stock build aborts with SIGABRT (glibc heap check) and the ASan
# build reports a heap-buffer-overflow in H5T__conv_f_f_loop.  h5policy rejects
# the size at the datatype message, before any conversion.
#
# Built by h5policy-gencorpus through the public API, then one patch: the
# datatype version nibble 1 -> 3.  libhdf5 writes an API-built VAX type as a
# version-1 message, which a reader decodes as big-endian (bit 6 means VAX only
# from version 3 on).  The earliest bound keeps a version-1 object header, so
# there is no checksum to repair.
file: malformed/bad_dtype_vax_float_size.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DATATYPE_VAX_FLOAT_SIZE]
forbidden_findings:
  - H5_CORRUPT_DATATYPE_FLOAT_BYTE_ORDER
  - H5_CORRUPT_DATATYPE_UNUSED_BITS
expected_finding_evidence:
  H5_CORRUPT_DATATYPE_VAX_FLOAT_SIZE:
    field: datatype.float_byte_order
    actual: 9
    expected: 4
    comparison: multiple_of
expected_finding_evidence_locations:
  H5_CORRUPT_DATATYPE_VAX_FLOAT_SIZE:
    - role: actual
      length: 4
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: datatypes
  require_oracle_alignment: true
  allowed_statuses: [unexercised, violation]
forbidden: [crash, timeout, external_open, plugin_load, write]
