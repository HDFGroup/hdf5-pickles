# The same unchecked-`need` wrap as resource-gheap_need_wrap_zero.yml, one
# size_t width down: the object declares 2**32-16, so
#
#   need = H5HG_SIZEOF_OBJHDR(f) + H5HG_ALIGN(obj[idx].size)      (:353)
#
# is zero only where size_t is 32 bits.  A 64-bit reader computes 2**32, larger
# than the 4096-byte collection, so it rejects the bytes cleanly instead of
# looping.
#
# Where that was measured: not on THIS file, which is orphaned and therefore
# never loaded by libhdf5 at all.  The measurement is from a reachable carrier of
# the same three lengths -- a vlen-attribute file whose data references the
# collection -- on which both 2.3.0 builds returned 63 clean H5E_OVERFLOWs for
# 2**32-16 and failed to terminate for 2**64-16.  Read the reach of this fixture
# and the reach of that measurement separately; the sentinel fixture carries the
# same split.
#
# THIS FIXTURE IS THE WIDTH TEST.  h5policy's own arithmetic is uint<64>, which
# reproduces an LP64 reader exactly, so before h5policy_gcol_advance modelled
# both widths this file was ACCEPTED under every profile: the sweep saw a large
# `need`, took its "overruns collection: libhdf5 errors, not loops" early return,
# and said nothing -- while a 32-bit reader would not terminate.  A 64-bit-only
# progress check passes gheap_need_wrap_zero and fails this one, which is the
# whole point of keeping both.
#
# Evidence status differs from its sibling and the difference is deliberate: the
# 32-bit ARITHMETIC is measured (the same four operations compiled and executed
# at -m32), while the 32-bit LIBRARY consequence is source-derived, because no
# 32-bit libhdf5 was available.  The LP64 half is measured, as above.  Closing
# the gap needs a 32-bit build, not more analysis.
#
# The check is gated on a collection a 32-bit reader could hold at all
# (csize <= 2**32-1): above that the chunk allocation fails first, and without
# the gate a genuinely huge collection whose index-0 extent happened to be a
# multiple of 2**32 would be flagged for a reader that could never load it.
#
# Nothing references the collection, so only the forensic profile's GCOL
# signature sweep finds it.  Built by h5policy-gencorpus.
file: resource/gheap_need_wrap_zero_ilp32.h5
profile: forensic
expected_decision: reject_resource
expected_exit: 4
required_findings: [H5_RESOURCE_GLOBAL_HEAP_INFINITE_LOOP]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: heap_structures
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
