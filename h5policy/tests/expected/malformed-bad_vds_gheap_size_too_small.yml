# A VDS global heap declaring a collection smaller than H5HG_MINSIZE.
#
# A global heap is the one structure a read-only open normally never loads --
# it is reached through global-heap IDs in vlen/reference *data*, which this
# metadata-only oracle does not decode.  A virtual dataset is the exception:
# its source list lives in a global heap object that H5Dopen reads, so the
# collection walker is on the reachable graph and invariant A' applies to it.
#
# H5HG__hdr_deserialize refuses any collection below 4096 bytes before it parses
# a single object; 4096 is also the metadata cache's speculative first read, so
# a smaller collection could not have been loaded in one go anyway.  h5policy
# bounded the size only by the 16-byte header, so every collection between 16
# bytes and 4 KiB passed.
#
# The declared size is dropped by 8 rather than to something tiny: it stays
# 8-aligned and still inside the file, so the minimum is the only rule broken.
#
# Reported under untrusted-strict alongside the profile's blanket VDS denial.
# That denial is exactly why the gap survived: the default profile rejects every
# VDS file for policy reasons, so the differential never exercised the structural
# path.  Under a VDS-permitting profile h5policy accepted this file outright.
file: malformed/bad_vds_gheap_size_too_small.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_GLOBAL_HEAP_HEADER]
expected_finding_evidence:
  H5_CORRUPT_GLOBAL_HEAP_HEADER:
    field: vds.global_heap_collection_size
    actual: 4088
    expected: 4096
    comparison: at_least
expected_finding_evidence_locations:
  H5_CORRUPT_GLOBAL_HEAP_HEADER:
    - role: actual
      length: 8
      little_endian_value: 4088
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: virtual_dataset
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
