# The false-positive guard for the two gheap_need_wrap_zero fixtures, and the
# reason the GCOL sweep returns silently on an overrun at all.
#
# The object declares SIZE_MAX-23 -- ONE BELOW the eight-value window
# [SIZE_MAX-22, SIZE_MAX-15] in which
# `need = H5HG_SIZEOF_OBJHDR(f) + H5HG_ALIGN(size)` wraps to zero.  So `need`
# comes out huge instead of zero, the collection overruns, and libhdf5's bounds
# check at src/H5HGcache.c:363 rejects it with a clean H5E_OVERFLOW.  Measured on
# a reachable carrier of the same length -- 63 clean error returns on both 2.3.0
# builds, no hang, no sanitizer report.  THIS file is orphaned, so libhdf5 opens
# it and never loads the collection at all; that is why `accept` is right here for
# two independent reasons, and the sweep's verdict is the one being tested.
#
# The value is one step from a fixture that legitimately rejects, which is exactly
# what makes it worth keeping: it pins the boundary of the progress check rather
# than its middle.  The 32-bit model must also stay quiet -- 0xFFFFFFE8 aligns to
# itself and 16 + that is 0xFFFFFFF8, not zero.
#
# Built by h5policy-gencorpus from the same generator as its two siblings, with
# only the declared length changed.
file: resource/gheap_need_wrap_below.h5
profile: forensic
expected_decision: accept
expected_exit: 0
required_findings: []
forbidden_findings: [H5_RESOURCE_GLOBAL_HEAP_INFINITE_LOOP]
expected_mapping_mode: non_strict
h5cve:
  family: heap_structures
  allowed_statuses: [unexercised]
verification:
  # SIZE_MAX-23, one step below the eight-value window in which `need` wraps to
  # zero -- the false-positive control that pins the window's lower edge.
  count_and_extent_boundaries: [n_minus_1]
forbidden: [crash, timeout, external_open, plugin_load, write]
