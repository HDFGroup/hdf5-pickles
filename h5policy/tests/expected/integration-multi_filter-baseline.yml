# The shared count-boundary fixture is ordinary valid HDF5: four allocated
# chunks and a two-stage shuffle+gzip pipeline.  Only gzip's normal metadata-
# only decode advisory prevents an unconditional accept.
file: integration/multi_filter_dataset.h5
profile: untrusted-strict
expected_decision: accept_with_warnings
expected_exit: 1
required_findings: [H5_ADVISORY_DECODE_FILTER]
h5cve:
  family: dataset_layout_filter_fill
  # The bounded H5Dread through the shuffle+gzip stack completes on the
  # selected build, so this valid fixture verifies the dataset-layout
  # activation path as well as its metadata checks.  `unexercised` stays
  # permitted because reaching that path costs more than decoding metadata:
  # a build whose external filter set lacks DEFLATE cannot finish the read,
  # and the exercise then reports not having run rather than having failed.
  # integration-chunk_count.yml and integration-filter_count.yml measure this
  # same fixture through the same dataset_layout exercise, so all three see
  # one status -- narrowing only this one makes it the only expectation that
  # fails on a build the other two accept.
  allowed_statuses: [unexercised, verified]
forbidden_findings:
  - H5_RESOURCE_CHUNK_COUNT
  - H5_RESOURCE_FILTER_COUNT
expected_metrics:
  chunk_index_refs: 4
expected_features:
  decode_filters: [1]
forbidden: [crash, timeout, external_open, plugin_load, write]
