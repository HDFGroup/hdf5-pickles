# The same doubling-table relation violated by two bits instead of one: 9
# declared heap-size bits against an 11-bit first row.
#
# max_root_rows now WRAPS rather than reaching zero, so this is the 32 GiB
# allocation shape reached without a non-power-of-two width -- measured at
# 34359738360 bytes with a malloc interposer.  It shares its oracle rule and
# finding with malformed/dense_link_frhp_no_root_rows.h5 and differs in what
# libhdf5 does with it, which is why both are tracked.
#
# Keep the differential harness's address-space cap in place when running this
# corpus: uncapped, a host that grants the reservation goes on to write the
# arrays.
file: malformed/dense_link_frhp_first_row_overflow.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FRACTAL_HEAP_DOUBLING_TABLE]
h5cve:
  family: dense_index
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
