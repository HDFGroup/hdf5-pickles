# A scale-offset filter descriptor claiming big-endian for a little-endian
# datatype: cd_values[6] (H5Z_SCALEOFFSET_PARM_ORDER) patched 0 -> 1.
#
# THE PARAMETER IS A COPY, AND THE ORIGINAL IS STILL IN THE HEADER.  libhdf5
# writes cd_values[6] from H5T_get_order() of this dataset's own datatype
# (H5Zscaleoffset.c:1035, :1039).  On read it compares the word only against
# H5T_native_order_g, to decide whether to byte-swap (:1128, :1133) -- never
# against the datatype message that produced it.  So the two can disagree, and
# nothing in the library notices.  That is what makes this decidable without
# decoding a byte of data, and what makes it a strict tightening: a conforming
# file cannot exhibit the disagreement.
#
# libhdf5: OPENS AND READS, rc=0, WRONG VALUES.  Measured on the multi-filter
# specimen this rule came from -- a f8 dataset whose 42 values came back as
# 1.19453e+103, -4.60704e-30, -8.21912e+68 ... with h5dump exiting 0.  There is
# no crash and AddressSanitizer is clean; the allowed_statuses `verified` below
# is therefore correct and expected, not a contradiction: libhdf5 completes the
# exercise precisely because it accepts the corruption.  Same signature as
# malformed/chunk_data_over_metadata.h5.
#
# Sibling fixture: malformed/nbit_byte_order_mismatch.h5.  Two files for one
# invariant on purpose -- n-bit keeps the order word at cd_values[5] and
# scale-offset at cd_values[6], so the two recording branches are different code
# and a wrong constant in either would go untested with only one of them.
#
# Built by h5policy-gencorpus, which asserts cd_values[6] reads 0 before patching
# and repairs the object-header checksum.
file: malformed/scaleoffset_byte_order_mismatch.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FILTER_PARM_MISMATCH]
expected_finding_evidence:
  H5_CORRUPT_FILTER_PARM_MISMATCH:
    field: filter.decode_byte_order
    actual: 1
    expected: 0
    comparison: equal
h5cve: {family: dataset_layout_filter_fill, allowed_statuses: [verified]}
forbidden: [crash, timeout, external_open, plugin_load, write]
