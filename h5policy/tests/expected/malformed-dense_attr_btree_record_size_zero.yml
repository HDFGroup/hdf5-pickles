# A checksum-valid DENSE ATTRIBUTE name index (v2 B-tree record type 8) whose
# header declares record_size = 0.  The dense-LINK companion
# (malformed-zero_v2_btree_record_size.yml) corrupts the same field in a type-5
# tree; this fixture exists because the two are not interchangeable.
#
# WHY A SECOND FIXTURE FOR ONE FIELD.  One shared validator,
# h5policy_validate_v2_btree_geometry (h5policy/pickles/h5_btree2.pk), serves
# every v2-btree client role, so the role is carried in the finding MESSAGE and
# the message is what selects the record family --
# registry/findings/routes/H5_CORRUPT_V2_BTREE_RECORD_SIZE.yml routes
# "dense link ..." to dense_index / dense.btree_record_size and
# "dense attribute ..." to heap_structures / heap.btree_record_size.  Because
# `record` also selects the exact-build canary, a fixture for one role proves
# nothing about the other's route, invariant or canary.  Until this fixture
# existed the dense-attribute route was `evidence: curated` with nothing
# behind it.
#
# REGIME, not just values.  The base valid/dense_attribute.h5 carries exactly
# one BTHD, type 8, at DEPTH 1 -- an INTERNAL root.  The dense-link base next
# to it is depth 0, a LEAF root.  That difference is load-bearing for this
# defect: libhdf5's leaf capacity macro divides by rrec_size alone
# (H5B2_NUM_LEAF_REC, src/H5B2hdr.c:44) and faults, while the internal macro
# divides by rrec_size + pointer_size (src/H5B2pkg.h:110) and does not.  The
# generator asserts record type 8 and depth 1, so a base-file change fails
# loudly instead of quietly producing a fixture that pins a different shape.
#
# LIBHDF5 BEHAVIOUR -- measured 2026-10-12 on 2.3.0 (develop 5933130b610),
# NDEBUG baseline builds at BOTH widths (x86-64 and i386), on a specimen of
# this shape:
#
#   h5dump -H / -A    SIGFPE          h5ls -rv   SIGFPE
#   h5stat            SIGFPE          h5ls -r    rc=0  <-- never reaches it
#   ASan + NDEBUG     FPE at H5B2hdr.c:140 in H5B2__hdr_init
#   asserts live      abort on assert(cparam->rrec_size > 0), H5B2hdr.c:113
#   h5py / 1.14.5     SIGFPE
#
# `h5ls -r` exiting 0 on a file that kills h5dump is the reason this fixture
# reports `violation` rather than a rejection, and it is worth keeping in view:
# a shallow link listing never touches attribute metadata.  The reach is
# H5A__get_ainfo -> H5B2_open (src/H5Aint.c:2018), which any operation needing
# the attribute count performs.
#
# allowed_statuses MEASURED, not inherited from the dense-link sibling:
# h5policy-probe --exercise heap_structures on this fixture reports
# outcome `crashed`, signal 8 (SIGFPE), with all activation counters zero.
#
# The libhdf5 defect is recorded in
# registry/cases/v2-btree-record-size-zero-assert-only.yml.
file: malformed/dense_attr_btree_record_size_zero.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_V2_BTREE_RECORD_SIZE]
h5cve: {family: heap_structures, allowed_statuses: [violation]}
verification:
  # A record size of exactly zero, the lower boundary libhdf5 divides by.
  count_and_extent_boundaries: [zero]
forbidden: [crash, timeout, external_open, plugin_load, write]
