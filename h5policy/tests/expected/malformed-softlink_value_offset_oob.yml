# A SOFT LINK's entry names a TARGET PATH past the local heap data segment.
# The target offset is a 4-byte field at the start of the entry's scratch pad
# (H5Gent.c:155); libhdf5 resolves it through the same H5HL_offset_into as the
# link name (H5Gent.c:391) and fails the bound at H5HL.c:391.  h5policy read no
# part of the scratch pad, so it accepted this outright.  The offset is past the
# SEGMENT but still inside the FILE, so this tests the segment bound.
file: malformed/softlink_value_offset_oob.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_HEAP_OFFSET_OUT_OF_BOUNDS]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: heap_structures
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
