# An old-style symbol-table entry points into the local heap at an empty link
# name.
#
# CORRECTED 2026-09-02.  This comment said "libhdf5 rejects this as an invalid
# link name", which is true of ONE of the two paths that read the name and false
# of the other.  Measured on develop b7b85e7abf9 and on released 1.14.5, both
# identical:
#
#   H5Lvisit2 / H5Literate2   FAILS -- H5G__ent_to_link checks the name at
#                             src/H5Gent.c:384-385
#   H5Lget_name_by_idx,       SUCCEEDS, returning len=0 "" --
#   H5Gget_objname_by_idx     H5G__stab_get_name_by_idx_cb has the same
#                             H5HL_offset_into and H5MM_strndup at
#                             src/H5Gstab.c:656-660 and no check after them
#
# So whether this file is readable depends on which API the caller used, and one
# empty name makes the whole group unlistable by iteration while the index path
# still enumerates it.  Recorded in
# registry/cases/symtab-empty-link-name-path-split.yml.
#
# NOTHING HERE ASSERTS THAT SPLIT.  This expectation asserts the oracle verdict,
# and every read-only harness in this suite iterates, so the permissive path is
# unexercised.  A check that calls both entry points on one file and compares
# would cover it; see that record's coverage_gaps.
file: malformed/bad_snod_empty_name.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LINK_NAME_EMPTY]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
verification:
  # A link name of zero length: the lower boundary of a name extent.
  count_and_extent_boundaries: [zero]
forbidden: [crash, timeout, external_open, plugin_load, write]
