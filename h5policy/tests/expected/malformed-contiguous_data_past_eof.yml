# Contiguous dataset whose data address is inside the file but whose data range
# ends past the end-of-file.
#
# The address_space_bounds canary specimen: the superblock is untouched and
# valid, so libhdf5 opens the file (h5ls -r exits 0) and only trips when the
# dataset is opened or read (h5dump exits 1). The family's other fixture,
# inflated_eoa_ext_addr, is refused at H5Fopen and so never reaches the family
# surface.
file: malformed/contiguous_data_past_eof.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LENGTH_OVERFLOW]
h5cve:
  family: address_space_bounds
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
# 2060 is the data ADDRESS, `eof - size//2` computed by the generator from the
# h5py-written base fixture -- so, unlike the crafted constants elsewhere, it is
# base geometry rather than a value the generator chose outright.
#
# It stays pinned anyway, for two reasons.  It is the only thing separating the
# address field (offset 255) from the size field (offset 263): both are 8 bytes
# under the same single `actual` role, so role and length alone would match
# either, and the assertion would be close to vacuous without the value.  And it
# is stable in practice -- the base file is 2072 bytes under h5py/libhdf5 1.14.5
# and under libhdf5 2.3.0 alike.
#
# `from_evidence_actual` cannot substitute: this finding deliberately cites the
# address (h5_layout.pk:109-118 (contiguous_layout_addr_offset), because the
# rejected range runs past EOF and has
# no decodable bytes of its own) while `evidence.actual` reports the data SIZE
# and `expected` the bytes available.  Location and value describe different
# fields here, by design.
#
# If this does drift, the durable fix is to cite the size under `actual` and
# give the address its own role, then use the sentinel.
# `h5policy_checked_addr_range_at` has six callers, so that is a deliberate
# change rather than a test edit.
expected_finding_evidence_locations:
  H5_CORRUPT_LENGTH_OVERFLOW:
  - role: actual
    length: 8
    little_endian_value: 2060
verification:
  # The data extent ends past the end of the file.
  count_and_extent_boundaries: [out_of_file]
forbidden: [crash, timeout, external_open, plugin_load, write]
