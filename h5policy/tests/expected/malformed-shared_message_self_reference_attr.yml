# Report 1's exact route: an attribute whose committed (shared) datatype
# resolves back into the committed datatype's own object header.  The base file
# gives dataset /d an attribute typed by the committed datatype /t; here /t's
# own datatype message (in an OCHK continuation) is rewritten into a shared
# wrapper pointing back at /t, so resolving the attribute's type reaches /t,
# whose type is shared and points at /t again, unboundedly.  libhdf5's
# H5O__shared_read has no depth bound or visited set, so H5Aopen (stock h5dump
# 2.3.0 dumping the attribute) SIGSEGVs and the ASan build reports stack-
# overflow.  h5policy rejects the self-reference before following it.  Sibling
# of malformed/shared_message_self_reference.h5 (dataset-datatype route); see
# registry/cases/shared-message-self-reference-recursion.yml.
file: malformed/shared_message_self_reference_attr.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SHARED_MESSAGE_CYCLE]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: shared_messages_legacy
  # The shared_messages_legacy canary (H5Ovisit3/H5Aopen_by_idx/H5Aget_type)
  # reaches the family through the attribute's shared datatype: libhdf5 opens
  # the file and recurses without bound decoding it.  The stock baseline
  # SIGSEGVs and the ASan build reports stack-overflow, so the row is a
  # `violation`; `verified` covers a hypothetical build that survives.  A
  # soundness-positive divergence -- h5policy safely rejects what crashes libhdf5.
  allowed_statuses: [verified, violation]
forbidden: [crash, timeout, external_open, plugin_load, write]
