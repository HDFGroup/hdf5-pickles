# A dense link name index whose v2 B-tree header declares ONE MORE record than
# its tree holds -- 41 against 40 -- with the header checksum resealed.
#
# ONE BYTE, and it is a segfault in every shipped reader.  The link-info message
# carries no link count: H5O__linfo_decode sets `linfo->nlinks = HSIZET_MAX`
# unconditionally (src/H5Olinfo.c), so H5G__obj_get_linfo fills it from
# H5B2_get_nrec -- this very field (src/H5Gobj.c:326).  That number then sizes
# the link table in H5G__dense_build_table while the tree walk fills it, and
# nothing compares the two.  The extra slot is left as H5MM_calloc made it, with
# a NULL `name`, and H5G__link_sort_table qsorts the whole table into
# H5G__link_cmp_name_inc, which calls strcmp on it.
#
# MEASURED on the 2.3.0 baseline: h5dump -H and h5ls -r both SIGSEGV (rc=139).
# Under the ASan build: SEGV on address 0x0 in strcmp, from
# H5G__link_cmp_name_inc (src/H5Glink.c:93) <- H5G__link_sort_table
# (H5Glink.c:468) <- H5G__dense_build_table (H5Gdense.c:782).
#
# WHY n+1 AND NOT A LARGE VALUE.  41, 45, 64, 100, 256, 1000 and 65536 all
# segfault identically, so the large values add nothing; 2**32 is refused by a
# different path (h5dump rc=1) and would have measured the wrong thing.  n+1 is
# the minimal inflation, which is what makes the absence of any comparison the
# whole story.
#
# THE OTHER TWO VALUES ARE NOT HERE, deliberately.  n-1 makes the walk overrun
# the table past an assert-only bound (src/H5Gdense.c:717, compiled out of every
# Release build) and aborts on heap corruption -- a WRITE, and this corpus is
# swept in-process by h5policy-diff, so it lives in the case record's specimens
# instead.  Zero is benign: `if (ltable->nlinks > 0)` skips the allocation and
# the group reports no links at all.  Both are covered by h5mutate recipes.
#
# Case record: registry/cases/v2-btree-total-nrec-unchecked-in-name-walker.yml
file: malformed/dense_link_btree_total_nrec.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_V2_BTREE_TOTAL_COUNT]
h5cve:
  family: dense_index
  require_oracle_alignment: true
  # MEASURED 2026-09-03 on the dense_index exercise: signal 11, SIGSEGV.
  allowed_statuses: [violation]
verification:
  # One above the tree's own record count.
  count_and_extent_boundaries: [n_plus_one]
forbidden: [accept, crash, timeout, external_open, plugin_load, write]
