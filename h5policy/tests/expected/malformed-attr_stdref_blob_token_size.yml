# A revised reference declaring a token wider than its whole heap object.
#
# The blob's own framing rather than the selection inside it, and the field that
# was SILENTLY SKIPPED when this check first landed: the bound was taken
# (`token_size > data_size - 1`) but nothing was reported, so the file came back
# ACCEPTED while libhdf5 refused it -- an accept-versus-reject divergence created
# exactly where the bound was being applied. Measured: H5Aread fails cleanly with
# the width raised to 255 in a 49-byte object.
# Case record: registry/cases/attribute-selection-unvalidated.yml
file: malformed/attr_stdref_blob_token_size.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_REFERENCE_BLOB_EXTENT]
h5cve:
  # Named mechanically from the primary finding via registry/findings/; the
  # selection codes are shared with the VDS layout and route on the message's
  # role prefix, so an attribute-borne selection resolves to message_envelope.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
