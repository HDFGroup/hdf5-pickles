# A filtered SOHM huge object declaring a 64-byte decoded size against the
# heap's 4096-byte managed ceiling.
#
# An object is stored huge ONLY because it exceeded that ceiling
# (H5HF_insert, src/H5HF.c:335), and H5HF__huge_insert asserts as much
# (src/H5HFhuge.c:291).  That assert is the only enforcement anywhere: the read
# path carries the record's decoded size back out through
# H5HF__huge_get_obj_len (src/H5HFhuge.c:520) and never compares it again, so on
# an NDEBUG build the value is unbounded from below.  For a FILTERED record that
# is a memory-safety defect rather than untidiness -- the decoded size sizes the
# caller's buffer while the copy length comes from the filter's own output
# (src/H5HFhuge.c:753-761), and nothing relates the two.
#
# MEASURED, and it refines
# registry/cases/filtered-huge-object-decoded-size-unchecked.yml.  Before this
# check, this file drew `unsupported_coverage_gap` with the mismatch entirely
# undetected -- zero corrupt findings, forensic included, on a complete walk.
# The record inferred the oracle would ACCEPT such a file; on a specimen
# carrying only this defect it refuses for coverage instead, which is a real
# detection gap but a milder exposure than the record states.
#
# The check fires on every record in the tree, the internal node's separator
# included, because the generator gives them all the same declared size.
#
# NOT A CRASH REPRODUCER, deliberately.  libhdf5 reports `rejected_in_traversal`
# on this file: its stored bytes are not a valid scale-offset stream, so the
# filter errors out before the copy site is reached.  Reproducing the overrun
# needs a stream that decodes SUCCESSFULLY to the wrong length, which the
# promoted specimen did and this fixture does not.
file: malformed/sohm_filtered_huge_below_managed_max.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SOHM_HUGE_OBJECT_BELOW_MANAGED_MAX]
h5cve: {family: shared_messages_legacy, allowed_statuses: [unexercised]}
forbidden: [crash, timeout, external_open, plugin_load, write]
