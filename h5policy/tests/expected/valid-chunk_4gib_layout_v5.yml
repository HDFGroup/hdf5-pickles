# A chunk of 2**32 + 256 bytes in a layout message version 5.
#
# THE REGRESSION THIS GUARDS.  Until 2026-08-24 h5policy rejected every chunk
# whose dimension product exceeded 0xffffffff, on the stated premise that "no
# valid writer-produced file reaches this state: H5Pset_chunk rejects chunks
# >= 4 GiB at creation".  That premise expired with libhdf5 2.0.0: upstream
# commit 1093a18c181 widened H5O_layout_chunk_t.size and dim[] from uint32_t to
# hsize_t, added layout message version 5, and removed the creation-time
# ceiling.  A 2.x library writes exactly this file for
# H5Pset_chunk(1073741888) on an int32 dataset, with no libver bounds call --
# MEASURED against libhdf5 2.3.0, which then reads it back.  So the old bound
# was a false positive on writer output, and this fixture is what stops it
# coming back.
#
# WHY IT IS BYTE-PATCHED.  The corpus writer is h5py, whose bundled libhdf5 is
# 1.14.5: that library can neither create a chunk this large nor emit a version
# 5 layout message.  The generator therefore writes a single-chunk dataset whose
# chunk dimension needs four encoded bytes, patches the dimension and stamps the
# version.  A single-chunk index carries no chunk-size field in its records, so
# the bytes are identical under v4 and v5 and the stamp is the only difference
# from policy/chunk_4gib_layout_v4.h5 -- the same geometry one version down,
# where it earns a portability advisory instead.
file: valid/chunk_4gib_layout_v5.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
h5cve:
  family: dataset_layout_filter_fill
  allowed_statuses: [verified]
forbidden: [reject_corrupt, crash, timeout, external_open, plugin_load, write]
