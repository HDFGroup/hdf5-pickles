# An ARRAY-of-vlen attribute whose LAST heap ID names a missing object.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
#
# The only test of the array replication path. A class-10 array of N copies of a
# vlen carries N heap IDs per element, strided by the base type's storage size:
# the datatype walk collects the copy at index 0 and the rest are that set
# shifted. Two dataspace elements of a 3-entry array give six descriptors, and the
# LAST is patched -- reaching it needs both the per-array replication and the
# per-element stride, so a replication yielding only the first entry, or a stride
# correct only once, would still pass.
#
# An unmodified prior build accepts this file. libhdf5 refuses to read the
# attribute (h5py raises OSError); h5dump -A prints "unable to print data" and
# still exits 0, so judge by output rather than exit status.
file: malformed/attr_array_vlen_last_idx.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_HEAP_OBJECT_MISSING]
h5cve:
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
