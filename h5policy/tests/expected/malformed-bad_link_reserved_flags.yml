# A compact link message whose flags byte sets bit 5.
#
# H5O_LINK_ALL_FLAGS is 0x1f: bits 0-1 select the name-length width, bit 2 adds
# a creation order, bit 3 adds a link type and bit 4 adds a character set.
# H5O__link_decode refuses anything outside that set outright ("bad flag value
# for message"), so a reader has no way to accept the header.  h5policy read the
# flags only to work out which optional fields follow and ignored the undefined
# bits, accepting the file: a tier-2 A' divergence, now closed.
#
# Bit 5 is the target precisely because it carries no layout meaning -- nothing
# after the flags byte shifts, so the byte is the whole defect and the case
# cannot be passed by a validator that merely disagrees about field widths.
#
# libhdf5 opens the file and then fails at link iteration rather than at
# H5Fopen.  The differential harness counts a file it cannot fully traverse as
# not opened, so this is a true A' and not the A+ that attribute-name defects
# produce.
#
# Built by h5policy-gencorpus from a v2 object header; the enclosing header
# checksum is re-sealed so a checksum mismatch cannot stand in for the flags.
file: malformed/bad_link_reserved_flags.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LINK_FLAGS]
expected_finding_evidence:
  H5_CORRUPT_LINK_FLAGS:
    field: envelope.link_flags
    actual: 32
    expected: 31
    comparison: subset_of
expected_finding_evidence_locations:
  H5_CORRUPT_LINK_FLAGS:
    - role: actual
      length: 1
      little_endian_value: 32
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
