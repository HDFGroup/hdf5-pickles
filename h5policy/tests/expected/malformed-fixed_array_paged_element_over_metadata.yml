# REGRESSION GUARD for a SILENT COVERAGE HOLE, and the only fixture that
# exercises a paged array's chunk elements at all.
#
# h5policy read the page-init bitmap LSB-first.  libhdf5 writes it MSB-first:
# H5VM_bit_get tests `buf[off/8] & H5VM_bit_set_g[off % 8]` with
# H5VM_bit_set_g = {0x80, 0x40, 0x20, 0x10, 0x08, 0x04, 0x02, 0x01}
# (H5VMprivate.h:453), and its own note says "bit offset 0 in the first byte's
# high-bit position, proceeding down to bit offset 7 in the first byte's
# low-bit position".
#
# So page 0 of every conforming file looked UNINITIALIZED and its elements were
# skipped.  Every per-element check went quiet -- chunk address in file, chunk
# stored size, raw-data/metadata disjointness -- and NO finding was emitted to
# say coverage had gone.  Measured before the fix: a 1200-element paged fixed
# array whose two pages are both live carries bitmap byte 0b11000000, and
# h5policy walked ZERO of its 1200 elements.  This file was `accept`.
#
# IT MUST BE PAGED, which is why it is 1200 elements and not four.  h5py writes
# 1024-element pages, so multi-page needs >1024; a small fixed array takes the
# unpaged branch entirely.  Every pre-existing fixed-array control was small,
# which is how a wrong bit order survived in two separate readers -- the
# extensible-array paged loop had it too, and both now share one helper.
#
# THE PAGE CHECKSUM IS REPAIRED after the edit, deliberately: without that the
# file also raises H5_CORRUPT_BAD_CHECKSUM, and a fixture that trips two rules
# cannot show which one it was built for.  The generator recomputes the page's
# Jenkins lookup3 over its element bytes.
#
# NON-VACUOUS AND ISOLATED, verified by reverting one fix at a time: with ONLY
# the bitmap fix reverted this file is `accept` -- proving the bitmap fix is what
# catches it.  With both fixes reverted it is reject_corrupt for the unrelated
# size over-estimate, i.e. that bug MASKED this one, which is why reverting both
# together proves nothing.
#
# Same A~ treatment as its siblings (chunk_silent_wrong_data_only): libhdf5 both
# opens and reads successfully, returning superblock bytes as data.
#
# `extent_overlap_truncated: true` is expected: 1200 records exceed the
# 1024-check cap.  The finding lands on page 0's first element, well inside the
# budget.
file: malformed/fixed_array_paged_element_over_metadata.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_RAW_DATA_OVERLAPS_METADATA]
expected_analysis:
  complete: true
  walk_completed: true
  extent_overlap_truncated: true
# MEASURED 2026-08-23 with `--exercise chunk_index`: outcome=accepted,
# violations=[], family exercise 1/1 completed -> verified.
h5cve: {family: chunk_index, allowed_statuses: [verified]}
verification:
  # A paged fixed-array chunk element addressed onto file metadata.
  reference_semantics_cases: [overlap]
forbidden: [crash, timeout, external_open, plugin_load, write]
