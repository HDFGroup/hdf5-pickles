# Control for chunk.stored_size on the LEGACY (v1 B-tree) chunk index, and the
# base file malformed/chunk_zero_stored_size.h5 is patched from -- the pair
# differs only in one four-byte stored-size field.
#
# chunked_v1_btree.h5 beside it already covers the UNFILTERED v1 path.  This one
# adds the filtered element layout, which is the half that matters here: the
# stored size only reaches a subtracting filter when there is a filter, and
# fletcher32 is the one whose overhead is fixed (it always subtracts 4 before
# looking at the data, so a zero wraps rather than erroring out).
#
# What the control is actually guarding: a zero-size rule keyed on a field that
# a well-formed file also contains can fire where it must not.  A v1 B-tree node
# holds n+1 KEYS for n children, and the trailing boundary key's size is
# legitimately ZERO in every conforming chunked file -- so a walker that tested
# every key rather than every record would reject this fixture, and with it the
# HDF5 library's own test data.  This file passing is what says the rule reads
# records, not keys.
#
# libhdf5 opens it and reads its data cleanly (h5dump -H rc=0, h5dump data
# rc=0), so it is also the A-invariant control for the pair.
file: valid/chunk_v1_btree_fletcher.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
# MEASURED 2026-08-22 with `h5policy-probe --exercise chunk_index`:
# outcome=accepted, violations=[], chunk_index family exercise 1/1 completed.
# Declared as exactly [verified] rather than [unexercised, verified] because the
# exercise IS reachable here -- a later drop to `unexercised` would be a loss of
# canary coverage the matrix should catch rather than tolerate.
h5cve: {family: chunk_index, allowed_statuses: [verified]}
forbidden: [crash, timeout, external_open, plugin_load, write]
