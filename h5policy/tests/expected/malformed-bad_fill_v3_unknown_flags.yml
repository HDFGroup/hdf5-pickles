# A version-3 fill-value message setting a flag bit the format does not define.
#
# H5O_FILL_FLAGS_ALL is 0x3f: two 2-bit time codes (allocation time and fill
# time) plus the undefined-value and have-value bits.  libhdf5 refuses anything
# above that mask outright in H5O__fill_new_decode ("unknown flag for fill value
# message").  h5policy read the flag byte only to test bit 5 for the presence of
# a value and never validated it, so it accepted the message: a tier-2 A'
# divergence (libhdf5 rejects, h5policy accepted), now closed.
#
# Bit 7 is the mutation, giving 0xaa over the 0x2a libhdf5 writes for this
# dataset.  Bits 6 and 7 are the only two that can be wrong -- neither 2-bit
# time code has a reserved encoding, so every value of bits 0-3 is legal -- and
# that is why the check tests 0xc0 rather than enumerating time codes.
#
# Only the flag byte changes, so the size field and value bytes behind it are
# still a well-formed fill value and the message keeps its original length; the
# defect is the flag alone.  Built by h5policy-gencorpus, which repairs the
# enclosing v2 object-header checksum afterwards -- without that libhdf5 would
# reject the file for the checksum and the case would prove nothing.
#
# libhdf5 opens the file and rejects the dataset, the usual shape for a defect
# inside an object-header message.
file: malformed/bad_fill_v3_unknown_flags.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FILL_VALUE_UNKNOWN_FLAGS]
expected_finding_evidence:
  H5_CORRUPT_FILL_VALUE_UNKNOWN_FLAGS:
    field: fill.flags
    actual: 170
    expected: 63
    comparison: subset_of
expected_finding_evidence_locations:
  H5_CORRUPT_FILL_VALUE_UNKNOWN_FLAGS:
    - role: actual
      length: 1
      little_endian_value: 170
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: dataset_layout_filter_fill
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
