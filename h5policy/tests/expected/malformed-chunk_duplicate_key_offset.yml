# Two v1 B-tree chunk keys declaring the same chunk offset.
#
# The key order is load-bearing, not decoration: libhdf5 LOCATES a chunk by
# searching the tree on it, so a duplicate makes one chunk unreachable and serves
# the other in its place.  MEASURED: h5dump exits 0 and returns chunk (0,5)'s
# bytes at logical position (0,0), while the region whose record was displaced
# comes back as the dataset's FILL VALUE.  Silent wrong data, no error.
#
# SAME CHARACTER AS malformed/chunk_data_over_metadata.h5, through a different
# field -- one lies about WHERE a chunk lives, this one about WHICH chunk it is --
# and the two share the A~ predicate (chunk_silent_wrong_data_only) for exactly
# that reason: in both, libhdf5 both opens and reads SUCCESSFULLY, so a nonzero
# return code never appears and the A+ evidence path has nothing to find.  The
# predicate is generalised over both codes rather than duplicated, because the
# rationale is identical: libhdf5 trusts the chunk record and there is no check
# to be late about.
#
# key[1]'s offset words are copied from key[0] rather than zeroed, so the node
# stays otherwise well-formed -- both records keep valid addresses and sizes, and
# the only broken rule is the strict ordering.  A v1 B-tree node carries no
# checksum and the edit is size-neutral.  The generator asserts the two keys are
# increasing BEFORE overwriting, so a base-file change cannot silently produce a
# fixture that tests nothing.
#
# This is the DUPLICATE arm (equality).  An inversion -- a later key with a
# smaller offset -- is the other arm of the same comparison and emits the same
# code; it is not separately fixtured.
#
# THIS IS THE LEAF HALF OF A PAIR.  Internal-node separator keys carry the same
# obligation and are covered since 2026-08-23 by
# malformed/chunk_internal_separator_order.h5 -- which needs a MULTI-LEVEL index,
# so this small single-node fixture is blind to that half by construction.  The
# separator case is the more damaging one: a leaf duplicate loses one chunk, a bad
# separator loses a whole subtree (measured: 57 of 130 values returned as fill).
file: malformed/chunk_duplicate_key_offset.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_CHUNK_KEY_ORDER]
expected_analysis:
  complete: true
  walk_started: true
  walk_completed: true
  continue_after_rejection: false
  findings_truncated: false
# MEASURED 2026-08-22 with `--exercise chunk_index`: outcome=accepted,
# violations=[], family exercise 1/1 completed -> verified.  `verified` on a
# malformed fixture is the signature of a silent-wrong-data defect: the canary
# completes precisely because libhdf5 accepts the corruption and serves the
# wrong chunk.
h5cve: {family: chunk_index, allowed_statuses: [verified]}
verification:
  # Two B-tree keys naming one chunk offset: the same target reached twice,
  # which is the duplicate-reference case rather than an ordering fault.
  reference_semantics_cases: [duplicate_reference]
forbidden: [crash, timeout, external_open, plugin_load, write]
