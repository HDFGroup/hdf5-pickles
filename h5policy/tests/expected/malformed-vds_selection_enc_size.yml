# A serialized hyperslab selection whose encoding size byte is 3.
#
# Legal encoding sizes are exactly 2, 4 and 8, and libhdf5 gets there by two
# filters that do NOT agree with each other:
#
#   if (enc_size & ~H5S_SELECT_INFO_ENC_SIZE_BITS)   -- a MASK. Admits any
#       subset of {2,4,8}, so 0, 6, 10, 12 and 14 all pass it.
#   switch (enc_size) { case 2: case 4: case 8: ...  default: HGOTO_ERROR }
#
# The switch default is the effective gate, so the rule h5policy models is set
# membership -- not the mask, and not a range. Three fails the FIRST filter
# (3 & ~0x0e == 1), which is why the measured error is "unknown size of
# point/offset info for selection" at src/H5Shyper.c rather than the switch's
# "unknown offset info size for hyperslab".
#
# Three is also precisely the shape the old h5policy bound admitted: that test
# was `enc == 0 || enc > 8`, a range, so 3 passed and the payload was then SIZED
# as 4 * rank * 3 bytes -- an extent libhdf5 would never compute for any input.
# The bound was wrong in both directions, admitting 1/3/5/6/7 and rejecting
# nothing libhdf5 accepts.
#
# Measured: h5dump -H exits 1, agreement, no tolerance needed.
file: malformed/vds_selection_enc_size.h5
profile: legacy
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SELECTION_ENC_SIZE]
forbidden_findings: [H5_CORRUPT_SELECTION, H5_CORRUPT_BAD_CHECKSUM, H5_CORRUPT_VDS_MAPPING_TRAILING_BYTES]
h5cve: {family: virtual_dataset, allowed_statuses: [unexercised]}
forbidden: [accept, unsupported_coverage_gap, external_open, plugin_load, write, crash, timeout]
