# A local-heap free-list chain that fails on its SECOND node -- and the fixture
# that exists for what libhdf5 does AFTER refusing it.
#
# THIS IS THE REGRESSION TEST FOR A REJECTION THAT DOES NOT HOLD.  libhdf5's
# free-list validation works here: the chain's second offset is outside the data
# segment, H5HL__fl_deserialize refuses it at H5HLcache.c:240, and the data-block
# load fails.  What it leaves behind is the defect.  The validation lives inside
#
#     if (NULL == heap->dblk_image)                       /* H5HLcache.c:713 */
#
# and the failed attempt has already allocated that image at :715, while the
# error path at :732 destroys only the dblk.  The image hangs off the H5HL_t on
# the CACHED heap prefix -- an entry that loaded fine -- so the next protect
# skips the whole branch, validation included, and hands the heap over.
# MEASURED: the first H5Lget_name_by_idx on the root group fails and the second
# succeeds, which is what h5policy-probe's durability pass reports as
# `not_durable`.
#
# CORRECTED 2026-09-02: this comment first said "the only corpus fixture that
# does", on a sweep that was an alphabetical head -60 and never reached the
# mdci_* files.  A full sweep of all 317 corpus files reports 8 `not_durable`:
# this fixture and seven metadata-cache-image ones.  Those are a DIFFERENT
# mechanism -- H5C_protect clears load_image before calling
# H5C__load_cache_image, so the failing call consumes the attempt rather than
# leaving an artifact behind -- reaching the same observable.  This fixture
# remains the only one for the local-heap route, which is what it is here to
# pin.
#
# THE HEAP MUST BE NON-CONTIGUOUS, and that is the fixture's one subtlety.  A
# heap libhdf5 never had to grow is written with its data segment immediately
# after its prefix, and the two are then ONE cache object: the free list is
# deserialized during the PREFIX load, so a failure means the prefix never
# enters the cache, every retry re-reads, and the refusal is durable -- a file
# that tests nothing here.  The generator therefore writes four 40-character
# link names to force one heap growth, which moves the data segment away from
# the prefix and splits them into two cache entries.  The bypass needs the
# prefix load to SUCCEED and keep the H5HL_t the failed data-block attempt
# wrote its image into.
#
# WHY THE SECOND NODE.  Either position exposes the bypass, since the image is
# allocated before any node is examined.  Failing on the second one also leaves
# the first node live on heap->freelist, which is the state that turns this into
# memory corruption when the wrapped-size defect next door supplies that node --
# so this fixture encodes the dangerous shape rather than the minimal one.
#
# WHAT THIS FIXTURE CAN AND CANNOT ASSERT.  h5policy rejects the file outright,
# which is what the matrix checks here.  The bypass itself is asserted by the
# probe phase in run.sh, not by this expectation: it takes two calls in one open
# to see, and this harness makes one.  The consequence beyond the bypass is
# RDWR-only and is not observable from either.
#
# Neighbouring, and NOT this fixture: malformed/heap_free_list_size_wrap.h5,
# where the bound itself wraps and libhdf5 accepts the file.  Same structure,
# opposite libhdf5 verdict -- there the check is defeated, here it fires and is
# then bypassed.  Both are recorded in
# registry/cases/local-heap-free-list-bound-wraps.yml.
file: malformed/heap_free_list_chain_break.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LOCAL_HEAP_FREE_LIST]
expected_analysis:
  complete: false
  walk_started: true
  walk_completed: false
  stop_reason: rejection
  continue_after_rejection: false
  findings_truncated: false
h5cve:
  # MEASURED, not defaulted: the canary matrix reports `unexercised` here, and
  # that is the honest answer rather than a pass -- libhdf5's heap data-block
  # load fails, so the heap_structures family surface is never reached and the
  # probe has nothing to exercise.  Matches the sibling
  # malformed/bad_heap_free_list.h5, which libhdf5 also refuses.
  #
  # `verified` is deliberately NOT permitted.  A flip to it would mean libhdf5
  # started exercising the family on a file it currently refuses, which is worth
  # investigating rather than silently allowing.
  family: heap_structures
  require_oracle_alignment: true
  allowed_statuses: [unexercised]
forbidden: [crash, timeout, external_open, plugin_load, write]
