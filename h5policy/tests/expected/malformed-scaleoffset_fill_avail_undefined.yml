# A scale-offset descriptor whose fill-value availability word is outside its
# enumeration: cd_values[7] patched 1 -> 169.
#
# H5Z_SCALEOFFSET_FILL_UNDEFINED is 0 and FILL_DEFINED is 1
# (H5Zscaleoffset.c:124-125); nothing else has a meaning.  The filter only ever
# tests the word for equality with FILL_DEFINED (:458 and six further sites), so
# an out-of-range value is not refused -- it silently means "no fill value",
# exactly as a 0 would, and the encoded fill sentinels decode as ordinary
# numbers.
#
# THE SECOND ARM OF layout.filter_fill_availability, and it needs its own file
# because it fires on a different condition.  The sibling
# malformed/scaleoffset_fill_unavailable.h5 is an IN-RANGE value contradicting
# an explicit fill value, and requires the header to carry one; this word is
# wrong against ANY object header, so it is caught by the enumeration bound
# alone and needs no fill value at all.  Reverting either condition leaves the
# other fixture passing, which is the point of having both.
#
# 169 rather than a near-miss so the intent is unmistakable in a hex dump.  This
# is also the value the real-world specimen carried that produced this rule.
#
# libhdf5: opens and reads with rc=0 and different values; no crash, clean under
# AddressSanitizer.
file: malformed/scaleoffset_fill_avail_undefined.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FILTER_PARM_MISMATCH]
expected_finding_evidence:
  H5_CORRUPT_FILTER_PARM_MISMATCH:
    field: filter.decode_fill_available
    actual: 169
    expected: 1
    comparison: at_most
h5cve: {family: dataset_layout_filter_fill, allowed_statuses: [verified]}
forbidden: [crash, timeout, external_open, plugin_load, write]
