# A VERSION 2 serialized hyperslab declaring rank 0.
#
# The malformed half of the version-2 pair. It exists because the rank sits at a
# DIFFERENT OFFSET in this encoding -- +13, after the four-byte length field --
# than in version 3, where it is at +10 directly after the enc_size byte. A
# fixture patched at the version-3 offset would have hit the length field, which
# libhdf5 skips and h5policy now ignores, and tested nothing at all. So this is
# not a duplicate of malformed/vds_selection_rank_zero.h5: it proves the rank
# rule is wired into the version-2 arm specifically.
#
# libhdf5 rejects it in H5S__hyper_deserialize (src/H5Shyper.c, "invalid rank
# (0) for serialized hyperslab selection"); the rank guard is common to every
# selection version. Measured: h5dump -H exits 1, agreement, no tolerance
# needed.
file: malformed/vds_selection_v2_rank_zero.h5
profile: legacy
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_VDS_SELECTION_RANK]
verification:
  # The version-2 encoding of the same zero rank, at a different offset.
  count_and_extent_boundaries: [zero]
forbidden_findings: [H5_CORRUPT_VDS_SELECTION, H5_CORRUPT_BAD_CHECKSUM, H5_CORRUPT_VDS_MAPPING_TRAILING_BYTES]
h5cve: {family: virtual_dataset, allowed_statuses: [unexercised]}
forbidden: [accept, unsupported_coverage_gap, external_open, plugin_load, write, crash, timeout]
