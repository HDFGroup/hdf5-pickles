# A VERSION-1 contiguous layout whose dimension list disagrees with the
# dataspace -- and which MUST BE ACCEPTED.
#
# Case record: registry/cases/contiguous-stored-size-unallocated.yml
#
# This is the negative half of the contiguous stored-size rule, and the fixture
# the equality advisory's version gate rests on. Layout versions 1 and 2 have no
# stored-size field at all: the size comes from the trailing 4-byte dimension
# list, and libhdf5 DISCARDS it, recomputing the extent from the dataspace and
# datatype (H5Dcontig.c:536-551). A v1 dimension list implying a different size
# than the dataspace is therefore not a defect, and reporting it would be a false
# positive on a file libhdf5 reads perfectly.
#
# MEASURED: the dims say 7 x 4 = 28 while the dataspace and datatype say
# 10 x 4 = 40, and h5py reads all ten values back correctly.
#
# NON-VACUOUS, verified by applying the plausible wrong change rather than by
# assertion: recording the v1 dimension product as a stored size, so the equality
# rule reaches v1, turns this fixture into accept_with_warnings with
# H5_ADVISORY_CONTIGUOUS_STORED_SIZE_MISMATCH. A CONSISTENT v1 dimension list does
# not discriminate -- it accepts either way -- which is why the mismatch is the
# fixture and the consistent case is not.
file: valid/contiguous_v1_dims_disagree.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
forbidden_findings: [H5_ADVISORY_CONTIGUOUS_STORED_SIZE_MISMATCH]
h5cve:
  family: dataset_layout_filter_fill
  allowed_statuses: [unexercised, verified]
forbidden: [reject_corrupt, crash, timeout, external_open, plugin_load, write]
