# An external attribute reference (H5R_ATTR, H5R_IS_EXTERNAL) whose global-heap
# blob declares a file-name length of 0xFFFF in a 35-byte object.
#
# H5R__decode_string checks only that the two length bytes are present, then
# copies the length's worth; its other test, assert(string_len <=
# H5R_MAX_STRING_LEN), compares a u16 with 1 << 16 and cannot fire.  MEASURED on
# develop 6533bcc0f6a: H5Aread is an AddressSanitizer heap-buffer-overflow
# (READ of size 65535); the stock build reads silently.  The blob's bytes are
# reached through an attribute value, so they are in this oracle's scope -- the
# same jurisdiction as the region-reference selection checks.
# Case record: registry/cases/attribute-reference-lengths-unbounded.yml
file: malformed/attr_ref_file_name_length.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_REFERENCE_BLOB_EXTENT]
expected_finding_evidence:
  H5_CORRUPT_REFERENCE_BLOB_EXTENT:
    field: attribute.reference_string_length
    actual: 65535
    expected: 24
    comparison: at_most
h5cve:
  family: message_envelope
  # MEASURED `violation` (develop 6533bcc0f6a, 2026-10-30): the stock build reads
  # the attribute without complaint while the oracle rejects.  `unexercised` is
  # what a build that bounds the length upstream produces: the reference
  # decoder then fails cleanly (measured on a patched build for the token and
  # name lengths; the patch is in the case record).
  require_oracle_alignment: true
  allowed_statuses: [violation, unexercised]
forbidden: [crash, timeout, external_open, plugin_load, write]
