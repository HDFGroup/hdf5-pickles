# A dense ATTRIBUTE name index whose v2 B-tree header declares client id 9.
#
# libhdf5 range checks the client id against the NUMBER of B-tree types and
# never against the client the caller opened the tree as:
# H5B2__cache_hdr_deserialize does `if (id >= H5B2_NUM_BTREE_ID)` and then
# `cparam.cls = H5B2_client_class_g[id]`, so the FILE picks the class and
# H5B2__hdr_init runs its crt_context on the CALLER's user data.
#
# 9 IS CHOSEN BECAUSE IT ERRORS RATHER THAN CRASHES. Measured on the 2.3.0
# baseline over this fixture's base: client ids 0, 7 and 10 SEGFAULT both h5dump
# and h5py (exit 139), while 5 and 9 error cleanly. A fixture that segfaults
# in-process would be a hazard for every consumer this corpus is swept by, and
# h5policy-diff opens each file with h5py in the harness process. The crashing
# ids are recorded in the case record, not shipped as fixtures.
#
# WHY THE FORBIDDEN FINDING MATTERS. Before this check the wrong client id fell
# out of a combined `record_type != 8 || addr_is_undef` test with no report, and
# the caller labelled the file H5_UNSUPPORTED_PICKLE_COVERAGE_GAP -- "the oracle
# does not decode this shape" for a file that crashes the reference library.
# An empty index (undefined root address) is legitimate and still returns
# silently; only the type mismatch is corruption.
# Case record: registry/cases/v2-btree-client-id-type-confusion.yml
file: malformed/dense_attr_btree_wrong_client.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_V2_BTREE_RECORD_TYPE]
forbidden_findings: [H5_UNSUPPORTED_PICKLE_COVERAGE_GAP]
h5cve:
  family: dense_index
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
