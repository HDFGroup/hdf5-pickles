# The libhdf5 defect this isolates is recorded in
# registry/cases/compound-member-array-promotion-unguarded.yml, which CLOSED
# items 2 and 3 of registry/cases/arithmetic-divergences-backlog.yml.  The
# backlog asked "is the member ever read at its declared extent?" -- yes: the
# promoted size is published via H5Tget_size and read by H5T__conv_struct_opt
# (src/H5Tconv_compound.c:868) on H5Dread, an ASan heap-buffer-overflow.
# Two coupled halves, both needed: H5T__array_create multiplies unchecked
# (src/H5Tarray.c:158,:162) AND the guards at src/H5Odtype.c:507/:509 run
# against the base type before the promotion at :542.  The identical arithmetic
# IS guarded three ways for STANDALONE arrays at src/H5Odtype.c:815-848.
#
# A version-1 compound whose member uses the legacy embedded-array encoding
# with dimensions [65537,65536,65536,65536] -- a product of 2**64 + 2**48 that
# overflows a 64-bit element count.  libhdf5 later scales that count by the base
# type size (H5T__array_create), so it wraps and underflows the array type's
# size; consumers that build the type overflow (h5py: "dtype size in bytes must
# fit into a C int").  h5policy validates the element-count product for the v1
# embedded-array member just as it does for a standalone array datatype, and
# rejects it as corrupt under every profile.  Built by h5policy-gencorpus, which
# splices a hand-built v1 compound datatype into a compact dataset header.
file: malformed/compound_member_array_nelem_overflow.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LENGTH_OVERFLOW]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: datatypes
  require_oracle_alignment: true
  # GENUINE gap, UNINVESTIGATED: libhdf5 accepts a compound member array
  # element count that overflows. See
  # registry/cases/arithmetic-divergences-backlog.yml.
  allowed_statuses: [violation]
verification:
  # The four legacy embedded-array dimensions multiply past uint64_t before
  # the member's storage extent is used.
  integer_overflow_and_allocation_budget: [integer_overflow]
forbidden: [crash, timeout, external_open, plugin_load, write]
