# A serialized hyperslab selection declaring rank 0. libhdf5 rejects it in
# H5S__hyper_deserialize (src/H5Shyper.c, "invalid rank (0) for serialized
# hyperslab selection"), the same condition that catches rank > H5S_MAX_RANK.
#
# ZERO IS THE INTERESTING END OF THAT RANGE FOR AN ORACLE, and the reason this
# fixture exists rather than a rank-33 one. A rank-0 REGULAR hyperslab sizes its
# payload as 4 * rank * enc_size == 0, so a sizer that bounds only the top of
# the range accepts it as a well-formed 14-byte selection and walks on to
# whatever follows. h5policy did exactly that before this check: it tested
# `ndims > H5S_MAX_RANK` and never the zero case.
#
# Everything else in the block is well formed -- the mapping count, both names,
# the source ALL selection and the repaired Jenkins checksum -- so the rank is
# the only defect. Measured: h5dump -H exits 1, so this is an agreement case and
# needs no tolerance.
file: malformed/vds_selection_rank_zero.h5
profile: legacy
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SELECTION_RANK]
verification:
  # A serialized hyperslab rank of exactly zero.
  count_and_extent_boundaries: [zero]
forbidden_findings: [H5_CORRUPT_SELECTION, H5_CORRUPT_BAD_CHECKSUM, H5_CORRUPT_VDS_MAPPING_TRAILING_BYTES]
h5cve: {family: virtual_dataset, allowed_statuses: [unexercised]}
forbidden: [accept, unsupported_coverage_gap, external_open, plugin_load, write, crash, timeout]
