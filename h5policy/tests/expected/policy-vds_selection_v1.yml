# A VALID virtual dataset whose virtual selection is a VERSION 1 serialized
# hyperslab -- the arm
# registry/cases/vds-selection-rank-oracle-false-positive.yml flagged as
# probably wrong in the same way as version 2, and left unverified.
#
# IT WAS WRONG, but not in the way that record predicted, and the difference is
# worth stating. Version 1 writes four bytes of un-used padding and a four-byte
# length at +8..+16 and then SKIPS both on read (`pp += 8; enc_size =
# H5S_SELECT_INFO_ENC_SIZE_4` in H5S__hyper_deserialize). libhdf5's serializer
# stores `4 (rank) + 4 (block_count) + 8 * rank * blocks` in that length, and for
# a conforming writer the old oracle formula -- 16 plus that field -- happens to
# equal the true size EXACTLY. So the arm was not unconditionally wrong; it was
# fragile in precisely the way version 2 was, deriving the size from a field
# libhdf5 never reads.
#
# That fragility is not hypothetical: real version-2 specimens were measured
# carrying a STALE 4 in the same field, which is what exposed the v2 arm. This
# fixture carries a stale 4 too, so the old sizer returns 20 against a true size
# of 40 -- under-sizing the selection by the whole payload, desynchronising the
# mapping cursor, and reporting the mapping block as having trailing bytes.
#
# MEASURED both ways, on this exact file: an unmodified prior build reports
# reject_corrupt with H5_CORRUPT_VDS_MAPPING_TRAILING_BYTES; the fixed sizer
# accepts. libhdf5 reads the file throughout, and `h5dump -p -H` reports the
# IDENTICAL mapping to the version-3 base -- START (1,0) COUNT (1,1)
# BLOCK (2,6) -- so this is a real version-1 file and not merely a structurally
# plausible one. That is the same standard policy/vds_selection_v2.h5 is held to.
#
# WHY IT HAS TO BE BUILT. A VDS requires libver v110 or later, and the selection
# version follows the file's bounds -- v110 gives version 2, v112 and later
# version 3. Version 1 is therefore unreachable through any VDS writer, while
# libhdf5's DESERIALIZER accepts it unconditionally. A crafted file can carry
# one, so the oracle has to size it correctly.
#
# Version 1 has no flags byte, so H5S_HYPER_REGULAR can never be set and a v1
# hyperslab is always the block-list form; the generator expands the regular v3
# selection into its single explicit block.
file: policy/vds_selection_v1.h5
profile: legacy
expected_decision: accept_with_warnings
expected_exit: 1
required_findings: [H5_ADVISORY_VDS_ABSOLUTE_SOURCE]
forbidden_findings: [H5_CORRUPT_SELECTION, H5_CORRUPT_SELECTION_RANK, H5_CORRUPT_SELECTION_ENC_SIZE, H5_CORRUPT_SELECTION_FLAGS, H5_CORRUPT_BAD_CHECKSUM, H5_CORRUPT_VDS_MAPPING_TRAILING_BYTES]
h5cve: {family: virtual_dataset, allowed_statuses: [unexercised, verified]}
forbidden: [accept, reject_corrupt, external_open, plugin_load, write, crash, timeout]
