# Two adjacent name-hash values swapped in a dense-LINK name index (type 5), so
# the leaf is no longer ordered by hash.
#
# The name index is ordered by hash and libhdf5 BINARY-SEARCHES it on a by-name
# lookup.  On equal hashes H5G__dense_btree2_name_compare falls through to
# comparing the real names out of the heap (src/H5Gbtree2.c), so collisions are
# legal and only a DECREASE is corrupt -- a strict-increase check would reject
# conforming files.  The fixture swaps two real hashes rather than planting a
# sentinel for the same reason.
#
# A MEASURED invariant-A' gap.  A one-byte hash flip found by fuzzlib
# `struct_deep` was accepted by h5policy with ZERO findings under every profile,
# forensic included on a complete walk, while libhdf5 2.3.0 refused the lookup
# path.  The pre-existing dense.btree_record_order check covered only the
# CREATION-ORDER indexes (types 6 and 9), keyed on corder; neither name index
# had any ordering check.
#
# MEASURED canary status, not inferred: `unexercised`, aligned,
# rejected_in_traversal.  The exercise attempts and fails, and an incomplete
# exercise is `unexercised` however cleanly libhdf5 refused.
#
# Within-node only: ancestor key bounds would be stronger, but the record
# walkers do not receive them, so a decrease straddling a node boundary is still
# missed.  See the sibling malformed-dense_attr_name_hash_order.yml, where
# libhdf5 does NOT refuse the same corruption.
file: malformed/dense_link_name_hash_order.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_V2_BTREE_RECORD_ORDER]
h5cve:
  family: dense_index
  require_oracle_alignment: true
  allowed_statuses: [unexercised]
forbidden: [crash, timeout, external_open, plugin_load, write]
