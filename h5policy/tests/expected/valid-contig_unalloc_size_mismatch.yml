# An UNALLOCATED contiguous dataset whose stored size is not its extent.
#
# Case record: registry/cases/contiguous-stored-size-unallocated.yml
#
# The stored size of a v3+ contiguous layout is a property of the MESSAGE, not of
# the storage. libhdf5's writer emits nelmts * dt_size whether or not the data has
# been allocated -- measured: an unwritten (10,) int32 stores 40 with an UNDEFINED
# address, an unwritten scalar stores 4 -- and H5O__layout_copy_file requires that
# equality on the copy path for v3+. h5policy recorded the field only inside its
# allocation gate, so an unallocated dataset's stored size was never examined and
# the pre-existing past-EOF advisory could not reach this shape at all.
#
# A WARNING, not corruption, and the fixture demonstrates why in both directions:
#   h5dump -H  rc=0, and h5ls -v reports "40 logical bytes, 0 allocated" -- the
#              recomputed extent, with the patched 4096 ignored entirely
#   h5repack   "Error occurred while repacking"
# So the file is readable and the defect is write-path-fatal. Demanding equality
# as a rejection would be an invariant-A false positive, which this repository has
# already made and measured on this exact field.
#
# 40 -> 4096 rather than something absurd, so the case pins the equality rule and
# not merely the detection of a large number.
file: valid/contig_unalloc_size_mismatch.h5
profile: untrusted-strict
expected_decision: accept_with_warnings
expected_exit: 1
required_findings: [H5_ADVISORY_CONTIGUOUS_STORED_SIZE_MISMATCH]
expected_finding_evidence:
  H5_ADVISORY_CONTIGUOUS_STORED_SIZE_MISMATCH:
    field: layout.contiguous_stored_size
    actual: 4096
    expected: 40
    comparison: equal
h5cve:
  family: dataset_layout_filter_fill
  allowed_statuses: [unexercised, verified]
forbidden: [reject_corrupt, crash, timeout, external_open, plugin_load, write]
