# A VDS global heap whose free-space object stops eight bytes short of the
# collection.
#
# The remainder is then too small to hold an object header, so libhdf5 takes it
# for the free-space object -- and finds it has already recorded one, failing
# with "object 0 should not be set" (H5HGcache.c:280).  The check exists because
# a collection has exactly one free-space region by construction; two means the
# object list and the declared size disagree.
#
# h5policy returned as soon as it reached a free-space object, so the trailing
# region was never examined and the file was accepted.
file: malformed/bad_vds_gheap_free_short.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_GLOBAL_HEAP_OBJECT]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: virtual_dataset
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
