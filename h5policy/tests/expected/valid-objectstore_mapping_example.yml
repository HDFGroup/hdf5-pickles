# The fixture behind the worked example in
# docs/Mapping HDF5 Binary Primitives onto an Object Store.md: a (4, 4)
# deflate-filtered dataset with chunk shape (2, 2) and two of its four chunks
# written, carrying a variable-length string attribute.
#
# The design document quotes this file's spans, field offsets, and digests, so
# it exists to be measured rather than to isolate a policy boundary.  It is
# specified here anyway for a reason worth stating: the document's whole
# argument is that these bytes are an ordinary, well-formed HDF5 file, and an
# expected-decision row is what keeps that claim honest.  If this fixture ever
# stops walking cleanly, the example is describing a file the oracle rejects.
#
# `accept_with_warnings` rather than `accept` is correct and profile-independent
# here: declaring deflate raises H5_ADVISORY_DECODE_FILTER under every profile,
# because a consumer must run a filter to reach the data.  That advisory is the
# same boundary the document names when it explains why an address-free
# filtered chunk can stay `exact` while one holding a relocation cannot.
file: valid/objectstore_mapping_example.h5
profile: untrusted-strict
expected_decision: accept_with_warnings
expected_exit: 1
required_findings: [H5_ADVISORY_DECODE_FILTER]
expected_geometry:
  trailing_bytes: 0
expected_analysis:
  complete: true
  walk_started: true
  walk_completed: true
  stop_reason: ""
  continue_after_rejection: false
  findings_truncated: false
forbidden: [crash, timeout, external_open, plugin_load, write]
