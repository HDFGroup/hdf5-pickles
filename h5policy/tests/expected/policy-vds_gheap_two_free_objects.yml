# The accept-side control for the global-heap collection rules.
#
# Two free-space objects, both 8-aligned, closing the collection exactly:
# libhdf5 opens this file and reports the virtual dataset normally.  The walker
# now continues past the first free-space object -- it used to return there --
# so this file is the guard that continuing does not invent a fault.  It pairs
# with malformed/bad_vds_gheap_free_unaligned.h5, which differs only in the
# first object's length (16 here, 15 there).
#
# Rejected under untrusted-strict for the profile's blanket VDS denial, which is
# the expected verdict; what matters is that no corrupt finding accompanies it.
file: policy/vds_gheap_two_free_objects.h5
profile: untrusted-strict
expected_decision: reject_policy
expected_exit: 3
required_findings: [H5_POLICY_VDS]
# `verified`, not `violation`.  This is the accept-side control: libhdf5 opens it
# and reports the virtual dataset normally, which is the behaviour the file
# exists to pin.  MEASURED 2026-08-22: outcome=accepted, violations=[],
# external_open=0, virtual_dataset exercise 1/1 completed.
# The `[violation]` this carried was copied from the wrong sibling.  Its own base
# file, policy/vds_hyperslab.h5 -- the file this fixture is derived from --
# correctly declares [verified]; only policy/vds_absolute_source.h5 and the
# external_* fixtures legitimately violate, because those actually open a source
# outside the file.  This VDS does not, so it never had a violation to allow, and
# the declaration made the matrix red from the day the fixture was added.
h5cve: {family: virtual_dataset, allowed_statuses: [verified]}
forbidden: [crash, timeout, external_open, plugin_load, write]
