# The same ~1 TB local-heap data-segment size as malformed/bad_heap_segment.h5,
# with the segment RELOCATED off prefix + 32.  Two fixtures, one oracle rule,
# two different libhdf5 paths -- and neither covers the other.
#
# WHY THE ADDRESS IS THE FIXTURE.  H5C__load_entry applies its end-of-address
# bound only to cache classes carrying H5AC__CLASS_SPECULATIVE_LOAD_FLAG
# (H5Centry.c:1050-1052).  A local-heap data segment contiguous with its prefix
# is part of the flagged H5AC_LHEAP_PRFX load and IS bounded; a segment anywhere
# else is a separate H5AC_LHEAP_DBLK load, which carries no flag and is not.
# The file chooses which, through eight bytes of address.
#
# MEASURED, both fixtures, same run: bad_heap_segment.h5 (segment at prefix+32)
# is AddressSanitizer-CLEAN despite its ~1 TB declaration; this one aborts with
# `requested allocation size 0x10000000000` inside H5MM_malloc.  So the sibling
# fixture pins the oracle rule and never exercises the library's missing bound.
#
# THE SEGMENT IS COPIED, NOT JUST REPOINTED.  Aiming the address at arbitrary
# bytes would leave the symbol-table entries indexing into non-heap data, and
# the fixture would then reject for a reason other than its name.  The generator
# appends the real segment, extends the superblock EOA to cover it, and only
# then moves the address -- so the sole defect is the declared size.
# valid/lheap_dblk_relocated.h5 is that transform WITHOUT the size defect, and
# it accepts: a non-contiguous data segment is ordinary, and libhdf5 produces
# one whenever a heap grows.
#
# H5_CORRUPT_LINK_NAME_EMPTY accompanies the primary finding here exactly as it
# does on bad_heap_segment.h5 -- with the segment declared outside the file the
# oracle cannot read link names from it.  It is a consequence of the same
# corruption, not a second defect.
#
# libhdf5: opens, then fails the link iteration when the allocation is refused.
# A grantable size would instead succeed and reserve that much address space;
# see registry/cases/cache-load-length-eoa-check-is-class-gated.yml.
file: malformed/lheap_dblk_size_unbounded.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LENGTH_OVERFLOW]
h5cve:
  family: heap_structures
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
verification:
  # A declared ~1 TB heap data segment against a small file, on the load path
  # that has no end-of-address bound.
  count_and_extent_boundaries: [out_of_file]
forbidden: [crash, timeout, external_open, plugin_load, write]
