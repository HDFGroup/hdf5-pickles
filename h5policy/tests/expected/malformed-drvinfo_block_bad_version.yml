# A v0/v1 driver information block whose version byte is 1.
# HDF5_DRIVERINFO_VERSION_0 is the only value libhdf5 accepts: the check is the
# first thing H5F__drvrinfo_prefix_decode does (src/H5Fsuper_cache.c, "bad driver
# information block version number"), before the length is even read.
#
# This is the AGREEMENT control for the driver-info block tranche, and the
# tranche needs one. The other two fixtures are both invariant-A divergences that
# libhdf5 opens, so without this one there would be no evidence that libhdf5 is
# reading the block at all -- an unread block would look exactly like a tolerated
# one. Measured: h5dump -H exits 1 and h5py raises OSError, so the block IS
# decoded on open, which is what makes the sibling divergences meaningful.
#
# Every other field is well formed: the length matches the 8-byte body and the
# extent lies inside the file, so the version is the only defect.
file: malformed/drvinfo_block_bad_version.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_UNSUPPORTED_DRVINFO_VERSION]
forbidden_findings: [H5_CORRUPT_DRVINFO_BLOCK_EXTENT, H5_CORRUPT_OFFSET_OUT_OF_FILE]
h5cve:
  # Measured `unexercised`: this family's canary is free_space
  # (H5Fget_free_sections) and there are no free-space managers in this file, so
  # the canary cannot reach the defect. `violation` is deliberately NOT
  # permitted alongside require_oracle_alignment -- allowing it would let an
  # alignment regression on the one AGREEMENT fixture of this tranche pass
  # silently, which is the whole thing this fixture exists to catch.
  family: validation_controls
  require_oracle_alignment: true
  allowed_statuses: [unexercised]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
