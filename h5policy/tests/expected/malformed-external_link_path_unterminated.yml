# External link whose target FILE NAME terminates but whose target OBJECT PATH
# does not -- the second half of elink.value_terminated.
#
# Case record: registry/cases/external-link-value-strlen-unbounded.yml
#
# The value is a version/flags byte, a NUL-terminated file name, then a
# NUL-terminated object path, and h5policy scans for BOTH NULs. Every specimen
# wiped all of them, so only the first scan was ever exercised: a rule that
# checked the file name and stopped would have passed the whole corpus. Only the
# LAST NUL is wiped here, so the file name still ends inside the value and the
# object-path scan is the one that has to fire.
#
# NON-VACUOUS, verified by disabling only the object-path scan in a scratch
# overlay: this fixture then drops to reject_policy (H5_POLICY_EXTERNAL_LINK
# alone), while malformed/external_link_unterminated_value.h5 stays
# reject_corrupt because its FIRST scan still fires. Both findings share one code,
# so `required_findings` cannot tell them apart -- `expected_decision` is what
# guards this one.
#
# REMEASURED 2026-10-12 and the canary status CHANGED, because libhdf5 changed.
# This block previously declared `violation` and recorded THREE external-open
# attempts with the path "other.h5" -- the correctly terminated file name, where
# the sibling recorded "other.h5A/xA" from its merged strings. On a `develop`
# build carrying 8117f4c75fd (2026-10-08, "reject malformed external link data
# in H5L__extern_traverse"), the measured outcome is rejected_in_traversal with
# `external_open: 0`: the traversal validates the value against the length it is
# given and rejects before deriving a name, so the family exercise never
# completes and the canary status is `unexercised`.
#
# The zero is not a broken instrument. In the same run the activation fixture
# policy/external_link.h5 still reports `external_open: 3` with its paths, so the
# LD_PRELOAD interposer works and the zero here is a real behaviour change.
#
# DECLARED NARROWLY, on purpose. That commit is in no tagged release --
# `git tag --contains` is empty -- so a matrix run against a RELEASE libhdf5
# will report `violation` here and go red. That red is the correct signal: it
# says the build under test is not the one pinned in
# registry/libhdf5-evidence.yml, not that the fixture is wrong. Re-measure and
# report the build difference rather than widening this list to hide it.
file: malformed/external_link_path_unterminated.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_EXTERNAL_LINK_VALUE_NOT_TERMINATED]
h5cve: {family: external_link, allowed_statuses: [unexercised]}
forbidden: [crash, timeout, external_open, plugin_load, write]
