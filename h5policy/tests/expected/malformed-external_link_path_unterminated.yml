# External link whose target FILE NAME terminates but whose target OBJECT PATH
# does not -- the second half of elink.value_terminated.
#
# Case record: registry/cases/external-link-value-strlen-unbounded.yml
#
# The value is a version/flags byte, a NUL-terminated file name, then a
# NUL-terminated object path, and h5policy scans for BOTH NULs. Every specimen
# wiped all of them, so only the first scan was ever exercised: a rule that
# checked the file name and stopped would have passed the whole corpus. Only the
# LAST NUL is wiped here, so the file name still ends inside the value and the
# object-path scan is the one that has to fire.
#
# NON-VACUOUS, verified by disabling only the object-path scan in a scratch
# overlay: this fixture then drops to reject_policy (H5_POLICY_EXTERNAL_LINK
# alone), while malformed/external_link_unterminated_value.h5 stays
# reject_corrupt because its FIRST scan still fires. Both findings share one code,
# so `required_findings` cannot tell them apart -- `expected_decision` is what
# guards this one.
#
# MEASURED on the probe rather than copied from the sibling: outcome
# rejected_in_traversal, and libhdf5 makes THREE external-open attempts, with the
# path recorded as "other.h5" -- the correctly terminated file name -- where the
# sibling records "other.h5A/xA" from its merged strings. The matrix forbids
# external_open, so the canary status is `violation`, which is the ordinary
# signature for this family rather than a per-file exception.
file: malformed/external_link_path_unterminated.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_EXTERNAL_LINK_VALUE_NOT_TERMINATED]
h5cve: {family: external_link, allowed_statuses: [violation]}
forbidden: [crash, timeout, external_open, plugin_load, write]
