# A VDS global heap whose free-space object declares length zero.
#
# For heap index 0 the parse advance IS the declared length, so
# H5HG__cache_heap_deserialize re-reads the same object header forever.  This is
# not a rejection to align with: libhdf5 never returns.  The corpus runner and
# the differential harness both sandbox the oracle -- the differential reads a
# timed-out child as the strongest form of "libhdf5 rejects" -- so the fixture
# costs a bounded stall rather than hanging a test run.
#
# The zero-advance shape was already modelled for *orphaned* collections by the
# forensic sweep (H5_RESOURCE_GLOBAL_HEAP_INFINITE_LOOP), on the reasoning that
# a normal open never loads a global heap.  A virtual dataset is the exception:
# its source list lives in a global heap object read at H5Dopen.  So this is the
# same defect promoted from an anomaly a forensic pass may report to a hang on
# the ordinary open path -- and h5policy accepted the file, because it returned
# as soon as it had found the object the VDS layout named and never decoded the
# free-space object at all.
#
# Rejected here as a corrupt object header rather than a resource finding: the
# VDS walker already treats a zero-length heap object as corrupt for every
# index, which is stricter than libhdf5 for indexes above zero and exactly right
# for index zero.
file: malformed/bad_vds_gheap_free_zero_length.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_GLOBAL_HEAP_OBJECT]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: virtual_dataset
  require_oracle_alignment: true
  # NO allowed_statuses HERE, DELIBERATELY.  The canary status for this fixture
  # is a reasoned exception to a libhdf5 defect, so it lives with the others in
  # registry/h5cve-matrix-policy.yml fixture_overrides -- and it has to, because
  # cmd_matrix reads an expectation's own allowed_statuses in PREFERENCE to the
  # override, so a value here would silently shadow the reasoned one.
  # This block previously said [unexercised, verified], which cannot happen on a
  # file libhdf5 never returns from -- as the prose above already said.  It made
  # the matrix red from the day this fixture was added.
forbidden: [crash, timeout, external_open, plugin_load, write]
