# A multi-element vlen attribute -- twelve global-heap IDs in one value region.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
#
# Every other attribute heap-ID fixture is scalar, so the stride loop only ever
# ran at element 0: `value_off + (i * width)` was untested for i > 0, and a
# wrong descriptor width would have passed the entire suite. This fixture walks
# it, and also exercises the collection memo -- the twelve IDs name one
# collection, so the first costs a parse and the rest are served from the record.
#
# Deliberately small. A fixture large enough to reproduce the quadratic timing
# the memo fixes would have a load-dependent verdict, which is worse than no
# fixture; valid/dense_links_deep.h5 already sits near that deadline and flips
# on a busy host. The timing bound is held by the walk budget in h5_vds.pk and
# its recorded measurement, not by a test.
file: valid/attr_vlen_array_heap_ids.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
h5cve:
  family: message_envelope
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
