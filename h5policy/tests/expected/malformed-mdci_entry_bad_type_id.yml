# A metadata-cache-image entry that names cache client type 30. H5AC_NTYPES is 30
# (H5ACprivate.h), so 30 is the first id past the client class table. Every other
# envelope field is well formed -- correct image_data_len, valid Jenkins trailing
# checksum, consistent flags/dependency counts and LRU relation -- so the type id
# is the only defect.
#
# libhdf5 bounds this on the READ path, in H5C__reconstruct_cache_entry
# (src/H5Cimage.c, "type id is out of valid range"); the write-side
# H5C__decode_cache_image_entry does not check it at all. The guard reads
# `< H5AC_BT_ID || >= H5AC_NTYPES`, but H5AC_BT_ID is 0, so on a uint8_t only
# the upper bound can fire -- which is why h5policy models the ceiling alone.
#
# The bound is recent: it was introduced by the CVE-2025-6269 fix, the same
# commit that added the age error and converted the ring asserts. Before it,
# the type id was decoded and used unchecked. That version split is what the
# differential harness sees -- and the harness straddles it, since its h5py leg
# is pre-fix and its shipped-tool leg is post-fix. The split and what it means
# for reading an A+ in this family are recorded in
# registry/cases/mdci-entry-enum-bounds-version-straddle.yml. In short, the
# tolerance here is A+, NOT plain alignment:
#
#   2.3.0 (h5dump/h5debug, post-fix) REJECTS. h5dump -H exits 1 here and 0 on
#   valid/cache_image.h5, and --enable-error-stack lands on the bound itself --
#   H5C__reconstruct_cache_entry "type id is out of valid range", under
#   H5C__load_cache_image <- H5C_protect <- H5O_protect. The cache image is
#   loaded lazily at the first object-header protect, not at open.
#
#   1.14.5 (the h5py the harness measures with, pre-fix) ACCEPTS. It opens the
#   file, lists the root group and reads the dataset back correctly. So the
#   harness's "libhdf5 opens" here is the bound-never-loaded explanation, not
#   evidence that the file is well formed.
#
# h5policy rejects eagerly at a point the pre-fix library never checks and the
# post-fix library defers past; h5dump/h5debug/h5dump-data all exiting 1 is the
# deeper evidence the harness demotes the A+ on. Contrast mdci_entry_bad_ring.h5
# ([PASS] A'), which 1.14.5 fails too -- but incidentally, downstream in
# H5C_protect with "ring type mismatch occurred for cache entry", not at a bound.
#
# The h5policy-probe cache_image canary reports `accepted` for this fixture. That
# is the canary false-negative recorded for this family -- not an independent
# measurement. It happens to coincide with a genuine 1.14.5 open here, so it is
# not evidence in either direction; the h5py/h5dump measurements above are.
#
# The id is a dispatch selector on both sides: it picks the deserializer natively,
# and h5policy keys its object-header replay pass off the same byte
# (h5policy_mdci_body_types, consumed in h5_validate.pk).
file: malformed/mdci_entry_bad_type_id.h5
profile: legacy
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_MDCI_ENTRY_CLASS]
verification:
  # Client type 30 where H5AC_NTYPES is 30: the first id past the table.
  count_and_extent_boundaries: [n_plus_one]
forbidden_findings: [H5_CORRUPT_BAD_CHECKSUM, H5_CORRUPT_MDCI_ENTRY_FLAGS, H5_CORRUPT_MDCI_ENTRY_LRU_INCONSISTENT]
h5cve:
  family: cache_image_dependency_graph
  require_oracle_alignment: true
  allowed_statuses: [unexercised, violation]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
