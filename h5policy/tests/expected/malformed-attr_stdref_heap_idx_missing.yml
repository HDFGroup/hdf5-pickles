# A REVISED reference naming a global-heap object the collection does not hold.
#
# The sibling of malformed/attr_vlen_heap_idx_missing.h5 in the other encoding:
# the same defect, reached through the revised-reference decode rather than
# through a vlen descriptor.  Having both is the point -- the heap ID sits at a
# different offset and is preceded by different fields, so one fixture cannot
# stand for the other.
#
# The index is raised to 200: past the objects the collection holds, but still
# inside the obj[] array libhdf5 sizes from the collection SIZE rather than from
# its contents.  Measured on the exact build: H5Aread fails cleanly.
#
# Only the SECOND element is patched; the first is an in-file control.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
file: malformed/attr_stdref_heap_idx_missing.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_HEAP_OBJECT_MISSING]
expected_finding_counts:
  H5_CORRUPT_HEAP_OBJECT_MISSING: 1
h5cve:
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
