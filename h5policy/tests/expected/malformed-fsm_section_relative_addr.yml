# A free-space section whose extent runs past EOF only once the BASE ADDRESS is
# added -- the specimen that proves free-space section addresses are
# base-relative and must be translated before the range check.
#
# THE BUG IT GUARDS was one-directional and silent.  h5policy read the section
# address raw (`h5policy_msg_u64_at`) and compared it against the PHYSICAL
# ceiling.  A relative address is smaller than its physical location, so the
# bound passed too easily and a section running past EOF was ACCEPTED -- by up to
# the user block's size.  Not a crash, not a rejection of valid data: a soundness
# gap, in the direction where h5policy is supposed to be the strict one.
#
# TWO REASONS IT SURVIVED, both worth remembering:
#   * It is invisible at base 0, and every other fixture sits at base 0.
#   * The userblock audit's grep cannot find it.  That grep looks for an
#     unwrapped `bytes_to_u64_le`; this site reads its address through
#     `h5policy_msg_u64_at`, which the grep does not match.  So this is a live
#     instance of that audit's documented blind spot, not a new class.
#
# THE PROOF THAT THESE ADDRESSES ARE RELATIVE needs no external authority -- it
# is inside the same structure.  The FSHD's own sect_addr field reads N while the
# FSSE it points at sits at physical N + base (measured: 787 and 1299 at base
# 512).  The generator ASSERTS that relationship before patching, so a future
# h5py layout change cannot quietly invalidate the premise and leave a fixture
# that tests nothing.
#
# WHY THE PATCHED VALUE IS CHOSEN, NOT ARBITRARY.  It must pass UNTRANSLATED and
# fail TRANSLATED, i.e. lie in (eof - base - sect_size, eof - sect_size].  On the
# generated geometry: eof 2760, base 512, section size 1226, so the window is
# (1022, 1534] and the generator picks its midpoint.  Measured either side:
#   untranslated  1500 + 1226 = 2726 <= 2760  -> passes  (the bug)
#   translated    2012 + 1226 = 3238 >  2760  -> rejects (the fix)
# An address that simply ran past EOF in both spaces would prove only that the
# range check exists, not that the translation happens.
#
# CONTRAST h5_frhp_fspace.pk, whose free-space section records are logical HEAP
# offsets and correctly are NOT translated.  The two walkers look nearly
# identical and operate in different address spaces; that resemblance is how a
# missing translation in one of them stayed invisible.
#
# NON-VACUOUS, verified by reverting the one-line fix: the fixture is then
# `accept`.
#
# H5_CORRUPT_LENGTH_OVERFLOW rather than H5_CORRUPT_OFFSET_OUT_OF_FILE is
# correct: the translated START is still inside the file, and it is the section's
# LENGTH that carries the extent past EOF -- which is exactly the branch
# h5policy_checked_addr_range_at takes for that case.  The message is the
# caller's, "free-space section extent outside file".
#
# `walk_completed: false` with stop_reason `rejection` is expected: the finding
# arrives while validating the superblock extension's file-space-info message,
# and untrusted-strict stops at the first non-accept finding.
file: malformed/fsm_section_relative_addr.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LENGTH_OVERFLOW]
expected_analysis:
  complete: false
  walk_started: true
  walk_completed: false
  stop_reason: rejection
  continue_after_rejection: false
  findings_truncated: false
forbidden: [crash, timeout, external_open, plugin_load, write]
