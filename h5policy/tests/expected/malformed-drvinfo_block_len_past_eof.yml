# A v0/v1 driver information block that carries 8 driver-specific bytes and
# declares 1 MiB of them. This is the LENGTH half of
# registry/cases/driver-info-block-fields-unbounded.yml, which is still unfixed
# upstream -- the address half was bounded at 2.3.0, the length half was not.
#
# WHY libhdf5 OPENS THIS FILE, i.e. why the invariant-A divergence is expected
# rather than a fixture defect. The declared length is not checked against
# anything. It is added to the driver address to compute a minimum EOA and the
# EOA is then EXTENDED to that value (src/H5Fsuper_cache.c), so the length
# authorises itself; the same call then returns it as the cache entry's
# allocation size. Every downstream "is this extent within the EOA?" test is
# satisfied by construction, including H5C__verify_len_eoa, whose whole purpose
# is to catch oversized entries. The only size guard on the path is an assert
# against H5C_MAX_ENTRY_SIZE that NDEBUG compiles out.
#
# Measured: h5dump -H exits 0 and h5py opens and lists the file. h5policy has no
# EOA to move, so it bounds the block extent against the ceiling the superblock
# already declared and rejects. Tracked in h5policy-diff-tolerances.yml against
# the case record above.
#
# THE 1 MiB IS A SAFETY PROPERTY, NOT AN ARBITRARY SIZE. The original specimen
# declared ~3.94 GiB, which makes libhdf5 allocate that much during H5Fopen; an
# uncapped h5dump on such a file can OOM-kill the whole desktop session, and a
# capped one reports `rejected_at_open`, which reads as libhdf5 correctly
# refusing the file and is the exact opposite of the truth. 1 MiB is four orders
# of magnitude past this file's EOF -- more than enough to exercise the bound --
# while staying harmless to measure either way. Do not raise it.
file: malformed/drvinfo_block_len_past_eof.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DRVINFO_BLOCK_EXTENT]
verification:
  # A declared 1 MiB of driver-specific bytes behind 8 real ones.
  count_and_extent_boundaries: [out_of_file]
forbidden_findings: [H5_CORRUPT_UNSUPPORTED_DRVINFO_VERSION, H5_CORRUPT_OFFSET_OUT_OF_FILE]
h5cve:
  # Measured `unexercised`: this family's canary is free_space
  # (H5Fget_free_sections) and this file has no free-space managers, so the
  # canary cannot reach the defect. require_oracle_alignment is deliberately
  # ABSENT -- this fixture is known-divergent by design, and the divergence is
  # tracked in registry/h5policy-diff-tolerances.yml against the case record
  # rather than asserted here.
  family: validation_controls
  allowed_statuses: [unexercised]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
