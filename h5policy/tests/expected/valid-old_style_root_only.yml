# An old-style file holding only the root group: a symbol-table message with
# both addresses DEFINED, a local heap and a v1 B-tree, but no SNOD, because no
# link has been inserted.  This is the regime that separates "no symbol-table
# node yet" from "undefined symbol-table addresses" -- every other old-style
# control has a member and therefore a SNOD, so none of them can tell the two
# apart.  Guards envelope.symbol_table_addresses_defined against a tightening
# that would demand a reachable SNOD.
file: valid/old_style_root_only.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
forbidden: [crash, timeout, external_open, plugin_load, write]
