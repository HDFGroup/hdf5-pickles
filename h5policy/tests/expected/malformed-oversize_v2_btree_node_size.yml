# A checksum-valid dense-link v2 B-tree header declares node_size = 0xFFFFFFFF
# (~4 GiB) inside a ~15 KB file.  record_size stays legitimate (11), so node_size
# is the only malformed field.  libhdf5's H5B2__hdr_init eagerly memsets a
# node_size page and fills an nat_off array of (node_size/record_size) entries
# before any node is read (src/H5B2hdr.c:131-159), so this is a multi-GiB
# resident-memory amplification even for an empty tree -- measured ~6.9 GiB from
# a 2285-byte sibling specimen, ~3.25 million x.
#
# family is dense_index: the header's type byte is 5 (H5B2_GRP_DENSE_NAME_ID),
# same as zero_v2_btree_record_size.h5 next to it.  This fixture guards the
# node_size UPPER bound (node_size > file ceiling) added to the shared
# h5policy_validate_v2_btree_geometry, complementing the record_size==0 and
# node-too-small lower-bound checks.
#
# No h5cve exact-build canary: running libhdf5 on this fixture would attempt the
# multi-GiB allocation itself, an OOM/amplification hazard in the matrix.  The
# libhdf5-side behaviour and containment are recorded in
# registry/cases/v2-btree-node-size-unbounded-amplification.yml; this is a pure
# oracle-side regression that the header is rejected before any such allocation.
file: malformed/oversize_v2_btree_node_size.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_V2_BTREE_NODE_SIZE]
h5cve:
  # The header's type byte is 5 (H5B2_GRP_DENSE_NAME_ID); see the note above.
  family: dense_index
  require_oracle_alignment: true
  # MEASURED 2026-09-02: signal 6 (SIGABRT) under the probe's address-space cap.
  allowed_statuses: [violation]
verification:
  # node_size is the 32-bit field at its maximum, and libhdf5 eagerly allocates
  # from it before reading any node -- the allocation budget in its sharpest
  # form for this family.
  count_and_extent_boundaries: [max]
  integer_overflow_and_allocation_budget: [allocation_budget]
forbidden: [crash, timeout, external_open, plugin_load, write]
