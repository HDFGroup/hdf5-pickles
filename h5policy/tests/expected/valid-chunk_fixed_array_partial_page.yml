# REGRESSION GUARD for an h5policy bug that rejected VALID files.
#
# A paged fixed-array data block whose LAST PAGE IS SHORT: 1200 elements over
# 1024-element pages leaves 176 in the second page.  h5policy's size bound
# charged every page as full, over-estimating the block by
# (1024 - 176) * 8 = 6784 bytes, and when that over-estimate ran past EOF it
# reported H5_CORRUPT_LENGTH_OVERFLOW -- "fixed array paged data block outside
# file" -- on a file libhdf5 reads without complaint (h5dump data rc=0).
# Rejecting valid data is the worst failure class for a preflight tool, so this
# file exists to keep it from coming back.
#
# WHY chunk_fixed_array_paged.h5 NEXT TO IT DID NOT CATCH THE BUG, which is the
# whole reason it survived: that fixture has 2000 elements, and its over-count
# happened to fit inside its larger file.  The measured boundary was
# non-monotonic for exactly that reason -- 1024 and 2048 accepted (exact page
# multiples, no over-count), 1025 through 1200 and 2049 rejected, 3000 accepted
# again because its file absorbed a 576-byte over-count.  The element count here
# is chosen so the over-estimate does NOT fit.
#
# NON-VACUOUS, verified by reverting one fix at a time: with the size fix
# reverted this file is reject_corrupt; with only the page-init bitmap fix
# reverted it accepts.  So it pins the size fix alone.
#
# `extent_overlap_truncated: true` is expected and correct: 1200 chunk records
# exceed the 1024-check cap on the raw-data/metadata disjointness registry, so
# that check's coverage is partial here.  The field exists precisely so a reader
# can tell that from a clean result, and this is the corpus's only VALID fixture
# that exercises it.
file: valid/chunk_fixed_array_partial_page.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
expected_analysis:
  complete: true
  walk_completed: true
  extent_overlap_truncated: true
# MEASURED 2026-08-23 with `--exercise chunk_index`: outcome=accepted,
# violations=[], family exercise 1/1 completed -> verified.
h5cve: {family: chunk_index, allowed_statuses: [verified]}
forbidden: [crash, timeout, external_open, plugin_load, write]
