# A layout message at VERSION 3 declaring the VIRTUAL class (3).  libhdf5 allows
# class 3 only from version 4 on: version 3 shares the class switch with v4/v5
# and `case H5D_VIRTUAL` opens with an explicit version test, so this fails at
# H5Olayout.c:530 ("invalid layout version with virtual layout").  h5policy only
# looked at the virtual class inside its v4/v5 branch, where VDS is a policy
# feature rather than corruption, so at v3 a class of 3 fell through the
# contiguous/chunked/compact dispatch in silence -- and the unknown-class check
# could not see it either, because 3 is a valid class value, just not here.
# The body is left as the contiguous one deliberately: the version test is the
# first statement in that case, before the heap read at H5Olayout.c:536, so the
# malformed body is never reached and the version rule is tested alone.
file: malformed/layout_virtual_version_v3.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LAYOUT_VIRTUAL_VERSION]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: dataset_layout_filter_fill
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
