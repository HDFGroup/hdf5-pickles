# A VALID pair of attributes holding revised (H5T_STD_REF) references whose
# self-described lengths libhdf5's reference decoder trusts: `objs`, two
# internal object references encoded INLINE in the element
# ([type][flags][token_size][token]), and `attrs`, two attribute references
# whose second is EXTERNAL, so its global-heap blob carries a file name before
# the attribute name.
#
# The control for the token- and name-length bounds: it proves they accept what
# libhdf5 writes, including the external blob, where the attribute name is only
# found by stepping over the file name exactly as H5R__decode does.
#
# Written by h5policy/tools/probe/make_ref_lengths_attr.c (h5py cannot write
# H5T_STD_REF), which reads both attributes back and asserts the
# internal/external regime before the fixture is accepted.  libhdf5 reads both
# attributes cleanly, stock and AddressSanitizer builds alike.
file: valid/attr_ref_lengths.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
forbidden_findings: [H5_CORRUPT_REFERENCE_BLOB_EXTENT]
h5cve:
  family: message_envelope
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
