# An attribute region reference whose POINT selection encodes offsets at 3 bytes.
#
# Rewritten to a version-2 point selection so the encoded-size byte exists at
# all: version 1 has no such field (libhdf5 pins it to 4), so the invariant is
# unreachable at the version the base file was written with. Legal values are 2,
# 4 and 8. Measured -- libhdf5 refuses with "unknown size of point/offset info
# for selection".
# Case record: registry/cases/attribute-selection-unvalidated.yml
file: malformed/attr_region_sel_enc_size.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SELECTION_ENC_SIZE]
h5cve:
  # Named mechanically from the primary finding via registry/findings/; the
  # selection codes are shared with the VDS layout and route on the message's
  # role prefix, so an attribute-borne selection resolves to message_envelope.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
