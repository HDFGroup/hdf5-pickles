# A well-formed virtual dataset whose mapping covers PART of the virtual extent,
# so the virtual selection serializes as a real version-3 hyperslab rather than
# H5S_SEL_ALL.
#
# It exists because the other VDS bases do not exercise the selection header at
# all. vds_absolute_source maps a whole extent, so both of its selections are
# H5S_SEL_ALL: a 16-byte header with no flags byte, no encoding size and no
# rank. Every selection-header rule is unreachable through it. This fixture is
# the base the three malformed vds_selection_* fixtures are patched from, and on
# its own it is the control proving h5policy ACCEPTS a valid hyperslab selection.
#
# That control is the point. registry/cases/vds-selection-rank-oracle-false-positive.yml
# records h5policy rejecting a VALID rank-3 VDS because it had no bounded
# selection decoder and failed closed on the whole mapping. Any rule added to
# this decoder has to be landed together with evidence that valid selections
# still pass, or it risks reinstating that false positive.
#
# Measured: h5dump -H exits 0.
file: policy/vds_hyperslab.h5
profile: legacy
expected_decision: accept_with_warnings
expected_exit: 1
required_findings: [H5_ADVISORY_VDS_ABSOLUTE_SOURCE]
forbidden_findings: [H5_CORRUPT_VDS_SELECTION, H5_CORRUPT_VDS_SELECTION_RANK, H5_CORRUPT_VDS_SELECTION_ENC_SIZE, H5_CORRUPT_VDS_SELECTION_FLAGS]
h5cve: {family: virtual_dataset, allowed_statuses: [verified]}
forbidden: [accept, reject_corrupt, external_open, plugin_load, write, crash, timeout]
