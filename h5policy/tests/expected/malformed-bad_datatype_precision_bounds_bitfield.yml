# The class-4 (bitfield) form of the sibling
# malformed-bad_datatype_precision_bounds expectation, which is class 0
# (fixed-point).  h5policy decides both classes in one clause, so this file is
# what keeps the class-4 arm honest: narrowing that clause to fixed-point alone
# would otherwise pass the whole suite.
#
# The precision is 33 over a 32-bit storage width: one bit past the bound rather
# than an implausible value, so a guard that only rejects large precisions fails
# here too.
#
# This asserts the ORACLE decision.  It is not a libhdf5 crasher -- reaching the
# size_t underflow in H5T__conv_b_b needs the file type as a conversion
# DESTINATION, which no shipped tool does for a plain dataset (measured: h5dump,
# h5ls and h5repack from a 1.14.5 ASan build all exit 0 on this file).
file: malformed/bad_datatype_precision_bounds_bitfield.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DATATYPE_PRECISION_BOUNDS]
h5cve:
  family: datatypes
  require_oracle_alignment: true
  # `unexercised` only, and deliberately narrower than the class-0 sibling.  The
  # datatype canary needs H5Tget_nmembers to succeed, which a scalar bitfield
  # never satisfies, so this fixture cannot reach the family surface on any
  # build -- and it must not be permitted to report a `violation` it has no
  # documented reason for.  Measured on 2.3.0: status `unexercised`,
  # oracle_alignment `aligned`.
  allowed_statuses: [unexercised]
forbidden: [crash, timeout, external_open, plugin_load, write]
