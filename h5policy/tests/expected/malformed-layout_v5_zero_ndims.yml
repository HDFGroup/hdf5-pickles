# A version-5 chunked layout claiming zero dimensions, with the rest of the
# message re-emitted so it still decodes: the dimensionality is the only defect.
#
# libhdf5's v4-and-later layout decoder bounds dimensionality only from above
# (H5Olayout.c), so it accepts the message and refuses the dataset later, in
# H5D__chunk_init ("chunk size must be > 0", measured on 2.3.0).  h5policy
# refuses at decode, and names the dimensionality.
#
# This case is why the layout version gate and the dimensionality rule are
# coupled: while versions above 4 were refused outright, the version gate was
# what stopped this file.  Admitting version 5 means the rejection now has to
# come from the dimensionality check, and this fixture is what proves it does.
file: malformed/layout_v5_zero_ndims.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LAYOUT_DIMENSIONALITY]
h5cve:
  family: dataset_layout_filter_fill
  allowed_statuses: [unexercised, verified]
verification:
  # The v5 layout's encoded dimensionality is exactly zero.
  count_and_extent_boundaries: [zero]
forbidden: [accept, crash, timeout, external_open, plugin_load, write]
