# A version-5 chunked layout claiming zero dimensions, with the rest of the
# message re-emitted so it still decodes: the dimensionality is the only defect.
#
# libhdf5's v4-and-later layout decoder bounds dimensionality only from above
# (H5Olayout.c), so it accepts the message and refuses the dataset later, in
# H5D__chunk_init ("chunk size must be > 0", measured on 2.3.0).  h5policy
# refuses at decode, and names the dimensionality.
#
# This case is why the layout version gate and the dimensionality rule are
# coupled: while versions above 4 were refused outright, the version gate was
# what stopped this file.  Admitting version 5 means the rejection now has to
# come from the dimensionality check, and this fixture is what proves it does.
#
# The libhdf5 defect is recorded in
# registry/cases/layout-v4-ndims-lower-bound-missing.yml.  The lower bound
# exists in BOTH older decoders in the same function -- src/H5Olayout.c:115
# (v1/v2, `!ndims`) and :279-282 (v3, `< 2`) -- and was not carried into the
# v4+ path at :338, which bounds only from above.  Line numbers pinned to
# develop b7b85e7abf9 and re-read there on 2026-09-01.
#
# THIS FIXTURE IS NOT A CRASH REPRODUCER, and WHY is now measured rather than
# open.  The selector is THE DATASPACE RANK, and this fixture's dataspace has
# rank 2.  H5D__chunk_init computes scaled dimension info under
# `if (dset->shared->ndims > 1)` (src/H5Dchunk.c:1139), and that block holds a
# correctly ordered zero check -- guard at :1146, error at :1147, before the
# division at :1150 -- and runs BEFORE the call to H5D__chunk_set_info at :1175.
# So rank >= 2 is refused cleanly at :1147, which is what happens here.  A
# rank-1 dataset skips the whole block and reaches H5D__chunk_set_info_real,
# where the division at :733 precedes the dim[u] == 0 guard at :738: SIGFPE.
# malformed/layout_v4_zero_ndims_rank1.h5 is that file, and the two fixtures
# are a matched pair: same defect, same oracle finding, opposite libhdf5
# outcomes, selected by the rank in a DIFFERENT message.  They also differ in
# layout version -- 4 there, 5 here -- because the reference library h5py links
# (1.14) refuses a v5 layout on the version gate and would never reach the
# crash.  The version is not what separates the outcomes; the rank is.
#
# CORRECTION, 2026-09-01.  This comment previously attributed the clean refusal
# to "H5D__chunk_init's sanity loop (src/H5Dchunk.c:1055, erroring on iteration
# 0)".  That loop is in H5D__chunk_construct, which runs at dataset CREATION and
# is not on the open path a malformed file takes; the refusal measured here is
# at :1147.  Both numbers existed at promotion, and the wrong one was cited.
file: malformed/layout_v5_zero_ndims.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LAYOUT_DIMENSIONALITY]
h5cve:
  family: dataset_layout_filter_fill
  allowed_statuses: [unexercised, verified]
verification:
  # The v5 layout's encoded dimensionality is exactly zero.
  count_and_extent_boundaries: [zero]
forbidden: [accept, crash, timeout, external_open, plugin_load, write]
