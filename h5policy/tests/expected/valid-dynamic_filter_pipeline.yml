# A well-formed version-2 pipeline led by a dynamically registered filter:
# lz4 (32004), then shuffle, then gzip.  The regression guard for the version-2
# descriptor shape.
#
# Version 2 drops the name-length field only for filter IDs below
# H5Z_FILTER_RESERVED (256).  Every dynamic filter -- lz4 here, as blosc (32001)
# and zstd (32015) would be -- sits above that line and keeps the field, so its
# descriptor header is eight bytes, not six.  h5policy assumed a flat six for all
# of version 2, which read cd_nelmts out of the flags field and shifted every
# following descriptor.  On this file that produced an unqualified "accept"
# reporting a phantom filter ID 0 and, worse, losing the gzip decode advisory
# entirely: a dataset needing a consumer to decompress untrusted bytes looked
# clean.  So the assertions below are the substance of the case -- the exact
# feature lists are what a correct descriptor walk yields and what the old
# six-byte assumption could not produce.
#
# libhdf5 writes this shape itself; H5Z_FLAG_OPTIONAL is what lets it encode a
# filter it cannot find (H5Z_find fails, the name stays NULL, and the descriptor
# gets a present-but-zero name-length field).  No data is written, so no plugin
# is needed to read the file either.
file: valid/dynamic_filter_pipeline.h5
profile: legacy
expected_decision: accept_with_warnings
expected_exit: 1
required_findings: [H5_ADVISORY_DECODE_FILTER]
forbidden_findings:
  - H5_CORRUPT_FILTER_PIPELINE_OVERRUNS_MESSAGE
  - H5_CORRUPT_FILTER_NAME_NOT_TERMINATED
expected_features:
  dynamic_filters: [32004]
  decode_filters: [1]
forbidden: [crash, timeout, external_open, plugin_load, write]
