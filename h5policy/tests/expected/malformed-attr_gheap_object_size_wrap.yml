# A global-heap object whose declared size wraps the aligner to ZERO.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
#
# align8 is ((x + 7) / 8) * 8, so a declared size in [2^64-7, 2^64-1] wraps to 0.
# Before the pre-align bound the walker computed a span of just the 16-byte object
# header, admitted the object with a nonsense size, and advanced the cursor only 16
# bytes -- desynchronizing the rest of the parse and handing a 2^64 size to
# whatever later read the object.
#
# NOT A DIVERGENCE, and worth being explicit about: libhdf5's H5HG_ALIGN is the
# same formula (8 * ((X + 7) / 8)), so it desynchronizes identically and refuses
# too. Measured -- h5py raises on the region-reference dereference with "ran off
# end of input buffer while decoding", and on a crafted collection whose bytes
# keep the desynchronized parse self-consistent it raises "bad heap index", which
# is the same conclusion h5policy reached. The bound was added because the walker
# should not be a SOURCE of wrapped arithmetic its callers consume, and because
# the finding it produced before was the wrong one: a length mismatch from a
# downstream reader instead of the overrun that is actually wrong.
#
# The bound is strictly weaker than the span test that follows it, so it cannot
# add a false positive: for any object libhdf5 accepts,
# data_size <= align8(data_size) < span <= remaining.
#
# 2^64-1 rather than merely a large value, so the case pins the aligner's wrap
# window; 2^64-8 does not wrap and is caught by the pre-existing span test.
file: malformed/attr_gheap_object_size_wrap.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_GLOBAL_HEAP_OBJECT]
expected_finding_evidence:
  H5_CORRUPT_GLOBAL_HEAP_OBJECT:
    field: attribute.global_heap_object_size
    actual: 18446744073709551615
    comparison: at_most
h5cve:
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
