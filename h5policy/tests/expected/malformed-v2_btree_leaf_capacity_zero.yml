# A v2 B-tree whose record width leaves a leaf holding ZERO records -- the
# minimum-capacity half of the record-size invariant, which nothing exercised.
#
# Case record: registry/cases/v2-btree-record-size-zero-assert-only.yml
#
# That record called this "the more interesting untested case, because a zero
# max_nrec sizes the native record factory", and listed libhdf5's behaviour as
# unmeasured. MEASURED 2026-08-24, and the rejection is CORRECT even though a
# shallow listing succeeds:
#
#   h5ls -r        rc=0, lists the groups -- never traverses the tree
#   h5dump -H      rc=1, "internal error"
#   assert build   abort on `assert(size > 0)` in H5FL_fac_init, reached because
#                  H5B2__hdr_init passes nrec_size * max_nrec with max_nrec == 0
#                  (H5B2hdr.c:147)
#   h5py / 1.14.5  intermittent heap corruption on a real traversal
#                  ("free(): invalid size", "double free or corruption")
#
# So this is the ASSERT-ONLY pattern, not an oracle false positive: the guard
# exists in libhdf5, is compiled out of every shipped build, and what follows is a
# zero-sized block factory. A shallow open is not acceptance. The deeper probe
# rejecting is what demotes invariant A to A+ here.
#
# record_size is node_size - 9, one byte past what a leaf can hold, so the case
# pins the BOUNDARY -- capacity goes to exactly zero and no further -- rather than
# an implausible width that any bound would catch.
file: malformed/v2_btree_leaf_capacity_zero.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_V2_BTREE_NODE_SIZE]
h5cve:
  family: dense_index
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
