# A VALID attribute of REVISED (H5T_STD_REF) dataset-region references.
#
# The control for the revised-reference regime of the attribute heap-ID
# invariant, and the only file in the corpus with a datatype message of class 7
# at version 4 -- which is what H5T_STD_REF is by construction
# (H5T_INIT_TYPE_REF_COMMON, src/H5T.c).  The corpus having none is why a gate
# rejecting `class 7 && version != 1` as H5_CORRUPT_UNSUPPORTED_DATATYPE_VERSION
# survived: it refused every file using a modern reference and no fixture said
# so.  This file fails loudly if that gate ever returns.
#
# Written by h5policy/tools/probe/make_stdref_attr.c, not by h5py: the local
# h5py links libhdf5 1.14.5 and cannot write H5T_STD_REF at all -- it raises
# "Unknown reference type" even reading one, so it is not usable as an oracle
# here either.  The exact-build C harness is: H5Aread succeeds on this file and
# both references dereference to a 5-point region.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
file: valid/attr_stdref_region.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
forbidden_findings: [H5_CORRUPT_UNSUPPORTED_DATATYPE_VERSION]
h5cve:
  family: message_envelope
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
