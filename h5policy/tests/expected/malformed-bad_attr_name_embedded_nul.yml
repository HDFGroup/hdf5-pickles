# An attribute whose name ends before its declared length: "abcd\0" rewritten
# as "a\0cd\0" with name_size left at 5.
#
# libhdf5 copies name_size - 1 bytes, measures the copy and refuses the message
# when it comes up short -- H5O__attr_decode fails with "attribute name has
# different length than stored length" (the HDFFV-10588 hardening).  h5policy
# read name_size only to place the datatype and dataspace behind it and never
# looked at the name bytes, so it accepted the message.
#
# This is A+, not A', and the reason is worth stating: attribute decode happens
# *below* what the differential harness calls a structural open.  The file opens
# and the dataset opens; only attribute access fails.  So the harness records
# "libhdf5 opens structurally" and demotes on the deeper probes, which here
# report attrs=1 (the linked libhdf5 rejects the attribute) plus h5dump rc=1.
# The divergence is real and libhdf5 does reject -- it just does not reject at
# the point invariant A' measures.
#
# The defect matters because the message stays structurally intact: the declared
# length keeps the datatype and dataspace at their original offsets, so a
# C-string consumer sees the attribute as "a" while a length-driven one sees
# "a\0cd".  Two readers disagree about which attribute this is and neither sees
# anything malformed.
#
# The NUL is deliberately not in the final byte.  libhdf5 never examines that
# byte, so a name running right up to its declared length without a terminator
# is something it accepts, and the check mirrors that rather than tightening it.
#
# Built by h5policy-gencorpus at the earliest library bound, so the attribute
# sits in a version-1 object header with no checksum to repair.
file: malformed/bad_attr_name_embedded_nul.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_ATTRIBUTE_NAME_EMBEDDED_NUL]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
