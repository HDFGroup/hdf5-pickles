# A version-0 superblock whose consistency flags set bit 3.
#
# Only write-access, file-ok and SWMR-write-access are defined
# (H5F_SUPER_ALL_FLAGS == 0x07); libhdf5 refuses anything else
# (H5Fsuper_cache.c, "bad flag value for superblock").  h5policy applied that
# mask only to version 3, so v0, v1 and v2 all went unchecked.
#
# The sibling fixture malformed-bad_superblock_v0_status_flags_high.yml breaks
# the other half of the same field -- the 32-bit width rule -- and the two are
# kept apart because libhdf5 tests them separately and reports them
# differently.  The width finding is forbidden here so the case cannot pass on
# the wrong one: 0x08 fits comfortably in the low byte.
#
# libhdf5 rejects at H5Fopen, so this is a clean A'.  Versions 0 and 1 carry no
# superblock checksum.  Built by h5policy-gencorpus.
file: malformed/bad_superblock_v0_status_flags_reserved.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SUPERBLOCK_STATUS_FLAGS]
forbidden_findings: [H5_CORRUPT_SUPERBLOCK_STATUS_FLAGS_HIGH_BYTES]
expected_finding_evidence:
  H5_CORRUPT_SUPERBLOCK_STATUS_FLAGS:
    field: superblock.status_flags
    actual: 8
    expected: 7
    comparison: subset_of
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: validation_controls
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
