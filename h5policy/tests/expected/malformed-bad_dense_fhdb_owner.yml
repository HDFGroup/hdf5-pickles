# This otherwise-valid dense-link heap has one FHDB direct block whose owner
# back-pointer names address 0 (the superblock) instead of the FRHP header that
# owns it.  The block's checksum is recomputed, so the back-pointer is the only
# thing wrong: libhdf5 rejects the block outright in
# H5HF__cache_dblock_deserialize ("incorrect heap header address for direct
# block"), and h5policy must not decode heap-resident link messages out of a
# block belonging to a different heap.
file: malformed/bad_dense_fhdb_owner.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FRACTAL_HEAP_BACKPOINTER]
# The owner field is the defect, so the finding points at it (block + 4 + 1)
# rather than at the block prefix.
forbidden_findings: [H5_CORRUPT_BAD_CHECKSUM, H5_CORRUPT_OFFSET_OUT_OF_FILE]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: heap_structures
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
