# A VDS global heap whose free-space object length is not 8-aligned.
#
# H5HG_ISALIGNED(obj[0].size) is checked once, after the whole collection has
# been parsed (H5HGcache.c:373).  Reaching it takes two free-space objects: a
# single misaligned one also leaves a remainder, and "object 0 should not be
# set" fires first (see malformed/bad_vds_gheap_free_short.h5).  With two, the
# first object's length of 15 carries the cursor to an unaligned position and
# the second closes the collection exactly, so the length libhdf5 finally holds
# in obj[0] is the second one's -- 3937.
#
# h5policy could not have reached this rule at all: it returned at the first
# free-space object, so the second was never decoded.  Walking the whole
# collection, the way the metadata cache must, is what makes the post-parse
# rules expressible.  policy/vds_gheap_two_free_objects.h5 is the accept-side
# control for the same shape with both lengths aligned.
file: malformed/bad_vds_gheap_free_unaligned.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_GLOBAL_HEAP_OBJECT]
expected_finding_evidence:
  H5_CORRUPT_GLOBAL_HEAP_OBJECT:
    field: vds.global_heap_free_space_alignment
    actual: 3937
    expected: 8
    comparison: multiple_of
expected_finding_evidence_locations:
  H5_CORRUPT_GLOBAL_HEAP_OBJECT:
    - role: actual
      length: 8
      little_endian_value: 3937
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: virtual_dataset
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
