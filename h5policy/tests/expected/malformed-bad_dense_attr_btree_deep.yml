# Dense-attribute v2 B-tree with checksum-valid depth 120.  Forensic permits
# that depth, so this exercises the saturated subtree-counter-width helper.
file: malformed/bad_dense_attr_btree_deep.h5
profile: forensic
expected_decision: reject_corrupt
expected_exit: 2
required_findings:
  - H5_CORRUPT_OFFSET_OUT_OF_FILE
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: heap_structures
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
# The reported "child address" is not a child address at all: with the depth
# forced to 120 the walk reads the BTIN node's record area as child pointers, so
# it decodes record #2's 8-byte fractal heap ID.  Those bytes are whatever the
# h5py-written base fixture happens to hold, and `_write` builds it with
# libver="latest" -- i.e. whatever the LINKED libhdf5 calls newest -- so a
# literal here pins the writing library, not the oracle.  h5py/1.14.5, libhdf5
# 2.3.0 and the literal this line used to carry are three different values.
# Assert the property that was meant instead: the location the finding points at
# decodes to the value the finding reports.
expected_finding_evidence_locations:
  H5_CORRUPT_OFFSET_OUT_OF_FILE:
  - role: actual
    length: 8
    little_endian_value: from_evidence_actual
verification:
  # A checksum-valid depth of 120 exercises the traversal's nesting limit
  # rather than any single node's contents.
  deep_nesting_and_non_progress: [deep_nesting]
forbidden:
  - crash
  - timeout
  - external_open
  - plugin_load
  - write
