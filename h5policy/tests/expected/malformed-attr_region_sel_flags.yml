# An attribute region reference whose selection sets an unknown flag bit.
#
# Rewritten to a version-3 hyperslab, the version that carries a flags byte at
# all -- version 1 has none and point selections have none at any version.
# H5S_SELECT_FLAG_BITS is H5S_HYPER_REGULAR alone (0x01). Measured -- libhdf5
# refuses with "unknown flag for selection".
#
# The bit matters beyond hygiene: 0x01 selects between the regular and the
# block-list payload encodings, so an unknown neighbour riding alongside it says
# the byte is not what the writer thought it was.
# Case record: registry/cases/attribute-selection-unvalidated.yml
file: malformed/attr_region_sel_flags.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SELECTION_FLAGS]
h5cve:
  # Named mechanically from the primary finding via registry/findings/; the
  # selection codes are shared with the VDS layout and route on the message's
  # role prefix, so an attribute-borne selection resolves to message_envelope.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
