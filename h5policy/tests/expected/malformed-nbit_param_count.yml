# An n-bit filter descriptor whose cd_nelmts disagrees with its own cd_values[0].
#
# n-bit is SELF-DESCRIBING: H5Znbit.c:897 writes the actual parameter count into
# cd_values[0], and :935 refuses the read when `cd_nelmts != cd_values[0]`.
# Patching the descriptor's declared count leaves cd_values[0] saying something
# else, which is the disagreement libhdf5 rejects and h5policy accepted.
#
# DISTINCT FROM H5_CORRUPT_NBIT_PARAMS_OVERRUN, which is about a parameter TREE
# that walks past cd_nelmts.  Here the tree is untouched and the COUNT is the
# lie -- but because the count moved, the tree now also reaches past it, so this
# fixture legitimately emits BOTH findings.  That is why only PARAM_COUNT is
# required rather than asserting an exact finding set: the second finding is a
# true consequence of the same edit, not noise, and suppressing it would mean
# building a less honest fixture.
#
# h5py has no high-level n-bit spelling (it exposes set_scaleoffset but not
# set_nbit), so the generator sets filter ID 5 through the property-list API --
# the same route _build_dynamic_filter takes.  n-bit is a CORE filter, so
# libhdf5's own set_local callback computes the real parameter tree at creation
# and only the declared count is patched afterwards.  That matters: a
# hand-written tree would test the generator, not the library.
#
# libhdf5 opens it (rc=0) and fails the data read (rc=1), so this is an A+ soft
# warning with evidence -- no tolerance, no A~ predicate.
file: malformed/nbit_param_count.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FILTER_PARAM_COUNT]
expected_analysis:
  complete: true
  walk_started: true
  walk_completed: true
  continue_after_rejection: false
  findings_truncated: false
# MEASURED 2026-08-22 with `--exercise chunk_index`:
# outcome=rejected_in_traversal, status=unexercised.  libhdf5 OPENS the file and
# then refuses the read, so the family exercise never completes -- `unexercised`
# is the honest status, not a pass.  Declared as exactly [unexercised] so a drift
# to `verified` (libhdf5 accepting a n-bit parameter count it currently
# rejects) surfaces instead of passing quietly.
h5cve: {family: dataset_layout_filter_fill, allowed_statuses: [unexercised]}
forbidden: [crash, timeout, external_open, plugin_load, write]
