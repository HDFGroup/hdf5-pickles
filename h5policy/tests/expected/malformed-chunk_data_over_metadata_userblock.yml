# The chunk-data-over-metadata defect behind a 512-byte user block.
#
# Identical in construction to malformed/chunk_data_over_metadata.h5 -- one chunk
# record's data address set to 0 -- and present as a separate fixture for one
# reason: that check compares a RELATIVE address space against a PHYSICAL one,
# and getting the translation wrong is invisible at base 0.  Every other fixture
# for this invariant sits at base 0.
#
# The stored address is 0 in both files, and that is the contract: HDF5 addresses
# are relative to the superblock's base, so 0 means "the superblock" at base 0
# and at base 512 alike.  A generator writing a PHYSICAL offset here would sail
# past the superblock on a user-block file and produce a fixture that tests
# nothing -- which is exactly the confusion the pair exists to catch.
#
# MEASURED: libhdf5 returns the same bytes for both files -- first two int32
# values 1178880137 and 169478669, i.e. 0x46444889 and 0x0A1A0A0D, the file's own
# "\x89HDF\r\n\x1a\n" signature -- and exits 0.  So the defect and its silence
# are unchanged by the base address; only h5policy's ability to SEE it depends on
# getting the address spaces right.
#
# Same A~ treatment as its base-0 sibling: libhdf5 both opens and reads
# successfully, so there is no deeper evidence for the A+ path and the divergence
# is carried by the code-scoped chunk_over_metadata_only predicate.
#
# Paired with valid/userblock_chunked.h5, which it is patched from.
file: malformed/chunk_data_over_metadata_userblock.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_RAW_DATA_OVERLAPS_METADATA]
expected_analysis:
  complete: true
  walk_started: true
  walk_completed: true
  continue_after_rejection: false
  findings_truncated: false
# MEASURED 2026-08-22 with `--exercise chunk_index`: outcome=accepted,
# violations=[], family exercise 1/1 completed -> verified.  `verified` on a
# malformed fixture is the signature of this defect: the canary completes because
# libhdf5 accepts the corruption and serves the wrong bytes.
h5cve: {family: chunk_index, allowed_statuses: [verified]}
verification:
  # The same data/metadata overlap measured against a nonzero base address.
  reference_semantics_cases: [overlap]
forbidden: [crash, timeout, external_open, plugin_load, write]
