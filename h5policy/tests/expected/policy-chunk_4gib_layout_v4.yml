# The same 2**32 + 256 byte chunk as valid/chunk_4gib_layout_v5.h5, one layout
# version down.
#
# Not corruption.  libhdf5 declines to CREATE a chunk above 4 GiB below layout
# version 5 (H5Dchunk.c:917) but deliberately opens one, and says why in the
# source: "We don't allow creation of files with layout version < 5 with 64 bit
# chunks but we'll try to open them if they exist because they're not
# disallowed by the file format" (H5Dchunk.c:1181-1187).  MEASURED: h5dump 2.3.0
# opens this file and reports the chunk dimensions correctly.
#
# What IS true is that no library older than 2.0.0 can read it, which is a
# portability statement about the file rather than a defect in it -- the same
# convention as the external-link and VDS target-path advisories.  The advisory
# is reachable at layout version 4 alone: versions 1 to 3 encode no chunk index
# type, so their index is always the v1 B-tree and the geometry is genuinely
# unrepresentable (malformed/chunk_4gib_v1_btree_index.h5), while version 5 is
# the version in which it is fully legitimate.
file: policy/chunk_4gib_layout_v4.h5
profile: untrusted-strict
expected_decision: accept_with_warnings
expected_exit: 1
required_findings: [H5_ADVISORY_CHUNK_SIZE_REQUIRES_LAYOUT_V5]
h5cve:
  family: dataset_layout_filter_fill
  allowed_statuses: [verified]
forbidden: [reject_corrupt, crash, timeout, external_open, plugin_load, write]
