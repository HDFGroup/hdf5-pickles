# The chunk_dim_product_wrap_v5 geometry -- 2**31 x 2**31 x 4, a product of
# exactly 2**64 that wraps to ZERO -- with the Single Chunk address pointed at
# offset 0, so the chunk is ALLOCATED.
#
# WHY THIS FIXTURE EXISTS.  The unallocated sibling reads as fill values, so its
# READ path never touches the undersized chunk buffer.  Measured on develop
# 6533bcc0f6a (2.3.0) that made the read crash look fixed; it was not.  With the
# chunk allocated, a read-only H5Dread of element (1,0) -- or
# `h5dump -d /d -s 1,0 -c 1,1` -- SIGSEGVs the release build in H5VM_memcpyvv
# <- H5D__compact_readvv, and an assert-free ASan build reports SEGV there.  The
# asserted ASan build stops first on the chunk_block length assert in
# H5D__chunk_read.  i386 returns rc 0 (fill) on this geometry.
# See registry/cases/chunk-dim-product-64bit-overflow.yml.
#
# Layout version 5 on purpose: h5py's bundled 1.14.x refuses v5, so the
# differential phase cannot crash on it, where a v4 sibling would.
file: malformed/chunk_dim_product_wrap_alloc_v5.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_CHUNK_SIZE_PRODUCT_OVERFLOW]
expected_finding_evidence:
  H5_CORRUPT_CHUNK_SIZE_PRODUCT_OVERFLOW:
    field: layout.chunk_size_product_dimension
    actual: 4
    expected: 3
    comparison: less_than_or_equal
h5cve:
  family: dataset_layout_filter_fill
  # Allowed statuses live in registry/h5cve-matrix-policy.yml with the reason.
  require_oracle_alignment: true
verification:
  integer_overflow_and_allocation_budget: [integer_overflow]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
