# One dataset's chunk pointed at ANOTHER dataset's chunk.
#
# Two datasets sharing raw bytes is not a feature HDF5 has: the allocator gives
# every chunk and every contiguous extent its own space, so an overlap means one
# dataset serves the other's values.  MEASURED: /a is written as all 111s and /b
# as all 222s, and after crossing /a's first chunk onto /b's, h5dump prints
# "222, 222, 222, 222, 222" for the first five elements of /a and exits 0.
# A cross-DATASET read, silently.
#
# THE THIRD AND LAST MEMBER of the extent-disjointness family, completing it:
#   RAW_DATA_OVERLAPS_METADATA  -- data over the file's own metadata
#   RAW_DATA_OVERLAPS_DATA      -- data over another dataset's data  <- this
# A separate code from its sibling rather than one "extents must be disjoint"
# finding, because the two say different things to a reader: one means a dataset
# serves the file's metadata, the other that it serves another dataset's bytes.
# Both are `ambiguous` with route shards, since either layout (chunk record or
# contiguous) can be on either side.
#
# WHY IT IS REPORTED ON /b: whichever extent is validated SECOND detects the
# collision, and the walk reaches /b after /a.  The finding names the record it
# was checking, not the one recorded earlier -- there is only one direction here,
# unlike the metadata sibling, because both sides are raw data.
#
# BOTH DATASETS ARE UNFILTERED so nothing can notice the substitution, and they
# carry distinct CONSTANT patterns rather than aranges so the wrong answer is
# unmistakable in a dump rather than a plausible-looking sequence.
#
# RE-DECODE IS DISTINGUISHED FROM ALIASING, which is what makes this check safe
# on valid files: each recorded extent carries the file offset of the record that
# declared it, and an overlap is only reported when the two records differ.  The
# same record decoded twice would otherwise report itself as overlapping itself.
# Node-level dedup and the once-per-analysis extent reset make that unlikely, but
# "unlikely" is not a basis for a check that could reject a valid file.
#
# Same A~ treatment as the rest of the family: libhdf5 both opens and reads
# successfully, so no return code carries the defect.
file: malformed/chunk_data_over_other_dataset.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_RAW_DATA_OVERLAPS_DATA]
expected_analysis:
  complete: true
  walk_completed: true
  extent_overlap_truncated: false
# MEASURED 2026-08-23 with `--exercise chunk_index`: outcome=accepted,
# violations=[], family exercise 2/1 completed -> verified.  `verified` on a
# malformed fixture again marks a silent-wrong-data defect: the canary completes
# because libhdf5 reads both datasets happily, one of them wrongly.
h5cve: {family: chunk_index, allowed_statuses: [verified]}
verification:
  # Two datasets sharing one raw extent -- the overlap case between two
  # objects of the same kind.
  reference_semantics_cases: [overlap]
forbidden: [crash, timeout, external_open, plugin_load, write]
