# A local heap whose data segment is legally NOT contiguous with its prefix.
# Everything is well-formed; only the segment's address differs from the shape
# h5py happens to write, and libhdf5 produces exactly this whenever a heap grows
# and its segment is reallocated elsewhere.
#
# THE REGIME CONTROL for malformed/lheap_dblk_size_unbounded.h5.  That fixture
# depends on a non-contiguous segment to reach the unbounded cache-load path, so
# without this control a "fix" that simply rejected non-contiguous segments would
# leave every malformed fixture in this family passing while breaking real files.
# Built by the same generator transform, minus the size defect.
file: valid/lheap_dblk_relocated.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
forbidden: [crash, timeout, external_open, plugin_load, write]
