# The same rule reached through a VERSION 1 contiguous layout -- the shape of the
# corpus specimen that exposed this gap, and a regime the corpus could not
# express: h5py writes layout version 3 even at libver="earliest", and h5policy's
# v1/v2 branch previously handled only chunked and compact, so a v1 contiguous
# layout's data address was never decoded at all.
#
# Version 1 is also where the stored size is provably irrelevant: libhdf5
# DISCARDS it and recomputes from the dataspace (H5Dcontig.c:536-551), so the
# computed extent is the only one that exists.  libhdf5 rejects at
# H5Dcontig.c:411.
file: malformed/contiguous_v1_computed_extent_past_eof.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LENGTH_OVERFLOW]
h5cve:
  family: address_space_bounds
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
verification:
  # The version-1 layout route to the same out-of-file computed extent.
  count_and_extent_boundaries: [out_of_file]
forbidden: [crash, timeout, external_open, plugin_load, write]
