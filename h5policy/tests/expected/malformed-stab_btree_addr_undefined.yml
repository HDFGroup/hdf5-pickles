# An old-style group's symbol-table message names an UNDEFINED B-tree address;
# libhdf5 reaches the heap first and the B-tree immediately after, one stack frame deeper.
# libhdf5 does not read undefined as absent: H5G__stab_iterate protects the heap
# unconditionally (H5Gstab.c:488) and the open dies in the sec2 driver
# ("addr undefined, addr = 18446744073709551615").  h5policy used to return
# early here, treating an undefined address as "no traversable symbol table".
# H5G__stab_create always allocates both (H5Gstab.c:132, :136), so requiring
# them cannot cost a conforming file.
file: malformed/stab_btree_addr_undefined.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SYMBOL_TABLE_ADDRESS_UNDEFINED]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
