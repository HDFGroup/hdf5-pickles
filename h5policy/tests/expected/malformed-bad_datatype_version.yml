# A fixed-point datatype message at version 6 -- past the latest defined.
#
# The positive fixture for datatype.version_supported, which had none of its own:
# malformed/bad_reference_datatype_version.h5 used to trip that rule through a
# gate rejecting `class 7 && version != 1`, and the gate was a false positive.
# H5T_STD_REF is class 7 at version 4 by construction (H5T_INIT_TYPE_REF_COMMON,
# src/H5T.c), so it refused every file using a modern reference; libhdf5 itself
# imposes no class-7 version constraint (H5Odtype.c:637). With the gate removed
# that fixture asserts datatype.reference_encode_version, and this one asserts
# the version rule on its own terms.
#
# Version 6, not 0: libhdf5 bounds the version at both ends, and an over-range
# version has to be raised again whenever a new version is defined -- a visible
# edit, where a version of 0 would quietly keep passing forever.
#
# libhdf5 refuses it (measured: h5py raises KeyError opening /d; h5dump reports
# an internal error), so rejecting is invariant-A clean.
file: malformed/bad_datatype_version.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_UNSUPPORTED_DATATYPE_VERSION]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: datatypes
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
