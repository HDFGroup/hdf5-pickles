# A vlen MEMBER of a compound attribute naming a heap object the collection does
# not contain.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
#
# The regime this fixture exists for: a top-level vlen attribute keeps its heap ID
# at element offset 0, but a vlen MEMBER keeps it at the member's byte offset, and
# nothing computed member offsets. So a compound attribute could carry any heap ID
# at all -- measured on an unmodified prior build, which accepts this file. The
# offsets are now collected during the datatype walk itself, because advancing
# from one compound member to the next needs each child's consumed size and only
# that walker computes it.
#
# The element is {int32, vlen str}, so the ID sits at member offset 4 and the
# element stride is 4 + (4 + sizeof_offsets + 4). ELEMENT ONE is patched, not
# element zero: a slot offset that is right for the first element and wrong
# afterwards would still pass a zeroth-element test, so this pins the stride as
# well as the member offset.
#
# libhdf5 refuses to read the attribute (h5py raises OSError); h5dump -A prints
# "unable to print data" and still exits 0, so judge by output, not exit status.
file: malformed/attr_compound_vlen_member_idx.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_HEAP_OBJECT_MISSING]
h5cve:
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
