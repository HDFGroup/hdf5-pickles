# A metadata-cache-image entry that names cache ring 6. H5C_RING_NTYPES is 6
# (H5Cprivate.h), one past H5C_RING_SB, so 6 is the first value the read path
# refuses (H5Cimage.c:2774, "ring is out of valid range"). Every other envelope
# field is well formed, so the ring is the only defect.
#
# Ring 0 (H5C_RING_UNDEFINED) is deliberately NOT the fixture value and is NOT
# rejected by h5policy: the read path bounds only the top of the range, and the
# `ring > H5C_RING_UNDEFINED` relation is an assert in the write-side decoder
# only, so a Release build opens a zero-ring image. Rejecting it would make
# h5policy refuse a file libhdf5 accepts -- the same shape as the tracked
# mdci-lru-rank-assert-only divergence, which this check deliberately avoids
# adding a second instance of.
#
# Measured: h5dump -H exits 1 here and 0 on valid/cache_image.h5.
file: malformed/mdci_entry_bad_ring.h5
profile: legacy
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_MDCI_ENTRY_CLASS]
verification:
  # Cache ring 6 where H5C_RING_NTYPES is 6: the first out-of-range value.
  count_and_extent_boundaries: [n_plus_one]
forbidden_findings: [H5_CORRUPT_BAD_CHECKSUM, H5_CORRUPT_MDCI_ENTRY_FLAGS, H5_CORRUPT_MDCI_ENTRY_LRU_INCONSISTENT]
h5cve:
  family: cache_image_dependency_graph
  require_oracle_alignment: true
  # REMEASURED 2026-08-23: `verified`, not `violation`.  libhdf5 2.3.0 REJECTS
  # this file -- the first metadata protect fails with
  #   H5C_protect -> Can't load cache image
  #   -> H5C__reconstruct_cache_contents -> reconstruction of cache entry failed
  # because H5C__reconstruct_cache_entry bounds all three entry enums
  # (src/H5Cimage.c:2738-2782) at image-load time, for every entry.
  # The earlier `violation` was a probe artifact, not a libhdf5 divergence: the
  # cache-image load is ONE-SHOT (H5C_protect clears load_image before calling
  # it), and the probe's traversal retried after the failing first attempt and
  # reported the retry's success.  See the comment at the H5Ovisit3 retry in
  # h5policy/tools/probe/h5probe.c.
  allowed_statuses: [verified]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
