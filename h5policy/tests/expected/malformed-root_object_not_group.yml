# The superblock's root object header is dataset-shaped rather than a group.
# libhdf5 reaches the root path through group-open/traversal entry points and
# then fails inside dataset open because the root object carries dataset-only
# semantics.  h5policy should reject the role mismatch directly.
file: malformed/root_object_not_group.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_ROOT_OBJECT_NOT_GROUP]
h5cve: {family: address_space_bounds, allowed_statuses: [unexercised, verified]}
forbidden: [accept, crash, timeout, external_open, plugin_load, write]
