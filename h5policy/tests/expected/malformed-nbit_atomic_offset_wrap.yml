# An n-bit ATOMIC node whose precision + offset wraps a 32-bit sum.
#
# THE BOUND LIBHDF5 STATES AND CANNOT ENFORCE. H5Znbit.c guards the unpacker with
#   if (p.precision > p.size * 8 || (p.precision + p.offset) > p.size * 8)
# and every field of parms_atomic is `unsigned`, so the sum is evaluated in 32
# bits and wraps. Here precision is 16, size 4 and offset 0xfffffff0: the sum is
# 0 modulo 2**32, the guard passes, and the decoder proceeds with an offset of
# four billion. The identical three lines appear in the COMPRESS path with no
# guard at all, which is why h5policy checks the parameters rather than one
# direction of travel.
#
# THE BYTE ORDER DECIDES WHETHER MEMORY OR ONLY DATA IS CORRUPTED, and this
# fixture is BIG endian for that reason. H5Z__nbit_decompress_one_atomic computes
# `end_i = p->offset / 8` from the UNWRAPPED offset on the little-endian arm, so
# its descending loop never runs and the dataset merely decodes to zeros; the
# big-endian arm subtracts the offset from the datatype length, both bounds
# underflow into range, and the loop walks off the element.
#
# MEASURED on the 2.3.0 ASan build: heap-buffer-overflow WRITE of size 1 in
# H5Z__nbit_decompress_one_byte via H5Z__nbit_decompress_one_atomic. The stock
# build returns rc=0 and prints values, which is exactly why the divergence
# needs a recorded allowance rather than an exit code.
#
# The fixture is written with a REAL 16-bit-precision datatype, not by patching
# the precision: at precision == size * 8 libhdf5 sets its own need_not_compress
# flag and stores the chunk verbatim, so the decompressor never reads precision
# or offset and the fixture would prove nothing.
#
# Case record: registry/cases/nbit-atomic-precision-offset-wrap.yml
file: malformed/nbit_atomic_offset_wrap.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_NBIT_ATOMIC_BOUNDS]
expected_finding_evidence:
  H5_CORRUPT_NBIT_ATOMIC_BOUNDS:
    # The offset against the largest that still fits beside a 16-bit precision
    # in a 32-bit element.
    field: layout.nbit_atomic_bits
    actual: 4294967280
    expected: 16
    comparison: at_most
h5cve:
  family: dataset_layout_filter_fill
  # The divergence is real and must stay visible: the stock build reads this file
  # and returns 0.  The allowance lives in registry/h5cve-matrix-policy.yml with
  # its reason, not here -- an inline allowed_statuses would shadow it.
  require_oracle_alignment: true
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
