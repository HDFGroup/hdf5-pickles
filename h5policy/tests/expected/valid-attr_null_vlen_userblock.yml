# A NULL vlen attribute element in a file with a user block -- the regression
# control for a false positive the attribute heap-ID checks had when first
# written.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
#
# A NULL vlen element is encoded as heap address ZERO, and stored addresses are
# base-relative.  Testing that sentinel on the address AFTER the base-relative
# conversion compares base_addr + 0 against 0, which does not match once there
# is a user block -- so the walker took a valid NULL element for an ID naming
# the user block and rejected the file H5_CORRUPT_BAD_SIGNATURE.  The sentinel
# is now read from the raw field, before conversion.
#
# Measured both ways on this exact fixture: post-conversion test =>
# reject_corrupt, raw-field test => accept.  A file without a user block cannot
# discriminate, because base_addr is 0 there and the two tests agree; the user
# block is the whole point of the fixture.
file: valid/attr_null_vlen_userblock.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
h5cve:
  family: message_envelope
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
