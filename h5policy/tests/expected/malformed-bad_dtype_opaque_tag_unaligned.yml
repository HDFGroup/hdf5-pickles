# An opaque datatype whose declared tag length is 7 rather than 8.
#
# The tag is stored NUL-padded to an 8-byte boundary, so the length field is
# always a multiple of 8, and libhdf5 refuses any other value ("opaque flag
# field must be aligned").  h5policy used the field to size the tag when
# advancing through the message but never checked it, so an unaligned length
# was accepted -- and, worse than a missed diagnosis, it left the walker
# advancing by a different amount than libhdf5 would.
#
# libhdf5 writes tag "tag" as length 8: three characters, a terminator and four
# bytes of padding.  Dropping the declared length to 7 breaks the rule while
# leaving the tag bytes themselves in place, so the defect is the length field
# alone.
#
# The mask h5policy applies matches libhdf5's own: H5T_OPAQUE_TAG_MAX is 256, so
# the length occupies exactly the low byte of the class flags.
#
# libhdf5 rejects at dataset open, so this is a true A'.  Built by
# h5policy-gencorpus; a version-1 object header has no checksum to repair.
file: malformed/bad_dtype_opaque_tag_unaligned.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DATATYPE_OPAQUE_TAG_ALIGNMENT]
expected_finding_evidence:
  H5_CORRUPT_DATATYPE_OPAQUE_TAG_ALIGNMENT:
    field: datatype.opaque_tag_alignment
    actual: 7
    expected: 8
    comparison: multiple_of
expected_finding_evidence_locations:
  H5_CORRUPT_DATATYPE_OPAQUE_TAG_ALIGNMENT:
    - role: actual
      length: 1
      little_endian_value: 7
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: datatypes
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
verification:
  # A declared opaque tag length of 7 where the tag is NUL-padded to 8.
  count_and_extent_boundaries: [n_minus_1]
forbidden: [crash, timeout, external_open, plugin_load, write]
