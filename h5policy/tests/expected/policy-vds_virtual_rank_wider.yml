# The VDS mapping's VIRTUAL selection is widened by one degenerate dimension
# (start 0, stride 1, count 1, block 1), so the stored rank is 3 while the
# dataset's dataspace message says 2.  Nothing else changes: the selection
# covers the same elements, so the element-count equality libhdf5's mapping
# pre-check enforces is untouched, and the file stays the same length as its
# base (the growth is taken out of the global heap's trailing free object).
#
# A policy/ fixture rather than a malformed/ one, and the finding is a WARNING,
# because the measurements below say libhdf5 opens the file and reads it:
#
# Measured 2026-11-12 against libhdf5 2.3.0 (develop 78c25cf819f):
#   h5dump -H                                   exits 0, same output as the base
#   H5Dopen2 + H5Pget_virtual_vspace            reports vspace rank 2 -- NOT the
#                                               3 the file stores
# The reason is H5D__virtual_init (src/H5Dvirtual.c:2740), which patches every
# mapping's virtual_select extent to the DATASET's dataspace on each open:
#     H5S_extent_copy(storage->list[i].source_dset.virtual_select,
#                     dset->shared->space)
# So the stored rank is discarded and the disagreement is never surfaced to the
# caller.  That is what the finding reports: a stored field the library will not
# honour.
#
# This regime cannot be built through the API.  H5Pset_virtual accepts a wider
# vspace (measured: rank 3 against a rank-2 dataset, H5Pset_virtual rc=0,
# H5Dcreate2 rc=0), but the same patch runs before the layout is written, so the
# file that comes back carries rank 2.  Byte surgery is the only route, which is
# why the generator re-encodes the selection rather than writing one.
#
# The valid control is the unmodified base, policy/vds_hyperslab.h5: identical
# in every other byte, and it does NOT carry this finding.
file: policy/vds_virtual_rank_wider.h5
profile: legacy
expected_decision: accept_with_warnings
expected_exit: 1
required_findings: [H5_ADVISORY_VDS_VIRTUAL_SELECTION_RANK]
forbidden: [crash, timeout, external_open, plugin_load, write]
