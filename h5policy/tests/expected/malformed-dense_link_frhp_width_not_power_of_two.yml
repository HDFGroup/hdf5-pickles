# A dense-link doubling-table width of 3.
#
# H5VM_log2_of2 is a De Bruijn lookup that is only meaningful for powers of two;
# under NDEBUG it answers 28 for 3, so first_row_bits (37) exceeds the maximum
# heap size in bits (32), the unsigned subtraction forming max_root_rows wraps to
# 4294967292, and each of the four doubling-table arrays asks malloc for 32 GiB.
# Measured with a malloc interposer: a single request of 34359738336 bytes.
# H5MM_malloc is a bare malloc (H5MMprivate.h), so nothing but the allocator
# bounds it; under an address-space limit the allocation fails and libhdf5
# returns a clean error, which is why this fixture does not crash the reference
# library while the width-0 one does.
#
# It is the only fixture that exercises the power-of-two rule, because the widths
# that are neither 0 nor a wrap -- 7, 65535 -- are ACCEPTED by libhdf5 and a
# corpus fixture for them would hard-fail invariant A.  See
# registry/cases/fractal-heap-doubling-table.yml, section not_tracked.
file: malformed/dense_link_frhp_width_not_power_of_two.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FRACTAL_HEAP_DOUBLING_TABLE]
h5cve:
  family: dense_index
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
