# Chunk dimensions 2527330632 x 1824726041 with a four-byte element size: a
# product of 2**64 + 32, which wraps to a NONZERO 32 bytes.  Layout version 5,
# Single Chunk address pointed at offset 0 so the chunk is allocated.
#
# A nonzero wrap is the regime the zero-wrap fixtures cannot express: it passes
# `assert(layout->u.chunk.size > 0)` in H5D__chunk_lock, so the fault reaches
# assert-enabled builds too.  MEASURED on develop 6533bcc0f6a (2.3.0): a
# read-only H5Dread of element (1,0) SIGSEGVs the release and the i386 builds,
# and both ASan builds (asserts live and off) report SEGV in H5VM_memcpyvv <-
# H5D__compact_readvv.  The access is wild, not adjacent: with four-byte
# dimension encoding dim[1] >= 2**30, so element (1,0) sits gigabytes past the
# 32-byte buffer.  See registry/cases/chunk-dim-product-64bit-overflow.yml.
#
# The generator asserts the regime: wrapped size exactly 32, Single Chunk index,
# unfiltered, unallocated before the patch and allocated after it.
file: malformed/chunk_dim_product_wrap_small_alloc_v5.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_CHUNK_SIZE_PRODUCT_OVERFLOW]
expected_finding_evidence:
  H5_CORRUPT_CHUNK_SIZE_PRODUCT_OVERFLOW:
    field: layout.chunk_size_product_dimension
    actual: 4
    expected: 3
    comparison: less_than_or_equal
h5cve:
  family: dataset_layout_filter_fill
  # Allowed statuses live in registry/h5cve-matrix-policy.yml with the reason.
  require_oracle_alignment: true
verification:
  integer_overflow_and_allocation_budget: [integer_overflow]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
