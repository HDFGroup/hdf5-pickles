# A complex number datatype whose declared element size (16) is NOT twice its
# base float's size.  The H5T_COMPLEX arm of H5O__dtype_decode_helper never
# checks the relation that the ENUM and ARRAY arms enforce (and that the only
# writer, H5T__complex_create, guarantees: size == 2 * base_size), so the type
# is accepted.  The complex-to-complex and float-to/from-complex conversion
# loops then read and write at the base float's bit positions (here a 240-byte
# float with its mantissa at bit 255) while striding by the declared size,
# reading and writing out of bounds.  h5policy rejects the inconsistency at the
# datatype message, before any conversion.
#
# libhdf5 ACCEPTS this file: a plain open, or a read using the file's own type
# as the memory type, performs no conversion and does not fault.  The datatype
# canary therefore reads one element converting to the native complex type (the
# shape H5Tget_native_type returns, which differs from the file type here),
# which reaches the conversion loop: silent out-of-bounds on a stock build, a
# heap-buffer-overflow on a sanitizer build.  Written at the earliest bound so
# the datatype message sits in a version-1 object header with no checksum to
# repair.
#
# Full record: registry/cases/complex-size-not-twice-base.yml.
file: malformed/complex_size_not_twice_base.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DATATYPE_COMPLEX_SIZE]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: datatypes
  # libhdf5 opens this file and converts out of bounds; the exact-build canary
  # must not report the divergence as agreement.  With require_oracle_alignment
  # the matrix forces a divergent row to `violation`; a sanitizer build reaches
  # the same via a real heap-buffer-overflow.
  require_oracle_alignment: true
  allowed_statuses: [unexercised, violation]
forbidden: [crash, timeout, external_open, plugin_load, write]
