# A metadata-cache-image entry declaring age 101.
# H5AC__CACHE_IMAGE__ENTRY_AGEOUT__MAX is 100 (H5ACpublic.h), so 101 is the first
# value out of policy range (src/H5Cimage.c, "entry age is out of policy
# range"). Every other envelope field is well formed, so the age is the only
# defect.
#
# As with mdci_entry_bad_type_id.h5, the bound was introduced by the
# CVE-2025-6269 fix; before it the age byte was decoded and used unchecked. The
# tolerance is therefore A+, not plain alignment:
#
#   2.3.0 (h5dump/h5debug, post-fix) REJECTS -- h5dump -H exits 1 here and 0 on
#   valid/cache_image.h5 -- reaching the bound lazily, at the first
#   object-header protect rather than at open.
#
#   1.14.5 (the h5py the harness measures with, pre-fix) ACCEPTS: it opens the
#   file, lists the root group and reads the dataset back correctly.
#
# See malformed-mdci_entry_bad_type_id.yml for the sibling measurement and
# registry/cases/mdci-entry-enum-bounds-version-straddle.yml for the full
# version split, including why an A+ in this family is not evidence about depth
# of access. The h5dump/h5debug/h5dump-data exits are the deeper evidence the
# harness demotes the A+ on.
file: malformed/mdci_entry_bad_age.h5
profile: legacy
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_MDCI_ENTRY_CLASS]
forbidden_findings: [H5_CORRUPT_BAD_CHECKSUM, H5_CORRUPT_MDCI_ENTRY_FLAGS, H5_CORRUPT_MDCI_ENTRY_LRU_INCONSISTENT]
h5cve:
  family: cache_image_dependency_graph
  require_oracle_alignment: true
  allowed_statuses: [unexercised, violation]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
