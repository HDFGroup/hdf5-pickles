# The OTHER way an object in a global heap collection can fail to advance the
# parse.  resource-gheap_infinite_loop.yml covers the index-0 free-space
# sentinel, whose declared size is used raw (src/H5HGcache.c:358).  This fixture
# uses a NORMAL object, index 1, and gets there through arithmetic:
#
#   need = H5HG_SIZEOF_OBJHDR(f) + H5HG_ALIGN(obj[idx].size)      (:353)
#
# is unchecked size_t.  H5HG_ALIGN is 8*((X+7)/8) and H5HG_SIZEOF_OBJHDR is 16
# for 8-byte lengths, so the eight declared lengths [SIZE_MAX-22, SIZE_MAX-15]
# wrap that sum to exactly zero.  This fixture declares SIZE_MAX-15; its
# neighbour resource-gheap_need_wrap_below.yml declares SIZE_MAX-23, one below
# the window, and must stay `accept`.
#
# The bounds check on the next line cannot catch it: H5_IS_BUFFER_OVERFLOW
# short-circuits on `(size) != 0`, so a `need` of zero is exactly the value it
# is defined to ignore.  `p = begin + 0` leaves the loop condition unchanged.
#
# MEASURED, not deduced -- though not on this file.  THIS fixture is orphaned, so
# libhdf5 never loads its collection; the measurement is from a reachable carrier
# of the same length, a vlen-attribute file whose data references the collection.
# There, rewriting one object length to 2**64-16 makes both a release and an
# AddressSanitizer build of libhdf5 2.3.0 fail to terminate on an ordinary
# H5Aread, with ZERO sanitizer reports -- a liveness failure, nothing read out of
# bounds.  A sanitizer-first approach misses this family entirely, which is also
# true of the sentinel half.  Read the reach of the fixture and the reach of the
# measurement separately.
#
# This contradicts the reasoning recorded in
# registry/cases/global-heap-zero-progress-sentinel.yml, which had the index > 0
# arm as "structurally positive"; that record now carries the correction and the
# wrap trigger.  Same defect, same invariant (heap.global_progress), two
# entrances -- which is why the two fixtures are a pair and not a duplicate.
#
# Nothing references the collection, so only the forensic profile's GCOL
# signature sweep finds it; the reachability profiles correctly accept.  Built by
# h5policy-gencorpus, which appends the collection to a valid empty file.
file: resource/gheap_need_wrap_zero.h5
profile: forensic
expected_decision: reject_resource
expected_exit: 4
required_findings: [H5_RESOURCE_GLOBAL_HEAP_INFINITE_LOOP]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: heap_structures
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
