# A contiguous dataset whose STORED size alone reaches past the end of file, with
# a valid address and a valid dataspace.  THIS FILE MUST NOT BE REJECTED:
# libhdf5 opens it and returns every correct value, because it never bounds that
# field -- so reject_corrupt would be an invariant-A violation.  MEASURED with
# the field at 10,000,000 in a ~2.4 KB file: h5dump -H and h5dump -d both exit 0
# and all 100 values read back, and the probe reports `accepted`.
#
# Reported as a WARNING rather than ignored, because the field is live for layout
# version 3 and later: libhdf5 keeps it and uses it as store.contig.dset_size on
# the I/O path (H5Dcontig.c:227, :637), as the length handed to H5MF_xfree on
# delete (:352), as the sieve-buffer bound (:559), and as the answer
# H5Dget_storage_size returns (H5Dint.c:2572).
#
# This fixture is the guard against re-tightening it: h5policy previously called
# this corrupt, which is the false positive the warning replaces.
file: valid/contiguous_stored_size_past_eof.h5
profile: untrusted-strict
expected_decision: accept_with_warnings
expected_exit: 1
# Carries BOTH stored-size advisories now: the size is out of range AND unequal
# to the computed extent. Pinned together so neither rule can silently stop
# firing while the other keeps the fixture green.
required_findings: [H5_ADVISORY_CONTIGUOUS_STORED_SIZE_PAST_EOF,
                   H5_ADVISORY_CONTIGUOUS_STORED_SIZE_MISMATCH]
forbidden: [reject_corrupt, crash, timeout, external_open, plugin_load, write]
