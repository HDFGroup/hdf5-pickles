# A v0 superblock whose driver-info address (bytes 48-55) points at byte 255 --
# inside the root group's v1 B-tree node (address 136 in this base file) --
# declaring a 1 MiB driver-specific body in a ~2 KB physical file.
#
# Same defect, different placement, as malformed/drvinfo_block_len_past_eof.yml:
# this is the LENGTH half of registry/cases/driver-info-block-fields-unbounded.yml,
# still unfixed upstream. The length authorises itself (it is added to the
# driver address to compute a minimum EOA, and the EOA is then EXTENDED to
# cover it, src/H5Fsuper_cache.c), so every downstream "is this extent within
# the EOA?" test is satisfied by construction regardless of WHERE the address
# points. Measured: h5dump -H exits 0 and h5py opens and lists the file.
#
# WHY A SEPARATE FIXTURE FROM THE APPENDED-AT-EOF ONE. Both exercise the same
# h5policy code path (the bound does not distinguish placement), so this adds
# no new coverage by itself -- it exists as a permanent regression pin for a
# real corpus specimen (8ea51ffef5a0..., ~/specimens sweep, 2026-09-03) whose
# driver-info address was byte 255 in a 4096-byte file, declaring a ~48 MiB
# body. Reproduced at the same offset with the 1 MiB body every drvinfo
# fixture in this file uses (see malformed-drvinfo_block_len_past_eof.yml for
# why 1 MiB and not the wild value: a length near 2**32 can make an uncapped
# h5dump OOM the whole session).
#
# Tracked in h5policy-diff-tolerances.yml against the case record above.
file: malformed/drvinfo_block_aliases_root_btree.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DRVINFO_BLOCK_EXTENT]
verification:
  # A declared 1 MiB of driver-specific bytes aliasing the root B-tree node,
  # four orders of magnitude past the physical file.
  count_and_extent_boundaries: [out_of_file]
forbidden_findings: [H5_CORRUPT_UNSUPPORTED_DRVINFO_VERSION, H5_CORRUPT_OFFSET_OUT_OF_FILE]
h5cve:
  # Measured `unexercised`: this family's canary is free_space
  # (H5Fget_free_sections) and this file has no free-space managers, so the
  # canary cannot reach the defect. require_oracle_alignment is deliberately
  # ABSENT -- this fixture is known-divergent by design, and the divergence is
  # tracked in registry/h5policy-diff-tolerances.yml against the case record
  # rather than asserted here.
  family: validation_controls
  allowed_statuses: [unexercised]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
