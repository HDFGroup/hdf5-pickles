# An IEEE double whose exponent range is shifted up one bit so that it covers
# the sign bit.
#
# libhdf5 requires the sign, exponent and mantissa to describe disjoint bit
# ranges and refuses any overlapping pair -- H5O__dtype_decode_helper fails with
# "exponent and sign positions overlap".  h5policy bounds-checked each range
# against the storage size but never compared them against each other, so an
# overlapping type was accepted: a tier-2 A' divergence, now closed.  h5py
# cannot open the dataset, so this is a true A'.
#
# Overlap is not a range error, which is why it needs its own check and its own
# scope (record_local, not local_decode): every field here is individually in
# bounds.  What is wrong is the relationship -- bit 63 would have to be read as
# both the sign and the top exponent bit, so no two consumers can agree on the
# value the datatype describes.
#
# libhdf5 writes epos 52, esize 11, mpos 0, msize 52 and sign 63 for a
# little-endian double.  Raising epos to 53 puts the exponent at bits 53..63.
# That still fits the storage exactly -- esize 11 == 64 - 53, sitting right on
# the bound rather than past it, so the existing exponent bounds check stays
# silent -- and still clears the mantissa at bits 0..51.  Exactly one of the
# three pairs therefore overlaps, which is what makes this a clean single-defect
# case; the other two pairs are exercised by the unit suite, where the bit
# layouts needed to isolate them are easier to build than in a real file.
#
# Built by h5policy-gencorpus at the earliest library bound; a version-1 object
# header has no checksum to repair.
file: malformed/bad_dtype_float_overlap.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DATATYPE_FLOAT_OVERLAP]
forbidden_findings:
  - H5_CORRUPT_DATATYPE_FLOAT_EXPONENT
  - H5_CORRUPT_DATATYPE_FLOAT_SIGN
  - H5_CORRUPT_DATATYPE_FLOAT_MANTISSA
expected_finding_evidence:
  H5_CORRUPT_DATATYPE_FLOAT_OVERLAP:
    field: datatype.float_sign_exponent_disjoint
    actual: 63
    expected: 53
    comparison: outside
expected_finding_evidence_locations:
  # The exponent position/size byte pair that was moved.
  H5_CORRUPT_DATATYPE_FLOAT_OVERLAP:
    - role: actual
      length: 2
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: datatypes
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
