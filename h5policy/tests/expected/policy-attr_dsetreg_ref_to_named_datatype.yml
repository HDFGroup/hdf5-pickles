# An attribute holding two region references, written by libhdf5's own
# reference API as H5T_STD_REF_DSETREG (deprecated H5Rcreate).  Element 0 names the dataset that holds the
# attribute (an in-file control); element 1 names a committed datatype.
#
# Nothing here is malformed -- libhdf5 writes it without complaint -- so the
# finding is a warning: H5Ropen_region opens a region reference's target and
# hands it to the dataset dataspace callback without checking its type.
# libhdf5 2.3.0 (measured): H5Aread of the attribute as H5T_STD_REF fails
# cleanly -- the legacy conversion reads the target's dataspace message, and a
# committed datatype has none.  The warning still holds: the reference names a committed datatype.
#
# Exactly one finding: the control element must stay silent.  The evidence's
# `actual` is H5O_type_t of the target (2), `expected` is a dataset (1).
#
# Written by h5policy/tools/probe/make_region_target_attr.c, which asserts the
# target kinds before writing.
file: policy/attr_dsetreg_ref_to_named_datatype.h5
profile: untrusted-strict
expected_decision: accept_with_warnings
expected_exit: 1
required_findings: [H5_ADVISORY_REGION_REFERENCE_TARGET_NOT_DATASET]
expected_finding_counts:
  H5_ADVISORY_REGION_REFERENCE_TARGET_NOT_DATASET: 1
expected_finding_evidence:
  H5_ADVISORY_REGION_REFERENCE_TARGET_NOT_DATASET:
    field: attribute.region_reference_target
    actual: 2
    expected: 1
    comparison: equal
expected_finding_evidence_locations:
  H5_ADVISORY_REGION_REFERENCE_TARGET_NOT_DATASET:
  - role: actual
    length: 8
h5cve:
  family: message_envelope
  exercise: region_reference
  # Measured: the legacy encoding is converted at H5Aread time against the
  # target's dataspace message, which a real committed datatype lacks, so the read is
  # refused cleanly and H5Ropen_region is never reached.
  allowed_statuses: [unexercised]
forbidden: [crash, timeout, external_open, plugin_load, write]
