# A version-4 chunked layout claiming zero dimensions on a ONE-DIMENSIONAL
# dataset.  Same defect as malformed/layout_v5_zero_ndims.h5, same oracle
# finding, opposite libhdf5 outcome -- and the difference is not in the layout
# message at all.
#
# THIS FIXTURE IS THE CRASH REPRODUCER.  Its sibling is not, and until this file
# existed the corpus pinned the oracle rule with no regression test for the
# libhdf5 fault.  The selector is THE DATASPACE RANK:
#
#   H5D__chunk_init computes scaled dimension info under
#   `if (dset->shared->ndims > 1)` (src/H5Dchunk.c:1139).  That block holds a
#   correctly ordered zero check -- guard at :1146, error at :1147, before the
#   division at :1150 -- and it runs BEFORE the call to H5D__chunk_set_info at
#   :1175.  So a rank-2 dataset is refused cleanly at :1147.
#
#   Rank 1 skips the whole block and falls through to H5D__chunk_set_info_real,
#   where the division at :733 precedes the dim[u] == 0 guard at :738.  With
#   the layout's dimension vector never decoded (the loop runs `ndims` times,
#   and ndims is 0), dim[0] is zero and the division faults.
#
# MEASURED, `--exercise dataset_layout`, both builds 2.3.0 by version string:
#   develop aa9df72cc21 (pre-fix)   outcome=crashed, signal 8 (SIGFPE)
#   develop b7b85e7abf9 (post-fix)  rejected_in_traversal, at src/H5Olayout.c:592
# The fault is from public H5Dopen2 -- no read, no filter, no plugin -- and
# h5dump -r and h5ls -r die of it too (exit 136).  Line numbers pinned to
# develop b7b85e7abf9.
#
# VERSION 4, DELIBERATELY.  v4 and v5 encode this message identically, but the
# reference library h5py links (1.14) refuses a v5 layout on the version gate
# and never reaches the defect, so a v5 spelling would make the differential
# harness agree for the wrong reason.  v4 also carries the defect to every
# release since 1.10.0, where layout v4 first appears.
#
# WHY IT IS NOT FIXED-AND-GONE.  The commit that stops it on develop
# (b7b85e7abf9) was fixing an unrelated CVE and added a check that compares the
# layout's dimensionality against the SIBLING DATASPACE message.  The v4+
# decoder still has no lower bound of its own, the division still precedes its
# guard, and no release contains the fix.  The libhdf5 defect, the affected
# range, and the ordering hazard -- fixing the division without adding the bound
# converts this crash into an out-of-bounds write -- are recorded in
# registry/cases/layout-v4-ndims-lower-bound-missing.yml.
file: malformed/layout_v4_zero_ndims_rank1.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LAYOUT_DIMENSIONALITY]
# Family named, but NO allowed_statuses here: the canary status is a reasoned
# exception to a libhdf5 defect and lives in registry/h5cve-matrix-policy.yml,
# which an expectation's own allowed_statuses would silently shadow.
h5cve: {family: dataset_layout_filter_fill}
verification:
  # The encoded dimensionality is exactly zero -- the lower boundary, and the
  # one the chunk-geometry division underflows from.
  count_and_extent_boundaries: [zero]
forbidden: [accept, crash, timeout, external_open, plugin_load, write]
