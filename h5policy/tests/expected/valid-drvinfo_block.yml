# A superblock-v0 file carrying a WELL-FORMED driver information block: version
# 0, an 8-byte driver-specific body, a declared length that matches it exactly,
# and an extent that lies inside the file.
#
# Not a malformed fixture, and deliberately not `accept`. It pins the COVERAGE
# REFUSAL on the v0/v1 driver-info path: h5policy decodes the envelope, finds
# nothing wrong with it, and still declines, because the driver-specific bytes
# are consumed by a VFD and can name member files h5policy does not validate.
# That is the same treatment h5policy_validate_drvinfo_payload gives an equally
# well-formed superblock-extension 0x0014 message -- the two encodings differ but
# the refusal is one policy, and this fixture is what stops the block path from
# drifting into a silent accept.
#
# The driver id is "NCSAtest", not "NCSAfami"/"NCSAmult": H5FD_sb_load (src/H5FD.c)
# refuses those two unless the file was opened with the matching VFD, which would
# make libhdf5 reject this file for a reason unrelated to what it tests. Any other
# name reaches H5FD__sb_decode, a no-op under sec2.
#
# Measured: h5dump -H exits 0 and h5py opens and lists the file, so libhdf5
# accepts it. h5policy neither accepts nor calls it corrupt -- the coverage gap
# is the honest third answer.
file: valid/drvinfo_block.h5
profile: untrusted-strict
expected_decision: unsupported_coverage_gap
expected_exit: 5
required_findings: [H5_UNSUPPORTED_PICKLE_COVERAGE_GAP]
forbidden_findings: [H5_CORRUPT_DRVINFO_BLOCK_EXTENT, H5_CORRUPT_UNSUPPORTED_DRVINFO_VERSION, H5_CORRUPT_OFFSET_OUT_OF_FILE]
forbidden: [accept, reject_corrupt, crash, timeout, external_open, plugin_load, write]
