# An attribute region reference whose selection declares 2**32-1 blocks.
#
# THE REGIME: a region reference's global-heap object is not opaque. It ends in a
# serialized H5S selection, and libhdf5 deserializes it -- sizing a coordinate
# buffer from a count the FILE supplies (H5S__hyper_deserialize,
# H5S__point_deserialize). In an ATTRIBUTE those bytes are METADATA, the same
# jurisdiction argument that made the heap ID itself checkable, and nothing
# looked inside the object before this.
#
# MEASURED divergence: libhdf5 refuses this file at the dereference ("buffer
# overflow while decoding selection coordinates") while valid/attr_heap_ids.h5
# dereferences to 4 elements -- and h5policy accepted it.
#
# The count is bounded by the bytes that actually follow it, which is what
# libhdf5 bounds it by (p_end), so no threshold is invented.
# Case record: registry/cases/attribute-selection-unvalidated.yml
file: malformed/attr_region_sel_blocks_over.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SELECTION]
h5cve:
  # Named mechanically from the primary finding via registry/findings/; the
  # selection codes are shared with the VDS layout and route on the message's
  # role prefix, so an attribute-borne selection resolves to message_envelope.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
