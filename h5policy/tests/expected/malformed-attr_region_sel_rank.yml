# An attribute region reference whose selection declares rank 2**32-1.
#
# libhdf5 states this once per deserializer, immediately after decoding the rank
# and before any rank-dependent work: `0 == rank || rank > H5S_MAX_RANK`.
# Measured -- it refuses with "rank of serialized selection does not match
# dataspace". The sibling malformed/vds_selection_rank_zero.h5 covers the ZERO
# end of the same range through the other role of the same sizer.
# Case record: registry/cases/attribute-selection-unvalidated.yml
file: malformed/attr_region_sel_rank.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SELECTION_RANK]
h5cve:
  # Named mechanically from the primary finding via registry/findings/; the
  # selection codes are shared with the VDS layout and route on the message's
  # role prefix, so an attribute-borne selection resolves to message_envelope.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
verification:
  # The declared rank is the 32-bit field at its maximum value.
  count_and_extent_boundaries: [max]
forbidden: [crash, timeout, external_open, plugin_load, write]
