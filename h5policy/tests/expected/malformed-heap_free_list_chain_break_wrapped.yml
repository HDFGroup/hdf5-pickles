# The chain-break fixture with its SURVIVING node's size wrapped: the full
# refuse-retain-reuse-corrupt sequence in one file, and the only corpus fixture
# that carries it.
#
# malformed/heap_free_list_chain_break.h5 next to it proves the BYPASS -- a
# rejection that does not survive being asked twice -- but its surviving node is
# the one libhdf5 itself wrote, which is legal, so nothing can come of reusing
# it.  This file makes that node's size 2**64-1, which wraps the additive bound
# at src/H5HLcache.c:258 (32 + (2**64-1) sums below any real dblk_size), so it
# PASSES the check and is published into heap->freelist at :265.  The chain then
# fails on its next entry, the data-block load fails with it, and the retained
# image makes the next protect skip the validation entirely -- handing over a
# heap whose free list contains a block claiming the entire address space.
#
# MEASURED, on the newest available build:
#   read side   first H5Lget_name_by_idx fails; the second and third succeed
#               and return a real link name.  h5policy-probe: `not_durable`.
#   write side  one H5Gcreate2 with a 160-character name SIGSEGVs; 120
#               characters completes.  The threshold is the arithmetic, not a
#               magic number: the surviving node sits at offset 200 in a
#               352-byte segment, so the insert overflows once `offset + need`
#               passes 352.
#
# TWO DEFECTS MEET HERE and both records need reading:
#   registry/cases/local-heap-failed-load-retains-image.yml -- why a refused
#     heap is used at all.  This fixture is what its coverage gap asked for.
#   registry/cases/local-heap-free-list-bound-wraps.yml -- why the surviving
#     node is dangerous once it is used.
# Neither alone produces this: the wrap without the chain failure is
# malformed/heap_free_list_size_wrap.h5, which libhdf5 ACCEPTS outright and
# which needs no bypass; the chain failure without the wrap is
# malformed/heap_free_list_chain_break.h5, which bypasses and corrupts nothing.
#
# WHAT ASSERTS WHAT.  This expectation asserts the oracle verdict.  The bypass is
# asserted by the probe's durability pass, and the memory error by
# tests/check_heap_write_path.py -- the only phase that opens RDWR, because the
# corpus runner, the probe and the differential harness are all read-only by
# design.
file: malformed/heap_free_list_chain_break_wrapped.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LOCAL_HEAP_FREE_LIST]
expected_analysis:
  complete: false
  walk_started: true
  walk_completed: false
  stop_reason: rejection
  continue_after_rejection: false
  findings_truncated: false
h5cve:
  # MEASURED, not defaulted: the canary matrix reports `unexercised` here, and
  # that is the honest answer rather than a pass -- libhdf5's heap data-block
  # load fails, so the heap_structures family surface is never reached and the
  # probe has nothing to exercise.  Matches the sibling
  # malformed/bad_heap_free_list.h5, which libhdf5 also refuses.
  #
  # `verified` is deliberately NOT permitted.  A flip to it would mean libhdf5
  # started exercising the family on a file it currently refuses, which is worth
  # investigating rather than silently allowing.
  family: heap_structures
  require_oracle_alignment: true
  allowed_statuses: [unexercised]
forbidden: [crash, timeout, external_open, plugin_load, write]
