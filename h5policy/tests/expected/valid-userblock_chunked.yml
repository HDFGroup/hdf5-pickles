# Chunked dataset behind a 512-byte user block: the base-address control for
# chunk.data_disjoint_from_metadata, and the file its malformed sibling is
# patched from.
#
# WHY A SEPARATE USER-BLOCK CONTROL.  That check compares two address spaces --
# chunk data extents against accounted metadata extents -- and every stored HDF5
# address is RELATIVE to the superblock's base while walk addresses, the reached
# set and findings offsets are all PHYSICAL.  Mixing them is invisible at base 0
# and wrong at base 512, so it is a user-block-only bug, and every other fixture
# for this check sits at base 0 where it could not be seen.
#
# Concretely, the failure this pair rules out: if metadata extents were recorded
# base-relative while chunk addresses stayed physical, then at base 512 the
# superblock's extent would sit at [0, sb_size) while a chunk pointed at it sat
# at 512 -- no overlap, silent FALSE NEGATIVE.  This file passing and
# malformed/chunk_data_over_metadata_userblock.h5 being caught is what says the
# two spaces agree.
#
# Verified alongside this: a matched pair of richer files built identically at
# base 0 and base 512 (v1-btree, extensible-array and filtered chunks plus dense
# links) produces byte-identical decisions and findings, and detection fires at
# user block sizes 512, 1024, 2048 and 8192.
#
# userblock_earliest.h5 also carries a chunked dataset, so this control is not
# the only user-block coverage -- it exists so the malformed sibling differs from
# a passing file by exactly one address field.
file: valid/userblock_chunked.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
# MEASURED 2026-08-22 with `--exercise chunk_index`: outcome=accepted,
# violations=[], family exercise 1/1 completed -> verified.
h5cve: {family: chunk_index, allowed_statuses: [verified]}
forbidden: [crash, timeout, external_open, plugin_load, write]
