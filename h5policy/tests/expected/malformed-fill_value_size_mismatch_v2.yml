# The version-2 half of the fill-size pair.  Its sibling,
# malformed-fill_value_size_mismatch.yml, is version 3.
#
# H5O__fill_new_decode (src/H5Ofill.c:189) decodes fill message versions 1, 2
# and 3 in ONE function and compares the fill size to the datatype on NONE of
# them: it receives the object header as `open_oh` and marks it H5_ATTR_UNUSED,
# which is exactly the handle H5O__fill_old_decode uses to enforce the relation
# (:370).  Versions 1 and 2 take the `fill->version < H5O_FILL_VERSION_3` branch
# at :213; version 3 takes the branch at :264.  The sibling fixture only covers
# the second.  This one covers the first, so a fix that guards one branch and
# not the other cannot pass the corpus.  That is the entire point of the pair --
# do not "consolidate" them.
#
# Shape copied from the /Array_be dataset of the version-2 case specimen:
# an 8-byte declared fill behind a 1032-byte opaque datatype, so H5D__fill ->
# H5S_select_fill -> H5VM_array_fill copies 1032 bytes out of an 8-byte
# allocation -- a 1024-byte over-read, four times the sibling's 255.
#
# Byte-patched because no libver can write it: H5O_fill_ver_bounds maps
# EARLIEST to version 1 and every later bound to version 3, and current libhdf5
# reaches version 2 only in memory, by normalising the OLD message.  Built by
# h5policy-gencorpus _make_fill_value_size_mismatch_v2, which writes a v3
# message with h5py and rewrites the payload in place -- the v1/v2 layout is two
# bytes longer (version, alloc_time, fill_time, defined, size(4), value versus
# version, flags, size(4), value) -- then repairs the object-header checksum.
# Without that repair libhdf5 rejects the file before H5D__fill is ever reached
# and the fixture would prove nothing.
#
# The message tail is left zero-filled rather than reclaimed: both branches stop
# after `size` value bytes and never look further.  Datatype, dataspace and
# layout are exactly as h5py wrote them, which is what keeps this single-defect
# -- confirmed on generation, one finding and a complete walk.  That matters,
# because the A~ predicate fill_value_size_mismatch_only in
# h5policy/tools/h5policy-diff requires ALL findings on the file to be this code;
# any second finding here would turn the divergence into a hard A failure.
#
# The libhdf5 defect both fixtures isolate is recorded in
# registry/cases/fill-value-size-unchecked-in-new-decoder.yml.
#
# `allowed_statuses: [verified]` is the same split the version-3 sibling
# documents: the stock build does NOT fault on this file, so the canary is the
# leaking path rather than a crash, and `verified` is correct where `violation`
# would be wrong.  Do not read it as libhdf5 handling the file properly.
#
# MEASURED on the stock build 2026-08-15, with the version-3 bundle's
# fill-leak-probe.c rebuilt against it: H5Dread returns 0, tsize=1032, and 178
# of the 1024 bytes past the 8-byte declared fill come back non-zero.  Byte 24
# is 0x21 -- a 32-byte glibc chunk size with PREV_INUSE set -- so the read is
# walking allocator metadata, the same signature the sibling shows at the same
# offset (0x61 there).  Three times the sibling's 60 leaked bytes, because the
# shortfall is 1024 rather than 255.  The concern that a 1024-byte over-read
# might cross into an unmapped page and fault was checked and did not happen.
#
# MEASURED on the ASan build the same day: outcome=crashed, signal 6,
# heap-buffer-overflow, "READ of size 1032".  The stack is byte-for-byte the
# sibling's six frames at the same source lines -- memcpy <- H5VM_array_fill
# (src/H5VM.c:753) <- H5S_select_fill <- H5D__fill (src/H5Dfill.c:254) <-
# H5D__read <- H5VL__native_dataset_read -- with only the width differing,
# 1032 against 256.  That is why the pair is a pair: the two decode branches
# diverge only inside H5O__fill_new_decode and reconverge on one unsafe copy.
#
# Note the leak probe labels its output "bytes 1..1031", hardcoded for the
# sibling's 1-byte fill; here the legitimate fill is 8 bytes and the leak
# starts at byte 8.  The count is unaffected -- bytes 1..7 are fill and zero --
# but parameterize that label before reusing the probe on a third fixture.
file: malformed/fill_value_size_mismatch_v2.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FILL_VALUE_SIZE_MISMATCH]
h5cve: {family: dataset_layout_filter_fill, allowed_statuses: [verified]}
forbidden: [accept, crash, timeout, external_open, plugin_load, write]
