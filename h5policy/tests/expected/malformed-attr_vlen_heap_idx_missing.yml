# An attribute vlen global-heap ID naming an object index the collection does
# not contain.
#
# Before 1.14.4 libhdf5 indexed heap->obj[] with the stored index behind nothing
# but `assert(hobj->idx < heap->nused)`; the fix turned that and its companion
# `assert(heap->obj[idx].begin)` into real errors (H5HG.c:570, :573).  So the
# current library rejects this file cleanly -- which is precisely why the oracle
# accepting it was invisible to any check that only asked whether libhdf5
# survived the specimen.  Only the oracle-versus-library differential shows it.
#
# The index is 200: past the objects the collection holds, but still inside the
# obj[] array, which libhdf5 sizes from the collection SIZE rather than from its
# contents (H5HG_NOBJS of 4 KiB is 257).  attr_vlen_heap_idx_past_nalloc is the
# sibling in the out-of-bounds regime.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
file: malformed/attr_vlen_heap_idx_missing.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_HEAP_OBJECT_MISSING]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/;
  # the global-heap codes are ambiguous and route on the message's role prefix,
  # so an attribute-borne ID resolves to message_envelope rather than to the
  # VDS family that shares the walker.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
