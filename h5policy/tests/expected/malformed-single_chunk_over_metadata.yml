# A Single Chunk index whose address points at the root object header.
#
# WHY THIS INDEX NEEDED ITS OWN FIXTURE.  Every other chunk index stores its
# chunks in RECORDS, and each of the four record walkers bounds a record's
# extent against the file's accounted metadata.  The Single Chunk index stores
# no records: the layout message's address field IS the chunk.  So it never
# reached a walker, and its one raw-data extent was the only one in the format
# that went undeclared -- the same blind-spot shape as the four-walker split
# behind malformed/chunk_zero_stored_size.h5, one index type further out.
#
# MEASURED before the fix: h5policy ACCEPTED this file with no findings, and
# `h5dump -d /d` exited 0 printing 1380206671 as the first value -- the
# little-endian int32 of "OHDR".  An arbitrary in-file read presented as dataset
# content, exactly as in malformed/chunk_data_over_metadata.h5, reached through
# the one index that had no check.
#
# libhdf5 still serves it: the read path seeks to the address it is given.  Same
# A~ disposition as its chunk-record sibling and the same finding code, so
# h5policy-diff's SILENT_WRONG_DATA_CODES predicate already covers it and no new
# tolerance is needed.  See registry/cases/single-chunk-index-data-extent.yml.
#
# The base is UNFILTERED so nothing notices the substituted bytes; the filtered
# form is a separate fixture because it also pins the address offset.
file: malformed/single_chunk_over_metadata.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_RAW_DATA_OVERLAPS_METADATA]
h5cve: {family: dataset_layout_filter_fill, allowed_statuses: [verified]}
verification:
  # The chunk extent overlaps an accounted metadata extent -- a reference that
  # resolves to something it must not name.
  reference_semantics_cases: [overlap]
forbidden: [accept, crash, timeout, external_open, plugin_load, write]
