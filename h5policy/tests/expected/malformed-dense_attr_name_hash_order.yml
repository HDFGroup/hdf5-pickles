# The dense-ATTRIBUTE (type 8) form of the same defect: two adjacent name-hash
# values swapped so the leaf is no longer ordered by hash.  The record layout
# differs -- id(8) flags(1) corder(4) hash(4), so the hash is at +13, verified
# against valid/dense_attribute.h5 whose populated leaves are non-decreasing
# there while the +9 candidate is the constant untracked-corder 0xffffffff.
#
# AND IT DIVERGES FROM ITS LINK-SIDE SIBLING, which is why both fixtures exist.
# MEASURED: libhdf5 2.3.0 ACCEPTS this file -- canary status `verified`, oracle
# alignment `divergent` -- while it refuses the link-side corruption.  The
# format's ordering rule is the same for both and H5A__dense_btree2_name_compare
# binary-searches the same way (src/H5Abtree2.c), so this is the familiar
# "libhdf5 never looked": the canary's access pattern does not perform a by-name
# attribute lookup, so the search that depends on the order is never run.
#
# h5policy is therefore STRICTER than libhdf5 here, deliberately.  The order is a
# format invariant, not an artifact of one access pattern, and a consumer that
# does look an attribute up by name gets a binary search over unordered records.
# `require_oracle_alignment` is deliberately NOT set: it would turn this measured
# divergence into a `violation` row and hide it.
file: malformed/dense_attr_name_hash_order.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_V2_BTREE_RECORD_ORDER]
h5cve:
  family: heap_structures
  allowed_statuses: [verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
