# A dense link heap with NO managed blocks at all.
#
# When every link in a group is too big for the doubling table, the heap never
# allocates a managed direct block and its doubling-table root address is
# UNDEFINED.  That is a legal, fully readable heap -- libhdf5 lists the group
# without complaint -- but h5policy read the undefined root as "nothing here"
# and returned the whole file as H5_UNSUPPORTED_PICKLE_COVERAGE_GAP ("dense link
# storage uses an unsupported fractal-heap/B-tree layout") before the name index
# was opened at all.
#
# A SEPARATE fixture from valid-dense_links_huge.yml because the difference is
# structural, not a value: that one keeps a managed object, so its root stays
# defined and it cannot catch this path regressing.  The generator asserts the
# regime (no managed objects, undefined root, one huge object) so a base-fixture
# change fails loudly instead of quietly producing a file that tests nothing.
#
# MEASURED canary status, not inferred: `accepted`, five entry-point calls
# completed, zero call errors.
file: valid/dense_links_huge_only.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
h5cve:
  family: dense_index
  allowed_statuses: [verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
