# The out-of-bounds sibling of attr_vlen_heap_idx_missing.
#
# H5HG_NOBJS(f, 4096) is 257, so index 400 is past the end of the calloc'd
# obj[] array rather than merely past the objects in use.  A pre-fix Release
# build read `size` and `begin` from beyond the allocation and let those values
# drive the copy -- the heap buffer overflow this family is known for, which an
# index landing INSIDE the array never reaches.
#
# Two fixtures, one finding: the oracle refuses both for the same reason, but a
# check that bounded the index against the allocation instead of against the
# collection's contents would still pass the other one.  Keeping both means such
# a check cannot pass the suite.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
file: malformed/attr_vlen_heap_idx_past_nalloc.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_HEAP_OBJECT_MISSING]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/;
  # the global-heap codes are ambiguous and route on the message's role prefix,
  # so an attribute-borne ID resolves to message_envelope rather than to the
  # VDS family that shares the walker.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
