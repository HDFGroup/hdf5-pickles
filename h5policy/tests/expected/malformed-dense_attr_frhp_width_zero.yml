# The dense-ATTRIBUTE heap with the same zero doubling-table width as
# malformed/dense_link_frhp_width_zero.h5.
#
# The two are separate walkers over one shared header record, so this fixture is
# what keeps the attribute side wired to the shared validator.  Its family is
# heap_structures, named mechanically from the finding message via
# registry/findings/routes/, matching how the filtered-heap checksum finding
# splits across the same three clients.
#
# Measured: libhdf5 SIGSEGVs at the identical frame (H5HFhdr.c, reached through
# H5Aexists or H5Aiterate2 rather than H5Lexists), hence `violation`.
file: malformed/dense_attr_frhp_width_zero.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FRACTAL_HEAP_DOUBLING_TABLE]
h5cve: {family: heap_structures, allowed_statuses: [violation]}
verification:
  # A zero doubling-table width: the lower boundary of a count that the
  # heap geometry divides and indexes by.
  count_and_extent_boundaries: [zero]
forbidden: [crash, timeout, external_open, plugin_load, write]
