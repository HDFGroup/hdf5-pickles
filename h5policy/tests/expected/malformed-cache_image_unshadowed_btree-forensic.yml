# Cache-image entries replace the corresponding logical address. This fixture
# retags the cached root/object-header entries as a dense B-tree leaf while
# retaining a checksum-valid MDCI, so the replay walk must reject the cached
# bytes instead of reading stale backing storage.
#
file: malformed/cache_image_unshadowed_btree.h5
profile: forensic
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_V2_BTREE_NODE_SIZE]
expected_analysis:
  complete: true
  walk_started: true
  walk_completed: true
  stop_reason: ""
  continue_after_rejection: true
  findings_truncated: false
h5cve: {family: dense_index, allowed_statuses: [violation]}
forbidden: [accept, crash, timeout, external_open, plugin_load, write]
