# Corruption on the UNSHADOWED side of a metadata cache image. The base caches
# the root/group object headers and the dense-link B-tree header; the generator
# drops those entries from the image (un-shadowing them) and over-states the
# B-tree node record count. The walk must therefore reach the corrupt B-tree
# instead of stopping at the cache-image boundary, and reject it. The image still
# caches undecodable cache-client bodies, so the replay pass legitimately stops
# at a coverage gap AFTER the corruption is reported -- hence walk_completed is
# false. The dropped entries formerly shared one leaf address (a real
# mdci.entry_addr_unique violation); dedup is asserted by forbidding the
# duplicate-address finding here.
#
# The libhdf5 defect on the B-tree side is recorded in
# registry/cases/v2-btree-nrec-unvalidated-against-node-capacity.yml, as the
# record-decode WRITE trigger -- the more serious of that record's two, since
# it SIGSEGVs an uninstrumented build.  THIS EXPECTATION IS FORENSIC ON PURPOSE:
# untrusted-strict stops at the cache-image coverage gap and returns
# unsupported_coverage_gap (exit 5), so the named cause appears only here.  Do
# not model a new fixture for that trigger on the plain over_capacity_v2_btree
# expectations; see the record's profile_split.
# Why the check runs at all despite the image: the image shadows the LEAF (787)
# while the corrupt nrec lives in the unshadowed BTHD (749), and the capacity
# test is pure arithmetic on BTHD fields.
file: malformed/cache_image_unshadowed_btree.h5
profile: forensic
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_V2_BTREE_NODE_SIZE]
forbidden_findings: [H5_CORRUPT_MDCI_DUPLICATE_ENTRY_ADDRESS]
expected_analysis:
  complete: false
  walk_started: true
  walk_completed: false
  stop_reason: cache_image_coverage_gap
  continue_after_rejection: true
  findings_truncated: false
h5cve: {family: dense_index, allowed_statuses: [violation]}
forbidden: [accept, crash, timeout, external_open, plugin_load, write]
