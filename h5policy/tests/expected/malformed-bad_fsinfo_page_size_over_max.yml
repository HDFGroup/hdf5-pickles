# A file-space-info message declaring a page size of 1 GiB + 1.
#
# H5F_FILE_SPACE_PAGE_SIZE_MAX is 1 GiB and libhdf5 refuses anything above it in
# the same test that rejects zero ("invalid page size in file space info").
# h5policy checked only the zero half, so every oversized page size was
# accepted.
#
# Classification is A+, not A'.  The h5py this repo runs against links libhdf5
# 1.14.5, which opens the file and the dataset without complaint; h5dump and
# h5debug (2.3.0) both refuse it, and that tool evidence is what the harness
# demotes on.  Same shape as malformed-bad_attr_name_size_one.yml -- a guard
# present in current libhdf5 but not in the structural oracle's build.
#
# The value is one past the bound rather than absurdly large, so the case pins
# the boundary itself: 1073741825 is rejected, and the paged fixtures in valid/
# show 4096 still accepted.  Note libhdf5 documents a 512-byte minimum too, but
# its decoder does not enforce one, so h5policy does not either -- mirroring the
# decoder rather than the documentation.
#
# Built by h5policy-gencorpus from a real paged file; the message lives in the
# superblock extension's object header, whose checksum is repaired afterwards.
file: malformed/bad_fsinfo_page_size_over_max.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FREE_SPACE_PAGE_SIZE]
expected_finding_evidence:
  H5_CORRUPT_FREE_SPACE_PAGE_SIZE:
    field: fsinfo.page_size
    actual: 1073741825
    expected: 1073741824
    comparison: at_most
expected_finding_evidence_locations:
  H5_CORRUPT_FREE_SPACE_PAGE_SIZE:
    - role: actual
      length: 8
      little_endian_value: 1073741825
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: heap_structures
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
