# A SOFT LINK's symbol-table entry names an empty string in the local heap.
# libhdf5 resolves the link name for every entry it converts and rejects an
# empty one ("invalid link name") BEFORE it looks at the cache type or at the
# object header address (H5Gent.c:379-385).  h5policy checked the name only
# inside its `cache type != 2` branch and, deeper, only when the object header
# address was defined and inside the file, so a soft link's name was never
# examined.  Two h5stat-corpus specimens land exactly here.
file: malformed/softlink_empty_name.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LINK_NAME_EMPTY]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
verification:
  # The soft-link form of the same zero-length name boundary.
  count_and_extent_boundaries: [zero]
forbidden: [crash, timeout, external_open, plugin_load, write]
