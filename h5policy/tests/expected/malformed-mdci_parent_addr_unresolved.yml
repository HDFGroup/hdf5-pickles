# A metadata-cache-image child entry declares a flush-dependency parent address
# that names no entry in the image. Every envelope field, flag and LRU relation is
# well formed -- correct image_data_len, a valid Jenkins trailing checksum, and
# per-entry headers that pass the flag/dependency and extent checks -- so the only
# defect is the dangling parent reference. libhdf5 looks each parent up in the
# reconstruction index and fails with "fd parent not in cache?!?" (H5Cimage.c:2533),
# unwinding a partially built, pinned dependency graph through the same unsafe
# cleanup as the duplicate-address case (poc_dos.h5's 0x18000000 parent route).
# h5policy must reject the dangling reference once every entry address is known,
# before the replay pass and before any native state exists.
# The libhdf5 cleanup defect this isolates is recorded in
# registry/cases/mdci-reconstruct-cleanup-unsafe.yml (dangling-fd-parent trigger).
# No diff tolerance: libhdf5 rejects this fixture too, so the two sides agree.
file: malformed/mdci_parent_addr_unresolved.h5
profile: legacy
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_MDCI_PARENT_ADDR_UNRESOLVED]
h5cve:
  family: cache_image_dependency_graph
  require_oracle_alignment: true
  # REMEASURED 2026-08-23: `verified`, not `violation`.  libhdf5 2.3.0 REJECTS
  # this file -- the first metadata protect fails with
  #   H5C_protect -> Can't load cache image
  #   -> H5C__reconstruct_cache_contents -> reconstruction of cache entry failed
  # because H5C__reconstruct_cache_entry bounds all three entry enums
  # (src/H5Cimage.c:2738-2782) at image-load time, for every entry.
  # The earlier `violation` was a probe artifact, not a libhdf5 divergence: the
  # cache-image load is ONE-SHOT (H5C_protect clears load_image before calling
  # it), and the probe's traversal retried after the failing first attempt and
  # reported the retry's success.  See the comment at the H5Ovisit3 retry in
  # h5policy/tools/probe/h5probe.c.
  allowed_statuses: [verified]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
