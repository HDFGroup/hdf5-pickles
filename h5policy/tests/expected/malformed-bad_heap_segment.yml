# An old-style group's local heap declares a ~1 TB data-segment size, far past
# the file.  libhdf5 rejects the oversized heap segment; h5policy used to read
# the size without bounds-checking the segment.  Found by h5policy-fuzz.
#
# WHAT THIS FIXTURE DOES NOT COVER, and the distinction is not academic: its
# data-segment ADDRESS is 712, which is prefix + 32.  A segment contiguous with
# its prefix is loaded through H5AC_LHEAP_PRFX, the class carrying
# H5AC__CLASS_SPECULATIVE_LOAD_FLAG -- and that flag is the only thing that
# makes H5C__load_entry apply its end-of-address bound (H5Centry.c:1050-1052).
# So "libhdf5 rejects the oversized heap segment" is true of THIS FILE because
# of its address, not because the library checks the size in general.
#
# MEASURED: this fixture is AddressSanitizer-clean.  Move only its
# data-segment address off prefix + 32 -- size and free list untouched -- and
# the same file aborts with `requested allocation size 0x10000000000`, because
# the load then routes through H5AC_LHEAP_DBLK, which carries no flag and is
# never bounded.  malformed/lheap_dblk_size_unbounded.h5 is that fixture and
# covers the unchecked path; see
# registry/cases/cache-load-length-eoa-check-is-class-gated.yml.
file: malformed/bad_heap_segment.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LENGTH_OVERFLOW]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: heap_structures
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
verification:
  # A declared ~1 TB heap data segment against a small file: the extent
  # boundary taken well past the end of the file.
  count_and_extent_boundaries: [out_of_file]
forbidden: [crash, timeout, external_open, plugin_load, write]
