# A dense LINK name index whose v2 B-tree header declares client id 6.
#
# The sibling of dense_attr_btree_wrong_client.h5 at the other decode site that
# had the same combined test. Both are needed: the two walkers hardcode
# different expected clients (5 for a link name index, 8 for an attribute name
# index) and neither shares the check.
#
# THE ORACLE THAT PROVES IT IS A BY-NAME LOOKUP, not iteration. Measured:
# `h5ls -r`, and h5py `list(group.keys())`, both return 0 on this file because
# neither touches the name B-tree; a by-name lookup inside the dense group
# aborts with glibc `free(): invalid size` -- heap corruption, not a clean
# error. That is the same "the consumer never reached the path" trap that makes
# an exit code useless as an oracle for this family.
# Case record: registry/cases/v2-btree-client-id-type-confusion.yml
file: malformed/dense_link_btree_wrong_client.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_V2_BTREE_RECORD_TYPE]
forbidden_findings: [H5_UNSUPPORTED_PICKLE_COVERAGE_GAP]
h5cve:
  family: dense_index
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
