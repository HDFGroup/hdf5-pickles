# A version-3 fill-value message claiming the value is both undefined and
# present.
#
# UNDEFINED_VALUE (0x10) and HAVE_VALUE (0x20) are contradictory claims about
# the same message, and libhdf5 rejects the pair in H5O__fill_new_decode ("have
# value and undefined value flags both set").  h5policy tested bit 5 alone to
# decide whether a value followed, so with both bits set it parsed the message
# happily: a tier-2 A' divergence (libhdf5 rejects, h5policy accepted), now
# closed.
#
# The fix also changes what h5policy does *after* reporting.  libhdf5 checks the
# undefined bit first and never reads a size field in that branch, so with both
# bits set there is no defined reading of the bytes that follow the flags.
# h5policy therefore skips the size/value parse rather than running it
# speculatively -- which is why the forbidden list below names the two findings
# that a speculative parse could have manufactured out of an encoding that has
# no meaning.  The bytes are in fact a perfectly good fill value here, so a
# speculative parse would have stayed quiet; the entries guard the reasoning,
# not this file's bytes.
#
# Setting 0x10 on a message that already has 0x20 is the whole mutation: the
# size field and value bytes are untouched, which makes this a pure
# flag-semantics case rather than a truncation one.  Built by
# h5policy-gencorpus, which repairs the enclosing v2 object-header checksum.
file: malformed/bad_fill_v3_flag_conflict.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FILL_VALUE_FLAG_CONFLICT]
forbidden_findings:
  - H5_CORRUPT_FILL_VALUE_OVERRUNS_MESSAGE
  - H5_CORRUPT_FILL_VALUE_SIZE_MISMATCH
expected_finding_evidence:
  H5_CORRUPT_FILL_VALUE_FLAG_CONFLICT:
    field: fill.flags
    actual: 58
    expected: 48
    comparison: not_superset_of
expected_finding_evidence_locations:
  H5_CORRUPT_FILL_VALUE_FLAG_CONFLICT:
    - role: actual
      length: 1
      little_endian_value: 58
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: dataset_layout_filter_fill
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
