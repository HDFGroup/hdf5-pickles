# A dataset whose datatype message is a shared-message wrapper pointing at its
# OWN object header.  Resolving the shared datatype re-enters the same header,
# whose datatype message is again shared and points back -- an unbounded cycle.
# libhdf5's H5O__shared_read has no depth bound or visited set, so it recurses
# until the stack is exhausted (stock h5dump 2.3.0 SIGSEGVs; the ASan build
# reports stack-overflow in the H5O__shared_read/H5O__shared_decode/
# H5O_msg_read_oh cycle).  h5policy resolves shared messages with a visited-
# address set and rejects the self-reference before following it.  Confirms
# Report 1 of a private HDF5 2.2.0 DoS disclosure; see
# registry/cases/shared-message-self-reference-recursion.yml.
file: malformed/shared_message_self_reference.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SHARED_MESSAGE_CYCLE]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: shared_messages_legacy
  # The shared_messages_legacy canary (H5Ovisit3/H5Aopen_by_idx/H5Aget_type)
  # reaches the family: libhdf5 opens the file and, decoding /dset's shared
  # datatype, recurses without bound.  The stock baseline SIGSEGVs and the ASan
  # build reports stack-overflow, so the row is a `violation`; `verified` is
  # allowed for a hypothetical build that survives.  This is a soundness-
  # positive divergence -- h5policy safely rejects what crashes libhdf5.
  allowed_statuses: [verified, violation]
forbidden: [crash, timeout, external_open, plugin_load, write]
