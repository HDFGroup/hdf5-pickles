# A version-1 filter pipeline whose filter name has no terminating NUL.
#
# libhdf5 fails with "filter name not null terminated" in H5O__pline_decode.
# h5policy sized the name from the declared length and never read its bytes, so
# it accepted the message: a tier-2 A' divergence (libhdf5 rejects, h5policy
# accepted), now closed.
#
# The bound is the subtle part, and the check mirrors it exactly rather than
# tightening it.  libhdf5 runs strnlen over the rest of the *message*, not over
# name_length, and errors only when no NUL appears before the payload ends -- so
# a name left unterminated inside its own name_length but terminated later in the
# message is a file libhdf5 accepts, and h5policy must accept it too.  Tightening
# to name_length would be a stricter-than-libhdf5 rule belonging in the A+ track
# with its own evidence, not a reject-parity check.  That is also why the fixture
# fills everything from the name to the end of the message payload with 0xAA:
# overwriting only the eight name bytes would leave the NULs in the client-data
# word behind it, and libhdf5 would open the dataset fine.
#
# The base dataset holds no chunk, so the mangled deflate client data is never
# handed to the filter and this cannot be confused with a decompression failure
# over corrupt data -- the defect is in the pipeline message alone.  Built by
# h5policy-gencorpus; version-1 object headers have no checksum to repair.
file: malformed/bad_filter_name_not_terminated.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FILTER_NAME_NOT_TERMINATED]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: dataset_layout_filter_fill
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
