# A chunk v1 B-tree whose leaf declares level 3 while its parent sits at level 1
# and therefore expects 0.
#
# A v1 B-tree child must sit exactly one level below its parent.  libhdf5
# threads the expected level into the cache load (H5B_ins_ud_t.exp_level, from
# both H5B_find_helper and H5B__iterate_helper) and refuses a mismatch: "level
# is not as expected, possibly corrupted".  h5policy branched on node_level to
# decide leaf-versus-internal but never checked the child's level against the
# parent's, so it accepted the tree.
#
# The level is what tells a reader whether the entries after each key are child
# pointers or chunk records.  A forged one therefore makes the reader interpret
# addresses as chunk offsets -- node-type confusion, not a range error, which is
# why the finding is scoped aggregate_object and why the guard exists at all:
# it was added after a forged level segfaulted h5dump.
#
# Classification is A+, for two compounding reasons.  The guard first shipped in
# libhdf5 2.0.0, so the 1.14.5 h5py links does not have it; and a chunk B-tree
# is only traversed when data is read, so even h5dump 2.3.0 returns 0 for a
# header-only dump.  The deeper evidence the harness demotes on is therefore
# reads=1 plus h5dump-data rc=1 -- reading the dataset is what walks the tree.
#
# On reporting: the walk stops descending the mismatching subtree instead of
# continuing.  Under a level just proved wrong the subtree has no defined
# reading, so walking on would derive findings from bytes whose meaning is
# unknown -- the same reasoning as the fill-value flag conflict.
#
# Nothing else in the node changes: entry count, keys and child pointers all
# stay valid, leaving the parent/child relationship as the only detectable
# defect.  The three valid v1 B-tree fixtures (chunked_v1_btree,
# chunked_v1_btree_deep, old_style_group) are the negative control -- if the
# root were checked against the unknown-level sentinel instead of exempted,
# every one of them would fail.
file: malformed/bad_btree_v1_child_level.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_BTREE_NODE_LEVEL]
expected_finding_evidence:
  H5_CORRUPT_BTREE_NODE_LEVEL:
    field: btree.node_level
    actual: 3
    expected: 0
    comparison: equal
expected_finding_evidence_locations:
  H5_CORRUPT_BTREE_NODE_LEVEL:
    - role: actual
      length: 1
      little_endian_value: 3
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: chunk_index
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
