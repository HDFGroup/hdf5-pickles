# An EMPTY vlen string attribute -- a global-heap object of declared size ZERO.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
#
# libhdf5 writes attrs["x"] = "" as a real heap object whose size field is 0
# (measured: collection object idx 1, size 0) and reads it back fine -- h5dump -A
# exits 0. This is the only fixture in the corpus whose heap object is
# legitimately zero-length, and it exists because a rule was broader than its own
# justification: the collection walker refused a zero length at EVERY object
# index, on the strength of a comment explaining the INDEX-0 case, where the
# parse advance IS the length and zero means libhdf5 never terminates. At any
# other index the advance is H5HG_SIZEOF_OBJHDR(f) + H5HG_ALIGN(size) == 16 even
# at size zero, so progress is guaranteed and there is nothing to reject.
#
# Latent while only a VDS layout reached that walker; immediate once attribute
# values did. malformed/bad_vds_gheap_free_zero_length.h5 is the other side of
# the pair and must keep rejecting -- its zero-length object IS index 0.
file: valid/attr_empty_vlen_heap_id.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
h5cve:
  family: message_envelope
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
