# A vlen sequence length SHORTER than its global-heap object.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
#
# libhdf5 requires EQUALITY, not a bound: H5VL__native_blob_get calls
# H5HG_get_obj_size and refuses on `hobj_size != size` ("Expected global heap
# object size does not match"), where size is the sequence length scaled by the
# base type's storage size. The oracle's first version of this rule bounded only
# the over-declared direction, so every under-declared length libhdf5 refuses was
# accepted -- measured on an unmodified prior build, which accepts this file.
#
# One less than the true length, so the case pins equality rather than the
# detection of an implausible number. Its sibling
# malformed-attr_vlen_heap_seq_len_over.yml is the other direction; keep both,
# since a one-directional bound would still pass one of them.
#
# libhdf5 refuses to read the attribute (h5py raises OSError). Note h5dump -A
# prints "unable to print data" and still exits 0 on this file, so exit status is
# not a usable oracle here -- read the output.
file: malformed/attr_vlen_heap_seq_len_under.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_ATTRIBUTE_HEAP_ID_LENGTH]
expected_finding_evidence:
  H5_CORRUPT_ATTRIBUTE_HEAP_ID_LENGTH:
    field: attribute.heap_object_length
    comparison: equal
h5cve:
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
