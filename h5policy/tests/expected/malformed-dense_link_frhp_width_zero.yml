# A dense-link fractal-heap header whose doubling-table width is zero, with the
# header checksum repaired so the width is the only defect.
#
# libhdf5 derives first_row_bits = log2(start_block_size) + log2(table_width)
# and sizes four heap arrays from max_root_rows = (max_heap_size_bits -
# first_row_bits) + 1.  Width 0 survives H5VM_log2_of2 -- whose only guard,
# assert(POWER_OF_TWO(n)), is compiled out under NDEBUG -- and then makes
# H5HF__hdr_compute_free_space accumulate `row_block_size[row] * width`, which
# is zero every time.  The loop has no reachable exit and `curr_row` is never
# bounded against max_root_rows, so three arrays are indexed without limit.
# Measured on a release build: SIGSEGV in H5HFhdr.c after reading from a
# 192-byte allocation to the end of the process heap mapping, reached by
# H5Lexists alone -- `violation` is therefore the expected canary status.
#
# Every libhdf5 writer hard-codes width 4 (H5G_FHEAP_MAN_WIDTH), so this is
# malformed rather than unsupported; h5policy reported a bare
# unsupported_coverage_gap for it until the doubling table got a real invariant.
# The libhdf5 defect and its siblings are recorded in
# registry/cases/fractal-heap-doubling-table.yml.
file: malformed/dense_link_frhp_width_zero.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FRACTAL_HEAP_DOUBLING_TABLE]
h5cve: {family: dense_index, allowed_statuses: [violation]}
verification:
  # A doubling-table width of exactly zero.
  count_and_extent_boundaries: [zero]
forbidden: [crash, timeout, external_open, plugin_load, write]
