# A global-heap free-space sentinel sized BELOW the object-header size -- the
# "middle band" registry/cases/global-heap-zero-progress-sentinel.yml recorded as
# unexercised.
#
# Its open question was whether such a size "under-advances (mis-parsing
# subsequent objects) or is harmless". MEASURED 2026-08-24: not harmless.
# libhdf5 does not terminate, and the middle band turns out to be a ROUTE INTO the
# zero-progress sentinel rather than a distinct defect:
#
#   @2208  idx=0 size=8   -> advance 8    (index 0 advances by the RAW size)
#   @2216  idx=8 size=0   -> advance 16
#   @2232  idx=0 size=0   -> advance 0    -- never terminates
#
# Three steps from a plausible header into a loop with no exit, through the
# sentinel's own zeroed payload. h5py hangs reading the attribute; a 20s timeout
# kills it. Sizes 1 and 15 behave identically; 8 is used because it is 8-aligned,
# so the fixture cannot be dismissed as failing an alignment rule instead.
#
# h5policy already refuses it, so this pins existing behaviour rather than a new
# rule -- nothing exercised it before.
#
# Reached through an ATTRIBUTE rather than a VDS layout deliberately: a structural
# open does not read an attribute value, so the differential harness cannot hang
# on this file, while the defect stays reachable for any consumer that reads the
# attribute.
file: malformed/attr_gheap_free_undersized.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_GLOBAL_HEAP_OBJECT]
h5cve:
  family: message_envelope
  require_oracle_alignment: true
  # NO allowed_statuses HERE, DELIBERATELY.  cmd_matrix reads an expectation's own
  # allowed_statuses in PREFERENCE to the policy override, so a value here would
  # silently shadow the reasoned one in registry/h5cve-matrix-policy.yml.
  # This block first said [unexercised, verified] -- declared by analogy with the
  # other attribute fixtures instead of measured -- which cannot happen on a file
  # libhdf5 never returns from, as the prose above already said.  It made the
  # matrix red the moment the fixture was added, exactly as the zero-length
  # sibling did before it.  Measure the status before declaring it.
verification:
  # The under-sized index-0 sentinel advances into its own zeroed payload, which
  # two steps later presents as a zero-advance object.
  count_and_extent_boundaries: [below_minimum]
  deep_nesting_and_non_progress: [non_progress]
forbidden: [crash, timeout, external_open, plugin_load, write]
