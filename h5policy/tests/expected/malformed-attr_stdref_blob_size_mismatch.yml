# A REVISED reference whose declared blob size is not its heap object's size.
#
# The vlen fixtures reach the global heap through a `length | addr | idx`
# descriptor.  A revised reference reaches it through a different encoding
# entirely -- [type:1][flags:1][blob_size:4][addr][idx:4], the ID at offset 6
# (H5R_ENCODE_HEADER_SIZE plus the size word, H5R__decode_heap) -- and nothing
# exercised that decode before this fixture.
#
# libhdf5 requires EQUALITY, not a bound: H5T__ref_disk_read hands the declared
# size to H5VL_blob_get and H5VL__native_blob_get refuses on `hobj_size != size`.
# So 49 -> 50 is refused, and so would 49 -> 48 be.  Measured on the exact build:
# H5Aread fails cleanly here and succeeds on valid/attr_stdref_region.h5.
#
# h5dump is NOT a usable oracle for this family -- it prints an empty `DATA {}`
# block and exits 0.  h5py is not either: linking libhdf5 1.14.5 it cannot decode
# H5R_ref_t and raises "Unknown reference type" on the VALID file too.
#
# Only the SECOND of the two elements is patched.  The first is an in-file
# control, which is what `expected_finding_counts` pins: a walker that resolved
# the ID relative to the wrong element, or applied the vlen offsets to a revised
# reference, would report both.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
file: malformed/attr_stdref_blob_size_mismatch.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_ATTRIBUTE_HEAP_ID_LENGTH]
expected_finding_counts:
  H5_CORRUPT_ATTRIBUTE_HEAP_ID_LENGTH: 1
expected_finding_evidence:
  H5_CORRUPT_ATTRIBUTE_HEAP_ID_LENGTH:
    field: attribute.heap_object_length
    actual: 50
    expected: 49
    comparison: equal
h5cve:
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
