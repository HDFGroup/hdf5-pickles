# A version-0 superblock whose 32-bit consistency-flag field is 0x00010000.
#
# v0 and v1 store the flags in a 32-bit field even though only the low byte is
# ever meaningful, so the field has two independent rules and libhdf5 enforces
# them as two tests.  This fixture breaks the first: anything above 255 means
# the upper three bytes carry data the format never defines
# (H5Fsuper_cache.c, "bad superblock status flags").  Its sibling
# malformed-bad_superblock_v0_status_flags_reserved.yml breaks the second.
# h5policy checked neither for v0/v1 -- only the v3 byte -- so both were
# accepted.
#
# libhdf5 rejects at H5Fopen, before any object is reached, so this is a clean
# A' with no deeper-probe demotion: the superblock is the first thing read.
#
# Versions 0 and 1 carry no superblock checksum, so the four-byte patch stands
# alone; the v2 sibling needs its Jenkins checksum recomputed.  Built by
# h5policy-gencorpus.
file: malformed/bad_superblock_v0_status_flags_high.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SUPERBLOCK_STATUS_FLAGS_HIGH_BYTES]
forbidden_findings: [H5_CORRUPT_SUPERBLOCK_STATUS_FLAGS]
expected_finding_evidence:
  H5_CORRUPT_SUPERBLOCK_STATUS_FLAGS_HIGH_BYTES:
    field: superblock.status_flags_width
    actual: 65536
    expected: 255
    comparison: at_most
expected_finding_evidence_locations:
  # The 32-bit field itself, at superblock offset 20.
  H5_CORRUPT_SUPERBLOCK_STATUS_FLAGS_HIGH_BYTES:
    - role: actual
      length: 4
      little_endian_value: 65536
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: validation_controls
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
