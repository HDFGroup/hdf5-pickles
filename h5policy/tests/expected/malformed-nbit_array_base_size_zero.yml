# An n-bit ARRAY node whose base element size is zero: the divisor of libhdf5's
# own element-count arithmetic, read straight out of the file.
#
# WHAT DIVIDES.  H5Z__nbit_decompress_one_array reads the node's total size and
# its base class, then takes the next word as the base's size and computes the
# repeat count as a quotient -- `n = total_size / p.size` for an ATOMIC base
# (src/H5Znbit.c:1229) and `n = total_size / base_size` for an ARRAY or a
# COMPOUND base (:1242, :1259).  The ARRAY and COMPOUND arms guard nothing at
# all.  The ATOMIC arm has one guard,
#   if (p.precision > p.size * 8 || (p.precision + p.offset) > p.size * 8)
# which a zero size passes trivially once the precision and offset are zero
# too, because it then reads `0 > 0`.  All three words are filter client data,
# so all three are file fields.
#
# WHY AN ARRAY DATATYPE AND NOT AN ATOMIC ONE.  H5Z__nbit_decompress dispatches
# on the top-level class word, and its ATOMIC arm loops d_nelmts times without
# dividing at all; only the ARRAY and COMPOUND arms enter the dividing helper.
# Every other n-bit fixture in this corpus is atomic, which is exactly why none
# of them can carry this defect -- the regime, not the value, is the gap.
#
# WHAT libhdf5 DOES, measured 2026-11-11 on 2.3.0 (develop 78c25cf819f, the
# newest build available here), baseline build:
#   h5dump -d /d    SIGFPE, exit 136
#   h5dump -H       rc=0 -- the metadata alone decodes cleanly
# This is NOT fixed on develop.  The bound #6497 added to the n-bit decode path
# guards the compressed-buffer index; it does not touch the divisor.  The same
# three divisions appear in H5Z__nbit_compress with no guard either, which is
# why h5policy checks the parameters rather than one direction of travel.
#
# NON-VACUOUS, MEASURED.  On these same fixture bytes with this one emit
# disabled and nothing else changed, h5policy returned accept_with_warnings in
# untrusted-strict carrying only H5_ADVISORY_DECODE_FILTER.  Every parameter in
# the file is otherwise consistent, so no neighbouring rule fires on it.
#
# Case record: registry/cases/nbit-array-base-size-zero-divisor.yml
file: malformed/nbit_array_base_size_zero.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_NBIT_ZERO_BASE_SIZE]
expected_finding_evidence:
  H5_CORRUPT_NBIT_ZERO_BASE_SIZE:
    # The divisor against the smallest value that is not a division by zero.
    field: layout.nbit_array_base_size
    actual: 0
    expected: 1
    comparison: at_least
# MEASURED 2026-11-11 with `--exercise dataset_layout`: outcome=crashed,
# signal=8 (SIGFPE) -> `violation`.
#
# Declared as exactly [violation] so both drifts surface: `unexercised` would
# mean the probe stopped reaching the decode, and `verified` would mean libhdf5
# started accepting a zero divisor.
h5cve: {family: dataset_layout_filter_fill, allowed_statuses: [violation]}
forbidden: [crash, timeout, external_open, plugin_load, write]
