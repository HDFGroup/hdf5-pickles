# A link message naming link type 2.
#
# libhdf5 knows three link types: 0 hard, 1 soft and 64 external.  64-255 is
# H5L_TYPE_UD_MIN upwards, the user-defined range, where a reader that has no
# handler registered may decline the link rather than call the file corrupt.
# 2-63 is neither: it names no link kind at all and H5O__link_decode fails with
# "unknown link type".  h5policy reported the whole 2-255 span as a *policy*
# finding, a verdict any profile permitting user-defined links could relax --
# standing in for a rejection no consumer can decline.  That was a tier-2 A'
# divergence, now closed by splitting the range.
#
# The fixture demotes an external link's type byte from 64 to 2, which leaves
# every length in the message intact.  That is what makes the pair sharp: the
# identical bytes are a legitimate policy decision at 64 (see
# policy/external_link.h5) and a hard corruption at 2, so the case pins the
# boundary itself rather than a difference in message shape.  The user-data
# payload the external link still carries is not decoded, because the type byte
# no longer says it is an external link.
#
# libhdf5 opens the file and then fails at link iteration rather than at
# H5Fopen.  The differential harness counts a file it cannot fully traverse as
# not opened, so this is a true A' and not the A+ that attribute-name defects
# produce.
#
# Built by h5policy-gencorpus; the enclosing v2 object-header checksum is
# re-sealed so a checksum mismatch cannot stand in for the type byte.
file: malformed/bad_link_type_invalid.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LINK_TYPE]
expected_finding_evidence:
  H5_CORRUPT_LINK_TYPE:
    field: envelope.link_type
    actual: 2
    expected: 64
    comparison: at_least
expected_finding_evidence_locations:
  H5_CORRUPT_LINK_TYPE:
    - role: actual
      length: 1
      little_endian_value: 2
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
