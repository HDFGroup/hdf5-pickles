# A version-1 object header whose trailing NIL message declares a size of 143.
#
# Version 1 pads every message body out to an 8-byte boundary, so a stored size
# is always a multiple of 8, and libhdf5 refuses any other value while
# deserializing the header -- H5O__chunk_deserialize fails with "message not
# aligned", the check added for CVE-2018-17234 and present since 1.14.1, so the
# 1.14.5 that h5py links has it.  h5policy read the size only to bound the
# payload and never checked its alignment, so it accepted the header: a tier-2
# A' divergence, now closed.  h5py cannot open the dataset, so this registers as
# a true A' rather than the A+ the attribute-name cases produce.
#
# Version 2 dropped the padding and stores the exact size, which is why the
# check is gated on the header version rather than applied everywhere.
#
# The NIL message is the target because it has no payload at all: dropping its
# size by one breaks the alignment rule without touching any field a payload
# validator would look at, so the case isolates the envelope rule from message
# semantics.  The byte the NIL message gives up becomes a one-byte tail, which
# h5policy separately and correctly reports as a null-message gap -- listed
# below because it is a true consequence of the same edit, not noise to be
# suppressed.
#
# Ordering note: the check runs before the chunk-overrun test, matching
# libhdf5, which validates alignment before bounds.  A size that is both
# misaligned and larger than the chunk is therefore reported as misaligned by
# both implementations rather than each naming a different defect.
#
# Built by h5policy-gencorpus at the earliest library bound; version-1 object
# headers carry no checksum to repair.
file: malformed/bad_ohdr_v1_message_unaligned.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings:
  - H5_CORRUPT_MESSAGE_SIZE_UNALIGNED
  - H5_CORRUPT_NULL_MESSAGE_GAP
expected_finding_evidence:
  H5_CORRUPT_MESSAGE_SIZE_UNALIGNED:
    field: envelope.message_size_alignment
    actual: 143
    expected: 8
    comparison: multiple_of
expected_finding_evidence_locations:
  H5_CORRUPT_MESSAGE_SIZE_UNALIGNED:
    - role: actual
      length: 2
      little_endian_value: 143
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
