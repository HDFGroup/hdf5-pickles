# A metadata-cache-image entry whose IN_LRU flag (0x02) is clear yet whose signed
# lru_rank is not -1. Every other envelope field is well formed -- correct
# image_data_len, a valid Jenkins trailing checksum, and a header that passes the
# flag/dependency and extent checks -- so the only defect is the LRU
# inconsistency. libhdf5 guards this relation with an assert only (H5Cimage.c:2813:
# (in_lru && lru_rank >= 0) || (!in_lru && lru_rank == -1)), compiled out under
# NDEBUG, so a Release reconstruction proceeds on the inconsistent description.
# This is exactly poc_dos.h5's entry 0 (lru_rank 2816, IN_LRU clear). h5policy must
# reject it in the entry loop, before the replay pass and before any native state.
# Two records. The stricter-than-Release-libhdf5 divergence on THIS fixture (stock
# opens it, asserts-on build aborts) is registry/cases/mdci-lru-rank-assert-only.yml,
# which carries the invariant-A tolerance in h5policy-diff-tolerances.yml. What that
# inconsistent description goes on to do in a full specimen -- the memory-unsafe
# reconstruction-failure cleanup -- is registry/cases/mdci-reconstruct-cleanup-unsafe.yml.
file: malformed/mdci_entry_lru_inconsistent.h5
profile: legacy
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_MDCI_ENTRY_LRU_INCONSISTENT]
h5cve:
  family: cache_image_dependency_graph
  require_oracle_alignment: true
  # The ONE mdci fixture libhdf5 2.3.0 genuinely tolerates, and the control that
  # proves the probe fix did not simply silence the family: its six siblings were
  # remeasured to `verified` on 2026-08-23 while this one stayed `violation`.
  # H5C__reconstruct_cache_entry bounds the entry ENUMS but never relates the
  # IN_LRU flag to the signed lru_rank, so the image loads and the walk completes
  # (measured: cur_size 2380 against 511 on the rejecting siblings).
  allowed_statuses: [unexercised, violation]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
