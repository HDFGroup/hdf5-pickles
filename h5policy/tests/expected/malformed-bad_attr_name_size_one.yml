# An attribute declaring a name length of 1: room for the terminator and
# nothing else.
#
# name_size counts the terminating NUL, so 1 describes the empty string.
# libhdf5 refuses it with the same test that catches 0 ("decoded name length is
# invalid"), and h5policy previously rejected only 0 -- so an attribute with a
# present but empty name was accepted.
#
# The version split is the point of this case, and it is why the fixture is A+
# rather than A'.  That test arrived with the CVE-2025-2310 fix and first
# shipped in libhdf5 2.0.0.  The h5py this repo runs against links 1.14.5, which
# decodes the attribute happily and only fails later at the API level ("no
# attribute name") when something tries to open an attribute by that empty name.
# So the differential harness sees a structural open with *no* attrs rejection,
# and demotes purely on the tool evidence: h5dump (2.3.0) rc=1.  Contrast
# malformed-bad_attr_name_embedded_nul.yml, whose deeper evidence includes
# attrs=1 because the HDFFV-10588 check it violates is old enough to be in
# 1.14.5.  The two fixtures together pin exactly which oracle catches which.
#
# Keeping the check is deliberate: it matches current libhdf5 and it is the
# guard whose absence was a CVE.  0 remains the memory-safety case there --
# name_len - 1 underflows to SIZE_MAX and feeds strndup -- while 1 is merely
# invalid, so widening from 0 to 1 costs nothing and matches the reference.
#
# Version 1 is what makes this a one-field edit: it pads the stored name to an
# eight-byte boundary and both 1 and 2 round to 8, so the datatype and dataspace
# behind the name stay exactly where they were.  Under version 2 or 3 the same
# patch would shift them and the fixture would be testing truncation instead.
# Built by h5policy-gencorpus; version-1 object headers have no checksum.
file: malformed/bad_attr_name_size_one.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_ATTRIBUTE_NAME_EMPTY]
expected_finding_evidence:
  H5_CORRUPT_ATTRIBUTE_NAME_EMPTY:
    field: attribute.name_size
    actual: 1
    expected: 2
    comparison: at_least
expected_finding_evidence_locations:
  H5_CORRUPT_ATTRIBUTE_NAME_EMPTY:
    - role: actual
      length: 2
      little_endian_value: 1
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
