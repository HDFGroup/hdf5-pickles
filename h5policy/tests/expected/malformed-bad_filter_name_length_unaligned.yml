# A version-1 filter pipeline whose filter name length is 7 rather than 8.
#
# Version 1 pads the stored filter name to an eight-byte boundary, and libhdf5
# refuses any other length outright -- H5O__pline_decode fails with "filter name
# length is not a multiple of eight" as soon as it decodes the field, before it
# looks at the name.  h5policy read the same field only to size the descriptor,
# so it accepted the message: a tier-2 A' divergence (libhdf5 rejects, h5policy
# accepted), now closed.
#
# 7 is the true length of "deflate" without its terminator, which makes this the
# smallest violating change: the NUL still sits inside the message, one byte past
# the declared name, so the separate NUL-termination scan is satisfied and the
# alignment rule is tested on its own.  Built by h5policy-gencorpus, which pins
# the earliest library bound to get the version-1 encoding at all (v2 and later
# store the exact length and carry no such constraint) and patches the length
# field; version-1 object headers have no checksum to repair.
#
# libhdf5 opens the file and rejects the dataset, the usual shape for a defect
# inside an object-header message.
file: malformed/bad_filter_name_length_unaligned.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FILTER_NAME_LENGTH_UNALIGNED]
expected_finding_evidence:
  H5_CORRUPT_FILTER_NAME_LENGTH_UNALIGNED:
    field: filter.name_length
    actual: 7
    expected: 8
    comparison: multiple_of
expected_finding_evidence_locations:
  H5_CORRUPT_FILTER_NAME_LENGTH_UNALIGNED:
    - role: actual
      length: 2
      little_endian_value: 7
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: dataset_layout_filter_fill
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
