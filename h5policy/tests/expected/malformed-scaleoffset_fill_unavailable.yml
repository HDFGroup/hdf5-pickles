# A scale-offset descriptor reporting NO fill value on a dataset that defines
# one: cd_values[7] (H5Z_SCALEOFFSET_PARM_FILAVAIL) patched 1 -> 0.
#
# THE RULE HERE IS ASYMMETRIC, AND THE SYMMETRIC VERSION IS A FALSE POSITIVE.
# libhdf5 writes cd_values[7] from H5P_fill_value_defined()
# (H5Zscaleoffset.c:1051-1060), which reports DEFAULT as well as USER_DEFINED --
# and the writer stores 1 for BOTH.  So a dataset created without an explicit
# fill value legitimately has cd_values[7] == 1 and a fill-value message saying
# H5D_FILL_VALUE_DEFAULT with no value bytes.  valid/scaleoffset_filter.h5 is
# exactly that shape and must keep accepting; a rule of the form "1 implies an
# explicit fill value" would reject files libhdf5 writes by default.
#
# Only the other direction is a rule: a 0 (FILL_UNDEFINED) against an object
# header that carries an EXPLICIT fill value, because H5P_fill_value_defined()
# would then have reported USER_DEFINED.  The third conforming shape -- an
# explicitly UNDEFINED fill value, which stores 0 and carries no value bytes --
# is left alone by that condition, and was measured with a C reproducer because
# h5py has no binding for H5Pset_fill_value with a NULL value.
#
# THE UNWRITTEN ELEMENT IS THE WITNESS.  The dataset is six elements in
# four-element chunks with only five written, so the sixth is the fill value,
# IN EXTENT, inside a chunk the filter really encoded.  Measured: it reads back
# as -7 before the patch and as 5 after it, rc=0 both times.  Two nearby shapes
# produce no witness at all -- a fully written dataset never materialises the
# fill value, and a shape whose fill elements fall outside the dataspace hides
# them just as well.  Either would have given a correct finding with an
# unsupported claim attached; see _scaleoffset_cd_patch.
#
# Sibling: malformed/scaleoffset_fill_avail_undefined.h5, the out-of-enumeration
# arm of the same invariant.
file: malformed/scaleoffset_fill_unavailable.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FILTER_PARM_MISMATCH]
expected_finding_evidence:
  H5_CORRUPT_FILTER_PARM_MISMATCH:
    field: filter.decode_fill_available
    actual: 0
    expected: 1
    comparison: equal
h5cve: {family: dataset_layout_filter_fill, allowed_statuses: [verified]}
forbidden: [crash, timeout, external_open, plugin_load, write]
