# A well-formed class-11 (complex number) dataset: four H5T_COMPLEX_IEEE_F64LE
# values, element size exactly twice its 8-byte base float.  The control for
# malformed/complex_size_not_twice_base.h5, and the first class-11 fixture in
# the corpus -- h5py (libhdf5 1.14.x) cannot write the class, so this is built
# by the h5cc helper tools/probe/make_complex.c (see h5policy-gencorpus).
# libhdf5 opens, reads and converts it without complaint; h5policy must accept.
file: valid/complex_dataset.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
h5cve:
  family: datatypes
  # The datatype canary reads one element converting to the native type; for a
  # valid complex-128 dataset the native type equals the file type, so that
  # converting read is skipped and the file-type read completes -- verified.
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
