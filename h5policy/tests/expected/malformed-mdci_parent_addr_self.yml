# A metadata-cache-image entry that names its OWN address as its flush-dependency
# parent -- a self-loop in the dependency graph. Every envelope field, flag and LRU
# relation is well formed, and the parent address is genuinely present in the image,
# so mdci.parent_addr_resolvable passes: the defect is that it resolves to the
# declaring entry itself. This was a PROVEN oracle false-accept -- h5policy exited 0
# with zero findings under all four profiles while libhdf5 rejected the file on both
# builds -- found while establishing that a reconstructed dependency graph is
# acyclic. libhdf5 rejects it in H5C_create_flush_dependency (H5Centry.c:3836,
# "Child entry flush dependency parent can't be itself") via H5Cimage.c:2547, a
# different diagnostic from the dangling-parent route at H5Cimage.c:2533 -- which is
# why this is its own invariant rather than a widening of parent_addr_resolvable.
#
# No fixture exists for a longer cycle, deliberately: parents resolve only against
# entries already inserted into the index, so a two-cycle's forward reference fails
# as an unresolvable parent before any cycle can form. The self-loop is the only
# cycle the format admits.
#
# The libhdf5 defect this borders on is registry/cases/mdci-reconstruct-cleanup-unsafe.yml
# (this is a third route into that cleanup, though not a crash route -- with no
# pinned parents the unwind has no partially built graph to mishandle). No diff
# tolerance: libhdf5 rejects this fixture too, so the two sides agree.
file: malformed/mdci_parent_addr_self.h5
profile: legacy
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_MDCI_PARENT_ADDR_SELF]
forbidden_findings: [H5_CORRUPT_MDCI_PARENT_ADDR_UNRESOLVED]
h5cve:
  family: cache_image_dependency_graph
  require_oracle_alignment: true
  allowed_statuses: [unexercised, violation]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
