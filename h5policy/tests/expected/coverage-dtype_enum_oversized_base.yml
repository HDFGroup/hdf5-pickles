# A conformant enumeration whose base integer storage size (40 bytes) exceeds
# the fixed 32-byte scratch buffer libhdf5 sorts enum members through
# (uint8_t tbuf[32] in H5T__sort_value/H5T__sort_name, src/H5Tfields.c).  The
# only bound on the per-swap H5MM_memcpy into tbuf is assert(size <=
# sizeof(tbuf)), compiled out of release (NDEBUG) builds -- so this legal file
# overflows the stack on any enum value/name lookup, enum->enum read, or
# `h5dump -d`.  Measured: release libhdf5 2.3.0 SIGSEGVs; an ASan+NDEBUG build
# reports a stack-buffer-overflow WRITE of `size` bytes into tbuf.
#
# h5policy ACCEPTS the file.  The enum's declared size equals its base size, so
# the datatype.enum_encoding consistency check (H5_CORRUPT_DATATYPE_ENUM_BASE_SIZE)
# passes, and no invariant bounds an enum base size against libhdf5's sort
# buffer.  This expectation therefore pins a documented COVERAGE GAP, not a
# rejection: it is the testable witness that the metadata oracle does not catch
# this libhdf5 code defect.  Promoting it to an oracle predicate is deliberately
# deferred (classification of a libhdf5-defect-on-legal-files check is a separate
# decision); the gap is recorded in the datatypes block of
# registry/validation-coverage.yml.
#
# The oracle is a Python metadata walker and never calls libhdf5's sort, so the
# accept costs nothing and crashes nothing here; `crash` stays forbidden.
file: coverage/dtype_enum_oversized_base.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
forbidden: [crash, timeout, external_open, plugin_load, write]
