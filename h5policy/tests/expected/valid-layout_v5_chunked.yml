# A data layout message at version 5, the version libhdf5 2.x writes under
# H5F_LIBVER_V200.  The message encoding is identical to version 4 -- v5 only
# widens the filtered-chunk size field inside chunk index records -- so this is
# an ordinary fixed-array chunked dataset that must simply be accepted.  The
# version gate used to stop at 4 and rejected files like this as corrupt.
file: valid/layout_v5_chunked.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
forbidden: [crash, timeout, external_open, plugin_load, write]
