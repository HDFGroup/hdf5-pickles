# A filtered SOHM huge object whose declared decoded size CLEARS the heap's
# managed ceiling but disagrees with its own pipeline's output extent: 16384
# declared against scale-offset's cd_values[2] * cd_values[4] = 1024 * 8 = 8192.
#
# This is the case the decoded-size FLOOR cannot reach, and it is the defect
# registry/cases/filtered-huge-object-decoded-size-unchecked.yml was opened for.
# libhdf5 reads the record's stored length, lets H5Z_pipeline replace the object
# size with the filter's output length, then copies THAT many bytes into a buffer
# the caller sized from the declared decoded size (src/H5HFhuge.c:749-761, with
# the buffer sized from H5HF__huge_get_obj_len at :520).  Two lengths in one
# record, never compared.
#
# The oracle does NOT run the transform.  It does not have to: scale-offset's
# output extent is a function of its client data
# (size_out = d_nelmts * p.size, src/H5Zscaleoffset.c:1217), so the expectation
# is arithmetic on metadata.  Where that is not true the check must stay silent
# -- see coverage/sohm_filtered_huge_undecidable.h5, the deflate control.
#
# NON-VACUITY, measured by reverting each arm alone: with only the decoded-size
# floor in place this file is `unsupported_coverage_gap` with zero corrupt
# findings, so the equality check is what rejects it.  The floor stays silent
# here by design, which is why both fixtures exist.
file: malformed/sohm_filtered_huge_decoded_size_mismatch.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SOHM_FILTERED_HUGE_DECODED_SIZE]
forbidden_findings: [H5_CORRUPT_SOHM_HUGE_OBJECT_BELOW_MANAGED_MAX]
h5cve: {family: shared_messages_legacy, allowed_statuses: [unexercised]}
forbidden: [crash, timeout, external_open, plugin_load, write]
