# A chunk of 2**32 + 256 bytes indexed by a v1 B-tree.
#
# This is the one combination the 32-bit rule still describes, and the only one
# libhdf5 refuses.  Layout message versions 1 through 3 encode no chunk index
# type: the index is always the v1 B-tree, whose record carries the chunk's byte
# size in a FOUR-BYTE field.  A chunk above 4 GiB therefore cannot be
# represented on disk at all, and libhdf5 refuses the dataset at open --
# "chunk size must be < 4GB with v1 b-tree index", H5Dchunk.c:1185.  MEASURED:
# h5dump 2.3.0 fails to open the dataset in this file.
#
# So oracle and library agree here, unlike the two accepting siblings
# (valid/chunk_4gib_layout_v5.h5, policy/chunk_4gib_layout_v4.h5) where the same
# geometry is legal because the index can hold the size.  The three fixtures
# exist together because the old unconditional bound could not tell them apart.
#
# Built on an earliest-libver file so the layout message sits in a version-1
# object header, which carries no checksum to repair after the dimension patch.
file: malformed/chunk_4gib_v1_btree_index.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_CHUNK_SIZE_EXCEEDS_32BIT]
expected_finding_evidence:
  H5_CORRUPT_CHUNK_SIZE_EXCEEDS_32BIT:
    field: layout.chunk_size_overflow_product
    actual: 4294967552
    expected: 4294967295
    comparison: less_than_or_equal
h5cve:
  family: dataset_layout_filter_fill
  # `unexercised`, and that is the correct outcome rather than a gap being
  # waved through: libhdf5 refuses this dataset at OPEN, which is the agreement
  # the fixture exists to record, so the canary never reaches the family
  # surface.  Per registry/h5cve-matrix-policy.yml a fixture rejected at open
  # proves nothing about the exercise, which is why this family also has
  # specimens libhdf5 opens successfully -- malformed/chunk_dim_product_wrap_v4
  # and _v5, which carry the family defect and are exercised.
  allowed_statuses: [unexercised]
verification:
  # 2**32 + 256: one step past the field the v1 B-tree record can hold.
  count_and_extent_boundaries: [n_plus_one]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
