# An attribute vlen global-heap ID whose collection address is past the declared
# end of file.
#
# The sharpest form of the gap that was closed: h5policy bounds addresses
# against the declared EOF in every other metadata context, and this one escaped
# only because the attribute's value region was never read.  The finding is the
# ordinary address bound, reached through the shared collection walker, which is
# why H5_CORRUPT_OFFSET_OUT_OF_FILE routes to attribute.heap_id_in_file on the
# message's role prefix rather than to the VDS family that shares the walker.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
file: malformed/attr_vlen_heap_addr_out_of_file.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_OFFSET_OUT_OF_FILE]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/;
  # the global-heap codes are ambiguous and route on the message's role prefix,
  # so an attribute-borne ID resolves to message_envelope rather than to the
  # VDS family that shares the walker.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
