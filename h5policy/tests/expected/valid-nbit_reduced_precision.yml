# A well-formed n-bit dataset the filter actually COMPRESSES: i4 storage at
# 20-bit precision, bit offset 4, 10x10 in 5x5 chunks (1.587:1 here).
#
# THE REGIME IS THE POINT.  valid/nbit_filter.h5 uses a full-precision native
# int32, for which H5Z__set_parms_atomic leaves need_not_compress set
# (cd_values[1] == 1) and the pipeline is a pass-through.  Its precision and
# bit-offset parameters are still written, but no read path consumes them, so a
# guard fixture built on that base would exercise a parameter that does nothing.
# This file is the base the three n-bit local-parameter fixtures are patched
# from, and the valid control that proves those checks do not fire on agreement:
# cd_values[5], [6] and [7] here match the datatype message's byte order,
# precision and bit offset exactly.
file: valid/nbit_reduced_precision.h5
profile: untrusted-strict
expected_decision: accept_with_warnings
expected_exit: 1
required_findings: [H5_ADVISORY_DECODE_FILTER]
forbidden: [crash, timeout, external_open, plugin_load, write]
