# The valid 1000-link group's name index is a multi-level v2 B-tree.  Reducing
# only the recursive tree ceiling to one must classify its greater depth as a
# resource-policy choice rather than format corruption.
file: valid/dense_links_deep.h5
profile: untrusted-strict
profile_overrides:
  resources:
    max_btree_depth: 1
expected_decision: reject_resource
expected_exit: 4
required_findings: [H5_RESOURCE_BTREE_DEPTH]
forbidden_findings: [H5_CORRUPT_BTREE_DEPTH_EXCEEDED]
expected_metrics:
  # Was 1 until 0b8271b added the fractal-heap free-space-manager closure.  The
  # dense link group's heap now also walks its FSM header and section list, and
  # both take a slot in the visited-btree cycle set (h5policy_mark_visited_btree)
  # -- that set tracks distinct cycle-checked index structures, not B-trees
  # alone: v1 SNODs have always gone in it too -- h5_group.pk:272
  # (h5policy_mark_visited_btree, snod_addr).  So this is
  # 1 name-index B-tree + 2 FSM structures, and the count is coverage growth,
  # not a traversal regression: the depth ceiling still stops the B-tree walk
  # after one level, which is what expected_decision/required_findings assert.
  visited_btree_refs: 3
h5cve:
  # The depth ceiling is generic v2-B-tree machinery exercised on a dense-link
  # name index, so the fixture is contracted to both families it covers.
  families: [btree_heap_index, dense_index]
  allowed_statuses: [verified]
verification:
  # A multi-level tree refused at a depth-one ceiling: the depth guard fires on
  # a genuinely nested structure rather than on a degenerate zero allowance.
  deep_nesting_and_non_progress: [deep_nesting]
forbidden: [crash, timeout, external_open, plugin_load, write]
