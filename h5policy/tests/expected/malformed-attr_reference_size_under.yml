# An attribute whose datatype is a bare object reference declaring a 1-byte
# element where the file's size-of-offsets dictates 8.
#
# For datatype classes 7 (reference) and 9 (variable-length) the on-disk element
# size is a property of the FILE, not of the message: H5T__ref_set_loc assigns
# H5F_SIZEOF_ADDR(f) (H5Tref.c:256) when the type is attached, and never compares
# that with the encoded size.  H5O__attr_decode has meanwhile already sized
# attr->shared->data as nelmts * the ENCODED size (H5Oattr.c:273), so H5A__read
# copies nelmts * the NEW size out of that allocation (H5Aint.c:769).
#
# What makes this worth a fixture: nothing here is out of bounds at decode time.
# Every field decodes, every allocation is bounds-checked, and the H5Oattr.c:273
# multiplication is overflow-checked.  The defect is that the size those checks
# were performed against is not final -- so h5policy ACCEPTED the specimen and
# five variants at every profile until the datatype-size check landed.  This row
# is the guard for that check.
#
# Datasets are immune and attributes are not, for a structural reason: a
# dataset's extent lives in the layout message, an independent record sized with
# the same value set_loc restores, so the two can be cross-checked.  An
# attribute's extent is COMPUTED from the field that changes, so the corrupt file
# is self-consistent and pinning the datatype size at decode time is the only
# available defence.
#
# Unlike a canary-only row, this generated file reproduces the defect: stock
# h5dump -A completes with exit 0 having over-read, and the ASAN build reports
# `heap-buffer-overflow READ of size 8` at H5A__read (H5Aint.c:769) from the
# H5Oattr.c:286 allocation.  Written at the earliest bound so the attribute sits
# in a version-1 object header, which carries no checksum to repair.
#
# Full record: registry/cases/datatype-size-not-final.yml.
file: malformed/attr_reference_size_under.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DATATYPE_REFERENCE_SIZE]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: datatypes
  # libhdf5 ACCEPTS this file and over-reads; the exact-build canary must not be
  # allowed to report the divergence as agreement.
  require_oracle_alignment: true
  allowed_statuses: [unexercised, violation]
forbidden: [crash, timeout, external_open, plugin_load, write]
