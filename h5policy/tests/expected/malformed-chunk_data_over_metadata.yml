# A chunk record whose data address points at the superblock.
#
# WHAT libhdf5 DOES: serves it.  No error, rc=0, and the chunk's bytes come back
# as dataset VALUES.  Measured on this fixture -- the first two int32 values are
# 1178880137 and 169478669, which are 0x46444889 and 0x0A1A0A0D: the file's own
# "\x89HDF\r\n\x1a\n" signature returned as data.  The same record pointed at a
# v1 B-tree node yields 0x45455254, "TREE".  So the primitive is an ARBITRARY
# IN-FILE READ, silently presented as dataset content.
#
# libhdf5's allocator guarantees raw data and metadata are disjoint on WRITE and
# nothing re-checks it on READ: the read path seeks to the address the record
# gives and returns what it finds.  h5policy's pre-existing bound was only
# `addr + size <= file_size`, which every in-file address satisfies -- which is
# exactly why address 0 passed.
#
# THE BASE IS UNFILTERED ON PURPOSE.  chunked_v1_btree.h5 has no checksum
# filter, so nothing notices the substituted bytes.  Built over the fletcher32
# control instead, libhdf5 would fail the checksum and return a clean error,
# hiding the defect behind a rejection -- the fixture would then be testing
# fletcher32, not this.
#
# Address 0 is used because it is the one offset guaranteed to be metadata in
# every file, but the invariant is NOT "addr != 0": it is that chunk data and
# metadata occupy disjoint bytes.  h5policy enforces it from both directions
# against a registry of accounted metadata extents, because the object graph is
# walked breadth-first and either side can be seen first.  Both registries are
# hard-capped (512 metadata extents, 1024 chunk checks) so the added cost cannot
# scale with file size and cannot push a large valid file past its walk budget.
#
# THIS IS THE ONE A~ CASE WHERE THE REFERENCE LIBRARY IS ACTIVELY WRONG rather
# than merely lazy.  Every other A~ predicate in h5policy-diff excuses libhdf5
# for validating late or not at all; here BOTH "opens" and "reads" succeed, and
# that success IS the defect.  A silent wrong answer leaves no trace a return
# code can carry, so there is no deeper evidence for the A+ path to find and the
# divergence needs an explicit code-scoped predicate
# (chunk_over_metadata_only).  It is code-scoped rather than per-fixture because
# the missing check is a property of libhdf5's read path, not of one specimen.
#
# Honest severity: not memory-unsafety, no crash.  Wrong data always, and a read
# primitive across a boundary wherever a consumer exposes some datasets of a file
# without exposing all of its bytes -- a userblock holding application data, or a
# service serving selected datasets.  Same-file only.
#
# Paired with valid/chunked_v1_btree.h5, which it is patched from and which
# differs only in that eight-byte address.
file: malformed/chunk_data_over_metadata.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_CHUNK_DATA_OVERLAPS_METADATA]
expected_analysis:
  complete: true
  walk_started: true
  walk_completed: true
  continue_after_rejection: false
  findings_truncated: false
# MEASURED 2026-08-22 with `--exercise chunk_index`: outcome=accepted,
# status=verified.  A `verified` row on a MALFORMED fixture reads oddly and is
# the point: the canary completes because libhdf5 reads the file happily,
# returning metadata bytes as data.  There is no violation to allow and no crash
# to except -- the exercise succeeding IS the defect, which is the same reason
# this fixture needs an explicit A~ predicate rather than the A+ evidence path.
# Declared as exactly [verified] so a future drop to `unexercised` -- libhdf5
# starting to refuse the read -- shows up as the change it would be.
h5cve: {family: chunk_index, allowed_statuses: [verified]}
forbidden: [crash, timeout, external_open, plugin_load, write]
