# Layout message version 6.  H5O_LAYOUT_VERSION_LATEST is 5, so no such
# version is defined and libhdf5 refuses the message outright.  This holds the
# upper end of the version gate after it was widened to admit version 5.
file: malformed/layout_unsupported_version.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_UNSUPPORTED_LAYOUT_VERSION]
forbidden: [accept, crash, timeout, external_open, plugin_load, write]
