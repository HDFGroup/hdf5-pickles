# The shared-message heap with the same zero doubling-table width.
#
# This fixture guards the case that was a PROVEN false accept: h5policy exited 0
# with zero findings on a SOHM heap that SIGSEGVs libhdf5, because the only
# doubling-table test lived on the dense walkers and the shared-message resolver
# never looked at the geometry.  The check now runs on the heap ENVELOPE, which
# is walked for every heap the master table names, so it does not depend on a
# message happening to resolve through the heap.
#
# The base file carries TWO fractal heaps -- the shared-message heap and the root
# group's dense-link heap -- and the generator identifies the shared-message one
# from the master table rather than by creation parameters.  A wrong pick would
# fail loudly here, because the required finding's message names the client.
#
# Measured: libhdf5 SIGSEGVs at H5HFhdr.c reached through
# H5O_msg_read -> H5O__dtype_shared_decode -> H5O__shared_decode, hence
# `violation`.
file: malformed/sohm_frhp_width_zero.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FRACTAL_HEAP_DOUBLING_TABLE]
h5cve: {family: shared_messages_legacy, allowed_statuses: [violation]}
forbidden: [crash, timeout, external_open, plugin_load, write]
