# A checksum-valid BTIN child pointer refers back to its already-visited root.
file: malformed/bad_chunk_v2_btree_cycle.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_CHUNK_INDEX_CYCLE]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: chunk_index
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
verification:
  # A child pointer referring back to its already-visited root is the
  # structure-specific cycle case for a chunk index.
  reference_semantics_cases: [cycle]
forbidden: [crash, timeout, external_open, plugin_load, write]
