# The FALLBACK control for the filtered-huge decoded-size equality check: the
# same 16384-versus-real mismatch as
# malformed/sohm_filtered_huge_decoded_size_mismatch.h5, but behind deflate.
#
# Deflate's output length is discovered by inflating, so no metadata makes it
# computable and the equality check MUST stay silent.  Getting that wrong in the
# strict direction would reject valid deflate files, which is the expensive
# failure mode -- this fixture is what makes the fallback a measurement rather
# than a claim in a comment.  The decoded-size floor is silent too, because
# 16384 clears the 4096 ceiling.
#
# The advisory that DOES fire is the correct answer for this file: it tells a
# consumer it must decode untrusted data to read the object, which is the
# boundary the oracle refuses to cross.  The decision is
# `unsupported_coverage_gap` for the same reason every filtered SOHM heap is --
# resolving a shared message out of it would mean running the filter.
file: coverage/sohm_filtered_huge_undecidable.h5
profile: untrusted-strict
expected_decision: unsupported_coverage_gap
expected_exit: 5
required_findings: []
forbidden_findings:
  - H5_CORRUPT_SOHM_FILTERED_HUGE_DECODED_SIZE
  - H5_CORRUPT_SOHM_HUGE_OBJECT_BELOW_MANAGED_MAX
