# A scale-offset filter descriptor declaring 19 parameters instead of 20.
#
# H5Z__filter_scaleoffset's FIRST act is
#     if (cd_nelmts != H5Z_SCALEOFFSET_TOTAL_NPARMS)   -- 20
# (H5Zscaleoffset.c:104 defines it, :1122 checks it), so libhdf5 refuses the read
# outright.  h5policy accepted it, which is the gap this closes: a file no reader
# can use was passing the preflight clean.
#
# Not a bounds check -- the descriptor extent is already confirmed in range by
# layout.filter_pipeline_bounds.  This is the count the DECODER requires before
# it will look at cd_values at all.
#
# The count is dropped by one rather than to something wild, so the descriptor
# still parses and stays inside the message: the only rule broken is the
# required-total.  The client-data words are left in place, so the descriptor
# extent is unchanged and a v1 pipeline message carries no checksum to repair.
#
# libhdf5 opens it (rc=0) and fails the data read (rc=1), so the differential
# takes the A+ evidence path -- a soft warning, no tolerance and no A~ predicate:
#   WARN A+ ... deeper libhdf5 evidence (reads=1, h5dump-data rc=1)
# Contrast malformed/chunk_data_over_metadata.h5, where libhdf5 reads
# SUCCESSFULLY and the divergence needs an explicit predicate.
#
# The advisory H5_ADVISORY_DECODE_FILTER on the same object is expected and
# unrelated: it fires for any dataset declaring a filter a consumer must decode.
file: malformed/scaleoffset_param_count.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FILTER_PARAM_COUNT]
expected_analysis:
  complete: true
  walk_started: true
  walk_completed: true
  continue_after_rejection: false
  findings_truncated: false
# MEASURED 2026-08-22 with `--exercise chunk_index`:
# outcome=rejected_in_traversal, status=unexercised.  libhdf5 OPENS the file and
# then refuses the read, so the family exercise never completes -- `unexercised`
# is the honest status, not a pass.  Declared as exactly [unexercised] so a drift
# to `verified` (libhdf5 accepting a scale-offset parameter count it currently
# rejects) surfaces instead of passing quietly.
h5cve: {family: dataset_layout_filter_fill, allowed_statuses: [unexercised]}
forbidden: [crash, timeout, external_open, plugin_load, write]
