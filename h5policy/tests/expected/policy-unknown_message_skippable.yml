# An unknown object-header message ID (0x30) with no message flags set.
#
# Unknown IDs are the object header's forward-compatibility mechanism: libhdf5
# points anything at or above H5O_UNKNOWN_ID (0x18) at the "unknown" message
# class and carries on, so it opens this file and lists the group normally.
# Refusing it is therefore a *policy* decision the unknown-message toggle owns,
# not corruption -- h5policy called it reject_corrupt, a false positive against
# invariant A that the differential never caught because no fixture carried a
# bare unknown message.
#
# This is the accept-side control for malformed/bad_unknown_message_fail_always.h5.
# The two files differ in exactly one byte, the message flags, so the pair pins
# the rule to bit 0x80 specifically and keeps it from drifting back to "any
# flag" or "no flag".
file: policy/unknown_message_skippable.h5
profile: untrusted-strict
expected_decision: reject_policy
expected_exit: 3
required_findings: [H5_POLICY_UNKNOWN_MESSAGE]
expected_finding_evidence:
  H5_POLICY_UNKNOWN_MESSAGE:
    field: object_header.message_type
    actual: 48
    expected: 24
    comparison: less_than_or_equal
expected_finding_evidence_locations:
  H5_POLICY_UNKNOWN_MESSAGE:
    - role: actual
      length: 1
      little_endian_value: 48
h5cve: {family: message_envelope, allowed_statuses: [violation]}
forbidden: [crash, timeout, external_open, plugin_load, write]
