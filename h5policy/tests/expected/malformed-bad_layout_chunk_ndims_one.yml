# A version-3 chunked layout declaring one dimension.
#
# In layout versions 1 to 3 the trailing chunk dimension is the element size, so
# a chunk needs at least one real dimension plus that one.  libhdf5 refuses
# fewer -- H5O__layout_decode fails with "bad dimensions for chunked storage" --
# and h5policy rejected only zero, so a one-dimensional chunked layout, a chunk
# with no real dimensions at all, was accepted.  libhdf5 rejects at dataset
# open, so this is a true A'.
#
# The floor is specific to chunked storage: contiguous and compact layouts in
# the same versions are perfectly legal at ndims 1, which is why the check is
# gated on the layout class rather than applied to every layout message.
# Version 4 dropped the element-size convention and stores the dataset rank
# directly, so it has no floor and none is applied there.
#
# The rank mismatch below is a genuine consequence of the same edit, not noise:
# the dataspace still says rank 1, and a chunked layout claiming ndims 1 no
# longer has the rank-plus-one relationship to it that versions 1 to 3 require.
# Both findings describe the same one-byte defect from different directions.
#
# Built by h5policy-gencorpus at the earliest library bound, which yields a
# version-3 layout inside a version-1 object header -- no checksum to repair.
# Only the count field changes; the dimension list behind it still describes the
# chunk libhdf5 wrote.
file: malformed/bad_layout_chunk_ndims_one.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings:
  - H5_CORRUPT_LAYOUT_DIMENSIONALITY
  - H5_CORRUPT_LAYOUT_RANK_MISMATCH
expected_finding_evidence:
  H5_CORRUPT_LAYOUT_DIMENSIONALITY:
    field: layout.chunk_dimensionality
    actual: 1
    expected: 2
    comparison: at_least
expected_finding_evidence_locations:
  H5_CORRUPT_LAYOUT_DIMENSIONALITY:
    - role: actual
      length: 1
      little_endian_value: 1
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: dataset_layout_filter_fill
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
