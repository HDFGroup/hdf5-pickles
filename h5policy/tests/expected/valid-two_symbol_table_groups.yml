# Control for heap.local_data_segment_unique: two SIBLING symbol-table groups,
# so the file carries three local heaps (root plus one per group) that correctly
# own three DISTINCT data segments.  h5policy must accept it.
#
# The control is the load-bearing half of the pair.  A uniqueness check over a
# file-scoped accumulator has two ways to be wrong, and only one of them is
# caught by the malformed fixture:
#   * it can miss the alias -- malformed/lheap_data_segment_alias.h5 catches that;
#   * it can fire on heaps that are merely DECODED TWICE.  That is a live risk,
#     not a hypothetical: a shared (SOHM) external-file-list message is decoded
#     once per referencing object, and duplicate messages run their validator
#     twice.  The check keys on the (prefix address, segment address) PAIR and
#     stays silent when the prefix matches, which is what makes re-decode safe.
# This fixture is also the seam control: if the accumulator were ever left
# unreset between analyses, a segment address surviving from an earlier file
# would make this file's first heap look like an alias of it -- a false REJECT
# across the seam.  h5policy-seamcheck is the check that catches that class; this
# expectation is what makes the failure legible when it does.
#
# malformed/lheap_data_segment_alias.h5 is derived from this exact file, so the
# pair differs by one field: the data-segment address of the two group prefixes.
#
# Three heaps rather than two is deliberate.  old_style_group.h5 already covers
# a root-plus-nested-group pair, but the alias mutation points BOTH group
# prefixes at one segment, so the control has to have two sibling group heaps to
# mutate -- and a third (the root's) that the mutation leaves alone, proving the
# check does not simply fire on any file with more than one heap.
file: valid/two_symbol_table_groups.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
forbidden: [crash, timeout, external_open, plugin_load, write]
