# Four identical one-byte fill values are shared through a SOHM heap.  The
# fill-message body uses the tiny heap-ID form, so all decoded bytes live in
# the wrapper itself and require neither raw-data access nor decompression.
file: coverage/sohm_tiny.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
forbidden: [crash, timeout, external_open, plugin_load, write]
