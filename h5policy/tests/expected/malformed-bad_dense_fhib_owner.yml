# The FHIB variant of malformed-bad_dense_fhdb_owner: the dense-link heap's
# root INDIRECT block names address 0 (the superblock) instead of its FRHP
# header, with the block checksum recomputed so only the back-pointer is wrong.
# libhdf5 rejects it in H5HF__cache_iblock_deserialize ("incorrect heap header
# address for direct block"), and h5policy must reject the block before its row
# table is used to reach child block addresses.
#
# The per-link H5_CORRUPT_FRACTAL_HEAP_ID findings that follow are the existing
# shape for any fatal indirect-block failure (a bad block version behaves the
# same way): once the root block is refused, no heap ID in the index resolves.
file: malformed/bad_dense_fhib_owner.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FRACTAL_HEAP_BACKPOINTER]
forbidden_findings: [H5_CORRUPT_BAD_CHECKSUM, H5_CORRUPT_OFFSET_OUT_OF_FILE]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: heap_structures
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
