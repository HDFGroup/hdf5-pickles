# The VALID CONTROL for sohm.huge_decoded_size: a filtered SOHM huge-object
# index whose records declare a decoded size ABOVE the heap's managed ceiling
# (8192 against 4096).  The check must stay silent here, or it is pinned to the
# fixture rather than to the format rule.
#
# The decision is `unsupported_coverage_gap` rather than `accept`, and that is
# the correct verdict rather than a shortfall: resolving a shared message out of
# a filtered heap would mean running the filter, which is the boundary the
# oracle refuses to cross.  So a filtered SOHM heap can never reach `accept`,
# and the control's job is the ABSENCE of the finding, not the decision.
file: coverage/sohm_filtered_huge.h5
profile: untrusted-strict
expected_decision: unsupported_coverage_gap
expected_exit: 5
required_findings: []
forbidden_findings: [H5_CORRUPT_SOHM_HUGE_OBJECT_BELOW_MANAGED_MAX]
