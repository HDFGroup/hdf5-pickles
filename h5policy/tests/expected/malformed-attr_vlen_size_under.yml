# The class-9 sibling of malformed-attr_reference_size_under: a variable-length
# attribute declaring a 1-byte element where H5T__vlen_set_loc (H5Tvlen.c:300)
# assigns 4 + blob_id_size == 16.  Same defect, different class, same fault site
# (H5Aint.c:769) -- the ASAN build reports `heap-buffer-overflow READ of size 16`
# there, and stock h5dump -A completes with exit 0 having over-read.
#
# Kept as a separate row rather than a second attribute on the reference fixture:
# the two sizes are restored by different functions (H5T__ref_set_loc vs
# H5T__vlen_set_loc), so a fix that covers only one class must still fail a test.
#
# Full record: registry/cases/datatype-size-not-final.yml.
file: malformed/attr_vlen_size_under.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DATATYPE_VLEN_SIZE]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: datatypes
  # libhdf5 ACCEPTS this file and over-reads; the exact-build canary must not be
  # allowed to report the divergence as agreement.
  require_oracle_alignment: true
  allowed_statuses: [unexercised, violation]
forbidden: [crash, timeout, external_open, plugin_load, write]
