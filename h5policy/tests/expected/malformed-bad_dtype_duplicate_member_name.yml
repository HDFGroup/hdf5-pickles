# A compound datatype whose two members are both named "aa".
#
# libhdf5 strcmps each new field name against every name already decoded and
# refuses the datatype -- H5O__dtype_decode_helper fails with "duplicated
# compound field name 'aa', for fields 0 and 1" -- while opening the dataset, so
# this is a true A' case: h5py cannot open the object.  h5policy read each
# member name only to find where it ended and never compared names, so it
# accepted the type.
#
# The defect is ambiguity rather than a range error, which is what makes it
# interesting: every offset, size and nested type is in range, so nothing about
# the message looks wrong field-by-field.  It is wrong only when two members are
# read together -- a by-name lookup resolves to the first member while a
# by-index walk sees both, so two consumers disagree about which four bytes the
# field denotes.  Hence scope record_local rather than local_decode.
#
# On the implementation: names are hashed and byte-compared only when hash and
# length both match.  The confirm step is mandatory, not an optimisation -- a
# hash collision must never on its own reject a valid file -- and the hash is
# what keeps the check off an O(n^2) path over a member count the file controls
# (a 64 KB message can declare thousands of one-character members).
#
# numpy will not build a dtype with repeated field names, so h5policy-gencorpus
# writes "aa" and "bb" and overwrites the second name afterwards.  The names are
# the same length, so every byte behind them keeps its offset and the collision
# is the only change.  Written at the earliest bound: a version-1 object header
# has no checksum to repair.
file: malformed/bad_dtype_duplicate_member_name.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DATATYPE_DUPLICATE_MEMBER_NAME]
forbidden_findings:
  - H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS
  - H5_CORRUPT_DATATYPE_MESSAGE_TOO_SMALL
expected_finding_evidence:
  H5_CORRUPT_DATATYPE_DUPLICATE_MEMBER_NAME:
    field: datatype.member_name_unique
    actual: 1
    expected: 0
    comparison: not_equal
expected_finding_evidence_locations:
  # Both member names, so the report points at the pair rather than one of them.
  H5_CORRUPT_DATATYPE_DUPLICATE_MEMBER_NAME:
    - role: actual
      length: 2
    - role: expected
      length: 2
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: datatypes
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
