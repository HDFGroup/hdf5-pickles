# A v1 B-tree INTERNAL node whose separator keys are out of order.
#
# Separator keys carry the same ordering obligation as leaf keys, and breaking it
# costs MORE: a duplicate leaf key loses one chunk, while a bad separator makes an
# entire SUBTREE unreachable.  MEASURED on this fixture -- 130 one-element chunks
# over a two-level index -- libhdf5 returns the FILL VALUE for elements 0..56 and
# correct data for 57..129, at h5dump rc=0.  57 of 130 values silently replaced,
# no error, no warning.
#
# IT MUST BE A MULTI-LEVEL INDEX, which is the whole reason this gap existed.
# A single-node tree has no separators at all, so every small fixture is blind to
# it by construction -- the identical shape to the paged fixed-array bug, where
# small controls could not reach the paged branch either.  The base is
# chunked_v1_btree_deep.h5 (130 chunks over 64-entry nodes) and the generator
# asserts the root node's level is nonzero, so a base-file change that flattened
# the tree fails loudly rather than yielding a fixture that tests nothing.
#
# NON-VACUOUS AND ISOLATED: with the internal-node call reverted -- leaving the
# leaf check in place -- this file is `accept`.  So it pins the separator check
# specifically, not chunk.key_order in general; malformed/chunk_duplicate_key_offset.h5
# is the leaf half of the pair.
#
# The DUPLICATE arm is used (key[1]'s offsets copied from key[0]) rather than an
# inversion.  Both emit the same code from the same comparison; the duplicate's
# damage is the cleaner demonstration -- a contiguous leading run of fill values
# rather than a split.  Measured for the inversion too: it loses 57..129 instead.
#
# Checked BEFORE descending into children, so a node whose own keys disagree is
# reported even when every child is individually well-formed.
#
# Same A~ treatment as the rest of the family (chunk_silent_wrong_data_only):
# libhdf5 both opens and reads successfully, so no return code carries the defect
# and there is no A+ evidence for the harness to find.
#
# A v1 B-tree node carries no checksum and the edit is size-neutral, so nothing
# needs repairing.
file: malformed/chunk_internal_separator_order.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_CHUNK_KEY_ORDER]
expected_analysis:
  complete: true
  walk_started: true
  walk_completed: true
  continue_after_rejection: false
  findings_truncated: false
# MEASURED 2026-08-23 with `--exercise chunk_index`: outcome=accepted,
# violations=[], family exercise 1/1 completed -> verified.
h5cve: {family: chunk_index, allowed_statuses: [verified]}
forbidden: [crash, timeout, external_open, plugin_load, write]
