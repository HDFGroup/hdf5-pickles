# A link message that stops short of the fractal-heap object holding it.
#
# This is the shape libhdf5 2.3.0 WRITES for a soft-link target of 65536 bytes
# or more.  H5O__link_size reserves 2 + strlen(target) bytes for the message
# while H5O__link_encode stores 2 + (uint16_t)strlen(target)
# (src/H5Olink.c:373), and H5G__dense_insert then hands H5HF_insert the FULL
# reserved length -- so the heap object ends with bytes the encoder never wrote
# and the allocator never cleared, and H5Lcreate_soft still returns success.
# Measured on 2.3.0: a 65537-byte target is persisted as "/", and
# `target_len - (target_len % 65536)` bytes of recycled process heap are written
# into the file (up to 3,997,696 at a 4,000,000-byte target).
#
# The fixture is byte-patched down to a 100-byte shortfall rather than built at
# 65536, because the defect is the DISAGREEMENT between the message and its
# container, not the size of it -- and a 64 KB fixture walks far more slowly for
# no additional coverage.
#
# INVARIANT-A' GUARD.  The shortened target resolves: the base fixture creates a
# group at that path on purpose, so libhdf5 opens the link, reports
# `accepted`, and silently follows a DIFFERENT object -- measured, h5ls shows
# the target's length fall from 4200 to 4100.  Nothing inside the message can
# show it; the stored value length is self-consistent and the target it
# describes is intact.  Only the container's extent disagrees, which is why the
# rule lives at the dense caller and compares against the heap object's size.
#
# NON-VACUOUS, proved by reverting one fix at a time: with the tail-slack rule
# alone disabled -- the huge-object index walk left in place -- this file is
# ACCEPTED with zero findings.
#
# MEASURED canary status, not inferred: `accepted`, six entry-point calls
# completed, zero call errors.  A `verified` canary on a malformed fixture is
# the normal signature of a silent-wrong-data defect: libhdf5 completes the
# exercise precisely because it accepts the corruption.
file: malformed/dense_link_heap_object_slack.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LINK_MESSAGE_TRAILING_BYTES]
h5cve:
  family: dense_index
  allowed_statuses: [verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
