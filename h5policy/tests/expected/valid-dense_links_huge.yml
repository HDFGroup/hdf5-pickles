# Dense link storage whose records are fractal-heap HUGE objects, beside a
# managed one.
#
# A link message over H5G_FHEAP_MAX_MAN_SIZE (4096 bytes, src/H5Gdense.c) is not
# stored in a managed direct block: libhdf5 writes it as a standalone file
# extent and indexes it in the heap's huge-object v2 B-tree, so the name index's
# heap ID carries that tree's KEY instead of a doubling-table offset.  A single
# long soft-link target reaches this with no other unusual property.
#
# h5policy used to decline every such file with
# H5_UNSUPPORTED_PICKLE_COVERAGE_GAP ("dense link name index uses a non-managed
# fractal-heap ID") -- a refusal, so not an accept, but it meant no invariant in
# this family was ever applied to a group holding one long link.
#
# The REGIME this fixture holds is "a managed object and a huge object in one
# name index", so both ID forms are resolved in one walk.  The huge-only regime
# is the sibling fixture, because this one's doubling-table root is defined and
# therefore cannot catch the undefined-root path coming back.
#
# Both soft links RESOLVE on purpose: the dense_index exercise opens what each
# link names, and a dangling target would make the canary report
# rejected_in_traversal for a reason that has nothing to do with the layout.
#
# MEASURED canary status, not inferred: `accepted`, six entry-point calls
# completed, zero call errors.
file: valid/dense_links_huge.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
h5cve:
  family: dense_index
  allowed_statuses: [verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
