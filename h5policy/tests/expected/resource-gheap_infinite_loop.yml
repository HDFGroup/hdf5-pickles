# An orphaned global heap collection (GCOL) whose free-space object (heap
# index 0) is encoded with a zero length.  libhdf5's H5HG deserialize advances
# by that object's size for index 0, so a zero never moves the parse cursor and
# a consumer that loads the collection loops forever (h5debug hangs on it).
#
# The libhdf5 defect is recorded in
# registry/cases/global-heap-zero-progress-sentinel.yml.  This fixture is the
# INDEX-0 half of it: src/H5HGcache.c:358 gives the sentinel `need = size` raw,
# and the comment at :348-351 asserts that size "already includes the object
# header" -- the missing invariant, stated and unenforced.
#
# It used to be filed here as a BRANCH ASYMMETRY, on the reading that :353 gives
# every normal object `need = H5HG_SIZEOF_OBJHDR(f) + H5HG_ALIGN(size)` and is
# therefore structurally positive.  That reading was wrong: the sum is unchecked
# size_t and eight declared lengths per width wrap it to zero.  See
# resource-gheap_need_wrap_zero.yml, which reaches the identical non-termination
# through an index-1 object.  One invariant (heap.global_progress), one loop, two
# entrances -- the sentinel needs no arithmetic, the normal arm needs a wrap.
#
# THIS FIXTURE IS THE ORPHANED HALF.  The record's other bundle reaches the same
# collection through a VDS mapping, where an ordinary open hangs before any
# source-file activation -- so "unreachable" here is a property of this file,
# not of the defect.  No ASan report exists for either: nothing is read out of
# bounds, so a sanitizer-first approach misses this family entirely.
# Nothing references the collection, so the reachable walk and libhdf5's normal
# open never touch it -- only the forensic profile's GCOL signature sweep finds
# it, reporting a resource (denial-of-service) hazard.  The default reachability
# profiles correctly accept the file (the hazard is unreachable).  Built by
# h5policy-gencorpus, which appends the collection to a valid empty file.
file: resource/gheap_infinite_loop.h5
profile: forensic
expected_decision: reject_resource
expected_exit: 4
required_findings: [H5_RESOURCE_GLOBAL_HEAP_INFINITE_LOOP]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: heap_structures
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
