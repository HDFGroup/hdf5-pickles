# An external file list slot whose filename offset resolves to the empty
# string.
#
# libhdf5 refuses a slot naming no file -- H5O__efl_decode fails with "invalid
# external file name" -- and it does so while opening the dataset, so this is a
# true A' case: h5py cannot open the object at all.  h5policy checked that the
# offset landed inside the local heap and that the name terminated there, but
# never that anything was actually spelled at that offset, so it accepted the
# slot and went on to classify the empty path.
#
# The mutation points the slot at heap offset 0, because a local heap
# conventionally holds the empty string there -- the shape a zeroed or
# never-initialised slot actually takes.  The rule being mirrored is about the
# *byte* at the resolved offset rather than the offset itself, so a slot
# pointing at any empty string is caught, not just offset 0.
#
# Worth recording why this is not the "entry at offset 0 is not the empty
# string" check three lines earlier in H5Oefl.c: that one sits inside
# #ifdef H5O_DEBUG and never runs in a release build, so it is not an A'
# divergence at all and no check mirrors it.
#
# Built by h5policy-gencorpus from the external_storage fixture, repairing the
# enclosing v2 object-header checksum.
file: malformed/bad_efl_name_empty.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_EXTERNAL_FILE_LIST_NAME_EMPTY]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: external_file_list
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
