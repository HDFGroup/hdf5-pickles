# A version-2 superblock whose status-flag byte sets bit 3.
#
# libhdf5 applies one flag test to every version-2-and-later superblock
# (H5Fsuper_cache.c, "bad flag value for superblock"), but h5policy only
# checked version 3 -- so version 2 fell through the gap between the v0/v1
# branch, which checked nothing, and the v3 test.  This fixture closes the
# middle of that range; the two v0 fixtures cover the lower end.
#
# h5py writes version 0 or version 3 and never version 2, so the file is a
# version-3 superblock downgraded by one byte.  The two versions have identical
# layout -- version 3 only adds meaning for the SWMR flags -- so nothing else
# has to move.  The trailing Jenkins checksum is recomputed afterwards, without
# which libhdf5 would reject for the checksum and the case would prove nothing
# about flags.
#
# libhdf5 rejects at H5Fopen, so this is a clean A'.  Built by
# h5policy-gencorpus.
file: malformed/bad_superblock_v2_status_flags.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SUPERBLOCK_STATUS_FLAGS]
expected_finding_evidence:
  H5_CORRUPT_SUPERBLOCK_STATUS_FLAGS:
    field: superblock.status_flags
    actual: 8
    expected: 7
    comparison: subset_of
expected_finding_evidence_locations:
  # v2/v3 store the flags as a single byte at superblock offset 11.
  H5_CORRUPT_SUPERBLOCK_STATUS_FLAGS:
    - role: actual
      length: 1
      little_endian_value: 8
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: validation_controls
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
