# External link whose value carries no NUL terminator, so the target file name
# never ends inside the value.  The value is structurally malformed, so h5policy
# rejects it as corrupt under every profile (corrupt outranks the external-link
# policy finding), unlike a well-formed external link with a hostile *target*,
# which is only a policy matter.  Built by h5policy-gencorpus, which wipes the
# NUL terminators in a valid external link's value.
#
# The libhdf5 defect this isolates is recorded in
# registry/cases/external-link-value-strlen-unbounded.yml.  It was an
# out-of-bounds read: H5L__extern_traverse was GIVEN the value length, marked it
# `size_t H5_ATTR_UNUSED udata_size`, ran strlen over the value and derived the
# object-path pointer from the result.
#
# FIXED UPSTREAM, measured 2026-10-12.  libhdf5 8117f4c75fd (2026-10-08, "reject
# malformed external link data in H5L__extern_traverse") drops the
# H5_ATTR_UNUSED and validates first: `udata_size <= 2` and a value not ending
# on a NUL are both rejected (src/H5Lexternal.c:131-134) before the version byte
# is read, and a file name that fills the value leaves no object path
# (:146-147).  That is the containment this repository's case record proposed.
#
# WHAT THAT CHANGES HERE.  The probe now reports rejected_in_traversal with
# `external_open: 0`, so the family exercise never completes and the canary
# status is `unexercised`, not `violation`.  The three external opens this block
# used to assert -- on "other.h5A/xA", the merged strings -- are gone, and so is
# the ASan heap-buffer-overflow in strlen.  The control for the zero is
# policy/external_link.h5, which still reports `external_open: 3` in the same
# run.
#
# WHAT IT DOES NOT CHANGE.  The commit is in no tagged release, so this contract
# describes a `develop` build and a release build will report `violation` here;
# read a red row as a build difference against the pin in
# registry/libhdf5-evidence.yml, and re-measure rather than widening the list.
# The decode half is also still open: H5O__link_decode tests only `len < 3`
# (src/H5Olink.c:250) and stores the length at :252, so a malformed value still
# materialises -- and H5O__link_debug still derives the object name with an
# unbounded strlen (:824) and prints it (:829), which this very file turns into
# a live heap-buffer-overflow READ under `h5debug <file> 48`.  See the case
# record's `surviving_sibling`.
file: malformed/external_link_unterminated_value.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_EXTERNAL_LINK_VALUE_NOT_TERMINATED]
h5cve: {family: external_link, allowed_statuses: [unexercised]}
forbidden: [crash, timeout, external_open, plugin_load, write]
