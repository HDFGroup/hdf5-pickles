# External link whose value carries no NUL terminator, so the target file name
# never ends inside the value.  libhdf5's H5L__extern_traverse runs strlen()
# over it and reads past the buffer -- an out-of-bounds read.  The value is
# structurally malformed, so h5policy rejects it as corrupt under every profile
# (corrupt outranks the external-link policy finding), unlike a well-formed
# external link with a hostile *target*, which is only a policy matter.  Built
# by h5policy-gencorpus, which wipes the NUL terminators in a valid external
# link's value.
#
# The libhdf5 defect this isolates is recorded in
# registry/cases/external-link-value-strlen-unbounded.yml.  H5L__extern_traverse
# (src/H5Lexternal.c:96) is GIVEN the value length and marks it
# `size_t H5_ATTR_UNUSED udata_size`, then calls strlen at :132 and derives
# obj_name from the result at :133; its sibling H5L__extern_query (:274) uses
# the same parameter correctly.  The length is available -- H5O__link_decode
# stored it at src/H5Olink.c:252 and tests only `len < 3` at :250.
#
# NOTE the `forbidden: external_open` below constrains h5policy, not libhdf5.
# libhdf5 makes THREE external-open attempts on this shape before failing, so
# its eventual error is not a bound.
# Registry caveat, and it is NOT that the registry is wrong.  The three opens do
# not contradict the `hdf5: enforced` claim for elink.value_terminated:
# `verdict` is scoped to `reject_corrupt` specimens and means "libhdf5 rejects
# the comparable specimens", and libhdf5 does reject this file -- after three
# external opens.  The opens are recorded where they belong, in
# `activation_observed` and in the derived
# `no_activation_on_validation_failure`.
# For an invariant whose whole point is that nothing may be opened before the
# value is proven terminated, the field to read is `activation_observed`, NOT
# `verdict`.  See the record's `registry_reading_note`, which also carries the
# history of an earlier, retracted reading of this same row.
file: malformed/external_link_unterminated_value.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_EXTERNAL_LINK_VALUE_NOT_TERMINATED]
h5cve: {family: external_link, allowed_statuses: [violation]}
forbidden: [crash, timeout, external_open, plugin_load, write]
