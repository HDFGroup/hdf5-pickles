# The one serialized fractal-heap free section (reached from a SOHM FRHP header)
# is retyped from SINGLE (class 0) to INDIRECT (class 3) -- one byte, plus the
# FSSE checksum repair that keeps the class value the only fault.
#
# Class 3 is IN RANGE: H5HFspace.c:84 registers four classes and H5FScache.c:1019
# rejects only `sect_type >= fspace->nclasses`, so the bound libhdf5 does apply
# passes.  What it does not check is that the class is one the client ever
# SERIALIZES.  NORMAL_ROW(2) and INDIRECT(3) carry a NULL `deserialize` slot by
# design (H5HFsection.c), and the only guard left is
# `assert(fspace->sect_cls[sect_type].deserialize)` at H5FScache.c:1024, which
# -DNDEBUG strips from every shipped build.  The next statement calls through
# that NULL pointer.
#
# Measured 2026-11-12 against libhdf5 2.3.0 (develop 78c25cf819f), driving the
# section-list load with
#   h5debug <file> 2226 1297 1082      (FSSE, its FSHD, the owning FRHP)
# on the fixture and on the untouched base:
#   baseline  Release -DNDEBUG   fixture SIGSEGV (139)  base exits 0
#   ASan, asserts LIVE           fixture aborts at H5FScache.c:1024 on the
#                                assert itself -- the assert MASKS the witness
#   ASan + -DNDEBUG (as shipped) fixture "SEGV on unknown address 0x0
#                                (pc 0x0)" -- the indirect call through NULL
#   i386 -DNDEBUG                fixture SIGSEGV (139)  base exits 0
# so the defect is a null function-pointer dispatch and is width-independent.
#
# No h5cve/allowed_statuses block, and this was MEASURED rather than copied from
# the sibling: `h5policy-probe --exercise free_space` reports outcome "accepted"
# on this fixture, because the free_space canary calls
# H5Fget_free_sections(H5FD_MEM_DEFAULT), which queries the FILE-level free-space
# manager and never loads the FRHP's internal client-0 manager where this defect
# lives.  Same conclusion as the same-base siblings bad_frhp_fsm_section_extent
# and bad_frhp_indirect_section_row: the canary cannot judge this family, and the
# exact-build defect above is what the measurement out of band establishes.
file: malformed/bad_frhp_section_class.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FSM_SECTION_TYPE]
forbidden: [crash, timeout, external_open, plugin_load, write]
