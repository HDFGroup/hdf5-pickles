# The REVISED-reference sibling of attr_region_sel_blocks_over.
#
# Its point is the OFFSET, not the count. A revised reference's selection does not
# start where a legacy one's does: H5R__encode_region writes a token-width byte,
# the token, then a selection-size word and a rank word ahead of the selection,
# so the walker must skip 1 + token_size + 8. Getting that arithmetic wrong reads
# coordinate bytes as a selection header -- a false positive on every valid file.
# This fixture pins the derivation and valid/attr_stdref_region.h5 is the control
# that proves it. Measured -- H5Aread fails cleanly on the exact build.
#
# Only the FIRST of the two references is patched; the second is an in-file
# control.
# Case record: registry/cases/attribute-selection-unvalidated.yml
file: malformed/attr_stdref_sel_blocks_over.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SELECTION]
h5cve:
  # Named mechanically from the primary finding via registry/findings/; the
  # selection codes are shared with the VDS layout and route on the message's
  # role prefix, so an attribute-borne selection resolves to message_envelope.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
