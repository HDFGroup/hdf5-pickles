# A user block and a metadata cache image in one file. The image records the
# address of every entry it shadows, and those addresses are base-relative like
# every other HDF5 file address. Compared against physical walk addresses they
# never match, the shadow ranges silently move by the base, and the walk decodes
# the stale on-disk root header the image exists to replace -- so this fixture
# rejected with H5_CORRUPT_UNSUPPORTED_OBJECT_HEADER_VERSION while libhdf5 read
# it without complaint. valid/cache_image.h5 covers the image alone and
# valid/userblock_latest.h5 the user block alone; only the pair reaches the
# translation.
file: valid/userblock_cache_image.h5
profile: legacy
expected_decision: accept
expected_exit: 0
required_findings: []
h5cve:
  family: cache_image_dependency_graph
  allowed_statuses: [verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
forbidden_findings: [H5_CORRUPT_UNSUPPORTED_OBJECT_HEADER_VERSION,
                     H5_CORRUPT_OFFSET_OUT_OF_FILE,
                     H5_UNSUPPORTED_PICKLE_COVERAGE_GAP]
