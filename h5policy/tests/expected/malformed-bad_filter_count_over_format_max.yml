# A filter pipeline declaring 33 filters, one past the format's ceiling.
#
# H5Z_MAX_NFILTERS is 32, and H5O__pline_decode refuses anything above it
# unconditionally ("filter pipeline message has too many filters") -- no property
# list, no build option and no consumer setting relaxes it.  h5policy checked the
# count only against profile.resources.max_filter_count, so every profile whose
# budget exceeds 32 accepted the message: a tier-2 A' divergence (libhdf5
# rejects, h5policy accepted), now closed.
#
# The profile override is the point of the case.  Raising max_filter_count to 64
# silences H5_RESOURCE_FILTER_COUNT -- which is forbidden below precisely so the
# case cannot pass on the budget finding by accident -- leaving the format
# ceiling to reject the file on its own.  That separation is what the two codes
# mean: the resource finding reports a budget a consumer may raise, the corrupt
# one reports a limit no consumer can.
#
# Only one descriptor is actually encoded, so the walk also runs off the end of
# the pipeline and reports the overrun.  That is honest output for the file, not
# the property under test.  Built by h5policy-gencorpus, which raises the count
# byte in a version-1 pipeline; version-1 object headers have no checksum to
# repair.
file: malformed/bad_filter_count_over_format_max.h5
profile: untrusted-strict
profile_overrides:
  resources:
    max_filter_count: 64
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FILTER_PIPELINE_TOO_MANY_FILTERS]
verification:
  # 33 filters against H5Z_MAX_NFILTERS of 32: the format's own ceiling,
  # taken one step past.
  count_and_extent_boundaries: [max, n_plus_one]
forbidden_findings: [H5_RESOURCE_FILTER_COUNT]
expected_finding_evidence:
  H5_CORRUPT_FILTER_PIPELINE_TOO_MANY_FILTERS:
    field: filter_pipeline.nfilters
    actual: 33
    expected: 32
    comparison: at_most
expected_finding_evidence_locations:
  H5_CORRUPT_FILTER_PIPELINE_TOO_MANY_FILTERS:
    - role: actual
      length: 1
      little_endian_value: 33
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: dataset_layout_filter_fill
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
