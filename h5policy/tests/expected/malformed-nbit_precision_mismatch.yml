# An n-bit filter descriptor whose bit precision contradicts the datatype
# message: cd_values[6] patched 20 -> 24 on a 20-bit-precision i4.
#
# libhdf5 writes the word from H5T_get_precision() of the object's own datatype
# (H5Znbit.c:479) and never compares it back; the decompressor uses it to place
# each element's bits, so a disagreement shifts every value silently.
#
# 24 is chosen to stay INSIDE the 32-bit storage size, so the datatype-level
# precision-bounds rule (H5_CORRUPT_DATATYPE_PRECISION_BOUNDS) is untouched and
# the only broken rule is the agreement between the two messages.  A value that
# also overran the storage size would have produced a fixture that passes for
# the wrong reason.
#
# libhdf5 behaviour is build-dependent.  Before a3cf1ea82cc (2026-09-25, "Fix
# CVE issues related to Nbit/Fletcher32 decode paths") it opened and read with
# rc=0 and different values; no crash, clean under AddressSanitizer -- the
# silent-wrong-data signature, canary status `verified`.  From a3cf1ea onward the
# n-bit decompressor rejects the read (H5Dread errors at H5Znbit.c:1396,
# "can't decompress atomic"), so the dataset_layout exercise never completes and
# the status is `unexercised`.  MEASURED both ways: an ASan build predating
# a3cf1ea (2026-08-30) reads rc=0 with wrong values; the post-fix builds (release
# install 2026-10-01 and ASan build c25f66c178d1da0f, 2026-10-02) error cleanly
# at H5Znbit.c:1396 with no overflow.  Both statuses are permitted below so the
# matrix is green on any build before or after the fix.
file: malformed/nbit_precision_mismatch.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FILTER_PARM_MISMATCH]
expected_finding_evidence:
  H5_CORRUPT_FILTER_PARM_MISMATCH:
    field: filter.decode_precision
    actual: 24
    expected: 20
    comparison: equal
h5cve: {family: dataset_layout_filter_fill, allowed_statuses: [verified, unexercised]}
forbidden: [crash, timeout, external_open, plugin_load, write]
