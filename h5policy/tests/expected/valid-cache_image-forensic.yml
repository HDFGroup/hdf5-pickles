# A metadata cache image shadows ordinary on-disk bytes at logical metadata
# addresses. Forensic mode must read the cached bodies rather than stale backing
# bytes, and a valid image must therefore complete without a synthetic finding.
file: valid/cache_image.h5
profile: forensic
expected_decision: accept
expected_exit: 0
forbidden_findings: [H5_CORRUPT_UNSUPPORTED_OBJECT_HEADER_VERSION]
expected_analysis:
  complete: true
  walk_started: true
  walk_completed: true
  stop_reason: ""
  continue_after_rejection: true
  findings_truncated: false
forbidden: [crash, timeout, external_open, plugin_load, write]
