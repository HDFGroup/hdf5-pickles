# ONE corrupt collection reached by TWELVE attribute descriptors -- the
# de-duplication guard.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
#
# A global heap has no per-object access path, so a defect anywhere in a
# collection is a defect for every reference into it. A walker that reports per
# reference buries the finding in copies of itself, and re-walks the same broken
# collection each time.
#
# MEASURED both ways: with the bad-collection record removed this file yields
# TWELVE identical H5_CORRUPT_GLOBAL_HEAP_OBJECT findings; with it, exactly one.
#
# `expected_finding_counts` is what pins that, and it is the only assertion in the
# harness that can: `required_findings` is a SET test, so twelve copies satisfy it
# just as well as one does. That gap is why a regression to per-reference
# reporting was previously invisible to every assertion available.
#
# The corruption is the object-size wrap (2^64-1), which every descriptor's walk
# reaches identically. Chosen over the simpler nonzero-reserved-bytes corruption
# deliberately: libhdf5 SKIPS the reserved bytes without checking them
# (H5HGcache.c, `p += 4`), so a file corrupt only there is read normally, and
# rejecting it would be an invariant-A false positive. A fixture must be malformed
# in a way the reference library agrees about, or it pins a divergence rather than
# a defect.
file: malformed/attr_gheap_dedup_many_refs.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_GLOBAL_HEAP_OBJECT]
expected_finding_counts:
  H5_CORRUPT_GLOBAL_HEAP_OBJECT: 1
h5cve:
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
