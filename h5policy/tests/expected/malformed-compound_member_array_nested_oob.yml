# The v1 embedded-array promotion defect ONE LEVEL DOWN.
#
# Its three siblings -- compound_member_array_bounds.h5,
# compound_member_array_nelem_overflow.h5 and
# compound_member_array_off12_oob.h5 -- all put the oversized member in the
# dataset's OWN compound.  That leaves the depth question open, and the depth
# question is the one a fix has to answer: H5O__dtype_decode_helper recurses
# into a nested compound and applies the same :507/:509-before-:542 ordering at
# every level, so a guard added only at the top level would close all three
# siblings and leave this file accepted.
#
# Geometry, deliberately the off12 geometry moved down one level so the two
# fixtures differ in depth and in nothing else.  Outer element 16 bytes; its
# single member "a" at offset 0 is a nested compound declared 8 bytes, which
# passes the outer bound 0 + 8 <= 16 honestly.  Inside that nested compound the
# single member "a" sits at offset 4 with a [2] array of H5T_STD_U32LE: the
# 4-byte BASE type passes the inner bound 4 + 4 <= 8, H5T__array_create promotes
# it to 8 bytes at H5Odtype.c:542, and the promoted member ends at 12 -- past the
# 8-byte compound that contains it.  Neither guard re-runs.
#
# MEASURED 2026-08-26 against HDF5 2.3.0 (source 51b92ccee54), baseline and
# ASan candidate, x86-64 and i386:
#   H5Fopen, H5Dopen2, H5Dget_type, H5Tget_native_type and H5Dread all succeed.
#   H5Tget_member_type reports the inner member as ending at 12 inside an 8-byte
#   compound -- libhdf5 publishes the contradiction through the public API.
#   Identical on i386, because dims [2] give 8 bytes at both widths: this
#   fixture isolates the GUARD-ORDERING half of the defect from the arithmetic
#   half, exactly as its off12 sibling does.
#
# No sanitizer report on the ASan build, and that is expected rather than
# disappointing.  A nested carrier does not reach H5T__conv_struct_opt at the
# promoted size: the top-level strided copy runs at the nested compound's honest
# 8 bytes, and making the INNER copy overrun would need a memory-side compound
# smaller than the promoted member -- which H5T__insert (H5Tcompound.c:421)
# refuses to build, since it applies the very bound the decoder skipped.  This
# fixture therefore carries the ACCEPTANCE divergence and the depth argument;
# compound_member_array_off12_oob.h5 remains the family's memory-safety carrier.
#
# The libhdf5 defect is recorded in
# registry/cases/compound-member-array-promotion-unguarded.yml.  Modelled on a
# fuzzed copy of the HDF5 test file tnestedcomp.h5 that reached triage, whose
# nested carrier was `struct {char; float[62978];}` inside a 12-byte compound.
file: malformed/compound_member_array_nested_oob.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: datatypes
  require_oracle_alignment: true
  # MEASURED, not assumed: the probe's datatype exercise completes against both
  # builds and reports outcome=accepted, so the canary is a genuine divergence.
  # Same status as compound_member_array_bounds.h5, reached at a nesting depth
  # no other fixture in the family covers.
  allowed_statuses: [violation]
forbidden: [crash, timeout, external_open, plugin_load, write]
