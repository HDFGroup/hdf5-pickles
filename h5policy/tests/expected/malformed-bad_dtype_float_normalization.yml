# An IEEE double whose mantissa normalization field holds the reserved
# encoding (3).
#
# Normalization is a 2-bit field in the datatype class flags with three defined
# values -- none (0), MSB-set (1) and implied (2).  libhdf5 refuses the fourth:
# H5O__dtype_decode_helper's switch has no case for it and falls through to
# "unknown floating-point normalization".  h5policy read the class flags for the
# sign bit position and nothing else, so the reserved encoding was accepted.
#
# libhdf5 writes 2 (implied) for an IEEE double, so the fixture rewrites class
# flag byte 0x20 to 0x30.  The field is two bits inside a byte the message
# already carries, so every offset behind it is untouched and the reserved
# encoding is the only defect -- the sign, exponent and mantissa ranges remain
# exactly those of a valid double.
#
# libhdf5 rejects at dataset open, so this is a true A'.  Built by
# h5policy-gencorpus at the earliest library bound; a version-1 object header
# has no checksum to repair.
file: malformed/bad_dtype_float_normalization.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DATATYPE_FLOAT_NORMALIZATION]
forbidden_findings:
  - H5_CORRUPT_DATATYPE_FLOAT_OVERLAP
  - H5_CORRUPT_DATATYPE_FLOAT_SIGN
  - H5_CORRUPT_DATATYPE_FLOAT_EXPONENT
  - H5_CORRUPT_DATATYPE_FLOAT_MANTISSA
expected_finding_evidence:
  H5_CORRUPT_DATATYPE_FLOAT_NORMALIZATION:
    field: datatype.float_normalization
    actual: 3
    expected: 2
    comparison: at_most
expected_finding_evidence_locations:
  H5_CORRUPT_DATATYPE_FLOAT_NORMALIZATION:
    - role: actual
      length: 1
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: datatypes
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
