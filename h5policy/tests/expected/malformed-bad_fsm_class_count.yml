# A file free-space manager header declaring 32515 section classes.
#
# libhdf5 registers exactly THREE classes for the file client
# (H5MF_FSPACE_SECT_CLS_SIMPLE/SMALL/LARGE, src/H5MF.c:292 and :366) and refuses
# a stored count above the client's own:
#   if (fspace->nclasses > 0 && nclasses > fspace->nclasses)
#       HGOTO_ERROR(... "section class count mismatch")     H5FScache.c:270
# so H5Fget_free_sections fails. The fractal-heap client registers four
# (SINGLE/FIRST_ROW/NORMAL_ROW/INDIRECT, src/H5HFspace.c:84), which is why the
# limit is per client and h5_frhp_fspace.pk carries its own.
#
# A MEASURED invariant-A' gap, and the reason this fixture exists: before the
# check, h5policy accepted this file with ZERO findings under every profile --
# forensic included, on a complete walk -- while libhdf5 refused it. The
# inflated count also made control.fsm_section_type vacuous, since that bound is
# `s_type >= nclasses` taken against the STORED count, so one field both slipped
# past the oracle and disabled one of its checks. That is the more dangerous
# half and it is why the count needs its own invariant rather than a bound
# derived from itself.
#
# Found by driving fuzzlib `struct_deep` mutants of valid/fsm_persist.h5 past
# h5policy and h5policy-probe --exercise free_space. The probe is the only
# instrument that can judge this family: H5Fget_free_sections is the sole entry
# point that deserializes FSHD/FSSE, and h5py exposes nothing that reaches it --
# measured, H5Fget_freespace returns the same total for the valid seed and for
# every bad_fsm_* fixture, checksum flip included.
file: malformed/bad_fsm_class_count.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FSM_CLASS_COUNT]
h5cve:
  family: validation_controls
  # MEASURED, not inferred: `unexercised`, aligned, rejected_in_traversal.  The
  # free_space canary ATTEMPTS the exercise and fails -- H5Fget_free_sections
  # returns an error -- so it never completes, and an incomplete exercise is
  # `unexercised` however cleanly libhdf5 refused.  Declaring `verified` from the
  # probe's outcome alone made the matrix red.
  allowed_statuses: [unexercised]
forbidden: [crash, timeout, external_open, plugin_load, write]
