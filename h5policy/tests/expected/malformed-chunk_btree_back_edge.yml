# A chunked dataset whose version-1 chunk index points back at its own ancestor.
#
# The chunk-index twin of malformed/group_btree_back_edge.h5.  One rule,
# H5_CORRUPT_BTREE_CYCLE, serves both roles because the same H5B_find_helper
# serves both tree types; this fixture is what keeps the chunk role from being a
# rule nothing exercises.  The routing is by message, so the two are told apart
# by "chunk B-tree ..." against "group B-tree ..." --
# registry/findings/routes/H5_CORRUPT_BTREE_CYCLE.yml.
#
# THE DEFECT IS ONLY IN THE DATA PATH, which is the interesting difference from
# the group twin.  Measured on libhdf5 2.3.0 (develop 78c25cf819f):
#     h5dump -H      exit 0   -- the header path never walks the index
#     h5dump -d /d   SIGSEGV  -- reading an element descends into the cycle
# So a consumer that only inspects structure sees nothing wrong, and a consumer
# that reads one byte of data dies.
#
# THREE CONSTRAINTS NEARLY EXCLUDE EACH OTHER, and the generator asserts the
# regime that survives them:
#   depth     the back edge must leave a node above level 0, since a level-0
#             chunk node holds chunk RECORDS and not child pointers; a level-1
#             root admits only the self-pointer libhdf5 already rejects.  That
#             needs more than ~4096 chunks.
#   resource  untrusted-strict refuses more than 4096 chunks below 4 KiB each
#             (H5_RESOURCE_CHUNK_TOO_SMALL), so the chunks must be >= 4 KiB --
#             and 4096 chunks of 4 KiB is 16 MiB of logical data.
#   size      deflate removes it: the data is all zeros, so the fixture is
#             ~330 KiB and the control accepts with only the filter advisory.
#
# THE BACK EDGE IS ON THE LEFTMOST DESCENT, deliberately.  A chunk lookup
# descends by offset, so where the defect sits decides which reads reach it.
# That exposed a second blind spot in the canary, now fixed: the chunk sweep
# gives up above PROBE_MAX_CHUNK_SAMPLES (4096) chunks and fell back to reading
# the LAST coordinate only -- the rightmost descent.  The two thresholds
# collide by construction, so every deep-tree chunk defect landed in that
# fallback and was missed.  The probe now reads both ends.
file: malformed/chunk_btree_back_edge.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_BTREE_CYCLE]
expected_analysis:
  # The walk COMPLETES here, unlike the group twin.  The chunk-index walker
  # reports the repeat and returns, so the rest of the object graph is still
  # traversed and the decision is reached with a finished walk; the group
  # walker's rejection stops traversal where it stands.  Same finding, two
  # different traversal consequences, and the expectation records the measured
  # one rather than the neighbouring fixture's.
  complete: true
  walk_started: true
  walk_completed: true
  stop_reason: ''
  continue_after_rejection: false
  findings_truncated: false
# MEASURED 2026-11-11 with `--exercise chunk_index`: outcome=crashed, signal=11,
# violations=[crash] -> `violation`.  The control (same geometry, no back edge)
# reports accepted with data_reads=1.
#
# Declared as exactly [violation] so both drifts surface: `unexercised` would
# mean the sweep stopped reaching the leftmost descent, and `verified` would
# mean libhdf5 started accepting a cycle.
h5cve: {family: chunk_index, allowed_statuses: [violation]}
verification:
  # A node address reachable twice from one tree root, chunk-index role.
  reference_semantics_cases: [cycle]
forbidden: [crash, timeout, external_open, plugin_load, write]
