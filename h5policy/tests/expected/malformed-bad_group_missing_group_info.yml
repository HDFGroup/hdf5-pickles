# A new-style group whose Group Info message type byte is overwritten with Null,
# so a group with a link-info message carries no group-info message -- the
# missing invariant reported upstream as HDF5 issue 6616.
#
# This row exists to pin the SEVERITY, not just the detection.  libhdf5 reads
# the file without complaint: H5G__obj_info, H5G__obj_iterate and H5Gtraverse
# each guard the group-info read with H5O_msg_exists and fall back to the
# default group creation properties, so h5dump, h5ls and h5py all traverse it
# (measured).  Only the write direction breaks -- H5G__obj_insert reads the
# message unconditionally on the new-format branch and fails with "can't get
# group info", so no link can ever be added to the group.  A corruption verdict
# would refuse bytes libhdf5 opens, which is an invariant-A failure; the
# expected decision is therefore accept_with_warnings, and this row fails if the
# finding is ever promoted to `corrupt`.
file: malformed/bad_group_missing_group_info.h5
profile: untrusted-strict
expected_decision: accept_with_warnings
expected_exit: 1
required_findings: [H5_ADVISORY_GROUP_INFO_MISSING]
forbidden: [crash, timeout, external_open, plugin_load, write]
