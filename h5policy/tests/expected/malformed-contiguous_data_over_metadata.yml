# A contiguous layout whose data address points at the superblock.
#
# The SAME invariant as malformed/chunk_data_over_metadata.h5 through a different
# layout, and the plainest instance of the primitive: a contiguous dataset has no
# filter and no checksum, so nothing notices the substitution.  libhdf5 seeks to
# whatever address the layout message gives and hands the bytes back as data.
# MEASURED: h5dump exits 0 and the dataset's first two int32 values are
# 1178880137 and 169478669 -- 0x46444889 and 0x0A1A0A0D, the file's own
# "\x89HDF\r\n\x1a\n" signature.
#
# ONE FINDING, TWO FAMILIES.  H5_CORRUPT_RAW_DATA_OVERLAPS_METADATA is emitted by
# one shared check for every layout that names a raw-data extent by address, and
# those layouts live in different record families -- chunk records in
# chunk_index, contiguous in dataset_layout_filter_fill.  The code is therefore
# `ambiguous` with a route shard keyed on the role in the message, the same shape
# H5_CORRUPT_FILTER_NELMTS_MISMATCH uses.  It was briefly named
# ...CHUNK_DATA_OVERLAPS... before this caller existed; renamed rather than
# duplicated, because the invariant is one and a CHUNK_ prefix on a contiguous
# finding would be a lie.
#
# COMPACT LAYOUT HAS NO SIBLING FIXTURE AND NEEDS NONE: its data is embedded in
# the layout message payload and bounded against msg_size, so it declares no
# independent extent and cannot collide with anything.  That is a property of the
# format, not a coverage gap.
#
# Same A~ treatment as the chunk sibling, via the shared
# chunk_silent_wrong_data_only predicate: libhdf5 both opens AND reads
# successfully, so no return code carries the defect and there is no A+ evidence
# to find.
#
# The generator is self-contained rather than patched from a shared control,
# because it locates the layout message by matching the data payload and so must
# know that payload exactly.  It requires the candidate word's SUCCESSOR to equal
# the payload length before patching -- the base file contains two other words
# holding the same offset, and matching the address/size PAIR is what
# distinguishes the layout message from those decoys.
file: malformed/contiguous_data_over_metadata.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_RAW_DATA_OVERLAPS_METADATA]
expected_analysis:
  complete: true
  walk_started: true
  walk_completed: true
  continue_after_rejection: false
  findings_truncated: false
# MEASURED 2026-08-23 with `--exercise dataset_layout`: outcome=accepted,
# violations=[], family exercise 1/1 completed -> verified.  `verified` on a
# malformed fixture is the signature of a silent-wrong-data defect: the canary
# completes precisely because libhdf5 accepts the corruption and serves the
# superblock as data.
h5cve: {family: dataset_layout_filter_fill, allowed_statuses: [verified]}
forbidden: [crash, timeout, external_open, plugin_load, write]
