# The filtered Single Chunk form, aimed at the root object header.
#
# This fixture pins TWO things, and the second is why it exists separately from
# malformed/single_chunk_over_metadata.h5.
#
# 1. The data-extent rule, as for the unfiltered sibling.
#
# 2. THE ADDRESS OFFSET.  When the chunked-layout flags carry
#    H5O_LAYOUT_CHUNK_SINGLE_INDEX_WITH_FILTER (0x02), the one chunk's FILTERED
#    size and its filter mask sit in the layout message ahead of the address
#    (H5Olayout.c, case H5D_CHUNK_IDX_SINGLE).  h5policy did not read the flags
#    byte at all and assumed the address followed the index type directly, so it
#    decoded the address twelve bytes early -- out of the size field.  MEASURED
#    on valid/layout_v5_single_filtered.h5: the address read as 256 where the
#    file stores 2048.  Silent, because 256 is still inside the file, so no
#    bound complained.  A fixture that only tested the extent rule would pass
#    with the offset bug still in place, since the wrong address is in-file and
#    misses metadata.
#
# libhdf5 serves this one too -- rc=0, values decoded by the shuffle filter from
# object-header bytes -- so the disposition matches the unfiltered sibling.
file: malformed/single_chunk_filtered_over_metadata.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_RAW_DATA_OVERLAPS_METADATA]
h5cve: {family: dataset_layout_filter_fill, allowed_statuses: [verified]}
verification:
  reference_semantics_cases: [overlap]
forbidden: [accept, crash, timeout, external_open, plugin_load, write]
