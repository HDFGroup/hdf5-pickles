# A v0/v1 driver information block naming the MULTI driver whose first member-map
# byte is 7.
#
# ONE DEFECT, ISOLATED. The body is exactly the length the map implies --
# 8 + 3*16 + 3*8 = 80, since the slots select three distinct member types -- so
# the length bound cannot fire and the map value is the only thing wrong.
# Without that sizing a rejection here would prove nothing about the map check,
# because H5_CORRUPT_DRVINFO_BODY_TOO_SHORT would shadow it. Proven non-vacuous
# by reverting the map check alone: this fixture then returns
# unsupported_coverage_gap while both body-length fixtures still reject.
#
# 7 IS H5FD_MEM_NTYPES ITSELF, the first out-of-range value, so the fixture pins
# the comparison as `>=` rather than `>`. A fixture using 0xFF would pass either
# spelling and leave the boundary untested.
#
# libhdf5 validates the member type with an assert only: UNIQUE_MEMBERS_CORE
# (src/H5FDmulti.c:46-58) asserts `LOOPVAR > 0 && LOOPVAR < H5FD_MEM_NTYPES` and
# then does `SEEN[LOOPVAR]++` into a 7-element stack array. Measured on develop
# 91f1dccfc74 with an ASan + NDEBUG build, through a real split file:
# out-of-bounds stack access at src/H5FDmulti.c:785. This is a WRITE, and it is
# a different defect from the body-length fixtures -- not a variant of them.
#
# The agreement recorded below is weak for the same reason as its siblings:
# H5FD_sb_load refuses a "NCSAmult" block under sec2 before the map is read.
file: malformed/drvinfo_block_member_map_undefined.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DRVINFO_MEMBER_MAP]
forbidden_findings: [H5_CORRUPT_DRVINFO_BODY_TOO_SHORT, H5_CORRUPT_DRVINFO_BLOCK_EXTENT, H5_CORRUPT_UNSUPPORTED_DRVINFO_VERSION, H5_CORRUPT_OFFSET_OUT_OF_FILE]
h5cve:
  family: validation_controls
  require_oracle_alignment: true
  allowed_statuses: [unexercised]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
