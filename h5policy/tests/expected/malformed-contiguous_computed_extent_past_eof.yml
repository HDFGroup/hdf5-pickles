# A contiguous dataset whose STORED size is perfectly in-file while the extent
# libhdf5 actually computes runs off the end.  H5D__contig_check recomputes
# data_size = nelmts * dt_size from the dataspace and datatype and bounds only
# THAT against the raw-data EOA (H5Dcontig.c:391-411) -- it never looks at the
# size field the layout message carries.  So every stored field here is in range
# and libhdf5 still refuses the open, at H5Dcontig.c:411 "invalid dataset size,
# likely file corruption".  h5policy bounded only the stored size and accepted.
#
# Both dimension vectors are raised together: lifting only the current dimension
# above the stored maximum is a different defect
# (H5_CORRUPT_DATASPACE_DIMENSION_EXCEEDS_MAX) and would stop this fixture
# isolating the extent bound.
file: malformed/contiguous_computed_extent_past_eof.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LENGTH_OVERFLOW]
h5cve:
  family: address_space_bounds
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
