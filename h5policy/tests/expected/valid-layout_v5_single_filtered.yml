# Layout version 5 with a filtered single-chunk index: the case the version
# exists for, since v5 is what stops a filter that grows a chunk from
# overflowing the v4 chunk-size field.  The chunk's filtered byte count sits in
# the layout message at size-of-lengths width, and the index address is the
# chunk itself, so the whole filtered storage graph must validate.
file: valid/layout_v5_single_filtered.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
forbidden: [crash, timeout, external_open, plugin_load, write]
