# A chunk record whose stored size is NONZERO (3) but smaller than the fixed
# framing its own filter pipeline consumes.
#
# THE SECOND HALF OF chunk.stored_size, and the reason it needs its own fixture:
# the sibling malformed/chunk_zero_stored_size.h5 uses 0, which is invalid
# against ANY pipeline and is therefore caught inline at the record by
# h5policy_chunk_record_size_ok.  A stored size of 3 is invalid only GIVEN
# fletcher32's four-byte overhead, so it needs the pipeline message -- and object
# header messages arrive in any order, so the check cannot live in the layout
# dispatch.  It lives in h5policy_finalize_ohdr_dataset, comparing the smallest
# stored size seen during the chunk walk against the framing recorded from the
# pipeline.  Two fixtures because they are two code paths; the inline check
# cannot see this file and the finalize check would not have caught the zero one
# on an unfiltered dataset.
#
# WHY THIS FIXTURE EXISTS AT ALL: the first version of this rule tested only
# `size == 0`, and that was reported as closing the hole.  It did not.  Measured
# on the shipped build, every one of 0, 1, 2 and 3 SIGSEGVs -- fletcher32
# subtracts 4 regardless -- so the zero check closed one of four reachable
# values.  3 is the boundary value, one below the framing, which also pins the
# comparison as `< framing` rather than `<= framing`.
#
# THE OTHER SIDE OF THE BOUNDARY IS MEASURED TOO, and it is why the rule is a
# floor and not a stricter equality: a stored size of exactly 4 stays ACCEPTED.
# The subtraction yields 0, a legal empty payload, and libhdf5 then rejects the
# file cleanly on the checksum (rc=1) rather than faulting.  Sizes 4 and 5 both
# accept here and both give libhdf5 a clean rejection -- h5policy's job is to
# refuse the lengths that wrap, not to verify that the data is correct.
#
# libhdf5: opens cleanly (h5dump -H rc=0), SIGSEGV on a data read (rc=139), the
# same split as the zero sibling -- so this is an A+ soft warning rather than a
# hard A failure, and needs no tolerance and no A~ predicate.
#
# The libhdf5 defect is registry/cases/filtered-chunk-zero-stored-size.yml,
# whose "can a nonzero-but-too-small size be reached?" open question this
# fixture answers: yes, and the answer required widening the rule.
#
# Derived from valid/chunk_v1_btree_fletcher.h5, differing only in that
# four-byte size field.  The generator asserts key[0] parses to a size ABOVE the
# framing before patching, so a future base-file change cannot silently produce
# a fixture that tests nothing.
file: malformed/chunk_stored_size_below_framing.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_CHUNK_STORED_SIZE]
expected_analysis:
  complete: true
  walk_started: true
  walk_completed: true
  continue_after_rejection: false
  findings_truncated: false
h5cve: {family: chunk_index}
verification:
  # 3 is one below fletcher32's four-byte framing -- the boundary value that
  # pins the comparison as `< framing` -- and the subtraction it would feed
  # wraps, which is the memory-safety consequence the rule exists for.
  count_and_extent_boundaries: [n_minus_1]
  integer_overflow_and_allocation_budget: [integer_overflow]
forbidden: [crash, timeout, external_open, plugin_load, write]
