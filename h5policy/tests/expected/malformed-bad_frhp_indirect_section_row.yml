# The one serialized fractal-heap free section (reached from a SOHM FRHP header)
# is rewritten as a FIRST_ROW (class 1) indirect section whose start_row equals
# max_root_rows -- the first row past the doubling table's row_block_size[]
# array.  libhdf5 decodes start_row from this payload and indexes that array
# unchecked (H5HF__sect_indirect_deserialize -> H5HF__dtable_span_size,
# src/H5HFdtable.c); the structural checks there are NDEBUG-compiled-out asserts.
# The extent fields are left unchanged so the row-span violation is the only
# fault.
#
# No h5cve/allowed_statuses block: the free_space canary calls
# H5Fget_free_sections(H5FD_MEM_DEFAULT), which queries the FILE-level free-space
# manager and never loads the FRHP's internal client-0 manager where this defect
# lives, so the canary cannot judge this family -- exactly as for the
# same-base sibling bad_frhp_fsm_section_extent.  The exact-build defect is real
# (measured out-of-band: stock h5debug SIGSEGV; ASan+NDEBUG heap-buffer-overflow
# READ at H5HFdtable.c:312; and H5Fopen(RDWR)+H5Ldelete SEGV); this fixture gates
# the oracle's rejection of it.
file: malformed/bad_frhp_indirect_section_row.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FHEAP_INDIRECT_SECTION_ROW]
verification:
  # A FIRST_ROW indirect section addressing the first row past the doubling
  # table (start_row == max_root_rows).
  count_and_extent_boundaries: [n_plus_one]
forbidden: [crash, timeout, external_open, plugin_load, write]
