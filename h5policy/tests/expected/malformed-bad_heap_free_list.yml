# An old-style group's local heap free-list head points outside the heap data
# segment.  libhdf5 rejects this while initializing the local heap free list.
#
# NOTE libhdf5 rejects THIS fixture but not the whole invariant.  The related
# libhdf5 defect is recorded in
# registry/cases/local-heap-free-list-bound-wraps.yml: the bound at
# src/H5HLcache.c:258 is written as an ADDITION, `(fl->offset + fl->size) >
# heap->dblk_size`, so a node with size 2**64-1 at offset 32 wraps the sum to
# 31 and IS admitted into a 48-byte heap.  This fixture's out-of-segment head
# does not wrap, which is why libhdf5 catches it.
# The wrap witness (variant_ovf.h5) is untracked, and its consequence is
# RDWR-only -- ASan WRITE overflows in H5HL__fl_serialize and H5HL_insert via
# H5Gcreate2 -- so nothing in this read-only matrix can assert it.  See that
# record's coverage_gaps.
# Trap for anyone building the variant: H5HL_FREE_NULL is 1, not 0 or all-ones.
file: malformed/bad_heap_free_list.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings:
  - H5_CORRUPT_LOCAL_HEAP_FREE_LIST
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: heap_structures
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden:
  - crash
  - timeout
  - external_open
  - plugin_load
  - write
