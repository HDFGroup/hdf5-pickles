# An n-bit filter descriptor claiming big-endian for a little-endian datatype:
# cd_values[5] patched 0 -> 1.
#
# Same invariant as malformed/scaleoffset_byte_order_mismatch.h5 and a separate
# fixture for a specific reason: the order word sits at a DIFFERENT cd_values
# index in each filter -- [5] for n-bit, [6] for scale-offset -- so h5policy
# records it from two different offsets, and one fixture would leave one of the
# two constants unexercised.
#
# libhdf5 writes the word from H5T_get_order() (H5Znbit.c:449, :453) and, on
# read, branches on it at H5Znbit.c:1091 with the second arm guarded only by
# assert(p->order == H5Z_NBIT_ORDER_BE) at :1105 -- a no-op under -DNDEBUG.
#
# The base is the reduced-precision n-bit control (valid/nbit_reduced_precision
# .h5), not a full-precision one: at full precision H5Z__set_parms_atomic leaves
# need_not_compress set and the pipeline is a pass-through, so the parameter
# would describe work no read path does.
#
# libhdf5: opens and reads with rc=0 and different values; no crash, clean under
# AddressSanitizer.  `verified` is the expected canary status.
file: malformed/nbit_byte_order_mismatch.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FILTER_PARM_MISMATCH]
expected_finding_evidence:
  H5_CORRUPT_FILTER_PARM_MISMATCH:
    field: filter.decode_byte_order
    actual: 1
    expected: 0
    comparison: equal
h5cve: {family: dataset_layout_filter_fill, allowed_statuses: [verified]}
forbidden: [crash, timeout, external_open, plugin_load, write]
