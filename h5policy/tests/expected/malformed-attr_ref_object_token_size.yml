# An inline object reference (internal H5R_OBJECT2) in an attribute value whose
# token length, 16, overruns its element.
#
# The element is the file-determined o + 10 bytes (H5T__ref_set_loc), and
# H5T__ref_disk_getsize hands H5R__decode exactly that as the buffer size.
# H5R__decode_obj_token bounds the token length only by H5O_token_t (16), never
# by the buffer, and copies it: with 8-byte offsets 16 bytes are copied from a
# 15-byte remainder.  MEASURED on develop 6533bcc0f6a: H5Aread is an
# AddressSanitizer heap-buffer-overflow (READ of size 16); the stock build
# reads silently and keeps the over-read byte in the decoded token.
#
# The second element is the one changed; the first is an in-file control.  The
# attribute lives in a version-2 object header whose checksum the generator
# repairs, so the token length is the only defect.
# Case record: registry/cases/attribute-reference-lengths-unbounded.yml
file: malformed/attr_ref_object_token_size.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_REFERENCE_BLOB_EXTENT]
expected_finding_evidence:
  H5_CORRUPT_REFERENCE_BLOB_EXTENT:
    field: attribute.reference_token_size
    actual: 16
    expected: 15
    comparison: at_most
expected_finding_evidence_locations:
  H5_CORRUPT_REFERENCE_BLOB_EXTENT:
    - role: actual
      length: 1
h5cve:
  family: message_envelope
  # MEASURED `violation` (develop 6533bcc0f6a, 2026-10-30): the stock build reads
  # the attribute without complaint while the oracle rejects.  `unexercised` is
  # what a build that bounds the length upstream produces: the reference
  # decoder then fails cleanly (measured on a patched build for the token and
  # name lengths; the patch is in the case record).
  require_oracle_alignment: true
  allowed_statuses: [violation, unexercised]
forbidden: [crash, timeout, external_open, plugin_load, write]
