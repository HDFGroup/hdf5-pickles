# A fixed-array-indexed dataset that may still grow: no dimension is
# H5S_UNLIMITED, so libhdf5's writer picks the fixed array even though the
# maximum extent (100, 10) is larger than the current extent (10, 10).  The
# index is pre-sized from the maximum -- 20 * 2 = 40 elements for four chunks
# of data -- and the capacity cross-check must accept exactly that.  This is
# the false-positive control for
# malformed/bad_fixed_array_extent_mismatch.h5: "current != maximum" is normal,
# only "stored capacity != capacity implied by the maximum" is corrupt.
file: valid/chunk_fixed_array_maxdims.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
forbidden: [crash, timeout, external_open, plugin_load, write]
