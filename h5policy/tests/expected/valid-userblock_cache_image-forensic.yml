# The forensic counterpart of valid-userblock_cache_image. Forensic mode reads
# the cached bodies through the replay overlay, which looks each entry up by
# address; with a user block those addresses are base-relative, so a completed
# walk here is what proves the overlay resolves in the same address space the
# walk uses. Anything less than walk_completed means the lookup missed and the
# bodies were never decoded.
file: valid/userblock_cache_image.h5
profile: forensic
expected_decision: accept
expected_exit: 0
forbidden_findings: [H5_CORRUPT_UNSUPPORTED_OBJECT_HEADER_VERSION]
expected_analysis:
  complete: true
  walk_started: true
  walk_completed: true
  stop_reason: ""
  continue_after_rejection: true
  findings_truncated: false
forbidden: [crash, timeout, external_open, plugin_load, write]
