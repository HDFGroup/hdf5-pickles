# A v0/v1 driver information block that names the FAMILY driver and carries a
# single driver-specific byte, with a declared length of 1 that matches it
# exactly and an extent entirely inside the file.
#
# THE DIRECTION ITS SIBLINGS DO NOT TEST. drvinfo_block_len_past_eof claims more
# than the file holds and drvinfo_block_header_truncated cannot fit its header;
# both are caught by control.driver_info_extent, which is an UPPER bound. This
# file is internally consistent by every extent rule and is still fatal, because
# the length is below what the named driver reads unconditionally. Nothing
# bounded that end before this fixture.
#
# WHY A LENGTH CAN BE TOO SMALL AT ALL. H5FD_sb_load (src/H5FD.c:680) passes its
# VFD callback `(file, name, buf)` and no extent, so H5FD__family_sb_decode
# (src/H5FDfamily.c:602) runs an unconditional 8-byte UINT64DECODE over a body
# of 1. The cache entry it reads out of is sized 16 + len
# (src/H5Fsuper_cache.c:908) and the pointer is handed over at :951.
#
# Measured on develop 91f1dccfc74 with an ASan build: heap-buffer-overflow READ
# at src/H5FDfamily.c:602, 7 bytes past the allocation, reached through a real
# family file opened with H5Pset_fapl_family. The leaked bytes are returned as
# the member size and, when they disagree with the fapl, printed into the error
# message -- a heap pointer rendered as "Family member size should be
# 139884291365632".
#
# THE AGREEMENT BELOW IS WEAK, AND THAT IS WHY IT IS WRITTEN DOWN. Unlike
# valid/drvinfo_block.h5, this fixture MUST name a real driver -- the minimum
# exists only because libhdf5 dispatches on the name -- so H5FD_sb_load refuses
# it under sec2 with "family driver should be used" before any body byte is
# read. libhdf5 and h5policy therefore agree on the verdict for DIFFERENT
# reasons. The measured witness above, not this fixture, is what establishes the
# defect; this fixture exists to stop h5policy's bound from regressing.
file: malformed/drvinfo_block_body_short_family.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DRVINFO_BODY_TOO_SHORT]
forbidden_findings: [H5_CORRUPT_DRVINFO_BLOCK_EXTENT, H5_CORRUPT_UNSUPPORTED_DRVINFO_VERSION, H5_CORRUPT_DRVINFO_MEMBER_MAP, H5_CORRUPT_OFFSET_OUT_OF_FILE]
h5cve:
  family: validation_controls
  require_oracle_alignment: true
  allowed_statuses: [unexercised]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
