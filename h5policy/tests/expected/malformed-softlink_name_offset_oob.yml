# A SOFT LINK's symbol-table entry names a heap offset past the data segment.
# libhdf5 resolves that name through H5HL_offset_into, whose bound is a real
# error return (H5HL.c:391) and applies to every entry whatever its cache type;
# h5policy applied its own bound only to non-soft-link entries.  The offset is
# past the SEGMENT but still inside the FILE, so this tests the segment bound
# rather than a trivially out-of-file address.
file: malformed/softlink_name_offset_oob.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_HEAP_OFFSET_OUT_OF_BOUNDS]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: heap_structures
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
