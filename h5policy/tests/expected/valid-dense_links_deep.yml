# Regression guard for the recursive dense-link v2 B-tree descent: a 1000-child
# group whose name index is multiple levels deep.  Every child (including those
# whose records live in internal nodes) must be reached and accepted.
file: valid/dense_links_deep.h5
profile: untrusted-strict
# This fixture is the corpus's slowest VALID file, and untrusted-strict's
# `max_walk_seconds = 10` ("strict: fast reject") is a security property rather
# than a per-fixture tuning knob -- so raise the budget here instead of
# loosening the profile, which would slacken every rejection path in order to
# accommodate the slowest accepted one.
#
# Measured 2026-08-29: the full walk completes and accepts in 11.7s while the
# rest of run.sh loads the box, i.e. ~1.7s over the ceiling.  The case is
# therefore load-sensitive rather than wrong, and failed as
# H5_UNSUPPORTED_WALK_TIME_BUDGET / stop_reason time_budget with
# `complete: false` -- a real regression here looks different, and this
# override does not hide one: an incomplete descent still fails the expected
# decision.
#
# 20 is bounded on BOTH sides and neither number is arbitrary.  Below: 1.7x the
# measured 11.7s.  Above: _check.py kills the poke child at TIMEOUT_S = 30, so
# a budget near or past 30 would convert a clean time_budget report into an
# opaque subprocess timeout -- strictly worse to diagnose.  Keep this comfortably
# under 30 if the fixture ever grows; shrink the fixture instead if it cannot be.
profile_overrides:
  resources:
    max_walk_seconds: 20
expected_decision: accept
expected_exit: 0
required_findings: []
h5cve:
  family: btree_heap_index
  allowed_statuses: [verified]
verification:
  # A 1000-child name index several levels deep, every level of which must
  # be descended: the valid-side deep-nesting case.
  deep_nesting_and_non_progress: [deep_nesting]
forbidden: [crash, timeout, external_open, plugin_load, write]
