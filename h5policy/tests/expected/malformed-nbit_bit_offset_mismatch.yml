# An n-bit filter descriptor whose bit offset contradicts the datatype message:
# cd_values[7] patched 4 -> 0.
#
# libhdf5 writes the word from H5T_get_offset() (H5Znbit.c:482) and never
# compares it back.  0 is deliberately a value a full-width datatype would
# legitimately carry: the word is individually plausible and wrong only RELATIVE
# to the datatype message, which is the entire class of defect this rule covers.
# A fixture using an absurd offset would have been caught by a bounds rule
# instead and proved nothing about the agreement.
#
# libhdf5: opens and reads with rc=0 and different values; no crash, clean under
# AddressSanitizer.
file: malformed/nbit_bit_offset_mismatch.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FILTER_PARM_MISMATCH]
expected_finding_evidence:
  H5_CORRUPT_FILTER_PARM_MISMATCH:
    field: filter.decode_bit_offset
    actual: 0
    expected: 4
    comparison: equal
h5cve: {family: dataset_layout_filter_fill, allowed_statuses: [verified]}
forbidden: [crash, timeout, external_open, plugin_load, write]
