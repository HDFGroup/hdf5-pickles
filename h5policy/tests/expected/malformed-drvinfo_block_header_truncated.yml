# A superblock aiming its driver-info address 8 bytes before EOF, so the block's
# 16-byte header cannot fit in the file.
#
# The ADDRESS is in the file, so the bound libhdf5 gained at 2.3.0 (driver_addr
# against stored_eof, src/H5Fsuper_cache.c) does not intercept it. What runs off
# the end is the header, and libhdf5 reads it anyway: the sec2 driver ZERO-FILLS
# past EOF, so the fabricated tail decodes as a structurally valid block --
# version 0, length 0, an all-NUL driver id -- and the file opens silently. The
# eight real bytes are appended as zeros by the generator so the fabricated
# header is deterministic rather than whatever file content happened to land
# there.
#
# This is the same zero-fill that made a wild driver-info ADDRESS silently
# acceptable before 2.3.0, reached from inside the file instead of from beyond
# it. The address fix does not help, because nothing here is out of range -- the
# extent is. See registry/cases/driver-info-block-fields-unbounded.yml, whose
# sibling_audit notes that the zero-fill is a VFD property and therefore a
# general hazard, not a driver-info one.
#
# Measured: h5dump -H exits 0 and h5py opens and lists the file, so h5policy is
# the stricter side. Tracked in h5policy-diff-tolerances.yml.
file: malformed/drvinfo_block_header_truncated.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DRVINFO_BLOCK_EXTENT]
forbidden_findings: [H5_CORRUPT_UNSUPPORTED_DRVINFO_VERSION, H5_CORRUPT_OFFSET_OUT_OF_FILE]
h5cve:
  # Measured `unexercised`: this family's canary is free_space
  # (H5Fget_free_sections) and this file has no free-space managers, so the
  # canary cannot reach the defect. require_oracle_alignment is deliberately
  # ABSENT -- this fixture is known-divergent by design, and the divergence is
  # tracked in registry/h5policy-diff-tolerances.yml against the case record
  # rather than asserted here.
  family: validation_controls
  allowed_statuses: [unexercised]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
