# The client-0 FSHD reached from a SOHM fractal-heap header has one free-space
# section. Its logical heap offset is moved to the end of managed space while
# retaining its nonzero length and a valid FSSE checksum.
file: malformed/bad_frhp_fsm_section_extent.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FSM_SECTION_EXTENT]
forbidden: [crash, timeout, external_open, plugin_load, write]
