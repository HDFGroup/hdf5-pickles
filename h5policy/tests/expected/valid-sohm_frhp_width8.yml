# The VALID control for the fractal-heap doubling-table invariant: a
# shared-message heap whose table width is 8 rather than the 4 every libhdf5
# writer emits.
#
# Eight is a power of two within H5HF_WIDTH_LIMIT, so it satisfies every rule
# libhdf5's own H5HF__hdr_create states.  The fixture pins the new check to the
# format's rule instead of to that one default -- a check that rejected this
# would be over-tight -- and puts a non-default heap geometry into the fuzzer's
# seed pool, which defaults to tests/valid.
#
# The base heap must store its objects in a root DIRECT block.  An indirect root
# block's on-disk size is nrows * table_width entries, so rewriting the width
# there resizes the block and invalidates its checksum: measured on
# valid/dense_links.h5, both libhdf5 and h5policy then reject the file for the
# FHIB checksum.  Measured on this fixture: `h5dump` and `h5dump -H` both exit 0
# and read the datasets.
file: valid/sohm_frhp_width8.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
h5cve:
  family: shared_messages_legacy
  # `unexercised`, not `verified`: the shared-message canary does not reach an
  # exercised state on a list-backed SOHM file.  Measured -- every other fixture
  # that requests this canary over a list index reports the same, and the base
  # valid/sohm_list.h5 declares no family at all.  Claiming `verified` here would
  # assert coverage the probe never demonstrated.
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
