# A VALID virtual dataset whose virtual selection is a VERSION 2 serialized
# hyperslab. This is the regression guard for
# registry/cases/vds-selection-rank-oracle-false-positive.yml.
#
# WHY IT HAS TO BE BUILT RATHER THAN WRITTEN. libhdf5 chooses the selection
# version from the selection's own properties and modern writers land on
# version 3, so h5py cannot produce a version-2 selection at all. Every
# h5py-written VDS fixture in this corpus therefore exercises version 3 --
# which is why nothing here caught the defect that case records: h5policy read
# the v2 header's four-byte LENGTH field as if it were the payload, under-sized
# the selection by the whole payload, desynchronised the mapping cursor, and
# reported the NEXT selection as malformed. A valid file, rejected as corrupt,
# with the finding anchored inside a perfectly good selection.
#
# The generator re-encodes the version-3 selection of policy/vds_hyperslab.h5:
# the header shape changes (enc_size byte becomes a 4-byte length) and every
# payload field widens from enc_size bytes to 8, since v2 pins enc_size to 8.
# The UNLIMITED sentinel is converted per width rather than zero-extended --
# widening an all-ones count would turn "unlimited" into a literal 65535.
#
# MEASURED, and this is the check that matters: h5dump -H exits 0, and
# `h5dump -p -H` reports the identical mapping to the v3 base --
# START (1,0) STRIDE (1,1) COUNT (1,1) BLOCK (2,6). libhdf5 accepts the
# hand-built encoding and decodes it to the same selection, so the fixture is a
# real version-2 file and not merely a structurally plausible one.
file: policy/vds_selection_v2.h5
profile: legacy
expected_decision: accept_with_warnings
expected_exit: 1
required_findings: [H5_ADVISORY_VDS_ABSOLUTE_SOURCE]
forbidden_findings: [H5_CORRUPT_SELECTION, H5_CORRUPT_SELECTION_RANK, H5_CORRUPT_SELECTION_ENC_SIZE, H5_CORRUPT_SELECTION_FLAGS, H5_CORRUPT_BAD_CHECKSUM, H5_CORRUPT_VDS_MAPPING_TRAILING_BYTES]
h5cve: {family: virtual_dataset, allowed_statuses: [verified]}
forbidden: [accept, reject_corrupt, external_open, plugin_load, write, crash, timeout]
