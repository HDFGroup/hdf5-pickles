# An external-file-list slot's external offset is patched so offset plus segment
# size wraps uint64.  Even trusted-fast must reject the malformed extent before
# an external file is opened or the wrapped range is used.
file: malformed/overflowing_efl_segment.h5
profile: trusted-fast
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_EXTERNAL_FILE_LIST_SEGMENT_OVERFLOW]
# The external_file_list canary specimen: it reaches deepest into the family
# surface of the five EFL fixtures (12 entry points).
#
# CORRECTED 2026-08-24.  This comment used to claim that "libhdf5 rejects it in
# traversal with no external_open violation -- efl.no_external_open holds on the
# rejection path".  That claim was an artifact of WHICH ELEMENT the canary read.
# Its fallback selection was a single point at the origin; now that it selects
# the last element instead (see the note in h5policy/tools/probe/h5probe.c), the
# same read reaches the slot whose offset plus segment size wraps, and libhdf5
# OPENS the external file -- external_open count 1, path "payload.raw" -- before
# rejecting the extent.  MEASURED on the selected build, and specific to this
# fixture: the other four EFL specimens still report external_open 0.
#
# So the property that holds is narrower than the one recorded: libhdf5 rejects
# the wrapped extent, but not before touching the file the extent names.  The
# allowance is reasoned in registry/h5cve-matrix-policy.yml and the divergence
# is filed, uninvestigated, in
# registry/cases/efl-external-open-before-segment-validation.yml.  h5policy's
# own boundary is unaffected -- it opens nothing, which is what `forbidden`
# below asserts.
h5cve:
  family: external_file_list
  require_oracle_alignment: true
verification:
  # The slot's external offset plus its segment size wraps uint64.
  integer_overflow_and_allocation_budget: [integer_overflow]
forbidden: [crash, timeout, external_open, plugin_load, write]
