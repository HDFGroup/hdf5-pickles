# A fixed-array chunk index whose stored capacity no longer matches the
# dataspace maximum extent it was sized from.  One inflated `Dim Max` field --
# {10, 10} -> {867583393802, 10} -- leaves the FAHD header, the chunk
# addresses, and the data consistent, so libhdf5 opens and reads the file; the
# capacity it recomputes from the file's own bytes is only used when something
# rebuilds the index, and then h5repack (H5Ocopy) aborts in the metadata cache.
file: malformed/bad_fixed_array_extent_mismatch.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FIXED_ARRAY_EXTENT_MISMATCH]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: chunk_index
  # The chunk_index canary (H5Dopen/H5Dread) reaches the family and completes:
  # reading a dataset never rebuilds its index, so libhdf5 accepts what
  # h5policy rejects and the row is `verified` with oracle_alignment:
  # divergent.  `verified` means the CANARY ran, not that libhdf5 is safe --
  # the defect is on the copy path, where the same file aborts the process.
  # See registry/cases/fixed-array-extent-mismatch.yml.
  allowed_statuses: [verified, violation]
forbidden: [crash, timeout, external_open, plugin_load, write]
