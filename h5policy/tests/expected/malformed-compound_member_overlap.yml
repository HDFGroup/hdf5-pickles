# Two compound members whose byte extents overlap.
#
# Members must occupy disjoint bytes of the parent element.  libhdf5 tests this
# pairwise while decoding the datatype and refuses outright -- its own comment
# says an overlap "probably indicates that the file is corrupt"
# (H5Odtype.c:594-610).  So a file failing it is one no reader can use at all:
# measured, h5dump exits 1 for BOTH `-H` and a data read, because the failure is
# in datatype decode and nothing downstream happens.
#
# A COMPLETENESS GAP, not a safety one, and worth being clear about the
# difference.  Nothing crashes and no wrong data is served -- libhdf5 declines
# the file.  h5policy accepted it, which made the oracle *less* strict than the
# library it fronts, on metadata no reader accepts.  That is the whole defect.
# It came out of triaging the corpus sweep's eleven "h5policy accepts, libhdf5
# returns rc=1" files; three of the eleven shared this cause, the largest cluster.
#
# CONSEQUENTLY THERE IS NO DIVERGENCE TO CARRY: libhdf5 does not open the file,
# so invariant A is satisfied and the differential reports
#   PASS A' libhdf5 rejects => explicit rejection (got reject_corrupt)
# with no tolerance and no A~ predicate.  Contrast the silent-wrong-data family
# (RAW_DATA_OVERLAPS_*, CHUNK_KEY_ORDER), where libhdf5 succeeds and the
# divergence must be named explicitly.
#
# THE SECOND MEMBER'S OFFSET IS MOVED BACK ONTO THE FIRST, rather than its size
# grown.  Both members stay inside the parent element, so the pre-existing
# datatype.compound_member_bounds rule remains satisfied and disjointness is the
# only rule broken -- otherwise the older check would catch the fixture and it
# would prove nothing about the new one.
#
# COST NOTE, because the member count is a 16-bit attacker-controlled field: the
# check is guarded by a high-water mark, exactly as libhdf5 guards its own loop.
# A member starting at or after every previous member's end cannot overlap
# anything, so the ordered layout every writer emits costs O(1) per member and
# never scans; only an out-of-order member pays the linear scan, and the recorded
# set is capped at 4,096 intervals.
#
# One soft WARN is expected and is not a gap: "h5debug rc=0 vs h5py structural
# open=False".  h5debug reads the superblock and stops, and the superblock here is
# untouched -- the tool does less work, it does not disagree about the bytes.
file: malformed/compound_member_overlap.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_OVERLAP]
expected_analysis:
  complete: true
  walk_started: true
  walk_completed: true
  continue_after_rejection: false
  findings_truncated: false
# MEASURED 2026-08-23 with `--exercise datatype`: outcome=rejected_in_traversal,
# violations=[], family exercise 0/1 completed -> unexercised.  `unexercised` is
# the honest status and not a pass: libhdf5 opens the file but the datatype
# exercise never completes, because decoding the datatype is what fails.
# Declared as exactly [unexercised] so a drift to `verified` -- libhdf5 accepting
# an overlap it currently refuses -- surfaces instead of passing quietly.
h5cve: {family: datatypes, allowed_statuses: [unexercised]}
forbidden: [crash, timeout, external_open, plugin_load, write]
