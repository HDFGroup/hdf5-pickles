# An unknown object-header message ID (0x30) carrying FAIL_IF_UNKNOWN_ALWAYS.
#
# Unknown IDs are the object header's forward-compatibility mechanism, not
# corruption: H5O__chunk_deserialize points any ID at or above H5O_UNKNOWN_ID
# (0x18) at the "unknown" message class and carries on.  Two message flags
# withdraw that permission, and they are not equivalent (H5Ocache.c):
#
#   H5O_MSG_FLAG_FAIL_IF_UNKNOWN_ALWAYS             0x80  reject unconditionally
#   H5O_MSG_FLAG_FAIL_IF_UNKNOWN_AND_OPEN_FOR_WRITE 0x08  reject only if RDWR
#
# h5policy opens read-only, so 0x80 is exactly the set of headers libhdf5 will
# not load for it.  h5policy previously keyed the corrupt/skippable split on
# 0x08 -- the wrong bit, in both directions: it called a plain unknown message
# corrupt (a false positive against invariant A, see
# policy/unknown_message_skippable.h5) while letting 0x88 through as a
# *relaxable* policy finding for a header libhdf5 refuses outright.  This
# fixture is the A' half of that pair.
#
# The message is the root header's trailing NIL message with its type and flag
# bytes rewritten: a NIL message has no payload semantics, so its body can stand
# in for a message no reader will decode, and nothing in the header moves.  The
# v2 object-header checksum is re-sealed so a checksum mismatch cannot stand in
# for the two bytes under test.
file: malformed/bad_unknown_message_fail_always.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_OBJECT_HEADER_MESSAGE_TYPE_RANGE]
expected_finding_evidence:
  H5_CORRUPT_OBJECT_HEADER_MESSAGE_TYPE_RANGE:
    field: object_header.message_type
    actual: 48
    expected: 24
    comparison: less_than_or_equal
expected_finding_evidence_locations:
  H5_CORRUPT_OBJECT_HEADER_MESSAGE_TYPE_RANGE:
    - role: actual
      length: 1
      little_endian_value: 48
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
