# An attribute vlen sequence length larger than the global-heap object holding
# its data.
#
# libhdf5 sizes the destination from the stored length and copies the heap
# object into it, so a length exceeding the object over-reads the collection.
# The address and index are left valid, which is what makes this case distinct
# from its siblings: the ID resolves, and only the count beside it is wrong.
#
# The bound the oracle states is the object's BYTE size, not its element count.
# A vlen's encoded datatype size is 4 + H5HG_HEAP_ID_SIZE(f) whatever it is a
# sequence OF, and the base type is a nested datatype message the attribute
# validator does not decode -- so the byte size is the base-size-one case and
# therefore the weakest sound form.  Any real base size only makes the true
# limit smaller, so the bound cannot produce a false positive; it is
# deliberately incomplete for base sizes above one byte.  The fixture declares
# 2^32-1 so it violates even that weakest form unambiguously.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
file: malformed/attr_vlen_heap_seq_len_over.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_ATTRIBUTE_HEAP_ID_LENGTH]
expected_finding_evidence:
  H5_CORRUPT_ATTRIBUTE_HEAP_ID_LENGTH:
    field: attribute.heap_sequence_length
    actual: 4294967295
    comparison: at_most
h5cve:
  # Family named mechanically from the primary finding via registry/findings/;
  # the global-heap codes are ambiguous and route on the message's role prefix,
  # so an attribute-borne ID resolves to message_envelope rather than to the
  # VDS family that shares the walker.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
