# The OTHER upstream door to the same rule: a VERSION 1 layout message declaring
# the virtual class.  Versions 1 and 2 take their own decode block in libhdf5,
# which permits only contiguous, chunked and compact, so this fails at
# H5Olayout.c:123 ("bad layout type for layout message") -- a different message
# from the version-3 case, same verdict, and one h5policy predicate covers both.
# REGIME THE CORPUS CANNOT OTHERWISE EXPRESS: h5py writes layout version 3 even
# at libver="earliest", so no h5py call produces a v1/v2 layout message and this
# branch of the predicate would otherwise be untested; the message is re-emitted
# by hand in the v1 shape, 20 bytes inside the 24 the v3 message occupied.
file: malformed/layout_virtual_version_v1.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_LAYOUT_VIRTUAL_VERSION]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: dataset_layout_filter_fill
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
