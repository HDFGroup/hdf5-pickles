# A dense-link doubling table whose first row is exactly one bit too wide: 10
# declared heap-size bits against an 11-bit first row (start 512, width 4).
#
# max_root_rows = (max_heap_size_bits - first_row_bits) + 1 is then exactly
# zero, so H5HF__dtable_init allocates all four row arrays with
# H5MM_malloc(0) -- a bare malloc -- and stores row_block_size[0] and
# row_block_off[0] unconditionally, before the `u < max_root_rows` loop that
# would have bounded them.  That is an eight-byte out-of-bounds WRITE per array,
# reproduced under AddressSanitizer on the transcribed arithmetic
# ("WRITE of size 8, 0 bytes after 1-byte region").  glibc's malloc(0) leaves
# usable slack, so the write is absorbed and libhdf5 fails later on the heap
# geometry instead of on the memory error -- the reason this shape needs an
# oracle rather than a crash test.
#
# Sibling of malformed/dense_link_frhp_first_row_overflow.h5: same rule, one
# more bit, and a 32 GiB allocation instead of a zero-length one.
file: malformed/dense_link_frhp_no_root_rows.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_FRACTAL_HEAP_DOUBLING_TABLE]
h5cve:
  family: dense_index
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
verification:
  # The first row is exactly one bit too wide for the declared heap size,
  # so this is the boundary one step past the legal maximum.
  count_and_extent_boundaries: [n_plus_one]
forbidden: [crash, timeout, external_open, plugin_load, write]
