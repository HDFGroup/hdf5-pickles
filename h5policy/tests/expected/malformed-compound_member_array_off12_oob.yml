# The v1 embedded-array promotion defect in its REACHABLE geometry, and the only
# fixture in the family whose libhdf5 consequence has been measured as a
# memory-safety event rather than an acceptance divergence.
#
# The three siblings next to it put an enormous or wrapped member at offset 0.
# That is the right shape for testing the ARITHMETIC and the wrong shape for
# reaching the consumer: a promoted size that wraps to something small cannot be
# caught by a bounds check, because small means in bounds -- and for the same
# reason it cannot read out of bounds either.  The dangerous geometry needs a
# NONZERO offset, so a modest promoted size still ends past the element.
#
# Here the element is 16 bytes and the single member "a" sits at offset 12 with a
# [2] array of H5T_STD_U32LE behind it: promoted footprint 8 bytes, ending at 20.
# libhdf5's guards at H5Odtype.c:507 (zero-size) and :509 (member bounds) both
# test the 4-byte BASE type, and H5T__array_create promotes it to 8 bytes at :542
# with neither guard re-running -- so the file is ACCEPTED.  H5T__conv_struct_opt
# (H5Tconv_compound.c:868) then reads the member at its promoted size during
# H5Dread, whenever the memory type differs from the file type: ASAN
# heap-buffer-overflow READ of size 8, 0 bytes after a 16-byte region.
#
# Deliberately width-INDEPENDENT, unlike its wrap-driven neighbours: dims [2]
# give 8 bytes at both 32-bit and 64-bit, so this fixture reproduces the same way
# everywhere and isolates the GUARD-ORDERING half of the defect from the
# arithmetic half.  compound_member_array_nelem_overflow.h5 is the arithmetic
# half; both are needed, because a checked multiply alone still accepts this file
# and a re-ordered guard alone still lets the product wrap.
#
# The libhdf5 defect is recorded in
# registry/cases/compound-member-array-promotion-unguarded.yml.  Promoted from
# variant_off12_reachable.h5 in the seed-40f5826c bundle, which was the single
# most valuable untracked artifact in that family.
#
# MEASURED 2026-09-01, and the block below is what the measurement says.
#
# The open question was whether the probe's datatype exercise drives a
# CONVERTING H5Dread, because only a converting read reaches the fault.  It does
# not: exercise_dataset_io in h5policy/tools/probe/h5probe.c (:343 at the time of
# writing) calls H5Dread(dset, dtype, ...) with the memory type EQUAL
# to the file type, into calloc(nsel, H5Tget_size(dtype)).  For this fixture that
# is a non-converting 16-byte read, and the member's promoted extent is never
# touched.  Measured on three builds -- stock, ASan/NDEBUG and ASan with asserts
# live -- all report outcome=accepted with zero violations and no sanitizer
# report, the full datatype canary completing with H5Dread called and succeeding.
# So the canary's own status is `verified`, not `violation`.
#
# The recorded ASan heap-buffer-overflow is still real, and the precondition it
# needs is now known: the type-conversion buffer must be one element wide.
# libhdf5 allocates it at max_temp_buf (H5D_TEMP_BUF_SIZE, 1 MiB by default --
# H5Dio.c:1435-1461), so an 8-byte member ending 4 bytes past its 16-byte element
# overruns the ELEMENT while staying deep inside the ALLOCATION, reading that
# buffer's own zeros.  Capping the buffer with H5Pset_buffer(16) -- the smallest
# value libhdf5 accepts here, and one a memory-constrained reader would plausibly
# set -- reproduces the recorded report exactly: heap-buffer-overflow READ of
# size 8 at H5Tconv_compound.c:868, 0 bytes after a 16-byte region.  With default
# transfer properties both ASan builds return a clean rc=0.
#
# `allowed_statuses: [violation]` therefore, matching the three siblings libhdf5
# ACCEPTS -- not the `[unexercised, verified]` of compound_member_offset_oob.h5,
# which is the one fixture in the family libhdf5 turns away in traversal.  The
# `violation` here comes from `require_oracle_alignment` against an ACCEPTANCE
# divergence, not from a fault the canary saw; the fault is out of the probe's
# reach by construction.  Widening the probe to a second, converting read would
# change that, and is a probe change rather than a fixture one.
file: malformed/compound_member_array_off12_oob.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: datatypes
  require_oracle_alignment: true
  allowed_statuses: [violation]
forbidden: [crash, timeout, external_open, plugin_load, write]
