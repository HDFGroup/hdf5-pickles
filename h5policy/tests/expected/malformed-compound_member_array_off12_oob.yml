# The v1 embedded-array promotion defect in its REACHABLE geometry, and the only
# fixture in the family whose libhdf5 consequence has been measured as a
# memory-safety event rather than an acceptance divergence.
#
# The three siblings next to it put an enormous or wrapped member at offset 0.
# That is the right shape for testing the ARITHMETIC and the wrong shape for
# reaching the consumer: a promoted size that wraps to something small cannot be
# caught by a bounds check, because small means in bounds -- and for the same
# reason it cannot read out of bounds either.  The dangerous geometry needs a
# NONZERO offset, so a modest promoted size still ends past the element.
#
# Here the element is 16 bytes and the single member "a" sits at offset 12 with a
# [2] array of H5T_STD_U32LE behind it: promoted footprint 8 bytes, ending at 20.
# libhdf5's guards at H5Odtype.c:507 (zero-size) and :509 (member bounds) both
# test the 4-byte BASE type, and H5T__array_create promotes it to 8 bytes at :542
# with neither guard re-running -- so the file is ACCEPTED.  H5T__conv_struct_opt
# (H5Tconv_compound.c:868) then reads the member at its promoted size during
# H5Dread, whenever the memory type differs from the file type: ASAN
# heap-buffer-overflow READ of size 8, 0 bytes after a 16-byte region.
#
# Deliberately width-INDEPENDENT, unlike its wrap-driven neighbours: dims [2]
# give 8 bytes at both 32-bit and 64-bit, so this fixture reproduces the same way
# everywhere and isolates the GUARD-ORDERING half of the defect from the
# arithmetic half.  compound_member_array_nelem_overflow.h5 is the arithmetic
# half; both are needed, because a checked multiply alone still accepts this file
# and a re-ordered guard alone still lets the product wrap.
#
# The libhdf5 defect is recorded in
# registry/cases/compound-member-array-promotion-unguarded.yml.  Promoted from
# variant_off12_reachable.h5 in the seed-40f5826c bundle, which was the single
# most valuable untracked artifact in that family.
#
# NO h5cve BLOCK YET, deliberately.  The siblings carry
# `allowed_statuses: [unexercised, verified]` because libhdf5 accepts them
# without faulting.  This fixture is the one where a fault IS reachable -- but
# only through a converting H5Dread, and whether the probe's datatype exercise
# drives a differing memory type has NOT been measured here.  If it does, the
# canary is `violation`, not `verified`, and guessing would either mask a real
# violation or fail the matrix for the wrong reason.  Measure with
# h5policy-probe --exercise datatype against the stock and ASan builds, then add
# the block that matches.  The record's coverage_gaps tracks the same item.
file: malformed/compound_member_array_off12_oob.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DATATYPE_COMPOUND_MEMBER_BOUNDS]
forbidden: [crash, timeout, external_open, plugin_load, write]
