# The control for the attribute global-heap-ID invariants.
#
# An attribute's VALUE is stored inside its object-header message, so a vlen or
# legacy-region-reference attribute holds its global-heap ID in METADATA.  That
# is the distinction the checks turn on: a DATASET's descriptors are raw payload
# and stay outside this oracle's boundary, an attribute's do not.  Until these
# rules landed the value region was located and measured but never read, so
# every field of the ID -- collection address, object index, sequence length --
# was unbounded.
#
# This fixture carries both encodings, because their strides differ and a
# control holding only one would leave the other untested:
#
#   "vl"  class 9        length(4) | collection address(8) | object index(4)
#   "reg" class 7 type 1 collection address(8) | object index(4)
#
# Its whole job is to be ACCEPTED while the walker resolves both IDs against a
# real collection.  Verified non-vacuous: patching either descriptor's object
# index to a value the collection does not hold turns this file into
# reject_corrupt / H5_CORRUPT_HEAP_OBJECT_MISSING, so neither stride is being
# skipped.  Without that, a rule that returned early would pass the suite while
# validating nothing.
#
# h5dump -A exits 0 on both the baseline and the sanitizer build.
#
# Case record: registry/cases/attribute-heap-id-unvalidated.yml
file: valid/attr_heap_ids.h5
profile: untrusted-strict
expected_decision: accept
expected_exit: 0
required_findings: []
h5cve:
  # A valid file states intent rather than an observation: the attribute
  # canary has not been measured as reaching `verified` for this family.
  family: message_envelope
  allowed_statuses: [unexercised, verified]
forbidden: [crash, timeout, external_open, plugin_load, write]
