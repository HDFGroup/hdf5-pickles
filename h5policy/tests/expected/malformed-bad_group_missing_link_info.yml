# A new-style group whose Link Info message type byte is overwritten with Null,
# so the header keeps its group-info and compact link messages but no longer
# says where its links live.
#
# libhdf5 chooses the group format by asking whether the link-info message
# exists (H5G__obj_get_linfo).  Without it, lookup, iteration and info all take
# the old-format branch and read the symbol-table message, which is not there
# either: h5dump reports an internal error, h5ls prints **NOT FOUND**, and
# h5py's visit raises "unable to determine object type".  h5policy accepted the
# file -- exit 0, zero findings -- until the finalize-time link-storage check,
# so this row is the guard for an invariant-A' false accept.
file: malformed/bad_group_missing_link_info.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_GROUP_MISSING_LINK_STORAGE]
h5cve:
  # Family named mechanically from the primary finding via registry/findings/.
  family: message_envelope
  require_oracle_alignment: true
  allowed_statuses: [unexercised, verified]
forbidden: [accept, crash, timeout, external_open, plugin_load, write]
