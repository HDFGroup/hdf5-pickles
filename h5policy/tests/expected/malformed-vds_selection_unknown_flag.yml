# A serialized hyperslab selection whose flags byte is 0x03.
#
# H5S_SELECT_FLAG_BITS is H5S_HYPER_REGULAR (0x01) alone (src/H5Spkg.h), and
# libhdf5 refuses any bit outside it: `if (flags & ~H5S_SELECT_FLAG_BITS)`,
# "unknown flag for selection". Hyperslab versions 2 and 3 only -- version 1 has
# no flags byte, and point selections have none at any version.
#
# 0x03 rather than 0x02 deliberately: bit 0x01 selects between the regular and
# the block-list payload encodings, so clearing it would change what the rest of
# the selection means and the fixture would be testing two things at once. With
# 0x01 kept set the payload stays a valid regular hyperslab and the unknown
# neighbour bit is the only defect.
#
# Measured: h5dump -H exits 1, agreement, no tolerance needed.
file: malformed/vds_selection_unknown_flag.h5
profile: legacy
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_SELECTION_FLAGS]
forbidden_findings: [H5_CORRUPT_SELECTION, H5_CORRUPT_BAD_CHECKSUM, H5_CORRUPT_VDS_MAPPING_TRAILING_BYTES]
h5cve: {family: virtual_dataset, allowed_statuses: [unexercised]}
forbidden: [accept, unsupported_coverage_gap, external_open, plugin_load, write, crash, timeout]
