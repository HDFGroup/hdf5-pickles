# A v0/v1 driver information block naming the MULTI driver whose body stops
# after the 6-byte member map plus its 2 bytes of padding.
#
# THE REGIME ITS FAMILY SIBLING CANNOT EXPRESS. Eight bytes clears the flat
# floor both drivers share, so this file can only be rejected by computing the
# multi-specific minimum FROM THE MAP IT CARRIES: 8 + nseen*16 + nseen*8, which
# is 56 for the two members this map selects. A bound that checked only the
# floor would accept it, and the `memcpy(x, buf, nseen*2*8)` at
# src/H5FDmulti.c:793 would still copy 32 bytes past the body. Proven
# non-vacuous by reverting the nseen-derived minimum alone, with the floor left
# in place: this fixture then returns unsupported_coverage_gap while its family
# sibling still rejects.
#
# The map is taken from a file written by H5Pset_fapl_split rather than
# invented, because the expected minimum is derived from its unique-member
# count; a two-member split file encodes exactly 8 + 2*16 + 2*8 = 56 bytes.
#
# Measured on develop 91f1dccfc74 with an ASan build, through a real split file:
# heap-buffer-overflow READ at src/H5FDmulti.c:780 -- the member-map read, which
# is EARLIER than the memcpy usually cited. The stock RelWithDebInfo build does
# not crash and does not complain: it opens the file, having taken out-of-bounds
# heap bytes as its member map.
#
# The agreement recorded below is weak for the same reason as the family
# sibling: H5FD_sb_load refuses a "NCSAmult" block under sec2 with "multi driver
# should be used" before reading any body byte.
file: malformed/drvinfo_block_body_short_multi.h5
profile: untrusted-strict
expected_decision: reject_corrupt
expected_exit: 2
required_findings: [H5_CORRUPT_DRVINFO_BODY_TOO_SHORT]
forbidden_findings: [H5_CORRUPT_DRVINFO_BLOCK_EXTENT, H5_CORRUPT_UNSUPPORTED_DRVINFO_VERSION, H5_CORRUPT_DRVINFO_MEMBER_MAP, H5_CORRUPT_OFFSET_OUT_OF_FILE]
h5cve:
  family: validation_controls
  require_oracle_alignment: true
  allowed_statuses: [unexercised]
forbidden: [accept, unsupported_coverage_gap, crash, timeout, external_open, plugin_load, write]
