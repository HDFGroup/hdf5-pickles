pickle: ref_enc.pk
section: "VIII.C-D. Reference Encoding"
upstream:
  version: "4.0"
  sections: [VIII.C, VIII.D]
  anchor: subsec_fmt4_appendixd_encoderv
coverage: covered
intro: |
  This pickle decodes the on-disk elements of HDF5 reference datasets and
  attributes. Two families are covered.

  **Revised references (Section VIII.C)** — one element of an
  `H5T_STD_REF` dataset, the reference type introduced in HDF5 1.12. Every
  element shares a fixed size and a 2-byte common header (`ref_enc_hdr`:
  reference type and flags). There are two sub-formats: an internal
  `H5R_OBJECT2` reference stores its object token directly in the element,
  while all other kinds (dataset-region, attribute, or external object
  references) store a blob in the global heap and keep only the blob size
  and the global heap ID in the element. `ref_enc_block` covers both cases
  via conditional fields; its `_print` follows the heap and decodes the
  blob (token, optional external filename, dataspace selection, or
  attribute name).

  **Backward-compatible references (Section VIII.D)** — the older
  `H5T_STD_REF_OBJ` and `H5T_STD_REF_DSETREG` element formats.
  `ref_enc_obj1_block` is a bare file address; `ref_enc_region1_block` is a
  global heap ID whose heap object holds the dataset address and a
  serialized selection.

  Serialized dataspace selections use the same wire format as `dspace_enc`
  / `vds`.

  The decoder accepts only the source-supported revised reference kinds
  (plus the null form), caps inline token widths at the library's
  16-byte token maximum, and—after a superblock has been mapped—checks
  object and global-heap addresses against the declared EOF. A non-null
  blob reference must hold at least the reference header and token-length
  byte and name a nonzero global-heap object index; index 0 is heap free
  space. When a blob is followed, its declared size must exactly match the
  selected heap object's unpadded data size, and token, string, and
  selection fields are bounded by that size. A legacy region reference also
  checks its resolved dataset address against the declared EOF. It validates
  reachability bounds, not the target object's type or identity.

  All fields are stored in little-endian byte order.

layouts:
  - title: "Revised Reference Element"
    type: ref_enc_block
    rows:
      - ["Reference Type", "Flags", {label: "Token or Blob Descriptor", span: 2}]
      - [{label: "Token or Blob Descriptor (continued)", span: 4}]
      - [{label: "Padding to Fixed Element Size", span: 4}]
    note: "An internal object reference contains a token of width `O`; other references contain a 4-byte blob size, a global heap address of width `O`, and a 4-byte heap index. `O` is the size of offsets."
  - title: "Backward-compatible Dataset-region Reference"
    type: ref_enc_region1_block
    rows:
      - [{label: "Global Heap Collection Address", span: 4, width: O}]
      - [{label: "Global Heap Object Index", span: 4}]
    note: "`O` is the size of offsets."

types:

  ref_enc_hdr:
    title: Reference Header
    desc: >-
      2-byte common header at the start of every revised (`H5T_STD_REF`)
      reference element. Shared by the direct and blob sub-formats.
    fields:
      ref_type:
        desc: >-
          Reference type: 2 = `H5R_OBJECT2`, 3 = `H5R_DATASET_REGION2`,
          4 = `H5R_ATTR`.
      flags:
        desc: >-
          Reference flags. Bit 0 (`H5R_IS_EXTERNAL`) is set when the
          reference targets an object in an external file.

  ref_enc_block:
    title: Revised Reference Block
    desc: >-
      Complete on-disk revised (`H5T_STD_REF`) reference element. Embeds
      `ref_enc_hdr`, then, depending on type and flags, either the inline
      object token (internal `H5R_OBJECT2`) or the blob descriptor
      (blob size plus global heap ID) for all other references.
    fields:
      hdr:
        desc: "Embedded `ref_enc_hdr` (reference type and flags)."
      token_size:
        desc: >-
          Number of valid bytes in the inline object token. Present only
          for an internal `H5R_OBJECT2` reference.
        note: optional
      token:
        desc: >-
          Opaque object token (`sizeof_offsets` bytes). Present only for an
          internal `H5R_OBJECT2` reference.
        note: optional
      blob_size_raw:
        desc: >-
          Byte count of the reference blob stored in the global heap
          (4-byte unsigned integer). Present for all blob-format
          references.
        note: >-
          Optional for direct references. A non-null blob must contain at
          least the 2-byte reference header and 1-byte token length, and its
          declared size must match the selected heap object's data size.
      heap_addr_raw:
        desc: >-
          File address of the global heap collection holding the reference
          blob (`sizeof_offsets` bytes). Present for all blob-format
          references.
        note: optional
      heap_idx_raw:
        desc: >-
          Object index of the blob within that collection (4-byte unsigned
          integer). Present for all blob-format references.
        note: >-
          Optional for direct references. Non-null blobs use a nonzero index;
          index 0 is the global heap's free-space sentinel.

  ref_enc_obj1_block:
    title: Backward-compatible Object Reference
    anchor: subsec_fmt4_appendixd_encodedp
    desc: >-
      Backward-compatible object reference element (`H5R_OBJECT1`,
      Section VIII.D). A bare raw file address of the referenced object.
      Element size is `sizeof_offsets` bytes.
    fields:
      addr_raw:
        desc: >-
          Raw file address of the referenced object (`sizeof_offsets`
          bytes).

  ref_enc_region1_block:
    title: Backward-compatible Dataset-region Reference
    desc: >-
      Backward-compatible dataset-region reference element
      (`H5R_DATASET_REGION1`, Section VIII.D). A global heap ID; the heap
      object holds the dataset's file address followed by a serialized
      selection. Element size is `sizeof_offsets + 4` bytes.
    fields:
      heap_addr_raw:
        desc: >-
          File address of the global heap collection holding the region
          data (`sizeof_offsets` bytes).
      heap_idx_raw:
        desc: >-
          Object index of the region data within that collection (4-byte
          unsigned integer). Must be nonzero because index 0 is free space,
          not a readable heap object.
